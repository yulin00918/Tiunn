t"></div></section><div id="officialModal"></div><p class="note">點選任一段即可播放該段。節氣標示只協助看懂文章脈絡，不改寫原課文。</p><div class="credit">網站介面與教學整合設計／製作：張鈺聆</div></div><audio id="audio"></audio><script>
const A='audio/kangxuan-b2-l2/';
const segs=[
['🌱 立春',`「看天食飯」對作田人來講，絕對有無仝款的感受。年節過無偌久，差不多是立春的時陣，猶閣淡薄仔涼冷，作田人就愛開始無閒矣。<br><br>犁田、淹水了後，秧仔佈落去田底，若親像共希望寄託佇土地頂頭。閣來就賰用心的照顧佮向望天公伯仔的疼痛。`],
['⚡ 驚蟄 → ☀️ 立夏',`聽講驚蟄彼工若有霆雷公，這季就有好收成，阿爸講這就較無定著。毋過若是稻仔當咧弄花的時，就真正愛向望天公伯仔毋通落大雨。若無稻仔會冇去，就無通收成矣。<br><br>立夏左右，天氣就沓沓仔對秋凊轉翕熱，病蟲害就濟矣，嘛是作田人上滾絞的時陣，若顧無好，這季的收成就烏有去。`],
['🌾 夏至・收成',`夏至左右，就是稻仔收成的時陣，田裡的稻仔若披一領金仔色的衫，佇咧共作田人呵咾佮喝咻。<br><br>稻仔割了愛去稻埕曝，一粒一粒猶未焦燥的粟仔對布袋仔底輾出來，袂輸若佇咧走相逐。空氣中有陣陣的清芳，共稻草的芳味佮土地的陪伴做伙透濫，跟綴阿爸佇田頭燒香的感謝，予早冬的種作有一个歡喜的結果。`]
];

</script><script id="official-vocab-module">const OFFICIAL_VOCAB=[["立春", "li̍p-tshun", "國曆二月三、四或五日。這一天是春季的開始。"], ["賰", "tshun", "剩餘。"], ["驚蟄", "kenn-ti̍t", "國曆三月五、六或七日。乃春雷響，驚動冬眠動物的時候。"], ["弄花", "lāng-hue", "指授粉的階段。"], ["冇去", "phànn--khì", "結構不扎實。本課指穀子裡面沒有米粒。"], ["立夏", "li̍p-hē", "國曆五月五、六或七日。這一天是夏季的開始。"], ["滾絞", "kún-ká", "翻騰、掙扎、滾動、扭絞。"], ["夏至", "hē-tsì", "國曆六月廿、廿一或廿二日。這天晝最長夜最短。"], ["透濫", "thàu-lām", "參雜混合。"]];const VS=OFFICIAL_VOCAB.map((v,i)=>({w:v[0],i})).sort((a,b)=>b.w.length-a.w.length);function markV(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.nodeValue.trim()||n.parentElement.closest('script,style,button,.vocabBox,.modal'))return NodeFilter.FILTER_REJECT;return VS.some(v=>n.nodeValue.includes(v.w))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}}),ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{let s=n.nodeValue,f=document.createDocumentFragment(),p=0;while(p<s.length){let h=null,a=s.length;for(const v of VS){let j=s.indexOf(v.w,p);if(j>=0&&(j<a||(j===a&&(!h||v.w.length>h.w.length)))){h=v;a=j}}if(!h){f.append(s.slice(p));break}if(a>p)f.append(s.slice(p,a));let x=document.createElement('span');x.className='vw';x.dataset.v=h.i;x.textContent=h.w;f.append(x);p=a+h.w.length}n.replaceWith(f)})}function openV(i){const v=OFFICIAL_VOCAB[i],r=document.getElementById('officialModal');r.innerHTML='<div class="modal"><article class="modalCard"><button class="modalClose">關閉</button><div class="modalWord">'+v[0]+'</div><div class="modalRoman">'+v[1]+'</div><div class="modalGloss">'+v[2]+'</div></article></div>';const m=r.querySelector('.modal');m.onclick=e=>{if(e.target===m||e.target.classList.contains('modalClose'))r.innerHTML=''}}function initV(){const r=document.querySelector('main')||document.getElementById('text');if(r)markV(r);document.querySelectorAll('.vw').forEach(x=>x.onclick=e=>{e.stopPropagation();openV(+x.dataset.v)});const b=document.getElementById('officialVocabList');if(b){b.innerHTML=OFFICIAL_VOCAB.map((v,i)=>'<button class="vocabChip" data-vb="'+i+'">'+v[0]+'</button>').join('');b.querySelectorAll('[data-vb]').forEach(x=>x.onclick=()=>openV(+x.dataset.vb))}}setTimeout(initV,0);</script></body></html>
