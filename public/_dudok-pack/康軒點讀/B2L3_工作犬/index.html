<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>康軒 B2L3｜工作犬</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e4;color:#3c342c;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px}.head{background:#fffaf0;border:1px solid #e2d5bd;border-radius:22px;padding:22px 26px;box-shadow:0 6px 24px #59451e12}.eyebrow{color:#8a6b3e;font-weight:700}.head h1{margin:5px 0 4px;font-size:clamp(28px,5vw,46px)}.author{color:#756b60}.types{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.type{background:#f1e5cf;border:1px solid #dfcfb2;border-radius:999px;padding:7px 12px;font-weight:700}.controls{position:sticky;top:8px;z-index:5;display:flex;gap:9px;flex-wrap:wrap;margin:18px 0;background:#fffaf1ee;border:1px solid #e2d5bd;border-radius:16px;padding:12px}.controls button{border:0;border-radius:999px;padding:10px 15px;background:#e9dfcc;color:#493d30;font-weight:700;cursor:pointer}.controls .primary{background:#536b55;color:#fff}.seg{background:#fffdf8;border:1px solid #e6dac4;border-radius:18px;padding:18px 20px;margin:12px 0;line-height:2;font-size:clamp(18px,2.3vw,23px);cursor:pointer}.seg.playing{outline:3px solid #9caf92}.dog{font-size:14px;font-weight:800;color:#7b603c;margin-bottom:5px}.intro,.outro{background:#fbf5e9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{color:#766c61;font-size:14px}.credit{margin-top:24px;color:#8a7d6d;font-size:12px;text-align:right}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.seg{padding:15px}.head{padding:18px}}
</style><meta name="author" content="張鈺聆"><script src="../../author-credit.js"></script></head><body><div style="max-width:1050px;margin:14px auto 0;padding:0 18px"><a href="../../台語點讀.dc.html" style="color:#536b55;font-weight:800;text-decoration:none">← 回台語點讀目錄</a></div><div class="wrap"><section class="head"><div class="eyebrow">康軒版・第二冊</div><h1>第三課｜工作犬</h1><div class="author">分類介紹式課文點讀｜先看牠是誰，再讀牠的工作</div><div class="types"><span class="type">🐕 警犬／警用狗</span><span class="type">🦺 搜救犬</span><span class="type">🦮 導盲犬</span><span class="type">🧳 檢疫犬</span><span class="type">💛 治療犬</span></div></section><div class="controls"><button class="primary" onclick="playAll()">▶ 依序全文</button><button onclick="playFull()">🎧 出版社全文</button><button onclick="togglePause()">⏯ 暫停／繼續</button><button onclick="restart()">↺ 重新開始</button><button onclick="setRate(.75)">0.75×</button><button onclick="setRate(1)">1×</button><button onclick="setRate(1.25)">1.25×</button></div><main id="text"></main><p class="note">點選任一卡即可播放。分類卡依課文本身的介紹結構呈現，不依 PPT 跨頁位置硬切。</p><div class="credit">網站介面與教學整合設計／製作：張鈺聆</div></div><audio id="audio"></audio><script>
const A='audio/kangxuan-b2-l3/';
const segs=[
['前言',`人佮狗的關係真密切，因為狗真古錐、真死忠，所以定定有人飼來做伴、顧厝。有的狗經過專業的訓練嘛會當鬥做工課、出任務，𪜶是人類的好助手，咱愛感謝𪜶的陪伴佮付出！<br><br>下面咱就來熟似遮的「工作犬」：`,'intro'],
['🐕 警犬／警用狗',`鼻仔誠利，冷靜定著。會當搜揣毒品佮炸彈，幫贊警察的工課。`,''],
['🦺 搜救犬',`跤手扭掠、𠢕鼻氣味，會當佇危險的現場𬦰懸𬦰低、軁來軁去鬥揣人，爭取時間來搶救性命。`,''],
['🦮 導盲犬（目金狗）',`會曉觀察環境，共目睭看袂著的人𤆬路，幫助𪜶閃開擋路的物件，予𪜶會當安心仔行出外。`,''],
['🧳 檢疫犬',`鼻仔足利的好鼻獅。佇機場檢查旅客的行李、國外的包裹，看敢有人紮果子、菜蔬、肉類遮的違禁品。`,''],
['💛 治療犬',`個性溫馴有耐心。會當陪伴特別需要安搭的學生上課；陪老人做復健；安慰病人，予人感受著溫暖佮愛。`,''],
['結語｜出任務的時陣',`工作犬愛經過真嚴格、長時間的訓練，通過考試了後才會當出來做工課。𪜶咧出任務的時陣需要專心，咱千萬毋通共𪜶攪吵喔！`,'outro']
];
let rate=1,seq=false,idx=0;const au=document.getElementById('audio'),text=document.getElementById('text');
text.innerHTML=`<section class="seg intro" onclick="playSeg(0)"><div class="dog">${segs[0][0]}</div>${segs[0][1]}</section><div class="grid">`+segs.slice(1,6).map((s,i)=>`<section class="seg" onclick="playSeg(${i+1})"><div class="dog">${s[0]}</div>${s[1]}</section>`).join('')+`</div><section class="seg outro" onclick="playSeg(6)"><div class="dog">${segs[6][0]}</div>${segs[6][1]}</section>`;
function cards(){return [...document.querySelectorAll('.seg')]}function clear(){cards().forEach(x=>x.classList.remove('playing'))}function src(i){return A+'lesson-'+String(i+1).padStart(3,'0')+'.mp3'}function playSeg(i){seq=false;idx=i;clear();cards()[i].classList.add('playing');au.src=src(i);au.playbackRate=rate;au.play()}function playAll(){seq=true;idx=0;playSeq()}function playSeq(){clear();cards()[idx].classList.add('playing');au.src=src(idx);au.playbackRate=rate;au.play()}function playFull(){seq=false;clear();au.src=A+'publisher-full.mp3';au.playbackRate=rate;au.play()}au.onended=()=>{if(seq&&idx<segs.length-1){idx++;playSeq()}else{seq=false;clear()}};function togglePause(){au.paused?au.play():au.pause()}function restart(){au.currentTime=0;au.play()}function setRate(r){rate=r;au.playbackRate=r}
</script></body></html>
