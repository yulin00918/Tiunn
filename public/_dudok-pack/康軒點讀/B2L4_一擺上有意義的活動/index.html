ficialVocabList"></div></section><div id="officialModal"></div><p class="note">點選任一故事段落即可播放。人物直接說的話只做視覺凸顯，不把敘事課文改成對話劇本。</p><div class="credit">網站介面與教學整合設計／製作：張鈺聆</div></div><audio id="audio"></audio><script>
const A='audio/kangxuan-b2-l4/';
const segs=[
['① 老師提出公益任務',`頂學期尾，老師欲𤆬阮做公益活動。伊先放一段影片，阮看著目睭柴柴倒佇眠床頂袂振動的植物人，因為厝裡歹過，不得已才送去創世基金會請𪜶照顧。照顧病人的開銷真大，老師請逐家想看覓會當按怎鬥相共？`],
['② 全班決定募集發票',`逐家講甲當熱的時，老師那提紙箱仔出來那講：<span class="quote"><span class="speaker">老師</span>「捌聽過募集發票無？咱來去外口鼓勵民眾捐發票，若是著獎就會當贊助基金會。」</span>逐家紙箱仔𢯾咧緊綴老師行出去。`],
['③ 麭店門口的募集行動',`阮這組徛踮一間麭店門跤口，看著人客行出來隨大聲喝：<span class="quote"><span class="speaker">阮這組</span>「拜託！拜託！請逐家共發票捐出來，做好代，同齊來。」</span>一位阿桑行倚來：<span class="quote"><span class="speaker">阿桑</span>「恁誠乖喔！遮的發票攏予恁。」</span>伊紲手共幾若張發票擲入去紙箱仔內，阮歡喜甲一直說多謝。`],
['④ 募集完成與心得',`佇燒熱的六月，徛踮外口喝甲流汗兼喙焦，是誠辛苦的代誌，毋過看著過路人共發票捐出來，阮感覺真價值！落尾，阮班收著六十外張的發票，老師講：<span class="quote"><span class="speaker">老師</span>「勸人做好代，較贏食早齋。」</span>原來做好代是遮爾有成就感的代誌！我會繼續做好代，共愛心傳去全世界。`]
];
let rate=1,seq=false,idx=0;const au=document.getElementById('audio'),text=document.getElementById('text');text.innerHTML=segs.map((s,i)=>`<section class="seg" onclick="playSeg(${i})"><div class="label">${s[0]}</div>${s[1]}</section>`).join('');
function clear(){document.querySelectorAll('.seg').forEach(x=>x.classList.remove('playing'))}function src(i){return A+'lesson-'+String(i+1).padStart(3,'0')+'.mp3'}function playSeg(i){seq=false;idx=i;clear();document.querySelectorAll('.seg')[i].classList.add('playing');au.src=src(i);au.playbackRate=rate;au.play()}function playAll(){seq=true;idx=0;playSeq()}function playSeq(){clear();document.querySelectorAll('.seg')[idx].classList.add('playing');au.src=src(idx);au.playbackRate=rate;au.play()}function playFull(){seq=false;clear();au.src=A+'publisher-full.mp3';au.playbackRate=rate;au.play()}au.onended=()=>{if(seq&&idx<segs.length-1){idx++;playSeq()}else{seq=false;clear()}};function togglePause(){au.paused?au.play():au.pause()}function restart(){au.currentTime=0;au.play()}function setRate(r){rate=r;au.playbackRate=r}
</script><script id="official-vocab-module">const OFFICIAL_VOCAB=[["柴柴", "tshâ-tshâ", "此處指眼神呆滯、不靈活。"], ["開銷", "khai-siau", "開支。所支付出去的金錢。"], ["熱", "jia̍t", "形容人際關係的交流熱絡。"], ["𢯾", "mooh", "緊抱、緊貼。"], ["喝", "huah", "大聲喊叫。"], ["好代", "hó-tāi", "好事、善行。"], ["紲手", "suà-tshiú", "順手、隨手。"], ["早齋", "tsá-tsai", "齋：素食的餐飯。早齋：早上吃的素食。"]];const VS=OFFICIAL_VOCAB.map((v,i)=>({w:v[0],i})).sort((a,b)=>b.w.length-a.w.length);function markV(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.nodeValue.trim()||n.parentElement.closest('script,style,button,.vocabBox,.modal'))return NodeFilter.FILTER_REJECT;return VS.some(v=>n.nodeValue.includes(v.w))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}}),ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{let s=n.nodeValue,f=document.createDocumentFragment(),p=0;while(p<s.length){let h=null,a=s.length;for(const v of VS){let j=s.indexOf(v.w,p);if(j>=0&&(j<a||(j===a&&(!h||v.w.length>h.w.length)))){h=v;a=j}}if(!h){f.append(s.slice(p));break}if(a>p)f.append(s.slice(p,a));let x=document.createElement('span');x.className='vw';x.dataset.v=h.i;x.textContent=h.w;f.append(x);p=a+h.w.length}n.replaceWith(f)})}function openV(i){const v=OFFICIAL_VOCAB[i],r=document.getElementById('officialModal');r.innerHTML='<div class="modal"><article class="modalCard"><button class="modalClose">關閉</button><div class="modalWord">'+v[0]+'</div><div class="modalRoman">'+v[1]+'</div><div class="modalGloss">'+v[2]+'</div></article></div>';const m=r.querySelector('.modal');m.onclick=e=>{if(e.target===m||e.target.classList.contains('modalClose'))r.innerHTML=''}}function initV(){const r=document.querySelector('main')||document.getElementById('text');if(r)markV(r);document.querySelectorAll('.vw').forEach(x=>x.onclick=e=>{e.stopPropagation();openV(+x.dataset.v)});const b=document.getElementById('officialVocabList');if(b){b.innerHTML=OFFICIAL_VOCAB.map((v,i)=>'<button class="vocabChip" data-vb="'+i+'">'+v[0]+'</button>').join('');b.querySelectorAll('[data-vb]').forEach(x=>x.onclick=()=>openV(+x.dataset.vb))}}setTimeout(initV,0);</script></body></html>
