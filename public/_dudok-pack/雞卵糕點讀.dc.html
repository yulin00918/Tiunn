<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<meta name="author" content="張鈺聆">
<meta name="copyright" content="© 張鈺聆">
<script src="./author-credit.js"></script>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  a{color:inherit;text-decoration:none;}
  .rd-wrap,.rd-wrap *{box-sizing:border-box;}
  .rd-seg{transition:.18s ease;}
  @media(hover:hover){
    .rd-seg:hover{border-color:#e3d0b4 !important;background:#fffdf8 !important;}
    .rd-vocab:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(88,67,42,.12) !important;}
    .rd-ctl:hover{border-color:#d9c7a8 !important;}
  }
  @media(max-width:820px){
    .rd-vocabgrid{grid-template-columns:1fr !important;}
  }
  @media(max-width:600px){
    .rd-ctlbar{gap:8px !important;}
    .rd-ctlbar .rd-ctl{flex:1 1 auto;justify-content:center;}
  }
</style>
</helmet>
<div class="rd-wrap" style="font-family:'Noto Sans TC',sans-serif;color:#2b3a45;">
  <div style="max-width:1000px;margin:auto;">

    <div style="background:#fff;border:1px solid #eae2d6;border-radius:22px;padding:18px 20px;box-shadow:0 8px 20px rgba(45,55,70,.07);margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <span style="flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:#fdf1e2;display:inline-flex;align-items:center;justify-content:center;font-size:24px;">🍰</span>
      <div style="min-width:0;flex:1;">
        <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;">
          <span style="flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:5px 11px;border-radius:999px;background:#b5762c;color:#fff;font-size:11.5px;font-weight:900;white-space:nowrap;">育達版・第三冊</span>
          <h2 style="margin:0;font-size:clamp(19px,3vw,23px);font-weight:900;letter-spacing:.04em;line-height:1.3;">第三課｜雞卵糕</h2>
        </div>
        <div style="margin-top:5px;font-size:12.5px;color:#8a968e;font-weight:700;line-height:1.6;">作者：田美瑜｜點段落聽讀音，點<span style="color:#b7642e;border-bottom:2px dotted #d99a5e;">彩色語詞</span>看解說</div>
      </div>
    </div>

    <div class="rd-ctlbar" style="position:sticky;top:8px;z-index:10;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:rgba(255,252,247,.95);backdrop-filter:blur(10px);border:1px solid #eae2d6;border-radius:20px;padding:12px 14px;box-shadow:0 10px 26px rgba(45,55,70,.09);margin-bottom:16px;">
      <button class="rd-ctl" style="flex:0 0 auto;display:inline-flex;align-items:center;min-height:48px;border:none;background:#15344b;color:#fff;padding:12px 18px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:900;" onClick="{{playAll}}">▶ 全文連續播放</button>
      <button class="rd-ctl" style="flex:0 0 auto;display:inline-flex;align-items:center;min-height:48px;border:2px solid #ece2d2;background:#fff;color:#5d5344;padding:11px 16px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:800;transition:.16s;" onClick="{{togglePause}}">⏸ 暫停</button>
      <button class="rd-ctl" style="flex:0 0 auto;display:inline-flex;align-items:center;min-height:48px;border:2px solid #ece2d2;background:#fff;color:#5d5344;padding:11px 16px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:800;transition:.16s;" onClick="{{restart}}">↺ 重頭</button>
      <label style="flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:#8a7f6d;">速度
        <select value="{{speed}}" onChange="{{onSpeedChange}}" style="min-height:48px;border:2px solid #ece2d2;background:#fff;color:#5d5344;padding:10px 12px;border-radius:14px;font-family:inherit;font-size:14px;font-weight:800;">
          <option value="0.75">0.75×</option>
          <option value="1">1×</option>
          <option value="1.25">1.25×</option>
        </select>
      </label>
      <div style="flex:1 1 140px;min-width:120px;height:8px;background:#f0e7d8;border-radius:999px;overflow:hidden;"><span style="display:block;height:100%;background:linear-gradient(90deg,#d89a4e,#b78652);width:{{progressPct}}%;"></span></div>
      <div style="flex:0 0 auto;color:#8a7f6d;font-size:12.5px;font-weight:800;white-space:nowrap;">{{status}}</div>
    </div>

    <section style="background:#fff;border:1px solid #eae2d6;border-radius:26px;padding:24px 22px;box-shadow:0 10px 26px rgba(45,55,70,.08);">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
        <span style="flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 11px;border-radius:999px;background:#b5762c;color:#fff;font-size:12.5px;font-weight:900;white-space:nowrap;">課文點讀</span>
        <span style="font-size:12.5px;color:#8a968e;font-weight:700;line-height:1.5;">全文 {{segCount}} 段</span>
      </div>

      <sc-for list="{{segments}}" as="seg" hint-placeholder-count="8">
        <article class="rd-seg" style="{{seg.style}}" onClick="{{seg.onClick}}">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px;">
            <span style="flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:900;background:{{seg.numBg}};color:{{seg.numColor}};">{{seg.num}}</span>
            <span style="font-size:12.5px;font-weight:800;color:#a0968a;">{{seg.hint}}</span>
          </div>
          <p style="margin:0;font-size:clamp(17px,2.2vw,18.5px);line-height:2.0;letter-spacing:.02em;text-align:justify;">
<sc-for list="{{seg.tokens}}" as="tok" hint-placeholder-count="0"><sc-if value="{{tok.isVocab}}"><span style="{{tok.style}}" onClick="{{tok.onClick}}">{{tok.text}}</span></sc-if><sc-if value="{{!tok.isVocab}}"><span>{{tok.text}}</span></sc-if></sc-for>
          </p>
        </article>
      </sc-for>
    </section>

    <section style="margin-top:20px;background:#fff;border:1px solid #eae2d6;border-radius:26px;padding:24px 22px;box-shadow:0 10px 26px rgba(45,55,70,.08);">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;">
        <span style="flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 11px;border-radius:999px;background:#2f7d5a;color:#fff;font-size:12.5px;font-weight:900;white-space:nowrap;">語詞點讀</span>
        <span style="font-size:12.5px;color:#8a968e;font-weight:700;line-height:1.5;">本課 {{vocabCount}} 个語詞</span>
      </div>
      <p style="margin:0 0 16px;font-size:12.5px;color:#8a968e;font-weight:700;line-height:1.7;">點喇叭聽出版社提供的語詞音檔。</p>

      <div class="rd-vocabgrid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;">
        <sc-for list="{{vocabCards}}" as="v" hint-placeholder-count="8">
          <article class="rd-vocab" style="background:#fdfbf7;border:1px solid #ece4d8;border-radius:18px;padding:15px;display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:start;transition:.18s ease;">
            <span style="width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:#f3e4cd;color:#845f36;font-size:13px;font-weight:900;">{{v.num}}</span>
            <div style="min-width:0;">
              <div style="font-size:19px;font-weight:900;line-height:1.35;overflow-wrap:anywhere;">{{v.word}}</div>
              <div style="font-size:14px;color:#a8724a;font-weight:800;margin-top:3px;overflow-wrap:anywhere;">{{v.roman}}</div>
              <div style="font-size:13.5px;color:#7d8a82;font-weight:700;margin-top:6px;line-height:1.7;">{{v.gloss}}</div>
            </div>
            <button style="{{v.btnStyle}}" onClick="{{v.onPlay}}">🔊</button>
          </article>
        </sc-for>
      </div>
    </section>

  </div>

  <sc-if value="{{popupShow}}">
    <div style="position:fixed;inset:0;background:rgba(45,55,70,.42);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px;" onClick="{{closePopup}}">
      <article onClick="{{stopPropagation}}" style="background:#fff;border:1px solid #eae2d6;border-radius:22px;padding:22px;max-width:380px;width:100%;box-shadow:0 22px 52px rgba(45,55,70,.28);">
        <div style="display:grid;grid-template-columns:38px 1fr auto;gap:13px;align-items:start;">
          <span style="width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:#f3e4cd;color:#845f36;font-size:13px;font-weight:900;">{{popupWord.num}}</span>
          <div style="min-width:0;">
            <div style="font-size:23px;font-weight:900;line-height:1.3;overflow-wrap:anywhere;">{{popupWord.word}}</div>
            <div style="font-size:15px;color:#a8724a;font-weight:800;margin-top:3px;overflow-wrap:anywhere;">{{popupWord.roman}}</div>
            <div style="font-size:14px;color:#7d8a82;font-weight:700;margin-top:9px;line-height:1.75;">{{popupWord.gloss}}</div>
          </div>
          <button style="{{popupWord.btnStyle}}" onClick="{{popupWord.onPlay}}">🔊</button>
        </div>
        <button style="width:100%;margin-top:18px;min-height:48px;border:2px solid #ece2d2;background:#fff;color:#5d5344;border-radius:999px;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:900;" onClick="{{closePopup}}">關起來</button>
      </article>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const AUDIO_BASE = 'audio/read-ke-nng-ko/';
const SEGMENTS_DEF = [
  '印象內面的雞卵糕，總是軟軟甜甜，內底有誠濟我細漢甜蜜的記持。以早較艱苦，囡仔人罕得咧過生日，上加是阿母煠一粒卵予阮食，就歡喜幾若工矣，若想欲食雞卵糕，實在愛家境袂䆀才有法度。',
  '彼當陣厝裡頭喙濟，我是上細漢的查某囡仔，三个阿兄攏真𠢕讀冊，考試提頭名就親像桌頂拈柑，干焦我排袂著生相。',
  '不而過，阿爸佮阿母袂因為按呢就來罵我，嘛誠尊重我的興趣。',
  '這馬認真想起來，以早逐年阮兜食雞卵糕，攏是佇我的生日。佇彼个重男輕女的時代，真正誠罕見。',
  '阿母講過伊足想欲生一个查某囡仔，尤其是生三兄的時，因為伊生做誠古錐，兩蕊目睭足大蕊閣肨奶肨奶，皮膚真白，阿母佮阿爸攏講：「伊若是查某囡仔，毋知有偌好咧！」',
  '莫怪若拄著阿爸的同事，𪜶攏會講：「恁阿爸知影恁阿母生你的時，歡頭喜面，那唱歌那呼噓仔轉來看恁阿母佮你喔！」',
  '就是因為按呢，所以我自出世就一直受著爸母的疼痛。毋過，細漢的時較毋捌代誌，足愛變鬼變怪，齣頭有夠濟。',
  '細漢欣羨別人有雞卵糕通食，真正是會曉吵的囡仔才有糖仔通食，我生日彼工誠實食著雞卵糕，閣是上出名的臺中「神仙雞卵糕」。雞卵糕軟軟閣綿綿，彼種滿足的記持，到今攏印佇我的頭殼內。',
];
const SEGMENT_AUDIO = ['lesson-001.mp3','lesson-002.mp3','lesson-003.mp3','lesson-004.mp3','lesson-005.mp3','lesson-006.mp3','lesson-007.mp3','lesson-008.mp3'];
const VOCAB_DEF = [
  ['01','罕得','hán-tit','稀罕、難得、稀少','vocab-01.mp3'],
  ['02','頭喙','thâu-tshuì','指家中人口','vocab-02.mp3'],
  ['03','桌頂拈柑','toh-tíng ni kam','用手指頭拈取桌上的橘子，比喻事情極其容易','vocab-03.mp3'],
  ['04','生相','senn-siùnn / sinn-siùnn','生肖','vocab-04.mp3'],
  ['05','肨奶','hàng-ling / hàng-ni','嬰兒肥。形容嬰兒長得白白嫩嫩','vocab-05.mp3'],
  ['06','呼噓仔','khoo-si-á','吹口哨','vocab-06.mp3'],
  ['07','變鬼變怪','pìnn-kuí-pìnn-kuài','搞鬼、耍花招、故弄玄虛','vocab-07.mp3'],
  ['08','齣頭','tshut-thâu','把戲、花樣','vocab-08.mp3'],
];

const VOCAB_WORDS_SORTED = VOCAB_DEF.map((v, idx) => ({ word: v[1], idx })).sort((a, b) => b.word.length - a.word.length);
function tokenizeSegment(text) {
  const tokens = [];
  let i = 0;
  while (i < text.length) {
    let matched = null;
    for (const v of VOCAB_WORDS_SORTED) {
      if (text.startsWith(v.word, i)) { matched = v; break; }
    }
    if (matched) { tokens.push({ text: matched.word, vocabIdx: matched.idx }); i += matched.word.length; }
    else { tokens.push({ text: text[i], vocabIdx: null }); i += 1; }
  }
  const merged = [];
  for (const t of tokens) {
    const last = merged[merged.length - 1];
    if (last && last.vocabIdx === null && t.vocabIdx === null) last.text += t.text;
    else merged.push({ ...t });
  }
  return merged;
}

class Component extends DCLogic {
  state = { current: 0, playing: false, continuous: false, progressPct: 0, status: '尚未播放', speed: 1, playingVocabIdx: null, popupIdx: null };
  audioEl = Object.assign(new Audio(), { preload: 'none' });

  componentDidMount() {
    this.audioEl.addEventListener('timeupdate', () => {
      const pct = this.audioEl.duration ? (this.audioEl.currentTime / this.audioEl.duration * 100) : 0;
      this.setState({ progressPct: pct });
    });
    this.audioEl.addEventListener('ended', () => {
      this.setState({ progressPct: 0, playing: false, playingVocabIdx: null });
      if (this.state.continuous && this.state.current < SEGMENTS_DEF.length - 1) {
        this.playSegment(this.state.current + 1, true);
      } else {
        this.setState({ continuous: false, status: '播放完成' });
      }
    });
  }
  componentWillUnmount() { this.audioEl.pause(); }

  playSegment(index, keepContinuous) {
    this.setState({ current: index, continuous: keepContinuous, playing: true, playingVocabIdx: null, status: `播放中：第 ${index + 1} 段` });
    this.audioEl.src = AUDIO_BASE + SEGMENT_AUDIO[index];
    this.audioEl.playbackRate = Number(this.state.speed);
    this.audioEl.play().catch(() => {});
  }
  togglePause() {
    if (this.audioEl.paused) { this.audioEl.play().catch(() => {}); this.setState({ playing: true, status: `繼續：第 ${this.state.current + 1} 段` }); }
    else { this.audioEl.pause(); this.setState({ playing: false, status: `已暫停：第 ${this.state.current + 1} 段` }); }
  }
  restart() { this.playSegment(0, false); }
  playVocab(idx) {
    this.setState({ playingVocabIdx: idx, continuous: false, playing: false, status: '語詞播放中' });
    this.audioEl.src = AUDIO_BASE + VOCAB_DEF[idx][4];
    this.audioEl.playbackRate = Number(this.state.speed);
    this.audioEl.play().catch(() => {});
  }
  openPopup(idx) { this.setState({ popupIdx: idx }); }
  closePopup() { this.setState({ popupIdx: null }); }

  renderVals() {
    const s = this.state;
    const segments = SEGMENTS_DEF.map((text, i) => {
      const active = i === s.current && s.playing;
      const tokens = tokenizeSegment(text).map(tok => ({
        text: tok.text, isVocab: tok.vocabIdx !== null,
        style: tok.vocabIdx !== null ? 'color:#b7642e;font-weight:800;border-bottom:2px dotted #d99a5e;cursor:pointer;padding-bottom:1px;' : '',
        onClick: tok.vocabIdx !== null ? (e) => { e.stopPropagation(); this.openPopup(tok.vocabIdx); } : null,
      }));
      return {
        num: i + 1, tokens,
        hint: active ? '播放中' : '點這段聽讀音',
        numBg: active ? '#b5762c' : '#f3e4cd', numColor: active ? '#fff' : '#845f36',
        style: `display:block;width:100%;padding:18px 18px 16px;border-radius:18px;cursor:pointer;margin-bottom:12px;border:1px solid ${active ? '#e8c88c' : '#f0ebe2'};background:${active ? '#fffaef' : '#fdfbf7'};`,
        onClick: () => this.playSegment(i, false),
      };
    });
    const vocabBtn = (on) => `border:none;background:${on ? '#b5762c' : '#15344b'};color:#fff;border-radius:12px;width:44px;height:44px;min-height:44px;cursor:pointer;font-size:17px;flex:0 0 auto;`;
    const vocabCards = VOCAB_DEF.map(([num, word, roman, gloss], idx) => ({
      num, word, roman, gloss,
      btnStyle: vocabBtn(s.playingVocabIdx === idx),
      onPlay: () => this.playVocab(idx),
    }));
    const popupIdx = s.popupIdx;
    const popupWord = popupIdx !== null ? (() => {
      const [num, word, roman, gloss] = VOCAB_DEF[popupIdx];
      return { num, word, roman, gloss, btnStyle: vocabBtn(s.playingVocabIdx === popupIdx), onPlay: () => this.playVocab(popupIdx) };
    })() : {};
    return {
      segCount: SEGMENTS_DEF.length, vocabCount: VOCAB_DEF.length,
      playAll: () => this.playSegment(s.current, true), togglePause: () => this.togglePause(), restart: () => this.restart(),
      speed: s.speed, onSpeedChange: (e) => { this.setState({ speed: e.target.value }); this.audioEl.playbackRate = Number(e.target.value); },
      progressPct: s.progressPct, status: s.status, segments, vocabCards,
      popupShow: popupIdx !== null, popupWord, closePopup: () => this.closePopup(), stopPropagation: (e) => e.stopPropagation(),
    };
  }
}

</script>
</body>
</html>
