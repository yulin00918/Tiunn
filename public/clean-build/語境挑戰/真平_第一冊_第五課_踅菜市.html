     教材、課文、語詞、台羅、音檔等第三方素材之著作權仍屬原權利人所有。完整宣告見 author-credit.js。 --><title>踅菜市｜真平第一冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../語境填空.dc.html">← 返回整冊</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🧺</div><h1>第5課｜踅菜市</h1><p>市場語言、買賣互動與生活人情</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>語詞意思與教材重點。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>掌握課文人物、事件與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把本課概念帶回生活判斷。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每次隨機抽最多 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab": [{"q": "「踅」較接近啥物意思？", "o": ["逛、繞行", "叫喊、吆喝", "顧客、客人"], "a": 0, "e": "「踅」：逛、繞行。"}, {"q": "「喝」較接近啥物意思？", "o": ["叫喊、吆喝", "逛、繞行", "顧客、客人"], "a": 0, "e": "「喝」：叫喊、吆喝。"}, {"q": "「人客」較接近啥物意思？", "o": ["顧客、客人", "逛、繞行", "叫喊、吆喝"], "a": 0, "e": "「人客」：顧客、客人。"}, {"q": "「加減」較接近啥物意思？", "o": ["多少、稍微", "逛、繞行", "叫喊、吆喝"], "a": 0, "e": "「加減」：多少、稍微。"}, {"q": "「交關」較接近啥物意思？", "o": ["買賣捧場", "逛、繞行", "叫喊、吆喝"], "a": 0, "e": "「交關」：買賣捧場。"}, {"q": "「鮮沢」較接近啥物意思？", "o": ["食物新鮮有光澤的樣子", "逛、繞行", "叫喊、吆喝"], "a": 0, "e": "「鮮沢」：食物新鮮有光澤的樣子。"}, {"q": "「隨意」較接近啥物意思？", "o": ["自由、任憑自己的意思", "逛、繞行", "叫喊、吆喝"], "a": 0, "e": "「隨意」：自由、任憑自己的意思。"}, {"q": "「五金」較接近啥物意思？", "o": ["各種金屬製品", "逛、繞行", "叫喊、吆喝"], "a": 0, "e": "「五金」：各種金屬製品。"}, {"q": "「雜細」較接近啥物意思？", "o": ["家庭日用雜貨", "逛、繞行", "叫喊、吆喝"], "a": 0, "e": "「雜細」：家庭日用雜貨。"}, {"q": "「佮意」較接近啥物意思？", "o": ["中意、喜歡", "逛、繞行", "叫喊、吆喝"], "a": 0, "e": "「佮意」：中意、喜歡。"}, {"q": "「捾」較接近啥物意思？", "o": ["提、拿成串或有把手的物件", "逛、繞行", "叫喊、吆喝"], "a": 0, "e": "「捾」：提、拿成串或有把手的物件。"}, {"q": "「鬥陣」較接近啥物意思？", "o": ["一起、作伙", "逛、繞行", "叫喊、吆喝"], "a": 0, "e": "「鬥陣」：一起、作伙。"}], "context": [{"q": "頭家講「魚仔真鮮喔！」是在做啥物？", "o": ["喝、叫賣", "落眠", "報恩"], "a": 0, "e": "菜市場常見頭家吆喝招呼人客。"}, {"q": "「我會報人來共你交關」的「交關」是？", "o": ["來買物、捧場", "來冤家", "來借冊"], "a": 0, "e": "教材解釋「交關」為買賣捧場。"}, {"q": "魚肉菜看起來「鮮沢」，是講？", "o": ["新鮮閣有光澤", "真鹹", "真舊"], "a": 0, "e": "教材註解「鮮沢」指食物新鮮有光澤。"}, {"q": "「雜細」較可能佇菜市仔的佗一攤買著？", "o": ["家庭日用雜貨攤", "只賣魚的攤", "只賣水果的攤"], "a": 0, "e": "雜細是各種家庭日用雜貨。"}, {"q": "「佮意」一件物件，是表示？", "o": ["中意、喜歡", "討厭", "看無"], "a": 0, "e": "佮意就是中意、喜歡。"}], "reading": [{"q": "〈踅菜市〉主要描寫啥物？", "o": ["菜市場的攤位、叫賣佮人情味", "運動比賽", "攝影展"], "a": 0, "e": "本課透過菜市場生活呈現語言與人情。"}, {"q": "教材中的菜市仔除了食材，閣有可能看著？", "o": ["五金、雜細等生活用品", "飛機", "課桌椅"], "a": 0, "e": "課文語詞包含五金、雜細等。"}, {"q": "「加減交關」在市場情境較接近？", "o": ["多少買一寡仔捧場", "完全毋買", "共頭家冤家"], "a": 0, "e": "加減有多少之意，交關是買賣捧場。"}, {"q": "菜市場叫賣語最主要的功能是？", "o": ["招呼人客、介紹商品", "考試", "報時"], "a": 0, "e": "叫賣是市場重要的生活語言。"}, {"q": "本課適合連結的生活能力是？", "o": ["買物、問價數、和頭家互動", "只背地名", "只練跑步"], "a": 0, "e": "課文就是生活市場語境。"}], "comprehensive": [{"q": "你欲問高麗菜價數，較符合市場語境的是？", "o": ["「這按怎賣？」", "「你欲去佗位？」", "「你食飽未？」"], "a": 0, "e": "教材學習單就用「這按怎賣？」練習市場對話。"}, {"q": "「頭尖尖，尾拖帆，在生無血色，死了遍身紅」謎底是？", "o": ["蝦仔", "豆腐", "高麗菜"], "a": 0, "e": "教材謎猜答案是蝦仔。"}, {"q": "「一个四角四角，欲食免擘殼」謎底是？", "o": ["豆腐", "蠔", "螺仔"], "a": 0, "e": "教材謎猜答案是豆腐。"}, {"q": "若頭家服務真好，課文對話中人客會按怎講？", "o": ["會報人來共你交關", "永遠袂閣來", "欲共你冤家"], "a": 0, "e": "教材對話用「報人來共你交關」表示肯定。"}, {"q": "菜市場是練習台語的好所在，主要因為？", "o": ["有真濟真實生活對話", "完全無人講話", "只有書面文字"], "a": 0, "e": "市場有問價、叫賣、選購等豐富生活語境。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
