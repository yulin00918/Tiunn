dy><div class="app"><div class="top"><a class="pill" href="../語境填空.dc.html">← 返回整冊</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🔎</div><h1>語文天地（一）｜按怎使用教育部《臺灣台語常用詞辭典》？</h1><p>四種查詢方式、附錄與相關學習資源</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>語詞意思與教材重點。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>掌握課文人物、事件與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把本課概念帶回生活判斷。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每次隨機抽最多 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab": [{"q": "《臺灣台語常用詞辭典》是啥物？", "o": ["教育部編輯的線頂辭典", "紙本小說", "新聞網站"], "a": 0, "e": "教材介紹它是教育部編輯的線上辭典。"}, {"q": "用臺灣台語查「詞目」時，會當輸入？", "o": ["漢字抑是臺羅拼音", "干焦華語", "干焦英文"], "a": 0, "e": "教材說漢字或臺羅拼音都可查詢。"}, {"q": "若輸入華語欲找台語用例，愛選？", "o": ["用華語查用例", "用臺灣台語查詞目", "字型下載"], "a": 0, "e": "這是教材列出的四種查詢方式之一。"}, {"q": "欲知一个字抑是語詞閣較濟資料，會當用？", "o": ["用華語查全文", "關掉辭典", "只看首頁"], "a": 0, "e": "教材說「用華語查全文」可查較多資料。"}, {"q": "辭典「附錄」有收啥物？", "o": ["俗諺、百家姓、地名、節氣等", "股票價格", "天氣預報"], "a": 0, "e": "教材列出俗諺、百家姓、地名、節氣、親情關係、人體器官等。"}], "context": [{"q": "你知影台語音，但是毋知漢字，較適合先按怎查？", "o": ["用臺羅拼音查詞目", "亂猜漢字", "改查英文"], "a": 0, "e": "查詞目可用漢字或臺羅拼音。"}, {"q": "你有一个華語詞「羨慕」，欲查台語講法，較適合？", "o": ["用華語查詢", "用地名附錄", "下載字型"], "a": 0, "e": "教材學習單就用華語查詢練習「羨慕」。"}, {"q": "欲查「俗諺」類資料，除了一般搜尋，閣會當看？", "o": ["附錄", "登入紀錄", "瀏覽器歷史"], "a": 0, "e": "辭典附錄收集真濟台語用詞與俗諺。"}, {"q": "辭典的「相關資源」可能有？", "o": ["字型下載、輸入法下載、辭典資源下載", "遊戲點數", "購物券"], "a": 0, "e": "教材列出這些學習與使用台語的工具。"}, {"q": "查著結果後，上重要的下一步是？", "o": ["看詞義、音讀佮用例，確認符合語境", "只看第一字", "完全毋免看解釋"], "a": 0, "e": "查辭典的目的就是確認正確寫法、讀音與意思。"}], "reading": [{"q": "教材共辭典查詢分做幾種主要方式？", "o": ["4種", "2種", "10種"], "a": 0, "e": "教材明確列出四種查詢方式。"}, {"q": "四種方式有包括？", "o": ["台語查詞目、台語查用例、華語查用例、華語查全文", "圖片搜尋、影片搜尋、地圖搜尋", "購物、付款、下載、登入"], "a": 0, "e": "這四種就是教材的核心架構。"}, {"q": "學習辭典查詢的主要目的？", "o": ["提升自主查證台語字詞的能力", "只為著考試", "取代所有課文"], "a": 0, "e": "教材讓學生學會查正確漢字、語詞與意思。"}, {"q": "學習單「姓名查詢」欲練習啥物？", "o": ["查姓名臺羅並用台語介紹家己", "查身分證", "查地址"], "a": 0, "e": "教材學習單安排姓名、臺羅與口語介紹。"}, {"q": "辭典資源對台語學習有啥物幫助？", "o": ["正確書寫、讀音、詞義佮用例查證", "只提供圖片", "只提供遊戲"], "a": 0, "e": "教材把辭典當作實用語言工具。"}], "comprehensive": [{"q": "遇著毋確定的台語漢字，最符合本單元精神？", "o": ["先查辭典確認", "照聲音隨便寫", "永遠改用華語"], "a": 0, "e": "本單元就是培養查證能力。"}, {"q": "欲確認「豐沛」的台語詞義，較適合？", "o": ["查詞目佮用例", "只看字形猜", "問同學猜"], "a": 0, "e": "教材學習單用「豐沛」做查詞目練習。"}, {"q": "欲學輸入台語文字，辭典網站的啥物區域可能幫著？", "o": ["相關資源", "廣告區", "購物車"], "a": 0, "e": "教材說相關資源有輸入法下載。"}, {"q": "這个單元最像佗一種能力訓練？", "o": ["工具使用與資料查證", "運動訓練", "烹飪技巧"], "a": 0, "e": "核心是學會使用台語辭典。"}, {"q": "查辭典後發現一个詞有多種意思，較好的做法？", "o": ["配合句子語境選適合的義項", "永遠只用第一義", "隨便選"], "a": 0, "e": "辭典查詢仍需要語境判斷。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
