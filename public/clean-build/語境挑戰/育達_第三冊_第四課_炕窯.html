<script>const B={"vocab": [{"word": "炕窯", "q": "「炕窯」是啥物？", "opts": ["利用窯內高溫餘熱燜熟番薯的方法", "用水煮番薯", "用冰冷藏番薯"], "ans": 0, "hint": "重點是「窯內高溫餘熱」。", "explain": "教材解釋炕窯是一種用窯內高溫餘熱燜熟番薯的方法。"}, {"word": "紅仁塗", "q": "「紅仁塗」是：", "opts": ["紅色的土壤", "紅色番薯", "紅色磚仔"], "ans": 0, "hint": "大肚山的「塗」。", "explain": "教材解釋「紅仁塗」是紅色的土壤。"}, {"word": "瘦抽", "q": "「瘦抽」是咧形容：", "opts": ["身材細瘦、高挑", "真肥", "真矮"], "ans": 0, "hint": "課文借來寫番薯細長。", "explain": "教材解釋「瘦抽」形容人的身材細瘦、高挑。"}, {"word": "口灶", "q": "「十口灶」的「口灶」是：", "opts": ["戶，計算家庭的單位", "十个爐灶", "十个人"], "ans": 0, "hint": "課文後面講約五十个人。", "explain": "教材解釋「口灶」是戶、計算家庭的單位。"}, {"word": "彼跤兜", "q": "「五十个人彼跤兜」較接近：", "opts": ["附近、左右", "山頂", "真遠的所在"], "ans": 0, "hint": "教材詞義是 kha-tau。", "explain": "教材解釋「跤兜」為附近、左右。"}, {"word": "掘", "q": "課文的「掘番薯」是：", "opts": ["用鋤頭翻土挖番薯", "洗番薯", "切番薯"], "ans": 0, "hint": "和田地工課有關。", "explain": "教材說明「掘」是用鋤頭翻土。"}, {"word": "塗窯", "q": "「塗窯」是：", "opts": ["用泥塊堆疊的小土窯", "磚造大窯", "電鍋"], "ans": 0, "hint": "炕窯第一步愛起這个。", "explain": "教材解釋「塗窯」是用泥塊堆疊而成的小土窯。"}, {"word": "燃火", "q": "「燃火」是啥物意思？", "opts": ["起火、生火", "滅火", "燒焦"], "ans": 0, "hint": "窯起好後愛做的代誌。", "explain": "教材解釋「燃火」為起火、生火。"}, {"word": "炎", "q": "「共窯內的火保持予上炎」的「炎」是：", "opts": ["火勢猛烈", "火真細", "完全無火"], "ans": 0, "hint": "欲共土燒甲紅絳絳。", "explain": "教材解釋「炎」形容火勢或陽光猛烈。"}, {"word": "紅絳絳", "q": "「紅絳絳」是咧形容：", "opts": ["顏色極紅", "顏色真白", "烏漆嘛黑"], "ans": 0, "hint": "土予火燒了後的色。", "explain": "教材解釋「紅絳絳」形容顏色極紅。"}, {"word": "塗鍤", "q": "「塗鍤」是：", "opts": ["鐵鍬、鐵鏟", "手套", "鋤頭"], "ans": 0, "hint": "用來共塗窯摃碎。", "explain": "教材解釋「塗鍤」是鐵鍬、鐵鏟。"}, {"word": "崁", "q": "「共番薯崁甲密密密」的「崁」是：", "opts": ["覆蓋", "挖開", "洗清氣"], "ans": 0, "hint": "目的欲予燒氣較袂傷緊散。", "explain": "教材解釋「崁」是覆蓋。"}, {"word": "燒唿唿", "q": "「燒唿唿」是：", "opts": ["熱呼呼、熱騰騰", "冷冰冰", "芳貢貢"], "ans": 0, "hint": "剛炕好的塗窯真燒。", "explain": "教材解釋「燒唿唿」是熱呼呼、熱騰騰。"}, {"word": "津", "q": "「喙瀾強欲津落來」的「津」是：", "opts": ["滴", "吞", "吐"], "ans": 0, "hint": "喙瀾欲按怎落來？", "explain": "教材解釋「津」是滴。"}, {"word": "袂堪得", "q": "「袂堪得等到冷」是：", "opts": ["受不了、等袂赴", "真有耐心", "完全無想食"], "ans": 0, "hint": "番薯芳甲逐家真想食。", "explain": "教材解釋「袂堪得」為受不了、禁不起、無法承受。"}, {"word": "姑情", "q": "「我共阿爸姑情講」的「姑情」是：", "opts": ["懇求、情商、央求", "姑姑的感情", "生氣"], "ans": 0, "hint": "作者希望逐年攏閣去炕窯。", "explain": "教材解釋「姑情」為懇求、情商、央求。"}], "context": [{"word": "相招", "q": "禮拜六阮班同學＿＿＿＿去𬦰山。", "opts": ["相招", "紅絳絳", "袂堪得"], "ans": 0, "hint": "逐家約做伙去。", "explain": "課文以「相招」表示相約同行。"}, {"word": "瘦抽", "q": "彼个模特兒身材懸閣幼，會當講是＿＿＿＿。", "opts": ["瘦抽瘦抽", "燒唿唿", "紅絳絳"], "ans": 0, "hint": "教材本義是細瘦、高挑。", "explain": "「瘦抽」形容身材細瘦、高挑。"}, {"word": "燃火", "q": "露營欲煮物件進前，愛先＿＿＿＿。", "opts": ["燃火", "崁", "姑情"], "ans": 0, "hint": "先共火生起來。", "explain": "「燃火」就是起火、生火。"}, {"word": "紅絳絳", "q": "夕陽照甲天邊＿＿＿＿，真正媠。", "opts": ["紅絳絳", "瘦抽瘦抽", "燒唿唿"], "ans": 0, "hint": "是在形容真紅。", "explain": "「紅絳絳」形容顏色極紅。"}, {"word": "崁", "q": "天氣真寒，阿媽共棉被＿＿＿＿佇囡仔身軀頂。", "opts": ["崁", "掘", "燃火"], "ans": 0, "hint": "這裡是「覆蓋」。", "explain": "「崁」可表示覆蓋。"}, {"word": "燒唿唿", "q": "這碗湯拄煮好，猶原＿＿＿＿，食的時愛細膩。", "opts": ["燒唿唿", "瘦抽瘦抽", "彼跤兜"], "ans": 0, "hint": "拄煮好真熱。", "explain": "「燒唿唿」是熱呼呼、熱騰騰。"}, {"word": "袂堪得", "q": "餅的芳味一直傳出來，我＿＿＿＿等到下課就想欲食。", "opts": ["袂堪得", "口灶", "紅仁塗"], "ans": 0, "hint": "已經忍袂牢。", "explain": "「袂堪得」表示受不了、無法承受。"}, {"word": "姑情", "q": "我共阿母＿＿＿＿，希望伊予我參加這擺活動。", "opts": ["姑情", "燃火", "津"], "ans": 0, "hint": "是央求、懇求。", "explain": "「姑情」是懇求、情商、央求。"}], "reading": [{"q": "作者這擺去佗位炕窯？", "opts": ["臺中大肚山望高寮", "基隆崁仔頂", "嘉義布袋"], "ans": 0, "hint": "第一段有寫所在。", "explain": "作者和爸爸同事相約去大肚山望高寮炕窯。"}, {"q": "大肚山上蓋出名的土產是：", "opts": ["番薯佮塗豆", "魚仔佮鹽", "雞卵糕"], "ans": 0, "hint": "課文第二段。", "explain": "課文寫大肚山著名土產是番薯和花生。"}, {"q": "塗窯起好勢進前，課文已經安排的工課是：", "opts": ["掘番薯", "燃火", "摃碎塗窯"], "ans": 0, "hint": "教材閱讀題有直接問。", "explain": "掘番薯可在塗窯起好之前進行；燃火、摃碎是在窯起好後。"}, {"q": "窯內的塗愛燒到啥物款，才共番薯囥落去？", "opts": ["紅絳絳", "冷冰冰", "溼糊糊"], "ans": 0, "hint": "火愛保持予上炎。", "explain": "課文寫要等所有的土燒得紅紅通透，再放番薯。"}, {"q": "共番薯崁甲密密密，閣加冷塗的目的？", "opts": ["予燒氣較袂傷緊散", "予番薯變冷", "予塗窯較媠"], "ans": 0, "hint": "炕窯靠餘熱。", "explain": "課文直接說是為了避免熱氣太快消散。"}, {"q": "番薯炕好後，逐家為啥物「喙瀾強欲津落來」？", "opts": ["番薯芳貢貢，逐家足想食", "因為真驚", "因為真鹹"], "ans": 0, "hint": "鼻空先聞著芳味。", "explain": "熱番薯香味撲鼻，讓大家口水快流下來。"}, {"q": "作者炕窯了後的感想是：", "opts": ["希望以後逐年至少規家伙仔去炕窯一擺", "以後攏毋去", "只想家己去"], "ans": 0, "hint": "最後一段有向阿爸姑情。", "explain": "作者因為經驗難忘，央求爸爸以後每年至少帶全家去一次。"}, {"q": "教材指出這篇文章主要按怎安排？", "opts": ["照時間順序記錄頭一擺炕窯的經驗", "照地圖順序", "用問答體"], "ans": 0, "hint": "炕窯流程是文章骨架。", "explain": "教材分析指出本文按時間順序記錄第一次炕窯的經驗。"}], "comprehensive": [{"q": "下面佗一个炕窯順序上正確？", "opts": ["起窯、掘番薯、抾柴 → 燃火 → 摃碎塗窯 → 炕番薯 → 食番薯", "食番薯 → 起窯 → 燃火", "燃火 → 食番薯 → 掘番薯"], "ans": 0, "hint": "先準備窯佮材料，最後才食。", "explain": "教材列出的完整流程以起窯、掘番薯、抾柴開始，經燃火、摃碎、餘熱炕熟，最後食番薯。"}, {"q": "「炕窯」這項活動上能表現啥物？", "opts": ["生活智慧、自然環境佮人際互動", "只是一種考試", "只和都市交通有關"], "ans": 0, "hint": "教材首頁已經點出主題。", "explain": "教材說炕窯運用生活智慧與自然環境物件，也有人與自然互相牽成的情意。"}, {"q": "作者想欲閣去炕窯的原因，佗一个毋是課文內容？", "opts": ["會使去山頂種番薯", "炕番薯好食", "大人囡仔同齊活動真趣味"], "ans": 0, "hint": "教材原題有這个選項。", "explain": "「去山頂種番薯」不是作者想再去炕窯的理由。"}, {"q": "若欲炕窯成功，為啥物第一層塗窯愛較闊？", "opts": ["按呢窯才會穩", "按呢番薯會變甜", "按呢免燃火"], "ans": 0, "hint": "教材後面的活動對話有說明。", "explain": "教材指出起窯第一層範圍要較大，土窯才會穩固。"}, {"q": "窯起好後敢會當隨時囥食材？", "opts": ["袂使，愛先燃火，共窯燒甲紅絳絳", "會使，馬上囥", "愛先用水淋窯"], "ans": 0, "hint": "教材活動對話直接回答「猶未」。", "explain": "窯起好後還要生火，將土塊燒紅，才可放食材。"}, {"q": "炕窯上主要利用啥物原理？", "opts": ["高溫餘熱燜熟食物", "冰塊冷凍", "日光曬乾"], "ans": 0, "hint": "看「炕窯」詞義。", "explain": "炕窯就是利用窯內高溫餘熱燜熟番薯。"}]};const names={vocab:"🔤 課文語詞",context:"💭 語境選詞",reading:"📖 讀文理解",comprehensive:"🏆 綜合挑戰"};

function render(){tries=0;let q=set[i];$("count").textContent=`第 ${i+1} / 5 題`;$("scoreNow").textContent=`目前 ${score} 分`;$("fill").style.width=`${i*20}%`;
$("qcard").innerHTML=`<div class="kicker">${q.word?("本課語詞｜"+q.word):names[bank]}</div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join("")}</div><div id="fb"></div>`}
function pick(n,el){let q=set[i];if(document.querySelector(".correct"))return;tries++;if(n===q.ans){el.classList.add("correct");score++;$("fb").innerHTML=`<div class="feedback ok">✅ 著矣！<br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add("wrong");if(tries===1){if(q.word)weak.push(q.word);$("fb").innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${q.hint}</div>`}else{document.querySelectorAll(".opt")[q.ans].classList.add("correct");$("fb").innerHTML=`<div class="feedback bad">答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}
function next(){i++;if(i<5)render();else finish()}
function finish(){$("s-"+bank).textContent=`上擺 ${score} / 5`;$("rt").textContent=names[bank]+"完成！";$("fs").textContent=score+" / 5";$("msg").textContent=score===5?"🏆 真𠢕！這關全數答著。":score>=4?"🌟 真好！已經真熟矣。":score>=3?"👍 愈來愈會曉！":"🌱 閣練一擺，會愈來愈熟。";let w=[...new Set(weak)];$("weak").innerHTML=w.length?`<b>建議閣練：</b>${w.join("、")}`:"✨ 這擺無特別需要加強的語詞。";show("result")}
$("retry").onclick=()=>start(bank);$("home").onclick=()=>show("lesson");$("back").onclick=()=>{if($("lesson").classList.contains("hidden")){show("lesson")}else{location.href='../語境填空.dc.html'}};

const correctSteps=["起窯、掘番薯、抾柴","燃火，共塗燒甲紅絳絳","共塗窯摃予碎","囥番薯，用燒氣炕熟","掛手橐仔挖開塗窯","食炕好的番薯"];let steps=[];
function drawSteps(){ $("steps").innerHTML=steps.map((s,idx)=>`<div class="step"><b>${idx+1}</b><span style="flex:1">${s}</span><button onclick="moveStep(${idx},-1)">▲</button><button onclick="moveStep(${idx},1)">▼</button></div>`).join("")}
function shuffleSteps(){steps=sh(correctSteps);drawSteps();$("stepStatus").textContent="先排列看覓，完成了後才檢查。"}
window.moveStep=(idx,d)=>{let n=idx+d;if(n<0||n>=steps.length)return;[steps[idx],steps[n]]=[steps[n],steps[idx]];drawSteps()}
$("activityBtn").onclick=()=>{show("activity");shuffleSteps()};$("resetSteps").onclick=shuffleSteps;$("checkSteps").onclick=()=>{let ok=steps.every((x,j)=>x===correctSteps[j]);$("stepStatus").innerHTML=ok?"✅ 全部著矣！你已經掌握炕窯的時間順序。":"🤔 猶有順序愛調整。提示：先起窯、準備材料，才燃火；番薯是利用窯的燒氣炕熟，最後才挖開來食。"};$("activityHome").onclick=()=>show("lesson");
</script></body></html>
