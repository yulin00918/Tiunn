<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>互動教室｜互動白板</title>
<style>
:root{
  --bg:#f5f2ec;
  --panel:#fffdf9;
  --line:#ddd7ce;
  --text:#2f3437;
  --muted:#6c7478;
  --accent:#8f6f61;
  --accent2:#d9c6ba;
  --soft:#f2ebe6;
  --success:#6f8f7a;
  --danger:#b85c5c;
  --shadow:0 8px 24px rgba(70,55,45,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
.topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:18px;margin-right:4px}
.topbar input{min-width:180px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:white}
.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 12px;color:var(--text)}
.btn:hover{background:#f7f3ef}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:700}
.btn.danger{color:var(--danger)}
.main{display:grid;grid-template-columns:88px minmax(0,1fr) 300px;min-height:0}
.leftbar,.rightbar{background:var(--panel)}
.leftbar{border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:8px}
.tool{min-height:58px;border:1px solid transparent;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text)}
.tool span:first-child{font-size:21px}
.tool small{font-size:12px;font-weight:700}
.tool.active{background:#efe5df;border-color:#d8c2b5;color:#5f4438}
.canvas-wrap{position:relative;overflow:hidden;background:#e9e5df;min-height:620px}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:transparent;transform-origin:0 0}
#overlay{position:absolute;inset:0;pointer-events:none;transform-origin:0 0}
.object{pointer-events:auto;will-change:left,top}
#board{will-change:transform}
#overlay{will-change:transform}
.rightbar{border-left:1px solid var(--line);padding:12px;overflow:auto}
.section{margin-bottom:16px}
.section h3{font-size:14px;margin:0 0 8px;color:#554b46}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sidebtn{border:1px solid var(--line);background:white;border-radius:12px;padding:12px 8px;min-height:68px;font-weight:700;line-height:1.35}
.sidebtn:hover{background:#f7f3ef}
.panel{display:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;box-shadow:var(--shadow)}
.focusbar{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
.focusbar button{border:1px solid var(--line);background:#faf8f5;border-radius:8px;padding:6px 9px}
.panel.focus{position:absolute;right:18px;top:18px;width:min(520px,calc(100% - 36px));max-height:calc(100% - 36px);overflow:auto;z-index:50;box-shadow:0 18px 45px rgba(0,0,0,.18)}
.editable-label{display:inline-block;min-width:80px;border-bottom:1px dashed #aaa;padding:2px 4px;outline:none}
.class-list{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.config-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.config-grid input,.config-grid select,.config-grid textarea{border:1px solid var(--line);border-radius:9px;padding:8px;background:white;color:var(--text);width:100%}
.activity-btn.active-activity{background:#efe5df;border-color:#d8c2b5;color:#5f4438}
.seat-chip{border:1px solid var(--line);background:#faf8f5;border-radius:8px;padding:7px 4px;text-align:center;font-size:13px}

.panel.open{display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input,.row select{border:1px solid var(--line);border-radius:9px;padding:8px;background:white;min-width:0}
.big-number{font-size:46px;font-weight:800;text-align:center;padding:10px 0;color:#594b44}
.timer-display{font-size:42px;font-weight:800;text-align:center;letter-spacing:2px;padding:8px 0}
.score-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.score-actions{display:flex;gap:4px;flex-wrap:wrap}
.score-actions button{border:1px solid var(--line);background:#faf8f5;border-radius:8px;padding:5px 8px}
.score-name{font-weight:700}
.ranking{margin-top:8px;font-size:13px;color:var(--muted)}
.dice{display:flex;justify-content:center;gap:14px;padding:12px 0}
.die{width:64px;height:64px;border:2px solid #4f4f4f;border-radius:14px;display:grid;place-items:center;font-size:34px;background:white}
.bottom{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
.zoomval{min-width:52px;text-align:center;font-weight:700}
.note{position:absolute;min-width:160px;max-width:260px;min-height:100px;background:#fff1a8;border:1px solid #e6d170;border-radius:10px;padding:10px;box-shadow:0 6px 18px rgba(0,0,0,.12);cursor:move;user-select:none}
.note textarea{width:100%;min-height:72px;border:0;background:transparent;resize:vertical;outline:none;cursor:text}
.textbox{position:absolute;min-width:120px;padding:4px 6px;border:1px dashed #aaa;background:rgba(255,255,255,.9);cursor:move}
.textbox input{border:0;background:transparent;outline:none;width:180px}
.object.selected{outline:2px solid #7f9f9a;outline-offset:2px}
.image-object{position:absolute;max-width:320px;max-height:260px;cursor:move;border-radius:8px}
.hidden-file{display:none}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:#30363a;color:#fff;padding:9px 13px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
@media (max-width:900px){
  .main{grid-template-columns:72px minmax(0,1fr)}
  .rightbar{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:12px}
}
@media (max-width:620px){
  .main{grid-template-columns:60px minmax(0,1fr)}
  .leftbar{padding:6px 4px}
  .tool{min-height:52px}
  .tool small{font-size:10px}
  .rightbar{display:block}
  .canvas-wrap{min-height:520px}
}
.boardbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#f8f4ef;border-bottom:1px solid var(--line);font-size:13px}.boardpill{padding:6px 9px;border-radius:999px;background:#fff;border:1px solid var(--line)}.syncnote{font-size:11px;color:var(--muted)}body.participant .rightbar{display:none}body.participant .main{grid-template-columns:72px minmax(0,1fr)}body.participant .teacher-only{display:none!important}body.participant .tool{display:none}body.participant .tool.participant-tool{display:flex}body.participant .bottom label,body.participant #clearBtn{display:none}@media(max-width:900px){body.participant .main{grid-template-columns:72px minmax(0,1fr)}}
</style>

<style>
body.participant .leftbar .participant-tool{
  display:flex !important;
}
@media (max-width:620px){
  body.participant .leftbar{
    gap:6px;
  }
  body.participant .participant-tool{
    min-height:54px;
  }
}
</style>

<style>
#mobileDeleteBtn{
  display:none;
  position:fixed;
  right:16px;
  bottom:18px;
  z-index:120;
  border:0;
  border-radius:999px;
  padding:12px 16px;
  background:#fff;
  box-shadow:0 4px 18px rgba(0,0,0,.18);
  font-weight:800;
  cursor:pointer;
}
body.participant #mobileDeleteBtn.show{
  display:flex !important;
  align-items:center;
  gap:6px;
}
</style>

<style>
body.participant .object.selected{
  outline:3px solid currentColor;
  outline-offset:3px;
}
body.participant #mobileDeleteBtn.show{
  display:flex !important;
}
</style>

<style>
/* V3.3.9：三端白板初始化與尺寸統一 */
html,body{
  height:100%;
  margin:0;
}
body{
  min-height:100vh;
}
.app{
  min-height:100vh;
  height:100vh;
  display:flex;
  flex-direction:column;
}
.topbar,
.boardbar,
.bottom{
  flex:0 0 auto;
}
.main{
  flex:1 1 auto;
  min-height:0;
  height:auto;
}
.canvas-wrap{
  position:relative;
  min-height:0 !important;
  height:100%;
  background:#ffffff !important;
}
#board,
#overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
body.participant .main{
  min-height:0;
}
body.participant .canvas-wrap{
  min-height:0 !important;
  height:100%;
}

/* 明確顯示工作區已開啟 */
.canvas-wrap::after{
  content:"白板工作區";
  position:absolute;
  right:14px;
  bottom:12px;
  font-size:11px;
  color:rgba(80,70,65,.35);
  pointer-events:none;
  z-index:0;
}
</style>

<style>
body.participant .leftbar{
  overflow-y:auto;
  min-height:0;
}
body.participant .tool.participant-tool{
  flex:0 0 auto;
}
@media(max-width:900px){
  body.participant .main{
    grid-template-columns:72px minmax(0,1fr);
    height:100%;
  }
}
@media(max-width:620px){
  body.participant .main{
    grid-template-columns:60px minmax(0,1fr);
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">🖥️ 互動白板</div>
    <input id="boardTitle" value="今天的互動白板" aria-label="白板名稱">
    <button type="button" class="btn teacher-only" id="saveBtn">💾 儲存白板</button>
    <button type="button" class="btn teacher-only" id="loadBtn">📂 載入白板</button>
    <button type="button" class="btn primary teacher-only" id="exportBtn">📷 匯出圖片</button>
  <button type="button" class="btn" id="backClassroom">← 回互動教室</button>
  </header>
  <div class="boardbar">
    <span class="boardpill" id="roomPill">房間 —</span>
    <span class="boardpill" id="modePill">模式 —</span>
    <span class="boardpill" id="onlinePill">👥 0 人在線</span>
    <button class="btn teacher-only" id="toggleBoardLock">🔓 開放操作</button>
    <button class="btn danger teacher-only" id="closeBoard">結束白板</button>
    <span class="syncnote" id="syncStatus">連線中…</span>
    <span class="syncnote" id="diagPill">診斷：等待伺服器</span>
    <span class="syncnote" id="boardReadyPill">白板初始化中…</span>
  </div>

  <main class="main">
    <aside class="leftbar" aria-label="白板工具">
      <button type="button" class="tool active participant-tool" data-tool="select"><span>🖱️</span><small>選取</small></button>
      <button type="button" class="tool" data-tool="pen"><span>✏️</span><small>畫筆</small></button>
      <button type="button" class="tool" data-tool="highlight"><span>🖍️</span><small>螢光筆</small></button>
      <button type="button" class="tool" data-tool="eraser"><span>🧽</span><small>橡皮擦</small></button>
      <button type="button" class="tool participant-tool" data-tool="text"><span>🔤</span><small>文字</small></button>
      <button type="button" class="tool participant-tool" data-tool="note"><span>📝</span><small>便利貼</small></button>
      <button type="button" class="tool participant-tool" id="imageBtn"><span>🖼️</span><small>圖片</small></button>
      <button type="button" class="tool" data-tool="line"><span>／</span><small>直線</small></button>
      <button type="button" class="tool" data-tool="arrow"><span>➜</span><small>箭頭</small></button>
      <button type="button" class="tool" data-tool="rect"><span>▭</span><small>矩形</small></button>
      <button type="button" class="tool" data-tool="circle"><span>◯</span><small>圓形</small></button>
      <button type="button" class="tool" id="undoBtn"><span>↶</span><small>復原</small></button>
      <button type="button" class="tool" id="redoBtn"><span>↷</span><small>重做</small></button>
    </aside>

    <section class="canvas-wrap" id="canvasWrap">
      <canvas id="board"></canvas>
      <div id="overlay"></div>
      <div class="toast" id="toast"></div>
    </section>

    <aside class="rightbar">
      <section class="section">
  <h3>🧩 活動板</h3><div style="font-size:12px;color:var(--muted);margin:-2px 0 8px">選一種活動板，再依課程內容設定</div>
  <div class="grid2">
    <button type="button" class="sidebtn activity-btn" data-activity="classify">🗂️<br>分類</button>
    <button type="button" class="sidebtn activity-btn" data-activity="match">🔗<br>配對</button>
    <button type="button" class="sidebtn activity-btn" data-activity="sort">↕️<br>排序</button>
    <button type="button" class="sidebtn activity-btn" data-activity="flow">🪜<br>流程</button>
    <button type="button" class="sidebtn activity-btn" data-activity="quad">▦<br>四象限</button>
    <button type="button" class="sidebtn activity-btn" data-activity="imageMark">🖼️<br>圖片標註</button>
    <button type="button" class="sidebtn activity-btn" data-activity="decision">⚖️<br>選擇決策</button>
    <button type="button" class="sidebtn activity-btn" data-activity="task">📋<br>任務</button>
  </div>

  <div class="panel" id="activityConfigPanel">
    <div class="focusbar">
      <button type="button" id="closeActivityConfig">✕ 關閉</button>
    </div>
    <strong id="activityConfigTitle">活動設定</strong>
    <div id="activityConfigBody" style="margin-top:10px"></div>
    <div class="row" style="margin-top:10px">
      <button type="button" class="btn primary" id="createActivityBtn">建立活動板</button>
    </div>
  </div>
</section>

    </aside>
  </main>

  <footer class="bottom">
    <button type="button" class="btn" id="zoomOut">−</button>
    <span class="zoomval" id="zoomVal">100%</span>
    <button type="button" class="btn" id="zoomIn">＋</button>
    <button type="button" class="btn" id="resetView">⊙ 回到原位</button>
    <label>背景
      <select id="bgSelect">
        <option value="white">白板</option>
        <option value="grid">方格</option>
        <option value="lines">橫線</option>
        <option value="dark">黑板</option>
      </select>
    </label>
    <label>筆色 <input id="colorPicker" type="color" value="#333333"></label>
    <label>粗細 <input id="sizePicker" type="range" min="2" max="28" value="4"></label>
    <button type="button" class="btn danger" id="clearBtn">🗑 清空白板</button>
  <span style="margin-left:auto;font-size:12px;color:var(--muted)">提示：可用 Ctrl/⌘ + Z 復原，Delete 刪除選取物件</span></footer>
</div>

<button type="button" id="mobileDeleteBtn" aria-label="刪除選取物件">🗑️ 刪除</button>
<input class="hidden-file" id="imageInput" type="file" accept="image/*">


<script>
(() => {
  const canvas = document.getElementById('board');
  const wrap = document.getElementById('canvasWrap');
  const overlay = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const toast = document.getElementById('toast');
  const params=new URLSearchParams(location.search);
  const roomCode=params.get('room')||'';
  const boardRole=params.get('role')==='participant'?'participant':'host';
  const boardMode=params.get('mode')||'fullclass';
  const participantId=boardRole==='participant'?(localStorage.getItem('interactive_pid')||crypto.randomUUID()):'host';
  if(boardRole==='participant')localStorage.setItem('interactive_pid',participantId);
  const displayName=boardRole==='participant'?(params.get('name')||'匿名參與者'):'主持人';

  window.addEventListener('error',e=>{
    const el=document.getElementById('diagPill');
    if(el)el.textContent=`JS錯誤：${e.message||'未知錯誤'} @ ${e.lineno||'?'}:${e.colno||'?'}`;
    const s=document.getElementById('syncStatus');
    if(s && s.textContent.includes('連線中'))s.textContent='⚠️ 白板程式錯誤';
  });
  window.addEventListener('unhandledrejection',e=>{
    const el=document.getElementById('diagPill');
    if(el)el.textContent=`Promise錯誤：${String(e.reason?.message||e.reason||'未知錯誤')}`;
  });
  let boardWs=null, boardLocked=true, serverBoardMode=boardMode, applyingRemote=false;
  let currentServerTemplate=null;
  document.body.classList.toggle('participant',boardRole==='participant');
  document.getElementById('roomPill').textContent='房間 '+(roomCode||'—');
  document.getElementById('modePill').textContent='模式 '+(boardMode==='teacher'?'教師白板':'全班共編');

  function canBoardEdit(){ return boardRole==='host' || (serverBoardMode==='fullclass'&&!boardLocked); }
  function sendBoard(type,payload={}){ if(boardWs?.readyState===1)boardWs.send(JSON.stringify({type,payload})); }
  function boardObjectById(id){
    return [...overlay.children].find(el=>el.dataset.boardId===id);
  }

  function bindSyncedTextInput(el,input){
    input.addEventListener('change',()=>{
      if(applyingRemote||!canBoardEdit())return;
      if(boardRole==='participant' && el.dataset.authorId!==participantId)return;
      sendBoard('board_object_update',{
        id:el.dataset.boardId,
        text:input.value
      });
    });
  }

  function ensureBoardObject(obj){
    if(!obj?.id)return null;

    let el=boardObjectById(obj.id);

    if(!el){
      if(obj.type==='text'){
        el=document.createElement('div');
        el.className='textbox';
        el.innerHTML='<input value="">';
        overlay.appendChild(el);
        makeDraggable(el);
        bindSyncedTextInput(el,el.querySelector('input'));
      }else if(obj.type==='image'){
        el=document.createElement('img');
        el.className='image-object';
        el.alt='共編圖片';
        overlay.appendChild(el);
        makeDraggable(el);
      }else{
        el=document.createElement('div');
        el.className='note';
        el.innerHTML='<textarea placeholder="輸入便利貼內容…"></textarea><div class="note-author"></div>';
        overlay.appendChild(el);
        makeDraggable(el);
        bindSyncedTextInput(el,el.querySelector('textarea'));
      }
    }

    el.dataset.boardId=obj.id;
    el.dataset.authorId=obj.authorId||'';
    el.dataset.authorName=obj.authorName||'';
    el.dataset.boardType=obj.type||'note';
    el.style.left=(Number(obj.left)||0)+'px';
    el.style.top=(Number(obj.top)||0)+'px';

    if(obj.type==='text'){
      const input=el.querySelector('input');
      if(input)input.value=obj.text||'';
    }else if(obj.type==='image'){
      if(obj.src && el.src!==obj.src)el.src=obj.src;
      if(obj.width)el.style.width=Math.max(60,Number(obj.width)||220)+'px';
      if(obj.height)el.style.height=Math.max(40,Number(obj.height)||0)+'px';
    }else{
      const ta=el.querySelector('textarea');
      if(ta)ta.value=obj.text||'';
      const author=el.querySelector('.note-author');
      if(author)author.textContent=obj.authorName||'';
    }

    applyBoardPermission();
    return el;
  }

  function applyBoardPermission(){
    const editable=canBoardEdit();
    overlay.querySelectorAll('[data-board-id]').forEach(el=>{
      const own=boardRole==='host'||el.dataset.authorId===participantId;
      const input=el.querySelector('textarea,input');
      if(input)input.readOnly=!(editable&&own);
      el.style.opacity=editable?1:.92;
    });
    const lockBtn=document.getElementById('toggleBoardLock');
    if(lockBtn)lockBtn.textContent=boardLocked?'🔒 目前鎖定（點擊開放）':'🔓 已開放操作（點擊鎖定）';

    updateMobileDeleteButton();
  }
  function applyServerTemplate(tpl){
    if(!tpl)return;
    currentServerTemplate=tpl;

    requestAnimationFrame(()=>{
      if(tpl.type==='classify'){
        renderClassifyTemplate(tpl);
      }else if(tpl.type==='sort'){
        renderSortTemplate(tpl);
      }else if(tpl.type==='quad'){
        renderQuadTemplate(tpl);
      }else if(tpl.type==='match'){
        renderMatchTemplate(tpl);
      }else if(tpl.type==='flow'){
        renderFlowTemplate(tpl);
      }else if(tpl.type==='imageMark'){
        renderImageMarkTemplate(tpl);
      }else if(tpl.type==='decision'){
        renderDecisionTemplate(tpl);
      }else if(tpl.type==='task'){
        renderTaskTemplate(tpl);
      }
    });
  }

  function connectBoard(){
    const statusEl=document.getElementById('syncStatus');
    const diagEl=document.getElementById('diagPill');
    if(!roomCode){statusEl.textContent='缺少房間碼';diagEl.textContent='診斷：網址沒有 room';return;}
    const proto=location.protocol==='https:'?'wss:':'ws:';
    const url=`${proto}//${location.host}/api/rooms/${roomCode}/ws?role=${boardRole}&participantId=${encodeURIComponent(participantId)}&name=${encodeURIComponent(displayName)}&surface=board`;
    statusEl.textContent='🟡 正在連線…';
    diagEl.textContent=`診斷：準備 WebSocket｜${boardRole}｜room=${roomCode}`;
    try{
      boardWs=new WebSocket(url);
    }catch(err){
      statusEl.textContent='⚠️ 建立連線失敗';
      diagEl.textContent='WebSocket 建立錯誤：'+(err?.message||err);
      return;
    }
    boardWs.onopen=()=>{
      statusEl.textContent='🟢 已連線';

  function resizeCanvas(){
    const rect=wrap.getBoundingClientRect();
    const targetW=Math.max(700,Math.floor(rect.width||wrap.clientWidth||900));
    const targetH=Math.max(520,Math.floor(rect.height||wrap.clientHeight||620));

    if(canvas.width===targetW && canvas.height===targetH){
      applyBackground();
      return;
    }

    const old=document.createElement('canvas');
    old.width=canvas.width;
    old.height=canvas.height;

    if(canvas.width>0 && canvas.height>0){
      old.getContext('2d').drawImage(canvas,0,0);
    }

    canvas.width=targetW;
    canvas.height=targetH;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(old.width>0 && old.height>0){
      ctx.drawImage(old,0,0);
    }

    applyBackground();

    if(currentServerTemplate){
      requestAnimationFrame(()=>applyServerTemplate(currentServerTemplate));
    }

    const ready=document.getElementById('boardReadyPill');
    if(ready){
      ready.textContent=`✅ 白板已就緒｜${targetW}×${targetH}`;
    }

  function serializeObjects(){
    return [...overlay.children].map(el=>({
      type: el.classList.contains('note')?'note':el.classList.contains('textbox')?'text':el.tagName==='IMG'?'image':'unknown',
      left:el.style.left, top:el.style.top,

    }));
  }

  function snapshotState(){
    return {
      pixels: ctx.getImageData(0,0,canvas.width,canvas.height),
      objects: serializeObjects(),
      bg
    };
  }
  function saveState(){
    try{
      undoStack.push(snapshotState());
      if(undoStack.length>15) undoStack.shift();
      redoStack.length=0;
    }catch(_){}
  }
  function restoreState(state){
    if(!state)return;
    bg=state.bg||'white';
    document.getElementById('bgSelect').value=bg;
    applyBackground();
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(state.pixels) ctx.putImageData(state.pixels,0,0);
    restoreObjects(state.objects||[]);
  }
  function undo(){
    if(!undoStack.length)return;
    redoStack.push(snapshotState());
    restoreState(undoStack.pop());
  }
  function redo(){
    if(!redoStack.length)return;
    undoStack.push(snapshotState());
    restoreState(redoStack.pop());
  }

  function pos(e){
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)/zoom,y:(e.clientY-r.top)/zoom};
  }
  function applyPenStyle(tool){
    const color=document.getElementById('colorPicker').value;
    const size=+document.getElementById('sizePicker').value;
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
    if(tool==='highlight'){
      ctx.strokeStyle=color;
      ctx.globalAlpha=.35;
      ctx.lineWidth=Math.max(12,size*3);
    } else if(tool==='eraser'){
      ctx.globalCompositeOperation='destination-out';
      ctx.strokeStyle='rgba(0,0,0,1)';
      ctx.lineWidth=Math.max(18,size*3);
    } else {
      ctx.strokeStyle=color;
      ctx.fillStyle=color;
      ctx.lineWidth=size;
    }
  }
  function resetContext(){
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
  }

  canvas.addEventListener('pointerdown', e=>{
    if(boardRole==='participant')return;
    if(!['pen','highlight','eraser','line','arrow','rect','circle'].includes(currentTool)) return;
    canvas.setPointerCapture(e.pointerId);
    const p=pos(e); startX=p.x; startY=p.y; drawing=true;
    saveState(); snapshot=ctx.getImageData(0,0,canvas.width,canvas.height);
    if(['pen','highlight','eraser'].includes(currentTool)){
      applyPenStyle(currentTool);ctx.beginPath();ctx.moveTo(p.x,p.y);
    }
  });
  let drawRAF=0, pendingPointer=null;
  function handlePointerMove(e){
    if(!drawing)return;
    const p=pos(e);
    if(['pen','highlight','eraser'].includes(currentTool)){
      ctx.lineTo(p.x,p.y);ctx.stroke();return;
    }
    resetContext();
    ctx.putImageData(snapshot,0,0);
    applyPenStyle(currentTool);
    const dx=p.x-startX,dy=p.y-startY;
    if(currentTool==='line'||currentTool==='arrow'){
      ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(p.x,p.y);ctx.stroke();
      if(currentTool==='arrow'){
        const a=Math.atan2(dy,dx),len=14;
        ctx.beginPath();ctx.moveTo(p.x,p.y);
        ctx.lineTo(p.x-len*Math.cos(a-Math.PI/6),p.y-len*Math.sin(a-Math.PI/6));
        ctx.lineTo(p.x-len*Math.cos(a+Math.PI/6),p.y-len*Math.sin(a+Math.PI/6));
        ctx.closePath();ctx.fill();
      }
    } else if(currentTool==='rect'){
      ctx.strokeRect(startX,startY,dx,dy);
    } else if(currentTool==='circle'){
      ctx.beginPath();ctx.ellipse(startX+dx/2,startY+dy/2,Math.abs(dx/2),Math.abs(dy/2),0,0,Math.PI*2);ctx.stroke();
    }
  }
  canvas.addEventListener('pointermove', e=>{
    if(!drawing)return;
    pendingPointer=e;
    if(drawRAF)return;
    drawRAF=requestAnimationFrame(()=>{
      drawRAF=0;
      const ev=pendingPointer;
      pendingPointer=null;
      if(ev) handlePointerMove(ev);
    });
  });
  canvas.addEventListener('pointerup',()=>{drawing=false;resetContext();});

  function makeDraggable(el){

      const r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;
      el.setPointerCapture(e.pointerId);

      const r=overlay.getBoundingClientRect();

      el.style.top=((e.clientY-r.top)/zoom-(oy/zoom))+'px';

  function compressBoardImage(file,maxSide=700,quality=.72){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onerror=reject;
      reader.onload=()=>{
        const img=new Image();
        img.onerror=reject;
        img.onload=()=>{
          const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
          const out=document.createElement('canvas');
          out.width=Math.max(1,Math.round(img.naturalWidth*scale));
          out.height=Math.max(1,Math.round(img.naturalHeight*scale));
          const ox=out.getContext('2d');
          ox.drawImage(img,0,0,out.width,out.height);
          resolve({
            src:out.toDataURL('image/jpeg',quality),
            width:out.width,
            height:out.height
          });
        };
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function drawExportBackground(o,w,h){
    o.fillStyle=bg==='dark'?'#26362f':'#ffffff';
    o.fillRect(0,0,w,h);
    if(bg==='grid'){
      o.strokeStyle='#e5e7eb';o.lineWidth=1;
      for(let x=0;x<w;x+=32){o.beginPath();o.moveTo(x,0);o.lineTo(x,h);o.stroke();}
      for(let y=0;y<h;y+=32){o.beginPath();o.moveTo(0,y);o.lineTo(w,y);o.stroke();}
    } else if(bg==='lines'){
      o.strokeStyle='#e2e8f0';o.lineWidth=1;
      for(let y=32;y<h;y+=32){o.beginPath();o.moveTo(0,y);o.lineTo(w,y);o.stroke();}
    }
  }
  function wrapText(o,text,x,y,maxWidth,lineHeight){
    const words=[...String(text)];
    let line='';
    for(const ch of words){
      const test=line+ch;
      if(o.measureText(test).width>maxWidth && line){
        o.fillText(line,x,y);line=ch;y+=lineHeight;
      } else line=test;
    }
    if(line)o.fillText(line,x,y);
  }
  async function drawObjectsForExport(o){
    for(const el of [...overlay.children]){
      const x=parseFloat(el.style.left)||0, y=parseFloat(el.style.top)||0;
      if(el.classList.contains('note')){
        const w=el.offsetWidth||180,h=el.offsetHeight||110;
        o.fillStyle='#fff1a8';o.strokeStyle='#e6d170';o.lineWidth=1;
        o.fillRect(x,y,w,h);o.strokeRect(x,y,w,h);
        o.fillStyle='#333';o.font='16px sans-serif';
        wrapText(o,el.querySelector('textarea')?.value||'',x+10,y+24,w-20,22);
      } else if(el.classList.contains('textbox')){
        o.fillStyle=bg==='dark'?'#fff':'#222';o.font='20px sans-serif';
        o.fillText(el.querySelector('input')?.value||'',x+4,y+22);
      } else if(el.tagName==='IMG'){
        const img=el;
        if(!img.complete) await new Promise(res=>{img.onload=res;img.onerror=res;});
        const w=img.offsetWidth||img.naturalWidth||200,h=img.offsetHeight||img.naturalHeight||150;
        try{o.drawImage(img,x,y,w,h);}catch(_){}
      }
    }
  }

  function renderClassifyTemplate(data){
    const title=String(data?.title||'分類活動');
    const count=Math.max(2,Math.min(5,Number(data?.count)||2));
    let labels=Array.isArray(data?.labels)?data.labels.map(s=>String(s).trim()).filter(Boolean):[];
    while(labels.length<count)labels.push(`分類 ${labels.length+1}`);
    if(!drawTitle(title))return false;
    const x=40,y=110,w=canvas.width-80,h=400,col=w/count,headH=58;
    ctx.lineWidth=2;
    ctx.strokeRect(x,y,w,h);
    ctx.fillStyle=bg==='dark'?'rgba(255,255,255,.08)':'rgba(143,111,97,.08)';
    ctx.fillRect(x,y,w,headH);
    ctx.fillStyle=bg==='dark'?'#fff':'#333';
    ctx.font='700 20px sans-serif';
    for(let i=0;i<count;i++){
      if(i>0){ctx.beginPath();ctx.moveTo(x+i*col,y);ctx.lineTo(x+i*col,y+h);ctx.stroke();}
      const label=labels[i];
      const tw=ctx.measureText(label).width;
      ctx.fillText(label,x+i*col+Math.max(12,(col-tw)/2),y+36);
    }
    return true;
  }

  function renderMatchTemplate(data){
    const title=String(data?.title||'配對活動');
    const left=String(data?.left||'題目');
    const right=String(data?.right||'答案');
    const count=Math.max(3,Math.min(6,Number(data?.count)||4));

    if(!drawTitle(title))return false;

    const mid=canvas.width/2;
    const top=132;
    const boxW=Math.min(300,canvas.width*0.34);
    const boxH=54;
    const gap=18;

    ctx.font='700 19px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(left,60+boxW/2,104);
    ctx.fillText(right,mid+40+boxW/2,104);
    ctx.textAlign='left';

    for(let i=0;i<count;i++){
      const y=top+i*(boxH+gap);
      ctx.strokeRect(60,y,boxW,boxH);
      ctx.strokeRect(mid+40,y,boxW,boxH);

      ctx.beginPath();
      ctx.arc(60+boxW+12,y+boxH/2,4,0,Math.PI*2);
      ctx.arc(mid+28,y+boxH/2,4,0,Math.PI*2);
      ctx.fill();
    }

    ctx.font='500 15px sans-serif';
    ctx.fillStyle=bg==='dark'?'#ddd':'#777';
    ctx.fillText('可拖曳文字、便利貼或圖片進行配對',60,top+count*(boxH+gap)+12);

    return true;
  }

    if(dir==='down'){
      ctx.fillStyle=bg==='dark'?'#ddd':'#777';
      ctx.fillText('最優先／最高',90,105);

      for(let i=0;i<count;i++){

        ctx.arc(68,y+26,20,0,Math.PI*2);

        ctx.fillStyle=bg==='dark'?'#fff':'#333';
        ctx.textAlign='center';
        ctx.fillText(`${i+1}`,68,y+32);
        ctx.textAlign='left';
      }

      ctx.fillStyle=bg==='dark'?'#ddd':'#777';
      ctx.fillText('較後／較低',90,125+count*72+8);

    }else{
      const gap=14;
      const x=40;
      const y=180;
      const ww=(canvas.width-80-gap*(count-1))/count;
      const hh=180;

      for(let i=0;i<count;i++){
        const xx=x+i*(ww+gap);

        ctx.fillStyle=bg==='dark'?'#fff':'#333';
        ctx.textAlign='center';
        ctx.fillText(`${i+1}`,xx+ww/2,y-14);
        ctx.textAlign='left';
      }
    }

    const left=70;

    const gap=18;
    const totalW=right-left;
    const boxW=Math.max(92,Math.min(155,(totalW-gap*(count-1))/count));

    const usedW=boxW*count+gap*(count-1);
    const startX=(canvas.width-usedW)/2;

    for(let i=0;i<count;i++){
      const x=startX+i*(boxW+gap);

      ctx.strokeRect(x,y,boxW,boxH);

      ctx.fillStyle=bg==='dark'?'#fff':'#333';
      ctx.textAlign='center';
      ctx.fillText(`步驟 ${i+1}`,x+boxW/2,y+31);

      if(i<count-1){
        const ax=x+boxW+4;
        const bx=x+boxW+gap-4;
        const ay=y+boxH/2;

        ctx.beginPath();
        ctx.moveTo(ax,ay);
        ctx.lineTo(bx,ay);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(bx-7,ay-5);
        ctx.lineTo(bx,ay);
        ctx.lineTo(bx-7,ay+5);
        ctx.stroke();
      }
    }

    ctx.textAlign='left';
    ctx.font='500 15px sans-serif';
    ctx.fillStyle=bg==='dark'?'#ddd':'#777';
    ctx.fillText('可將便利貼、文字或圖片拖到各步驟中排列流程。',startX,y+boxH+38);

    return true;
  }

  function createFlow(){
    const data={
      type:'flow',
      title:cfg('cfgTitle','流程活動'),
      count:Math.max(3,Math.min(7,Number(cfg('cfgCount','5'))))
    };

    const ok=renderFlowTemplate(data);

    if(ok && boardRole==='host'){
      sendBoard('board_template_set',data);
    }

    return ok;
  }

  function renderQuadTemplate(data){
    const title=String(data?.title||'四象限活動');
    const x1=String(data?.x1||'低');
    const x2=String(data?.x2||'高');
    const y1=String(data?.y1||'低');
    const y2=String(data?.y2||'高');
    const q=[
      String(data?.q1||''),
      String(data?.q2||''),
      String(data?.q3||''),
      String(data?.q4||'')
    ];

    if(!drawTitle(title))return false;

    const left=90;
    const top=125;
    const right=canvas.width-80;
    const bottom=canvas.height-120;
    const cx=(left+right)/2;
    const cy=(top+bottom)/2;

    ctx.strokeStyle=bg==='dark'?'#fff':'#666';
    ctx.lineWidth=2;

    ctx.strokeRect(left,top,right-left,bottom-top);

    ctx.beginPath();
    ctx.moveTo(cx,top);
    ctx.lineTo(cx,bottom);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(left,cy);
    ctx.lineTo(right,cy);
    ctx.stroke();

    ctx.fillStyle=bg==='dark'?'#fff':'#333';
    ctx.font='600 17px sans-serif';

    ctx.fillText(x1,left,cy+28);
    ctx.fillText(x2,right-ctx.measureText(x2).width,cy+28);
    ctx.fillText(y2,cx+12,top+20);
    ctx.fillText(y1,cx+12,bottom-10);

    ctx.font='700 18px sans-serif';

    if(q[0])ctx.fillText(q[0],left+20,top+34);
    if(q[1])ctx.fillText(q[1],cx+20,top+34);
    if(q[2])ctx.fillText(q[2],left+20,cy+34);
    if(q[3])ctx.fillText(q[3],cx+20,cy+34);

    ctx.font='500 14px sans-serif';
    ctx.fillStyle=bg==='dark'?'#ddd':'#777';
    ctx.fillText('可拖曳便利貼、文字或圖片到不同象限。',left,bottom+28);

    return true;
  }

  function createQuad(){
    const data={
      type:'quad',
      title:cfg('cfgTitle','四象限活動'),
      x1:cfg('cfgX1','低'),
      x2:cfg('cfgX2','高'),
      y1:cfg('cfgY1','低'),
      y2:cfg('cfgY2','高'),
      q1:cfg('cfgQ1',''),
      q2:cfg('cfgQ2',''),
      q3:cfg('cfgQ3',''),
      q4:cfg('cfgQ4','')
    };

    const ok=renderQuadTemplate(data);

    if(ok && boardRole==='host'){
      sendBoard('board_template_set',data);
    }

    return ok;
  }

  function renderImageMarkTemplate(data){
    const title=String(data?.title||'圖片標註活動');
    const prompt=String(data?.prompt||'請圈出重點、畫箭頭，或貼便利貼說明你的發現。');
    if(!drawTitle(title))return false;
    ctx.font='500 18px sans-serif';
    ctx.fillStyle=bg==='dark'?'#fff':'#333';
    ctx.fillText(prompt,50,96);
    const x=70,y=135,w=canvas.width-140,h=canvas.height-245;
    ctx.setLineDash([8,6]);
    ctx.strokeStyle=bg==='dark'?'#aaa':'#aaa';
    ctx.strokeRect(x,y,w,h);
    ctx.setLineDash([]);
    ctx.font='600 18px sans-serif';
    ctx.fillStyle=bg==='dark'?'#ddd':'#666';
    ctx.textAlign='center';
    ctx.fillText('⬆ 可加入圖片，再用文字／便利貼進行標註',x+w/2,y+h/2-8);
    ctx.font='500 15px sans-serif';
    ctx.fillText('適合：找危險、食品標示判讀、服裝觀察、洗標辨識',x+w/2,y+h/2+22);
    ctx.textAlign='left';
    return true;
  }

  function createImageMark(){
    const data={
      type:'imageMark',
      title:cfg('cfgTitle','圖片標註活動'),
      prompt:cfg('cfgPrompt','請圈出重點、畫箭頭，或貼便利貼說明你的發現。')
    };
    const ok=renderImageMarkTemplate(data);
    if(ok && boardRole==='host')sendBoard('board_template_set',data);
    return ok;
  }

  function renderDecisionTemplate(data){
    const title=String(data?.title||'選擇決策');
    const count=Math.max(2,Math.min(4,Number(data?.count)||3));
    const criteria=Array.isArray(data?.criteria)?data.criteria.map(s=>String(s)).filter(Boolean).slice(0,6):['價格','需求','耐用','喜好'];
    if(!drawTitle(title))return false;
    const x=45,y=125,w=canvas.width-90,labelW=145,col=(w-labelW)/count,rowH=58;
    const rows=criteria.length+2;
    ctx.strokeStyle=bg==='dark'?'#fff':'#666';
    ctx.fillStyle=bg==='dark'?'rgba(255,255,255,.06)':'rgba(143,111,97,.07)';
    ctx.fillRect(x,y,w,rowH);
    ctx.fillStyle=bg==='dark'?'#fff':'#333';
    ctx.font='700 17px sans-serif';
    for(let i=0;i<=rows;i++){const yy=y+i*rowH;ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke();}
    [x,x+labelW,...Array.from({length:count},(_,i)=>x+labelW+(i+1)*col)].forEach(xx=>{
      ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx,y+rows*rowH);ctx.stroke();
    });
    ctx.fillText('評估面向',x+18,y+36);
    for(let i=0;i<count;i++)ctx.fillText(`方案 ${i+1}`,x+labelW+i*col+14,y+36);
    criteria.forEach((c,i)=>ctx.fillText(c,x+12,y+(i+1)*rowH+36));
    ctx.fillText('我的選擇',x+12,y+(criteria.length+1)*rowH+36);
    ctx.font='500 14px sans-serif';
    ctx.fillStyle=bg==='dark'?'#ddd':'#777';
    ctx.fillText('可在表格中加入文字或便利貼，最後記錄決定。',x,y+rows*rowH+28);
    return true;
  }

  function createDecision(){
    const data={
      type:'decision',
      title:cfg('cfgTitle','選擇決策'),
      count:Math.max(2,Math.min(4,Number(cfg('cfgCount','3')))),
      criteria:cfg('cfgCriteria','價格｜需求｜耐用｜喜好').split('｜').map(s=>s.trim()).filter(Boolean).slice(0,6)
    };
    const ok=renderDecisionTemplate(data);
    if(ok && boardRole==='host')sendBoard('board_template_set',data);
    return ok;
  }

  function renderTaskTemplate(data){
    const title=String(data?.title||'今日任務');
    const task=String(data?.task||'請完成今天的任務。');
    if(!drawTitle(title))return false;
    const x=70,y=130,w=canvas.width-140,h=Math.min(300,canvas.height-220);
    ctx.strokeStyle=bg==='dark'?'#ddd':'#8f6f61';
    ctx.lineWidth=2;
    ctx.strokeRect(x,y,w,h);
    ctx.fillStyle=bg==='dark'?'rgba(255,255,255,.05)':'rgba(255,253,249,.85)';
    ctx.fillRect(x,y,w,h);
    ctx.fillStyle=bg==='dark'?'#fff':'#333';
    ctx.font='800 20px sans-serif';
    ctx.fillText('📋 任務內容',x+24,y+42);
    ctx.font='500 18px sans-serif';
    const maxW=w-48;
    const chars=[...task];
    let line='', yy=y+82;
    for(const ch of chars){
      const test=line+ch;
      if(ctx.measureText(test).width>maxW && line){
        ctx.fillText(line,x+24,yy); line=ch; yy+=30;
      }else line=test;
    }
    if(line)ctx.fillText(line,x+24,yy);
    ctx.font='500 14px sans-serif';
    ctx.fillStyle=bg==='dark'?'#ddd':'#777';
    ctx.fillText('可使用便利貼、文字或圖片共同完成任務。',x+24,y+h-24);
    return true;
  }

  function createTask(){
    const data={
      type:'task',
      title:cfg('cfgTitle','今日任務'),
      task:cfg('cfgTask','請在這裡輸入任務內容……')
    };
    const ok=renderTaskTemplate(data);
    if(ok && boardRole==='host')sendBoard('board_template_set',data);
    return ok;
  }

  document.getElementById('createActivityBtn').addEventListener('click',()=>{
    const creators={
      classify:createClassify, match:createMatch, sort:createSort, flow:createFlow,
      quad:createQuad, imageMark:createImageMark, decision:createDecision, task:createTask
    };
    const fn=creators[currentActivity];
    if(fn){
      const ok=fn();
      if(ok!==false){
        showToast('活動板已建立完成');
        document.getElementById('activityConfigPanel').classList.remove('open');
        document.querySelectorAll('.activity-btn').forEach(b=>b.classList.remove('active-activity'));
      }
    }
  });

  document.getElementById('backClassroom').onclick=()=>{
    if(boardRole==='participant'){
      sessionStorage.setItem('board_auto_suppress_until',String(Date.now()+15000));
      location.href=`/join?room=${encodeURIComponent(roomCode)}&name=${encodeURIComponent(displayName)}`;
      return;
    }

    // 正常情況：主持端白板是從互動教室另開的分頁，直接關閉即可回到仍在線的互動教室。
    if(window.opener && !window.opener.closed){
      try{ window.opener.focus(); }catch{}
      window.close();
      return;
    }

    // 若瀏覽器阻擋新分頁而使用同頁開啟，則帶著房號回主持端。
    location.href=`/host?room=${encodeURIComponent(roomCode)}`;
  };
  document.getElementById('toggleBoardLock').onclick=()=>{ boardLocked=!boardLocked;sendBoard('board_lock',{locked:boardLocked});applyBoardPermission(); };
  document.getElementById('closeBoard').onclick=()=>{
    if(!confirm('要結束目前互動白板嗎？'))return;
    sendBoard('board_close');
    setTimeout(()=>{
      if(window.opener && !window.opener.closed){
        try{window.opener.focus();}catch{}
        window.close();
      }else{
        location.href=`/host?room=${encodeURIComponent(roomCode)}`;
      }
    },220);
  };
  if(boardRole==='participant'){
    document.querySelectorAll('.teacher-only').forEach(x=>x.style.display='none');
  }
  applyBackground();
  renderTimer();
  renderSW();
  updateSeatStatus();

  function initializeBoardSurface(){
    const ready=document.getElementById('boardReadyPill');
    if(ready)ready.textContent='白板初始化中…';

    requestAnimationFrame(()=>{
      resizeCanvas();

      // 桌機版 grid / flex 完成後再量一次，避免第一次取得 0 或錯誤高度。
      setTimeout(()=>{
        resizeCanvas();
        const rect=wrap.getBoundingClientRect();
        if(ready){
          ready.textContent=`✅ 白板已就緒｜${Math.round(rect.width)}×${Math.round(rect.height)}`;
        }
      },120);
    });
  }

  initializeBoardSurface();
})();
</script>

</body>
</html>
