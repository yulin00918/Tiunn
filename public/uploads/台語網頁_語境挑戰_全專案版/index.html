<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#f9faf7,#eef3ef);color:#2e4038}
.app{max-width:1100px;margin:auto;padding:42px 22px 70px}a{text-decoration:none;color:inherit}
.hero{text-align:center;padding:20px 0 34px}.hero .tag{display:inline-block;background:#e4ece7;color:#567063;border-radius:999px;padding:8px 14px;font-weight:900}
.hero h1{font-size:clamp(38px,6vw,58px);margin:14px 0 8px}.hero p{font-size:18px;color:#708079}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:18px}.stat{background:#fff;border:1px solid #dfe6e1;border-radius:16px;padding:12px 18px;font-weight:900}
.publisher{margin-top:28px}.publisher h2{font-size:28px;margin:0 0 12px}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.book{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e0e6e2;border-radius:20px;padding:22px;box-shadow:0 8px 24px #30403910}
.book:hover{transform:translateY(-2px);transition:.15s}.book-title{font-size:22px;font-weight:900}.meta{color:#7b8882;margin-top:4px}.go{font-weight:900;color:#648779;white-space:nowrap}
.note{margin-top:34px;background:#fff;border:1px solid #e0e6e2;border-radius:18px;padding:20px;line-height:1.7;color:#64736c}
@media(max-width:800px){.books{grid-template-columns:1fr 1fr}}@media(max-width:520px){.books{grid-template-columns:1fr}}
