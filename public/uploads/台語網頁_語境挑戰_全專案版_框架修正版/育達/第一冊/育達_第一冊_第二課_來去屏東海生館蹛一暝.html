<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#fbfaf7;--card:#fff;--text:#2f3a36;--muted:#6d7b75;--line:#e7e4dc;--green:#5f8f7b;--orange:#c88957;--shadow:0 10px 28px rgba(40,50,45,.08);--radius:24px}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#fbfaf7,#f4f6f2);color:var(--text)}button,textarea{font:inherit}.app{max-width:1180px;margin:auto;padding:28px 22px 60px}
.top{display:flex;justify-content:space-between;margin-bottom:24px}.pill{border:0;background:#fff;border-radius:999px;padding:10px 16px;box-shadow:var(--shadow);cursor:pointer}
.hero,.title{text-align:center}.hero h1{font-size:clamp(34px,5vw,54px);margin:8px 0}.hero p,.title p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}.level{text-align:center}.num{font-weight:900;color:#b9b4aa}.icon{font-size:42px}.btn{width:100%;border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;background:#31443c;color:white}
.hidden{display:none!important}.quiz{max-width:850px;margin:auto}.bar{height:12px;background:#e9ece8;border-radius:999px;overflow:hidden}.fill{height:100%;background:#6f8f7b;width:0}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:8px 0 14px}
.qcard{padding:34px}.kicker{font-weight:800;color:#9b7657}.q{font-size:clamp(23px,3vw,34px);font-weight:800;line-height:1.55;margin:10px 0 24px}.opts{display:grid;gap:12px}
.opt{text-align:left;border:1px solid #dde3de;border-radius:16px;background:#fff;padding:16px 18px;cursor:pointer;font-weight:700}.correct{background:#edf8f1;border-color:#9bc4a9}.wrong{background:#fff0ef;border-color:#d9a09a}
.fb{margin-top:18px;border-radius:16px;padding:16px 18px;line-height:1.6}.ok{background:#edf8f1}.hint{background:#fff8e9}.bad{background:#fff0ef}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.actions .btn{width:auto;min-width:150px}
.seq{display:grid;gap:10px}.seqitem{display:flex;gap:10px;align-items:center;border:1px solid #dde3de;border-radius:14px;padding:12px}.seqitem span{flex:1;font-weight:800}.seqitem button{border:0;background:#eef1ee;border-radius:10px;padding:8px 10px}
textarea{width:100%;min-height:120px;border:1px solid #ddd;border-radius:16px;padding:14px}.result{max-width:720px;margin:auto;text-align:center}.score{font-size:64px;font-weight:900;color:#5f8f7b}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app">
<div class="top"><button class="pill" onclick="location.href='index.html'">← 返回整冊</button><button class="pill">📕 育達・第一冊</button></div>
<section id="lesson"><div class="hero"><h1>🐠 第2課｜來去屏東海生館蹛一暝</h1><p><b>海生館蹛一暝：行程、海洋生物佮難忘記持</b></p><p>課文語詞 × 語境運用 × 閱讀理解 × 綜合挑戰</p></div>
<div class="grid">
<article class="card level"><div class="num">01</div><div class="icon">🔤</div><h3>課文語詞</h3><p>認捌本課重要詞</p><button class="btn" onclick="start('vocab')">開始 →</button></article>
<article class="card level"><div class="num">02</div><div class="icon">💭</div><h3>語境選詞</h3><p>看情境真正會用</p><button class="btn" onclick="start('context')">開始 →</button></article>
<article class="card level"><div class="num">03</div><div class="icon">📖</div><h3>讀文理解</h3><p>揣線索讀懂文章</p><button class="btn" onclick="start('reading')">開始 →</button></article>
<article class="card level"><div class="num">04</div><div class="icon">🏆</div><h3>綜合挑戰</h3><p>課文 × 生活應用</p><button class="btn" onclick="start('comprehensive')">開始 →</button></article>
</div></section>
<section id="quiz" class="hidden quiz"><div class="title"><h2 id="qt"></h2><p>每回合隨機抽 5 題</p></div><div class="bar"><div class="fill" id="fill"></div></div><div class="meta"><span id="count"></span><span id="scoreNow"></span></div><article class="card qcard" id="qcard"></article></section>

</div><script>
const B={"vocab": [{"word": "歇熱", "q": "「歇熱」是啥物意思？", "opts": ["放暑假", "放寒假", "下課"], "ans": 0, "hint": "教材註解直接說明。", "explain": "「歇熱」就是放暑假。"}, {"word": "磕袂著", "q": "「磕袂著就三十七度」的「磕袂著」較接近：", "opts": ["動不動、說不定就", "完全不會", "一定"], "ans": 0, "hint": "想氣溫一下就升高。", "explain": "這裡表示動不動、很容易就到三十七度。"}, {"word": "熁", "q": "「日頭誠熁」是咧講：", "opts": ["非常炎熱", "非常寒冷", "風真大"], "ans": 0, "hint": "七月愛補充水份。", "explain": "「熁」在本課形容炎熱。"}, {"word": "蹛", "q": "「蹛一暝」的「蹛」是：", "opts": ["居住、停留", "奔跑", "購買"], "ans": 0, "hint": "海生館過夜。", "explain": "「蹛」有居住、停留的意思。"}, {"word": "衝", "q": "課文「上衝的海底磅空」的「衝」較接近：", "opts": ["熱門、搶手", "安靜", "便宜"], "ans": 0, "hint": "因為暑假早就賣完。", "explain": "依課文語境，是熱門、搶手。"}, {"word": "磅空", "q": "「海底磅空」是：", "opts": ["海底隧道", "海邊沙灘", "山洞"], "ans": 0, "hint": "住宿區域名稱。", "explain": "本課指海底隧道區。"}, {"word": "魴魚", "q": "課文的「魴魚」是：", "opts": ["魟魚", "鯨魚", "鮪魚"], "ans": 0, "hint": "教材註解有「魟魚」。", "explain": "「魴魚」即魟魚，另有「魴仔、魴仔魚」之稱。"}, {"word": "箍一輾", "q": "導覽員𤆬逐家「箍一輾」，意思是：", "opts": ["繞一圈", "坐一站", "吃一餐"], "ans": 0, "hint": "教材直接註解。", "explain": "「箍一輾」就是繞一圈。"}, {"word": "𢯾", "q": "「𢯾棉襀被」的「𢯾」是：", "opts": ["緊抱", "丟掉", "摺好"], "ans": 0, "hint": "教材註解為緊抱。", "explain": "「𢯾」就是緊抱。"}, {"word": "記持", "q": "「難忘的記持」是：", "opts": ["記憶", "禮物", "照片"], "ans": 0, "hint": "課文結尾。", "explain": "「記持」就是記憶。"}], "context": [{"word": "熁", "q": "七月的日頭誠＿＿＿＿，出門愛會記得啉水。", "opts": ["熁", "記持", "箍一輾"], "ans": 0, "hint": "和炎熱有關。", "explain": "此處應用「熁」。"}, {"word": "蹛", "q": "阿爸予公司派去美國出差，已經佇遐＿＿＿＿一個外月。", "opts": ["蹛", "魴魚", "磅空"], "ans": 0, "hint": "表示居住、停留。", "explain": "「蹛」可表示居住、停留。"}, {"word": "𢯾", "q": "小妹上愛彼隻尪仔，逐工攏愛＿＿＿＿咧睏。", "opts": ["𢯾", "熁", "歇熱"], "ans": 0, "hint": "是緊抱的動作。", "explain": "教材練習也用這個情境。"}, {"word": "下昏暗", "q": "＿＿＿＿我欲佮朋友去食暗頓。", "opts": ["下昏暗", "隔轉工", "歇熱"], "ans": 0, "hint": "今天晚上。", "explain": "「下昏暗」是今天晚上。"}, {"word": "隔轉工", "q": "昨昏落大雨，＿＿＿＿天氣就轉晴矣。", "opts": ["隔轉工", "磕袂著", "記持"], "ans": 0, "hint": "隔一天。", "explain": "「隔轉工」是隔天、第二天。"}, {"word": "磕袂著", "q": "隔壁彼對翁仔某＿＿＿＿就咧冤家。", "opts": ["磕袂著", "魴魚", "箍一輾"], "ans": 0, "hint": "表示動不動就。", "explain": "教材練習用「磕袂著」表示動不動就。"}, {"word": "記持", "q": "這擺畢業旅行予我留落足深的＿＿＿＿。", "opts": ["記持", "徛鵝", "歇熱"], "ans": 0, "hint": "難忘的回憶。", "explain": "「記持」表示記憶。"}, {"word": "箍一輾", "q": "導覽進前，老師先𤆬阮佇展場＿＿＿＿，熟似環境。", "opts": ["箍一輾", "蹛一暝", "熁"], "ans": 0, "hint": "繞一圈。", "explain": "「箍一輾」就是繞一圈。"}, {"word": "魴魚", "q": "佇海生館會使看著扁扁、翼仔大大的＿＿＿＿。", "opts": ["魴魚", "徛鵝", "海菜"], "ans": 0, "hint": "教材說魴魚即魟魚。", "explain": "答案是魴魚。"}, {"word": "歇熱", "q": "學生上期待的假期之一就是＿＿＿＿。", "opts": ["歇熱", "下昏暗", "磅空"], "ans": 0, "hint": "暑假。", "explain": "「歇熱」就是放暑假。"}], "reading": [{"type": "choice", "q": "作者為啥物會去海生館蹛一暝？", "opts": ["阿姨相招", "老師規定", "欲去比賽"], "ans": 0, "hint": "課文第一段。", "explain": "教材閱讀題明確指出是阿姨相招。"}, {"type": "choice", "q": "作者最後選臺灣水域館，主要是因為：", "opts": ["猶閣賰較濟位", "價數上俗", "離厝最近"], "ans": 0, "hint": "海底磅空賣了了。", "explain": "熱門區域已售完，因此選擇尚有較多位置的臺灣水域館。"}, {"type": "choice", "q": "下面佗一項毋是課文提著的海生館生物？", "opts": ["鰇魚", "鯊魚", "魴魚"], "ans": 0, "hint": "教材練習題。", "explain": "課文提到熱帶魚、珊瑚、魴魚、鯊魚、徛鵝等，沒有鰇魚。"}, {"type": "choice", "q": "作者印象上深的是啥物景象？", "opts": ["世界大欉的海菜佮日光照落來", "餐廳菜色", "售票口"], "ans": 0, "hint": "課文第二段。", "explain": "作者特別寫世界大欉海菜與光線像電影畫面。"}, {"type": "choice", "q": "導覽活動的作用是：", "opts": ["予逐家對陪伴歇暝的生物有較深了解", "教逐家煮飯", "教逐家泅水"], "ans": 0, "hint": "課文直接說明。", "explain": "專業導覽讓大家更了解當晚陪伴住宿的生物。"}, {"type": "choice", "q": "請選出較合理的行程順序。", "opts": ["報到→導覽解說→食暗頓→選所在睏→隔轉工看飼魚仔表演", "食暗頓→報到→看表演→導覽", "看表演→報到→睏"], "ans": 0, "hint": "教材有完整行程。", "explain": "課文依時間順序寫住宿活動。"}, {"type": "choice", "q": "本課是啥物文體？", "opts": ["記敘文", "說明書", "劇本"], "ans": 0, "hint": "課文介紹頁。", "explain": "教材指出本篇是一篇記敘文。"}, {"type": "choice", "q": "這篇文章主要按怎組織？", "opts": ["照時間順序分享難忘記持", "照字母順序", "只列生物名稱"], "ans": 0, "hint": "課文介紹頁。", "explain": "作者依時間順序記錄海生館住宿經驗。"}], "comprehensive": [{"type": "choice", "q": "若欲保護海洋生物，下面佗一項上符合教材建議？", "opts": ["減用塑膠欶管、參加淨灘", "增加一次性塑膠", "共垃圾擲落海"], "ans": 0, "hint": "談天說地頁。", "explain": "教材建議減少塑膠吸管、做海洋志工、清理海邊垃圾。"}, {"type": "choice", "q": "「下昏暗」和下面佗一个意思上接近？", "opts": ["暝時", "日時", "下晝"], "ans": 0, "hint": "教材練習題。", "explain": "「下昏暗」指今天晚上，和「暝時」最接近。"}, {"type": "choice", "q": "「昏昏去」是 AAB 形式。下面佗一个教材解釋做「四界走」？", "opts": ["溜溜去", "害害去", "煞煞去"], "ans": 0, "hint": "課堂練功夫。", "explain": "教材將「溜溜去」解作四處走。"}, {"type": "choice", "q": "臺灣南部常見的海岸地形，教材列的是：", "opts": ["珊瑚礁海岸", "岬灣海岸", "斷層海岸"], "ans": 0, "hint": "海岸地形圖。", "explain": "教材地圖標示南部為珊瑚礁海岸。"}, {"type": "choice", "q": "作者佇海生館蹛一暝，上尾感覺按怎？", "opts": ["創造一个難忘的記持", "真後悔", "完全無印象"], "ans": 0, "hint": "課文結尾。", "explain": "作者認為這是一段難忘的記憶。"}, {"type": "sequence", "title": "行程排序", "q": "請共下面內容排做正確順序。", "items": ["報到", "踅踅咧", "導覽解說", "食暗頓", "𢯾棉襀被", "選所在睏", "食早頓", "看飼魚仔表演"], "answer": ["報到", "踅踅咧", "導覽解說", "食暗頓", "𢯾棉襀被", "選所在睏", "食早頓", "看飼魚仔表演"], "hint": "照課文完整行程排列。", "explain": "這就是教材整理的完整行程。"}, {"type": "reflection", "title": "最後一題", "q": "海生館蹛一暝除了看生物，閣會予人學著啥物？請用一句話寫看覓。", "hint": "想想導覽、生態、環境保護。"}]};
const names={vocab:"🔤 課文語詞",context:"💭 語境選詞",reading:"📖 讀文理解",comprehensive:"🏆 綜合挑戰"};
let bank="",set=[],i=0,score=0,tries=0;
const $=id=>document.getElementById(id), sh=a=>[...a].sort(()=>Math.random()-.5);
function show(id){["lesson","quiz","result"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");scrollTo(0,0)}
function start(b){bank=b;i=0;score=0;let src=sh(B[b]);if(b==="comprehensive"){let r=src.find(q=>q.type==="reflection");let n=src.filter(q=>q.type!=="reflection").slice(0,4);set=r?[...n,r]:n.slice(0,5)}else set=src.slice(0,5);$("qt").textContent=names[b];show("quiz");render()}
function render(){tries=0;$("count").textContent=`第 ${i+1} / ${set.length} 題`;$("scoreNow").textContent=`目前 ${score} 分`;$("fill").style.width=`${(i/set.length)*100}%`;let q=set[i];let h=`<div class="kicker">${q.title||q.word||""}</div><div class="q">${q.q}</div>`;if(q.type==="sequence"){let a=sh(q.items);h+=`<div id="seq" class="seq">${a.map((x,k)=>`<div class="seqitem"><span>${x}</span><button onclick="mv(${k},-1)">↑</button><button onclick="mv(${k},1)">↓</button></div>`).join("")}</div><div class="actions"><button class="btn" onclick="checkSeq()">檢查順序</button></div>`}else if(q.type==="reflection"){h+=`<textarea id="txt" placeholder="請用一句話寫看覓……"></textarea><div class="actions"><button class="btn" onclick="reflect()">送出</button></div>`}else{h+=`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" onclick="choose(${k},this)">${String.fromCharCode(65+k)}｜${o}</button>`).join("")}</div>`}h+=`<div id="feedback"></div>`;$("qcard").innerHTML=h}
function fb(cls,t,next=false){$("feedback").innerHTML=`<div class="fb ${cls}">${t}</div>${next?'<div class="actions"><button class="btn" onclick="next()">下一題 →</button></div>':""}`}
function choose(k,el){let q=set[i];if(document.querySelector(".opt.correct"))return;tries++;if(k===q.ans){el.classList.add("correct");score++;fb("ok",`✅ 著矣！<br>${q.explain}`,true)}else{el.classList.add("wrong");if(tries===1)fb("hint",`🤔 閣想看覓！<br>${q.hint}`);else{document.querySelectorAll(".opt")[q.ans].classList.add("correct");fb("bad",`答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}`,true)}}}
function mv(k,d){let s=$("seq"),it=[...s.children],j=k+d;if(j<0||j>=it.length)return;if(d<0)s.insertBefore(it[k],it[j]);else s.insertBefore(it[j],it[k]);[...s.children].forEach((e,n)=>{let b=e.querySelectorAll("button");b[0].setAttribute("onclick",`mv(${n},-1)`);b[1].setAttribute("onclick",`mv(${n},1)`)})}
function checkSeq(){let q=set[i];tries++;let a=[...$("seq").children].map(x=>x.querySelector("span").textContent),ok=JSON.stringify(a)===JSON.stringify(q.answer);if(ok){score++;fb("ok",`✅ 順序著矣！<br>${q.explain}`,true)}else if(tries===1)fb("hint",`🤔 閣排看覓！<br>${q.hint}`);else fb("bad",`正確順序：<b>${q.answer.join(" → ")}</b><br>${q.explain}`,true)}
function reflect(){let t=($("txt").value||"").trim();if(!t)return fb("hint","請先寫一句你的想法。");score++;fb("ok","💬 收著你的想法矣！這題無標準答案，重點是共課文佮生活連起來。",true)}
function next(){i++;if(i>=set.length)finish();else render()}
function finish(){$("fill").style.width="100%";$("final").textContent=`${score} / ${set.length}`;$("msg").textContent=score===5?"🏆 語境高手！":score>=4?"🌟 語感真𠢕！":score>=3?"👍 愈來愈會曉！":"🌱 閣試一擺，會愈來愈熟。";show("result")}
</script></body></html>
