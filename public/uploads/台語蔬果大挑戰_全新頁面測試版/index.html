<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台語蔬果大挑戰｜第1回合</title>
<style>
:root{
  --green:#2f7d5a;--green-dark:#195b3c;--green-soft:#edf8f1;
  --orange:#f4a12a;--red:#d95a5a;--ink:#26352d;--muted:#718078;
  --line:#d9e9df;--panel:#fff;--bg:#f7fbf8;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);background:
  radial-gradient(circle at 12% 8%,#eef9f2 0,transparent 26%),
  linear-gradient(135deg,#f8fcfa,#fffaf0);min-height:100vh;
}
button{font:inherit}
.app{
  width:min(1220px,96vw);margin:18px auto 42px;
  display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;
}
.sidebar{
  background:#ffffffea;border:1px solid var(--line);border-radius:24px;
  padding:18px;align-self:start;position:sticky;top:16px;
}
.brand{font-size:22px;font-weight:900;color:var(--green-dark);margin-bottom:4px}
.brandSub{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:18px}
.sideTitle{font-weight:900;color:var(--green-dark);margin-bottom:10px}
.rounds{display:grid;gap:8px}
.roundBtn{
  border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 12px;
  display:flex;justify-content:space-between;align-items:center;font-weight:800;cursor:pointer
}
.roundBtn.active{background:var(--green);color:#fff;border-color:var(--green)}
.roundBtn.disabled{color:#99a39e;background:#f7f8f7}
.roundBtn.locked{opacity:.45;pointer-events:none}
.sideNote{margin-top:16px;padding:12px;border-radius:14px;background:var(--green-soft);
  font-size:13px;color:var(--muted);line-height:1.6}
.main{min-width:0}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px}
.header h1{font-size:clamp(28px,4vw,42px);margin:0;color:var(--green-dark)}
.header p{margin:4px 0 0;color:var(--muted);font-weight:700}
.badge{background:var(--green);color:#fff;border-radius:999px;padding:10px 16px;font-weight:900}
.card{
  background:#ffffffef;border:1px solid var(--line);border-radius:28px;
  padding:clamp(18px,3vw,30px);box-shadow:0 16px 42px rgba(45,90,66,.10)
}
.topline{display:flex;justify-content:space-between;gap:12px;font-weight:900}
.progress{height:12px;background:#edf2ef;border-radius:999px;overflow:hidden;margin:10px 0 20px}
.progress>div{height:100%;background:linear-gradient(90deg,#4d9d73,#75c697);transition:.25s}
.prompt{text-align:center;font-size:clamp(20px,2.7vw,27px);font-weight:900;margin:4px 0 14px}

/* 真正固定的 1:1 圖片框 */
.imageSquare{
  width:min(500px,88%);
  aspect-ratio:1 / 1;
  margin:0 auto 16px;
  border:2px solid #dfeee4;border-radius:24px;background:#fff;
  padding:14px;
  display:grid;place-items:center;
}
.imageSquare img{
  width:100%;height:100%;object-fit:contain;object-position:center;display:block;
}

.timerRow{display:flex;justify-content:center;align-items:center;gap:10px;margin:8px 0 14px}
.timer{
  width:70px;height:70px;border-radius:50%;display:grid;place-items:center;
  border:5px solid #65a981;color:var(--green);font-size:28px;font-weight:1000;background:#f5fbf7
}
.timer.idle{opacity:.35}.timer.warn{border-color:var(--orange);color:#a26910}
.timer.danger{border-color:var(--red);color:#a83e3e}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.btn{
  border:0;border-radius:16px;padding:13px 22px;background:var(--green);color:#fff;
  font-weight:900;cursor:pointer
}
.btn.orange{background:var(--orange)} .btn.secondary{background:#fff;color:var(--green);border:2px solid #91bda1}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:720px;margin:0 auto}
.choice{
  border:2px solid #cfe3d6;background:#fff;border-radius:20px;padding:18px 12px;
  min-height:86px;font-size:clamp(22px,3vw,31px);font-weight:900;color:var(--ink);cursor:pointer
}
.choice:hover{border-color:#76ad8d}.choice.correct{background:#e8f8ee;border-color:#5aa57a;color:#1d6241}
.choice.wrong{background:#fff0f0;border-color:#d78080;color:#8f4141}
.feedback{
  max-width:720px;margin:16px auto 0;border-radius:20px;padding:16px 18px;
  border:1px solid var(--line);background:#f9fcfa;text-align:center;display:none
}
.feedback.show{display:block}
.feedbackTitle{font-size:22px;font-weight:900;margin-bottom:10px}
.answerGrid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left
}
.answerItem{background:#fff;border:1px solid #dcebe1;border-radius:14px;padding:11px 13px}
.answerLabel{font-size:12px;font-weight:900;color:var(--muted);margin-bottom:3px}
.answerValue{font-size:20px;font-weight:900;color:var(--green-dark)}
.center{text-align:center}.hidden{display:none!important}
.rapidTag{display:inline-block;background:#fff1c9;color:#885600;border-radius:999px;padding:8px 14px;font-weight:900}
.done h2,.mid h2,.empty h2{font-size:clamp(30px,4vw,44px);margin:4px 0 12px}
.done p,.mid p,.empty p{color:var(--muted);font-weight:700}
@media(max-width:800px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static}
  .rounds{grid-template-columns:repeat(5,1fr)}
  .roundBtn{justify-content:center}.roundBtn span:last-child{display:none}
}
@media(max-width:560px){
  .rounds{grid-template-columns:repeat(2,1fr)}
  .header{align-items:flex-start;flex-direction:column}
  .choices{grid-template-columns:1fr}
  .answerGrid{grid-template-columns:1fr}
  .imageSquare{width:94%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">🥬🍉 台語蔬果大挑戰</div>
    <div class="brandSub">50題・10回合・每回合5題＋2題搶答</div>
    <div class="sideTitle">選擇回合</div>
    <div id="rounds" class="rounds"></div>
    <div class="sideNote">第1回合已完成測試題庫。第2～10回合加入題目後即可直接切換。</div>
  </aside>

  <main class="main">
    <header class="header">
      <div>
        <h1>第1回合</h1>
        <p>看圖選出正確的台羅拼音</p>
      </div>
      <div class="badge">5題＋2題搶答</div>
    </header>

    <section id="quiz" class="card">
      <div class="topline"><span id="qNo"></span><span id="score"></span></div>
      <div class="progress"><div id="bar"></div></div>
      <div class="prompt">看圖選出正確的台羅拼音</div>

      <div class="imageSquare"><img id="qImg" alt=""></div>

      <div class="timerRow"><div id="qTimer" class="timer idle">8</div><strong>秒</strong></div>

      <div id="startWrap" class="actions"><button id="startBtn" class="btn">▶ 開始作答</button></div>

      <div id="choices" class="choices hidden">
        <button id="aBtn" class="choice"></button>
        <button id="bBtn" class="choice"></button>
      </div>

      <!-- 前五題答對或時間到，都會在這裡顯示華語＋台文＋台羅 -->
      <div id="feedback" class="feedback">
        <div id="feedbackTitle" class="feedbackTitle"></div>
        <div class="answerGrid">
          <div class="answerItem"><div class="answerLabel">華語</div><div id="ansZh" class="answerValue"></div></div>
          <div class="answerItem"><div class="answerLabel">台文</div><div id="ansWord" class="answerValue"></div></div>
          <div class="answerItem"><div class="answerLabel">台羅</div><div id="ansRoman" class="answerValue"></div></div>
        </div>
      </div>

      <div class="actions"><button id="nextBtn" class="btn hidden">下一題 →</button></div>
    </section>

    <section id="mid" class="card mid center hidden">
      <h2>🎉 5題完成！</h2>
      <p>接下來進入搶答。</p>
      <button id="enterRapid" class="btn orange">⚡ 搶答時間</button>
    </section>

    <section id="rapid" class="card center hidden">
      <div class="rapidTag">⚡ 搶答時間</div>
      <h2 id="rNo"></h2>
      <div class="imageSquare"><img id="rImg" alt=""></div>
      <div class="timerRow"><div id="rTimer" class="timer idle">5</div><strong>秒</strong></div>
      <div id="rapidStartWrap" class="actions"><button id="rapidStart" class="btn orange">⚡ 開始搶答</button></div>

      <div id="rapidAnswer" class="feedback">
        <div class="feedbackTitle">答案</div>
        <div class="answerGrid">
          <div class="answerItem"><div class="answerLabel">華語</div><div id="rZh" class="answerValue"></div></div>
          <div class="answerItem"><div class="answerLabel">台文</div><div id="rWord" class="answerValue"></div></div>
          <div class="answerItem"><div class="answerLabel">台羅</div><div id="rRoman" class="answerValue"></div></div>
        </div>
      </div>

      <div class="actions">
        <button id="reveal" class="btn orange hidden">👀 公布答案</button>
        <button id="rapidNext" class="btn hidden">下一題 →</button>
      </div>
    </section>

    <section id="done" class="card done center hidden">
      <h2>🏆 第1回合完成</h2>
      <p>完成5題辨識＋2題搶答。</p>
      <div class="actions">
        <button id="again" class="btn secondary">↻ 再玩本回合</button>
        <button class="btn secondary">☰ 選其他回合</button>
      </div>
    </section>

    <section id="empty" class="card empty center hidden">
      <h2 id="emptyTitle">📚 尚未加入題庫</h2>
      <p>這個回合的版型已經準備好，之後補入5題即可使用。</p>
      <button id="back1" class="btn secondary">← 回第1回合</button>
    </section>
  </main>
</div>

<script>
const BANK=[
  {round:1,zh:"西瓜",word:"西瓜",roman:"si-kue",img:"images/watermelon.webp",opts:["si-kue","king-tsio"]},
  {round:1,zh:"青江菜",word:"湯匙仔菜",roman:"thng-sî-á-tshài",img:"images/bokchoy.webp",opts:["kue-á-nî","thng-sî-á-tshài"]},
  {round:1,zh:"番茄",word:"柑仔蜜",roman:"kam-á-bi̍t",img:"images/tomato.webp",opts:["kam-á-bi̍t","si-kue"]},
  {round:1,zh:"小黃瓜",word:"瓜仔哖",roman:"kue-á-nî",img:"images/cucumber.webp",opts:["thng-sî-á-tshài","kue-á-nî"]},
  {round:1,zh:"香蕉",word:"弓蕉",roman:"king-tsio",img:"images/banana.webp",opts:["king-tsio","kam-á-bi̍t"]}
];
const $=id=>document.getElementById(id);
let q=0,score=0,locked=false,timer=null,audio=null,rapid=[],ri=0,busy=false;

function audioOn(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume()}
function tone(f,d=.07,type="sine",v=.035,delay=0){audioOn();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d)}
function tick(){tone(950,.03,"square",.018)}
function ok(){tone(660,.08,"sine",.045);tone(880,.11,"sine",.045,.09)}
function no(){tone(210,.13,"sawtooth",.03);tone(160,.16,"sawtooth",.03,.11)}
function times(){tone(440,.1,"square",.035);tone(250,.2,"square",.035,.14)}
function stop(){if(timer){clearInterval(timer);timer=null}}
function countdown(seconds,el,onEnd){
  stop();let n=seconds;el.textContent=n;el.className="timer";tick();
  timer=setInterval(()=>{n--;el.textContent=n;el.className="timer"+(n<=2?" danger":n<=4?" warn":"");if(n>0)tick();if(n<=0){stop();times();onEnd()}},1000)
}
function setBusy(v){busy=v;drawRounds()}
function drawRounds(){
  $("rounds").innerHTML="";
  for(let r=1;r<=10;r++){
    let b=document.createElement("button");b.className="roundBtn "+(r===1?"active":"disabled")+(busy?" locked":"");
    b.innerHTML=`<span>第${r}回合</span><span>${r===1?"可玩":"待加入"}</span>`;
    b.addEventListener("click",()=>{if(busy)return;if(r===1)reset();else showEmpty(r)});
    $("rounds").appendChild(b)
  }
}
function showOnly(id){["quiz","mid","rapid","done","empty"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function fillAnswer(x,prefix="ans"){
  $(prefix+"Zh").textContent=x.zh;$(prefix+"Word").textContent=x.word;$(prefix+"Roman").textContent=x.roman
}
function render(){
  setBusy(false);locked=false;let x=BANK[q];
  $("qNo").textContent=`第 ${q+1} 題 / 5`;$("score").textContent=`答對 ${score} 題`;$("bar").style.width=`${(q+1)*20}%`;
  $("qImg").src=x.img;$("qImg").alt=x.zh;$("qTimer").textContent=8;$("qTimer").className="timer idle";
  $("aBtn").textContent=x.opts[0];$("bBtn").textContent=x.opts[1];["aBtn","bBtn"].forEach(id=>{$(id).className="choice";$(id).disabled=false});
  $("choices").classList.add("hidden");$("startWrap").classList.remove("hidden");$("feedback").classList.remove("show");$("nextBtn").classList.add("hidden");
}
function startQuestion(){
  audioOn();setBusy(true);$("startWrap").classList.add("hidden");$("choices").classList.remove("hidden");
  countdown(8,$("qTimer"),timeout)
}
function answer(val,btn){
  if(locked)return;let x=BANK[q];
  if(val===x.roman){
    stop();ok();locked=true;score++;btn.classList.add("correct");$("aBtn").disabled=$("bBtn").disabled=true;
    $("feedbackTitle").textContent="🎉 著矣！";fillAnswer(x);$("feedback").classList.add("show");$("score").textContent=`答對 ${score} 題`;
    $("nextBtn").classList.remove("hidden");setBusy(false)
  }else{
    no();btn.classList.add("wrong");setTimeout(()=>btn.classList.remove("wrong"),350)
  }
}
function timeout(){
  if(locked)return;locked=true;let x=BANK[q];$("aBtn").disabled=$("bBtn").disabled=true;
  $("feedbackTitle").textContent="⏰ 時間到！";fillAnswer(x);$("feedback").classList.add("show");$("nextBtn").classList.remove("hidden");setBusy(false)
}
function next(){
  stop();if(q<4){q++;render()}else{showOnly("mid");setBusy(false)}
}
function enterRapid(){
  rapid=[...BANK].sort(()=>Math.random()-.5).slice(0,2);ri=0;showOnly("rapid");renderRapid()
}
function renderRapid(){
  setBusy(false);let x=rapid[ri];$("rNo").textContent=`第 ${ri+1} 題 / 2`;$("rImg").src=x.img;$("rTimer").textContent=5;$("rTimer").className="timer idle";
  $("rapidStartWrap").classList.remove("hidden");$("rapidAnswer").classList.remove("show");$("reveal").classList.add("hidden");$("rapidNext").classList.add("hidden")
}
function startRapid(){
  audioOn();setBusy(true);$("rapidStartWrap").classList.add("hidden");$("reveal").classList.remove("hidden");countdown(5,$("rTimer"),revealRapid)
}
function revealRapid(){
  stop();let x=rapid[ri];$("rZh").textContent=x.zh;$("rWord").textContent=x.word;$("rRoman").textContent=x.roman;
  $("rapidAnswer").classList.add("show");$("reveal").classList.add("hidden");$("rapidNext").classList.remove("hidden");setBusy(false)
}
function nextRapid(){if(ri<1){ri++;renderRapid()}else{showOnly("done");setBusy(false)}}
function reset(){stop();q=0;score=0;ri=0;showOnly("quiz");render()}
function showEmpty(r){showOnly("empty");$("emptyTitle").textContent=`📚 第${r}回合尚未加入題庫`}
$("startBtn").addEventListener("click",startQuestion);
$("aBtn").addEventListener("click",e=>answer(BANK[q].opts[0],e.currentTarget));
$("bBtn").addEventListener("click",e=>answer(BANK[q].opts[1],e.currentTarget));
$("nextBtn").addEventListener("click",next);
$("enterRapid").addEventListener("click",enterRapid);
$("rapidStart").addEventListener("click",startRapid);
$("reveal").addEventListener("click",revealRapid);
$("rapidNext").addEventListener("click",nextRapid);
$("again").addEventListener("click",reset);
$("back1").addEventListener("click",reset);
drawRounds();render();
</script>
</body>
</html>
