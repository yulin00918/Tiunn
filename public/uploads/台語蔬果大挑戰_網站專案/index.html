<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>菜蔬果子大挑戰</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>🥬🍉 菜蔬果子大挑戰</h1>
        <p>看圖選出台羅</p>
      </div>
      <div id="roundBadge" class="badge">第1回合 · 5題</div>
    </header>

    <section id="quizPanel" class="panel">
      <div class="meta">
        <span id="qIndex"></span>
        <span id="scoreText"></span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>

      <h2 class="title">看圖選出正確的台羅拼音</h2>

      <div class="imageBox">
        <img id="quizImage" alt="">
      </div>

      <div id="timerArea" class="timerArea idle">
        <div id="quizTimer" class="timer">8</div>
        <span>秒</span>
      </div>

      <div id="startArea" class="actions">
        <button id="startQuestionBtn" class="btn">▶ 開始作答</button>
      </div>

      <div id="choices" class="choices hidden">
        <button id="choiceA" class="choice"></button>
        <button id="choiceB" class="choice"></button>
      </div>

      <div id="feedback" class="feedback">
        <div id="feedbackBig" class="feedbackBig"></div>
        <div id="feedbackDetail" class="feedbackDetail"></div>
      </div>

      <div class="actions">
        <button id="nextBtn" class="btn hidden">下一題 →</button>
      </div>
    </section>

    <section id="midPanel" class="panel hidden center">
      <h2>🎉 5題完成！</h2>
      <button id="enterRapidBtn" class="btn amber">⚡ 搶答時間！</button>
    </section>

    <section id="rapidPanel" class="panel hidden center">
      <div class="rapidTag">⚡ 搶答時間！</div>
      <h2 id="rapidIndex"></h2>

      <div class="imageBox">
        <img id="rapidImage" alt="">
      </div>

      <div id="rapidTimerArea" class="timerArea idle">
        <div id="rapidTimer" class="timer">5</div>
        <span>秒</span>
      </div>

      <div id="rapidStartArea" class="actions">
        <button id="startRapidBtn" class="btn amber">⚡ 開始搶答</button>
      </div>

      <div id="rapidAnswer" class="answer hidden">
        <div id="rapidWord" class="answerWord"></div>
        <div id="rapidRoman" class="answerRoman"></div>
        <div id="rapidZh" class="answerZh"></div>
      </div>

      <div class="actions">
        <button id="revealBtn" class="btn amber hidden">👀 公布答案</button>
        <button id="rapidNextBtn" class="btn hidden">下一題 →</button>
      </div>
    </section>

    <section id="donePanel" class="panel hidden center">
      <h2>🏆 第1回合完成</h2>
      <p>完成 5 題辨識＋2 題搶答。</p>
      <div class="actions">
        <button id="restartBtn" class="btn secondary">↻ 再耍一擺</button>
        <button class="btn" onclick="alert('之後會接第2回合')">第2回合 →</button>
      </div>
    </section>
  </main>

  <script src="data/questions.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
