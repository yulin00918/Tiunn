<html lang="zh-TW"><head><meta charset="UTF-8">


    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽獎活動</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gradient-start: #0369a1;
            --gradient-mid: #0284c7;
            --gradient-end: #38bdf8;
            --card-bg: rgba(255, 255, 255, 0.15);
            --card-border: rgba(255, 255, 255, 0.25);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --accent-gold: #fb923c;
            --accent-green: #2dd4bf;
            --shadow-color: rgba(0, 0, 0, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-mid) 50%, var(--gradient-end) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Desktop: 16:7 aspect ratio container */
        .app-container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: row;
            gap: 24px;
            min-height: 100vh;
        }

        @media (min-width: 1024px) {
            .app-container {
                aspect-ratio: 16 / 7;
                min-height: auto;
                height: calc(100vw * 7 / 16);
                max-height: 700px;
                align-items: stretch;
            }
        }

        /* Left Panel - Ball Pool */
        .left-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Right Panel - Controls */
        .right-panel {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--card-border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 32px var(--shadow-color);
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .panel-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--accent-gold);
            border-radius: 2px;
        }

        /* Ball Pool Area */
        .ball-pool-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .ball-pool {
            flex: 1;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.5) 100%);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 40px rgba(0,0,0,0.4);
            min-height: 200px;
        }

        @media (min-width: 1024px) {
            .ball-pool {
                min-height: 280px;
            }
        }

        .ball {
            position: absolute;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.75rem;
            color: #1a1a2e;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 
                inset -3px -3px 8px rgba(0,0,0,0.3),
                inset 3px 3px 8px rgba(255,255,255,0.4),
                0 4px 8px rgba(0,0,0,0.3);
            z-index: 1;
        }

        .ball.floating {
            /* Floating controlled by JavaScript */
        }

        .ball:hover {
            transform: scale(1.15);
            z-index: 10;
        }

        .ball.colliding {
            animation: none;
        }

        /* Spark effect */
        .spark {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 200;
        }

        @keyframes sparkAnim {
            0% { 
                transform: translate(0, 0) scale(1); 
                opacity: 1; 
            }
            100% { 
                transform: translate(var(--spark-x, 20px), var(--spark-y, -20px)) scale(0); 
                opacity: 0; 
            }
        }

        .ball.winner {
            animation: popOut 0.8s ease-out forwards;
            z-index: 100;
        }


        @keyframes popOut {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1.2); opacity: 0; }
        }

        /* Winner Display */
        .winner-section {
            background: linear-gradient(135deg, rgba(251,146,60,0.2) 0%, rgba(234,88,12,0.1) 100%);
            border: 2px solid rgba(251,146,60,0.4);
        }

        .winner-display {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 60px;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .winner-item {
            background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
            color: #1a1a2e;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: bounceIn 0.5s ease-out;
            box-shadow: 0 4px 12px rgba(251,146,60,0.4);
        }

        .winner-item .number {
            background: rgba(0,0,0,0.15);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Mode Selection */
        .mode-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .mode-tab {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid var(--card-border);
            background: transparent;
            color: var(--text-primary);
            border-radius: 12px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-tab:hover {
            background: rgba(255,255,255,0.1);
        }

        .mode-tab.active {
            background: var(--accent-gold);
            color: #1a1a2e;
            border-color: var(--accent-gold);
        }

        /* Input Areas */
        .input-group {
            margin-bottom: 6px;
        }

        .input-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="number"],
        select {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid var(--card-border);
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
            border-radius: 12px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent-gold);
            background: rgba(255,255,255,0.15);
        }

        input[type="number"]::placeholder {
            color: rgba(255,255,255,0.5);
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 2px solid var(--card-border);
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
            border-radius: 12px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.9rem;
            resize: none;
            outline: none;
        }

        .data-count {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Options */
        .option-group {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }

        .option-btn {
            flex: 1;
            padding: 8px 8px;
            border: 2px solid var(--card-border);
            background: transparent;
            color: var(--text-primary);
            border-radius: 12px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .option-btn.active {
            background: var(--accent-green);
            color: #1a1a2e;
            border-color: var(--accent-green);
        }

        .select-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .select-group label {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 16px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2dd4bf 0%, #0d9488 100%);
            color: #1a1a2e;
            box-shadow: 0 6px 20px rgba(45,212,191,0.4);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(45,212,191,0.5);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.15);
            color: var(--text-primary);
            border: 2px solid var(--card-border);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.25);
        }

        /* Ball Colors */
        .ball-color-1 { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%); }
        .ball-color-2 { background: linear-gradient(135deg, #4ecdc4 0%, #44a8a0 100%); }
        .ball-color-3 { background: linear-gradient(135deg, #ffe66d 0%, #ffd93d 100%); }
        .ball-color-4 { background: linear-gradient(135deg, #95e1d3 0%, #7ec8bc 100%); }
        .ball-color-5 { background: linear-gradient(135deg, #f38181 0%, #e66767 100%); }
        .ball-color-6 { background: linear-gradient(135deg, #aa96da 0%, #9681c4 100%); }
        .ball-color-7 { background: linear-gradient(135deg, #fcbad3 0%, #f5a3c4 100%); }
        .ball-color-8 { background: linear-gradient(135deg, #a8d8ea 0%, #93c9dc 100%); }

        /* Mobile Responsive */
        @media (max-width: 1023px) {
            .app-container {
                flex-direction: column;
                padding: 16px;
                gap: 16px;
            }

            .ball-pool {
                min-height: 240px;
            }

            .ball {
                width: 36px;
                height: 36px;
                font-size: 0.7rem;
            }

            .panel-title {
                font-size: 1rem;
            }

            .btn {
                padding: 12px 16px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 600px) {
            .ball-pool {
                min-height: 200px;
            }

            .ball {
                width: 32px;
                height: 32px;
                font-size: 0.65rem;
            }

            .option-group {
                flex-direction: column;
            }

            .mode-tabs {
                flex-direction: column;
            }
        }

        /* Small phone (6.2 inch and below, ~412px width) */
        @media (max-width: 430px) {
            .app-container {
                padding: 12px;
                padding-bottom: 80px;
            }

            .input-row {
                flex-wrap: wrap;
            }

            .input-row input[type="number"] {
                flex: 1 1 40%;
                min-width: 80px;
                padding: 8px 10px;
                font-size: 0.85rem;
            }

            .input-row span {
                flex: 0 0 auto;
            }

            /* Fixed bottom action buttons */
            .fixed-bottom-actions {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-mid) 100%);
                padding: 12px 16px;
                display: flex;
                gap: 10px;
                z-index: 100;
                box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
                border-top: 1px solid var(--card-border);
            }

            .action-buttons {
                display: none;
            }
        }

        /* Hide fixed bottom on larger screens */
        @media (min-width: 431px) {
            .fixed-bottom-actions {
                display: none !important;
            }
        }

        /* Confetti Animation */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 1000;
        }

        /* Hidden class */
        .hidden {
            display: none !important;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-mid) 100%);
            padding: 32px;
            border-radius: 24px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 3px solid var(--card-border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .modal-content h2 {
            font-size: 1.5rem;
            margin-bottom: 16px;
        }

        .modal-content p {
            margin-bottom: 24px;
            color: var(--text-secondary);
        }

        .modal-content .btn {
            width: 100%;
        }
    </style>
    <script>
        // 禁止右鍵選單
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
</head>

                            <button id="exampleBtn" onclick="toggleExample()" style="padding: 4px 12px; background: rgba(251,146,60,0.3); border: 1px solid rgba(251,146,60,0.5); border-radius: 6px; color: white; cursor: pointer; font-size: 0.8rem; font-weight: 600;">範例</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-title">🎯 抽獎設定</div>
                
                <div class="input-group">
                    <div class="option-group">
                        <button class="option-btn" data-repeat="true" onclick="setRepeat(true)">重複中獎</button>
                        <button class="option-btn active" data-repeat="false" onclick="setRepeat(false)">不重複中獎</button>
                    </div>
                </div>

                <div class="select-group">
                    <select id="winnerCount">
                        <!-- Options 1-30 will be generated -->
                    <option value="1">1 位</option><option value="2">2 位</option><option value="3">3 位</option><option value="4">4 位</option><option value="5">5 位</option><option value="6">6 位</option><option value="7">7 位</option><option value="8">8 位</option><option value="9">9 位</option><option value="10">10 位</option><option value="11">11 位</option><option value="12">12 位</option><option value="13">13 位</option><option value="14">14 位</option><option value="15">15 位</option><option value="16">16 位</option><option value="17">17 位</option><option value="18">18 位</option><option value="19">19 位</option><option value="20">20 位</option><option value="21">21 位</option><option value="22">22 位</option><option value="23">23 位</option><option value="24">24 位</option><option value="25">25 位</option><option value="26">26 位</option><option value="27">27 位</option><option value="28">28 位</option><option value="29">29 位</option><option value="30">30 位</option></select>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-secondary" onclick="resetGame()">重置</button>
                    <button class="btn btn-primary" id="startBtn" onclick="startDraw()">開始抽獎</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Fixed Bottom Actions for Small Phones -->
    <div class="fixed-bottom-actions">
        <button class="btn btn-secondary" onclick="resetGame()">重置</button>
        <button class="btn btn-primary" id="startBtnFixed" onclick="startDraw()">開始抽獎</button>
    </div>

    <!-- Modal -->
    <div class="modal-overlay hidden" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">提示</h2>
            <p id="modalMessage">訊息內容</p>
            <button class="btn btn-primary" onclick="closeModal()">確定</button>
        </div>
    </div>

    <script>
        // State
        let currentMode = 'number';
        let allowRepeat = false;
        let participants = [];
        let winners = [];
        let isDrawing = false;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Generate winner count options
            const select = document.getElementById('winnerCount');
            for (let i = 1; i <= 30; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `${i} 位`;
                select.appendChild(option);
            }

            // Add event listeners
            document.getElementById('minNumber').addEventListener('change', generateBalls);
            document.getElementById('maxNumber').addEventListener('change', generateBalls);
            document.getElementById('nameData').addEventListener('input', handleNameDataInput);

            // Initial ball generation
            generateBalls();
        });

        // Switch Mode
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.mode === mode);
            });
            document.getElementById('numberMode').classList.toggle('hidden', mode !== 'number');
            document.getElementById('nameMode').classList.toggle('hidden', mode !== 'name');
            
            winners = [];
            updateWinnerDisplay();
            
            if (mode === 'number') {
                generateBalls();
            } else {
                handleNameDataInput();
            }
        }

        // Set Repeat Option
        function setRepeat(repeat) {
            allowRepeat = repeat;
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.repeat === String(repeat));
            });
        }

        // Handle Name Data Input
        function handleNameDataInput() {
            const data = document.getElementById('nameData').value.trim();
            if (!data) {
                participants = [];
                document.getElementById('dataCount').textContent = '0';
                generateBalls();
                return;
            }

            const lines = data.split('\n').filter(line => line.trim());
            const parsed = [];
            
            for (let i = 0; i < lines.length; i++) {
                if (parsed.length >= 300) break;
                const line = lines[i].trim();
                // Use regex to split on first whitespace (space or tab)
                const match = line.match(/^(\S+)[\s\t]+(.*)$/);
                
                if (match) {
                    parsed.push({
                        number: match[1].trim(),
                        name: match[2].trim()
                    });
                } else {
                    // No whitespace found, treat entire line as number
                    parsed.push({
                        number: line,
                        name: ''
                    });
                }
            }

            participants = parsed;
            document.getElementById('dataCount').textContent = parsed.length;
            generateBalls();
        }

        // Toggle Example Data
        function toggleExample() {
            const nameDataTextarea = document.getElementById('nameData');
            const exampleBtn = document.getElementById('exampleBtn');
            
            if (exampleBtn.textContent === '範例') {
                // Insert example data
                const exampleData = `1	朱○潔
2	何○敏
3	何○寧
4	吳○亘
5	李○芯
6	卓○希
7	林○硯
8	林○筠
9	張○芸
10	許○涵
11	陳○妍
12	黃○蘊
13	楊○寧
14	葉○蓁
15	劉○瑄
16	蔡○蓁
17	賴○妤
18	謝○妡
19	王○崴
20	呂○聿
21	李○嘉
22	李○宇
23	沈○昕
24	林○叡
25	林○霖
26	林○亦
27	林○左
29	宋○芝
30	邱○恩
31	俞○呈
32	姚○豪
33	柯○育
34	洪○軒
35	徐○豪
36	許○愷
37	陳○蔚
38	陳○澤
39	黃○皓
40	劉○承
41	劉○淯
42	謝○宇`;
                nameDataTextarea.value = exampleData;
                exampleBtn.textContent = '清除';
                handleNameDataInput();
            } else {
                // Clear data
                nameDataTextarea.value = '';
                exampleBtn.textContent = '範例';
                handleNameDataInput();
            }
        }


        // Floating animation state
        let floatingInterval = null;
        let floatingBalls = [];

        // Generate Balls
        function generateBalls() {
            const pool = document.getElementById('ballPool');
            pool.innerHTML = '';
            
            // Stop previous floating animation
            stopFloatingAnimation();

            let items = [];

            if (currentMode === 'number') {
                const min = parseInt(document.getElementById('minNumber').value) || 1;
                const max = parseInt(document.getElementById('maxNumber').value) || 50;
                
                for (let i = min; i <= max; i++) {
                    items.push({ number: String(i).padStart(2, '0'), name: '' });
                }
            } else {
                items = [...participants];
            }

            // Filter out already won items if not repeatable
            if (!allowRepeat) {
                items = items.filter(item => 
                    !winners.some(w => w.number === item.number)
                );
            }

            const poolRect = pool.getBoundingClientRect();
            const poolWidth = poolRect.width || 300;
            const poolHeight = poolRect.height || 200;
            const ballSize = 42;
            const padding = 5;

            floatingBalls = [];

            items.forEach((item, index) => {
                const ball = document.createElement('div');
                ball.className = `ball ball-color-${(index % 8) + 1} floating`;
                ball.dataset.number = item.number;
                ball.dataset.name = item.name;
                
                // Display only number (NOT name) in the ball
                ball.textContent = item.number;
                ball.title = item.name ? `${item.number} - ${item.name}` : item.number;

                // Random position within rectangular pool
                const x = padding + Math.random() * (poolWidth - ballSize - padding * 2);
                const y = padding + Math.random() * (poolHeight - ballSize - padding * 2);

                ball.style.left = `${x}px`;
                ball.style.top = `${y}px`;

                pool.appendChild(ball);

                // Store ball state for floating animation
                floatingBalls.push({
                    element: ball,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 1.5,  // Slow speed (0.5x of previous)
                    vy: (Math.random() - 0.5) * 1.5
                });
            });

            // Start floating animation
            startFloatingAnimation(poolWidth, poolHeight, ballSize, padding);
        }

        function startFloatingAnimation(poolWidth, poolHeight, ballSize, padding) {
            if (floatingInterval) return;
            
            floatingInterval = setInterval(() => {
                floatingBalls.forEach(ballState => {
                    // Update position
                    ballState.x += ballState.vx;
                    ballState.y += ballState.vy;

                    // Bounce off boundaries
                    if (ballState.x <= padding) {
                        ballState.x = padding;
                        ballState.vx *= -1;
                    } else if (ballState.x >= poolWidth - ballSize - padding) {
                        ballState.x = poolWidth - ballSize - padding;
                        ballState.vx *= -1;
                    }

                    if (ballState.y <= padding) {
                        ballState.y = padding;
                        ballState.vy *= -1;
                    } else if (ballState.y >= poolHeight - ballSize - padding) {
                        ballState.y = poolHeight - ballSize - padding;
                        ballState.vy *= -1;
                    }

                    // Apply position
                    ballState.element.style.left = `${ballState.x}px`;
                    ballState.element.style.top = `${ballState.y}px`;
                });
            }, 16);
        }

        function stopFloatingAnimation() {
            if (floatingInterval) {
                clearInterval(floatingInterval);
                floatingInterval = null;
            }
        }

        // Audio Context for sound effects
        let audioContext = null;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }
        
        function playTypewriterSound(duration) {
            const ctx = initAudio();
            const startTime = ctx.currentTime;
            const endTime = startTime + duration / 1000;
            
            function playClick(time, volume) {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(800 + Math.random() * 400, time);
                
                gain.gain.setValueAtTime(volume * 0.15, time);
                gain.gain.exponentialDecayTo = gain.gain.exponentialRampToValueAtTime || gain.gain.linearRampToValueAtTime;
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start(time);
                osc.stop(time + 0.03);
            }
            
            // Schedule typewriter clicks with decreasing frequency
            let currentTime = startTime;
            let interval = 0.05;
            let volume = 1;
            
            while (currentTime < endTime) {
                playClick(currentTime, volume);
                currentTime += interval;
                // Gradually slow down and quiet
                interval += 0.002;
                volume *= 0.995;
            }
        }
        
        function playCelebrationSound() {
            const ctx = initAudio();
            const now = ctx.currentTime;
            
            // Play a cheerful chord progression
            const frequencies = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            
            frequencies.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.2, now + 0.05 + i * 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start(now + i * 0.05);
                osc.stop(now + 1);
            });
        }

        // Create spark effect at position
        function createSpark(x, y) {
            const pool = document.getElementById('ballPool');
            const colors = ['#fb923c', '#2dd4bf', '#38bdf8', '#ffe66d', '#ff8a5b', '#fff'];
            
            for (let i = 0; i < 4; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                spark.style.left = `${x}px`;
                spark.style.top = `${y}px`;
                spark.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                spark.style.boxShadow = `0 0 6px ${spark.style.backgroundColor}`;
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 15 + Math.random() * 25;
                spark.style.setProperty('--spark-x', `${Math.cos(angle) * distance}px`);
                spark.style.setProperty('--spark-y', `${Math.sin(angle) * distance}px`);
                spark.style.animation = `sparkAnim 0.3s ease-out forwards`;
                
                pool.appendChild(spark);
                setTimeout(() => spark.remove(), 300);
            }
        }

        // Ball collision animation with physics
        let collisionInterval = null;
        let ballVelocities = [];

        function startCollisionAnimation() {
            const pool = document.getElementById('ballPool');
            const balls = Array.from(pool.querySelectorAll('.ball'));
            const poolRect = pool.getBoundingClientRect();
            const poolWidth = poolRect.width;
            const poolHeight = poolRect.height;
            const ballSize = 42;
            
            // Initialize velocities with 5x speed
            ballVelocities = balls.map(() => ({
                vx: (Math.random() - 0.5) * 125,
                vy: (Math.random() - 0.5) * 125
            }));

            // Store positions
            const positions = balls.map(ball => ({
                x: parseFloat(ball.style.left),
                y: parseFloat(ball.style.top)
            }));

            collisionInterval = setInterval(() => {
                // Update positions
                balls.forEach((ball, i) => {
                    positions[i].x += ballVelocities[i].vx;
                    positions[i].y += ballVelocities[i].vy;

                    // Bounce off walls
                    if (positions[i].x <= 0 || positions[i].x >= poolWidth - ballSize) {
                        ballVelocities[i].vx *= -0.9;
                        positions[i].x = Math.max(0, Math.min(poolWidth - ballSize, positions[i].x));
                    }
                    if (positions[i].y <= 0 || positions[i].y >= poolHeight - ballSize) {
                        ballVelocities[i].vy *= -0.9;
                        positions[i].y = Math.max(0, Math.min(poolHeight - ballSize, positions[i].y));
                    }

                    // Check collisions with other balls
                    for (let j = i + 1; j < balls.length; j++) {
                        const dx = positions[j].x - positions[i].x;
                        const dy = positions[j].y - positions[i].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < ballSize && dist > 0) {
                            // Collision detected - elastic collision physics
                            const nx = dx / dist;
                            const ny = dy / dist;
                            
                            const dvx = ballVelocities[i].vx - ballVelocities[j].vx;
                            const dvy = ballVelocities[i].vy - ballVelocities[j].vy;
                            const dvn = dvx * nx + dvy * ny;
                            
                            ballVelocities[i].vx -= dvn * nx;
                            ballVelocities[i].vy -= dvn * ny;
                            ballVelocities[j].vx += dvn * nx;
                            ballVelocities[j].vy += dvn * ny;

                            // Separate balls
                            const overlap = ballSize - dist;
                            positions[i].x -= overlap * nx / 2;
                            positions[i].y -= overlap * ny / 2;
                            positions[j].x += overlap * nx / 2;
                            positions[j].y += overlap * ny / 2;
                        }
                    }

                    ball.style.left = `${positions[i].x}px`;
                    ball.style.top = `${positions[i].y}px`;
                });
            }, 16);
        }

        function stopCollisionAnimation() {
            if (collisionInterval) {
                clearInterval(collisionInterval);
                collisionInterval = null;
            }
        }

        // Start Draw
        async function startDraw() {
            if (isDrawing) return;

            const balls = document.querySelectorAll('.ball');
            if (balls.length === 0) {
                showModal('提示', '球池中沒有可抽取的球！');
                return;
            }

            const winnerCount = parseInt(document.getElementById('winnerCount').value);
            const availableBalls = Array.from(balls);

            if (!allowRepeat && availableBalls.length < winnerCount) {
                showModal('提示', `球池中只剩 ${availableBalls.length} 顆球，無法抽出 ${winnerCount} 位中獎者！`);
                return;
            }

            isDrawing = true;
            document.getElementById('startBtn').disabled = true;
            const fixedBtn = document.getElementById('startBtnFixed');
            if (fixedBtn) fixedBtn.disabled = true;

            // Start typewriter sound
            playTypewriterSound(800);

            // Stop floating animation and start collision physics
            stopFloatingAnimation();
            balls.forEach(ball => {
                ball.classList.remove('floating');
                ball.classList.add('colliding');
            });
            
            startCollisionAnimation();

            // Wait 0.8 seconds then gradually slow down
            await sleep(800);

            // Stop collision animation
            stopCollisionAnimation();
            balls.forEach(ball => ball.classList.remove('colliding'));

            // Select winners
            const newWinners = [];
            const availableForDraw = [...availableBalls];

            for (let i = 0; i < winnerCount; i++) {
                if (availableForDraw.length === 0) break;

                const randomIndex = Math.floor(Math.random() * availableForDraw.length);
                const selectedBall = availableForDraw[randomIndex];

                if (!allowRepeat) {
                    availableForDraw.splice(randomIndex, 1);
                }

                const winner = {
                    number: selectedBall.dataset.number,
                    name: selectedBall.dataset.name
                };

                newWinners.push(winner);

                // Animate winner ball
                selectedBall.classList.add('winner');
                
                await sleep(300);
            }

            // Play celebration sound
            playCelebrationSound();

            // Add to winners list
            winners.push(...newWinners);
            updateWinnerDisplay();

            // Regenerate balls (removing winners if not repeatable)
            setTimeout(() => {
                generateBalls();
                isDrawing = false;
                document.getElementById('startBtn').disabled = false;
                const fixedBtn = document.getElementById('startBtnFixed');
                if (fixedBtn) fixedBtn.disabled = false;

                // Check if all balls are drawn
                if (!allowRepeat) {
                    const remainingBalls = document.querySelectorAll('.ball');
                    if (remainingBalls.length === 0) {
                        showModal('🎊 抽獎完成', '所有球都已被抽出！');
                    }
                }

                // Celebration effect
                createConfetti();
            }, 500);
        }

        // Update Winner Display
        function updateWinnerDisplay() {
            const display = document.getElementById('winnerDisplay');
            display.innerHTML = '';

            winners.forEach(winner => {
                const item = document.createElement('div');
                item.className = 'winner-item';

                if (currentMode === 'number') {
                    item.innerHTML = `<span class="number">${winner.number}</span>`;
                } else {
                    // In name mode, always show both number and name
                    item.innerHTML = `<span class="number">${winner.number}</span> ${winner.name || ''}`;
                }

                display.appendChild(item);
            });
        }

        // Reset Game
        function resetGame() {
            winners = [];
            updateWinnerDisplay();
            generateBalls();
        }

        // Modal
        function showModal(title, message) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        // Confetti Effect
        function createConfetti() {
            const colors = ['#fb923c', '#2dd4bf', '#38bdf8', '#ffe66d', '#f97316', '#0ea5e9', '#5eead4', '#fdba74'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                document.body.appendChild(confetti);

                const animation = confetti.animate([
                    { top: '-10px', opacity: 1 },
                    { top: '100vh', opacity: 0 }
                ], {
                    duration: 2000 + Math.random() * 2000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                });

                animation.onfinish = () => confetti.remove();
            }
        }

        // Helper
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
