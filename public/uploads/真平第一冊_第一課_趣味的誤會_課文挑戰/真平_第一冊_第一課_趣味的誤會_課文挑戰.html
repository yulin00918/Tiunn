<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>趣味的誤會｜課文挑戰</title><style>body{margin:0;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f7f4ef;color:#3f4642}.wrap{max-width:920px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center}.hero{text-align:center;padding:28px}.hero .icon{font-size:52px}h1{font-size:42px;margin:8px}.sub{color:#7c827e}.progress{height:10px;background:#e6e3dc;border-radius:99px;overflow:hidden;margin-bottom:24px}.bar{height:100%;background:#8d9f78}.card{background:white;border:1px solid #e6e1d8;border-radius:24px;padding:28px;box-shadow:0 10px 30px #0000000c}.tag{color:#7c9468;font-weight:800}.q{font-size:23px;font-weight:700;line-height:1.7}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt,.btn{font:inherit}.opt{padding:15px;border:1px solid #ddd9d1;background:white;border-radius:15px;text-align:left;cursor:pointer}.opt:hover{background:#f5f7f1}.correct{background:#eaf5e8!important;border-color:#abc9a5!important}.wrong{background:#fff0ed!important;border-color:#e3b3aa!important}.feedback{margin-top:17px;padding:15px;background:#faf8f3;border-radius:14px;min-height:55px;line-height:1.6}.nav{display:flex;justify-content:space-between;margin-top:18px}.btn{padding:10px 16px;border-radius:999px;cursor:pointer}.ghost{background:white;border:1px solid #ddd9d1}.primary{border:0;background:#81956e;color:white}.done{text-align:center}.hidden{display:none}@media(max-width:600px){.opts{grid-template-columns:1fr}.q{font-size:21px}}</style></head><body>
<div class="wrap"><div class="top"><button class="btn ghost" onclick="history.back()">← 返回課程</button><span>真平｜第一冊</span></div>
<div class="hero"><div class="icon">😄💬</div><h1>第一課｜趣味的誤會</h1><div class="sub">課文挑戰｜看情境・揣意思・破解誤會</div><p>共 12 關</p></div>
<div class="progress"><div class="bar" id="bar"></div></div><div id="quiz"></div>
<div id="done" class="card done hidden"><div class="hero icon">🏆</div><h2>完成〈趣味的誤會〉！</h2><p id="scoreText"></p><button class="btn primary" onclick="restart()">閣挑戰一擺</button></div></div>
<script>
const qs=[{"type": "課文語境", "q": "阿母講伊佮阿公約佇「車頭」，這个「車頭」佇課文內底是指＿＿。", "opts": ["車站", "公車頭前", "計程車頭前", "火車第一節車廂"], "ans": "車站", "ex": "本課利用「車頭」的一詞多義造成誤會；阿母實際指的是車站。"}, {"type": "一詞多義", "q": "阿公講「歹勢！歹勢！」，阿母解說伊其實是在＿＿。", "opts": ["會失禮", "真害羞", "真受氣", "講笑詼"], "ans": "會失禮", "ex": "這个情境的「歹勢」是道歉、賠不是的意思。"}, {"type": "跨語言諧音", "q": "泰國文化節主持人講「三碗豬跤」，阿公煞想講主持人是在講＿＿。", "opts": ["早餐食三碗豬跤", "向大家問候", "欲買豬跤", "欲請人食飯"], "ans": "早餐食三碗豬跤", "ex": "教材用泰語問候語和閩南語聽感相近，呈現跨語言同音造成的趣味誤會。"}, {"type": "跨語言諧音", "q": "阿公聽著外語的問候，煞聽做「牛無奶」。阿母講彼其實是咧講＿＿。", "opts": ["早安", "午安", "晚安", "再會"], "ans": "早安", "ex": "課文以外語發音和「牛無奶」相近來製造誤會。"}, {"type": "讀文理解", "q": "阿淇講「I love you」，阿公煞聽做＿＿。", "opts": ["流目油", "加食寡", "車頭", "歹勢"], "ans": "流目油", "ex": "這是本課另一個跨語言諧音笑點。"}, {"type": "語境判斷", "q": "阿媽講「來！加食寡。」意思上接近＿＿。", "opts": ["閣食一寡", "加一粒卵", "食雞肉", "莫閣食"], "ans": "閣食一寡", "ex": "阿淇把「加食寡」的聲音誤會成和「雞」有關，形成趣味對話。"}, {"type": "課文主旨", "q": "〈趣味的誤會〉上主要欲予咱發現閩南語的啥物特色？", "opts": ["一詞多義佮語言仝音的趣味", "攏愛用華語解說", "文字愈少愈好", "外語袂使佮閩南語做伙學"], "ans": "一詞多義佮語言仝音的趣味", "ex": "教材明確以一詞多義及不同語言同音造成的誤會為核心。"}, {"type": "延伸語詞", "q": "「先生」會當稱呼無仝職業的人。若對方講：「你佗位無爽快？我先共你量體溫。」這个「先生」較可能是＿＿。", "opts": ["醫生", "老師", "司機", "頭家"], "ans": "醫生", "ex": "教材學習單用不同情境辨別「先生」所指的人。"}, {"type": "俗諺理解", "q": "「好禮，好做伙。」較接近下跤佗一个意思？", "opts": ["有禮貌，較予人感覺好相處", "食好料才會有朋友", "逐家攏愛做仝款代誌", "講話愈大聲愈有禮貌"], "ans": "有禮貌，較予人感覺好相處", "ex": "教材註解指出，有禮貌，人家才會覺得你好相處。"}, {"type": "俗諺理解", "q": "「見面有呼請，較贏佇厝咧教囝。」主要欲講＿＿。", "opts": ["身教重佇言教", "囡仔毋免學禮貌", "見面毋通講話", "厝內教囡仔上重要"], "ans": "身教重佇言教", "ex": "教材解釋：與其只在家教孩子懂禮貌，不如大人自己見面主動問安。"}, {"type": "情境挑戰", "q": "護士講「食飽，三粒」，老阿伯煞聽做「食百三粒」。這个笑點主要是因為＿＿。", "opts": ["語句斷句佮仝音造成誤會", "藥仔無仝色", "護士講傷細聲", "老阿伯毋捌數字"], "ans": "語句斷句佮仝音造成誤會", "ex": "教材課前暖身用「食飽，三粒／食百三粒」呈現諧音與斷句造成的誤會。"}, {"type": "綜合挑戰", "q": "學這課了後，若聽著一个詞有兩種意思，上適合的做法是＿＿。", "opts": ["看前後情境判斷意思", "攏照字面解釋", "隨便揣一个意思", "聽著仝音就當做仝一个詞"], "ans": "看前後情境判斷意思", "ex": "本課的核心能力就是利用語境辨認一詞多義與諧音，避免溝通誤會。"}];let i=0,score=0,answered=false;
function render(){if(i>=qs.length){quiz.innerHTML='';done.classList.remove('hidden');scoreText.textContent='你答著 '+score+' / '+qs.length+' 題';bar.style.width='100%';return}answered=false;let q=qs[i];bar.style.width=((i+1)/qs.length*100)+'%';quiz.innerHTML=`<section class="card"><div class="tag">第 ${i+1} 關｜${q.type}</div><p class="q">${q.q}</p><div class="opts">${q.opts.map((x,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}　${x}</button>`).join('')}</div><div class="feedback">請根據課文情境選答案。</div><div class="nav"><button class="btn ghost" onclick="prev()">← 頂一關</button><button class="btn primary" id="nextBtn" onclick="next()" disabled>下一關 →</button></div></section>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b))}
function choose(b){if(answered)return;answered=true;let q=qs[i],v=q.opts[+b.dataset.n];document.querySelectorAll('.opt').forEach(x=>{if(q.opts[+x.dataset.n]===q.ans)x.classList.add('correct')});if(v===q.ans)score++;else b.classList.add('wrong');document.querySelector('.feedback').textContent=(v===q.ans?'✅ 答著矣！ ':'💡 正確答案：'+q.ans+'。 ')+q.ex;nextBtn.disabled=false}
function next(){if(answered){i++;render()}} function prev(){if(i>0){i--;render()}} function restart(){i=0;score=0;done.classList.add('hidden');render()} render();
</script></body></html>
