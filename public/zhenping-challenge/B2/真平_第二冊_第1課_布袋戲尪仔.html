<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>布袋戲尪仔｜真平第二冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../../語境填空.dc.html">← 返回整冊</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第1課｜布袋戲尪仔</h1><p>布袋戲偶、操偶技藝與傳統文化</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解詩句的前後對比與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>將課文、俗諺與傳統文化連結生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「膨風」較接近啥物意思？","o":["誇口講大話","認真做代誌","害羞毋敢講話"],"a":0,"e":"教材以「膨風」表示誇口說大話。"},{"q":"「精傱」佇本課是啥物意思？","o":["精明、做代誌有能力","誇口講大話","一句話攏毋講"],"a":0,"e":"「精傱」指精明成器。"},{"q":"「古意」較接近啥物意思？","o":["忠厚老實","愛誇口","行路足緊"],"a":0,"e":"「古意」形容人忠厚老實。"},{"q":"「閉思」形容一个人按怎？","o":["較內向、害羞","足愛膨風","足𠢕搬戲"],"a":0,"e":"「閉思」形容內向、害羞的樣子。"},{"q":"課文講「消風消風」，主要是形容戲尪仔按怎？","o":["失去原本的氣勢佮活力","忽然變做真人","開始唱歌仔戲"],"a":0,"e":"無人操弄與配音時，戲偶失去生命力，課文用「消風」呈現。"},{"q":"「行路有風」佇詩內底，是形容戲尪仔？","o":["動作真有氣勢","真正會飛天","無法度行路"],"a":0,"e":"詩的前段描寫戲偶演出時的氣勢。"},{"q":"「人聲若莫講」的「莫」佇這句較接近？","o":["無去做彼个動作","一定愛做","做甲真大聲"],"a":0,"e":"這句是假設沒有人的聲音配合演出。"},{"q":"「無聲無說」佇課文形容戲偶？","o":["無人配音時安靜無聲","講話足大聲","咧講笑詼"],"a":0,"e":"課文以無聲無說對照有配音時的生動。"},{"q":"「一身一身戇戇」較接近啥物畫面？","o":["一尊一尊呆呆的戲偶","戲偶咧比賽走標","戲偶咧食飯"],"a":0,"e":"「一身一身」指一尊一尊戲偶；無人操弄時顯得呆滯。"},{"q":"「口白」佇布袋戲演出指的是？","o":["角色的念白佮配音","戲偶的衫褲","戲臺的桌椅"],"a":0,"e":"教材對話提到學布袋戲內底的口白。"}],"context":[{"q":"阿兄定定講一寡誇張的代誌，阿母講：「你毋通閣＿＿啦！」","o":["膨風","閉思","古意"],"a":0,"e":"愛提醒人毋通誇口，應用「膨風」。"},{"q":"阿敏讀冊𠢕，做代誌嘛真好勢。講伊真＿＿，上適當。","o":["精傱","膨風","消風"],"a":0,"e":"有能力、做事精明可用「精傱」。"},{"q":"志明誠實，答應人的代誌攏會做到，大家講伊真＿＿。","o":["古意","膨風","閉思"],"a":0,"e":"忠厚老實符合「古意」。"},{"q":"小妹較害羞，初次見面毋敢主動講話，較符合佗一个詞？","o":["閉思","精傱","膨風"],"a":0,"e":"教材以不敢主動與人交往說明「閉思」。"},{"q":"戲偶本來行路有風，師傅一下停手閣無配音，戲偶就＿＿。","o":["消風消風","行路有風","吐劍光"],"a":0,"e":"失去操弄與配音，戲偶失去氣勢。"}],"reading":[{"q":"課文的布袋戲尪仔，為啥物看起來會行路有風？","o":["因為有人操弄，閣有人配音","因為戲偶本身會行路","因為戲偶會食飯"],"a":0,"e":"課文強調操偶師的手藝與人聲。"},{"q":"課文前半段描寫戲偶真生動，後半段描寫無人操弄的樣，主要用了啥物方式？","o":["前後對比","列出價錢","介紹製作日期"],"a":0,"e":"教材賞析明確指出兩段強烈對比。"},{"q":"「一切全是膨風」佇詩內底，是欲提醒讀者啥物？","o":["戲偶的本領是表演效果，毋是本身有生命","操偶師攏愛講白賊","布袋戲無藝術價值"],"a":0,"e":"詩句透過誇張描寫，凸顯戲偶仰賴人的操作。"},{"q":"若無人聲來配合，詩內底的戲偶會變做按怎？","o":["無聲無說","愈講愈大聲","自動唱歌"],"a":0,"e":"「人聲若莫講」後接「無聲無說」。"},{"q":"根據課文與教材賞析，這首詩主要表現布袋戲的啥物特色？","o":["操偶佮口白予戲偶有生命力","布袋戲偶會家己思考","戲偶的價錢比真人較貴"],"a":0,"e":"核心是操偶師的雙手與聲音讓戲偶生動。"}],"comprehensive":[{"q":"班上欲紹介布袋戲文化，佗一个說法上符合課文？","o":["戲偶的生動表演，愛靠操偶師的技藝","戲偶無人弄嘛會家己行路","布袋戲只需要戲偶，無需要聲音"],"a":0,"e":"整合課文主旨與傳統藝術的表演方式。"},{"q":"有同學講：「布袋戲尪仔無生命，所以無藝術價值。」你應該按怎回應？","o":["戲偶雖然無生命，操偶佮配音的藝術猶是真有價值","無生命的物件攏無文化價值","布袋戲只適合大人看"],"a":0,"e":"區分戲偶本身與人所創造的藝術表演。"},{"q":"觀眾看戲入迷，無注意著演員的辛苦。佗一句俗諺上適合提醒伊？","o":["棚頂做甲流汗，棚跤嫌甲流瀾","一切全是膨風","無聲無說"],"a":0,"e":"俗諺提醒人不要不了解表演者的辛苦就隨意批評。"},{"q":"若欲共這首詩的兩段排成一張比較表，佗一組上正確？","o":["有人操弄：生動；無人操弄：戇戇","有人操弄：無聲；無人操弄：講話生動","兩種情形攏仝款生動"],"a":0,"e":"兩段形成鮮明對比。"},{"q":"學校辦傳統戲劇體驗，佗一个活動上能體會這課的重點？","o":["親手操作戲偶，試看覓配口白佮無配口白的差別","干焦看戲偶的價錢","干焦記戲偶的顏色"],"a":0,"e":"親自操作與配音，才能理解表演者賦予戲偶生命力的過程。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
