</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第1課｜布袋戲尪仔</h1><p>布袋戲尪仔、操偶師佮傳統戲劇</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「膨風」較接近啥物意思？","o":["吹牛、誇口講大話","生氣、面鼓鼓","衫褲膨膨真闊","東西予風吹走"],"a":0,"e":"膨風：吹牛、誇口說大話。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「精傱」較接近啥物意思？","o":["精明成器","走甲真緊","精神真好","愛吵愛鬧"],"a":0,"e":"精傱：精明成器。課文「無半項精傱」就是講啥物攏袂曉。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「古意」較接近啥物意思？","o":["忠厚、老實","真有古早味","真有創意","真古錐"],"a":0,"e":"古意：忠厚、老實、憨厚。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「閉思」較接近啥物意思？","o":["個性內向、害羞","關佇房間想代誌","想甲真久猶想袂通","心內有代誌咧受氣"],"a":0,"e":"閉思：個性內向、害羞、靦腆。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「無聲無說」較接近啥物意思？","o":["恬恬，一點仔聲都無","袂曉講話","講話無重點","聲細細毋過講袂停"],"a":0,"e":"無聲無說：形容寂靜沒有一點聲音。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"課文「嘛會吐劍光」的「吐劍光」，本課較接近啥物意思？","o":["銳氣懾人、真有氣勢","喙內吐出喙瀾","講話真歹聽","舞台的燈光真光"],"a":0,"e":"吐劍光原指練武的人從口中吐出劍來，本課指銳氣懾人。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"課文「消風消風」形容布袋戲尪仔啥物款？","o":["扁扁、無生命力的款","風拄好停矣","氣消矣，無閣受氣","真緊就無看見"],"a":0,"e":"沒有人操弄時，戲偶扁平沒有生命力。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「行路有風」形容布袋戲尪仔啥物款？","o":["行路真有氣勢、真有精神","行路的時風真透","行路慢吞吞","行無兩步就跋倒"],"a":0,"e":"經過操偶師操弄，戲偶走路有氣勢。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「會走會傱」較接近啥物意思？","o":["會走閣會飛跤走，真活跳","會行毋過袂走","四界烏白走去惹代誌","行一下停一下"],"a":0,"e":"會走會傱：能跑而且健步如飛。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"課文「一身一身戇戇」的「戇戇」較接近啥物意思？","o":["傻傻、呆呆","真巧真精","真受氣","真溫柔"],"a":0,"e":"沒人操弄時，戲偶就呆呆的。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「布袋戲尪仔」的「尪仔」是啥物意思？","o":["人偶、玩偶","翁婿","細漢囡仔","搬戲的演員"],"a":0,"e":"尪仔：玩偶。布袋戲尪仔就是布袋戲偶。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「阿兄講話有較＿＿，定定三句話才有一句是真的。」空格揀佗一个？","o":["膨風","古意","閉思","精傱"],"a":0,"e":"三句話才一句真的，就是吹牛，用「膨風」。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「小妹個性較＿＿，歹勢主動佮人講話。」空格揀佗一个？","o":["閉思","膨風","精傱","古意"],"a":0,"e":"不好意思主動說話，是個性內向的「閉思」。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「志明做人有夠＿＿，連厝邊頭尾攏呵咾甲會觸舌。」空格揀佗一个？","o":["古意","膨風","閉思","戇戇"],"a":0,"e":"被鄰居稱讚，是忠厚老實的「古意」。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「較＿＿咧，大人大種矣！」空格揀佗一个？","o":["精傱","閉思","膨風","消風"],"a":0,"e":"都是大人了，要精明一點，用「精傱」。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿信上愛＿＿，你毋通予伊騙去。」空格揀佗一个？","o":["膨風","膨喙","精傱","古意"],"a":0,"e":"會騙人、講大話，用「膨風」。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"演員搬戲連鞭哭、連鞭笑，觀眾嘛看甲流目屎。用佗一句俗諺上適當？","o":["做戲悾，看戲戇","棚頂做甲流汗，棚跤嫌甲流瀾","看戲頭就知戲尾","戲棚跤徛久就是你的"],"a":0,"e":"演員和觀眾都很投入，就是「做戲悾，看戲戇」。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"班長做代誌真認真，煞有人佇伊尻脊後講歹話。用佗一句俗諺上適當？","o":["棚頂做甲流汗，棚跤嫌甲流瀾","做戲悾，看戲戇","看戲頭就知戲尾","棚頂有彼號人，棚跤就有彼號人"],"a":0,"e":"不了解別人的辛苦而亂批評。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這齣戲一開始我就臆著結局矣。」用佗一句俗諺來形容上適當？","o":["看戲頭就知戲尾","做戲悾，看戲戇","棚頂做甲流汗，棚跤嫌甲流瀾","歹戲𠢕拖棚"],"a":0,"e":"看前段就猜到結局，表示缺乏新意。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「文武百官做透透，一粒米都無吞落喉。」臆一種本土文物：","o":["布袋戲尪仔","廟口的石獅","歌仔戲演員","戲台頂的鑼鼓"],"a":0,"e":"戲偶演過各種官，卻從來不吃飯。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「千里路途三五步，百萬軍兵六七人。」臆兩種啥物？","o":["布袋戲、歌仔戲","電影、電視","魔術、雜技","跳舞、唱歌"],"a":0,"e":"傳統戲曲中，繞幾步就代表千里路，幾個人就代表百萬兵。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿英毋但生做古錐，心肝＿＿真好。」空格揀佗一个？","o":["嘛","煞","才","若"],"a":0,"e":"「……毋但……嘛……」是遞進句型。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"這課主要欲強調布袋戲尪仔的啥物特性？","o":["著愛靠人操弄佮配音才有靈魂","外型佮真人仝款","故事本身就足精彩","家己就會振動"],"a":0,"e":"有人操弄才行路有風，沒人操弄就消風消風。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文「其實無半項精傱」這句話的意思是？","o":["啥物攏袂曉","真𠢕應喙應舌","答應人的代誌做袂到","無代誌閣愛揣代誌"],"a":0,"e":"精傱是精明成器；無半項精傱＝什麼都不會。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文第二段描寫無人操弄的布袋戲尪仔，下面佗一个毋是？","o":["行路有風","戇戇","無聲無說","消風消風"],"a":0,"e":"「行路有風」是第一段有人操弄的樣子。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文「人手若莫弄，人聲若莫講」的「莫」較接近啥物意思？","o":["無去、毋","已經","一直","一定"],"a":0,"e":"人的手如果不去操弄、人的聲音如果不去配音。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"這首詩主要押啥物韻？","o":["ong 韻","ang 韻","ian 韻","ing 韻"],"a":0,"e":"風、動、傱、功、光、講……押 ong 韻，讀起來輕快。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"這首詩兩段的寫法，上明顯的是啥物？","o":["前後強烈對比","用問答的方式","照時間倒轉來講","全部用狀聲詞"],"a":0,"e":"第一段活靈活現，第二段呆若木雞，用映襯讓形象鮮明。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈布袋戲尪仔〉的作者是啥人？","o":["李勤岸","鄭家和","吳永行","劉承賢"],"a":0,"e":"李勤岸，臺南新化人，臺師大臺灣語文學系退休教授。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"對話內底，阿爸點予囡仔看的「轟動武林、驚動萬教」的影片是啥物？","o":["布袋戲〈雲州大儒俠史豔文〉","歌仔戲〈周公與桃花女〉","八點檔連續劇","卡通影片"],"a":0,"e":"囡仔看甲喙笑目笑，原來是布袋戲。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文講布袋戲尪仔「行路有風、講話生動」，主要是靠啥物？","o":["操偶師的手藝佮口白","戲尪仔的材料真好","觀眾的噗仔聲","舞台的燈光"],"a":0,"e":"靠扭掠的雙手掠弄、真人肉聲助陣。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"布袋戲佮歌仔戲上大的無仝是啥物？","o":["布袋戲用戲尪仔，歌仔戲是真人演","布袋戲用華語演","歌仔戲攏無唱歌","布袋戲干焦佇電視播"],"a":0,"e":"布袋戲把手伸進戲偶衣服裡操弄，歌仔戲由真人演各種角色。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"布袋戲閣號做啥物？","o":["掌中戲","傀儡戲","皮影戲","大籠"],"a":0,"e":"在掌中操弄的戲叫掌中戲；人戲稱大籠，偶戲稱小籠。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"完整的布袋戲演出，「後場」指啥物？","o":["操偶師的口白佮樂師的演奏","戲台佮道具","戲尪仔的衫","看戲的觀眾"],"a":0,"e":"前場是戲偶、戲台、道具；後場是操偶與口白、樂師配樂。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「做戲悾，看戲戇」主要咧講啥物？","o":["演員佮觀眾攏足投入","演員攏真戇","觀眾看攏無","戲攏真歹看"],"a":0,"e":"演員裝瘋賣傻，觀眾看得入神。","h":"想想本課的重點，閣佮生活經驗 let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
