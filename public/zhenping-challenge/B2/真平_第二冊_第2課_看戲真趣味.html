<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>看戲真趣味｜真平第二冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../index.html">← 返回整冊</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第2課｜看戲真趣味</h1><p>歌仔戲、表演技藝與文化傳承</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解歌仔戲的文化特色與課文主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把歌仔戲文化與生活參與連結。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「扮仙」佇課文是啥物活動？","o":["歌仔戲演出前的吉祥儀式","歌仔戲散場了後的打掃","戲班收拾戲服"],"a":0,"e":"教材第23張投影片將「扮仙」解釋為開場戲；課文第8張投影片寫好時吉日扮仙，帶有祈福祝願的情境。"},{"q":"「抾」佇「囡仔人抾甲無閒」是啥物意思？","o":["撿拾","拍手","唱歌"],"a":0,"e":"孩子忙著撿仙錢。"},{"q":"「三花」佇這課是啥物角色？","o":["歌仔戲中講笑詼的男丑角","戲臺的布景","賣票的人"],"a":0,"e":"課文提到三花講笑詼，增添演出的趣味。"},{"q":"「噗仔聲」較接近啥物？","o":["拍手鼓掌的聲音","落雨的聲音","敲門的聲音"],"a":0,"e":"課文鼓勵觀眾用噗仔聲支持演出。"},{"q":"「生湠」佇課文指文化按怎？","o":["繼續傳承發展","漸漸消失","停止演出"],"a":0,"e":"課文期待傳統文化生湠、開花。"},{"q":"「圓滿大結局」佇課文較接近啥物？","o":["故事有完整的收尾","戲才欲開始","演員猶未準備好"],"a":0,"e":"課文以公堂審判與有頭有尾說明圓滿結局。"},{"q":"「大拜拜」佇課文佮啥物活動有關？","o":["庄頭邀戲班演歌仔戲","學校運動會","攝影展覽"],"a":0,"e":"阿媽回憶庄頭大拜拜邀戲班的熱鬧。"},{"q":"「台頂媠媠，台跤若鬼」反映啥物？","o":["演員臺上裝扮佮臺下原貌的差別","演員無愛化妝","戲臺只有鬼故事"],"a":0,"e":"演員以幽默方式講臺上臺下的反差。"},{"q":"「有頭有尾」佇這課是欲講啥物？","o":["故事有完整的開始佮結束","戲棚有兩个門","演員只有兩个人"],"a":0,"e":"課文以有頭有尾形容故事收束完整。"},{"q":"「忠孝節義」佇這課指啥物？","o":["歌仔戲長期傳承的價值主題","舞臺燈光的顏色","演員的服裝尺寸"],"a":0,"e":"課文指出表演形式改變，忠孝節義的精神猶原存在。"}],"context":[{"q":"庄頭欲辦大拜拜，阿媽講較早攏會請戲班來＿＿。","o":["做戲","翕相","𤆬山"],"a":0,"e":"課文寫庄頭大拜拜邀戲班做戲。"},{"q":"囡仔人看著擲仙錢，逐家攏咧＿＿。","o":["抾","睏","畫圖"],"a":0,"e":"抾就是撿拾，符合現場情境。"},{"q":"三花一出場就講笑詼，觀眾聽甲＿＿。","o":["笑咍咍","無聲無說","鬱卒"],"a":0,"e":"講笑詼會引起觀眾笑聲。"},{"q":"演員搬戲真認真，觀眾用＿＿共鼓勵。","o":["噗仔聲","風颱聲","落雨聲"],"a":0,"e":"課文鼓勵用掌聲支持演員。"},{"q":"學校欲予歌仔戲文化繼續傳落去，會當安排體驗活動，予文化＿＿。","o":["生湠","消風","閉思"],"a":0,"e":"生湠指延續、發展。"}],"reading":[{"q":"阿媽為啥物講較早庄頭大拜拜真予人期待？","o":["因為會邀戲班來做戲，庄頭真鬧熱","因為逐家攏無出門","因為戲班攏無演出"],"a":0,"e":"阿媽回憶大拜拜邀戲班，這是整年期待的熱鬧時刻。"},{"q":"課文為啥物提著「三花」？","o":["呈現歌仔戲有講笑詼的趣味","介紹照相技術","解釋地名由來"],"a":0,"e":"三花負責逗趣，讓歌仔戲更有趣。"},{"q":"歌仔戲對廟口搬到國家劇院，課文強調啥物無改變？","o":["忠孝節義的精神","演出地點","舞臺大小"],"a":0,"e":"形式與場地可能改變，精神仍然延續。"},{"q":"「台頂三分鐘，台跤規厝間」欲提醒咱啥物？","o":["精彩演出需要長時間練習","演出只要練三分鐘","演員毋免練工夫"],"a":0,"e":"課文第16張投影片用「台頂三分鐘，台跤規厝間」強調演員需要長期練工夫，精彩演出並非一時就能完成。"},{"q":"課文最後鼓勵觀眾按怎支持歌仔戲？","o":["用行動參與，閣用掌聲鼓勵","只看外國戲劇","毋通去看表演"],"a":0,"e":"課文以行動與掌聲鼓勵文化傳承。"}],"comprehensive":[{"q":"班上欲介紹歌仔戲，佗一項最符合課文？","o":["歌仔戲會用故事傳達價值，嘛有趣味","歌仔戲攏無故事","歌仔戲干焦會佇廟口演"],"a":0,"e":"課文提到現代故事、歷史故事與忠孝節義。"},{"q":"有同學講：「歌仔戲搬去國家劇院就無傳統矣。」佗一个回應較適當？","o":["演出方式會改變，文化精神猶原會當傳承","換所在就毋是歌仔戲","傳統藝術攏袂改變"],"a":0,"e":"課文區分創新的形式與不變的核心精神。"},{"q":"若欲體會「台頂三分鐘，台跤規厝間」，佗一个活動較適當？","o":["排練一小段戲，記錄練習的時間佮困難","只看演員的戲服","干焦記戲臺的尺寸"],"a":0,"e":"親自排練可體會演員長時間練習的辛苦。"},{"q":"觀眾對演員的辛苦無了解，隨便批評，較適合用啥物態度？","o":["先了解準備過程，閣提出具體建議","無看戲就直接罵","只要毋佮意就叫人停演"],"a":0,"e":"呼應課文重視演員練功夫的付出。"},{"q":"學校欲予較少年的人接觸歌仔戲，佗一个計畫較符合課文主旨？","o":["邀戲班表演，安排角色體驗佮觀後分享","取消所有傳統戲劇活動","只展示戲院門票"],"a":0,"e":"課文鼓勵透過參與與掌聲，讓文化繼續傳承。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
