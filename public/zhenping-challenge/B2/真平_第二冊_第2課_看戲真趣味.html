</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎪</div><h1>第2課｜看戲真趣味</h1><p>歌仔戲、廟口精神佮文化傳承</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「扮仙」較接近啥物意思？","o":["正戲開演前，演員扮神仙祝壽祈福的開場戲","扮做神仙去騙人","戲煞了後的謝幕","演員畫面的化妝"],"a":0,"e":"扮仙：正戲開演前的儀式，向神明祝壽、為信徒祈福。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「大葩尾」較接近啥物意思？","o":["結局盛大熱鬧、圓滿","尾溜真大支","代誌拖甲真久","收尾收甲真倉促"],"a":0,"e":"大葩尾：形容盛大熱鬧的結束，表示圓滿。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「無閒𩑾𩑾」較接近啥物意思？","o":["非常無閒","閒閒無代誌","無愛做代誌","做代誌慢吞吞"],"a":0,"e":"無閒𩑾𩑾：形容非常忙碌。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「目尾」除了指目睭尾，閣有啥物意思？","o":["眼神、眼色","目屎","目眉","目鏡"],"a":0,"e":"目尾：①眼尾 ②眼神、眼色，例：使目尾。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「猶原」較接近啥物意思？","o":["仍然、仍舊","猶未、尚未","原來的所在","不過、可是"],"a":0,"e":"猶原：仍然、仍舊。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「規年迵天」較接近啥物意思？","o":["一整年","一年四季攏好天","年尾的時","過年彼工"],"a":0,"e":"規年迵天：一整年。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"歌仔戲的「三花」是啥物角色？","o":["男性丑角","女性主角","年紀大的男性","會武功的查某"],"a":0,"e":"三花：男丑角，專門製造笑料。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"課文「佇咱的生活當中生湠、開花」的「生湠」是啥物意思？","o":["生育繁殖、湠開","生驚","生氣","生份"],"a":0,"e":"生湠：生育繁殖，引申為流傳開來。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"課文「庄頭的大拜拜」的「庄頭」是啥物意思？","o":["村落","庄內的頭人","廟的頭前","田的頭前"],"a":0,"e":"庄頭：泛指村落。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"課文「庇佑信徒賰家伙」的「家伙」是啥物意思？","o":["財產","厝內的家私","家己的人","做工的家私"],"a":0,"e":"家伙：指財產。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「彼本冊＿＿囥佇遐，攏無徙位。」空格揀佗一个？","o":["猶原","猶未","猶有","猶毋過"],"a":0,"e":"一直沒移動，表示「仍然」，用猶原。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿美的工課真濟，規工＿＿。」空格揀佗一个？","o":["無閒𩑾𩑾","無大無細","無依無倚","有的無的"],"a":0,"e":"工作多、整天忙碌。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿明咧共你＿＿，可能有代誌，你趕緊過去。」空格揀佗一个？","o":["使目尾","使性地","袂使得","講笑詼"],"a":0,"e":"用眼神暗示，叫「使目尾」。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「你是閣咧＿＿呢，咧欲袂赴矣，跤手毋就較緊咧。」空格揀佗一个？","o":["扮仙","大葩尾","猶原","生湠"],"a":0,"e":"這裡的扮仙引申為拖拖拉拉。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「咱做任何代誌，總是愛認真拍拚堅持到底，按呢結局才會＿＿。」空格揀佗一个？","o":["大葩尾","無閒𩑾𩑾","規年迵天","扮仙"],"a":0,"e":"堅持到底，結局才圓滿。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"阿玲逐工練唱歌，堅持幾若冬，今年比賽著頭名。用佗一句俗諺形容？","o":["戲棚跤徛久就是你的","歹戲𠢕拖棚","棚頂做甲流汗，棚跤嫌甲流瀾","棚頂有彼號人，棚跤就有彼號人"],"a":0,"e":"鼓勵人持之以恆，就有成功的機會。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「彼齣無聊的連續劇已經搬五百外集矣，閣猶未煞。」用佗一句俗諺上適當？","o":["歹戲𠢕拖棚","戲棚跤徛久就是你的","做戲悾，看戲戇","棚頂有彼號人，棚跤就有彼號人"],"a":0,"e":"比喻討厭的事一直拖沒有結果。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「戲劇內底的各種角色，現實生活攏看會著。」是佗一句俗諺的意思？","o":["棚頂有彼號人，棚跤就有彼號人","歹戲𠢕拖棚","戲棚跤徛久就是你的","棚頂的皇帝——做袂久"],"a":0,"e":"戲劇反映的就是人生。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"咱會用佗一句話來呵咾一个人有夠厲害？","o":["會飛天會鑽地","會做伙講笑詼","目尾會牽電線","胸坎會吊時鐘"],"a":0,"e":"會飛天閣會鑽地，比喻精通十八般武藝。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊（ ）甲會飛天閣會鑽地。」照課文，括號內上適合填啥物？","o":["講","食","睏","哭"],"a":0,"e":"課文：三花講笑詼，講甲會飛天閣會鑽地。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"根據課文，演員笑家己「台頂媠媠，台跤若鬼」，是靠啥物？","o":["化妝","工夫","演技","魔術"],"a":0,"e":"把王梨皮變成西瓜皮，是靠濃妝。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"歌仔戲對廟口搬到國家劇院，啥物無改變？","o":["歌仔戲的忠孝節義","傳承文化的創意","歌仔戲的演出型態","搬戲的所在"],"a":0,"e":"創意、型態、地點都變了，只有忠孝節義不變。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「小生胸坎吊時鐘，小旦目尾閣會牽電線」是咧講啥物？","o":["小生身段英挺，小旦柔情","小生愛戴錶仔","小旦目睭有破病","兩个人咧冤家"],"a":0,"e":"這句形容角色的身段與神情。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「無刣奸臣予人看，看戲的毋願散」是啥物意思？","o":["觀眾無看著圓滿結局毋願離開","觀眾驚看著刣人","奸臣攏真歹看","看戲的人攏散赤"],"a":0,"e":"觀眾要看到壞人受懲罰的結局。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「三年出狀元，十年才出一个小生」是咧講啥物？","o":["欲培養一个好演員真困難","小生比狀元較好命","考狀元真簡單","小生攏愛讀冊十年"],"a":0,"e":"一個能獨當一面的演員非常難得。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文講「潑仙酒、擲仙錢」，囡仔人咧無閒𩑾𩑾做啥物？","o":["抾仙錢","啉仙酒","扮仙","拍鑼鼓"],"a":0,"e":"小孩忙著撿戲台丟下來的零錢。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿媽講較早庄頭大拜拜，攏會做啥物？","o":["邀請戲班來做戲","去國家劇院看戲","佇厝看電視歌仔戲","去外國旅行"],"a":0,"e":"每年最期待的就是這時候。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「翁生某旦，食飽相看」是咧講啥物？","o":["郎才女貌","翁某食飽冤家","翁某攏是演員","食飽了後看戲"],"a":0,"e":"丈夫像小生、妻子像小旦，比喻郎才女貌。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文最後希望咱按怎做？","o":["用行動佮噗仔聲支持傳統文化","莫閣看歌仔戲","干焦佇國家劇院看戲","共歌仔戲改做華語"],"a":0,"e":"讓傳統文化在生活中生湠、開花。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈看戲真趣味〉的作者鄭家和，這馬的頭路是？","o":["公視臺語台的新聞主播","布袋戲操偶師","國小閩南語老師","大學語言學教授"],"a":0,"e":"鄭家和是公視臺語台下暗新聞主播。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"野臺歌仔戲主要是佇啥物時陣搬？","o":["廟會慶典酬神的時","國家劇院售票演出","電視節目錄影","學校考試的時"],"a":0,"e":"野臺歌仔戲依附民間廟會慶典，以酬神為主要目的。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"歌仔戲上常用的曲調是佗兩種？","o":["七字調、都馬調","南管、北管","流行歌、民歌","國歌、校歌"],"a":0,"e":"七字調、都馬調最常用。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「棚頂的皇帝——做袂久」是咧講啥物？","o":["權勢無法度長久","皇帝攏真短命","演員袂曉演皇帝","戲棚真緊就倒"],"a":0,"e":"戲演完就不是皇帝了。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「歹戲欲穿好鞋」比喻啥物？","o":["能力無好，煞想欲得著懸的位","演員愛穿好鞋才好看","戲歹看是鞋仔的問題","看戲愛穿好鞋"],"a":0,"e":"比喻人能力差卻想得到高的職位。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"若班上欲演歌仔戲，愛講笑詼、激詼諧的同學上適合做佗一个角色？","o":["三花","小生","苦旦","老旦"],"a":0,"e":"三花是丑角，負責製造笑料。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"歌仔戲漸漸改變演出型態，咱較應該有啥物態度？","o":["欣賞新創意，嘛寶惜傳統精神","改變就毋是歌仔戲矣","傳統攏應該放棄","干焦老人才需要看"],"a":0,"e":"改變的是創意，不變的是忠孝節義與廟口精神。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};

function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
