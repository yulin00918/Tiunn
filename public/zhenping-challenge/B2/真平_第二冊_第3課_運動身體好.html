<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運動身體好｜真平第二冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../../語境填空.dc.html">← 返回整冊</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第3課｜運動身體好</h1><p>運動、露營與家庭感情</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>掌握人物、事件與課文主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文概念運用到生活情境。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「定定」佇課文是啥物意思？","o":["經常","偶爾","從來無"],"a":0,"e":"阿爸定定𤆬規家伙仔去爬山。"},{"q":"「𤆬」佇課文的意思是？","o":["帶領","等待","忘記"],"a":0,"e":"「𤆬」在這題指的是「帶領」。阿爸𤆬全家去爬山。"},{"q":"「講笑詼」是咧做啥物？","o":["講笑話","唱國歌","寫功課"],"a":0,"e":"露營時全家會講笑詼。"},{"q":"「遐爾仔」是咧表示？","o":["那麼","明仔載","頭一擺"],"a":0,"e":"課文用「遐爾仔近」描寫星星。"},{"q":"「紅膏赤蠘」形容阿公？","o":["面色紅潤、身體勇健","心情足鬱卒","目睭看無"],"a":0,"e":"課文說阿公七十外歲猶閣健康。"},{"q":"「透早」是啥物時陣？","o":["清早","半暝","下晡"],"a":0,"e":"阿公透早就去爬山。"},{"q":"「布棚」佇露營的語境是？","o":["帳篷","布袋戲棚","市場的攤位"],"a":0,"e":"課文說一家人蹛佇一頂布棚內。"},{"q":"「規家伙仔」是指？","o":["全家人","隔壁的同學","一个人"],"a":0,"e":"課文寫一家大小做伙露營。"},{"q":"「互相落氣求進步」較接近？","o":["互相提醒、一起改進","互相責怪袂停","攏毋講話"],"a":0,"e":"教材第13張投影片寫全家露營時「互相落氣求進步」，並譯為在不傷和氣的情況下互掀短處、互相檢討，促進進步；不只是一般聊天。"},{"q":"「勇健」佇課文是指？","o":["身體健康","足愛講笑話","爬山爬真緊"],"a":0,"e":"課文強調運動有助保持健康。"}],"context":[{"q":"阿公除了風颱天落大雨，平常＿＿透早就去山。","o":["定定","從來無","干焦昨昏"],"a":0,"e":"定定表示經常。"},{"q":"阿爸＿＿阮規家伙仔去露營。","o":["𤆬","抾","翕"],"a":0,"e":"𤆬指帶領。"},{"q":"露營時阿兄講一个笑話，逐家聽甲笑咍咍，這就是＿＿。","o":["講笑詼","做戲","膨風"],"a":0,"e":"講笑詼指講笑話。"},{"q":"玉山彼暝的天氣＿＿寒，阮猶原感覺真溫暖。","o":["遐爾仔","毋捌","定著"],"a":0,"e":"遐爾仔是「那麼」。"},{"q":"逐家蹛佇仝一頂＿＿內底，做伙開講。","o":["布棚","戲棚","講臺"],"a":0,"e":"露營住帳篷。"}],"reading":[{"q":"阿公七十外歲猶閣勇健，課文認為主要原因是？","o":["伊有持續運動","伊逐工睏到中晝","伊毋愛出門"],"a":0,"e":"課文直接說阿公因為運動而健康。"},{"q":"阿公佇啥物情況較可能無去爬山？","o":["風颱天落大雨","普通的好天氣","透早天猶未光"],"a":0,"e":"課文指出颱風大雨是例外。"},{"q":"全家露營為啥物感情會閣較好？","o":["有時間做伙開講、講笑詼","逐家攏家己蹛一个房間","露營時攏無講話"],"a":0,"e":"家人同住帳篷、互相交流。"},{"q":"「天氣遐爾仔寒，心是燒滾滾」表現啥物？","o":["環境雖寒，親情卻溫暖","露營的火一定足大","全家攏無感覺"],"a":0,"e":"寒冷的環境和溫暖的感情形成對比。"},{"q":"這課的主要想法是啥物？","o":["運動有益身體，也會當增進家人感情","只有爬玉山才算運動","運動一定愛一个人去"],"a":0,"e":"文章同時談健康和親子互動。"}],"comprehensive":[{"q":"班上欲設計「家庭運動日」，佗个活動上符合課文？","o":["親子做伙健行，途中安排交流","規工各自滑手機","干焦買運動用品"],"a":0,"e":"運動與交流都符合課文重點。"},{"q":"朋友講：「阿公年紀大，毋免運動。」佗个回應較適當？","o":["依身體狀況選擇合適運動","年紀大就一定愛爬高山","毋管天氣攏愛去"],"a":0,"e":"運動要符合個人狀況與安全。"},{"q":"欲寫一張露營心得卡，佗一句較能呈現課文的感受？","o":["天氣雖寒，做伙開講予人心溫暖","露營只愛看帳篷價錢","無人講話才有趣"],"a":0,"e":"課文重視家人共享時光。"},{"q":"山區遇著風颱警報，依課文精神應該按怎做？","o":["先停止爬山，注意安全","照原定計畫上山","干焦看朋友有去無"],"a":0,"e":"課文第9張投影片寫阿公除非遇著風颱天落大雨才不出門爬山。題目延伸到風颱警報時，應以安全為先；這是生活應用，不是課文逐字敘述。"},{"q":"欲解釋「活動、活動，欲活著愛動」，佗个說法較合理？","o":["適量運動有助健康","運動愈激烈一定愈好","無運動的人攏無健康"],"a":0,"e":"課文強調持續活動的好處，不是過度運動。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
