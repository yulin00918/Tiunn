</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🏃</div><h1>第3課｜運動身體好</h1><p>運動、𬦰山、露營佮健康生活</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「紅膏赤蠘」較接近啥物意思？","o":["面色紅潤，身體勇健","面紅紅咧受氣","曝日頭曝甲紅記記","愛食紅蟳"],"a":0,"e":"紅膏赤蠘：臉色紅潤，形容身體健康。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「𬦰山」較接近啥物意思？","o":["爬山","看山","山崩","搬山"],"a":0,"e":"𬦰山：爬山、登山。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「定定」較接近啥物意思？","o":["常常、經常","固定毋振動","一定","慢慢仔"],"a":0,"e":"定定：常常、經常。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「𤆬」較接近啥物意思？","o":["帶領、引導","揹","趕","叫"],"a":0,"e":"𤆬：帶領、引導，例：阿爸𤆬阮去𬦰山。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「布棚」是啥物？","o":["帳篷","布店","衫仔褲","戲棚"],"a":0,"e":"布棚：帳篷，也可指遮陽避雨的棚子。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「講笑詼」較接近啥物意思？","o":["講笑話","講白賊","講歹話","講悄悄話"],"a":0,"e":"講笑詼：打諢、逗笑、講笑話。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「遐爾仔」較接近啥物意思？","o":["那麼","這个所在","彼个時陣","差不多"],"a":0,"e":"遐爾仔：那麼，例：天氣哪會遐爾仔寒？","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「康健」較接近啥物意思？","o":["健康","康樂","健行","勇敢"],"a":0,"e":"康健：健康。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「規家伙仔」較接近啥物意思？","o":["全家人","規个家產","厝內的家私","家族的頭人"],"a":0,"e":"規家伙仔：一家人、全家。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「白死殺」形容啥物？","o":["面色青白，無血色","衫洗甲真白","皮膚真白真媠","驚甲面紅"],"a":0,"e":"白死殺：臉色蒼白沒有血色，和紅膏赤蠘相反。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「互相落氣求進步」較接近啥物意思？","o":["互相講出缺點，鼓勵進步","互相受氣冤家","比賽看啥人較𠢕","互相歕氣球"],"a":0,"e":"在不傷和氣下互掀短處，促使彼此進步。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「我＿＿去圖書館查資料。」空格揀佗一个？","o":["定定","遐爾仔","𤆬","康健"],"a":0,"e":"經常去圖書館，用定定。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這禮拜阿母＿＿阮去澎湖𨑨迌。」空格揀佗一个？","o":["𤆬","揹","趕","定定"],"a":0,"e":"帶領我們去，用𤆬。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「最近天氣哪會＿＿寒？」空格揀佗一个？","o":["遐爾仔","定定","猶原","干焦"],"a":0,"e":"那麼冷，用遐爾仔。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊愛＿＿，予逐家聽甲笑咍咍。」空格揀佗一个？","o":["講笑詼","講白賊","𬦰山","落氣"],"a":0,"e":"讓大家笑，是講笑話。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「暗頓食飽，咱就來去散步行行咧。」用佗一句俗諺上適當？","o":["飯後行百步，較好開藥舖","好額毋值著會食，好命毋值著勇健","未曾學行先學飛","一人行，行較緊；同齊行，行較遠"],"a":0,"e":"飯後走一走，對健康有幫助。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"阿輝堅持逐工運動，因為伊相信有錢毋值著身體勇健。是佗一句俗諺？","o":["好額毋值著會食，好命毋值著勇健","飯後行百步，較好開藥舖","一人行，行較緊；同齊行，行較遠","阿伯仔𬦰山——邊仔喘"],"a":0,"e":"勸人要照顧好身體。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「病若欲緊好，就＿＿噤喙。」照句型，空格揀佗一个？","o":["愛","煞","嘛","才閣"],"a":0,"e":"「……若欲……就愛……」是假設句型。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"全班相招做伙練跑，互相鼓勵，結果攏堅持到最後。用佗一句俗諺上適當？","o":["一人行，行較緊；同齊行，行較遠","飯後行百步，較好開藥舖","未曾學行先學飛，未曾掖種想挽瓜","阿伯仔𬦰山——邊仔喘"],"a":0,"e":"有志同道合的人一起努力，較能堅持到底。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"阿明拍球拄學一禮拜，就想欲參加全國比賽。用佗一句俗諺來提醒伊？","o":["未曾學行先學飛，未曾掖種想挽瓜","好額毋值著會食，好命毋值著勇健","一人行，行較緊；同齊行，行較遠","飯後行百步，較好開藥舖"],"a":0,"e":"學習要循序漸進，沒有一步登天的道理。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊破病蹛院，規个面仔＿＿，攏無血氣。」空格揀佗一个？","o":["白死殺","紅膏赤蠘","紅牙紅牙","燒滾滾"],"a":0,"e":"沒有血色，用白死殺。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"根據課文，阿公七十外猶閣紅膏赤蠘，是啥物原因？","o":["伊有咧運動","伊食真濟補藥","伊定定睏中晝","伊蹛佇山頂"],"a":0,"e":"活動、活動，欲活著愛動。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿公透早定定去佗𬦰山？","o":["牛罵頭山","玉山","阿里山","陽明山"],"a":0,"e":"阿公去家附近的牛罵頭山。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「除非是風颱天落大雨，若無，阿公是毋捌無出門的。」看會出阿公啥物心態？","o":["堅定","固執","堅強","固定"],"a":0,"e":"能每天堅持出門運動，需要很堅定的心。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文講露營會予規家伙仔感情閣較好，主要原因是？","o":["規家大細蹛佇一頂布棚，開講講笑詼","露營會當食真濟好料","露營的所在攏真遠","露營會當看電視"],"a":0,"e":"平常各睡各的房間，露營時一起聊天。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者佇玉山露營彼暝看著啥物？","o":["天星真近，天河看甲清清清","日頭落山","海湧真大","落雪"],"a":0,"e":"天星遐爾仔近，天河看甲清清清。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"下面佗一个毋是課文講的運動好處？","o":["予咱的心燒滾滾","予咱充滿活力","予咱身體勇健","予咱面色紅膏赤蠘"],"a":0,"e":"「心燒滾滾」是講露營時家人的溫暖，不是運動的好處。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"根據課文，佗一个選項是著的？","o":["作者規家伙仔定定去露營，感情才會遐爾仔好","阿公無愛運動","阿爸無佮意講笑詼","阿爸攏去附近的牛罵頭山𬦰山"],"a":0,"e":"去牛罵頭山的是阿公。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文頭一段佮最後一段攏咧強調啥物？","o":["欲活著愛動","露營真趣味","玉山真寒","阿公真古意"],"a":0,"e":"首尾呼應「要活就要動」。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿爸「傳著阿公愛𬦰山的興趣」，意思是？","o":["阿爸嘛佮阿公仝款愛𬦰山","阿爸共阿公講愛𬦰山","阿公無愛𬦰山矣","阿爸教阿公𬦰山"],"a":0,"e":"爸爸遺傳了爺爺喜歡爬山的興趣。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"「跤球」的華語是啥物？","o":["足球","籃球","排球","棒球"],"a":0,"e":"跤球＝足球；野球＝棒球。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「泅水」的華語是啥物？","o":["游泳","划船","潛水","沖水"],"a":0,"e":"泅水＝游泳。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「阿伯仔𬦰山——邊仔喘」比喻啥物？","o":["能力無夠，予人叫去邊仔，莫插手","阿伯仔身體真勇","𬦰山愛行邊仔","𬦰山會使歇睏"],"a":0,"e":"老伯伯爬山在路邊喘，比喻被叫到一邊、不要插手。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"下面佗一个做法上符合本課的精神？","o":["逐禮拜招厝裡的人做伙運動","歇睏日規工睏懶覺","干焦考試的時才運動","食補藥代替運動"],"a":0,"e":"運動讓家人健康又感情好。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「紅膏赤蠘」的相反詞上接近佗一个？","o":["白死殺","紅牙紅牙","勇健","大粒汗細粒汗"],"a":0,"e":"臉色紅潤的相反是蒼白無血色。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"帳篷除了「布棚」，閣有一个日語借詞講法是？","o":["thiàn-tooh","kha-mé-lah","oo-tóo-bái","ba-suh"],"a":0,"e":"thiàn-tooh 是日語借詞，意指帳篷；kha-mé-lah 是相機。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
