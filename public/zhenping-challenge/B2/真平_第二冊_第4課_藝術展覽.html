</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">📷</div><h1>第4課｜藝術展覽</h1><p>攝影、裝置藝術佮生活中的美</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「翕相」較接近啥物意思？","o":["拍照、攝影","掛相片","看相片","畫圖"],"a":0,"e":"翕相：拍照、攝影。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「色水」較接近啥物意思？","o":["顏色","有色的水","洗衫的水","水彩筆"],"a":0,"e":"色水：顏色。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「豐沛」較接近啥物意思？","o":["豐盛","雨落真大","人真濟","真好額"],"a":0,"e":"豐沛：豐盛，例：今仔日的暗頓真豐沛。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「干焦」較接近啥物意思？","o":["只有、僅僅","已經","猶原","較早"],"a":0,"e":"干焦：只有、僅僅。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「不時」較接近啥物意思？","o":["隨時、經常","毋是時陣","無啥時間","偶爾才一擺"],"a":0,"e":"不時：隨時、經常。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「四界」較接近啥物意思？","o":["到處、處處","四个世界","四爿的界線","四个人"],"a":0,"e":"四界：到處、處處。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「另逝」的「逝」是計算啥物的單位？","o":["路程的趟、回","相片的張","戲劇的齣","時間的點鐘"],"a":0,"e":"逝：趟、回，計算路程的單位；另逝＝下一趟。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「kha-mé-lah」是啥物？","o":["相機（日語外來語）","手機仔","電腦","拍手機的人"],"a":0,"e":"kha-mé-lah：日本外來語，照相機。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「敆做一伙」的「敆」較接近啥物意思？","o":["接合","拆開","收起來","分開"],"a":0,"e":"敆：接合。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「貼倚」較接近啥物意思？","o":["貼近","貼紙","倚靠別人","徛佇邊仔"],"a":0,"e":"貼倚：貼近，予攝影藝術貼倚咱現實的生活。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"課文「你莫受氣好無」的「受氣」是啥物意思？","o":["生氣","受傷","吸氣","受人照顧"],"a":0,"e":"受氣：生氣。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「敢是有人客欲來？下暗哪會煮甲遮爾仔＿＿？」空格揀佗一个？","o":["豐沛","干焦","四界","不時"],"a":0,"e":"有客人要來，晚餐很豐盛。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「我＿＿看著人影就臆著伊是啥人。」空格揀佗一个？","o":["干焦","豐沛","四界","另逝"],"a":0,"e":"僅僅看到人影，用干焦。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿媽逐＿＿都講我真古錐。」空格揀佗一个？","o":["不時","干焦","四界","豐沛"],"a":0,"e":"逐不時＝常常。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「你陪我行這＿＿路好無？」空格揀佗一个？","o":["逝","齣","張","擺"],"a":0,"e":"計算路程用「逝」。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阮學校＿＿攏有樹仔。」空格揀佗一个？","o":["四界","干焦","不時","另逝"],"a":0,"e":"到處都有樹，用四界。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這件代誌毋是我烏白講的，是『人徛佇路燈跤——＿＿』。」","o":["有影","無影","愈看愈花","趣味"],"a":0,"e":"人站在路燈下一定有影子，形容事情是真的。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「你寫的這篇文章有夠長，害我『土地公看傀儡——＿＿』。」","o":["愈看愈花","有影","無影","趣味"],"a":0,"e":"老眼昏花看傀儡戲，比喻越看越糊塗。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊講伊看著外星人？我看是『底片走光——＿＿』啦！」","o":["無影","有影","愈看愈花","趣味"],"a":0,"e":"底片曝光就沒影像，形容不真實的事。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「鳥鼠無洗身軀——＿＿」，用來形容啥物？","o":["趣味","臭味","無影","有影"],"a":0,"e":"「鼠味」和「趣味」音近，比喻有趣。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「實在是伊已經退休矣，＿＿閣出來做工課矣！」照句型，空格揀佗一个？","o":["無想欲","毋才","干焦","猶原"],"a":0,"e":"「實在是……無想欲……」說出自己內心的想法。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"婉如是按怎無佮國章做伙去看電影？","o":["伊代先答應阿爸欲陪伊去看展覽","伊無興趣看電影","伊佮國章冤家","伊無錢買票"],"a":0,"e":"她已經先答應爸爸，不想反悔。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"婉如代先答應阿爸就無去看電影，看會出伊有啥物品德？","o":["講會到，做會到","有量才有福","飽穗的稻仔頭犁犁","食人一口，還人一斗"],"a":0,"e":"說到做到，遵守信用。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"婉如去看的展覽有啥物特別？","o":["相片佮裝置藝術、影片、光線、聲音結合","相片排甲整齊整齊吊佇壁頂","干焦有足大張的相片","全部攏是畫圖"],"a":0,"e":"結合多種媒材，好像一齣一齣活跳跳的戲劇。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文講舊相片經過後製，換色水佮內容了後，變做按怎？","o":["煞有新的性命","變甲歹看","攏看袂出來","愈來愈舊"],"a":0,"e":"舊相片經過巧思，有了新的生命。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"攝影家按怎予攝影藝術貼倚咱的生活？","o":["用家族親人的相片，佮在地佮國外的建築物結合","四界翕陌生人","干焦翕風景","用手機仔自翕"],"a":0,"e":"讓作品和親人、家族、土地結合在一起。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"婉如看了展覽了後，想欲做啥物？","o":["用 kha-mé-lah 記錄身軀邊看著、拄著的物件佮人","做一个攝影家","陪阿爸逐禮拜看展覽","用手機仔自翕傳予朋友"],"a":0,"e":"以前只會自拍，現在想記錄身邊的人事物。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"這課主要想欲表達的內涵是啥物？","o":["藝術展覽會予人料想袂著的美好感受","藝術家攏用仝款的眼光","三不五時愛陪厝裡的人四界行","佮朋友冤家愛先寫批"],"a":0,"e":"本課表達藝術展覽帶給主角的美好感受。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"這課的文體是啥物？","o":["書信","現代詩","歌詞","日記"],"a":0,"e":"以婉如寫信給國章的書信應用文呈現。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"下面佗一个符合課文內容？","o":["攝影家將親人的相片佮建築物結合，予藝術貼倚生活","國章寫批予婉如說明原因","婉如一開始就非常佮意看展覽","最後兩人約好另逝去看展覽"],"a":0,"e":"是婉如寫信給國章；她原本也覺得展覽很無聊。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"閩南語有一寡詞會當重疊，像「古錐古錐」。下面佗一个無法度按呢用？","o":["「烏暗烏暗」的生活","「酸微酸微」的梅仔","伊生做「幼秀幼秀」","伊做人「老實老實」"],"a":0,"e":"閩南語「烏暗」不能重疊使用。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"「離開千里遠，毋免開喙問，只要看著我，就知我心腸。」臆一个物件：","o":["批（信）","相片","電話","日記"],"a":0,"e":"信不用開口，看了就知道寫信人的心意。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「有一个所在暗摸摸，台頂看無人咧搬戲，有看影嘛有聽著聲。」臆一个所在：","o":["電影院","美術館","廟口戲台","圖書館"],"a":0,"e":"靠放映看影、聽聲音的地方。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「上山看山勢，入門看人意」提醒咱啥物？","o":["愛注意環境變化，閣愛察言觀色","𬦰山愛看天氣","入門愛脫鞋","人客來愛招待"],"a":0,"e":"做人要隨時注意環境與他人的心意。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"數位翕相機比傳統翕相機較利便的所在是？","o":["翕了隨看，無滿意會當隨閣翕","底片干焦用一擺","愛等翕相館洗出來","相片較𠢕拍歹"],"a":0,"e":"數位相機記憶卡能重複使用，馬上看得到。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"參加藝術活動對心理健康上有幫助的是？","o":["看著美好的物件，予人心情輕鬆快樂","會當提著獎金","會當毋免讀冊","會當予人呵咾"],"a":0,"e":"欣賞藝術是一種良好的休閒活動。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"若你已經答應家人一件代誌，朋友煞臨時招你出去，較好的做法是？","o":["遵守承諾，閣好好仔共朋友解說","隨時改去佮朋友出去","兩爿攏毋去","毋接朋友的電話"],"a":0,"e":"像婉如一樣信守承諾，也委婉說明自己的想法。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
