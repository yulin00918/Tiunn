<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>藝術展覽｜真平第二冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../index.html">← 返回整冊</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第4課｜藝術展覽</h1><p>攝影創意、承諾與觀察生活</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>掌握人物、事件與課文主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文概念運用到生活情境。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「翕相」是啥物意思？","o":["拍照","畫畫","唱歌"],"a":0,"e":"「翕相」就是拍照。教材第7張投影片寫阿爸對翕相有興趣，希望婉如陪伊看展覽，了解攝影的媠。"},{"q":"「色水」佇課文是指？","o":["顏色","水的深度","相機價錢"],"a":0,"e":"舊相片後製會改變色水。"},{"q":"「豐沛」是啥物意思？","o":["豐富、充足","非常安靜","完全一樣"],"a":0,"e":"出版社語詞教材第22張投影片將「豐沛」解作「豐盛」；課文第10張用來形容攝影藝術的表現豐富。"},{"q":"「干焦」是指？","o":["只有","經常","全部"],"a":0,"e":"婉如以前干焦知影用手機自拍。"},{"q":"「不時」佇這課較接近？","o":["經常","永遠無","頭一擺"],"a":0,"e":"看完展覽後婉如不時想記錄生活。"},{"q":"「四界」佇課文是指？","o":["到處","四个人","四點鐘"],"a":0,"e":"婉如想四界翕相。"},{"q":"「另逝」佇信內底是指？","o":["下一次","上一年","今仔日透早"],"a":0,"e":"婉如說另逝還可以做伙出去。"},{"q":"「莫受氣」是咧叫人按怎？","o":["毋通生氣","毋通講話","毋通翕相"],"a":0,"e":"婉如希望朋友不要生氣。"},{"q":"「反悔」是啥物意思？","o":["改變原本答應的代誌","更加認真","提早出門"],"a":0,"e":"婉如已先答應阿爸，不想反悔。"},{"q":"「敆做一伙」佇課文是指？","o":["結合在一起","分開來放","藏起來"],"a":0,"e":"攝影家結合相片與家族、土地。"}],"context":[{"q":"婉如早就答應阿爸看展覽，伊無想欲＿＿。","o":["反悔","講笑詼","膨風"],"a":0,"e":"已答應的約定不想改變。"},{"q":"攝影家將相片、影片、聲音＿＿，作品變甲真特別。","o":["敆做一伙","攏收起來","攏擲掉"],"a":0,"e":"展覽以多種媒材結合。"},{"q":"看了展覽了後，婉如＿＿想用相機記錄生活。","o":["不時","無半擺","從來無"],"a":0,"e":"不時表示經常。"},{"q":"婉如以前＿＿知影用手機自拍，無想過攝影會遮爾豐富。","o":["干焦","四界","另逝"],"a":0,"e":"干焦表示只有。"},{"q":"這擺展覽的作品有相片、影片佮聲音，內容真＿＿。","o":["豐沛","單調","空空"],"a":0,"e":"「豐沛」形容內容豐富充足；作品有多種媒材，毋是單調抑是空空。"}],"reading":[{"q":"婉如為啥物無佮朋友做伙去看電影？","o":["伊先答應阿爸去看展覽","伊完全毋愛看電影","伊去參加比賽"],"a":0,"e":"信裡說先答應父親。"},{"q":"婉如去展覽進前的想法是？","o":["感覺展覽可能真無聊","認為相片一定有聲音","已經真熟悉裝置藝術"],"a":0,"e":"看完展覽後才改變原本的看法。"},{"q":"展覽為啥物予婉如感覺真特別？","o":["相片結合影片、光線、聲音等媒材","只有相片排甲整整齊齊","展場完全無相片"],"a":0,"e":"課文第8至10張寫相片毋是單純吊佇壁頂，攝影家閣結合裝置藝術、影片、光線、畫圖佮聲音，予婉如感覺真特別。"},{"q":"阿爸認為結合家族相片與建築物有啥物意義？","o":["予作品佮親人、土地連結","予相片變甲攏無意義","干焦為著賣相機"],"a":0,"e":"作品因此貼近生活與記憶。"},{"q":"這擺展覽予婉如有啥物改變？","o":["開始想記錄身邊的人佮物件","決定以後毋翕相","從此毋愛出門"],"a":0,"e":"她看完後對攝影產生新興趣。"}],"comprehensive":[{"q":"同學認為「攝影干焦是按快門」，佗个回應較符合課文？","o":["攝影會當結合創意、記憶佮多種媒材","所有相片攏仝款","攝影毋需要觀察"],"a":0,"e":"課文展示多樣的攝影表現。"},{"q":"已經答應家人一項活動，朋友又來邀約，較適當的做法是？","o":["說明原先的約定，閣協調下擺時間","直接失約無解釋","假裝無接著訊息"],"a":0,"e":"婉如向朋友說明並提出下次再約。"},{"q":"學校欲辦「我的家族故事」攝影展，佗个作品構想較符合課文？","o":["用老相片佮在地景物組成故事","只寫相機的售價","干焦拍一張無說明的桌仔"],"a":0,"e":"作品可結合家族記憶與土地。"},{"q":"朋友去展覽進前講「一定無聊」，你會按怎建議？","o":["先親身體驗，閣講感受","未去就先否定","看一張就決定全部"],"a":0,"e":"婉如實際參觀後改變看法。"},{"q":"欲記錄校園生活，佗个做法較能呼應婉如的體會？","o":["觀察身邊的人事物，翕相記錄故事","干焦下載別人的相片","毋看現場就亂寫"],"a":0,"e":"課文鼓勵用影像觀察生活。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
