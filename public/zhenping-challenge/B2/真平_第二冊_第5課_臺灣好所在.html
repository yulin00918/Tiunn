</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🗺️</div><h1>第5課｜臺灣好所在</h1><p>地名的地形、族群、語言佮歷史</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"地名用字「崙」代表啥物地形？","o":["小山丘、小土坡","斜坡","山谷","海邊"],"a":0,"e":"崙：小山丘、小土坡。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"地名用字「崁」代表啥物地形？","o":["較陡直的崖面、山崖","平坦的田地","小溪","海角"],"a":0,"e":"崁：較陡直的崖面，或河階地形。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"地名用字「坪」代表啥物地形？","o":["山凹抑是山跤較平坦的所在","真懸的山","斜坡","河口"],"a":0,"e":"坪：山凹間或山麓上較平坦、可耕種的地。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"地名用字「坑」代表啥物地形？","o":["山谷、溪谷","山頂","平原","海島"],"a":0,"e":"坑：山谷、溪谷。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"地名用字「崎」代表啥物地形？","o":["斜坡","平地","山洞","港口"],"a":0,"e":"崎：斜坡；上崎、落崎就是上坡、下坡。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「捅」較接近啥物意思？","o":["顯露出來、凸出去","拍破","收起來","倒落去"],"a":0,"e":"捅：顯露出來，例：手䘼捅出來矣。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「罔」較接近啥物意思？","o":["姑且、將就","一定","真認真","故意"],"a":0,"e":"罔：姑且、將就，例：罔講、罔聽。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「號名」較接近啥物意思？","o":["取名","叫名","報名","出名"],"a":0,"e":"號名：取名字；地號名＝地名。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「培墓」較接近啥物意思？","o":["掃墓","種樹","起厝","拜拜"],"a":0,"e":"清明節去培墓＝去掃墓。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「匯流」的近義詞是佗一个？","o":["濫流","倒流","落流","清流"],"a":0,"e":"匯流的近義詞是「濫流」。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「交易」的近義詞是佗一个？","o":["買賣","交陪","交代","交換禮物"],"a":0,"e":"交易的近義詞是「買賣」。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「塗跤澹澹，欲落＿＿的時陣愛較細膩咧。」空格揀佗一个？","o":["崎","崙","坪","坑"],"a":0,"e":"下坡叫落崎。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「你內衫的手䘼＿＿出來矣，緊搝入去。」空格揀佗一个？","o":["捅","罔","崁","號"],"a":0,"e":"袖子露出來，用捅。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「閒閒無代誌，＿＿讀寡冊嘛好。」空格揀佗一个？","o":["罔","捅","定定","干焦"],"a":0,"e":"姑且讀點書，用罔。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「彼个＿＿跤有一欉足大欉的樹仔。」空格揀佗一个？","o":["崁","崎","坪","罔"],"a":0,"e":"懸崖的下方叫崁跤。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阮逐冬清明攏愛轉去草山＿＿呢！」空格揀佗一个？","o":["培墓","號名","交易","匯流"],"a":0,"e":"清明節回去掃墓。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「雖然臺灣無蓋大，毋過逐个所在的氣候攏真有特色。」用佗一句俗諺上適當？","o":["基隆雨、新竹風、安平湧","離鄉，無離腔","一府、二鹿、三艋舺","一鄉一俗"],"a":0,"e":"基隆多雨、新竹多風、安平浪大。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"阿公對鹿港搬去臺北五十外冬，講話猶原是鹿港腔。用佗一句俗諺上適當？","o":["離鄉，無離腔","基隆雨、新竹風、安平湧","一府、二鹿、三艋舺","頂港有名聲，下港上出名"],"a":0,"e":"離開故鄉再久，口音也很難改變。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「一府、二鹿、三艋舺」是咧講啥物？","o":["三百外冬前臺灣上興的三个港口","臺灣三間上大的廟","三个上好食的所在","三種地形"],"a":0,"e":"臺南、鹿港、萬華是當時最繁盛的港口。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「厝頂曝衫——＿＿」，臆一个地名：","o":["三塊厝","暖暖","通霄","三峽"],"a":0,"e":"「衫硩厝」和「三塊厝」音近。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「注射了後——＿＿」，臆一个地名：","o":["暖暖","三塊厝","恆春","淡水"],"a":0,"e":"打完針要輕揉，「耎」和「暖」同音。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"新北市三峽的舊地名「三角湧」是按怎來的？","o":["三條溪匯流，形成三角形的平原","佇三个山谷中央","有三粒大石頭","三个人發現的"],"a":0,"e":"橫溪、三峽溪流入大漢溪的匯流點，是三角形平原。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「三貂角」這个地名是對啥物語言轉過來的？","o":["西班牙語","荷蘭語","日語","平埔族語"],"a":0,"e":"西班牙人叫這裡聖地牙哥（San Diego），後來音轉成三貂角。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"臺中市的「大甲」，地名源由是？","o":["道卡斯族的族稱 Taokas 音譯","當地出產真濟甲魚","第一名的意思","西班牙語轉音"],"a":0,"e":"古早號做大甲社，是道卡斯族的住所。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"彰化縣「鹿港」這个名是按怎來的？","o":["較早是鹿皮、鹿角的大宗出口港","港口有足濟鹿仔","港口的形親像鹿","有人飼鹿仔"],"a":0,"e":"以鹿的特產成為港口名。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"萬華的舊名「艋舺」是啥物意思？","o":["平埔族話的獨木舟","淡水河的水頭","一種魚","一種厝"],"a":0,"e":"平埔族語獨木舟讀 Banka，漢人音譯成艋舺。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"根據課文，下面地名的解說佗一个正確？","o":["「三貂角」是對外來語音轉過來的","「三峽」拄好佇三个山谷中央","「艋舺」的意思是淡水河的水頭","「鹿港」是足濟鹿仔的港口"],"a":0,"e":"三峽是三溪匯流；艋舺是獨木舟；鹿港是鹿皮鹿角出口港。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"花蓮舊名「洄瀾」，是因為花蓮溪口的水流迴旋。伊的源由佮佗一个相仝？","o":["三角湧","艋舺","鹿港","三貂角"],"a":0,"e":"洄瀾和三角湧都是由地形特色來取名。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"對話內底，陽明山較早號做「草山」，是啥物原因？","o":["較早滿山全菅芒","山頂攏是草埔","有人佇遐飼牛","山頂有一間草厝"],"a":0,"e":"聽講較早滿山全菅芒，所以號做草山。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"對話內底講的「半線」，是佗一个所在的舊地名？","o":["彰化","新竹","嘉義","臺南"],"a":0,"e":"半線：彰化的舊地名。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文頭尾攏用問句，這種寫法叫做啥物？","o":["設問法","譬喻法","誇飾法","擬人法"],"a":0,"e":"開頭設問引起注意，結尾設問呼應首段。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"高雄的舊地名是啥物？","o":["打狗","雞籠","諸羅","府城"],"a":0,"e":"高雄舊名打狗，由馬卡道族的族語而來。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"基隆的舊地名是啥物？","o":["雞籠","打狗","半線","貓裡"],"a":0,"e":"因和平島形狀像雞籠，或來自平埔族語。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"嘉義的舊地名是啥物？","o":["諸羅","半線","府城","洄瀾"],"a":0,"e":"原為平埔族「諸羅山社」的活動地。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"臺灣的地號名源由，下面佗一个毋是課文講著的？","o":["攏是皇帝號的名","地形特色","無仝族群的語言","在地特產抑是歷史"],"a":0,"e":"課文舉了地形、族群語言、特產歷史三大類。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"〈靜夜思〉內底，李白看著啥物來想起故鄉？","o":["天頂的月娘","床頂的棉被","窗外的梅花","故鄉的囡仔"],"a":0,"e":"舉頭望明月，低頭思故鄉。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"〈回鄉偶書〉「鄉音無改鬢毛衰」，佮佗一句俗諺的意思上接近？","o":["離鄉，無離腔","一鄉一俗","基隆雨、新竹風、安平湧","一府、二鹿、三艋舺"],"a":0,"e":"離開家鄉再久，口音也沒改。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
