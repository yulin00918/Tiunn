</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🌄</div><h1>第6課｜風聲水影日月潭</h1><p>日月潭的風聲水影、心情佮土地感情</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「攬絚絚」較接近啥物意思？","o":["抱甲絚絚","綁甲真絚","攬牢牢毋放手的人","插甲真深"],"a":0,"e":"攬絚絚：抱得緊緊的。絚的反義詞是冗。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「雺霧」較接近啥物意思？","o":["霧","雨","雪","雷"],"a":0,"e":"雺霧：霧，空氣中的水蒸氣遇冷凝結。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"課文「罩佇四邊」的「罩」較接近啥物意思？","o":["覆蓋、籠罩","拍開","吹走","照光"],"a":0,"e":"罩：覆蓋、籠罩。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「鬱卒」較接近啥物意思？","o":["心內愁悶，無暢快","真歡喜","真受氣","真驚惶"],"a":0,"e":"鬱卒：心中愁悶不暢快。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「操煩」較接近啥物意思？","o":["操心煩惱","操練身體","做代誌真無閒","煩人的代誌"],"a":0,"e":"操煩：操心煩惱。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「眠夢」較接近啥物意思？","o":["作夢","睏袂去","睏晝","眠床"],"a":0,"e":"眠夢：作夢、夢想；本課是作夢的意思。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「毋願」較接近啥物意思？","o":["無愛、毋肯","毋知","毋免","毋通"],"a":0,"e":"毋願：不願意、不肯。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「絚」的相反詞是佗一个？","o":["冗","緊","絚絚","牢"],"a":0,"e":"絚 ân：緊；反義詞是冗 līng。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「處處」的近義詞是佗一个？","o":["四界","四邊","四季","四常"],"a":0,"e":"處處＝四界。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「四邊」的近義詞是佗一个？","o":["四爿","四界","四角","四箍輾轉的人"],"a":0,"e":"四邊＝四爿。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「拄著＿＿天，路況看較無，咱騎鐵馬著愛較細膩！」空格揀佗一个？","o":["雺霧","鬱卒","操煩","眠夢"],"a":0,"e":"起霧看不清楚路。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「一時的失敗毋免＿＿，只要咱繼續拍拚。」空格揀佗一个？","o":["鬱卒","雺霧","眠夢","攬絚絚"],"a":0,"e":"失敗不必煩悶。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「序大人一世人攏是為囡仔的代誌咧＿＿。」空格揀佗一个？","o":["操煩","眠夢","雺霧","攬絚絚"],"a":0,"e":"父母一輩子為孩子擔心煩惱。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「毋通規工干焦＿＿上舞台表演，猶是愛先共功夫練予好。」空格揀佗一个？","o":["眠夢","操煩","鬱卒","雺霧"],"a":0,"e":"整天做白日夢。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿母毋願我傷晏睏」的意思是？","o":["阿母無希望我傷晚睏","阿母無愛睏","阿母叫我緊去睏","阿母睏傷晏"],"a":0,"e":"毋願：不希望。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"出外若拄著佮咱無仝的風俗，咱就愛尊重。用佗一句俗諺上適當？","o":["一鄉一俗","頂港有名聲，下港上出名","近水知魚性，近山識鳥音","離鄉，無離腔"],"a":0,"e":"各地有不同的風俗習慣。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「日月潭的風景，去過的人攏呵咾甲會觸舌，全臺灣攏知影。」用佗一句俗諺上適當？","o":["頂港有名聲，下港上出名","一鄉一俗","近水知魚性，近山識鳥音","基隆雨、新竹風、安平湧"],"a":0,"e":"北部有名氣、南部最出名，非常有名。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「查埔的拍籃球」，臆一个臺灣地名：","o":["南投","新竹","淡水","恆春"],"a":0,"e":"男的打籃球＝男生投籃，南投。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「筍仔」，臆一个臺灣地名：","o":["新竹","南投","通霄","竹山"],"a":0,"e":"筍仔就是新長出來的竹子。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「規暝無睏」，臆一个苗栗的地名：","o":["通霄","恆春","淡水","暖暖"],"a":0,"e":"整夜沒睡＝通宵，地名通霄。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「四季如春」，臆一个屏東的地名：","o":["恆春","通霄","南投","淡水"],"a":0,"e":"四季都像春天，恆春。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"日月潭佇佗位？","o":["南投縣魚池鄉","嘉義縣阿里山鄉","花蓮縣秀林鄉","臺東縣長濱鄉"],"a":0,"e":"日月潭在南投縣魚池鄉。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者用各種感官描寫日月潭，伊啥物感官無用著？","o":["喙舌沾著的","目睭看著的","耳空聽著的","鼻仔鼻著的"],"a":0,"e":"山明水秀是視覺，聽風聲是聽覺，陣陣芳是嗅覺。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"若欲共「清風吹來陣陣芳」的「陣陣芳」換掉，佗一个上適當？","o":["芳味送","氣味讚","解憂愁","心花開"],"a":0,"e":"芳 phang 押 ang 韻，「送 sàng」也押 ang 韻。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"根據課文，佗一个分析正確？","o":["日月潭的風景予人心情快活","日月潭干焦春天較媠","日月潭這馬無人欲去","課文講日月潭逐工透早攏罩霧"],"a":0,"e":"四季都迷人，國內外遊客都喜歡。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「中央山脈將伊攬絚絚」，咧形容啥物？","o":["日月潭予中央山脈環抱","山脈欲共日月潭吞落去","日月潭真細窟","山頂有人咧攬"],"a":0,"e":"群山環抱的好山好水。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「拍開心內鬱卒的門窗，清風吹來陣陣芳」，表達啥物心情？","o":["放落煩惱，心情開朗","心情愈來愈鬱卒","驚風吹入來","想欲關窗仔"],"a":0,"e":"日月潭的風景吹散了心中的愁悶。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"本課的作者陳東賢，是做啥物的？","o":["閩南語流行歌曲作家","新聞主播","攝影家","國小老師"],"a":0,"e":"他的理念是「用歌詩，救母語」。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「四季變化，予人心茫茫」的「心茫茫」，本課較接近啥物意思？","o":["心醉、陶醉","心內真亂","心情真鬱卒","毋知欲按怎"],"a":0,"e":"華語翻譯是「令人陶醉」。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"全詩主要押佗幾个韻腳？","o":["ang、an、ann","ong、ing、ung","i、u、a","ai、au、ia"],"a":0,"e":"全詩押 ang、an、ann 三個韻腳。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"「心茫茫」是 ABB 形式，下面佗一个結構相仝？","o":["紅記記","心肝頭","紅膏赤蠘","歡歡喜喜"],"a":0,"e":"新點點、紅記記、心酸酸都是 ABB。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「雙火雙水」，臆一个新北的地名：","o":["淡水","通霄","暖暖","三峽"],"a":0,"e":"淡字是兩個火加三點水。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「近水知魚性，近山識鳥音」比喻啥物？","o":["佇啥物環境生活，就容易學著相關的本事","蹛海邊的人攏𠢕掠魚","愛去山頂聽鳥仔叫","魚佮鳥仔是朋友"],"a":0,"e":"在怎樣的環境，就學得到相關的才能。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"日月潭的傳說內底，救回日頭佮月娘的是啥人？","o":["大尖哥佮水社姐","牛郎佮織女","大甲佮艋舺","土地公佮土地婆"],"a":0,"e":"兩人取得金斧頭、金剪刀，打敗惡龍。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「霧」以外，下面佗一个嘛是自然現象？","o":["霆雷公","鬱卒","操煩","眠夢"],"a":0,"e":"落雪、風颱、霆雷公都是自然現象。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"若欲紹介你去過的臺灣景點，上好包括啥物內容？","o":["地點、風景特色佮你的感受","干焦講門票偌濟錢","干焦講路途真遠","講別人的歹話"],"a":0,"e":"像課文用感官和心情描寫，會更吸引人。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
