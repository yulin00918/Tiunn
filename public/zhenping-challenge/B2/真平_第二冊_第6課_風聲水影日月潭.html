<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>風聲水影日月潭｜真平第二冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../index.html">← 返回整冊</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第6課｜風聲水影日月潭</h1><p>日月潭風景、情緒與歌詩</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文與人物、景物的意義。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文概念運用到生活情境。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「雺霧」是啥物？","o":["霧氣","雨傘","閃電"],"a":0,"e":"課文描寫日月潭四邊的霧氣。"},{"q":"「鬱卒」是指啥物心情？","o":["煩悶、無暢快","真歡喜","足驕傲"],"a":0,"e":"教材說鬱卒是心中愁悶。"},{"q":"「操煩」是指？","o":["擔心煩惱","唱歌","散步"],"a":0,"e":"歌詞鼓勵走出操煩。"},{"q":"「眠夢」是指？","o":["做夢","講笑話","畫圖"],"a":0,"e":"教材第17張將「眠夢」解作「作夢」，例句也用來表示空想；歌詞第8張「毋是眠夢」則強調眼前迷人的景色不是夢。"},{"q":"「罩」佇「罩佇四邊」是指？","o":["籠罩","打開","吹走"],"a":0,"e":"歌詞描寫霧氣籠罩四周。"},{"q":"「攬絚絚」較接近啥物動作？","o":["緊緊抱住","輕輕放開","走甲真緊"],"a":0,"e":"中央山脈將日月潭攬絚絚。"},{"q":"「山明水秀」是咧形容？","o":["山水風景媠","路途危險","都市真鬧熱"],"a":0,"e":"歌詞以山明水秀讚美日月潭。"},{"q":"「自在輕鬆」是指？","o":["無壓力、真放鬆","真煩惱","趕時間"],"a":0,"e":"遊山玩水予人輕鬆自在。"},{"q":"「陣陣芳」描寫啥物？","o":["一陣一陣的芳香","陣陣雷聲","一陣一陣的雨"],"a":0,"e":"歌詞寫清風吹來陣陣芳。"},{"q":"「心茫茫」佇課文是咧形容？","o":["景色迷人予人陶醉","看無方向真驚惶","感覺足生氣"],"a":0,"e":"歌詞說四季變化予人心茫茫。"}],"context":[{"q":"山頂罩著一層＿＿，看路況較無，騎鐵馬愛較細膩。","o":["雺霧","陣陣芳","鬱卒"],"a":0,"e":"「雺霧」是霧氣，會遮擋視線；另外兩項分別關乎氣味與心情。"},{"q":"考試無理想，伊心情真＿＿，朋友來安慰伊。","o":["鬱卒","自在","笑咍咍"],"a":0,"e":"鬱卒表示煩悶。"},{"q":"阿母為囡仔的安全咧＿＿。","o":["操煩","眠夢","遊山玩水"],"a":0,"e":"操煩是擔心煩惱。"},{"q":"去日月潭𨑨迌，予人感覺＿＿。","o":["自在輕鬆","愈來愈鬱卒","足緊張"],"a":0,"e":"歌詞呈現放鬆的旅遊心情。"},{"q":"清風吹來＿＿，予人感覺真舒爽。","o":["陣陣芳","無聲無說","風颱聲"],"a":0,"e":"歌詞以芳香描寫風景。"}],"reading":[{"q":"歌詞「拍開心內鬱卒的門窗」主要欲表達？","o":["走出煩悶，迎向開闊心情","真的欲拆厝內的窗","欲關窗戶袂通開"],"a":0,"e":"用門窗比喻打開心情。"},{"q":"作者用啥物景象描寫日月潭的自然媠？","o":["山明水秀、霧氣、清風佮水影","市場攤位與車潮","都市高樓的霓虹燈"],"a":0,"e":"歌詞描寫山水、雺霧、風與水影。"},{"q":"「聽風的聲，看水的影」運用佗兩種感官？","o":["聽覺佮視覺","味覺佮觸覺","只有嗅覺"],"a":0,"e":"聽聲音是聽覺，看水影是視覺。"},{"q":"歌詞講日月潭四季變化，表示啥物？","o":["無仝季節攏有迷人的風景","干焦春天才媠","逐工景色完全仝款"],"a":0,"e":"歌詞讚美四季不同的景緻。"},{"q":"歌詞提著「雙手牽阮心愛的人」，帶出啥物感受？","o":["有人陪伴、共享美景的溫暖","一个人孤單無伴","對風景真失望"],"a":0,"e":"歌曲把景色與人際情感連結。"}],"comprehensive":[{"q":"班上欲設計日月潭導覽，佗个介紹較符合歌詞？","o":["用風聲、水影佮四季變化紹介景色","只介紹商店價錢","講日月潭無任何特色"],"a":0,"e":"歌曲以多種感官描寫風景。"},{"q":"朋友心情鬱卒，佗一个做法較符合歌詞精神？","o":["陪伊開講、散步，必要時揣信任的大人","叫伊毋通有情緒","假裝攏無看著"],"a":0,"e":"歌詞第6至7張寫「拍開心內鬱卒的門窗」、「行出操煩」，表達走出煩悶的心情。陪伴、傾聽與必要時求助可信任的大人，是本題的生活延伸，不是歌詞逐字列出的做法。"},{"q":"欲用一張相片表現「山明水秀」，較適合拍啥物？","o":["山巒佮湖水相映的景色","停車場收費表","教室裡的黑板"],"a":0,"e":"山明水秀是山水景致。"},{"q":"寫日月潭遊記欲加入聽覺描寫，佗句較適當？","o":["清風吹過樹葉，發出沙沙的聲","湖水的色水真青","遠山的形狀真媠"],"a":0,"e":"樹葉沙沙聲是聽覺描寫。"},{"q":"這首歌除了紹介風景，閣想欲傳達啥物？","o":["放下煩惱、珍惜土地佮身邊的人","出門一定愛花真濟錢","自然景色攏無變化"],"a":0,"e":"歌曲把風景、情緒與人際溫暖連在一起。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
