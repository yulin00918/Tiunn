<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>語文天地一｜真平第二冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../../語境填空.dc.html">← 返回整冊</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>語文天地一</h1><p>動詞與動作語境</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解教材的語法、例句佮俗諺。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把語法佮俗諺應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「動詞」主要表示啥物？","o":["動作或行為","物件的數量","物件的顏色"],"a":0,"e":"教材說動詞表示各種動作。"},{"q":"「阿兄當咧唱歌」的「當咧」表示啥物？","o":["動作正在進行","動作永遠袂發生","動作已經停止"],"a":0,"e":"出版社語文天地（一）第4頁用「阿兄當咧唱歌」說明動作正在進行；「當咧」是進行中的線索。"},{"q":"「我食飽矣」表示啥物？","o":["食飯的動作已經完成","猶未食飯","正欲開始煮飯"],"a":0,"e":"教材第4頁用「我食飽矣」對照「阿兄當咧唱歌」；「矣」在此表示吃飯已完成。"},{"q":"「看冊」的動詞是佗一个？","o":["看","冊","看冊的冊"],"a":0,"e":"看表示動作，冊是看的對象。"},{"q":"「啉茶」的動詞是佗一个？","o":["啉","茶","杯"],"a":0,"e":"啉表示喝的動作。"},{"q":"「掠魚仔」的「掠」表示？","o":["捕捉","休息","睡覺"],"a":0,"e":"教材練習用掠魚仔表達捕魚。"},{"q":"「越頭」是啥物動作？","o":["轉頭","跳起來","坐落去"],"a":0,"e":"越頭指把頭轉過去。"},{"q":"「走」佇「狗仔走真緊」是指啥物？","o":["奔跑","寫字","講話"],"a":0,"e":"這句的「走」指奔跑，不是一般華語「走路」的意思；狗仔走真緊，就是跑得很快。"},{"q":"「搖尾溜」的「搖」是指？","o":["擺動","抓住","咬破"],"a":0,"e":"狗仔會搖尾溜。"},{"q":"「掃地掃壁角」的「掃」是指？","o":["清掃","唱歌","觀看"],"a":0,"e":"俗諺以掃地掃壁角比喻做事澈底。"}],"context":[{"q":"阿兄這馬＿＿唱歌，阿姊佇旁邊聽。","o":["當咧","食飽矣","已經寫煞"],"a":0,"e":"「這馬」提示動作正在進行，「當咧」符合；另外兩項表示完成。"},{"q":"阿明拄才食飯，伊講：「我＿＿。」","o":["食飽矣","當咧食","猶未食"],"a":0,"e":"「拄才食飯」表示剛吃過；用「我食飽矣」說明已經吃飽。不要把「已經」與完整句「食飽矣」硬接成不自然的填空。"},{"q":"阿公坐佇椅仔頂＿＿報紙。","o":["看","啉","掠"],"a":0,"e":"看報紙符合語境。"},{"q":"天氣真熱，阿爸欲＿＿茶。","o":["啉","掠","越"],"a":0,"e":"啉茶表示喝茶。"},{"q":"彼隻狗仔看著主人，就開始＿＿尾溜。","o":["搖","看","食"],"a":0,"e":"搖尾溜是狗仔的動作。"}],"reading":[{"q":"教材用「當咧唱歌」佮「食飽矣」比較啥物？","o":["動作進行佮完成的差別","物件大細","動詞有無顏色"],"a":0,"e":"兩句分別呈現動作進行與完成。"},{"q":"教材學習單寫狗仔會「走、𤆬人、掠魚、搖尾溜」，這幾個詞共同點是啥物？","o":["攏是描寫動作的詞","攏是形容物件的顏色","攏是計算物件的量詞"],"a":0,"e":"出版社語文天地（一）第15頁的狗仔短文，用走、掠、搖等詞描寫狗仔的動作；這些都是動詞的例子。"},{"q":"「掃地掃壁角，洗面洗耳空」強調啥物？","o":["做代誌愛澈底","只做予人看著的所在","掃地無重要"],"a":0,"e":"俗諺比喻做事不能只顧表面。"},{"q":"「跋一倒，抾著一隻金雞母」是啥物意思？","o":["因禍得福","逐工攏會跋倒","雞母會曉飛"],"a":0,"e":"教材解釋為因禍得福。"},{"q":"「烏矸仔貯豆油——看袂出」主要欲形容？","o":["有能力但平常無顯露","物件攏是白色","豆油袂使食"],"a":0,"e":"教材以看袂出形容平時不顯露能力。"}],"comprehensive":[{"q":"欲描述阿妹這馬咧寫字，佗句較適當？","o":["阿妹當咧寫字","阿妹昨昏寫字矣","阿妹明仔載才欲寫"],"a":0,"e":"當咧標示現在進行。"},{"q":"「我食飽矣」佮「我當咧食」有啥物無仝？","o":["前者完成，後者進行","兩句攏是明仔載","兩句攏無動詞"],"a":0,"e":"教材區分動作進行與完成。"},{"q":"學生寫「伊看冊、啉茶、行路」，這三組共同點是？","o":["攏有表示動作的動詞","攏是量詞","攏是地名"],"a":0,"e":"看、啉、行都是動詞。"},{"q":"有人打掃只掃門口，教室角落攏無掃，會當用佗句提醒？","o":["掃地掃壁角，洗面洗耳空","跋一倒，抾著金雞母","烏矸仔貯豆油"],"a":0,"e":"俗諺提醒做事愛澈底。"},{"q":"欲共狗仔活動寫做一段話，佗句動詞運用較完整？","o":["狗仔走過來，搖尾溜，閣跳起來","狗仔的毛真烏","狗仔的名叫阿福"],"a":0,"e":"「走過來」「搖尾溜」「跳起來」連續寫出狗仔的動作，比只交代狗仔在哪裡，更符合這題練習運用動詞的目標。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
