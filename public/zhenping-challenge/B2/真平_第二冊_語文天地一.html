columns:1fr}.q{font-size:23px}}

</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🗣️</div><h1>語文天地（一）｜動詞</h1><p>目睭、喙、頭、手、跤相關動詞</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「金金相」的「相」是啥物動作？","o":["盯著看","互相","相片","相拍"],"a":0,"e":"相 siòng：盯視，例：金金相。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「啉茶」的「啉」是啥物動作？","o":["喝、飲","吹","倒","泡"],"a":0,"e":"啉：喝、飲。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「越頭」的「越」是啥物動作？","o":["轉頭、回頭","跳過去","頭殼痛","點頭"],"a":0,"e":"越 uat：轉、回頭。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「挽果子」的「挽」是啥物動作？","o":["採、摘","洗","削","買"],"a":0,"e":"挽：採、拔、摘取。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「掠魚」的「掠」是啥物動作？","o":["抓、捕","煮","飼","賣"],"a":0,"e":"掠：捕、抓。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"閩南語的「行」，華語是啥物？","o":["走","跑","爬","跳"],"a":0,"e":"行 kiânn＝走；走 tsáu＝跑。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"閩南語的「走」，華語是啥物？","o":["跑","走","爬","坐"],"a":0,"e":"走 tsáu：跑，例：逃走。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「𬦰山」的「𬦰」是啥物動作？","o":["爬、攀登","看","跳","揹"],"a":0,"e":"𬦰 peh：爬、攀登。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"下面佗一个動詞是佮「喙」相關的？","o":["食","挽","行","越"],"a":0,"e":"食、啉都和嘴巴有關。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"下面佗一个動詞是佮「跤」相關的？","o":["𬦰","掠","啉","相"],"a":0,"e":"行、走、𬦰都和腳有關。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「這隻狗仔＿＿真緊，閣會曉𬦰樹仔。」空格揀佗一个？","o":["走","搖","掠","啉"],"a":0,"e":"跑得很快，用走。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊用後跤＿＿路嘛無問題。」空格揀佗一个？","o":["行","走","掠","搖"],"a":0,"e":"用後腳走路，用行。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿華有當時仔會𤆬伊去溪裡＿＿魚仔。」空格揀佗一个？","o":["掠","挽","搖","相"],"a":0,"e":"抓魚用掠。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「逐擺看著我來，尾溜就隨＿＿起來。」空格揀佗一个？","o":["搖","走","行","越"],"a":0,"e":"尾巴擺動用搖。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊一直共我金金＿＿，害我足歹勢。」空格揀佗一个？","o":["相","看","越","搖"],"a":0,"e":"一直盯著看，用金金相。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「聽著有人叫我，我就＿＿頭看。」空格揀佗一个？","o":["越","搖","相","挽"],"a":0,"e":"回頭用越頭。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿公佇果子園咧＿＿弓蕉。」空格揀佗一个？","o":["挽","掠","啉","走"],"a":0,"e":"採水果用挽。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"下面佗一个毋是「球」會用的動詞？","o":["啉","踢","拍","耍"],"a":0,"e":"踢球、拍球、耍球都可以；啉是喝。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"下面佗一个會當佮「茶」做伙用？","o":["啉","挽","掠","相"],"a":0,"e":"啉茶。另外也可說泡茶、捧茶。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"「阿兄當咧唱歌」這句，表示動作是啥物狀態？","o":["當咧進行","已經完成","猶未開始","欲開始"],"a":0,"e":"當咧＝正在，表示進行中。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「我食飽矣」這句，表示動作是啥物狀態？","o":["已經完成","當咧進行","猶未開始","定定做"],"a":0,"e":"「矣」表示已經完成。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"閩南語的動詞有啥物特色？","o":["無時態變化，靠其他詞表示進行抑是完成","動詞攏愛加 -ed","每一句攏無動詞","動詞干焦有一種講法"],"a":0,"e":"閩南語動詞無時態變化。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"笑話〈學講話〉內底，阿明講「我會曉飛」，鸚哥按怎應？","o":["我聽你咧臭彈","我會曉飛","我會曉唱歌","你足厲害"],"a":0,"e":"鸚哥前兩句都學舌，最後一句卻吐槽阿明吹牛。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"笑話〈學講話〉好笑的所在是啥物？","o":["鸚哥原本攏學人講，最後煞家己應話","鸚哥真正會飛","阿明袂曉講話","鸚哥唱歌真好聽"],"a":0,"e":"鸚哥突然自己回話，出乎意料。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「臭彈」較接近啥物意思？","o":["吹牛、講大話","臭味真重","彈吉他","拍炮仔"],"a":0,"e":"臭彈：吹牛，和「膨風」意思相近。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"「跋一倒，抾著一隻金雞母」比喻啥物？","o":["因禍得福","行路愛細膩","飼雞仔會好額","貪心會跋倒"],"a":0,"e":"跌一跤卻撿到金母雞。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「掃地掃壁角，洗面洗耳空」比喻啥物？","o":["做代誌愛澈底，莫做表面","愛定定掃地","愛定定洗面","耳空愛清清氣氣"],"a":0,"e":"做事要徹底，不能只做表面工夫。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「會曉偷食，袂曉拭喙」比喻啥物？","o":["做代誌袂曉善後","食物件愛拭喙","偷食是毋著的","食傷濟"],"a":0,"e":"偷吃卻不擦嘴，比喻做事不會善後。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「烏矸仔貯豆油——看袂出」形容啥物？","o":["有本事毋過平常時無表現出來","豆油真烏","目睭看袂清楚","罐仔歹去"],"a":0,"e":"黑瓶裝醬油看不出來。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「白布沐著打馬膠——＿＿」，後半句是啥物？","o":["歹勢（歹洗）","看袂出","有影","趣味"],"a":0,"e":"柏油很難洗，「歹洗」音近「歹勢」。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"下面佗一句的動詞用了上適當？","o":["阿母佇灶跤啉一杯燒茶","阿爸咧挽魚仔","小妹咧掠弓蕉","阿公咧啉山"],"a":0,"e":"啉茶正確；掠魚、挽弓蕉、𬦰山才對。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
