<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>語文天地二｜真平第二冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../index.html">← 返回整冊</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>語文天地二</h1><p>量詞與生活語境</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解教材的語法、例句佮俗諺。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把語法佮俗諺應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「量詞」主要用來表示啥物？","o":["物件或動作的計量單位","動作進行的時間","地方的名稱"],"a":0,"e":"出版社語文天地（二）第3頁說量詞可表示物件、動作的單位，也能依形狀或種類作分類，例如「一粒球」「一塊粿」。"},{"q":"「一粒球」的「粒」是啥物？","o":["量詞","動詞","地名"],"a":0,"e":"「一粒球」在這題指的是「量詞」。粒是球的計量單位。"},{"q":"「一塊粿」的「塊」是啥物？","o":["量詞","顏色","動作"],"a":0,"e":"「一塊粿」在這題指的是「量詞」。塊是粿的計量單位。"},{"q":"「一領衫」的「領」是啥物？","o":["衫的量詞","衫的顏色","衫的價錢"],"a":0,"e":"「一領衫」在這題指的是「衫的量詞」。教材練習以領計算衣服。"},{"q":"「一枇蕉」的「枇」是啥物？","o":["一組香蕉的量詞","香蕉的顏色","香蕉的產地"],"a":0,"e":"「枇」用來計量一組蕉；出版社第5頁另外提到不同地區有「子、枇、弓」等用法，不能認為全臺只用同一個量詞。"},{"q":"「一隻飛行機」的「隻」是啥物？","o":["飛行機的量詞","飛行機的動作","飛行機的方向"],"a":0,"e":"「一隻飛行機」在這題指的是「飛行機的量詞」。教材練習使用隻。"},{"q":"「一滴汗」的「滴」是指？","o":["少量液體的單位","一棟建築","一段路"],"a":0,"e":"教材補充以滴計算汗與藥水。"},{"q":"「一副目鏡」的「副」是指？","o":["一組眼鏡的量詞","一間房屋","一個人"],"a":0,"e":"教材補充以副計算目鏡。"},{"q":"「一段路」的「段」是指？","o":["一部分路程","一粒米","一隻動物"],"a":0,"e":"教材以段計算路程與時間。"},{"q":"「一欉」佇「一欉樹仔」是指？","o":["植物的量詞","船的量詞","衣服的量詞"],"a":0,"e":"教材俗諺用一欉描述栽種的植物。"}],"context":[{"q":"阿爸買一＿＿蕉轉來；這題指定練習教材中的「一枇蕉」。","o":["枇","領","滴"],"a":0,"e":"出版社語文天地（二）第5頁說明蕉的量詞有不同地區的說法；本題指定「一枇蕉」，所以填「枇」，不代表其他地區說法都錯。"},{"q":"小弟有兩＿＿衫。","o":["領","滴","棟"],"a":0,"e":"教材示例兩領衫。"},{"q":"頭前有三＿＿飛行機飛過。","o":["隻","盤","滴"],"a":0,"e":"教材示例三隻飛行機。"},{"q":"阿母準備一＿＿菜，欲予逐家食。","o":["盤","領","枇"],"a":0,"e":"「盤」用來計量一盤菜；「領」配衫，「枇」配蕉。"},{"q":"運動了後，伊額頭流一＿＿汗。","o":["滴","棟","領"],"a":0,"e":"一滴汗是教材補充的量詞搭配。"}],"reading":[{"q":"教材為啥物用「一粒球」佮「一塊粿」做例？","o":["量詞會依物件形狀佮種類改變","所有物件攏用仝一个量詞","量詞干焦會用佇人名"],"a":0,"e":"量詞也表達分類概念。"},{"q":"「一枝筆」佮「一肢手」有啥物無仝？","o":["字形無仝，用法也無仝","兩个攏是計算筆","兩个攏是計算手"],"a":0,"e":"出版社語文天地（二）第14頁區分「枝」用於筆等細長物，「肢」用於手、跤等四肢；字形相近但計量對象不同。"},{"q":"「一粒米，百粒汗」欲提醒啥物？","o":["珍惜糧食與農人的辛苦","米愈濟愈袂飽","種田完全無辛苦"],"a":0,"e":"俗諺提醒糧食得來不易。"},{"q":"「家己栽一欉，較贏看別人」主要欲講？","o":["家己動手做較有收穫","永遠毋通請人鬥相共","樹仔毋免照顧"],"a":0,"e":"出版社語文天地（二）第17頁解釋這句俗諺是在提醒人要靠自己，不要只依賴別人；重點是自力完成事情。"},{"q":"「一粒頭，兩粒大」形容啥物心情？","o":["煩惱、困擾","歡喜到跳舞","食甲真飽"],"a":0,"e":"教材解釋為很困擾、煩惱。"}],"comprehensive":[{"q":"欲寫一張買物清單，佗一个量詞搭配較適當？","o":["一領衫、一枇蕉","一滴衫、一領蕉","一棟蕉、一滴衫"],"a":0,"e":"量詞要符合物件種類。"},{"q":"有人講「量詞攏無差，隨便用就好」，較適當的回應是？","o":["量詞會幫咱表達物件的種類佮數量","所有物件攏愛用粒","量詞攏無實際用途"],"a":0,"e":"教材強調量詞的分類作用。"},{"q":"欲記錄家己種的樹仔，佗个寫法較適當？","o":["我栽一欉樹仔","我栽一滴樹仔","我栽一領樹仔"],"a":0,"e":"一欉適合用於植物。"},{"q":"食飯時有人欲共飯倒掉，會當用佗句俗諺提醒？","o":["一粒米，百粒汗","一粒頭，兩粒大","烏矸仔貯豆油"],"a":0,"e":"俗諺強調珍惜糧食。"},{"q":"「一支鼻」「一枝筆」「一肢手」予咱學著啥物？","o":["發音相近的量詞，漢字與搭配可能無仝","三項攏是計算衫","所有量詞攏用仝一个字"],"a":0,"e":"出版社語文天地（二）第14頁分別介紹「支、枝、肢」的搭配，如一支鼻、一枝筆、一肢手；不能只因讀音相近就混用字形。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
