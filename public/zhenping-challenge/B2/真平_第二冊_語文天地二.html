columns:1fr}.q{font-size:23px}}

</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🔢</div><h1>語文天地（二）｜量詞</h1><p>量詞語法、數量差異佮生活搭配</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「一捾肉粽」的「捾」是計算啥物的單位？","o":["成串的物件","蒸籠的層數","一粒一粒","一桶"],"a":0,"e":"捾：計算成串的東西，例：一大捾荔枝。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「一床包仔」的「床」是計算啥物的單位？","o":["蒸籠的層數","眠床","成串的物件","盤仔"],"a":0,"e":"床：計算蒸籠層數的單位，一床包仔＝一籠包子。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「一子弓蕉」的「子」等同華語的啥物？","o":["根","串","籃","箱"],"a":0,"e":"子：計算香蕉的單位，等同於「根」。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「一枇弓蕉」的「枇」是計算啥物的單位？","o":["成串的物件","一根一根","蒸籠","車班"],"a":0,"e":"枇：計算成串物品，例：兩枇烏魚子。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「一幫公車」的「幫」是計算啥物的單位？","o":["車次、班次","一台車","一陣人","一條路"],"a":0,"e":"幫：計算車次，例：我欲坐後幫車。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「一領衫」的「領」，華語較接近？","o":["件","條","雙","頂"],"a":0,"e":"一領衫＝一件衣服。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「一跤襪仔」的「跤」，華語較接近？","o":["雙","支","條","頂"],"a":0,"e":"一跤襪仔＝一雙襪子。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「事事項項」這種重疊量詞，表示啥物？","o":["每一項、逐項","照順序一項一項","干焦一項","真少項"],"a":0,"e":"重疊量詞表示整體的「每一个、逐个」。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「一本一本、三蕊三蕊」這種講法，表示啥物？","o":["照順序抑是分堆計算","每一本","真濟本","無半本"],"a":0,"e":"量詞重疊表示照順序或分堆計算。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「一肢手」的「肢」，是計算啥物的單位？","o":["人體抑是動物的四肢佮指頭","細長的物件","口鼻佮骨頭","成串的物件"],"a":0,"e":"肢：四肢及手指、腳趾，例：一肢跤。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「阿爸拄才買一（ ）弓蕉轉來。」括號內上適當的是？","o":["枇","領","幫","頂"],"a":0,"e":"一串香蕉用枇。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「小弟有兩（ ）衫。」括號內上適當的是？","o":["領","跤","頂","枇"],"a":0,"e":"衣服用領。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「拄才有三（ ）飛行機飛過。」括號內上適當的是？","o":["隻","領","頂","枇"],"a":0,"e":"課本：一隻飛行機。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿忠講：我有二十（ ）航空公司。」括號內上適當的是？","o":["間","棟","台","隻"],"a":0,"e":"公司用間。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「我有四十（ ）船、六十（ ）遊覽車。」括號內依序上適當的是？","o":["隻、台","台、隻","間、塊","棟、間"],"a":0,"e":"船用隻，車用台。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「我有八十（ ）別莊，閣有一百（ ）地！」括號內依序上適當的是？","o":["棟、塊","塊、棟","間、台","隻、塊"],"a":0,"e":"房子用棟，土地用塊。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「一（ ）鼻、一（ ）鉸刀」括號內上適當的是？","o":["支","枝","肢","條"],"a":0,"e":"支：計算口鼻、骨頭及某些事物。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「一（ ）筆、一（ ）薰」括號內上適當的是？","o":["枝","支","肢","粒"],"a":0,"e":"枝：計算細長物體。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「一（ ）耳鉤、一（ ）雙生仔」括號內上適當的是？","o":["對","副","段","盤"],"a":0,"e":"成雙的用對。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「一（ ）目鏡、一（ ）碗箸」括號內上適當的是？","o":["副","對","雙","塊"],"a":0,"e":"成套的用副。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"〈歕雞胿比賽〉內底，阿忠講家己有真濟物件，伊是咧做啥物？","o":["歕雞胿、講大話","講真話","講古","唱歌"],"a":0,"e":"歕雞胿＝吹牛。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿文干焦講一句「我是阿忠的頭家」，就得著冠軍，是啥物原因？","o":["一句話就比阿忠所有的物件閣較大","伊講的是真的","伊上早講","伊講甲上久"],"a":0,"e":"當阿忠的老闆，等於比阿忠更有錢，是最厲害的吹牛。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"量詞「一粒肉粽、一捾肉粽、一床肉粽」，數量是按怎變化？","o":["愈來愈濟","愈來愈少","攏仝款","無一定"],"a":0,"e":"單數→少量→大量。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「一滴水、一杯水、一桶水」佗一个上濟？","o":["一桶水","一滴水","一杯水","攏仝濟"],"a":0,"e":"量詞不同，數量就不同。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"繞口令「我有一隻狗，狗尾拖一个斗」，後一句是？","o":["毋知狗拖斗，抑是斗拖狗","狗仔真古錐","斗內底有米","狗仔走真緊"],"a":0,"e":"繞口令重點在狗、斗兩字反覆。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"下面佗一組量詞用了攏正確？","o":["一雙箸、一塊碗、一支湯匙","一塊箸、一雙碗、一領湯匙","一領箸、一支碗、一頂湯匙","一雙箸、一頂碗、一跤湯匙"],"a":0,"e":"食的方面：一雙箸、一塊碗、一支湯匙。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"「一粒頭，兩粒大」形容啥物？","o":["真困擾、煩惱","頭殼真大","真巧","真歡喜"],"a":0,"e":"一個頭兩個大，形容很煩惱。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「一粒米，百粒汗」提醒咱啥物？","o":["作穡人真辛苦，毋通拍損糧食","食飯會流汗","米真貴","愛定定運動"],"a":0,"e":"比喻農夫種田辛勞，糧食不可浪費。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「家己栽一欉，較贏看別人」比喻啥物？","o":["愛靠家己，莫靠別人","種樹真好","愛看別人按怎做","樹仔愈濟愈好"],"a":0,"e":"比喻要靠自己不要靠別人。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"下面佗一組「住」的量詞用了正確？","o":["一棟厝、一組膨椅、一塊桌仔","一隻厝、一領膨椅、一跤桌仔","一塊厝、一雙膨椅、一頂桌仔","一台厝、一枝膨椅、一條桌仔"],"a":0,"e":"一棟厝、一組膨椅、一塊桌仔。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"下面佗一个量詞用毋著？","o":["一領帽仔","一頂帽仔","一台跤踏車","一段路"],"a":0,"e":"帽子要用「頂」。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"閩南語的量詞會當用來分類，「一粒球、一塊粿」主要是按照啥物分類？","o":["形狀","色水","價錢","重量"],"a":0,"e":"粒和塊是用形狀來分類。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
