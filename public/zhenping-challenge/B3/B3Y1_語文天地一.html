te-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../index.html">← 返回整冊</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>語文天地一｜疊字詞</h1><p>疊字詞、語境判斷與生活應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文的意象、情感與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文理解運用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「金金看」佇這課的意思是？","o":["四處亂跑","目不轉睛注視","非常思念"],"a":1,"e":"「金金看」佇教材的解說是「目不轉睛注視」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「呿呿嗽」佇這課的意思是？","o":["一直重複嘮叨","每一件事","咳個不停"],"a":2,"e":"「呿呿嗽」佇教材的解說是「咳個不停」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「嘛嘛吼」佇這課的意思是？","o":["嚎啕大哭","往來頻繁","紅彤彤"],"a":0,"e":"「嘛嘛吼」佇教材的解說是「嚎啕大哭」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「拋拋走」佇這課的意思是？","o":["非常思念","四處亂跑","熱騰騰"],"a":1,"e":"「拋拋走」佇教材的解說是「四處亂跑」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「踅踅唸」佇這課的意思是？","o":["每一件事","目不轉睛注視","一直重複嘮叨"],"a":2,"e":"「踅踅唸」佇教材的解說是「一直重複嘮叨」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「來來去去」佇這課的意思是？","o":["往來頻繁","紅彤彤","咳個不停"],"a":0,"e":"「來來去去」佇教材的解說是「往來頻繁」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「思思念念」佇這課的意思是？","o":["熱騰騰","非常思念","嚎啕大哭"],"a":1,"e":"「思思念念」佇教材的解說是「非常思念」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「事事項項」佇這課的意思是？","o":["目不轉睛注視","四處亂跑","每一件事"],"a":2,"e":"「事事項項」佇教材的解說是「每一件事」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「紅記記」佇這課的意思是？","o":["紅彤彤","咳個不停","一直重複嘮叨"],"a":0,"e":"「紅記記」佇教材的解說是「紅彤彤」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「燒滾滾」佇這課的意思是？","o":["嚎啕大哭","熱騰騰","往來頻繁"],"a":1,"e":"「燒滾滾」佇教材的解說是「熱騰騰」；其餘兩項是不同意思，袂當互相替換。"}],"context":[{"q":"伊規工咳嗽無停，會當講伊「＿＿」。","o":["金金看","踅踅唸","呿呿嗽"],"a":2,"e":"題幹的線索是「伊規工咳嗽無停，會當講伊「（空格）」。」；此處要表達「呿呿嗽」的用法，另外兩項不符合這个情境。"},{"q":"鳳凰花開甲真紅，會當講「＿＿」。","o":["紅記記","嘛嘛吼","來來去去"],"a":0,"e":"題幹的線索是「鳳凰花開甲真紅，會當講「（空格）」。」；此處要表達「紅記記」的用法，另外兩項不符合這个情境。"},{"q":"湯才煮好，猶原「＿＿」。","o":["踅踅唸","燒滾滾","事事項項"],"a":1,"e":"題幹的線索是「湯才煮好，猶原「（空格）」。」；此處要表達「燒滾滾」的用法，另外兩項不符合這个情境。"},{"q":"嬰仔大聲哭鬧，會當講「＿＿」。","o":["事事項項","金金看","嘛嘛吼"],"a":2,"e":"題幹的線索是「嬰仔大聲哭鬧，會當講「（空格）」。」；此處要表達「嘛嘛吼」的用法，另外兩項不符合這个情境。"},{"q":"伊逐禮拜攏愛往返臺北佮桃園，會當講伊「＿＿」。","o":["來來去去","拋拋走","思思念念"],"a":0,"e":"「逐禮拜」「往返」提示固定而反覆的來回；「來來去去」比四處亂跑更符合句意。"}],"reading":[{"q":"「事事項項」佇教材的分類屬於啥物詞性？","o":["名詞","動詞","形容詞"],"a":0,"e":"「事事項項」指各種事情或事項；依這份教材的疊字詞分類，歸佇名詞類。"},{"q":"「紅記記」屬於啥物詞性？","o":["形容詞","動詞","名詞"],"a":0,"e":"本題問的是「「紅記記」屬於啥物詞性？」；依教材的分類抑是例句，應選「形容詞」，另外兩項無符合題目所指的用法。"},{"q":"「踅踅唸」屬於啥物詞性？","o":["動詞","名詞","形容詞"],"a":0,"e":"本題問的是「「踅踅唸」屬於啥物詞性？」；依教材的分類抑是例句，應選「動詞」，另外兩項無符合題目所指的用法。"},{"q":"下面佗一个解說符合「疊字詞」的特色？","o":["仝一个漢字重疊兩擺抑是三擺","用仝音的漢字取代原字","將詞語全部寫做羅馬字"],"a":0,"e":"教材將疊字詞定義做同一漢字重疊兩次或三次；不是同音替字，也不是書寫系統。"},{"q":"「頭燒燒，尾冷冷」主要形容？","o":["名詞","形容詞","做代誌袂當有始有終"],"a":2,"e":"本題問的是「「頭燒燒，尾冷冷」主要形容？」；依教材的分類抑是例句，應選「做代誌袂當有始有終」，另外兩項無符合題目所指的用法。"}],"comprehensive":[{"q":"欲形容有人目睭一直看著一个所在，選啥物詞？","o":["金金看","事事項項","思思念念"],"a":0,"e":"本題問的是「欲形容有人目睭一直看著一个所在，選啥物詞？」；依教材的分類抑是例句，應選「金金看」，另外兩項無符合題目所指的用法。"},{"q":"欲講逐項代誌，無論大項細項，攏愛處理，較適當的詞是？","o":["金金看","事事項項","思思念念"],"a":1,"e":"「事事項項」表示每一件事、各種事項，題幹著重「逐項」而非保證每項都已顧好。"},{"q":"欲形容想念親人想甲真深，選啥物詞？","o":["金金看","事事項項","思思念念"],"a":2,"e":"本題問的是「欲形容想念親人想甲真深，選啥物詞？」；依教材的分類抑是例句，應選「思思念念」，另外兩項無符合題目所指的用法。"},{"q":"欲形容囡仔佇厝內四界走，選啥物詞？","o":["拋拋走","金金看","事事項項"],"a":0,"e":"本題問的是「欲形容囡仔佇厝內四界走，選啥物詞？」；依教材的分類抑是例句，應選「拋拋走」，另外兩項無符合題目所指的用法。"},{"q":"欲形容阿公一直重複講仝一件代誌，選啥物詞？","o":["金金看","踅踅唸","事事項項"],"a":1,"e":"本題問的是「欲形容阿公一直重複講仝一件代誌，選啥物詞？」；依教材的分類抑是例句，應選「踅踅唸」，另外兩項無符合題目所指的用法。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
