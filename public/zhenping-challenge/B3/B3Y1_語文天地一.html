-columns:1fr}.q{font-size:23px}}

</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🔁</div><h1>語文天地（一）｜疊字詞</h1><p>疊字動詞、名詞、形容詞</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「金金看」較接近啥物意思？","o":["目睭金金，看甲毋振動","看著金仔","看甲目睭花","看一下就走"],"a":0,"e":"金金看：凝視、目不轉睛。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「呿呿嗽」較接近啥物意思？","o":["嗽袂停","笑袂停","哭袂停","講袂停"],"a":0,"e":"呿呿嗽：咳個不停。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「嘛嘛吼」較接近啥物意思？","o":["大聲哭","大聲笑","大聲叫","大聲唱"],"a":0,"e":"嘛嘛吼：嚎啕大哭。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「踅踅唸」較接近啥物意思？","o":["一直重複唸、嘮叨","四界踅","唸冊","唸經"],"a":0,"e":"踅踅唸：喋喋不休。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「思思念念」較接近啥物意思？","o":["非常思念","一直想代誌","記袂牢","真煩惱"],"a":0,"e":"思思念念：非常思念。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「紅記記」較接近啥物意思？","o":["紅彤彤","紅色的記號","記甲真清楚","面紅紅"],"a":0,"e":"紅記記：形容顏色極紅。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「白蔥蔥」較接近啥物意思？","o":["非常白","蔥仔白","白色的蔥","白白浪費"],"a":0,"e":"白蔥蔥：非常潔白。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「離離落落」較接近啥物意思？","o":["零零落落、無條理","離開了後跋落去","一直落雨","分離"],"a":0,"e":"離離落落：凌亂沒有條理。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「糜糜卯卯」較接近啥物意思？","o":["扭曲變形、一團亂","煮糜","真滑","整齊"],"a":0,"e":"糜糜卯卯：東西扭曲變形、事情弄得一團糟。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「閒仙仙」較接近啥物意思？","o":["閒閒無代誌","神仙","真無閒","閒話"],"a":0,"e":"閒仙仙：閒著沒事幹。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「伊穿甲規身軀＿＿。」空格揀佗一个？","o":["紅記記","呿呿嗽","嘛嘛吼","家家戶戶"],"a":0,"e":"全身穿紅的。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「佇這个社區，＿＿攏會共糞埽分類。」空格揀佗一个？","o":["家家戶戶","來來去去","事事項項","離離落落"],"a":0,"e":"每一家都會分類垃圾。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「嬰仔是按怎＿＿？敢是腹肚枵？」空格揀佗一个？","o":["嘛嘛吼","呿呿嗽","金金看","拋拋走"],"a":0,"e":"嬰兒大哭。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「話講甲＿＿，是啥人聽有啦！」空格揀佗一个？","o":["離離落落","紅記記","燒滾滾","家家戶戶"],"a":0,"e":"講得零零落落。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「你規工＿＿，愛緊去予醫生看。」空格揀佗一个？","o":["呿呿嗽","嘛嘛吼","拋拋走","金金看"],"a":0,"e":"咳個不停要看醫生。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊規年迵天攏佇日本佮臺灣＿＿。」空格揀佗一个？","o":["來來去去","家家戶戶","事事項項","離離落落"],"a":0,"e":"來來往往。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿叔的車予人挵甲＿＿。」空格揀佗一个？","o":["糜糜卯卯","紅記記","白蔥蔥","金金看"],"a":0,"e":"車子被撞得變形。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊一日到暗＿＿，足歹揣的。」空格揀佗一个？","o":["拋拋走","呿呿嗽","踅踅唸","嘛嘛吼"],"a":0,"e":"到處亂跑，很難找。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「你上愛食啥物？」下面佗一个回答較適當？","o":["我上愛食燒滾滾的火鍋","我上愛食呿呿嗽的菜頭","我上愛食紅記記的柳丁","我上愛食白蔥蔥的柑仔"],"a":0,"e":"燒滾滾形容熱騰騰的食物。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「囡仔著生驚，吐奶＿＿。」空格用佗一个較適當？","o":["嘛嘛吼","拋拋走","金金看","踅踅唸"],"a":0,"e":"小孩受驚嚇，大哭。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"「疊字詞」是啥物？","o":["仝一个字重疊兩擺抑三擺的語詞","兩个無仝的字","外來語","擬聲詞"],"a":0,"e":"疊字詞：同一字重疊兩次或三次。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"下面佗一个是疊字「名詞」？","o":["事事項項","金金看","紅記記","嘛嘛吼"],"a":0,"e":"事事項項、家家戶戶是疊字名詞。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"下面佗一个是疊字「動詞」？","o":["踅踅唸","紅記記","白蔥蔥","家家戶戶"],"a":0,"e":"金金看、呿呿嗽、踅踅唸是疊字動詞。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"下面佗一个疊字詞的華語解說毋著？","o":["拋拋走：走路、步行","事事項項：每一件事","家家戶戶：每家","金金看：目不轉睛的看著"],"a":0,"e":"拋拋走是到處亂跑。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「黃錦錦」形容啥物？","o":["顏色金黃","真濟錦旗","黃色的布","真貴"],"a":0,"e":"黃錦錦：形容顏色金黃。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「活跳跳」形容啥物？","o":["活力充沛","跳懸跳低","真受氣","死去"],"a":0,"e":"活跳跳：活蹦亂跳。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"「白白布染甲烏」比喻啥物？","o":["顛倒是非","布染了真媠","衫洗袂清氣","愛穿烏衫"],"a":0,"e":"比喻顛倒黑白，指鹿為馬。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「頭燒燒，尾冷冷」形容啥物？","o":["做代誌無頭無尾","發燒","天氣冷熱","食物冷去"],"a":0,"e":"做事不能有始有終。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「頂港下港走透透」比喻啥物？","o":["閱歷豐富","真愛走","坐船","迷路"],"a":0,"e":"各地都走遍了。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「心肝放外外」形容啥物？","o":["對代誌無關心","心肝真闊","真好心","心臟無力"],"a":0,"e":"對事情不關心、不以為意。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「𧿳𧿳跳」形容啥物？","o":["受氣抑歡喜甲一直跳跤","跳舞","跳索仔","心肝跳"],"a":0,"e":"生氣或開心時不停跳腳。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"下面佗一个疊字詞「無」咧形容顏色？","o":["燒滾滾","紅記記","白蔥蔥","黃錦錦"],"a":0,"e":"燒滾滾形容熱騰騰。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
