<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>語文天地一｜真平第三冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style><meta name="author" content="張鈺聆">

</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>語文天地一｜疊字詞</h1><p>疊字詞、語境判斷與生活應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文的意象、情感與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文理解運用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「金金看」佇這課的意思是？","o":["四處亂跑","目不轉睛注視","非常思念"],"a":1,"e":"「金金看」佇教材的解說是「目不轉睛注視」；其餘兩項是不同意思，袂當互相替換。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「金金看」的用法。"},{"q":"「呿呿嗽」佇這課的意思是？","o":["一直重複嘮叨","每一件事","咳個不停"],"a":2,"e":"「呿呿嗽」佇教材的解說是「咳個不停」；其餘兩項是不同意思，袂當互相替換。","h":"比較選項的意思，想看啥一个符合「呿呿嗽」佇課文內底的用法。"},{"q":"「嘛嘛吼」佇這課的意思是？","o":["嚎啕大哭","往來頻繁","紅彤彤"],"a":0,"e":"「嘛嘛吼」佇教材的解說是「嚎啕大哭」；其餘兩項是不同意思，袂當互相替換。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「拋拋走」佇這課的意思是？","o":["非常思念","四處亂跑","熱騰騰"],"a":1,"e":"「拋拋走」佇教材的解說是「四處亂跑」；其餘兩項是不同意思，袂當互相替換。","h":"先看「拋拋走」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「踅踅唸」佇這課的意思是？","o":["每一件事","目不轉睛注視","一直重複嘮叨"],"a":2,"e":"「踅踅唸」佇教材的解說是「一直重複嘮叨」；其餘兩項是不同意思，袂當互相替換。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「踅踅唸」的用法。"},{"q":"「來來去去」佇這課的意思是？","o":["往來頻繁","紅彤彤","咳個不停"],"a":0,"e":"「來來去去」佇教材的解說是「往來頻繁」；其餘兩項是不同意思，袂當互相替換。","h":"比較選項的意思，想看啥一个符合「來來去去」佇課文內底的用法。"},{"q":"「思思念念」佇這課的意思是？","o":["熱騰騰","非常思念","嚎啕大哭"],"a":1,"e":"「思思念念」佇教材的解說是「非常思念」；其餘兩項是不同意思，袂當互相替換。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「事事項項」佇這課的意思是？","o":["目不轉睛注視","四處亂跑","每一件事"],"a":2,"e":"「事事項項」佇教材的解說是「每一件事」；其餘兩項是不同意思，袂當互相替換。","h":"先看「事事項項」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「紅記記」佇這課的意思是？","o":["紅彤彤","咳個不停","一直重複嘮叨"],"a":0,"e":"「紅記記」佇教材的解說是「紅彤彤」；其餘兩項是不同意思，袂當互相替換。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「紅記記」的用法。"},{"q":"「燒滾滾」佇這課的意思是？","o":["嚎啕大哭","熱騰騰","往來頻繁"],"a":1,"e":"「燒滾滾」佇教材的解說是「熱騰騰」；其餘兩項是不同意思，袂當互相替換。","h":"比較選項的意思，想看啥一个符合「燒滾滾」佇課文內底的用法。"}],"context":[{"q":"伊規工咳嗽無停，會當講伊「＿＿」。","o":["金金看","踅踅唸","呿呿嗽"],"a":2,"e":"題幹的線索是「伊規工咳嗽無停，會當講伊「（空格）」。」；此處要表達「呿呿嗽」的用法，另外兩項不符合這个情境。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"鳳凰花開甲真紅，會當講「＿＿」。","o":["紅記記","嘛嘛吼","來來去去"],"a":0,"e":"題幹的線索是「鳳凰花開甲真紅，會當講「（空格）」。」；此處要表達「紅記記」的用法，另外兩項不符合這个情境。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"湯才煮好，猶原「＿＿」。","o":["踅踅唸","燒滾滾","事事項項"],"a":1,"e":"題幹的線索是「湯才煮好，猶原「（空格）」。」；此處要表達「燒滾滾」的用法，另外兩項不符合這个情境。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"嬰仔大聲哭鬧，會當講「＿＿」。","o":["事事項項","金金看","嘛嘛吼"],"a":2,"e":"題幹的線索是「嬰仔大聲哭鬧，會當講「（空格）」。」；此處要表達「嘛嘛吼」的用法，另外兩項不符合這个情境。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"伊逐禮拜攏愛往返臺北佮桃園，會當講伊「＿＿」。","o":["來來去去","拋拋走","思思念念"],"a":0,"e":"「逐禮拜」「往返」提示固定而反覆的來回；「來來去去」比四處亂跑更符合句意。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"}],"reading":[{"q":"「事事項項」佇教材的分類屬於啥物詞性？","o":["名詞","動詞","形容詞"],"a":0,"e":"「事事項項」指各種事情或事項；依這份教材的疊字詞分類，歸佇名詞類。","h":"先分清楚題目問的是事情經過、人物想法，抑是作者的描寫。"},{"q":"「紅記記」屬於啥物詞性？","o":["形容詞","動詞","名詞"],"a":0,"e":"本題問的是「「紅記記」屬於啥物詞性？」；依教材的分類抑是例句，應選「形容詞」，另外兩項無符合題目所指的用法。","h":"想想課文提供啥物線索，答案愛有文本根據，毋通干焦用印象猜。"},{"q":"「踅踅唸」屬於啥物詞性？","o":["動詞","名詞","形容詞"],"a":0,"e":"本題問的是「「踅踅唸」屬於啥物詞性？」；依教材的分類抑是例句，應選「動詞」，另外兩項無符合題目所指的用法。","h":"比較前後段落的變化，留意作者用啥物細節支持這个意思。"},{"q":"下面佗一个解說符合「疊字詞」的特色？","o":["仝一个漢字重疊兩擺抑是三擺","用仝音的漢字取代原字","將詞語全部寫做羅馬字"],"a":0,"e":"教材將疊字詞定義做同一漢字重疊兩次或三次；不是同音替字，也不是書寫系統。","h":"先確認題目問的重點，再回想課文內底對應的情節或句子。"},{"q":"「頭燒燒，尾冷冷」主要形容？","o":["名詞","形容詞","做代誌袂當有始有終"],"a":2,"e":"本題問的是「「頭燒燒，尾冷冷」主要形容？」；依教材的分類抑是例句，應選「做代誌袂當有始有終」，另外兩項無符合題目所指的用法。","h":"先回想課文相關段落，找出人物、事件佮原因之間的關係。"}],"comprehensive":[{"q":"欲形容有人目睭一直看著一个所在，選啥物詞？","o":["金金看","事事項項","思思念念"],"a":0,"e":"本題問的是「欲形容有人目睭一直看著一个所在，選啥物詞？」；依教材的分類抑是例句，應選「金金看」，另外兩項無符合題目所指的用法。","h":"把課文的觀念帶入這个情境，想想實際發生時會按怎判斷。"},{"q":"欲講逐項代誌，無論大項細項，攏愛處理，較適當的詞是？","o":["金金看","事事項項","思思念念"],"a":1,"e":"「事事項項」表示每一件事、各種事項，題幹著重「逐項」而非保證每項都已顧好。","h":"毋通只看單一詞語，愛連同人物、原因佮結果做伙考慮。"},{"q":"欲形容想念親人想甲真深，選啥物詞？","o":["金金看","事事項項","思思念念"],"a":2,"e":"本題問的是「欲形容想念親人想甲真深，選啥物詞？」；依教材的分類抑是例句，應選「思思念念」，另外兩項無符合題目所指的用法。","h":"先找出題目欲你判斷的核心，再排除無符合情境的選項。"},{"q":"欲形容囡仔佇厝內四界走，選啥物詞？","o":["拋拋走","金金看","事事項項"],"a":0,"e":"本題問的是「欲形容囡仔佇厝內四界走，選啥物詞？」；依教材的分類抑是例句，應選「拋拋走」，另外兩項無符合題目所指的用法。","h":"想想課文的重點佮這个新情境有啥物關係，再做決定。"},{"q":"欲形容阿公一直重複講仝一件代誌，選啥物詞？","o":["金金看","踅踅唸","事事項項"],"a":1,"e":"本題問的是「欲形容阿公一直重複講仝一件代誌，選啥物詞？」；依教材的分類抑是例句，應選「踅踅唸」，另外兩項無符合題目所指的用法。","h":"比較各選項可能造成的結果，揀一項最符合題目條件的。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
