te-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../index.html">← 返回整冊</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>語文天地二｜擬聲詞</h1><p>擬聲詞、語境判斷與生活應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文的意象、情感與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文理解運用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「摳摳叫」佇這課的意思是？","o":["蠓仔飛行的聲音","咀嚼酥脆食物的聲音","物件碰撞的聲音"],"a":1,"e":"「摳摳叫」佇教材的解說是「咀嚼酥脆食物的聲音」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「鼾鼾叫」佇這課的意思是？","o":["細隻動物尖細的聲音","物件落入井中的聲音","睏覺打呼的聲音"],"a":2,"e":"「鼾鼾叫」佇教材的解說是「睏覺打呼的聲音」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「窸窣叫」佇這課的例句是描寫啥物聲？","o":["食麵抑是啉湯的聲音","狗因為疼痛哀叫的聲音","機車發動的聲音"],"a":0,"e":"教材學習單用「阿兄啉湯啉甲窸窣叫」做例句；本題依這个例句判斷，毋是講所有喝湯聲攏一定仝款。"},{"q":"「嗚嗚叫」佇這課的意思是？","o":["物件碰撞的聲音","蠓仔飛行的聲音","車仔鳴喇叭的聲音"],"a":1,"e":"「嗚嗚叫」佇教材的解說是「蠓仔飛行的聲音」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「吱吱叫」佇這課的意思是？","o":["物件落入井中的聲音","咀嚼酥脆食物的聲音","細隻動物尖細的聲音"],"a":2,"e":"「吱吱叫」佇教材的解說是「細隻動物尖細的聲音」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「喈喈叫」佇這課的意思是？","o":["狗因為疼痛哀叫的聲音","機車發動的聲音","睏覺打呼的聲音"],"a":0,"e":"「喈喈叫」佇教材的解說是「狗因為疼痛哀叫的聲音」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「吭」佇這課的意思是？","o":["車仔鳴喇叭的聲音","物件碰撞的聲音","食麵抑是啉湯的聲音"],"a":1,"e":"「吭」佇教材的解說是「物件碰撞的聲音」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「丼」佇這課的意思是？","o":["咀嚼酥脆食物的聲音","蠓仔飛行的聲音","物件落入井中的聲音"],"a":2,"e":"「丼」佇教材的解說是「物件落入井中的聲音」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「吭吭叫」佇這課的意思是？","o":["機車發動的聲音","睏覺打呼的聲音","細隻動物尖細的聲音"],"a":0,"e":"「吭吭叫」佇教材的解說是「機車發動的聲音」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「哹哹叫」佇這課的意思是？","o":["食麵抑是啉湯的聲音","車仔鳴喇叭的聲音","狗因為疼痛哀叫的聲音"],"a":1,"e":"「哹哹叫」佇教材的解說是「車仔鳴喇叭的聲音」；其餘兩項是不同意思，袂當互相替換。"}],"context":[{"q":"半暝蠓仔佇耳空邊飛，發出「＿＿」的聲。","o":["摳摳叫","吱吱叫","嗚嗚叫"],"a":2,"e":"題幹的線索是「半暝蠓仔佇耳空邊飛，發出「（空格）」的聲。」；此處要表達「嗚嗚叫」的用法，另外兩項不符合這个情境。"},{"q":"隔壁阿兄睏甲「＿＿」，我睏袂落眠。","o":["鼾鼾叫","嗚嗚叫","吭"],"a":0,"e":"題幹的線索是「隔壁阿兄睏甲「（空格）」，我睏袂落眠。」；此處要表達「鼾鼾叫」的用法，另外兩項不符合這个情境。"},{"q":"車仔一直按喇叭，發出「＿＿」的聲。","o":["吱吱叫","哹哹叫","丼"],"a":1,"e":"題幹的線索是「車仔一直按喇叭，發出「（空格）」的聲。」；此處要表達「哹哹叫」的用法，另外兩項不符合這个情境。"},{"q":"阿兄啉湯啉甲「＿＿」。","o":["丼","摳摳叫","窸窣叫"],"a":2,"e":"題幹的線索是「阿兄啉湯啉甲「（空格）」。」；此處要表達「窸窣叫」的用法，另外兩項不符合這个情境。"},{"q":"門雄雄相碰，「＿＿」一聲。","o":["吭","哹哹叫","窸窣叫"],"a":0,"e":"題幹的線索是「門雄雄相碰，「（空格）」一聲。」；此處要表達「吭」的用法，另外兩項不符合這个情境。"}],"reading":[{"q":"「鼾鼾叫」是佗一類擬聲詞？","o":["人發出的聲音","動物發出的聲音","物件發出的聲音"],"a":0,"e":"本題問的是「「鼾鼾叫」是佗一類擬聲詞？」；依教材的分類抑是例句，應選「人發出的聲音」，另外兩項無符合題目所指的用法。"},{"q":"「喈喈叫」佇教材指啥物聲？","o":["人發出的聲音","機車的聲音","狗因為疼痛哀叫"],"a":2,"e":"本題問的是「「喈喈叫」佇教材指啥物聲？」；依教材的分類抑是例句，應選「狗因為疼痛哀叫」，另外兩項無符合題目所指的用法。"},{"q":"「吭吭叫」通常形容啥物？","o":["機車的聲音","人發出的聲音","狗因為疼痛哀叫"],"a":0,"e":"本題問的是「「吭吭叫」通常形容啥物？」；依教材的分類抑是例句，應選「機車的聲音」，另外兩項無符合題目所指的用法。"},{"q":"擬聲詞的主要功能是？","o":["人發出的聲音","模仿聲音，予描寫較生動","狗因為疼痛哀叫"],"a":1,"e":"本題問的是「擬聲詞的主要功能是？」；依教材的分類抑是例句，應選「模仿聲音，予描寫較生動」，另外兩項無符合題目所指的用法。"},{"q":"教材指出，擬聲詞用啥物書寫方式會較生動？","o":["羅馬字","阿拉伯數字","標點符號"],"a":0,"e":"教材說明擬聲詞寫羅馬字較生動，因為可呈現模仿聲音的特色。"}],"comprehensive":[{"q":"欲描寫食脆餅的聲，較適當的是？","o":["摳摳叫","吱吱叫","吭吭叫"],"a":0,"e":"本題問的是「欲描寫食脆餅的聲，較適當的是？」；依教材的分類抑是例句，應選「摳摳叫」，另外兩項無符合題目所指的用法。"},{"q":"欲描寫鳥鼠發出尖細的聲，較適當的是？","o":["摳摳叫","吱吱叫","吭吭叫"],"a":1,"e":"本題問的是「欲描寫鳥鼠發出尖細的聲，較適當的是？」；依教材的分類抑是例句，應選「吱吱叫」，另外兩項無符合題目所指的用法。"},{"q":"欲描寫機車聲，較適當的是？","o":["摳摳叫","吱吱叫","吭吭叫"],"a":2,"e":"本題問的是「欲描寫機車聲，較適當的是？」；依教材的分類抑是例句，應選「吭吭叫」，另外兩項無符合題目所指的用法。"},{"q":"欲描寫狗因為疼痛哀叫，較適當的是？","o":["喈喈叫","摳摳叫","吱吱叫"],"a":0,"e":"本題問的是「欲描寫狗因為疼痛哀叫，較適當的是？」；依教材的分類抑是例句，應選「喈喈叫」，另外兩項無符合題目所指的用法。"},{"q":"欲描寫物件掉入井裡的聲，較適當的是？","o":["摳摳叫","丼","吱吱叫"],"a":1,"e":"本題問的是「欲描寫物件掉入井裡的聲，較適當的是？」；依教材的分類抑是例句，應選「丼」，另外兩項無符合題目所指的用法。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
