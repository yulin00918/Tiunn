</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🔊</div><h1>語文天地（二）｜擬聲詞</h1><p>人、動物、物件發出來的聲音</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「擬聲詞」是啥物？","o":["模仿聲音的語詞","重疊的語詞","形容顏色的語詞","外來語"],"a":0,"e":"模仿自然聲音的表達方法。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「摳摳叫」是啥物聲音？","o":["咬脆物件的聲","蠓仔叫","打呼","車喇叭"],"a":0,"e":"咀嚼酥脆食物時的清脆聲。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「齁齁叫」是啥物聲音？","o":["睏甲咧打呼","蠓仔飛","狗仔哀","門挵著"],"a":0,"e":"形容睡覺打呼的聲音。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「窸窣叫」是啥物聲音？","o":["食麵抑啉湯的聲","打呼","咬餅","鳥鼠叫"],"a":0,"e":"吃麵或喝湯時的聲音。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「嗚嗚叫」是啥物聲音？","o":["蠓仔的聲","狗仔的聲","雞仔的聲","車的聲"],"a":0,"e":"形容蚊子的聲音。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「吱吱叫」是啥物聲音？","o":["鳥鼠抑細隻動物尖尖的聲","打呼","車喇叭","鑼鼓"],"a":0,"e":"小動物或尖細刺耳的聲音。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「喈喈叫」是啥物聲音？","o":["狗仔疼甲哀","雞仔啼","貓仔叫","鳥仔唱歌"],"a":0,"e":"狗因痛苦而哀叫。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「哹哹叫」是啥物聲音？","o":["車揤喇叭的聲","機車發動","門挵著","物件落入井"],"a":0,"e":"車子鳴按喇叭的聲音。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「吭吭叫」較常形容啥物？","o":["機車的聲","喇叭的聲","蠓仔的聲","鈴仔的聲"],"a":0,"e":"多用來形容摩托車的聲音。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「丼（tôm）」是啥物聲音？","o":["物件擲入井內的聲","物件相挵","電話鈴聲","拍噗仔"],"a":0,"e":"咚，東西投到井中的聲音。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「昨暗有一隻蠓仔佇我的耳空邊＿＿。」空格揀佗一个？","o":["嗚嗚叫","吱吱叫","齁齁叫","哹哹叫"],"a":0,"e":"蚊子的聲音。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「我聽會著隔壁阿兄睏甲＿＿的聲。」空格揀佗一个？","o":["齁齁叫","窸窣叫","嗚嗚叫","喈喈叫"],"a":0,"e":"睡覺打呼。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿兄啉湯啉甲＿＿。」空格揀佗一个？","o":["窸窣叫","摳摳叫","吱吱叫","吭吭叫"],"a":0,"e":"喝湯的聲音。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「彼隻鳥鼠＿＿。」空格揀佗一个？","o":["吱吱叫","嗚嗚叫","齁齁叫","哹哹叫"],"a":0,"e":"老鼠尖細的叫聲。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「車咧＿＿，緊閃！」空格揀佗一个？","o":["哹哹叫","吱吱叫","窸窣叫","齁齁叫"],"a":0,"e":"汽車按喇叭。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「門雄雄＿＿一聲，害我驚一趒。」空格揀佗一个？","o":["吭","丼","咩","啾"],"a":0,"e":"吭：物體碰撞的聲音。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「我那看冊那食餅，食甲＿＿。」空格揀佗一个？","o":["摳摳叫","窸窣叫","齁齁叫","喈喈叫"],"a":0,"e":"吃酥脆的餅。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「我無細膩踏著狗的尾溜，害伊疼甲＿＿。」空格揀佗一个？","o":["喈喈叫","吱吱叫","嗚嗚叫","咯咯叫"],"a":0,"e":"狗痛得哀叫。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「電話＿＿＿一直響。」用佗一个擬聲詞？","o":["喨","嚓","叭","咩"],"a":0,"e":"喨：電話鈴聲。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「翕相機揤落去，『＿＿』一聲。」用佗一个擬聲詞？","o":["嚓","喨","丼","啾"],"a":0,"e":"嚓：相機快門聲。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"課本講擬聲詞用啥物寫較生動？","o":["羅馬字","注音","英文","華語"],"a":0,"e":"擬聲詞寫羅馬字較生動。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「咩」是啥物動物的叫聲？","o":["羊","牛","貓","鴨"],"a":0,"e":"咩：羊的叫聲。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「咯咯叫」是啥物動物的叫聲？","o":["雞","狗","鴨","鳥"],"a":0,"e":"咯咯叫：雞的叫聲。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「呱呱」是啥物動物的叫聲？","o":["鴨","雞","羊","鳥鼠"],"a":0,"e":"呱呱：鴨子的叫聲。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「噗」是啥物聲音？","o":["手掌拍的聲","吹喙瀾","咳嗽","放屁"],"a":0,"e":"噗：手掌的拍打聲。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「咂咂叫」形容啥物？","o":["心情無耐煩抑食物件大聲","蠓仔叫","鳥仔叫","車的聲"],"a":0,"e":"不耐煩或吃東西大聲。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"「狗蟻跋落鼎——＿＿」","o":["吵死（炒死）","吱吱叫","看袂出","歹勢"],"a":0,"e":"螞蟻掉入鍋裡會被炒死，「炒死」與「吵死」同音。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「鳥鼠嫁查某囝——＿＿」","o":["嗤嗤呲呲","吱吱叫","吵死","趣味"],"a":0,"e":"形容竊竊私語。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"擬聲詞對寫文章有啥物幫助？","o":["予文章較有性命力","予文章較短","予文章較歹讀","攏無幫助"],"a":0,"e":"擬聲詞會使豐富文章的生命力。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"下面佗一个「毋是」人發出來的聲？","o":["嗚嗚叫","摳摳叫","齁齁叫","窸窣叫"],"a":0,"e":"嗚嗚叫是蚊子的聲音。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"下面佗一个是「物件」發出來的聲？","o":["哹哹叫","喈喈叫","齁齁叫","吱吱叫"],"a":0,"e":"哹哹叫是車喇叭聲。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「鈃鈃」是啥物聲音？","o":["細粒鈴仔的聲","鑼鼓的聲","電話的聲","風的聲"],"a":0,"e":"鈃鈃：小搖鈴的聲音。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
