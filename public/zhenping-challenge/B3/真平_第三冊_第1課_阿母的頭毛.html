</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">👩</div><h1>第1課｜阿母的頭毛</h1><p>母愛、人生階段佮譬喻寫法</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「烏金」形容頭毛按怎？","o":["烏黑柔亮","金黃色","烏烏無光","白蔥蔥"],"a":0,"e":"烏金：烏黑柔亮。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「滑溜」較接近啥物意思？","o":["真滑、滑順","跋倒","溜走","粗粗"],"a":0,"e":"滑溜：很滑、滑順。例：這塊布摸起來誠滑溜。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「時陣」較接近啥物意思？","o":["時候","陣頭","時鐘","時間真長"],"a":0,"e":"時陣：時候。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「大漢」較接近啥物意思？","o":["長大","真大的漢子","大人","老大"],"a":0,"e":"大漢：長大。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"課文「做姑娘的時陣」，「姑娘」是指啥人？","o":["猶未出嫁的查某囡仔","姑姑","老母","阿媽"],"a":0,"e":"姑娘：稱呼未出嫁的女子。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「化解」較接近啥物意思？","o":["解除、轉化","化妝","解說","拆開"],"a":0,"e":"化解：解除、轉化。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「一度」較接近啥物意思？","o":["曾經、從前","一擺","溫度","一度電"],"a":0,"e":"一度：曾經、從前。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「浪子」是啥物款人？","o":["無正經、四界浪蕩的人","海邊的人","會泅水的人","出外食頭路的人"],"a":0,"e":"浪子：不務正業到處遊蕩的人。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「寒天」是啥物時節？","o":["冬天","熱天","春天","落雨天"],"a":0,"e":"寒天：冬天。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「光彩」較接近啥物意思？","o":["光輝、光芒","彩色的光","光線","顏色"],"a":0,"e":"光彩：光輝、光芒。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「親像」較接近啥物意思？","o":["好像","親人","親身","相仝"],"a":0,"e":"親像：宛然、若像、袂輸。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「伊少年的時四界佮人相拍，這馬已經＿＿回頭矣。」空格揀佗一个？","o":["浪子","寒天","光彩","烏金"],"a":0,"e":"浪子回頭。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這兩个人若見面就冤家，無人有法度去＿＿。」空格揀佗一个？","o":["化解","浪子","光彩","滑溜"],"a":0,"e":"化解誤會、衝突。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「＿＿的日時較短，尤其是冬節彼工。」空格揀佗一个？","o":["寒天","熱天","光彩","時陣"],"a":0,"e":"冬天白天短。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿爸提著總舖師的執照，阮全家攏感覺足＿＿的。」空格揀佗一个？","o":["光彩","寒天","浪子","滑溜"],"a":0,"e":"光彩：光榮、有面子。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「鰗鰡的身軀＿＿＿＿，無才調空手共掠起來。」空格揀佗一个？","o":["滑溜滑溜","烏金烏金","寒天寒天","光彩光彩"],"a":0,"e":"泥鰍身體很滑。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這个＿＿伊當咧睏晝，咱上好莫去共伊攪吵。」空格揀佗一个？","o":["時陣","大漢","一度","化解"],"a":0,"e":"這个時陣＝這個時候。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"爸母為著囝兒，閣較艱苦嘛甘願犧牲。是佗一句俗諺？","o":["弓蕉吐囝為囝死","在生一粒豆，較贏死了拜豬頭","爸母疼囝長流水，囝疼爸母樹尾風","勸恁有孝千萬句，袂曉有孝豬狗牛"],"a":0,"e":"香蕉樹結果後就枯死，比喻父母犧牲奉獻。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"提醒咱佇爸母在生的時陣就愛好好仔有孝。是佗一句俗諺？","o":["在生一粒豆，較贏死了拜豬頭","弓蕉吐囝為囝死","食果子，拜樹頭","老人毋講古，少年毋捌寶"],"a":0,"e":"把握時機孝順父母。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"爸母的愛親像流袂斷的水，囝兒的有孝親像有一陣無一陣的風。是佗一句？","o":["爸母疼囝長流水，囝疼爸母樹尾風","弓蕉吐囝為囝死","在生一粒豆，較贏死了拜豬頭","一鄉一俗"],"a":0,"e":"父母愛子綿綿不絕。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿母灶跤動刀——＿＿」","o":["親切","正經","有心","可憐"],"a":0,"e":"在廚房拿刀切東西，戲稱「親切」。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊退休了後，就＿＿無插公司的代誌矣。」照句型，空格揀佗一个？","o":["已經","猶未","才閣","毋但"],"a":0,"e":"「……了後……已經……」承接句型。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"課文共阿母的頭毛分做佗幾个時期？","o":["姑娘、嫁人、生囝、囝兒大漢","春、夏、秋、冬","早起、中晝、下晡、暗時","讀冊、食頭路、結婚、退休"],"a":0,"e":"全詩分四段，依人生階段推進。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿母做姑娘的時陣，頭毛親像啥物？","o":["鏡仝款的溪仔水","微微的春風","寒天的日頭","入秋的天頂"],"a":0,"e":"烏金柔軟閣滑溜，親像鏡仝款的溪仔水。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿母嫁予阿爹的時陣，頭毛親像啥物？","o":["微微的春風","寒天的日頭","鏡仝款的溪仔水","入秋的天頂"],"a":0,"e":"親像微微的春風，化解一度浪子的阿爹。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿母生囝了後，頭毛親像寒天的日頭，表示啥物？","o":["溫暖、保護幼稚軟弱的囝兒","冷冷無感情","真熱真歹受","真光真刺目"],"a":0,"e":"寒天的日頭給人溫暖。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者大漢了後，阿母的頭毛按怎？","o":["已經失去光彩","閣較烏金","染做紅色","攏無改變"],"a":0,"e":"阮大漢了後，阿母的頭毛已經失去光彩。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿母的頭毛會失去光彩，上主要的原因是？","o":["阿母為家庭犧牲付出，傷過操勞","阿母破病","阿母長期染頭毛","阿母無愛梳頭"],"a":0,"e":"為家庭、為囝兒操勞付出。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"下面佗一个語詞無適合形容阿母少女時代的頭毛？","o":["臭火焦","柔軟","烏金","滑溜"],"a":0,"e":"少女時代：烏金柔軟閣滑溜。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"這首詩主要欲表達啥物？","o":["對阿母犧牲奉獻的感謝","紹介頭毛按怎保養","阿爹真浪子","四季的變化"],"a":0,"e":"透過囝兒的眼光表達感謝。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈阿母的頭毛〉的作者是啥人？","o":["向陽","黃之綠","顏銘俊","李麗玉"],"a":0,"e":"向陽，本名林淇瀁，南投鹿谷人。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"〈遊子吟〉「慈母手中線，遊子身上衣」，寫的是啥物？","o":["老母為欲出外的囝縫衫","遊子共老母買衫","老母咧賣衫","遊子家己縫衫"],"a":0,"e":"以縫衣具體呈現母愛。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「千條萬條烏絲線，有的直的，有的虯的，袂使提來紩衫。」臆一種人體組織：","o":["頭毛","喙鬚","目眉","血管"],"a":0,"e":"答案：頭毛。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「一粒球，圓圓圓，暗時看袂著，日時逐个所在攏有伊。」臆一種自然現象：","o":["日頭","月娘","天星","雲"],"a":0,"e":"答案：日頭。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「頭毛」的近義詞是？","o":["頭鬃","頭殼","頭額","目眉"],"a":0,"e":"頭毛＝頭鬃。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"讀這首詩了後，下面佗一个做法上符合詩的精神？","o":["關心阿母的身體佮心情，閣共表達感謝","笑阿母的頭毛白去","叫阿母緊去染頭毛","等大漢才閣講"],"a":0,"e":"把感謝化為日常關心。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"作者用溪仔水、春風、日頭、秋天來形容，用的是啥物寫作手法？","o":["譬喻","設問","誇飾","倒反"],"a":0,"e":"作者善用譬喻技巧。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
