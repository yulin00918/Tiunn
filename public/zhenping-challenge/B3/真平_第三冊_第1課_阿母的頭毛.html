<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿母的頭毛｜真平第三冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../index.html">← 返回整冊</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第1課｜阿母的頭毛</h1><p>課文語詞、閱讀理解與生活應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「烏金」佇課文是形容頭毛按怎？","o":["烏黑閣有光澤","金黃色","完全無光彩"],"a":0,"e":"課文用烏金形容阿母少女時的頭毛。"},{"q":"「滑溜」是指啥物？","o":["滑順","粗粗","刺刺"],"a":0,"e":"教材用滑溜形容頭毛與布料的觸感。"},{"q":"「時陣」是啥物意思？","o":["時候","所在","方向"],"a":0,"e":"教材語詞解釋時陣是時候。"},{"q":"「大漢」是指？","o":["長大","變細漢","行較緊"],"a":0,"e":"作者用阮大漢了後說明人生階段。"},{"q":"「化解」是指？","o":["消除、緩和","增加衝突","完全無理睬"],"a":0,"e":"詩寫春風化解一度浪子的阿爹。"},{"q":"「浪子」佇課文指？","o":["較早生活放蕩的人","專門划船的人","剛出生的嬰仔"],"a":0,"e":"出版社第1課課文第二段寫「化解一度浪子的阿爹」；「浪子」指阿爹從前較放蕩的生活樣貌，毋是划船的人。"},{"q":"「寒天」是啥物時節？","o":["寒冷的冬天","炎熱的夏天","落雨的春天"],"a":0,"e":"詩用寒天的日頭比喻溫暖。"},{"q":"「光彩」佇課文是指？","o":["亮麗的神采","食物的味道","聲音的高低"],"a":0,"e":"阿母的頭毛後來失去光彩。"},{"q":"「親像」是指？","o":["好像","因為","雖然"],"a":0,"e":"課文用親像帶出譬喻。"},{"q":"「仝款」是指？","o":["一樣","相反","無關係"],"a":0,"e":"親像鏡仝款表示像鏡子一樣。"}],"context":[{"q":"阿姊的頭毛烏黑閣亮麗，會當講是＿＿。","o":["烏金","寒天","浪子"],"a":0,"e":"烏金形容烏黑有光澤。"},{"q":"這塊布摸起來誠＿＿，無粗粗。","o":["滑溜","光彩","大漢"],"a":0,"e":"滑溜形容滑順的觸感。"},{"q":"你啥物＿＿欲去臺東𨑨迌？","o":["時陣","光彩","浪子"],"a":0,"e":"時陣表示時候。"},{"q":"阮阿弟講伊＿＿了後想欲做作家。","o":["大漢","寒天","化解"],"a":0,"e":"大漢了後表示長大以後。"},{"q":"兩个人誤會真深，經過好好開講才＿＿。","o":["化解","滑溜","烏金"],"a":0,"e":"化解可用於緩和誤會。"}],"reading":[{"q":"作者用啥物比喻阿母少女時的頭毛？","o":["親像鏡仝款的溪仔水","親像寒天的日頭","親像入秋的天頂"],"a":0,"e":"第一段以溪水比喻烏金滑溜的頭毛。"},{"q":"阿母嫁予阿爹的時陣，頭毛親像啥物？","o":["微微的春風","入秋的天頂","寒天的日頭"],"a":0,"e":"出版社第1課課文第二段：「親像微微的春風／化解一度浪子的阿爹」，春風是阿母頭毛的譬喻，並呼應她帶來的改變。"},{"q":"「親像寒天的日頭」是形容阿母的啥物？","o":["溫暖佮保護","冷漠佮疏遠","生氣佮失望"],"a":0,"e":"出版社第1課第三段以「寒天的日頭」形容阿母；寒冷時的日光讓人感受溫暖，呼應她照顧家人的形象。"},{"q":"阮大漢了後，阿母頭毛有啥物變化？","o":["漸漸失去光彩","變甲閣較烏金","完全無改變"],"a":0,"e":"末段描寫阿母頭毛失去光彩。"},{"q":"詩以阿母的頭毛變化，主要欲表達啥物？","o":["感謝阿母為家庭的付出","紹介理髮店","研究頭毛的顏色"],"a":0,"e":"課文以人生階段呈現母愛與感謝。"}],"comprehensive":[{"q":"欲依課文排出阿母人生階段，佗个順序較正確？","o":["姑娘→嫁予阿爹→生囝→囡仔大漢","生囝→姑娘→囡仔大漢→結婚","囡仔大漢→姑娘→生囝→結婚"],"a":0,"e":"四段詩按人生階段推進。"},{"q":"「寒天的日頭」予人的感覺，較適合用來描寫啥物？","o":["有人佇困難的時陣給予溫暖","有人故意欺負別人","天氣愈來愈熱"],"a":0,"e":"譬喻重點是寒冷中的溫暖與保護。"},{"q":"有人講阿母頭毛無以前媠，佗个回應較符合詩的精神？","o":["看著歲月的變化，嘛感謝伊的照顧","干焦評論外表","講頭毛無重要所以無愛看"],"a":0,"e":"課文把外表變化連結到家庭付出。"},{"q":"欲共感謝化做實際行動，佗个方法較適當？","o":["關心照顧者的需要，分擔家事","只講好聽話，代誌攏無做","假裝無看著別人的辛苦"],"a":0,"e":"把理解轉為日常關心與分擔。"},{"q":"作者逐段用溪水、春風、日頭、秋天做比喻，主要作用是？","o":["藉自然景象呈現阿母不同人生階段的樣貌與情感","證明阿母每個時期都生活在不同季節","按四季先後介紹頭髮保養的方法"],"a":0,"e":"詩中溪仔水、春風、寒天日頭等不是天氣紀錄，而是以自然景象比喻阿母不同階段的頭毛及情感。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
