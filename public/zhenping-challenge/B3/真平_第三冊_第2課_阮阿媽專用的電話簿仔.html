</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">📒</div><h1>第2課｜阮阿媽專用的電話簿仔</h1><p>祖孫情、圖像電話簿佮諧音</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「青盲牛」是指啥物人？","o":["毋捌字的人","目睭看無的牛","真戇的人","青色的牛"],"a":0,"e":"青盲牛：文盲，指不識字的人。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「沓沓仔」較接近啥物意思？","o":["慢慢仔","一滴一滴","真緊","一直"],"a":0,"e":"沓沓仔：慢慢的。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「跟綴」較接近啥物意思？","o":["跟隨","綁做伙","追趕","離開"],"a":0,"e":"跟綴：跟隨。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「便若」較接近啥物意思？","o":["只要","便宜","若是無","利便"],"a":0,"e":"便若：只要。例：便若看著我，伊就會搖尾。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「拚勢」較接近啥物意思？","o":["拚命、真骨力","拚輸贏","勢面","真緊"],"a":0,"e":"拚勢：做事情很努力。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「熟手」較接近啥物意思？","o":["對某種代誌真熟練","熟似的人","手真燒","煮熟的手"],"a":0,"e":"熟手：專精熟練的人。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「賰的」較接近啥物意思？","o":["剩下的","真濟的","春天的","存錢的"],"a":0,"e":"賰的：剩下的。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「魚栽」是啥物？","o":["魚苗","魚仔的栽培","魚池","魚網"],"a":0,"e":"魚栽：剛孵化的雛魚。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「搪著」較接近啥物意思？","o":["拄著、遇到","糖黏著","擋著","揣著"],"a":0,"e":"搪著：遇到。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「細粒子」形容啥物？","o":["身材細漢","米粒真細","心肝真細","物件真幼"],"a":0,"e":"細粒子：身材嬌小。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「鉸刀」是啥物？","o":["剪刀","菜刀","鉸剪頭毛的人","小刀"],"a":0,"e":"鉸刀：剪刀。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「記持」較接近啥物意思？","o":["記憶","記錄","記者","持續"],"a":0,"e":"記持：記憶、記性。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「青盲牛毋捌字，行到佗位攏真無利便。」「青盲牛」佇遮是？","o":["毋捌字的人","目睭青盲的牛","趕牛的人","放牛的囡仔"],"a":0,"e":"青盲牛指文盲。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「你有話＿＿講，毋免著急。」空格揀佗一个？","o":["沓沓仔","拚勢","便若","熟手"],"a":0,"e":"有話慢慢說。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阮兜的狗仔囝＿＿看著我轉去到厝，伊就會搖尾仔。」空格揀佗一个？","o":["便若","沓沓仔","跟綴","賰的"],"a":0,"e":"只要看到我回家。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿公便若行路出門，阮厝的老狗攏＿＿牢牢。」空格揀佗一个？","o":["跟綴","便若","拚勢","搪著"],"a":0,"e":"跟隨得緊緊的。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿公原本毋捌字，毋過伊上成人教育班的時真＿＿學。」空格揀佗一个？","o":["拚勢","沓沓仔","賰的","細粒子"],"a":0,"e":"很努力學習。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊讀到大學矣，連煎卵嘛袂曉。」用佗一句俗諺上適當？","o":["四書五經讀透透，毋捌黿鼇龜鱉竈","弓蕉吐囝為囝死","老人毋講古，少年毋捌寶","食一歲，學一歲"],"a":0,"e":"只會讀死書，不會應用在生活中。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「兩人隔千里，想欲傳話語，就愛倚靠伊，開講無距離。」臆一種生活用品：","o":["電話","批","相片","收音機"],"a":0,"e":"答案：電話。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「我＿＿看著這張相片，就會想起阿公。」照句型，空格揀佗一个？","o":["便若","毋但","雖然","抑是"],"a":0,"e":"便若……就會……：閩南語特有的條件句型。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「一身」會當計算佗一種？","o":["人、神像、玩偶","鉸刀","電話","簿仔"],"a":0,"e":"一身人、一身神明、一身布尪仔。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"講電話的時，若欲請對方小等，較有禮貌的講法是？","o":["請你小等一下，我去叫伊","等咧啦！","無佇咧啦","毋知啦"],"a":0,"e":"電話禮貌用語。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"作者為啥物欲共阿媽做一本專用的電話簿仔？","o":["阿媽毋捌字","阿媽目睭青盲","作者真佮意畫圖","電話簿仔拍毋見"],"a":0,"e":"阿媽是青盲牛，需要圖像式的電話簿。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者國小三、四年的時，先教阿媽啥物？","o":["認捌 0 到 9 這十个數字","寫家己的名","畫圖","用手機仔"],"a":0,"e":"用粗粗的筆畫大大字的 0 到 9。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"電話簿仔內底，阿媽唯一捌的字是啥物？","o":["李","王","陳","林"],"a":0,"e":"舅公佮阿媽仝姓，所以寫「李」。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"瓦斯行的電話邊仔畫啥物？","o":["一桶瓦斯","一尾魚","一支鉸刀","一身細身人"],"a":0,"e":"瓦斯行的電話就畫一桶瓦斯。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"賣魚栽佮賣魚仔的電話攏畫魚，按怎分？","o":["賣魚栽的魚畫較細尾","賣魚仔的畫較細尾","攏畫仝款","一个畫魚一个畫蝦"],"a":0,"e":"魚苗畫小魚，賣魚的畫大魚。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿乖嬸婆仔的電話邊仔畫啥物？","o":["一身細身人","一粒蘋果","一支鉸刀","一桶瓦斯"],"a":0,"e":"因為阿乖嬸婆仔是庄內出名的細粒子。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"進嘉叔公的電話邊仔為啥物畫鉸刀？","o":["「嘉」讀起來佮鉸刀的「鉸」仝音","伊是剃頭師","伊真佮意鉸紙","伊送阿媽鉸刀"],"a":0,"e":"利用諧音畫圖。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿媽為啥物遮爾珍惜這本電話簿仔？","o":["內底有伊對親情朋友的感情佮記持","簿仔真貴","簿仔真新","簿仔有真濟字"],"a":0,"e":"掀開就想起做伙行過的日子。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"這本電話簿仔用十幾年，有啥物變化？","o":["內底的紙沓沓仔反黃","予人拍毋見","變做手機仔","攏無變"],"a":0,"e":"紙已經沓沓仔反黃。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈阮阿媽專用的電話簿仔〉的作者是啥人？","o":["黃之綠","向陽","顏銘俊","李麗玉"],"a":0,"e":"黃之綠，臺南北門人。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"作者替阿媽做電話簿仔，表現出啥物？","o":["站佇阿媽的角度設想的孝心","想欲展家己𠢕畫圖","嫌阿媽毋捌字","欲予阿媽較無閒"],"a":0,"e":"量身訂做，表現濃濃的祖孫情。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"較早的電話佮這馬的電話上大的無仝是？","o":["較早愛撥號抑是轉總機，這馬用手機仔","較早較細台","較早免錢","這馬袂當講話"],"a":0,"e":"從總機、撥號到按鍵、手機。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"第一支手機仔是啥物公司推出的？","o":["摩托羅拉","蘋果","三星","諾基亞"],"a":0,"e":"Dyna TAC 8000X，重約一公斤。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"若厝裡的老大人袂曉用新的物件，你上適合按怎做？","o":["用伊看有的方法，耐心教伊","共伊講傷戇","替伊做就好，莫教","叫伊莫用"],"a":0,"e":"學作者站在對方的角度設想。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「嘉」佮「鉸」借音畫圖，這種方法佮佗一种現象上相關？","o":["諧音","譬喻","誇飾","排比"],"a":0,"e":"利用讀音相近來聯想。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"下面佗一个毋是講電話的禮貌？","o":["對方問你是啥人，你應「莫問啦」","先講「你好」","講清楚家己是啥人","講煞講「多謝」"],"a":0,"e":"電話禮貌要清楚、客氣。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
