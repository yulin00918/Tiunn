<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阮阿媽專用的電話簿仔｜真平第三冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style><meta name="author" content="張鈺聆">

</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第2課｜阮阿媽專用的電話簿仔</h1><p>課文語詞與生活情境應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文事件、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>將課文理解應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「青盲牛」佇課文是指啥物？","o":["無捌字的人","目睭無看著的人","毋愛開講的人"],"a":0,"e":"出版社第2課課文與語詞註解說「青盲牛」指毋捌字的人；不是指視力有問題。","h":"這个詞佇故事內底，是咧講一個人識字的情形，毋是目睭的狀況。"},{"q":"「拚勢」佇阿媽學數字的情境是啥物？","o":["真認真、真努力","真生氣","真驚惶"],"a":0,"e":"「拚勢」在這題指的是「真認真、真努力」。阿媽努力學數字，無偌久就熟手。","h":"想想阿媽學數字時付出的精神，毋是伊的情緒。"},{"q":"「熟手」是指？","o":["做甲真熟練","完全袂曉","攏無練習"],"a":0,"e":"課文說阿媽學甲真熟手。","h":"做一項代誌做久了，會愈來愈按怎？"},{"q":"「沓沓仔」是指？","o":["慢慢仔","真緊","忽然間"],"a":0,"e":"教材語詞註解是慢慢的。","h":"比較「一步一步」佮「一下仔」的做法。"},{"q":"「跟綴」是指？","o":["跟隨","丟掉","反對"],"a":0,"e":"教材語詞註解是跟隨。","h":"想想狗仔行佇主人後壁時的動作。"},{"q":"「便若」是指？","o":["只要","即使","除非"],"a":0,"e":"教材語詞註解是只要。","h":"注意這个詞後壁通常接一个條件佮結果。"},{"q":"「攢一本簿仔」的「攢」是指？","o":["準備","破壞","借走"],"a":0,"e":"作者準備一本電話簿。","h":"作者欲替阿媽做電話簿，動手進前愛先做啥物？"},{"q":"「賰的」佇課文指？","o":["剩落來的","全部的","頭一項"],"a":0,"e":"作者說賰的字阿媽猶原無捌。","h":"想想一項物件用過了，閣有留落來的部分。"},{"q":"「細粒子」佇阿乖嬸婆的描寫是？","o":["身材較細粒","聲音真大","年紀真細"],"a":0,"e":"課文以小個子畫像辨識。","h":"這个詞咧描寫人物的外形，毋是年歲。"},{"q":"「獨獨阿媽看有」的「獨獨」是指？","o":["只有","逐家攏有","隨時"],"a":0,"e":"這本簿仔只有阿媽看會曉。","h":"句內底有強調某一个人，想想別人敢有仝款能力。"}],"context":[{"q":"阿公行去菜市，狗仔就＿＿佇伊後壁。","o":["跟綴","反黃","敲電話"],"a":0,"e":"跟綴表示跟隨。","h":"狗仔佇阿公後壁，兩个的移動方向有啥物關係？"},{"q":"這本舊相簿的紙已經＿＿反黃。","o":["沓沓仔","一下仔","愈來愈緊"],"a":0,"e":"沓沓仔是慢慢地。","h":"紙張的變化是經過一段時間才出現，注意時間的進行。"},{"q":"你有話會當＿＿講，毋免著急。","o":["沓沓仔","猛掠","膨風"],"a":0,"e":"教材例句用沓沓仔講。","h":"講話毋免著急，空格應該表達啥物速度？"},{"q":"阿媽＿＿看著我轉去，就會笑咍咍。","o":["便若","除非","因為"],"a":0,"e":"便若表示只要。","h":"這句有「看著」佮「就會」，留意前後的條件關係。"},{"q":"這張圖畫是阿弟專工畫予阿媽的，伊是＿＿畫的。","o":["特別","無意","隨便"],"a":0,"e":"「專工」表達特地、特別為某人做這件代誌。","h":"這幅畫是專門畫予一个人的，注意畫圖的用意。"}],"reading":[{"q":"作者為啥物用大張紙寫 0 到 9？","o":["予阿媽較好辨認電話的數字","欲裝飾房間","欲做算術比賽"],"a":0,"e":"作者幫阿媽學習撥電話。","h":"想想阿媽辨認數字時，寫大字會帶來啥物幫助。"},{"q":"為啥物瓦斯行的號碼邊畫一桶瓦斯？","o":["用圖畫代替文字，予阿媽認出聯絡對象","因為號碼攏無寫","因為瓦斯行無電話"],"a":0,"e":"圖畫協助不識字的阿媽辨識。","h":"阿媽若無法靠文字辨認店家，作者改用啥物線索？"},{"q":"為啥物賣魚栽佮賣魚仔的圖畫大細無仝？","o":["避免兩个電話號碼分袂清","因為兩間攏賣仝款物件","因為簿仔無夠位"],"a":0,"e":"一尾細魚與一尾大魚區分不同商家。","h":"兩間店賣的物件相近，畫圖時需要避免啥物困擾？"},{"q":"「進嘉叔公」的號碼邊畫鉸刀是為啥物？","o":["用名字佮鉸刀的近音幫助記持","因為伊是賣鉸刀的","因為電話號碼真長"],"a":0,"e":"出版社第2課原文寫「進嘉叔公，就畫一支鉸刀」，因為「嘉」與「鉸」的閩南語讀音相近；用諧音協助阿媽辨認聯絡人。","h":"想想名字的聲音，會當佮啥物工具產生聯想？"},{"q":"依課文，這本電話簿仔對阿媽除了敲電話，閣有啥物意義？","o":["內底有親情朋友的記持","因為紙真新","因為電話攏無人使用"],"a":0,"e":"電話簿仔是為阿媽量身設計的圖像聯絡工具；多年後雖然紙已反黃，仍記錄親情朋友的往來。這是依課文整體情感推論。","h":"除了查號碼，簿仔內底的名字閣連結著啥物人佮代誌？"}],"comprehensive":[{"q":"欲幫無熟似手機的序大人記聯絡人，佗一个方法較貼心？","o":["字放大，閣配合對方看會曉的圖示","干焦寫真細字","完全無問伊的需要"],"a":0,"e":"課文從使用者需要設計專用電話簿。","h":"設計聯絡資料時，先考慮使用的人看得清楚、認得出來無。"},{"q":"兩个店家的圖示攏是魚，按怎改善較好？","o":["替兩間店畫出不同大小的魚，閣加上好認的特徵","只換號碼位置，兩張圖攏保持仝款","兩間店攏改畫同一隻細魚"],"a":0,"e":"課文用魚栽和魚仔的大小差異，讓阿媽能辨認不同店家；改良時應保留清楚可辨識的差別。","h":"圖示若傷相像，使用的人可能會發生啥物誤會？"},{"q":"若有人無捌字，佗一个態度較適當？","o":["尊重伊，揣適合的方式協助","笑伊無能力","禁止伊使用電話"],"a":0,"e":"作者用耐心與圖像協助阿媽。","h":"遇著別人識字有困難，先想想對方的感受佮需要。"},{"q":"一本舊電話簿對阿媽有啥物價值？","o":["除了實用，閣保存人際關係的記持","干焦是舊紙","只剩買賣價值"],"a":0,"e":"課文強調親情與朋友的回憶。","h":"一項舊物件除了原本的用途，可能閣留著啥物回憶？"},{"q":"欲替阿公設計常用聯絡簿，第一步較適當的是？","o":["先問伊慣勢按怎看佮按怎使用","直接照家己的習慣做","將所有電話號碼刪掉"],"a":0,"e":"符合課文以使用者為中心的精神。","h":"設計進前，應該先了解阿公本身的使用習慣抑是直接替伊決定？"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
