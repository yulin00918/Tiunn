<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>綴會著時代的老教授｜真平第三冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style><meta name="author" content="張鈺聆">

</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../index.html">← 返回</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第3課｜綴會著時代的老教授</h1><p>課文語詞與生活情境應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文事件、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>將課文理解應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「猛掠」是指？","o":["敏捷","傷慢","煩惱"],"a":0,"e":"教材註解猛掠是敏捷。","h":"課文用這个詞形容人的動作，想想做代誌俐落、反應緊是啥款情形。"},{"q":"「接接」佇教材語詞是指啥物？","o":["接待","丟掉","睡覺"],"a":0,"e":"出版社第3課語詞頁把「接接」解作接待；課文「較捷接接」則表示作者與教授較常接觸、因而互相熟似，需區分語詞解釋與上下文。","h":"注意題目問的是教材語詞解說；先分清楚「接待」佮「接觸、熟似」佇句內的差別。"},{"q":"「一下仔就好勢矣」佇課文是指啥物？","o":["處理妥當","開始爭吵","完全無效"],"a":0,"e":"課文寫老教授幫作者接麥克風、裝鏡頭、試軟體，一下仔就處理妥當；這是語境中的「好勢」，不是說人坐得舒服。","h":"看教授幫忙處理設備後的結果，想想事情是順利完成，抑是閣卡佇遐。"},{"q":"「苦毒」佇疫情情境是指？","o":["肆虐、造成困擾","真歡喜","輕鬆𨑨迌"],"a":0,"e":"課文寫疫情使學校實施線上課。","h":"想想疫情對日常生活造成的影響，這个詞帶有困難、折磨的意思無？"},{"q":"「好玄」是指？","o":["好奇","厭惡","無興趣"],"a":0,"e":"作者好奇老教授適應科技的能力。","h":"作者看見老教授熟悉科技，心內感覺奇特又好奇；想想這種感受會用啥物詞表達。"},{"q":"「走揣」是指？","o":["尋找","收藏","拒絕"],"a":0,"e":"課文說科學家走揣進步的科技。","h":"句內講科學家欲搵著進步的科技，想想「尋找」用台語按怎講。"},{"q":"「頕頭」是指？","o":["點頭","搖頭","低頭睡覺"],"a":0,"e":"作者聽老教授開破就頕頭。","h":"注意作者聽完教授說明後的反應；頭殼上下動，通常代表啥物意思？"},{"q":"「綴會著時代」是指？","o":["跟得上時代的變化","完全拒絕改變","只記得古早的代誌"],"a":0,"e":"課文主旨是學習新科技。","h":"拆開看「綴會著」佮「時代」，想想人愛按怎面對一直改變的新事物。"},{"q":"「食一歲，學一歲」欲表達？","o":["活到老學到老","年紀大就毋免學","學習只限學校"],"a":0,"e":"教材俗諺勉勵持續學習。","h":"這句俗諺講人生逐年過去，學習也毋通停止；想想它鼓勵啥物態度。"},{"q":"「老罔老，閣會哺塗豆」欲表達？","o":["年紀雖大猶原勇健","年紀大一定無喙齒","食塗豆就袂老"],"a":0,"e":"教材俗諺形容年長者仍健康。","h":"俗諺講年紀雖然大，猶原有精神做代誌；想想它欲稱讚長輩啥物狀態。"}],"context":[{"q":"老教授裝鏡頭、試軟體，一下仔就＿＿。","o":["好勢","苦毒","鬱卒"],"a":0,"e":"好勢表示妥當。","h":"教授完成接麥克風、裝鏡頭等工作後，事情處理到啥物程度？"},{"q":"阿媽雖然八十歲矣，動作猶原真＿＿。","o":["猛掠","拖沙","懶惰"],"a":0,"e":"教材例句用猛掠描寫動作敏捷。","h":"句仔形容八十歲阿媽的動作，想想手腳俐落、反應緊的特徵。"},{"q":"有新科技袂曉用，咱會當先＿＿資料閣請教別人。","o":["走揣","拒絕","刪除"],"a":0,"e":"走揣是尋找。","h":"空格後面講「資料」，前面又提著袂曉用新科技；想想先搵資料的動作。"},{"q":"我聽老師講完，認同伊的想法，就＿＿。","o":["頕頭","走掉","生氣"],"a":0,"e":"頕頭是點頭表示認同。","h":"句仔講聽完老師的想法而且認同，通常會用啥物動作表示同意？"},{"q":"阿公逐工學一點仔新物件，真正是「＿＿」。","o":["食一歲，學一歲","看戲頭就知戲尾","一粒米，百粒汗"],"a":0,"e":"俗諺鼓勵持續學習。","h":"重點是逐工學一點新物件，想想哪句俗諺鼓勵人毋通停止學習。"}],"reading":[{"q":"依課文，老教授平常有使用佗幾項科技？","o":["看新聞、追劇、行動支付佮連線遊戲","只用紙本信件","完全無使用手機"],"a":0,"e":"出版社第3課前兩段列出看網路新聞、手機追劇、線上遊戲及多種非現金支付；選項所列均有課文依據。","h":"回想課文前兩段列出的生活科技，注意新聞、追劇、遊戲佮付款方式等例子。"},{"q":"作者拄開始線頂上課為啥物真煩惱？","o":["袂熟似接設備佮操作軟體","因為學生攏無課本","因為學校無課程"],"a":0,"e":"課文說作者起初對線上教學手足無措。","h":"比較作者一開始面對線上教學的反應佮後來得到協助前的情形。"},{"q":"老教授按怎鬥相共作者？","o":["教接麥克風、裝鏡頭、邀學生佮分享螢幕","替作者寫考卷","叫作者毋通上課"],"a":0,"e":"老教授協助解決線上教學技術問題。","h":"找出教授實際幫作者處理設備的段落，注意伊做了哪些具體的代誌。"},{"q":"老教授為啥物願意學科技？","o":["認為科技能予生活較利便","認為學科技攏無意義","認為科技只適合少年人"],"a":0,"e":"他認為科技發明是為了便利生活。","h":"留意教授對科技用途的看法：發明新工具主要是欲解決生活中的啥物需求？"},{"q":"老教授最後用手機訂餐欲證明啥物？","o":["科技會當實際改善日常生活","科技干焦會耍遊戲","外送一定比煮飯便宜"],"a":0,"e":"他用訂餐示範科技帶來的便利。","h":"看結尾教授用手機做的示範，想想這个例仔欲表現科技帶來啥物改變。"}],"comprehensive":[{"q":"若長輩想學行動支付，佗一个做法較好？","o":["先了解伊的需要，分步練習並核對付款資訊","先請伊把密碼交予教學的人保管","先用伊的手機試轉一筆錢，毋免問伊"],"a":0,"e":"這是課文精神延伸的生活情境，不是原文直接寫的支付教學。尊重學習者、逐步練習且確認金額與對象較安全。","h":"幫長輩學新功能時，想想按步就班、確認金額佮收款對象，哪種做法較尊重也較安全。"},{"q":"有同學講老人一定袂曉科技，佗一个回應較符合課文？","o":["年歲毋是學習能力的唯一標準","老人攏袂使使用手機","少年人攏比老人𠢕"],"a":0,"e":"老教授證明持續學習的重要。","h":"課文中的老教授用實際行動打破哪一種對年紀的刻板印象？"},{"q":"線頂上課設備無聲，第一步較合理的是？","o":["檢查麥克風佮軟體設定，必要時請教","直接放棄上課","亂按所有設定"],"a":0,"e":"課文示範逐項處理設備問題。","h":"設備無聲時先逐項確認設定，會比一開始就放棄或亂按來得合理。"},{"q":"「食一歲，學一歲」會當運用佇啥物情境？","o":["學新的數位工具，慢慢練習","拒絕所有新事物","只學家己本來會的"],"a":0,"e":"俗諺鼓勵終身學習。","h":"這句俗諺強調學習無年齡限制；想想生活中哪種持續學習的情境符合它。"},{"q":"科技雖然利便，欲保持安全，佗个態度較適當？","o":["願意學習，也注意個資佮付款安全","任何連結攏直接點","密碼公開予所有人"],"a":0,"e":"延伸課文的科技應用並加入安全判斷。","h":"科技帶來方便的同時，使用前仍愛確認對象、金額及資料來源；想想哪種態度兼顧便利佮安全。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../index.html'};</script></body></html>
