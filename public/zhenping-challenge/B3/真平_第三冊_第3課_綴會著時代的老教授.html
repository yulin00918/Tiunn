</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">👴</div><h1>第3課｜綴會著時代的老教授</h1><p>科技生活、終身學習佮開放心態</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「猛掠」較接近啥物意思？","o":["動作敏捷","真勇猛","掠真濟物件","真凶"],"a":0,"e":"猛掠：動作敏捷。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「接接」較接近啥物意思？","o":["接待、來往交流","接電話","接力","接收"],"a":0,"e":"接接：接洽、往來交流。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「好勢」較接近啥物意思？","o":["端正、舒服、處理好","好運","勢面真大","好人"],"a":0,"e":"好勢：端正、舒服；一下仔就好勢矣＝搞定了。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「四序」較接近啥物意思？","o":["妥當、井井有條","四季","四个順序","四界"],"a":0,"e":"四序：井井有條、妥當舒適。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「苦毒」較接近啥物意思？","o":["虐待、肆虐","苦的毒藥","苦戰","痛苦"],"a":0,"e":"苦毒：虐待，此指肆虐。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「頭殼𢯾咧燒」較接近啥物意思？","o":["代誌真歹處理，真頭疼","頭殼發燒","頭殼真燒熱","想甲真專心"],"a":0,"e":"抱著著火的頭，比喻令人頭痛。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「mài-kù」是啥物？","o":["麥克風","滑鼠","鏡頭","喇叭"],"a":0,"e":"mài-kù：麥克風。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「走揣」較接近啥物意思？","o":["四界揣，此指努力發明","走路","走閃","揣頭路"],"a":0,"e":"走揣：到處尋找。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「電甲金鑠鑠」較接近啥物意思？","o":["予人修理甲真悽慘","電火真光","頭毛電甲真媠","真有電"],"a":0,"e":"形容被修理得慘兮兮。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"課文「欲倚八十歲矣」的「倚」是啥物意思？","o":["接近、將近","倚靠","徛起來","過去"],"a":0,"e":"倚：貼近、靠近、將近。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「追劇」是啥物意思？","o":["守咧看連續劇","追賊仔","追公車","演戲"],"a":0,"e":"追劇：守著電視劇開播。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「做工課的時，跤手愛＿＿，飯碗才捀會久。」空格揀佗一个？","o":["猛掠","四序","接接","苦毒"],"a":0,"e":"手腳要敏捷。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「人客來矣，你毋緊去＿＿閣踮遮坐？」空格揀佗一个？","o":["接接","猛掠","好勢","走揣"],"a":0,"e":"接待客人。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「上課矣，逐家坐予＿＿。」空格揀佗一个？","o":["好勢","猛掠","接接","苦毒"],"a":0,"e":"坐好。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「後生畢業了後揣無工課，真正是＿＿。」空格揀佗一个？","o":["頭殼𢯾咧燒","電甲金鑠鑠","猛掠","好勢"],"a":0,"e":"令人頭痛。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「時代咧進步，咱愛繼續學習，眼界才會拍開。」用佗一句俗諺？","o":["食一歲，學一歲","老罔老，閣會哺塗豆","四書五經讀透透，毋捌黿鼇龜鱉竈","千算萬算，毋值天一劃"],"a":0,"e":"勉勵人不斷學習新知。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「遮爾懸的山，阿媽𬦰起來輕輕鬆鬆。」用佗一句俗諺形容阿媽？","o":["老罔老，閣會哺塗豆","食一歲，學一歲","弓蕉吐囝為囝死","頭燒燒，尾冷冷"],"a":0,"e":"人老了身體仍很健康。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「＿＿是籃球抑是羽毛球，阿爸攏拍甲足好。」空格揀佗一个？","o":["毋管","便若","那","毋但"],"a":0,"e":"毋管……抑是……：不管……還是……","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「彼个歌手＿＿跳舞＿＿唱歌，一點仔都袂喘。」空格揀佗一組？","o":["那……那……","毋但……嘛……","便若……就……","雖然……毋過……"],"a":0,"e":"那……那……：一邊……一邊……","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊讀冊＿＿認真。」空格揀佗一个？","o":["誠","猶","才","煞"],"a":0,"e":"誠：非常、很。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"阿成無紮現金，欲食臭豆腐，阿才講會當用啥物付錢？","o":["line pay","悠遊卡","支票","金仔"],"a":0,"e":"老闆有綴時行，會當用 line pay。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"老教授幾歲矣？","o":["欲倚八十歲","六十歲","七十歲","九十外歲"],"a":0,"e":"伊欲倚八十歲矣。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"真濟人猶堅持看報紙的時，老教授已經咧做啥？","o":["看網路新聞","聽收音機","寫批","看電視"],"a":0,"e":"老教授已經開始看網路新聞。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"老教授三不五時會招厝邊兜的囡仔兄做啥物？","o":["連線耍遊戲","追劇","查資料","買物件"],"a":0,"e":"做伙連線耍遊戲、拚輸贏。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者佮老教授較捷接接，是佇啥物時陣？","o":["新冠肺炎期間","老教授退休的時","作者讀大學的時","過年的時"],"a":0,"e":"兩、三冬前全臺灣予新冠肺炎苦毒的時。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者規頭殼𢯾咧燒的原因是？","o":["袂曉用線頂上課的設備","全支付用袂四序","得著新冠肺炎","手機仔歹去"],"a":0,"e":"學校實施線上上課，一開始手足無措。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"老教授教作者做啥物？","o":["接麥克風、裝鏡頭、分享螢幕","煮焦麵","拍電腦遊戲","看報紙"],"a":0,"e":"教他線上上課的設備。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"老教授認為科技的發展是為著啥物？","o":["人類的利便","予人較無閒","賺錢","比賽"],"a":0,"e":"科技發展是為人類的方便設想。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"老教授那講那滑手機仔，結果送來啥物？","o":["兩碗焦麵佮滷味","兩杯珍珠奶茶","一份報紙","一台平板"],"a":0,"e":"網友食好鬥相報的外送。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者大力頕頭的原因是？","o":["認同愛好好仔用科技來便利生活","老人用科技才會變少年","電腦教學會避免肺炎","老教授欲請伊食麵"],"a":0,"e":"聽老教授開破，決定向他學習。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈綴會著時代的老教授〉的作者是啥人？","o":["顏銘俊","向陽","黃之綠","李麗玉"],"a":0,"e":"顏銘俊，臺南下營人。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"科技的䆀處，下面佗一个上有可能？","o":["定定耍手機仔會近視、癮網路","生活變較利便","會當線頂上課","會當用手機付錢"],"a":0,"e":"要培養自律，管理使用時間。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"老教授共科技運用佇「食」的方面，是做啥物？","o":["用手機仔點餐","看網路新聞","線頂教學","耍遊戲"],"a":0,"e":"用手機仔叫外送。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"下面佗一个毋是非現金支付？","o":["提紙票付現金","悠遊卡","line pay","一卡通"],"a":0,"e":"紙票是現金。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"若厝裡的阿公想欲學用手機仔，你上好按怎做？","o":["耐心教伊，予伊嘛會當享受科技","笑伊老矣學袂曉","叫伊莫學","替伊用就好"],"a":0,"e":"像作者學老教授一樣互相學習。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"本課欲予咱學著啥物態度？","o":["用開放的心態接受新科技","拒絕所有新科技","干焦少年人才愛學","科技攏是歹物"],"a":0,"e":"食一歲，學一歲。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"對話：阿庭點焦麵、無愛蔥仔、加滷卵，結果送來的是？","o":["湯的加卵包","焦麵加滷卵","焦麵無蔥仔","滷味"],"a":0,"e":"外送送錯了。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
