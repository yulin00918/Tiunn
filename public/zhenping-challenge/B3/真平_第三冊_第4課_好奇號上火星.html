</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🚀</div><h1>第4課｜好奇號上火星</h1><p>太空科技、好奇心佮創造力</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「好玄」較接近啥物意思？","o":["好奇","好運","真玄","好心"],"a":0,"e":"好玄：好奇。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「風神」較接近啥物意思？","o":["拉風、有面子","風颱","風的神明","愛吹風"],"a":0,"e":"風神：拉風、有面子。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「精光」較接近啥物意思？","o":["精明","光溜溜","真光","用了了"],"a":0,"e":"精光：精明。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「拋拋走」較接近啥物意思？","o":["四界走","走真緊","拋物件","走閃"],"a":0,"e":"拋拋走：到處亂跑。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「躼躼長」較接近啥物意思？","o":["真長、真遠","人真懸","時間真短","路真闊"],"a":0,"e":"躼躼長：很長、很遙遠。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「枵狗數想豬肝骨」比喻啥物？","o":["痴心妄想","狗仔腹肚枵","真愛食豬肝","努力就會成功"],"a":0,"e":"意同癩蝦蟆想吃天鵝肉。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「華裔」是指啥物人？","o":["蹛海外的華人後代","中國人","外國人","華語老師"],"a":0,"e":"華裔：旅居海外的華人後代。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「礙著」較接近啥物意思？","o":["妨礙著","愛著","閣著","倚著"],"a":0,"e":"礙著：妨礙到。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「盤山過嶺」較接近啥物意思？","o":["翻山越嶺","盤仔頂的山","𬦰山頂","過橋"],"a":0,"e":"盤山過嶺：翻山越嶺。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「開眼界」較接近啥物意思？","o":["增加見識","目睭擘開","看醫生","開窗仔"],"a":0,"e":"開眼界：增加見識、開闊視野。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「攑頭」較接近啥物意思？","o":["抬頭","頕頭","越頭","搖頭"],"a":0,"e":"攑頭：舉頭、抬頭。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「落屎星」是啥物？","o":["流星","火星","月娘","彗星"],"a":0,"e":"落屎星：流星。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「伊對海洋的生物誠＿＿，所以收集足濟資料。」空格揀佗一个？","o":["好玄","風神","精光","拋拋走"],"a":0,"e":"好奇。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「多謝你的呵咾，予我感覺真＿＿。」空格揀佗一个？","o":["風神","好玄","拋拋走","躼躼長"],"a":0,"e":"有面子。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「彼个囡仔足＿＿的，予你袂拐得。」空格揀佗一个？","o":["精光","風神","好玄","躼躼長"],"a":0,"e":"很精明，騙不了。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「囡仔人食飯愛坐予好，毋通＿＿。」空格揀佗一个？","o":["拋拋走","精光","風神","攑頭"],"a":0,"e":"不要到處亂跑。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊用心照顧田園，啥人知影一場風颱攏無去矣。」用佗一句俗諺？","o":["千算萬算，毋值天一劃","送伊魚，較輸教伊掠魚","枵狗數想豬肝骨","食一歲，學一歲"],"a":0,"e":"人再會盤算，也比不過老天安排。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「你莫偷提錢予序細，愛教伊家己趁錢。」用佗一句俗諺？","o":["送伊魚，較輸教伊掠魚","千算萬算，毋值天一劃","枵狗數想豬肝骨","兔仔望月"],"a":0,"e":"幫助別人要教他解決的能力。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「＿＿職業是啥，攏愛認真做。」照句型，空格揀佗一个？","o":["無論","雖罔","便若","那"],"a":0,"e":"無論……攏……：不管如何都……","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「臭頭包布——＿＿」，形容人愛出風頭。","o":["風神","精光","好玄","親切"],"a":0,"e":"「防蠅」和「風神」音近。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「月娘下看影——＿＿」，形容人自大。","o":["家己看，家己大","風神","有影","無影"],"a":0,"e":"在月光下看影子越看越大。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「有時星光，有時月光」比喻啥物？","o":["風水輪流轉","暗時真光","愛看天星","月娘比天星較光"],"a":0,"e":"有時星星亮、有時月亮亮，比喻風水輪流轉。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"「好奇號」是啥物時陣登陸火星的？","o":["2012 年 8 月 6 號","1969 年 7 月","2020 年 2 月","2008 年 8 月"],"a":0,"e":"2012 年 8 月 6 日成功登陸火星。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「好奇號」這个名是啥人號的？","o":["華裔的查某囡仔馬天琪","美國總統","科學家","作者李麗玉"],"a":0,"e":"華裔女孩馬天琪（Clara Ma）命名。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"科學家欲去火星，上主要的向望是？","o":["確定火星的環境敢適合人蹛","揣戰神瑪爾斯","揣嫦娥","看火星人"],"a":0,"e":"想要確定火星是否適合人類居住。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「好奇號」的外型敢若啥物？","o":["一台轎車","一隻白鶴","一粒球","一台飛行機"],"a":0,"e":"外型敢若一台轎車，毋過頭腦真精光。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「好奇號」按怎共火星的資料傳予科學家？","o":["收集→分析檢驗→傳轉來地球","翕相→號名→寄批","收集→囥咧→家己看","分析→掖掉→重收"],"a":0,"e":"岩石、塗沙送入火星科學實驗室分析，再傳回地球。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"下面佗一个選項毋著？","o":["「好奇號」是馬天琪發明的","好奇號外型像轎車","好奇號會揣上好的路線","好奇號會翕火星的相片"],"a":0,"e":"馬天琪是命名，不是發明。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文講「火星」是地球的啥物？","o":["好兄弟","月娘","老爸","敵人"],"a":0,"e":"「火星」是地球的好兄弟。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文用啥物來比喻好奇號降落火星？","o":["天頂飛的白鶴","戰神瑪爾斯","嫦娥","落屎星"],"a":0,"e":"親像佇天頂飛的白鶴，優雅降落火星。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"瑪爾斯是啥物？","o":["羅馬神話的戰神","火星探測車","科學家","女神"],"a":0,"e":"火星英文 Mars 來自羅馬戰神。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈好奇號上火星〉的作者是啥人？","o":["李麗玉","向陽","黃之綠","顏銘俊"],"a":0,"e":"李麗玉，國中國文佮本土語老師。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"對話內底，欲看落屎星雨，愛去啥物所在較看會著？","o":["較曠闊、無光害的所在","大樓內底","地下室","夜市仔"],"a":0,"e":"四界攏是大樓就看袂著。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「玉萍頭腦巧，做代誌閣頂真。」玉萍是一个啥物款的人？","o":["精光","閉思","孤單","急性"],"a":0,"e":"頭腦巧、做事認真，就是精光。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「有一粒星速度誠緊，顯一下就無去矣。」查埔囡仔可能看著啥物？","o":["落屎星","月娘","火星","好奇號"],"a":0,"e":"速度很快一閃就不見，是流星。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「兔仔望月」比喻啥物？","o":["痴心妄想","思念故鄉","兔仔真媠","月娘真圓"],"a":0,"e":"兔仔望月：比喻人痴心妄想。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"本課想欲予咱有啥物精神？","o":["保持好奇心，就會刺激創造力","火星攏無路用","科學真無聊","莫想傷濟"],"a":0,"e":"有好奇就會刺激較濟創造力。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「講一个影，生一个囝」比喻啥物？","o":["捕風捉影、加油添醋","生囡仔真快","影片真濟","講話真準"],"a":0,"e":"說的人才起頭，聽的人就加油添醋。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
