<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>好奇號上火星｜真平第三冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style><meta name="author" content="張鈺聆">

</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第4課｜好奇號上火星</h1><p>課文語詞、閱讀理解與生活應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「嫦娥孤單倚佇樓窗」的「倚」是啥物意思？","o":["靠佇、倚靠","遠離、走開","停止講話"],"a":0,"e":"出版社第4課第一段寫嫦娥「孤單倚佇樓窗」；此處「倚」是靠、倚靠，原題誤寫「欲倚晝」並解作接近，與本課語境不符。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「嫦娥孤單倚佇樓窗」的用法。"},{"q":"「好玄」是指？","o":["好奇","生氣","失望"],"a":0,"e":"教材語詞解釋好玄是好奇。","h":"比較選項的意思，想看啥一个符合「好玄」佇課文內底的用法。"},{"q":"「風神」佇課文是指？","o":["拉風、有面子","無精神","真煩惱"],"a":0,"e":"教材解釋風神是神氣、有面子。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「精光」佇課文是指？","o":["精明","粗心","懶惰"],"a":0,"e":"教材語詞解釋精光是精明。","h":"先看「精光」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「拋拋走」是指？","o":["四界走動","定定坐咧","一直睏"],"a":0,"e":"教材解釋拋拋走是到處跑。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「拋拋走」的用法。"},{"q":"「開眼界」是指？","o":["見識新的事物","閉目睭","變較近視"],"a":0,"e":"課文用開眼界表示增廣見聞。","h":"比較選項的意思，想看啥一个符合「開眼界」佇課文內底的用法。"},{"q":"「登陸」是指？","o":["到達並落佇陸地表面","離開地球大氣層","飛過空中無降落"],"a":0,"e":"好奇號成功登陸火星。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「探索」是指？","o":["調查未知事物","放棄研究","只憑想像"],"a":0,"e":"好奇號探索火星的環境。","h":"先看「探索」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「障礙」是指？","o":["阻礙前進的物件或困難","幫助行進的路標","完成的獎品"],"a":0,"e":"探測車會避開路上的障礙。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「障礙」的用法。"},{"q":"「奧妙」是指？","o":["深奧閣奇妙的道理","簡單的價錢","普通的聲音"],"a":0,"e":"文章談宇宙的奧妙。","h":"比較選項的意思，想看啥一个符合「奧妙」佇課文內底的用法。"}],"context":[{"q":"囡仔對火星的世界真＿＿，一直問問題。","o":["好玄","鬱卒","閉思"],"a":0,"e":"好玄就是好奇。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"這台探測車會避開石頭等＿＿。","o":["障礙","禮物","歌詩"],"a":0,"e":"障礙會妨礙前進。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"天文館有真濟新的知識，予我大＿＿。","o":["開眼界","閉目睭","落勾"],"a":0,"e":"開眼界表示增廣見聞。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"伊放假時定定去四界＿＿，認捌無仝所在。","o":["拋拋走","頕頭","越頭"],"a":0,"e":"拋拋走指到處走動。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"科學家想欲＿＿火星頂的水土環境。","o":["探索","化解","照顧頭毛"],"a":0,"e":"探索是調查未知事物。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"}],"reading":[{"q":"科學家派好奇號去火星，主要欲了解啥物？","o":["火星的水土環境敢適合生命生存","火星敢有廟會","火星的戲院票價"],"a":0,"e":"課文關心火星環境與居住可能性。","h":"先分清楚題目問的是事情經過、人物想法，抑是作者的描寫。"},{"q":"「好奇號」的名稱是按怎來的？","o":["華裔查某囡仔馬天琪參加徵名活動提出","科學家發現一粒新行星","探測車家己選的"],"a":0,"e":"出版社第4課第三段明確說「好奇號」是華裔查某囡仔馬天琪號名的；她參與命名，不是發明或設計探測車。","h":"想想課文提供啥物線索，答案愛有文本根據，毋通干焦用印象猜。"},{"q":"好奇號會按怎通過火星地表的障礙？","o":["利用設備判斷路線並避開障礙","完全無需要判斷","只會直直衝過去"],"a":0,"e":"文章描寫探測車能選擇路線。","h":"比較前後段落的變化，留意作者用啥物細節支持這个意思。"},{"q":"依課文，好奇號共岩石、塗壤送入科學實驗室了後會按怎？","o":["檢測分析，閣將資料傳轉地球","直接丟掉全部樣本","送去月球展覽"],"a":0,"e":"出版社第4課第四段寫收集岩石、塗壤後，逐項檢驗分析，再把結果傳回地球供科學家研究；不是把實體樣本送回地球。","h":"先確認題目問的重點，再回想課文內底對應的情節或句子。"},{"q":"作者為啥物以「好奇」做文章的核心？","o":["好奇心會推動探索與發明","好奇心會妨礙學習","科學毋免提出問題"],"a":0,"e":"文章結尾強調好奇激發創造力。","h":"先回想課文相關段落，找出人物、事件佮原因之間的關係。"}],"comprehensive":[{"q":"若欲判斷火星敢適合人類居住，佗種證據較有幫助？","o":["探測水、土壤佮環境條件的資料","網路上無來源的傳聞","只看火星的名"],"a":0,"e":"探測數據比無根據的猜想可靠。","h":"把課文的觀念帶入這个情境，想想實際發生時會按怎判斷。"},{"q":"有人講「馬天琪發明好奇號」，按怎修正較正確？","o":["伊提出探測車的名稱，毋是發明探測車","伊是第一位登陸火星的人","伊設計火星所有的設備"],"a":0,"e":"出版社第4課第三段與教學補充明確指出馬天琪參與命名。她並非好奇號的發明者；題目練習區分「命名」與「研發」。","h":"毋通只看單一詞語，愛連同人物、原因佮結果做伙考慮。"},{"q":"同學想設計校園探測車，佗个功能較能學習好奇號？","o":["會辨識障礙，閣收集環境資料","干焦會閃燈","只會播放音樂"],"a":0,"e":"好奇號具備避障與資料蒐集能力。","h":"先找出題目欲你判斷的核心，再排除無符合情境的選項。"},{"q":"看到「火星有外星人」的網路文章，佗个做法較適當？","o":["查證科學資料，分清楚推測佮證據","直接當做事實轉傳","只看標題就相信"],"a":0,"e":"課文鼓勵探索，但未知不能當成已證實。","h":"想想課文的重點佮這个新情境有啥物關係，再做決定。"},{"q":"「好奇是夢想的開始」會當用佇啥物學習活動？","o":["提出問題、設計實驗、根據結果修正想法","無問問題就照抄答案","只靠猜測無做驗證"],"a":0,"e":"好奇心結合實際查證才會帶來新發現。","h":"比較各選項可能造成的結果，揀一項最符合題目條件的。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
