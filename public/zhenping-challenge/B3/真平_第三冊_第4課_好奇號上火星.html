<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>好奇號上火星｜真平第三冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../index.html">← 返回整冊</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第4課｜好奇號上火星</h1><p>課文語詞、閱讀理解與生活應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「嫦娥孤單倚佇樓窗」的「倚」是啥物意思？","o":["靠佇、倚靠","遠離、走開","停止講話"],"a":0,"e":"出版社第4課第一段寫嫦娥「孤單倚佇樓窗」；此處「倚」是靠、倚靠，原題誤寫「欲倚晝」並解作接近，與本課語境不符。"},{"q":"「好玄」是指？","o":["好奇","生氣","失望"],"a":0,"e":"教材語詞解釋好玄是好奇。"},{"q":"「風神」佇課文是指？","o":["拉風、有面子","無精神","真煩惱"],"a":0,"e":"教材解釋風神是神氣、有面子。"},{"q":"「精光」佇課文是指？","o":["精明","粗心","懶惰"],"a":0,"e":"教材語詞解釋精光是精明。"},{"q":"「拋拋走」是指？","o":["四界走動","定定坐咧","一直睏"],"a":0,"e":"教材解釋拋拋走是到處跑。"},{"q":"「開眼界」是指？","o":["見識新的事物","閉目睭","變較近視"],"a":0,"e":"課文用開眼界表示增廣見聞。"},{"q":"「登陸」是指？","o":["到達並落佇陸地表面","離開地球大氣層","飛過空中無降落"],"a":0,"e":"好奇號成功登陸火星。"},{"q":"「探索」是指？","o":["調查未知事物","放棄研究","只憑想像"],"a":0,"e":"好奇號探索火星的環境。"},{"q":"「障礙」是指？","o":["阻礙前進的物件或困難","幫助行進的路標","完成的獎品"],"a":0,"e":"探測車會避開路上的障礙。"},{"q":"「奧妙」是指？","o":["深奧閣奇妙的道理","簡單的價錢","普通的聲音"],"a":0,"e":"文章談宇宙的奧妙。"}],"context":[{"q":"囡仔對火星的世界真＿＿，一直問問題。","o":["好玄","鬱卒","閉思"],"a":0,"e":"好玄就是好奇。"},{"q":"這台探測車會避開石頭等＿＿。","o":["障礙","禮物","歌詩"],"a":0,"e":"障礙會妨礙前進。"},{"q":"天文館有真濟新的知識，予我大＿＿。","o":["開眼界","閉目睭","落勾"],"a":0,"e":"開眼界表示增廣見聞。"},{"q":"伊放假時定定去四界＿＿，認捌無仝所在。","o":["拋拋走","頕頭","越頭"],"a":0,"e":"拋拋走指到處走動。"},{"q":"科學家想欲＿＿火星頂的水土環境。","o":["探索","化解","照顧頭毛"],"a":0,"e":"探索是調查未知事物。"}],"reading":[{"q":"科學家派好奇號去火星，主要欲了解啥物？","o":["火星的水土環境敢適合生命生存","火星敢有廟會","火星的戲院票價"],"a":0,"e":"課文關心火星環境與居住可能性。"},{"q":"「好奇號」的名稱是按怎來的？","o":["華裔查某囡仔馬天琪參加徵名活動提出","科學家發現一粒新行星","探測車家己選的"],"a":0,"e":"出版社第4課第三段明確說「好奇號」是華裔查某囡仔馬天琪號名的；她參與命名，不是發明或設計探測車。"},{"q":"好奇號會按怎通過火星地表的障礙？","o":["利用設備判斷路線並避開障礙","完全無需要判斷","只會直直衝過去"],"a":0,"e":"文章描寫探測車能選擇路線。"},{"q":"依課文，好奇號共岩石、塗壤送入科學實驗室了後會按怎？","o":["檢測分析，閣將資料傳轉地球","直接丟掉全部樣本","送去月球展覽"],"a":0,"e":"出版社第4課第四段寫收集岩石、塗壤後，逐項檢驗分析，再把結果傳回地球供科學家研究；不是把實體樣本送回地球。"},{"q":"作者為啥物以「好奇」做文章的核心？","o":["好奇心會推動探索與發明","好奇心會妨礙學習","科學毋免提出問題"],"a":0,"e":"文章結尾強調好奇激發創造力。"}],"comprehensive":[{"q":"若欲判斷火星敢適合人類居住，佗種證據較有幫助？","o":["探測水、土壤佮環境條件的資料","網路上無來源的傳聞","只看火星的名"],"a":0,"e":"探測數據比無根據的猜想可靠。"},{"q":"有人講「馬天琪發明好奇號」，按怎修正較正確？","o":["伊提出探測車的名稱，毋是發明探測車","伊是第一位登陸火星的人","伊設計火星所有的設備"],"a":0,"e":"出版社第4課第三段與教學補充明確指出馬天琪參與命名。她並非好奇號的發明者；題目練習區分「命名」與「研發」。"},{"q":"同學想設計校園探測車，佗个功能較能學習好奇號？","o":["會辨識障礙，閣收集環境資料","干焦會閃燈","只會播放音樂"],"a":0,"e":"好奇號具備避障與資料蒐集能力。"},{"q":"看到「火星有外星人」的網路文章，佗个做法較適當？","o":["查證科學資料，分清楚推測佮證據","直接當做事實轉傳","只看標題就相信"],"a":0,"e":"課文鼓勵探索，但未知不能當成已證實。"},{"q":"「好奇是夢想的開始」會當用佇啥物學習活動？","o":["提出問題、設計實驗、根據結果修正想法","無問問題就照抄答案","只靠猜測無做驗證"],"a":0,"e":"好奇心結合實際查證才會帶來新發現。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
