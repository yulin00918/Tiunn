</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第四冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🔗</div><h1>語文天地（一）｜連接詞（一）</h1><p>並列、選擇、因果、先後</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「連接詞」是啥物？","o":["連接語詞、句、段落，表示語意關係的詞","形容物件的詞","模仿聲音的詞","重疊的詞"],"a":0,"e":"連接兩个以上的語詞、短語、句、段落。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「佮」是表示啥物關係的連接詞？","o":["並列","選擇","因果","先後"],"a":0,"e":"佮：和、及、與。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「那……那……」是表示啥物關係？","o":["並列","選擇","因果","先後"],"a":0,"e":"一邊……一邊……","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「抑是」是表示啥物關係？","o":["選擇","並列","因果","先後"],"a":0,"e":"抑是：或者、或是。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「因為」是表示啥物關係？","o":["因果","選擇","並列","先後"],"a":0,"e":"因為……所以……","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「就按呢」是表示啥物關係？","o":["因果","選擇","並列","先後"],"a":0,"e":"就按呢：因此、所以。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「紲落去」是表示啥物關係？","o":["先後","因果","選擇","並列"],"a":0,"e":"紲落去：接下來。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「紲落去」的華語是啥物？","o":["接下來","掉下去","連起來","繼續落"],"a":0,"e":"紲落去：接下來。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「你是去圖書館＿＿菜市仔？」空格揀佗一个？","o":["抑是","總是","毋才","所以"],"a":0,"e":"選擇關係。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊昨昏淋雨，＿＿感冒矣。」空格揀佗一个？","o":["就按呢","毋但","因為","紲落去"],"a":0,"e":"因果：因此感冒。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊共塗跤掃掃咧，＿＿就坐佇膨椅咧歇喘。」空格揀佗一个？","o":["紲落去","因為","而且","就按呢"],"a":0,"e":"先後：接下來。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊食歹腹肚，＿＿一直走便所。」空格揀佗一个？","o":["所以","佮","抑是","紲落去"],"a":0,"e":"因果關係。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這領衫毋管是紅色＿＿藍色，攏真好看。」空格揀佗一个？","o":["抑是","佮","所以","因為"],"a":0,"e":"選擇關係。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「天色漸漸變暗，＿＿就落雨矣。」空格揀佗一个？","o":["紲落去","抑是","佮","因為"],"a":0,"e":"先後關係。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「我＿＿阮阿兄差兩歲。」空格揀佗一个？","o":["佮","所以","抑是","紲落去"],"a":0,"e":"並列：我和哥哥。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊看起來真歡喜，＿＿得著老師的呵咾。」空格揀佗一个？","o":["因為","佮","抑是","紲落去"],"a":0,"e":"因果：原因在後。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿真＿＿寫功課＿＿看電視，誠無認真。」空格揀佗一組？","o":["那……那……","因為……所以……","抑是……抑是……","就按呢……"],"a":0,"e":"一邊寫功課一邊看電視。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"「明仔載我抑是阿母欲鬥陣去看電影。」這句有啥物問題？","o":["「抑是」應該換做「佮」","「鬥陣」毋著","「明仔載」毋著","攏無毋著"],"a":0,"e":"兩个人一起去，是並列，用佮。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「你先共功課寫了，就按呢才去看電視。」應該按怎改？","o":["「就按呢」換做「紲落去」","「先」換做「後」","「才」換做「就」","攏無毋著"],"a":0,"e":"這是先後關係。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「你欲去拍球，抑是欲去散步？」連接詞用了著無？","o":["著","毋著，愛用佮","毋著，愛用就按呢","毋著，愛用紲落去"],"a":0,"e":"選擇關係用抑是。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"連接詞會使重疊使用無？","o":["袂使","會使","看情形","干焦佮會使"],"a":0,"e":"連接詞不能重疊使用。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「阿川真好禮，所以逐家攏真佮意伊。」連接啥物？","o":["句佮句","詞佮詞","段落佮段落","字佮字"],"a":0,"e":"連接具因果關係的句子。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"字尾接龍：「燈火」→「火車」→？","o":["車站","站牌","火車頭","燈火"],"a":0,"e":"車站，接著站開頭的詞。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"下面佗一句的連接詞用了上適當？","o":["伊那行路那唱歌","伊因為行路那唱歌","伊抑是行路佮唱歌","伊紲落去行路抑是唱歌"],"a":0,"e":"並列：那……那……","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「禮拜咱先坐火車去彰化，＿＿盤車去鹿港。」空格揀佗一个？","o":["紲落去","抑是","因為","佮"],"a":0,"e":"先後順序。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「騎跤踏車＿＿拍籃球攏是我上佮意的休閒活動。」空格揀佗一个？","o":["佮","抑是","所以","紲落去"],"a":0,"e":"並列兩項活動。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「你欲食飯抑是食麵？」這句是咧表達啥物？","o":["請對方揀一項","兩項攏愛食","先食飯才食麵","因為食飯所以食麵"],"a":0,"e":"選擇關係。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
