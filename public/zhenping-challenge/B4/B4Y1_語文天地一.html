<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>語文天地一｜真平第四冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style><meta name="author" content="張鈺聆">

</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../index.html">← 返回</a><span class="pill">📗 真平・第四冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>語文天地一｜連接詞（一）</h1><p>連接詞（一）、語境判斷與生活應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文的意象、情感與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文理解運用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「佮」佇這課的意思是？","o":["表示原因","和、及、與","將語意並排連接"],"a":1,"e":"「佮」佇教材的解說是「和、及、與」；其餘兩項是不同意思，袂當互相替換。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「佮」的用法。"},{"q":"「那……那……」佇這課的意思是？","o":["因此、所以","表示兩種可能之間的取捨","一邊……一邊……"],"a":2,"e":"「那……那……」佇教材的解說是「一邊……一邊……」；其餘兩項是不同意思，袂當互相替換。","h":"比較選項的意思，想看啥一个符合「那……那……」佇課文內底的用法。"},{"q":"「抑是」佇這課的意思是？","o":["或者、或是","接下來","表示原因佮結果"],"a":0,"e":"「抑是」佇教材的解說是「或者、或是」；其餘兩項是不同意思，袂當互相替換。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「因為」佇這課的意思是？","o":["將語意並排連接","表示原因","表示代誌的時間次序"],"a":1,"e":"「因為」佇教材的解說是「表示原因」；其餘兩項是不同意思，袂當互相替換。","h":"先看「因為」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「就按呢」佇這題的意思較接近佗一个？","o":["表示兩種可能之間的取捨","和、及、與","因此、所以"],"a":2,"e":"「就按呢」要連同前後語境理解；本題選項的「因此、所以」僅適用於表達承接結果的用法，建議教材原句再核對。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「就按呢」的用法。"},{"q":"「紲落去」佇這課的意思是？","o":["接下來","表示原因佮結果","一邊……一邊……"],"a":0,"e":"「紲落去」佇教材的解說是「接下來」；其餘兩項是不同意思，袂當互相替換。","h":"比較選項的意思，想看啥一个符合「紲落去」佇課文內底的用法。"},{"q":"「並列」佇這課的意思是？","o":["表示代誌的時間次序","將語意並排連接","或者、或是"],"a":1,"e":"「並列」佇教材的解說是「將語意並排連接」；其餘兩項是不同意思，袂當互相替換。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「選擇」佇這課的意思是？","o":["和、及、與","表示原因","表示兩種可能之間的取捨"],"a":2,"e":"「選擇」佇教材的解說是「表示兩種可能之間的取捨」；其餘兩項是不同意思，袂當互相替換。","h":"先看「選擇」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「因果」佇這課的意思是？","o":["表示原因佮結果","一邊……一邊……","因此、所以"],"a":0,"e":"「因果」佇教材的解說是「表示原因佮結果」；其餘兩項是不同意思，袂當互相替換。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「因果」的用法。"},{"q":"「先後」佇這課的意思是？","o":["或者、或是","表示代誌的時間次序","接下來"],"a":1,"e":"「先後」佇教材的解說是「表示代誌的時間次序」；其餘兩項是不同意思，袂當互相替換。","h":"比較選項的意思，想看啥一个符合「先後」佇課文內底的用法。"}],"context":[{"q":"桌頂有柑仔＿＿王梨。","o":["那……那……","就按呢","佮"],"a":2,"e":"題幹的線索是「桌頂有柑仔（空格）王梨。」；此處要表達「佮」的用法，另外兩項不符合這个情境。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"你欲食飯＿＿食麵？","o":["抑是","因為","並列"],"a":0,"e":"題幹的線索是「你欲食飯（空格）食麵？」；此處要表達「抑是」的用法，另外兩項不符合這个情境。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"伊＿＿唱歌，＿＿跳舞。","o":["那……那……","抑是","因為"],"a":0,"e":"「那……那……」是成對使用的連接形式，兩個空格依序填入「那」；表示同時進行兩個動作。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"＿＿昨昏落雨，塗跤才澹漉漉。","o":["因為","抑是","紲落去"],"a":0,"e":"「因為」帶出原因；後半句「塗跤才澹漉漉」是結果，毋是選擇抑是時間順序。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"伊共塗跤掃掃咧，＿＿坐落來歇睏。","o":["紲落去","抑是","因為"],"a":0,"e":"先掃地，接下來才坐下休息；「紲落去」表示動作的先後順序。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"}],"reading":[{"q":"「佮」佇教材屬於啥物關係？","o":["並列","選擇","因果"],"a":0,"e":"本題問的是「「佮」佇教材屬於啥物關係？」；依教材的分類抑是例句，應選「並列」，另外兩項無符合題目所指的用法。","h":"先分清楚題目問的是事情經過、人物想法，抑是作者的描寫。"},{"q":"「抑是」佇教材屬於啥物關係？","o":["選擇","並列","因果"],"a":0,"e":"本題問的是「「抑是」佇教材屬於啥物關係？」；依教材的分類抑是例句，應選「選擇」，另外兩項無符合題目所指的用法。","h":"想想課文提供啥物線索，答案愛有文本根據，毋通干焦用印象猜。"},{"q":"「因為」佇教材屬於啥物關係？","o":["因果","並列","選擇"],"a":0,"e":"本題問的是「「因為」佇教材屬於啥物關係？」；依教材的分類抑是例句，應選「因果」，另外兩項無符合題目所指的用法。","h":"比較前後段落的變化，留意作者用啥物細節支持這个意思。"},{"q":"「紲落去」佇教材屬於啥物關係？","o":["先後","並列","選擇"],"a":0,"e":"本題問的是「「紲落去」佇教材屬於啥物關係？」；依教材的分類抑是例句，應選「先後」，另外兩項無符合題目所指的用法。","h":"先確認題目問的重點，再回想課文內底對應的情節或句子。"},{"q":"連接詞的功能是？","o":["並列","選擇","連接語詞、短語、句抑是段落，表示語意關係"],"a":2,"e":"本題問的是「連接詞的功能是？」；依教材的分類抑是例句，應選「連接語詞、短語、句抑是段落，表示語意關係」，另外兩項無符合題目所指的用法。","h":"先回想課文相關段落，找出人物、事件佮原因之間的關係。"}],"comprehensive":[{"q":"「我佮阿兄攏愛拍球」主要是啥物關係？","o":["並列","選擇","因果"],"a":0,"e":"本題問的是「「我佮阿兄攏愛拍球」主要是啥物關係？」；依教材的分類抑是例句，應選「並列」，另外兩項無符合題目所指的用法。","h":"把課文的觀念帶入這个情境，想想實際發生時會按怎判斷。"},{"q":"「欲坐火車抑是坐公車？」主要是啥物關係？","o":["選擇","並列","因果"],"a":0,"e":"本題問的是「「欲坐火車抑是坐公車？」主要是啥物關係？」；依教材的分類抑是例句，應選「選擇」，另外兩項無符合題目所指的用法。","h":"毋通只看單一詞語，愛連同人物、原因佮結果做伙考慮。"},{"q":"「因為落雨，活動改期」主要是啥物關係？","o":["因果","並列","選擇"],"a":0,"e":"本題問的是「「因為落雨，活動改期」主要是啥物關係？」；依教材的分類抑是例句，應選「因果」，另外兩項無符合題目所指的用法。","h":"先找出題目欲你判斷的核心，再排除無符合情境的選項。"},{"q":"「食飽飯，紲落去洗碗」主要是啥物關係？","o":["先後","並列","選擇"],"a":0,"e":"本題問的是「「食飽飯，紲落去洗碗」主要是啥物關係？」；依教材的分類抑是例句，應選「先後」，另外兩項無符合題目所指的用法。","h":"想想課文的重點佮這个新情境有啥物關係，再做決定。"},{"q":"欲表示做完第一件代誌「接下來」做第二件，應該用？","o":["紲落去","抑是","佮"],"a":0,"e":"「紲落去」表示先後次序；「抑是」表示選擇，「佮」表示並列。","h":"比較各選項可能造成的結果，揀一項最符合題目條件的。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../index.html'};</script></body></html>
