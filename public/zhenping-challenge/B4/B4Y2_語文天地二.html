te-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../index.html">← 返回整冊</a><span class="pill">📗 真平・第四冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>語文天地二｜連接詞（二）</h1><p>連接詞（二）、語境判斷與生活應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文的意象、情感與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文理解運用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「愈」用佇「愈來愈」的句型，主要表達啥物意思？","o":["還是","愈來愈","才"],"a":1,"e":"「愈……愈……」表示程度隨條件或時間增加；本題選項「愈來愈」是句型提示，毋是單字「愈」的完整詞義。"},{"q":"「毋但」佇這課的意思是？","o":["假如、如果","不論、無論","不只"],"a":2,"e":"「毋但」佇教材的解說是「不只」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「毋過」佇這課的意思是？","o":["不過、但是","即使、就算是","程度逐漸增加抑是遞進"],"a":0,"e":"「毋過」佇教材的解說是「不過、但是」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「猶是」佇這課的意思是？","o":["才","還是","前後語意有轉變"],"a":1,"e":"「猶是」佇教材的解說是「還是」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「假使」佇這課的意思是？","o":["不論、無論","愈來愈","假如、如果"],"a":2,"e":"「假使」佇教材的解說是「假如、如果」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「準做」佇這課的意思是？","o":["即使、就算是","程度逐漸增加抑是遞進","不只"],"a":0,"e":"「準做」佇教材的解說是「即使、就算是」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「毋才」佇這課的例句內底，主要表示啥物意思？","o":["前後語意有轉變","才","不過、但是"],"a":1,"e":"本題暫以原題庫的「才」做答案；「毋才」的實際用法須對照出版社原句確認，無法單靠單詞直接定義。"},{"q":"「毋管」佇這課的意思是？","o":["愈來愈","還是","不論、無論"],"a":2,"e":"「毋管」佇教材的解說是「不論、無論」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「漸進」佇這課的意思是？","o":["程度逐漸增加抑是遞進","不只","假如、如果"],"a":0,"e":"「漸進」佇教材的解說是「程度逐漸增加抑是遞進」；其餘兩項是不同意思，袂當互相替換。"},{"q":"「轉折」佇這課的意思是？","o":["不過、但是","前後語意有轉變","即使、就算是"],"a":1,"e":"「轉折」佇教材的解說是「前後語意有轉變」；其餘兩項是不同意思，袂當互相替換。"}],"context":[{"q":"這領衫真媠，＿＿無合我的意。","o":["愈","假使","毋過"],"a":2,"e":"題幹的線索是「這領衫真媠，（空格）無合我的意。」；此處要表達「毋過」的用法，另外兩項不符合這个情境。"},{"q":"＿＿明仔載落雨，咱就莫出去。","o":["假使","毋過","毋才"],"a":0,"e":"題幹的線索是「（空格）明仔載落雨，咱就莫出去。」；此處要表達「假使」的用法，另外兩項不符合這个情境。"},{"q":"伊＿＿會曉唱歌，閣會曉跳舞。","o":["毋但","毋過","假使"],"a":0,"e":"「毋但……閣……」表達不只會唱歌，還會跳舞，後半句增加一項能力。"},{"q":"準做你無佮意這項菜，嘛毋通隨便擲捔。這句的「準做」是啥物意思？","o":["即使、就算是","不只、而且","不過、但是"],"a":0,"e":"出版社學習單以「準做……嘛……」表示即使如此仍不應做某事；選「即使、就算是」。"},{"q":"＿＿做啥物頭路，攏愛認真。","o":["毋管","轉折","毋過"],"a":0,"e":"題幹的線索是「（空格）做啥物頭路，攏愛認真。」；此處要表達「毋管」的用法，另外兩項不符合這个情境。"}],"reading":[{"q":"「毋過」表示啥物關係？","o":["轉折","漸進","假設"],"a":0,"e":"本題問的是「「毋過」表示啥物關係？」；依教材的分類抑是例句，應選「轉折」，另外兩項無符合題目所指的用法。"},{"q":"「假使」表示啥物關係？","o":["假設","漸進","轉折"],"a":0,"e":"本題問的是「「假使」表示啥物關係？」；依教材的分類抑是例句，應選「假設」，另外兩項無符合題目所指的用法。"},{"q":"「毋管」表示啥物關係？","o":["條件","漸進","轉折"],"a":0,"e":"本題問的是「「毋管」表示啥物關係？」；依教材的分類抑是例句，應選「條件」，另外兩項無符合題目所指的用法。"},{"q":"「毋但」表示啥物關係？","o":["漸進","轉折","假設"],"a":0,"e":"本題問的是「「毋但」表示啥物關係？」；依教材的分類抑是例句，應選「漸進」，另外兩項無符合題目所指的用法。"},{"q":"「準做」佇教材的意思是？","o":["轉折","假設","即使、就算是"],"a":2,"e":"本題問的是「「準做」佇教材的意思是？」；依教材的分類抑是例句，應選「即使、就算是」，另外兩項無符合題目所指的用法。"}],"comprehensive":[{"q":"「這雙鞋真好看，毋過傷大雙」是啥物關係？","o":["轉折","漸進","假設"],"a":0,"e":"本題問的是「「這雙鞋真好看，毋過傷大雙」是啥物關係？」；依教材的分類抑是例句，應選「轉折」，另外兩項無符合題目所指的用法。"},{"q":"「假使落雨，咱就改佇室內」是啥物關係？","o":["假設","漸進","轉折"],"a":0,"e":"本題問的是「「假使落雨，咱就改佇室內」是啥物關係？」；依教材的分類抑是例句，應選「假設」，另外兩項無符合題目所指的用法。"},{"q":"「毋管成功失敗，我攏支持你」是啥物關係？","o":["條件","漸進","轉折"],"a":0,"e":"本題問的是「「毋管成功失敗，我攏支持你」是啥物關係？」；依教材的分類抑是例句，應選「條件」，另外兩項無符合題目所指的用法。"},{"q":"「伊毋但寄錢，閣去做義工」是啥物關係？","o":["漸進","轉折","假設"],"a":0,"e":"本題問的是「「伊毋但寄錢，閣去做義工」是啥物關係？」；依教材的分類抑是例句，應選「漸進」，另外兩項無符合題目所指的用法。"},{"q":"「阿英愈看愈媠」主要表達啥物關係？","o":["漸進","轉折","假設"],"a":0,"e":"「愈……愈……」表示程度逐步增加，屬於漸進，毋是轉折抑是假設。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
