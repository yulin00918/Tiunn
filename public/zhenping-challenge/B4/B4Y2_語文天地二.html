</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第四冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🔗</div><h1>語文天地（二）｜連接詞（二）</h1><p>漸進、轉折、假設、條件</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「愈……愈……」是表示啥物關係？","o":["漸進","轉折","假設","條件"],"a":0,"e":"愈來愈：漸進關係。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「毋但」是表示啥物關係？","o":["漸進","轉折","假設","條件"],"a":0,"e":"毋但：不只。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「毋過」是表示啥物關係？","o":["轉折","漸進","假設","條件"],"a":0,"e":"毋過：不過、但是。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「猶是」是表示啥物關係？","o":["轉折","漸進","假設","條件"],"a":0,"e":"猶是：還是。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「假使」是表示啥物關係？","o":["假設","轉折","漸進","條件"],"a":0,"e":"假使：假如、如果。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「準做」的華語是？","o":["即使、就算","準備","當做","準確"],"a":0,"e":"準做：即使、就算是。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「毋才」的華語是？","o":["才","不才","不然","不是"],"a":0,"e":"毋才：才。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「毋管」是表示啥物關係？","o":["條件","假設","漸進","轉折"],"a":0,"e":"毋管：不論、無論。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「何況」是表示啥物關係？","o":["漸進","轉折","假設","條件"],"a":0,"e":"何況：更進一步。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「＿＿你暗頓莫食傷濟，這馬就袂腹肚疼。」空格揀佗一个？","o":["假使","而且","何況","毋管"],"a":0,"e":"假設關係。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊想想咧，＿＿決定欲行路去圖書館。」空格揀佗一个？","o":["猶是","準做","若無","而且"],"a":0,"e":"轉折：還是決定走路。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊＿＿愛唱歌，閣愛看冊。」空格揀佗一个？","o":["毋但","抑是","所以","毋才"],"a":0,"e":"漸進：不只……還……","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這雙鞋仔真好看，＿＿傷大雙。」空格揀佗一个？","o":["毋過","毋但","毋管","準做"],"a":0,"e":"轉折：但是太大。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「因為阮真關心你，＿＿會共你苦勸。」空格揀佗一个？","o":["毋才","毋過","準做","猶是"],"a":0,"e":"條件：才會勸你。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「＿＿失敗抑是成功，你攏是我的好朋友。」空格揀佗一个？","o":["毋管","毋但","猶是","毋過"],"a":0,"e":"不論成敗。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿爸＿＿真𠢕煮食，閣會曉做果子醬。」空格揀佗一个？","o":["毋但","毋管","準做","毋才"],"a":0,"e":"不但……還……","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「天色已經暗矣，你＿＿較早轉去。」空格揀佗一个？","o":["猶是","毋但","準做","毋管"],"a":0,"e":"你還是早點回去。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「＿＿你已經提著冠軍矣，嘛袂當驕傲。」空格揀佗一个？","o":["準做","毋過","毋才","毋但"],"a":0,"e":"即使得冠軍也不能驕傲。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這塊石頭大人都捒袂振動，＿＿是一个囡仔。」空格揀佗一个？","o":["何況","而且","毋過","毋管"],"a":0,"e":"大人推不動，更何況小孩。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"「準做你無佮意，嘛免共人嫌甲按呢。」意思是？","o":["就算你無佮意，嘛毋免按呢嫌人","因為你無佮意，所以愛嫌","你若佮意就嫌","你一定愛佮意"],"a":0,"e":"準做：即使。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「雖然風颱已經轉向矣，毋過也愛預防做大水。」是啥物關係？","o":["轉折","漸進","假設","條件"],"a":0,"e":"雖然……毋過……","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「早若知我就莫來矣。」的「若」是啥物關係？","o":["假設","轉折","漸進","條件"],"a":0,"e":"若：如果。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「無論查某囝欲買啥，做老爸攏會答應。」是啥物關係？","o":["條件","轉折","漸進","假設"],"a":0,"e":"無論……攏……","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"塌空：「阿美＿＿放學時唱，洗身軀的時嘛唱袂停。」空格揀佗一个？","o":["毋但","猶是","假使","毋管"],"a":0,"e":"不但放學唱，洗澡也唱。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"塌空：「＿＿你想欲學唱歌，阿母替你報名歌唱班。」空格揀佗一个？","o":["假使","毋但","猶是","毋過"],"a":0,"e":"如果你想學。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"「兄弟若仝心，烏塗變成金」是啥物意思？","o":["兄弟同心，其利斷金","塗會變金仔","兄弟愛分家伙","做穡真好趁"],"a":0,"e":"團結就有力量。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「少年若無一擺戇，路邊哪有有應公」勸人啥物？","o":["莫逞血氣之勇","少年愛戇一擺","愛去拜有應公","路邊真危險"],"a":0,"e":"勸誡人勿逞血氣之勇。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「蠓仔叮牛角——＿＿」","o":["無彩工","無話講","規腹肚火","趣味"],"a":0,"e":"蚊子叮牛角白費力氣。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「啞口予蜂叮——＿＿」","o":["無話講","無彩工","規腹肚火","家己大"],"a":0,"e":"有口難言。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"下面佗一句連接詞用了上適當？","o":["伊毋管落雨抑好天，攏騎跤踏車上班","伊毋但落雨，所以騎跤踏車","伊準做好天，因為騎車","伊毋才落雨，毋過騎車"],"a":0,"e":"毋管……攏……","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「爸母按怎擋，伊猶是聽袂入耳；伊耍手機仔，目睭變甲＿＿䆀。」空格揀佗一个？","o":["愈來愈","毋但","準做","毋才"],"a":0,"e":"漸進：愈來愈差。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
