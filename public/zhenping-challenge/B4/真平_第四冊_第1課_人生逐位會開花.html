</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第四冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🌻</div><h1>第1課｜人生逐位會開花</h1><p>希望、理想佮堅持的人生態度</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「逐位」較接近啥物意思？","o":["處處、到處","每一个人","追位","逐家"],"a":0,"e":"逐位：處處、到處、每處。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「悲哀」較接近啥物意思？","o":["悲傷、哀痛","歡喜","受氣","驚惶"],"a":0,"e":"悲哀：悲傷、哀痛。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「宛然」較接近啥物意思？","o":["好像、儼然","當然","突然","果然"],"a":0,"e":"宛然：好像。近義詞：若像、親像。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「相揣」較接近啥物意思？","o":["聯絡、互訪","相拍","相欠","相輸"],"a":0,"e":"相揣：聯絡、互訪；詩中延伸為互相融合。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「一葩燈火」的「葩」是計算啥物的單位？","o":["燈火（盞）","花蕊","樹仔","人"],"a":0,"e":"葩：盞，計算燈火的單位；也可算成串物品，如兩葩葡萄。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「燈火若化」的「化」是啥物意思？","o":["燈火熄去","燈火變色","燈火變大","燈火點著"],"a":0,"e":"化：燈或火熄滅。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「若無理想賰半寸」的「賰」是啥物意思？","o":["剩落來","增加","存錢","伸長"],"a":0,"e":"賰：剩餘、剩下。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「世路」較接近啥物意思？","o":["人世間的路","世界地圖","大路","世代"],"a":0,"e":"世路：人世間的道路。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「苦苦」佇課文是啥物意思？","o":["悲切的、痛苦的","有淡薄仔苦味","真苦的藥","真艱苦做工"],"a":0,"e":"毋免苦苦貪戀一切：不必痛苦地執著。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「照百丈」的「丈」是啥物？","o":["計算長度的單位","丈夫","姑丈","一丈紅"],"a":0,"e":"丈：長度單位，此處比喻廣闊區域。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「咱臺灣＿＿攏真有人情味。」空格揀佗一个？","o":["逐位","悲哀","宛然","相揣"],"a":0,"e":"到處都很有人情味。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「比賽無著等免＿＿，只要努力，總有成功的一工。」空格揀佗一个？","o":["悲哀","逐位","相揣","宛然"],"a":0,"e":"不用悲傷。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊笑起來＿＿一蕊花。」空格揀佗一个？","o":["宛然","悲哀","相揣","逐位"],"a":0,"e":"好像一朵花。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「親情五十平時著愛＿＿，有來有去，按呢才會親。」空格揀佗一个？","o":["相揣","宛然","悲哀","賰"],"a":0,"e":"平時要常聯絡。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「天生萬物攏有伊存在的價值。」用佗一句俗諺？","o":["荏荏馬嘛有一步踢","食緊挵破碗","烏矸仔貯豆油","甘蔗無雙頭甜"],"a":0,"e":"再虛弱的馬也會踢人，每个人攏有價值。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"提醒咱毋通看輕家己抑是別人，天無絕人之路。是佗一句俗諺？","o":["一枝草，一點露","食緊挵破碗","徛懸山，看馬相踢","甘蔗無雙頭甜"],"a":0,"e":"有草就有露水。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"鼓勵人毋免驚失敗佮困難，是佗一句俗諺？","o":["拍斷手骨顛倒勇","食緊挵破碗","徛懸山，看馬相踢","烏矸仔貯豆油"],"a":0,"e":"骨頭斷過反而更強壯。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「若干焦會講，攏無行動，代誌就袂完成。」是佗一句俗諺？","o":["路無行袂到，事無做袂成","一枝草，一點露","荏荏馬嘛有一步踢","拍斷手骨顛倒勇"],"a":0,"e":"要實際行動才會成功。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「＿＿管待人按怎講，＿＿咱對會起家己的良心就好。」照句型，空格揀佗一組？","o":["毋免……只要……","毋但……閣……","雖然……毋過……","便若……就……"],"a":0,"e":"「毋免……只要……」選擇複句。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「天頂一粒火球，有伊強欲熱死，無伊險險寒死。」臆自然現象：","o":["日頭","月娘","火星","雷公"],"a":0,"e":"答案：日頭。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「長若弓，圓若斗，欲來初三、四，欲走二八、九。」臆自然現象：","o":["月娘","日頭","天星","彩虹"],"a":0,"e":"月亮有圓有缺。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"「一葩燈火有偌光？點佇暗夜照百丈」，意思上接近？","o":["一點仔希望，就會當照光烏暗的人生","燈火真貴","暗時愛點燈","燈火無路用"],"a":0,"e":"小小的希望就能讓低谷中的人有所期待。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「燈火若化免悲哀，總有天光日頭來」，咧講啥物？","o":["一時失意免傷心，堅持就會等著好日","燈火化去就愛悲哀","日頭較光","暗時毋通出門"],"a":0,"e":"柳暗花明又一村。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者認為啥物情形下，人的性命會賰半寸？","o":["人若無理想抑是目標","人若傷老","人若破病","人若無錢"],"a":0,"e":"性命閣較長，若無理想嘛失去意義。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「理想藏佇烏暗內，宛然暗夜的等待」，意思較接近？","o":["實現理想愛經過真長的磨練佮等待","理想傷大無法度實現","感覺孤單無伴","暗時較好讀冊"],"a":0,"e":"實踐理想如在黑夜中等天明。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「白雲飄散、江水流東」咧表達啥物？","o":["天地萬物無常，好歹攏袂永遠","天氣真好","江水真清","愛去坐船"],"a":0,"e":"沒有恆常不變的好與不好。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"詩的最後講「只要世路家己行過，人生逐位攏會開花」，意思是？","o":["親身行過、堅持落去，人生處處有收成","愛去種花","行路會開花","愛聽別人的話"],"a":0,"e":"一時失志無要緊，只要堅持。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈人生逐位會開花〉的作者是啥人？","o":["路寒袖","楊斯棓","張逸嫻","周蘇宗"],"a":0,"e":"路寒袖，曾得金曲獎最佳作詞。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"這首詩是啥物文體？","o":["現代詩","七字仔","書信","遊記"],"a":0,"e":"第一課是路寒袖的現代詩。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"「天光」的「天」讀 thinn，「天篷」的「天」讀啥？","o":["thian","thinn","tian","thiann"],"a":0,"e":"一字多音：天光 thinn-kng、天篷 thian-pông。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「社會真烏暗」的「烏暗」是啥物意思？","o":["風氣敗壞、無公理","天色暗","電火無光","衫的色水"],"a":0,"e":"一詞多義：烏暗也比喻社會風氣敗壞。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"下面佗一句俗諺上符合本課的主題？","o":["艱苦頭，快活尾","食緊挵破碗","徛懸山，看馬相踢","烏矸仔貯豆油"],"a":0,"e":"先苦後樂，鼓勵堅持。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"同學比賽輸去，講「可能我無彼个才調」，你上適合按怎鼓勵伊？","o":["一時失志無要緊，繼續拍拚總會開花","你確實無才調","莫閣練矣","怨天怨地"],"a":0,"e":"本課精神：保持積極的信念。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"愛因斯坦細漢讀冊予人看無目地，後來成做大科學家，說明啥物？","o":["一時的挫折袂決定一世人","讀冊無路用","細漢愛會曉講話","老師攏毋著"],"a":0,"e":"名人勵志故事。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「毋免苦苦貪戀一切」的「苦苦」，佮「茶苦苦，啉袂落去」的「苦苦」，有啥物無仝？","o":["前者是痛苦悲切，後者是有苦味","攏是苦味","攏是痛苦","攏無意思"],"a":0,"e":"一詞多義。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
