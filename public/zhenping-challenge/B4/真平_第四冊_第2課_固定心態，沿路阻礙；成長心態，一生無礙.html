</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第四冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🌱</div><h1>第2課｜固定心態，沿路阻礙；成長心態，一生無礙</h1><p>成長心態、俗諺佮自我肯定</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「展」佇「目睭展甲真大蕊」是啥物意思？","o":["打開、展開","展覽","展風神","伸長"],"a":0,"e":"展：展開、打開。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「親堂」是啥物？","o":["仝宗但毋是親兄弟的親情","親兄弟","厝邊","老師"],"a":0,"e":"親堂：同宗但非嫡親的親戚。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「盹龜」較接近啥物意思？","o":["啄龜、打瞌睡","抓烏龜","睏甲真熟","龜咧趖"],"a":0,"e":"盹龜：打瞌睡。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「參」佇「你參伊去」是啥物意思？","o":["和、跟","參加","人參","參考"],"a":0,"e":"參：和、跟、一起。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「踏話頭」較接近啥物意思？","o":["開始的引言","踏著人的話","講結論","話講傷濟"],"a":0,"e":"踏話頭：開場白、引言。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「忝忝」佇課文是啥物意思？","o":["慘重","真忝","無要緊","較贏"],"a":0,"e":"輸甲忝忝：輸得很慘。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「膽寒」較接近啥物意思？","o":["驚惶、畏懼","膽真大","寒天","感冒"],"a":0,"e":"膽寒：害怕、畏懼。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「淹跤目」的「跤目」是啥物？","o":["跤盤目，腳踝","跤指頭","跤頭趺","跤底"],"a":0,"e":"跤目：腳踝；錢濟甲淹跤目＝錢多得淹到腳踝。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「一步一跤印」比喻啥物？","o":["腳踏實地、按部就班","行路真慢","跤印真深","一直踏人"],"a":0,"e":"一步一跤印：行事按部就班。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「荏」佇「身體變甲足荏」是啥物意思？","o":["虛弱、無勇","真勇","真肥","真懸"],"a":0,"e":"荏：不紮實、虛弱、疲累。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「一生一路春風」的「春風」形容啥物？","o":["人得意的神情","春天的風","風颱","冷風"],"a":0,"e":"春風：形容一個人得意。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「食頭路，目睭就愛＿＿予金，自動去做。」空格揀佗一个？","o":["展","參","荏","盹"],"a":0,"e":"睜大眼留意。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「你＿＿伊做伙去辦公廳幫我提物件。」空格揀佗一个？","o":["參","展","忝","荏"],"a":0,"e":"你跟他一起去。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這場比賽伊輸甲真＿＿！」空格揀佗一个？","o":["忝","荏","展","參"],"a":0,"e":"輸得很慘。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「自從破病以後，身體就變甲足＿＿，𬦰樓梯攏會喘。」空格揀佗一个？","o":["荏","忝","展","參"],"a":0,"e":"身體虛弱。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「無論畫圖、唱歌、煮食、拍球，攏會當行出一片天。」用佗一句俗諺？","o":["戇的也有一項會","雞屎落塗，也有三寸煙","食緊挵破碗","甘蔗無雙頭甜"],"a":0,"e":"再笨的人也有一項才能。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「你毋通看輕你家己，只要有志氣肯拍拚，將來一定會成功。」用佗一句俗諺？","o":["雞屎落塗，也有三寸煙","戇的也有一項會","一枝草，一點露","千算萬算，毋值天一劃"],"a":0,"e":"比喻再沒用的人也有一點作用。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「＿＿失敗足濟擺，伊嘛毋願放棄。」照句型，空格揀佗一个？","o":["就算","因為","便若","抑是"],"a":0,"e":"「就算……嘛……」讓步句型。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「考伊袂倒」是倒裝句型，下面佗一个仝款？","o":["拍伊袂著","伊考袂倒","伊袂考倒","考袂倒伊"],"a":0,"e":"食伊袂倒、拍伊袂著，倒裝以強調「他」。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊驚甲徛定定毋敢烏白振動」的「定定」是啥物意思？","o":["靜止毋振動","常常","一定","穩定"],"a":0,"e":"一詞多義：定定也可指常常。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿母今仔日人咧艱苦」的「艱苦」是啥物意思？","o":["人無爽快","艱難","辛苦工作","真散赤"],"a":0,"e":"一詞多義：艱苦也可指生病不舒服。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"課文講 1922 年成立的五間學校，下面佗一間毋是？","o":["臺中一中","高雄中學","臺南一中","新竹中學"],"a":0,"e":"作者的母校臺中一中比這五間更早成立。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"臺中一中是靠啥物人出力成立的？","o":["林獻堂等臺灣仕紳","日本政府","外國傳教士","學生家長會"],"a":0,"e":"林獻堂、林烈堂、辜顯榮、蔡蓮舫、林熊徵。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"大多數考試考懸分的人，是因為？","o":["有好的讀冊習慣，共食苦當做食補","天生就巧","上課盹龜","下課攏咧運動"],"a":0,"e":"甘願減少𨑨迌的時間把書讀熟。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者用問句「考懸分的人，敢講就一生一路春風？」，是欲表達？","o":["考懸分的人無一定一生順利","考懸分的人一定成功","考試無重要","愛去讀名校"],"a":0,"e":"用疑問法表示不一定。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「固定心態」的學生會按怎想？","o":["家己無夠巧，閣較拚嘛無效","只要拍拚就會進步","一枝草一點露","荏荏馬嘛有一步踢"],"a":0,"e":"所以就失志過日子。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"下面佗一句「毋是」課文用來說明「成長心態」的俗諺？","o":["食緊挵破碗","荏荏馬嘛有一步踢","一枝草，一點露","一時失志毋免怨嘆，一時落魄毋免膽寒"],"a":0,"e":"前三句都是成長心態的觀念。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者的好朋友這馬按怎？","o":["佇 101 大樓有辦公廳，是成功的企業家","佇臺中一中做老師","考著醫生","去國外讀冊"],"a":0,"e":"一步一跤印，這馬已經成功。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者紹介的冊《心態致勝》，講人有佗兩種心態？","o":["固定心態佮成長心態","好心態佮歹心態","樂觀佮悲觀","大人佮囡仔"],"a":0,"e":"一種固定心態，一種成長心態。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"本課作者楊斯棓本身是做啥物的？","o":["醫生、演講者、作家","國中老師","歌手","攝影家"],"a":0,"e":"伊有真濟身份。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「固定心態，沿路阻礙；成長心態，一生無礙」，意思上接近？","o":["心態決定你會當行偌遠","有成長心態就袂失敗","固定心態較好","人生攏無阻礙"],"a":0,"e":"不是不會失敗，而是能克服阻礙。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"阿芬講：「我本來就無夠巧，按怎骨力嘛無路用。」是啥物心態？","o":["固定心態","成長心態","樂觀心態","好奇心態"],"a":0,"e":"認為能力無法改變。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"阿宏講：「只要我逐工練習投籃，以後一定會愈投愈準。」是啥物心態？","o":["成長心態","固定心態","悲觀心態","比較心態"],"a":0,"e":"相信努力會進步。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「算數」的「數」讀 siàu，「禮數」的「數」讀啥？","o":["sòo","siàu","su","sóo"],"a":0,"e":"一字多音：禮數 lé-sòo。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「艱苦」的反義詞是佗一个？","o":["快活","辛苦","忝","荏"],"a":0,"e":"反義詞：快活、輕鬆。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"J．K．羅琳失業閣予出版社拒絕，最後寫出《哈利波特》，說明啥物？","o":["毋放棄，堅持就有機會","寫冊真好趁","出版社攏毋著","失業較好"],"a":0,"e":"心態決定未來。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"考試考了無好，下面佗一个想法上符合成長心態？","o":["揣出毋著的所在，下擺閣拚","我就是戇，莫讀矣","攏是題目傷難","抄別人的就好"],"a":0,"e":"從失敗中學習。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
