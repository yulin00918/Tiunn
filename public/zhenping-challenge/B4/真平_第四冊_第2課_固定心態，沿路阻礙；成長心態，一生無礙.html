<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>固定心態，沿路阻礙；成長心態，一生無礙｜真平第四冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../index.html">← 返回整冊</a><span class="pill">📗 真平・第四冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第2課｜固定心態，沿路阻礙；成長心態，一生無礙</h1><p>固定心態、成長心態與面對挫折</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解文章論證與成長心態。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文觀點運用佇學習與生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「盹龜」佇課文是啥物意思？","o":["打瞌睡","真認真聽課","練習跑步"],"a":0,"e":"課文說有學生上課盹龜，指打瞌睡。"},{"q":"「展」佇「目睭展甲真大蕊」是指？","o":["睜開","閉起來","遮起來"],"a":0,"e":"教材語詞解釋展是展開、打開。"},{"q":"「參」佇「參考懸分的學生拚輸贏」是指？","o":["和、跟","比以前","離開"],"a":0,"e":"教材語詞解釋參是和、跟。"},{"q":"「忝」佇「輸彼種提懸分的學生忝忝」是指？","o":["差真濟","完全仝款","贏真濟"],"a":0,"e":"「輸……忝忝」在這段比較成績的語境，表示差距很大；理解時要連同前後比較對象一起看。"},{"q":"「荏」佇「荏荏馬嘛有一步踢」是指？","o":["較弱、無夠勇健","真強壯","真神氣"],"a":0,"e":"俗諺用荏荏馬說明看似弱小也有能力。"},{"q":"「踏話頭」是指？","o":["開頭提起話題","做伙行路","突然停止講話"],"a":0,"e":"作者用建校歷史做演講開場。"},{"q":"「一路春風」佇文章是形容？","o":["人生一路順利","逐工攏落雨","風一直吹"],"a":0,"e":"作者反問高分的人是否一生都順利。"},{"q":"「一枝草，一點露」強調啥物？","o":["毋通因為眼前成績就看輕一个人","每个人免學習就會自然成功","只要有天分就一定有好成績"],"a":0,"e":"文章引用「一枝草，一點露」，提醒每個人都有自己的機會與可能性，不應以一時分數否定他人。"},{"q":"「一步一跤印」是指？","o":["踏實、一步一步努力","一下就成功","完全無練習"],"a":0,"e":"作者用一步一跤印形容朋友持續努力。"},{"q":"「失志」佇文章是指？","o":["灰心喪志","真歡喜","真驕傲"],"a":0,"e":"固定心態者可能因認為無法進步而失志。"}],"context":[{"q":"雖然這擺考試無理想，伊猶原欲練習，真正是＿＿。","o":["有成長心態","有固定心態","完全放棄"],"a":0,"e":"相信能透過練習改進，是成長心態。"},{"q":"阿弟講「我天生就袂曉數學，學嘛無效」，這較接近＿＿。","o":["固定心態","成長心態","有計畫的練習"],"a":0,"e":"把能力看成無法改變，是固定心態。"},{"q":"老師講「做代誌愛＿＿，慢慢仔進步」。","o":["一步一跤印","盹龜","失志"],"a":0,"e":"一步一跤印形容踏實努力。"},{"q":"比賽輸矣，伊決定揣出問題閣練習，符合「＿＿」。","o":["一時失志毋免怨嘆","閣較拚嘛無效","失敗就無機會"],"a":0,"e":"課文強調挫折後仍可繼續努力。"},{"q":"就算拄開始袂曉用新工具，咱＿＿會當請教別人。","o":["嘛","抑是","毋過"],"a":0,"e":"「就算……嘛……」表達即使遇著困難，仍然會當請教別人。"}],"reading":[{"q":"作者一開始紹介五間百年學校，是欲做啥物？","o":["先以學校歷史引入後續的學生與成績討論","說明五間學校的課表完全相同","主張創校愈早就一定愈好"],"a":0,"e":"文章先列出五間 1922 年成立的學校，再提及作者母校及校內學生表現，作為後續討論成績與心態的鋪陳。"},{"q":"作者認為多數考懸分的學生有啥物共同點？","o":["有好的讀冊習慣，願意付出時間","攏毋免練習","攏上課盹龜"],"a":0,"e":"課文指出多數高分來自習慣與努力。"},{"q":"作者為啥物問「考懸分的人，敢講就一生一路春風？」","o":["提醒成績無法決定一世人的成就","主張成績完全無用","要求所有學校關門"],"a":0,"e":"反問強調分數與人生結果不能畫等號。"},{"q":"固定心態的學生可能按怎看家己？","o":["認為能力固定，閣較拚嘛無效","相信練習會進步","願意修正方法"],"a":0,"e":"課文描寫固定心態容易讓人放棄。"},{"q":"作者的朋友最後成功，文章特別強調啥物？","o":["有成長心態，閣一步一跤印","完全無遇過困難","干焦靠考試分數"],"a":0,"e":"這題應回到課文所述朋友的經歷，留意作者如何描寫其努力與轉變；不能僅以「成功」反推任何人努力就必定成功。"}],"comprehensive":[{"q":"學生考試失敗，佗一个回應較有成長心態？","o":["檢查錯誤，調整讀冊方法閣試看覓","我天生無夠巧，無救矣","反正努力攏無效"],"a":0,"e":"成長心態重視策略與練習。"},{"q":"「成長心態」敢代表一定袂失敗？","o":["毋是，會當對失敗學習佮調整","是，成長心態的人攏袂遇著困難","是，干焦保持樂觀就毋免練習"],"a":0,"e":"成長心態不是保證成功或永不失敗，而是相信能力能透過學習、策略與調整逐步改善。"},{"q":"有同學成績較低，佗一个態度較符合課文？","o":["肯定伊的長處，支持伊揣適合的學習方法","認定伊一世人攏無機會","叫伊放棄所有興趣"],"a":0,"e":"課文反對用一次成績決定人的未來。"},{"q":"想欲實踐「就算……嘛……」，佗句較適當？","o":["就算這擺失敗，嘛會當修正方法繼續練習","就算失敗，所以無愛試","就算努力，就一定第一名"],"a":0,"e":"句型與課文精神都強調面對困難仍持續努力。"},{"q":"欲設計一張「成長心態」班級海報，佗个標語較適當？","o":["能力會當透過練習佮反思逐步進步","天生袂曉就永遠袂曉","成功干焦看運氣"],"a":0,"e":"成長心態強調學習、策略與持續調整。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
