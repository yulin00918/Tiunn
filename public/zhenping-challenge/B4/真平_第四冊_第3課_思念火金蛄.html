te-columns:1fr}.q{font-size:23px}}</style><meta name="author" content="張鈺聆">

</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第四冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第3課｜思念火金蛄</h1><p>課文語詞、詩文理解與生活應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文的意象、情感與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文理解運用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「火金蛄」是啥物？","o":["螢火蟲","蝴蝶","蜻蜓"],"a":0,"e":"「火金蛄」在這題指的是「螢火蟲」。課文以火金蛄為觀察主角。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「火金蛄」的用法。"},{"q":"「走揣」是指？","o":["尋找","丟掉","逃避"],"a":0,"e":"活動名稱是走揣火金蛄。","h":"比較選項的意思，想看啥一个符合「走揣」佇課文內底的用法。"},{"q":"「當大開」是指花按怎？","o":["開甲真茂盛","攏無開","已經凋謝"],"a":0,"e":"四月油桐花當大開。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「一空掠雙隻」是指？","o":["同一趟行程有兩種收穫","一次活動只會看著一種風景","兩个人做伙去旅行"],"a":0,"e":"課文寫白天欣賞油桐花、晚上觀察火金蛄，故用「一空掠雙隻」形容一舉兩得。","h":"先看「一空掠雙隻」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「趁著矣」佇這段較接近？","o":["真划算、真有收穫","時間袂赴","真失望"],"a":0,"e":"兩種景致攏會當欣賞。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「趁著矣」的用法。"},{"q":"「敢若」是指？","o":["親像","一定","無可能"],"a":0,"e":"桐花落甲敢若落雪。","h":"比較選項的意思，想看啥一个符合「敢若」佇課文內底的用法。"},{"q":"「毋甘」是指？","o":["看著落花捨不得共踏著","看著落花真想共掃掉","看著落花感覺無趣味"],"a":0,"e":"「彼油桐花真媠，真毋甘共踏著」說的是作者珍惜落花，不忍心踩踏。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「心適」是指？","o":["有趣、歡喜","煩惱","恐驚"],"a":0,"e":"閃來跳去真心適。","h":"先看「心適」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「閃爍」是指？","o":["光忽明忽暗","完全無光","直直固定"],"a":0,"e":"火金蛄的光會閃爍。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「閃爍」的用法。"},{"q":"「規家伙仔」是指？","o":["全家人","只有一人","全班同學"],"a":0,"e":"作者規家伙仔參加賞螢活動。","h":"比較選項的意思，想看啥一个符合「規家伙仔」佇課文內底的用法。"}],"context":[{"q":"四月油桐花＿＿，山頂真媠。","o":["當大開","攏無開","全部結冰"],"a":0,"e":"當大開表示盛開。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"暗時逐家去樹林＿＿火金蛄。","o":["走揣","收衫","洗碗"],"a":0,"e":"走揣是尋找。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"桐花落甲規塗跤，＿＿咧落雪。","o":["敢若","因為","毋通"],"a":0,"e":"敢若表示好像。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"看著地頂的桐花，伊真＿＿共踏著。","o":["毋甘","歡喜","急欲"],"a":0,"e":"毋甘是捨不得。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"白天賞花、暗時賞螢，真正「＿＿」。","o":["一空掠雙隻","一粒米百粒汗","有頭有尾"],"a":0,"e":"同一趟旅程得到兩種體驗。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"}],"reading":[{"q":"作者參加「走揣火金蛄」活動的原因之一是？","o":["對火金蛄暗時發光感覺好奇","想欲買新手機","欲看布袋戲"],"a":0,"e":"開頭說作者一直對發光現象好奇。","h":"先分清楚題目問的是事情經過、人物想法，抑是作者的描寫。"},{"q":"作者為啥物講「一空掠雙隻」？","o":["同一趟行程白天賞花、暗時賞螢","同一工去兩間無仝的學校","同時學會兩種交通工具"],"a":0,"e":"課文先說四月白天能賞油桐花、晚上能看火金蛄，因此說「一空掠雙隻」，不是字面上的捕捉動物。","h":"想想課文提供啥物線索，答案愛有文本根據，毋通干焦用印象猜。"},{"q":"作者看到油桐花落滿地時想到啥物？","o":["敢若咧落雪","敢若落石","敢若起火"],"a":0,"e":"課文把桐花比作雪。","h":"比較前後段落的變化，留意作者用啥物細節支持這个意思。"},{"q":"為啥物作者閃來閃去、跳來跳去？","o":["毋甘踏著地頂的油桐花","因為鞋仔破去","因為落大雨"],"a":0,"e":"作者珍惜落花，避免踩踏。","h":"先確認題目問的重點，再回想課文內底對應的情節或句子。"},{"q":"這篇遊記主要結合啥物？","o":["旅行經驗、自然景色佮情感","金融商品介紹","科技設備操作"],"a":0,"e":"課文記錄賞花與賞螢的經驗。","h":"先回想課文相關段落，找出人物、事件佮原因之間的關係。"}],"comprehensive":[{"q":"參加賞螢活動，佗个行為較有利生態？","o":["照導覽規範保持距離，減少光線干擾","為著看清楚一直用強光照射","將火金蛄掠轉去觀察"],"a":0,"e":"這是從遊記延伸的生態行動題，非課文逐字答案；友善觀察應減少照明干擾，並避免捕捉或破壞棲地。","h":"把課文的觀念帶入這个情境，想想實際發生時會按怎判斷。"},{"q":"欲用譬喻描寫落地的桐花，佗句較貼近課文？","o":["白花落滿地，敢若落雪","桐花親像一台車","桐花親像一張考卷"],"a":0,"e":"課文把白色落花比喻雪。","h":"毋通只看單一詞語，愛連同人物、原因佮結果做伙考慮。"},{"q":"若欲記錄賞螢經驗，佗个資料較適當？","o":["觀察時間、環境佮火金蛄的活動","只記商店折扣","只記別人的考試分數"],"a":0,"e":"記錄環境與觀察有助理解生態。","h":"先找出題目欲你判斷的核心，再排除無符合情境的選項。"},{"q":"有人欲為著翕相共火金蛄掠起來，較適當的建議是？","o":["留佇原本棲地，保持距離觀察","直接帶轉厝","用手電筒直直照"],"a":0,"e":"這是課文延伸的保育情境：欣賞與記錄可以在不捕捉的情況下進行，避免傷害火金蛄與棲地。","h":"想想課文的重點佮這个新情境有啥物關係，再做決定。"},{"q":"這課最適合設計啥物延伸活動？","o":["規畫友善賞螢守則佮觀察紀錄","只練習商業廣告","完全無討論環境"],"a":0,"e":"把遊記理解延伸到生態保護。","h":"比較各選項可能造成的結果，揀一項最符合題目條件的。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
