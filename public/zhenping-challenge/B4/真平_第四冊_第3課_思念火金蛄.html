</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第四冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">✨</div><h1>第3課｜思念火金蛄</h1><p>火金蛄生態、保育佮遊記</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「走揣」較接近啥物意思？","o":["四界揣","走閃","走標","揣頭路"],"a":0,"e":"走揣：到處尋找。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「心適」較接近啥物意思？","o":["有趣、快樂","心肝合適","適合","小心"],"a":0,"e":"心適：有趣，也可代表愉快。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「食暗」較接近啥物意思？","o":["食暗頓","暗暗仔食","食夜市","食宵夜"],"a":0,"e":"食暗：吃晚餐。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「影跡」較接近啥物意思？","o":["蹤跡","影片","影子","跡象"],"a":0,"e":"影跡：蹤跡、行跡。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「鼓仔燈」是啥物？","o":["燈籠","鼓仔","電火球","手電筒"],"a":0,"e":"鼓仔燈：燈籠。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「冗早」較接近啥物意思？","o":["趁早、提早","真晏","閒閒","早頓"],"a":0,"e":"冗早：趁早、及早。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「下昏暗」較接近啥物意思？","o":["今仔暗","昨暗","下晡","明仔暗"],"a":0,"e":"下昏暗：今晚，合音念作 ing-àm。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「損蕩」較接近啥物意思？","o":["受破壞、損害","浪費","搖擺","蕩秋韆"],"a":0,"e":"環境受損蕩：環境被破壞。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「憢疑」較接近啥物意思？","o":["懷疑","相信","驚惶","好奇"],"a":0,"e":"憢疑：懷疑。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「颺颺飛」較接近啥物意思？","o":["四界飛、成群飛","飛袂起來","直直飛","慢慢飛"],"a":0,"e":"颺颺飛：螢火蟲成群飛舞。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「當大開」的「當」是啥物意思？","o":["正值、正當","應當","當做","典當"],"a":0,"e":"當：正值、正逢。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「伊一直咧＿＿失去聯絡的好朋友。」空格揀佗一个？","o":["走揣","食暗","冗早","憢疑"],"a":0,"e":"一直在找。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這件代誌有夠＿＿。」空格揀佗一个？","o":["心適","影跡","損蕩","冗早"],"a":0,"e":"很有趣。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊一下出門，隨走甲無看著＿＿。」空格揀佗一个？","o":["影跡","鼓仔燈","心適","食暗"],"a":0,"e":"看不到蹤跡。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「元宵節彼工，有五花十色的＿＿。」空格揀佗一个？","o":["鼓仔燈","影跡","冗早","火金蛄"],"a":0,"e":"元宵節燈籠。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「你愛＿＿去排隊，若無就買袂著矣。」空格揀佗一个？","o":["冗早","食暗","心適","憢疑"],"a":0,"e":"提早去。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「你無聲無說＿＿對後壁共我搭肩胛頭，是欲驚死人喔！」空格揀佗一个？","o":["雄雄","冗早","眠夢","有夠"],"a":0,"e":"突然。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「起厝動千工，拆厝一陣風」提醒咱啥物？","o":["建設真困難，破壞真簡單，愛寶惜","起厝真緊","風颱真恐怖","拆厝愛請人"],"a":0,"e":"愛護生態環境。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「暝時暗眠摸，有伊來炤路，攑著鼓仔燈，好心將阮顧。」臆一種蟲：","o":["火金蛄","蠓仔","胡蠅","尾蝶仔"],"a":0,"e":"答案：火金蛄。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「鴨咪仔吞火金蛄——＿＿」","o":["規腹肚火","無話講","無彩工","趣味"],"a":0,"e":"比喻非常生氣。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊上課直直咧盹龜，＿＿是三暝三日無睏。」照句型，空格揀佗一个？","o":["袂輸","毋但","抑是","雖然"],"a":0,"e":"袂輸：好像。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"作者參加的活動號做啥物？","o":["走揣火金蛄","油桐花祭","元宵燈會","夜市𨑨迌"],"a":0,"e":"去參加「走揣火金蛄」活動。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者講這擺活動是「一空掠雙隻」，意思是？","o":["參加一个活動，會當看兩種無仝的景緻","會當掠兩隻火金蛄","會當挽油桐花","有兩个解說員"],"a":0,"e":"日時看油桐花，暗時看火金蛄，一舉兩得。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者一家人對佗位出發？","o":["大甲","東勢","臺北","南投"],"a":0,"e":"食飽晝才對大甲出發，到東勢。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"油桐花落甲規塗跤，作者形容敢若啥物？","o":["咧落雪","咧落雨","咧跳舞","咧放炮"],"a":0,"e":"油桐花又稱五月雪。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"根據課文，火金蛄會消失的原因是？","o":["生長的環境受著破壞","集體遷徙去別位","受天敵攻擊","地球溫度傷懸"],"a":0,"e":"環境受損蕩，多年找不到螢火蟲。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"後來滿山的火金蛄，是靠啥人的拍拚？","o":["生態保育人員","作者一家人","解說人員家己","觀光客"],"a":0,"e":"靠生態保育人員的努力。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"佇暗暝爍咧爍咧飛的，大部份是公的抑母的？","o":["公的","母的","公母仝濟","攏毋是"],"a":0,"e":"母的歇佇葉仔頂，發出較無遐光的訊號。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"火金蛄是按怎知影互相的身份？","o":["爍光的節奏無仝","聲音無仝","色水無仝","味無仝"],"a":0,"e":"不同的螢火蟲閃爍節奏不同。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者形容四箍輾轉的火金蛄親像啥物？","o":["咧跳舞的鼓仔燈","天頂的月娘","白色的油桐花","海湧"],"a":0,"e":"浮浮沉沉的燈籠。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈思念火金蛄〉是啥物文體？","o":["遊記","現代詩","書信","論說文"],"a":0,"e":"遊記式的記敘文。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"賞火金蛄的時，下面佗一个是毋著的行為？","o":["共火金蛄掠走","聲音放予輕","光線毋通傷光","莫穿會發光的鞋"],"a":0,"e":"三不一沒有：不吵、不抓、不照，沒有光害。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"賞火金蛄的時，為啥物愛穿長衫長褲？","o":["避免予蠓蟲叮著","較媠","較燒","較好跳舞"],"a":0,"e":"穿長衣長褲防蚊蟲。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"火金蛄上捷食啥物？","o":["露螺","花蜜","葉仔","米"],"a":0,"e":"火金蛄是肉食性，最常吃蝸牛。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「好命」的「好」讀 hó，「好奇」的「好」讀啥？","o":["hònn","hó","hō","hàu"],"a":0,"e":"一字多音：好奇 hònn-kî。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「通風」的「通」讀 thang，「通訊」的「通」讀啥？","o":["thong","thang","tong","thâng"],"a":0,"e":"一字多音：通訊 thong-sìn。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"若欲予火金蛄繼續生湠，咱會當做啥物？","o":["保護溪溝佮樹林，減少光害","掠轉去厝飼","用手電筒照","共草仔埔鋪紅毛塗"],"a":0,"e":"保育棲地、減少光害。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
