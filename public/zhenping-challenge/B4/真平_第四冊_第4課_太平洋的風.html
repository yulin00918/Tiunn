<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>太平洋的風｜真平第四冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../index.html">← 返回整冊</a><span class="pill">📗 真平・第四冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第4課｜太平洋的風</h1><p>課文語詞、詩文理解與生活應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文的意象、情感與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文理解運用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「紲落」是指？","o":["接續落去","完全停止","倒轉去"],"a":0,"e":"課文寫海風紲落走去立霧溪。"},{"q":"「晟養」是指？","o":["滋養、孕育","阻斷水流","將土地挖空"],"a":0,"e":"「立霧溪／晟養規个太魯閣峽谷的生湠」將溪流寫成滋養峽谷生命的力量。"},{"q":"「扭掠」是指？","o":["動作敏捷","行動緩慢","完全無移動"],"a":0,"e":"詩句「太平洋的風／跤手真扭掠」將風擬人化，形容它身手敏捷。"},{"q":"「相拄」是指？","o":["相遇","分開","爭吵"],"a":0,"e":"作者佇燕子口佮風相拄。"},{"q":"「𤆬」是指？","o":["帶領","丟掉","反對"],"a":0,"e":"風𤆬作者飛過青翠山野。"},{"q":"「輕聲細說」是指？","o":["細聲、溫柔地講話","提高聲量大聲喝斥","完全無任何聲響"],"a":0,"e":"「輕聲細說」寫風像人一樣輕聲說話，接著比作阿母的叮嚀，營造溫暖感。"},{"q":"「攑頭」是指？","o":["抬頭","低頭","轉身"],"a":0,"e":"攑頭看夜空的星。"},{"q":"「相搪」是指？","o":["相遇、碰著","永遠無見面","躲藏"],"a":0,"e":"詩寫風佇錐麓佮作者相搪。"},{"q":"「懶屍」佇詩中是指？","o":["慵懶、閒適","努力趕工","真生氣"],"a":0,"e":"詩以懶屍描寫悠閒的風。"},{"q":"「秋凊」是指？","o":["涼爽","炎熱","潮濕"],"a":0,"e":"課文用秋凊形容樹下的下晡。"}],"context":[{"q":"清風吹過來，親像阿母咧＿＿。","o":["輕聲細說","大聲喝斥","拍桌"],"a":0,"e":"課文把風擬人化。"},{"q":"行去山頂，伊＿＿看滿天星。","o":["攑頭","落頭","關門"],"a":0,"e":"攑頭是抬頭。"},{"q":"這陣風真＿＿，一下就吹過山谷。","o":["扭掠","拖沙","無精神"],"a":0,"e":"扭掠表示敏捷。"},{"q":"山裡的溪水＿＿山谷的生態。","o":["晟養","遺忘","關閉"],"a":0,"e":"晟養是滋養、養育。"},{"q":"秋天的樹仔跤真＿＿，坐咧足舒爽。","o":["秋凊","熱烘烘","悶焗"],"a":0,"e":"秋凊是涼爽。"}],"reading":[{"q":"詩中立霧溪的源頭佇佗位附近？","o":["奇萊北峰佮合歡山之間","日月潭中央","淡水河出海口"],"a":0,"e":"課文交代立霧溪源頭。"},{"q":"詩中「風佮我相拄」是啥物修辭？","o":["擬人：將風寫成會與人相遇","列舉：統計風速數值","設問：直接問讀者問題"],"a":0,"e":"風本來不會像人一樣「相拄」，作者卻寫風與自己相遇，這是擬人化的表現。"},{"q":"「親像阿母的叮嚀佮吩咐」予人啥物感受？","o":["溫暖佮關懷","恐怖佮威脅","冷漠佮無情"],"a":0,"e":"以母親叮嚀比喻故鄉的風。"},{"q":"作者用「鹹鹹的風」聯想到啥物？","o":["太平洋的氣味","山頂的雪","城市的車聲"],"a":0,"e":"海風帶有鹹味。"},{"q":"詩最後喝出「Formosa」主要表達？","o":["對臺灣土地的認同佮熱愛","想欲離開臺灣","只是在介紹英文拼字"],"a":0,"e":"結尾以 Formosa 讚美家鄉。"}],"comprehensive":[{"q":"欲寫一段風的擬人化描寫，佗句較適當？","o":["風輕聲共我講故鄉的故事","風速每秒三公尺","風向是東北風"],"a":0,"e":"第一句把風當做人描寫。"},{"q":"詩提著燕子口、錐麓、九曲洞，主要欲呈現？","o":["太魯閣峽谷的地景","臺南市的古蹟","都市百貨商場"],"a":0,"e":"這些都是詩中太魯閣地景。"},{"q":"若欲設計詩歌導覽，佗个方式較符合原作？","o":["結合風聲、海味、地景佮情感","干焦背地名無解說","只比較門票價錢"],"a":0,"e":"原詩融合感官與情感。"},{"q":"「風親像阿母的叮嚀」的表達效果是？","o":["予抽象的風帶有親情的溫度","證明風會真正講話","說明風攏無聲音"],"a":0,"e":"詩以比喻和擬人傳達情感。"},{"q":"欲理解詩中的「幸福攏佇遮」，較適當的想法是？","o":["從自然地景與故鄉連結感受幸福","幸福只來自購買物品","只有離開故鄉才會幸福"],"a":0,"e":"結尾「Formosa／咱的幸福／攏佇遮」承接太魯閣地景、風與故鄉記憶，表達對土地的珍惜與認同。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
