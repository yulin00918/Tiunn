</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第四冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🌊</div><h1>第4課｜太平洋的風</h1><p>太魯閣山水、擬人法佮土地感情</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「扭掠」較接近啥物意思？","o":["跤手緊、動作敏捷","扭著跤","掠人","真慢"],"a":0,"e":"扭掠：手腳快、動作敏捷。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「相搪」較接近啥物意思？","o":["拄好遇著","相拍","相揣","相欠"],"a":0,"e":"相搪：剛好遇見。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「攪」較接近啥物意思？","o":["混合、摻","攪吵","撈","拍"],"a":0,"e":"攪：混合、摻雜。例：飯攪豆油。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「秋凊」較接近啥物意思？","o":["涼爽","秋天","真寒","真熱"],"a":0,"e":"秋凊：清涼舒爽。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「相借問」較接近啥物意思？","o":["拍招呼","借錢","問路","相欠"],"a":0,"e":"相借問：打招呼、寒暄。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「晟養」較接近啥物意思？","o":["養育","成功","收成","飼料"],"a":0,"e":"晟養：養育。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「懶屍」較接近啥物意思？","o":["懶洋洋","懶惰","睏去","死去"],"a":0,"e":"懶屍：懶洋洋。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「輕聲細說」較接近啥物意思？","o":["講話聲細細","講話真大聲","講真濟話","講悄悄話"],"a":0,"e":"輕聲細說：說話聲音細小。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「袂輸」較接近啥物意思？","o":["好像","袂輸人","輸去","贏"],"a":0,"e":"袂輸：好像；近義詞敢若、親像。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「相遇」的近義詞，下面佗一个毋是？","o":["相揣","相拄","相搪","相逢"],"a":0,"e":"相遇＝相拄、相搪、相逢。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「伊做代誌跤手真＿＿，一睏仔就共碗洗好矣。」空格揀佗一个？","o":["扭掠","秋凊","懶屍","相搪"],"a":0,"e":"手腳很快。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「我佮伊足久無聯絡，煞佇車頭＿＿，阮攏足歡喜。」空格揀佗一个？","o":["相搪","扭掠","秋凊","攪"],"a":0,"e":"剛好遇見。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這間麵擔仔的焦麵，加＿＿一匙仔烏醋，氣味真讚！」空格揀佗一个？","o":["攪","搪","掠","揣"],"a":0,"e":"摻一點烏醋。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這馬日頭遮大，咱先歇一下，等咧較＿＿才去做。」空格揀佗一个？","o":["秋凊","扭掠","懶屍","相借問"],"a":0,"e":"比較涼爽再去。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「咱見著人愛＿＿，才有禮貌。」空格揀佗一个？","o":["相借問","相搪","扭掠","攪"],"a":0,"e":"見人要打招呼。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「＿＿熱天抑是寒天，阿宏逐工攏會去運動。」空格揀佗一个？","o":["毋管","雖然","便若","因為"],"a":0,"e":"毋管……抑是……攏：不管……還是……都……","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「大姆樓頂硞硞叫，二姆攑火出來照，三姆落地掃，四姆連鞭到。」臆四種自然現象：","o":["雷公、爍爁、風、雨","日頭、月娘、雲、霧","落雪、結霜、風颱、地動","天星、月娘、日頭、雲"],"a":0,"e":"打雷、閃電、風、雨。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「佇北部舊曆九月底開始吹的東北季風」叫做啥物？","o":["九降風","對頭風","春風","落風"],"a":0,"e":"新竹米粉、柿餅靠九降風。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「食物囥傷久歹去，有䆀味」，閩南語講？","o":["臭風","膨風","消風","落風"],"a":0,"e":"臭風：食物放太久變質。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「騎跤踏車拄著對面吹來的風，真食力」，這種風叫？","o":["對頭風","九降風","春風","臭風"],"a":0,"e":"對頭風：迎面吹來的風。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"根據課文，太平洋的風吹過的所在，照順序是？","o":["立霧溪邊→燕子口→錐麓→九曲洞","立霧溪邊→燕子口→九曲洞→錐麓","燕子口→立霧溪邊→錐麓→九曲洞","九曲洞→錐麓→燕子口→立霧溪邊"],"a":0,"e":"依課文小節順序。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文的景點攏佇佗一个國家公園？","o":["太魯閣國家公園","玉山國家公園","陽明山國家公園","墾丁國家公園"],"a":0,"e":"立霧溪、燕子口、錐麓、九曲洞都在太魯閣。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「太平洋的風，佇島嶼內輕聲細說」，親像啥物？","o":["阿母的叮嚀佮吩咐","風颱咧吼","朋友咧冤家","老師咧罵人"],"a":0,"e":"用擬人法寫出溫暖。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"作者講鹹鹹的風是太平洋的氣味，袂輸啥物？","o":["番薯糜攪鹽的清芳","魚仔的臭臊","花的芳味","海湧的聲"],"a":0,"e":"用家鄉味形容海風。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「閒閒的風是太平洋的懶屍」，敢若啥物？","o":["秋凊的老榕仔跤的下晡時","風颱天","熱人的中晝","寒天的暗暝"],"a":0,"e":"悠閒的風，像涼爽午後的老榕樹下。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"詩內底「寒天的獵戶」佮「熱人的七星」是講啥物？","o":["星座","人名","地名","山名"],"a":0,"e":"獵戶座、北斗七星。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"詩的最後，作者聽著回音咧喝啥物？","o":["Formosa，咱的幸福攏佇遮","緊轉來","海湧真大","風颱欲來矣"],"a":0,"e":"表達對這塊土地的愛。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"下面佗一个選項正確？","o":["作者透過太平洋的風，表達對這塊土地的感情","太平洋的風干焦吹海邊","作者驚太平洋的風","這首詩是寫阿里山"],"a":0,"e":"以風為主軸寫土地情感。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"本詩主要用啥物寫作手法？","o":["擬人法","設問法","倒裝法","排比法"],"a":0,"e":"把風寫成會跳舞、會叮嚀的人。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈太平洋的風〉的作者是啥人？","o":["周蘇宗","路寒袖","楊斯棓","張逸嫻"],"a":0,"e":"周蘇宗，筆名周星瀚。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"「阿里山」的「山」讀 san，「山坪」的「山」讀啥？","o":["suann","san","sann","suan"],"a":0,"e":"一字多音：山坪 suann-phiânn。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「露營」的「營」讀啥？","o":["iânn","îng","iân","ing"],"a":0,"e":"一字多音：營業 îng-giãp、露營 lōo-iânn。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「這間店的跤手無夠」的「跤手」是啥物意思？","o":["人手、人力","手佮跤","部屬","動作"],"a":0,"e":"一詞多義：跤手可指手腳、部屬、人手。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"對話：海邊揹螺仔殼的是啥物？","o":["寄生仔","露螺","蟳仔","海豬"],"a":0,"e":"寄生仔：寄居蟹。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"若欲佮外國人分享佇臺灣上幸福的代誌，下面佗一个較適合？","o":["多元的食食文化佮好山好水","臺灣真熱","風颱真濟","車真濟"],"a":0,"e":"作者感覺生活佇臺灣是幸福的。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"看著海邊有寄生仔揹塑膠蓋，咱上應該做啥物？","o":["認真做環保，減少海洋糞埽","掠轉去飼","毋免管","閣擲較濟塑膠"],"a":0,"e":"保護海洋生態。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
