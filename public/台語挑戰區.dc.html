<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<title>台語挑戰區｜鈺見台語</title>
<meta name="author" content="張鈺聆">
<meta name="copyright" content="© 張鈺聆">
<script src="./author-credit.js"></script>

<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H3X7ZH5XL6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-H3X7ZH5XL6');
</script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  a{color:inherit;text-decoration:none;}
  .ca-card{transition:.18s ease;}
  .ca-boss{transition:.18s ease;}
  @media(hover:hover){
    .ca-card:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(38,78,71,.14) !important;}
    .ca-boss:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(215,110,49,.22) !important;}
    .ca-home:hover{background:rgba(255,255,255,.24) !important;}
    .ca-back:hover{border-color:#55A99C !important;}
    .ca-tab:hover{border-color:#55A99C !important;}
  }
  /* 鈺見台語｜台語挑戰區 V2：溫暖活潑版（僅換色，同形音義挑戰） */
  button:focus-visible,a:focus-visible,article:focus-visible{outline:3px solid #F4C65D;outline-offset:2px;}
  @media(prefers-reduced-motion:reduce){.ca-card,.ca-boss{transition:none;}}
</style>
</helmet>
<div style="font-family:'Noto Sans TC',sans-serif;color:#263B37;min-height:100vh;background:radial-gradient(circle at 7% 9%,rgba(244,198,93,.23),transparent 26%),radial-gradient(circle at 95% 17%,rgba(85,169,156,.17),transparent 28%),#FAF8F2;">

  <div style="background:linear-gradient(110deg,#254E47,#316E62 78%,#37877B);border-bottom:4px solid #F4C65D;color:#fff;">
    <div style="max-width:1120px;margin:auto;min-height:66px;padding:12px 22px;display:flex;align-items:center;gap:14px;">
      <a class="ca-home" href="首頁.dc.html" style="flex:0 0 auto;display:inline-flex;align-items:center;min-height:44px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:14px;font-weight:800;white-space:nowrap;">🏠 回首頁</a>
      <div style="min-width:0;text-align:center;flex:1;">
        <div style="font-size:clamp(19px,3.4vw,22px);font-weight:900;letter-spacing:.08em;">🏆 台語挑戰區</div>
        <div style="margin-top:3px;font-size:12.5px;color:#E7F2E9;font-weight:700;line-height:1.5;">從基礎練習一路挑戰到綜合任務</div>
      </div>
      <div style="flex:0 0 auto;width:104px;"></div>
    </div>
  </div>

  <div style="position:relative;background:linear-gradient(105deg,#FFF1D4 0%,#FFE1CA 51%,#DDF1E9 100%);border-bottom:1px solid #F1D5B4;overflow:hidden;">
    <div style="max-width:1120px;margin:auto;padding:16px 22px 20px;display:flex;align-items:center;gap:14px;position:relative;z-index:1;">
      <span style="flex:0 0 auto;font-size:24px;transform:rotate(-8deg);">🏅</span>
      <div style="background:#fff;border:1px solid #F4C990;border-radius:16px 16px 16px 4px;padding:11px 16px;box-shadow:0 6px 16px rgba(160,103,50,.10);">
        <div style="font-size:11.5px;font-weight:900;letter-spacing:.14em;color:#B15F2A;">今日任務</div>
        <div style="margin-top:4px;font-size:14.5px;font-weight:800;color:#594936;line-height:1.6;">{{bandText}}</div>
      </div>
    </div>
    <svg viewBox="0 0 1440 16" preserveAspectRatio="none" style="position:absolute;left:0;right:0;bottom:-1px;width:100%;height:16px;display:block;"><path d="M0,10 C240,2 480,15 720,8 C960,2 1200,14 1440,7 L1440,16 L0,16 Z" fill="#FAF8F2"></path></svg>
  </div>

  <main style="max-width:1120px;margin:auto;padding:22px 22px 0;">

    <sc-if value="{{playing}}">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid #E8E6D9;border-radius:20px;padding:14px 18px;box-shadow:0 8px 20px rgba(38,78,71,.07);margin-bottom:16px;">
        <div style="display:flex;align-items:center;gap:11px;min-width:0;flex-wrap:wrap;">
          <span style="flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:#E0F2EC;color:#236B60;border:1px solid #B9DED1;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:900;letter-spacing:.06em;white-space:nowrap;">● 正在進行基礎挑戰</span>
          <span style="font-size:15px;font-weight:900;color:#254E47;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;">{{playingName}}</span>
        </div>
        <button class="ca-back" style="flex:0 0 auto;border:2px solid #B6CFC3;background:#fff;color:#254E47;border-radius:999px;padding:12px 20px;min-height:48px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:900;transition:.16s;" onClick="{{backToList}}">← 返回挑戰列表</button>
      </div>
    </sc-if>

    <sc-if value="{{!playing}}" hint-placeholder-val="{{true}}">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:20px;">
        <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="2">
          <button class="ca-tab" style="{{tab.btnStyle}}" onClick="{{tab.onClick}}">
            <span style="display:flex;align-items:center;gap:10px;">
              <span style="font-size:26px;line-height:1;">{{tab.icon}}</span>
              <span style="text-align:left;min-width:0;">
                <span style="display:block;font-size:17px;font-weight:900;line-height:1.3;">{{tab.label}}</span>
                <span style="display:block;margin-top:3px;font-size:12.5px;font-weight:700;opacity:.75;line-height:1.5;">{{tab.hint}}</span>
              </span>
            </span>
          </button>
        </sc-for>
      </div>
    </sc-if>

    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="2">

      <sc-if value="{{tab.activeBasic}}">
        <div style="background:#fff;border:1px solid #E8E6D9;border-radius:26px;padding:26px;box-shadow:0 12px 32px rgba(38,78,71,.10);">
          <sc-for list="{{groups}}" as="grp" hint-placeholder-count="2">
            <div style="{{grp.wrapStyle}}">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:13px;">
                <span style="flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 9px;border-radius:999px;background:{{grp.tone}};color:#fff;font-size:12.5px;font-weight:900;">{{grp.step}}</span>
                <div style="min-width:0;">
                  <div style="font-size:17px;font-weight:900;line-height:1.3;color:#254E47;">{{grp.title}}</div>
                  <div style="margin-top:2px;font-size:12.5px;color:#66766D;font-weight:700;line-height:1.5;">{{grp.hint}}</div>
                </div>
              </div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;">
                <sc-for list="{{grp.games}}" as="g" hint-placeholder-count="2">
                  <article class="ca-card" style="{{g.cardStyle}}" onClick="{{g.onClick}}">
                    <div style="font-size:38px;line-height:1;">{{g.icon}}</div>
                    <h3 style="margin:11px 0 7px;font-size:clamp(19px,2.6vw,21px);font-weight:900;line-height:1.35;color:#254E47;">{{g.name}}</h3>
                    <p style="margin:0;color:#66766D;font-size:13.5px;font-weight:700;line-height:1.7;flex-grow:1;">{{g.how}}</p>
                    <span style="{{g.ctaStyle}}">開始挑戰 →</span>
                  </article>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{tab.activeAdvanced}}">
        <div style="background:#fff;border:1px solid #E8E6D9;border-radius:26px;padding:26px;box-shadow:0 12px 32px rgba(38,78,71,.10);">
          <a class="ca-boss" href="進階綜合挑戰.html" style="position:relative;display:flex;flex-direction:column;background:linear-gradient(140deg,#FFF0B9,#FFE0AD);border:2px solid #F0BB60;border-radius:24px;padding:30px 26px 26px;box-shadow:0 12px 28px rgba(215,110,49,.14);cursor:pointer;overflow:hidden;">
            <span style="position:absolute;top:16px;right:18px;background:#E88B4A;color:#fff;font-size:11px;font-weight:900;letter-spacing:.12em;border-radius:999px;padding:5px 13px;">BOSS</span>
            <div style="font-size:46px;line-height:1;">🚀</div>
            <h3 style="margin:13px 0 9px;font-size:clamp(23px,3.4vw,29px);font-weight:900;letter-spacing:.02em;color:#254E47;">進階綜合挑戰</h3>
            <p style="margin:0;max-width:560px;color:#755832;font-size:14.5px;font-weight:700;line-height:1.85;">想把聽、讀、寫與語詞運用一起挑戰？來試試進階綜合挑戰。</p>
            <span style="display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;margin-top:20px;min-height:52px;border-radius:999px;background:linear-gradient(110deg,#E88B4A,#DA753B);color:#fff;font-size:16px;font-weight:900;padding:14px 26px;box-shadow:0 9px 20px rgba(215,110,49,.25);">進入挑戰 →</span>
          </a>
        </div>
      </sc-if>

      <sc-if value="{{tab.activeVeggieGame}}">
        <dc-import name="菜蔬果子大挑戰" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{tab.activeColorGame}}">
        <dc-import name="色水大挑戰" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{tab.activeColorRoulette}}">
        <dc-import name="色水走馬燈" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{tab.activeVeggieRoulette}}">
        <dc-import name="蔬果走馬燈" hint-size="100%,900px"></dc-import>
      </sc-if>

    </sc-for>

  </main>

  <div style="max-width:1120px;margin:22px auto 0;padding:0 22px 34px;font-size:12px;color:#77847C;font-weight:700;text-align:center;">
    <span style="color:#7d8f86;">張鈺聆 製</span>｜鈺見台語
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const GAME_META = {
  veggie:      { icon: '🥬🍉', name: '菜蔬果子大挑戰', how: '看圖 → 選出台羅' },
  color:       { icon: '🎨👕', name: '色水大挑戰',     how: '看色水 → 選出台羅' },
  roulette:    { icon: '🎡👕', name: '色水走馬燈',     how: '停格 → 看台羅講色水' },
  vegRoulette: { icon: '🎡🥬', name: '蔬果走馬燈',     how: '停格 → 看台羅講蔬果' },
};

const GROUPS = [
  { step: '關卡 1', title: '看圖挑戰', hint: '看著圖，揀出正確的台羅', tone: '#278777', keys: ['veggie', 'color'],
    cardBg: 'linear-gradient(150deg,#F4FAF5,#E0F2EC)', cardBorder: '#CBE9DD', ctaBg: '#278777' },
  { step: '關卡 2', title: '開喙挑戰', hint: '看著台羅，家己講出來', tone: '#E88B4A', keys: ['roulette', 'vegRoulette'],
    cardBg: 'linear-gradient(150deg,#FFFCF4,#FFF1D7)', cardBorder: '#F3DFB9', ctaBg: 'linear-gradient(110deg,#E88B4A,#DA753B)' },
];

class Component extends DCLogic {
  state = { activeTab: 0, activeGame: null };

  renderVals() {
    const data = [
      { label: '基礎挑戰', icon: '🌱', hint: '先暖身，一關一關過', isBasic: true },
      { label: '進階綜合挑戰', icon: '🚀', hint: '基礎練熟矣，來挑戰 Boss', isAdvanced: true },
    ];
    const activeGame = this.state.activeGame;

    const tabs = data.map((d, i) => {
      const active = i === this.state.activeTab;
      const isBasicTab = active && d.isBasic;
      return {
        ...d,
        active,
        activeBasic: isBasicTab && !activeGame,
        activeVeggieGame: isBasicTab && activeGame === 'veggie',
        activeColorGame: isBasicTab && activeGame === 'color',
        activeColorRoulette: isBasicTab && activeGame === 'roulette',
        activeVeggieRoulette: isBasicTab && activeGame === 'vegRoulette',
        activeAdvanced: active && d.isAdvanced,
        onClick: () => this.setState({ activeTab: i, activeGame: null }),
        btnStyle: `display:flex;align-items:center;padding:16px 18px;border-radius:20px;border:2px solid ${active ? '#254E47' : '#E7DCC9'};font-family:inherit;cursor:pointer;min-height:76px;text-align:left;transition:.16s ease;background:${active ? '#254E47' : '#FFFCF4'};color:${active ? '#fff' : '#385A53'};box-shadow:${active ? '0 10px 22px rgba(37,78,71,.20)' : '0 6px 16px rgba(38,78,71,.05)'};`,
      };
    });

    const goto = (key) => () => this.setState({ activeGame: key });
    const groups = GROUPS.map(grp => ({
      step: grp.step, title: grp.title, hint: grp.hint, tone: grp.tone,
      wrapStyle: grp === GROUPS[0] ? '' : 'margin-top:26px;padding-top:24px;border-top:1px dashed #E8DAC6;',
      games: grp.keys.map(key => {
        const m = GAME_META[key];
        return {
          icon: m.icon, name: m.name, how: m.how,
          onClick: goto(key),
          cardStyle: `background:${grp.cardBg};border:2px solid ${grp.cardBorder};border-radius:22px;padding:24px;box-shadow:0 8px 20px rgba(38,78,71,.06);cursor:pointer;display:flex;flex-direction:column;`,
          ctaStyle: `display:inline-flex;align-items:center;justify-content:center;margin-top:18px;min-height:50px;border-radius:999px;background:${grp.ctaBg};color:#fff;font-size:15.5px;font-weight:900;padding:13px 20px;`,
        };
      }),
    }));

    return {
      tabs,
      groups,
      playing: !!activeGame,
      playingName: activeGame ? `${GAME_META[activeGame].icon} ${GAME_META[activeGame].name}` : '',
      bandText: activeGame
        ? '挑戰進行中，欲換一項會使按「返回挑戰列表」。'
        : '揀一項挑戰，看你今仔日學了偌熟。',
      backToList: () => this.setState({ activeGame: null }),
      goToVeggieGame: () => this.setState({ activeGame: 'veggie' }),
      goToColorGame: () => this.setState({ activeGame: 'color' }),
      goToColorRoulette: () => this.setState({ activeGame: 'roulette' }),
      goToVeggieRoulette: () => this.setState({ activeGame: 'vegRoulette' }),
    };
  }
}

</script>
</body>
</html>
