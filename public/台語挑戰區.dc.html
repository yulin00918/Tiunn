<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
</helmet>
<div style="font-family:'Noto Sans TC',sans-serif;background:linear-gradient(135deg, #ffd9a0 0%, #ffc2b0 20%, #f3b6d3 40%, #d6b8ec 60%, #b9d3f0 80%, #a9e3ec 100%);min-height:100vh;padding:40px;">
  <div style="max-width:1000px;margin:0 auto;">
    <a href="首頁.dc.html" style="display:inline-block;margin-bottom:20px;color:#2461b0;font-weight:700;text-decoration:none;">← 回首頁</a>
    <h1 style="font-size:32px;font-weight:900;color:#2461b0;margin-bottom:8px;">🚀 台語挑戰區</h1>
    <p style="font-size:15px;color:#4a4540;margin-bottom:24px;">提供多元進階練習與綜合挑戰活動,循序提升台語聽、說、讀、寫能力。</p>

    <div style="display:flex;gap:10px;margin-bottom:20px;">
      <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
        <button style="{{tab.btnStyle}}" onClick="{{tab.onClick}}">{{tab.label}}</button>
      </sc-for>
    </div>

    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
      <sc-if value="{{tab.activeBasic}}">
        <div style="background:#ffffffcc;border-radius:16px;padding:28px;box-shadow:0 4px 14px rgba(0,0,0,0.08);">
          <h3 style="font-size:18px;font-weight:700;color:#2461b0;margin-bottom:14px;">{{tab.label}}</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;">
            <button style="border:none;border-radius:14px;padding:20px;background:#e9f8ee;color:#205c3f;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;text-align:left;" onClick="{{goToVeggieGame}}">🥬🍉 菜蔬果子大挑戰<br><span style="font-size:12px;font-weight:500;color:#4d6f5d;">看圖選出台羅</span></button>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{tab.activePlaceholder}}">
        <div style="background:#ffffffcc;border-radius:16px;padding:28px;box-shadow:0 4px 14px rgba(0,0,0,0.08);">
          <h3 style="font-size:18px;font-weight:700;color:#2461b0;margin-bottom:14px;">{{tab.label}}</h3>
          <div style="border:2px dashed #2461b055;border-radius:12px;padding:40px;text-align:center;background:repeating-linear-gradient(45deg, #d9e9fb55, #d9e9fb55 10px, #fff0 10px, #fff0 20px);">
            <p style="font-family:monospace;font-size:13px;color:#3a5a8a;">{{tab.placeholder}}</p>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{tab.activeVeggieGame}}">
        <dc-import name="菜蔬果子大挑戰" hint-size="100%,900px"></dc-import>
      </sc-if>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { activeTab: 0, showVeggieGame: false };
  renderVals() {
    const data = [
      { label: '基礎挑戰', isBasic: true },
      { label: '進階挑戰', placeholder: '在此貼上進階挑戰內容' },
      { label: '綜合挑戰', placeholder: '在此貼上綜合挑戰內容' },
    ];
    const tabs = data.map((d, i) => {
      const active = i === this.state.activeTab;
      const isBasicTab = active && d.isBasic;
      return {
        ...d,
        active,
        activeBasic: isBasicTab && !this.state.showVeggieGame,
        activeVeggieGame: isBasicTab && this.state.showVeggieGame,
        activePlaceholder: active && !d.isBasic,
        onClick: () => this.setState({ activeTab: i, showVeggieGame: false }),
        btnStyle: `padding:10px 20px;border-radius:12px;border:none;font-weight:700;font-size:14px;cursor:pointer;background:${active ? '#2461b0' : '#ffffffaa'};color:${active ? '#fff' : '#2461b0'};`,
      };
    });
    return { tabs, goToVeggieGame: () => this.setState({ showVeggieGame: true }) };
  }
}

</script>
</body>
</html>
