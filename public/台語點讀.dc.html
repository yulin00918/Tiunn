<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
</helmet>
<div style="font-family:'Noto Sans TC',sans-serif;background:linear-gradient(135deg, #ffe3c2 0%, #ffb98f 55%, #ff9f7a 100%);min-height:100vh;">

  <sc-if value="{{screenSelect}}">
    <div style="background:#8f2035;padding:20px 30px;text-align:center;">
      <div style="font-size:1.3rem;font-weight:900;color:#fff;letter-spacing:0.1em;">台語點讀</div>
      <div style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-top:4px;">選擇版本、冊次及課別開始點讀</div>
    </div>
    <div style="max-width:1200px;margin:0 auto;padding:24px 30px 60px;">
      <a href="首頁.dc.html" style="display:inline-block;margin-bottom:20px;color:#8f2035;font-weight:700;text-decoration:none;white-space:nowrap;">← 回首頁</a>

      <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:20px;align-items:start;">
        <sc-for list="{{groups}}" as="grp" hint-placeholder-count="3">
          <div>
            <div style="display:flex;align-items:center;gap:8px;margin:0 0 12px;">
              <span style="width:5px;height:20px;background:#8f2035;border-radius:3px;display:inline-block;"></span>
              <span style="font-weight:800;color:#8f2035;font-size:1rem;white-space:nowrap;">{{grp.label}}</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:16px;">
              <sc-for list="{{grp.cards}}" as="card" hint-placeholder-count="4">
                <div style="background:{{card.bg}};border-radius:20px;padding:18px 16px;box-shadow:0 8px 20px rgba(140,80,40,0.12);">
                  <div style="text-align:center;font-weight:800;color:#8f2035;font-size:0.95rem;">{{card.title}}</div>
                  <div style="text-align:center;font-size:0.72rem;color:#8a7d6d;margin-bottom:12px;">{{card.subtitle}}</div>
                  <sc-for list="{{card.rows}}" as="row" hint-placeholder-count="3">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid rgba(0,0,0,0.06);">
                      <span style="font-size:0.78rem;color:#8f2035;font-weight:600;line-height:1.4;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;">{{row.label}}</span>
                      <button style="{{row.btnStyle}}" disabled="{{row.disabled}}" onClick="{{row.onClick}}">{{row.btnLabel}}</button>
                    </div>
                  </sc-for>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{screenLesson}}">
    <div style="max-width:1000px;margin:0 auto;padding:30px;">
      <button onClick="{{backToSelect}}" style="display:inline-block;margin-bottom:20px;background:none;border:none;color:#8f2035;font-weight:700;font-size:15px;cursor:pointer;padding:0;">← 返回選單</button>
      <sc-if value="{{isBaithangkue}}">
        <dc-import name="白糖粿點讀" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{isHaisingkuan}}">
        <dc-import name="來去屏東海生館蹛一暝點讀" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{isSisiua}}">
        <dc-import name="四秀仔錢點讀" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{isSioinnTsua}}">
        <dc-import name="燒銀紙佮放炮仔點讀" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{isThatTangkonga}}">
        <dc-import name="踢銅管仔點讀" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{isPahAKiann}}">
        <dc-import name="爸仔囝點讀" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{isAMaBakSai}}">
        <dc-import name="阿媽的目屎點讀" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{isBueTsiahGoo}}">
        <dc-import name="未食五日節粽點讀" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{!hasDc}}">
        <div style="background:#ffffffcc;border-radius:16px;padding:28px;box-shadow:0 4px 14px rgba(0,0,0,0.08);">
          <h3 style="font-size:18px;font-weight:700;color:#8f2035;margin-bottom:14px;">{{activeSubtitle}}</h3>
          <div style="border:2px dashed #8f203555;border-radius:12px;padding:40px;text-align:center;background:repeating-linear-gradient(45deg, #fbdbe055, #fbdbe055 10px, #fff0 10px, #fff0 20px);">
            <p style="font-family:monospace;font-size:13px;color:#8a4a52;">在此貼上「{{activeSubtitle}}」的點讀課文內容與音檔</p>
          </div>
        </div>
      </sc-if>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const GROUPS_DEF = [
  { key: 'yuda', label: '育達版(國中)', cards: [
    { title: '第1冊', subtitle: '共 4 課', rows: [ { label: '第1課 白糖粿', ready: true, dc: '白糖粿點讀' }, { label: '第2課 來去屏東海生館蹛一暝', ready: true, dc: '來去屏東海生館蹛一暝點讀' }, { label: '第3課 四秀仔錢', ready: true, dc: '四秀仔錢點讀' }, { label: '第4課 燒銀紙佮放炮仔', ready: true, dc: '燒銀紙佮放炮仔點讀' } ] },
    { title: '第2冊', subtitle: '共 4 課', rows: [ { label: '第1課 踢銅管仔', ready: true, dc: '踢銅管仔點讀' }, { label: '第2課 爸仔囝', ready: true, dc: '爸仔囝點讀' }, { label: '第3課 阿媽的目屎', ready: true, dc: '阿媽的目屎點讀' }, { label: '第4課 未食五日節粽', ready: true, dc: '未食五日節粽點讀' } ] },
    { title: '第3冊', subtitle: '共 0 課', rows: [ { label: '第1課', ready: false }, { label: '第2課', ready: false }, { label: '第3課', ready: false } ] },
  ]},
  { key: 'kangxuan', label: '康軒版(國中)', cards: [
    { title: '第1冊', subtitle: '共 0 課', rows: [ { label: '第1課', ready: false }, { label: '第2課', ready: false } ] },
    { title: '第2冊', subtitle: '共 0 課', rows: [ { label: '第1課', ready: false }, { label: '第2課', ready: false } ] },
    { title: '第3冊', subtitle: '共 0 課', rows: [ { label: '第1課', ready: false }, { label: '第2課', ready: false } ] },
  ]},
  { key: 'zhenping', label: '真平版(國中)', cards: [
    { title: '第1冊', subtitle: '共 0 課', rows: [ { label: '第1課', ready: false }, { label: '第2課', ready: false }, { label: '第3課', ready: false } ] },
    { title: '第2冊', subtitle: '共 0 課', rows: [ { label: '第1課', ready: false }, { label: '第2課', ready: false } ] },
    { title: '第3冊', subtitle: '共 0 課', rows: [ { label: '第1課', ready: false }, { label: '第2課', ready: false } ] },
    { title: '第4冊', subtitle: '共 0 課', rows: [ { label: '第1課', ready: false }, { label: '第2課', ready: false } ] },
  ]},
];

class Component extends DCLogic {
  state = { screen: 'select', activeSubtitle: '', activeDc: null };

  openLesson(cardTitle, groupLabel, row) {
    this.setState({ screen: 'lesson', activeSubtitle: `${groupLabel} ${cardTitle} ${row.label}`, activeDc: row.dc || null });
  }

  renderVals() {
    const groups = GROUPS_DEF.map(g => ({
      label: g.label,
      cards: g.cards.map(card => ({
        title: card.title,
        subtitle: card.subtitle,
        bg: '#fdf1e2',
        rows: card.rows.map(row => {
          const available = !!row.ready;
          return {
            label: row.label,
            disabled: !available,
            btnLabel: available ? '開始' : '尚未建立',
            btnStyle: `font-family:inherit;border:none;border-radius:999px;padding:6px 14px;font-size:0.72rem;font-weight:700;cursor:${available ? 'pointer' : 'not-allowed'};background:${available ? '#4a9f6e' : '#e5ddd0'};color:${available ? '#fff' : '#9a8f80'};white-space:nowrap;`,
            onClick: available ? () => this.openLesson(card.title, g.label, row) : null,
          };
        }),
      })),
    }));
    return {
      screenSelect: this.state.screen === 'select',
      screenLesson: this.state.screen === 'lesson',
      groups,
      activeSubtitle: this.state.activeSubtitle,
      activeDc: this.state.activeDc,
      hasDc: !!this.state.activeDc,
      isBaithangkue: this.state.activeDc === '白糖粿點讀',
      isHaisingkuan: this.state.activeDc === '來去屏東海生館蹛一暝點讀',
      isSisiua: this.state.activeDc === '四秀仔錢點讀',
      isSioinnTsua: this.state.activeDc === '燒銀紙佮放炮仔點讀',
      isThatTangkonga: this.state.activeDc === '踢銅管仔點讀',
      isPahAKiann: this.state.activeDc === '爸仔囝點讀',
      isAMaBakSai: this.state.activeDc === '阿媽的目屎點讀',
      isBueTsiahGoo: this.state.activeDc === '未食五日節粽點讀',
      backToSelect: () => this.setState({ screen: 'select' }),
    };
  }
}

</script>
</body>
</html>
