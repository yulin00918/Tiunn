<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#1f2d5c;min-height:100vh;background:radial-gradient(circle at 6% 4%,rgba(243,188,111,.14),transparent 22%),radial-gradient(circle at 95% 10%,rgba(117,190,219,.10),transparent 24%),#fbf8f2}
.top{background:#15344b;color:#fff;padding:0}
.topIn{max-width:1080px;margin:auto;min-height:66px;padding:12px 22px;display:flex;align-items:center;gap:14px}
.topIn .home{flex:0 0 auto;display:inline-flex;align-items:center;min-height:44px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.10);color:#dce7f2;font-size:14px;font-weight:800;text-decoration:none;white-space:nowrap;transition:.16s}
.topIn .titleBox{min-width:0;text-align:center;flex:1}
.topIn b{display:block;font-size:21px;letter-spacing:.08em;font-weight:900}
.topIn .sub{margin-top:3px;font-size:12.5px;color:#9db4c7;font-weight:700;line-height:1.5}
.topSpacer{flex:0 0 auto;width:96px}
.taskBand{position:relative;background:linear-gradient(100deg,#fff2e0,#ffe7ee 70%,#fdeee3);border-bottom:1px solid #f3ddca;overflow:hidden}
.taskIn{max-width:1080px;margin:auto;padding:16px 22px 20px;display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.taskIn .leaf{flex:0 0 auto;font-size:24px;transform:rotate(-12deg)}
.bubble{background:#fff;border:1px solid #f2d9c4;border-radius:16px 16px 16px 4px;padding:11px 16px;box-shadow:0 5px 14px rgba(140,90,50,.08)}
.bubble .todayTag{font-size:11.5px;font-weight:900;letter-spacing:.14em;color:#b5762c}
.bubble .todayTxt{margin-top:4px;font-size:14.5px;font-weight:800;color:#7a5433;line-height:1.6}
.taskWave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:16px;display:block}
.wrap{max-width:1080px;margin:auto;padding:22px}
.back{color:#1f2d5c;text-decoration:none;font-weight:800}
.panel{background:#fff;border:1px solid #efe4d6;border-radius:24px;padding:24px;box-shadow:0 10px 26px rgba(120,90,60,.09)}
.stepHead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stepNo{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#15344b;color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center}
.modeTitle{font-weight:900;font-size:17px;margin:0}
.stepHint{margin:0;font-size:12.5px;color:#93826f;font-weight:700}
.stepBlock{padding-top:20px;margin-top:20px;border-top:1px dashed #ecdcc9}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modeBtn{border:2px solid #e4dccf;background:#fdfbf7;color:#3c4a63;border-radius:16px;padding:15px 16px;font-family:inherit;font-size:15.5px;font-weight:900;text-align:left;cursor:pointer;min-height:60px;transition:.16s}
.modeBtn.on{background:#15344b;color:#fff;border-color:#15344b;box-shadow:0 7px 16px rgba(21,52,75,.20)}
.selectors{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field label{display:block;font-size:12.5px;font-weight:900;margin-bottom:6px;color:#6d7c8c}
.field select{width:100%;min-height:50px;padding:12px;border:2px solid #e4dccf;border-radius:14px;background:#fff;font-family:inherit;font-size:15px;font-weight:700;color:#1f2d5c}
.scopeNote{margin-top:12px;font-size:12.5px;font-weight:800;color:#8a6f56;background:#fff4e4;border:1px solid #f3e2cd;border-radius:12px;padding:9px 13px;display:inline-block}

.amounts{display:flex;gap:10px;flex-wrap:wrap}
.amounts button{border:2px solid #e4dccf;background:#fdfbf7;color:#5d6b7d;border-radius:999px;padding:12px 22px;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;min-height:48px}
.amounts button.on{background:#2f7d4a;color:#fff;border-color:#2f7d4a}
.startRow{margin-top:24px}
.primary{border:0;border-radius:999px;background:#f57d27;color:#fff;font-family:inherit;font-size:17px;font-weight:900;padding:16px 34px;min-height:58px;cursor:pointer;box-shadow:0 9px 20px rgba(245,125,39,.25);transition:.16s}
.primary:disabled{cursor:not-allowed;box-shadow:none}
.warn{margin-top:14px;font-size:12.5px;color:#93826f;line-height:1.8;font-weight:700}
.quiz{max-width:820px;margin:22px auto}
.meta{display:flex;justify-content:space-between;gap:10px;font-weight:900;font-size:14.5px;color:#3f5a6d;margin:14px 0 8px}
.bar{height:9px;border-radius:999px;background:#ece2d4;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#2f7d4a,#5cb87e);transition:width .3s}
.card{background:#fff;border:1px solid #efe4d6;border-radius:26px;padding:30px 28px;margin-top:16px;box-shadow:0 12px 30px rgba(120,90,60,.10);text-align:center}
.tag{display:inline-block;background:#eef4f8;color:#3f6d8c;border-radius:999px;padding:7px 15px;font-size:13px;font-weight:900}
.prompt{margin:20px 0 8px;font-size:clamp(26px,4.6vw,40px);font-weight:900;line-height:1.35;letter-spacing:.02em;word-break:break-word}
.sub{font-size:14px;color:#8b98a4;font-weight:700;min-height:22px;line-height:1.7}
.audioBtn{margin-top:18px;border:0;border-radius:999px;background:#15344b;color:#fff;font-family:inherit;font-size:17px;font-weight:900;padding:15px 30px;min-height:58px;cursor:pointer;box-shadow:0 8px 18px rgba(21,52,75,.22)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.opt{border:2px solid #e4dccf;background:#fdfbf7;color:#1f2d5c;border-radius:18px;padding:20px 16px;font-family:inherit;font-size:clamp(17px,2.4vw,21px);font-weight:900;cursor:pointer;min-height:74px;word-break:break-word;transition:.14s}
.opt:disabled{cursor:default}
.opt.good{background:#e7f6ec;border-color:#2f7d4a;color:#1c6039}
.opt.bad{background:#fdeee9;border-color:#e0a48c;color:#a4552f}
.feedback{margin-top:18px;font-size:16px;font-weight:900;color:#3f5a6d;min-height:26px;line-height:1.6}
.next{margin-top:8px;display:none}
.result .score{font-size:clamp(40px,7vw,58px);font-weight:900;margin:16px 0 6px;color:#2f7d4a;letter-spacing:.02em}
.result .small{font-size:14.5px;color:#8b98a4;font-weight:700;line-height:1.8}
#again{background:#2f7d4a;box-shadow:0 9px 20px rgba(47,125,74,.22)}
#choose{background:#fff;color:#3f5a6d;border:2px solid #dfe3e8;box-shadow:none}
.pageFoot{max-width:1080px;margin:auto;padding:6px 22px 34px;font-size:12px;color:#a4988a;font-weight:700}
.pageFoot span{color:#7d8f86}
@media(hover:hover){.topIn .home:hover{background:rgba(255,255,255,.18)}.modeBtn:hover{border-color:#b9c8d6;transform:translateY(-2px)}.amounts button:hover{border-color:#b9c8d6}.opt:not(:disabled):hover{border-color:#9fb6c7;transform:translateY(-2px)}.primary:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(245,125,39,.30)}.audioBtn:hover{transform:translateY(-2px)}}
@media(max-width:820px){.selectors{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.topIn{min-height:60px;padding:10px 14px;gap:8px}.topIn b{font-size:18px}.topIn .sub{font-size:11.5px}.topSpacer{display:none}.taskIn{padding:14px 14px 18px}.wrap{padding:16px 14px}.panel{padding:18px;border-radius:20px}.card{padding:24px 18px;border-radius:20px}.pageFoot{padding:6px 14px 30px}}
@media(max-width:520px){.selectors{grid-template-columns:1fr}.modes{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.amounts button{flex:1;padding:12px 10px}.primary{width:100%}}
</style></head><body>
<div class="top"><div class="topIn"><a class="home" href="首頁.dc.html">← 回首頁</a><div class="titleBox"><b>🔎 課文解碼站</b><div class="sub">聽音・認字・看台羅，把課文語詞真正解開</div></div><div class="topSpacer"></div></div></div>
<div class="taskBand"><div class="taskIn"><span class="leaf">🌿</span><div class="bubble"><div class="todayTag">今日任務</div><div class="todayTxt">聽一聽、看一看，你認得這个詞無？</div></div></div><svg class="taskWave" viewBox="0 0 1440 16" preserveAspectRatio="none"><path d="M0,10 C240,2 480,15 720,8 C960,2 1200,14 1440,7 L1440,16 L0,16 Z" fill="#fbf8f2"></path></svg></div>
<div class="wrap" id="selectScreen"><div class="panel">
<div class="stepHead"><span class="stepNo">1</span><div><p class="modeTitle">選擇練習模式</p><p class="stepHint">四種練習方向，揀你今介日想練的</p></div></div>
<div class="modes" id="modes">
<button class="modeBtn on" data-mode="audioHanji">👂 聽讀音選台語</button>
<button class="modeBtn" data-mode="audioTailo">🎧 聽讀音選台羅</button>
<button class="modeBtn" data-mode="hanjiTailo">🔤 看台語選台羅</button>
<button class="modeBtn" data-mode="tailoHanji">🀄 看台羅選台語</button>
</div>
<div class="stepBlock"><div class="stepHead"><span class="stepNo">2</span><div><p class="modeTitle">揀課本</p><p class="stepHint">版本 → 冊別 → 課次</p></div></div>
<div class="selectors">
<div class="field"><label>版本</label><select id="pub"></select></div><div class="field"><label>冊別</label><select id="book"></select></div><div class="field"><label>課次</label><select id="lesson"></select></div>
</div><div class="scopeNote">練習範圍：全部（課本生字＋補充）</div><div class="lessonInfo" id="info"></div></div>
<div class="stepBlock"><div class="stepHead"><span class="stepNo">3</span><div><p class="modeTitle">揀題數</p><p class="stepHint">欲練幾題？</p></div></div>
<div class="amounts"><button data-n="8" class="on">8 題</button><button data-n="15">15 題</button><button data-n="all">全部</button></div></div>
<div class="startRow"><button class="primary" id="start" style="white-space:nowrap">開始練習 →</button></div><div class="warn">有可靠音檔的詞才會出現「聽讀音」題型；沒有音檔的詞仍會用字形／台羅題型練習，不會硬配錯誤音檔。</div></div></div>
<div class="wrap quiz" id="quizScreen" style="display:none"><button class="back" id="quit" style="border:0;background:none;cursor:pointer;font-size:15px">← 返回選單</button><div class="meta"><span id="qnum"></span><span id="scoreNow"></span></div><div class="bar"><i id="bar"></i></div><div class="card"><span class="tag" id="typeTag"></span><div class="prompt" id="prompt"></div><div class="sub" id="sub"></div><button class="audioBtn" id="audioBtn" style="display:none">🔊 播放語音</button><div class="opts" id="opts"></div><div class="feedback" id="feedback"></div><button class="primary next" id="next">下一題</button></div></div>
<div class="wrap quiz" id="resultScreen" style="display:none"><div class="card result"><div class="tag">🎉 任務完成</div><div class="score" id="finalScore"></div><div class="small" id="finalText"></div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px"><button class="primary" id="again">同課再玩</button><button class="primary" id="choose">重新選課</button></div></div></div>
<footer class="pageFoot"><span>張鈺聆 製</span>｜鈺聆上台語課</footer>
<audio id="player" preload="none"></audio>
<script>
const {GROUPS_DEF}=window.TAIGI_VOCAB; const $=id=>document.getElementById(id); let amount=8, mode='audioHanji', questions=[],qi=0,score=0,locked=false,currentRow=null;
/* 已知死連結（封版驗收列出之真平舊資料缺檔）：不進聽音題，但仍可用於文字題。不猜配、不代換相似讀音。 */
const DEAD_AUDIO=new Set(['audio/zhenping_b1l2_huainn-tit.mp3','audio/zhenping_b1l2_thuann.mp3','audio/zhenping_b1l2_phainn-se.mp3','audio/zhenping_b1l2_be-hu-tshi.mp3']);
function hasAudio(w){return !!w.audio && !DEAD_AUDIO.has(w.audio)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function cleanTailo(s){return (s||'').split('/').map(x=>x.trim()).filter(Boolean)}
function init(){ $('pub').innerHTML=GROUPS_DEF.map((g,i)=>`<option value="${i}">${g.label}</option>`).join(''); updateBooks(); document.querySelectorAll('.modeBtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modeBtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode;updateInfo()}); document.querySelectorAll('.amounts button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.amounts button').forEach(x=>x.classList.remove('on'));b.classList.add('on');amount=b.dataset.n==='all'?'all':+b.dataset.n}); $('pub').onchange=updateBooks;$('book').onchange=updateLessons;$('lesson').onchange=updateInfo;$('start').onclick=start;$('quit').onclick=showSelect;$('next').onclick=next;$('again').onclick=start;$('choose').onclick=showSelect}
function updateBooks(){let g=GROUPS_DEF[+$('pub').value];$('book').innerHTML=g.cards.map((b,i)=>`<option value="${i}">${b.title}</option>`).join('');updateLessons()}
function updateLessons(){let g=GROUPS_DEF[+$('pub').value],b=g.cards[+$('book').value];$('lesson').innerHTML=b.rows.map((r,i)=>`<option value="${i}" ${!r.words?'disabled':''}>${r.label}${r.words?'':'（尚未建立）'}</option>`).join('');let idx=b.rows.findIndex(r=>r.words);if(idx>=0)$('lesson').value=idx;updateInfo()}
function row(){let g=GROUPS_DEF[+$('pub').value],b=g.cards[+$('book').value];return b.rows[+$('lesson').value]}
function updateInfo(){currentRow=row();if(!currentRow?.words){$('info').textContent='本課尚未建立題庫';$('start').disabled=true;return}let audioMode=mode==='audioHanji'||mode==='audioTailo', eligible=audioMode?currentRow.words.filter(hasAudio):currentRow.words;$('info').textContent=`${currentRow.subtitle}｜本課共 ${currentRow.words.length} 個詞語｜目前模式可練 ${eligible.length} 個${audioMode?'（有可靠音檔）':''}`;$('start').disabled=eligible.length===0;$('start').style.opacity=eligible.length===0?'.45':'1'}
/* 干擾項不足時，從同一出版社其他課次的同類欄位补足，使選項不少於4個。只补干擾項，不影響正確答案。 */
function publisherPool(){const g=GROUPS_DEF[+$('pub').value];return g.cards.flatMap(b=>b.rows.filter(r=>r.words).flatMap(r=>r.words))}
function distract(pool,key,correct,n=3){const grab=src=>[...new Set(src.flatMap(w=>key==='tailo'?cleanTailo(w[key]):[w[key]]).filter(Boolean).filter(x=>x!==correct))];let vals=shuffle(grab(pool)).slice(0,n);if(vals.length<n){const extra=shuffle(grab(publisherPool()).filter(x=>!vals.includes(x)));vals=vals.concat(extra.slice(0,n-vals.length))}return vals}
function makeQ(w,pool,type){let answer,prompt,tag,sub,audio=false;if(type==='audioHanji'){answer=w.hanji;prompt='聽讀音，選出台語漢字';tag='👂 聽讀音選台語';sub='按「🔊 播放語音」聽讀音';audio=true}else if(type==='audioTailo'){answer=cleanTailo(w.tailo)[0];prompt='聽讀音，選出台羅';tag='🎧 聽讀音選台羅';sub='按「🔊 播放語音」聽讀音';audio=true}else if(type==='hanjiTailo'){answer=cleanTailo(w.tailo)[0];prompt=w.hanji;tag='🔤 看台語選台羅';sub='這个詞按怎讀？'}else{answer=w.hanji;prompt=cleanTailo(w.tailo)[0];tag='🀄 看台羅選台語';sub='這个台羅對應佗一个詞？'}let key=(type==='audioTailo'||type==='hanjiTailo')?'tailo':'hanji';return{w,type,answer,prompt,tag,sub,audio,opts:shuffle([answer,...distract(pool,key,answer)])}}
function buildQuestions(words,n){let eligible=(mode==='audioHanji'||mode==='audioTailo')?words.filter(hasAudio):words;let chosen=n==='all'?shuffle(eligible):shuffle(eligible).slice(0,Math.min(n,eligible.length));return chosen.map(w=>makeQ(w,eligible,mode))}
function start(){currentRow=row();if(!currentRow?.words)return;questions=buildQuestions(currentRow.words,amount);if(!questions.length)return;qi=0;score=0;$('selectScreen').style.display='none';$('resultScreen').style.display='none';$('quizScreen').style.display='block';renderQ()}
function renderQ(){locked=false;let q=questions[qi];$('qnum').textContent=`第 ${qi+1} / ${questions.length} 題`;$('scoreNow').textContent=`答對 ${score} 題`;$('bar').style.width=`${qi/questions.length*100}%`;$('typeTag').textContent=q.tag;$('prompt').textContent=q.prompt;$('sub').textContent=q.sub;$('feedback').textContent='';$('next').style.display='none';$('audioBtn').style.display=q.audio?'inline-block':'none';if(q.audio){const p=$('player');const src=q.w.audio;p.onerror=null;p.pause();p.src=src;p.load();const play=()=>{p.currentTime=0;const r=p.play();if(r&&r.catch)r.catch(()=>{$('sub').textContent='請按「🔊 播放語音」聽讀音'})};p.onerror=()=>{$('sub').textContent='⚠ 音檔載入失敗：'+src};$('audioBtn').onclick=play;$('audioBtn').textContent='🔊 播放語音';setTimeout(play,200)}$('opts').innerHTML='';q.opts.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>answer(b,o);$('opts').appendChild(b)})}
function answer(btn,val){if(locked)return;locked=true;let q=questions[qi],ok=val===q.answer;if(ok)score++;[...$('opts').children].forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('good')});if(!ok)btn.classList.add('bad');$('feedback').textContent=ok?'答對矣！👏':`答案：${q.answer}`;$('scoreNow').textContent=`答對 ${score} 題`;$('next').style.display='inline-block';$('next').textContent=qi===questions.length-1?'看結果':'下一題'}
function next(){qi++;if(qi>=questions.length){$('quizScreen').style.display='none';$('resultScreen').style.display='block';let pct=Math.round(score/questions.length*100);$('finalScore').textContent=`${score} / ${questions.length}`;$('finalText').textContent=`答對率 ${pct}%｜${currentRow.subtitle}`;return}renderQ()}
function showSelect(){$('player').pause();$('quizScreen').style.display='none';$('resultScreen').style.display='none';$('selectScreen').style.display='block';updateInfo()}
init();
</script></body></html>
