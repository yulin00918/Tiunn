const VOCAB = [["面模仔", "bīn-bôo-á", "臉龐、臉蛋。"], ["不止仔", "put-tsí-á", "非常、相當的意思。"], ["輾轉", "liàn-tńg", "說話流利暢達。"], ["袂曉", "bē-hiáu", "不會、不懂。"], ["拚勢", "piànn-sè", "拚命。"], ["直直講", "ti̍t-ti̍t-kóng", "一直說。"], ["捷", "tsia̍p", "次數很頻繁。"], ["三不五時", "sam-put-gōo-sî", "不時、經常。"], ["同窗", "tông-tshong", "同學。"], ["開講", "khai-káng", "閒談聊天。"]];
let audio=new Audio(), current=0, continuous=false, playingType=null, currentVocab=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const vocabSorted=VOCAB.map((v,i)=>({w:v[0],i})).sort((a,b)=>b.w.length-a.w.length);
function marked(text){let out='',i=0;while(i<text.length){let m=vocabSorted.find(v=>text.startsWith(v.w,i));if(m){out+=`<span class="vw" data-v="${m.i}">${esc(m.w)}</span>`;i+=m.w.length}else{out+=esc(text[i++])}}return out}
const STYPES={base:['本調','#2f7d4a'],reg:['一般變調','#2b6cb0'],zai:['再變調','#d9731f'],apre:['仔前變調','#7b4fb0'],light:['輕聲','#8a8f94'],pre:['輕聲前讀本調','#2f7d4a']};
let showRom=false,showTone=false,sel=null;
function vocabIndexMap(text){const a=[];let i=0;while(i<text.length){const m=vocabSorted.find(v=>text.startsWith(v.w,i));if(m){for(const ch of [...m.w])a.push(m.i);i+=m.w.length}else{const ch=String.fromCodePoint(text.codePointAt(i));a.push(null);i+=ch.length}}return a}
function annotSeg(i){const vmap=vocabIndexMap(SEGMENTS[i]);let pos=0;const adv=t=>{const n=[...t].length;const v=vmap[pos];pos+=n;return v};
let html='';(SANDHI[i]||[]).forEach((x,g)=>{if(typeof x==='string'){adv(x);html+='<span class="ap">'+esc(x)+'</span>';return}
html+='<span class="ag">'+x.map((c,k)=>{const[han,rom,tone,act,type]=c;const v=adv(han);const col=(STYPES[type]||STYPES.base)[1];const tl=act===0?'輕':(tone===act?String(tone):tone+'→'+act);const s=sel&&sel.i===i&&sel.g===g&&sel.k===k;
return '<span class="ac'+(type==='light'?' light':'')+(v!==null&&v!==undefined?' v':'')+(s?' sel':'')+'" data-g="'+g+'" data-k="'+k+'"'+(v!==null&&v!==undefined?' data-vi="'+v+'"':'')+'><span class="r">'+esc(rom)+'</span><span class="h" style="color:'+col+'">'+esc(han)+'</span><span class="t" style="color:'+col+'">'+tl+'</span></span>'}).join('')+'</span>'});
let card='';if(sel&&sel.i===i){const c=(SANDHI[i][sel.g]||[])[sel.k];if(c){const[han,rom,tone,act,type,note,alt]=c;const T=STYPES[type]||STYPES.base;const line=act===0?'本調 第'+tone+'調 → 輕聲':(tone===act?'本調 第'+tone+'調・不變':'本調 第'+tone+'調 → 實際 第'+act+'調');
card='<div class="scard" style="border-color:'+T[1]+'"><button class="x" aria-label="關閉">×</button><div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-right:30px"><span class="big" style="color:'+T[1]+'">'+esc(han)+'</span><span style="font-size:18px;font-weight:700;color:#4d4438">'+esc(rom)+'</span><span class="lab" style="background:'+T[1]+'">'+T[0]+'</span></div><div style="margin-top:8px;font-weight:700">'+line+'</div><div style="margin-top:6px;line-height:1.7;color:#4d4438">'+esc(note||'')+'</div>'+(alt?'<div class="alt">另讀：'+esc(alt)+'</div>':'')+(sel.vi!==null&&sel.vi!==undefined?'<button class="vb">看語詞解說</button>':'')+'</div>'}}
return '<div class="atext">'+html+'</div>'+card}
function renderSegments(){ if(showRom||showTone){ const p=$('#segments');p.classList.add('annot');p.classList.toggle('noR',!showRom);p.classList.toggle('noT',!showTone);p.innerHTML=SEGMENTS.map((t,i)=>`<article class="seg" data-i="${i}"><div class="num">${i+1}</div><div>${annotSeg(i)}</div></article>`).join('');bindAnnot();setActive();return } $('#segments').classList.remove('annot','noR','noT'); $('#segments').innerHTML=SEGMENTS.map((t,i)=>`<article class="seg" data-i="${i}"><div class="num">${i+1}</div><div><div class="text">${marked(t)}</div><div class="hint">🔊 點這一段播放；點彩色詞語看解釋</div></div></article>`).join(''); bind(); setActive(); }
function bindAnnot(){ $$('#segments .seg').forEach(x=>{const i=+x.dataset.i;x.querySelector('.num').onclick=e=>{e.stopPropagation();playSegment(i,false)};x.querySelectorAll('.ac').forEach(c=>c.onclick=e=>{e.stopPropagation();sel={i,g:+c.dataset.g,k:+c.dataset.k,vi:c.dataset.vi!==undefined?+c.dataset.vi:null};renderSegments()});const card=x.querySelector('.scard');if(card){card.onclick=e=>e.stopPropagation();card.querySelector('.x').onclick=e=>{e.stopPropagation();sel=null;renderSegments()};const vb=card.querySelector('.vb');if(vb)vb.onclick=e=>{e.stopPropagation();openVocab(sel.vi)}}}); }
function syncSwitches(){ $('#swRom').classList.toggle('on',showRom);$('#swTone').classList.toggle('on',showTone);$('#legend').classList.toggle('hidden',!(showRom||showTone)); }
function renderVocab(){ $('#vocabGrid').innerHTML=VOCAB.map((v,i)=>`<article class="card"><div class="num">${i+1}</div><div><div style="font-size:20px;font-weight:700">${esc(v[0])}</div><div class="roman">${esc(v[1])}</div><div class="gloss">${esc(v[2])}</div></div><button class="speak" data-playv="${i}">🔊</button></article>`).join(''); $$('[data-playv]').forEach(b=>b.onclick=()=>playVocab(+b.dataset.playv));}
function bind(){ $$('.seg').forEach(x=>x.onclick=e=>{if(e.target.classList.contains('vw'))return;playSegment(+x.dataset.i,false)}); $$('.vw').forEach(x=>x.onclick=e=>{e.stopPropagation();openVocab(+x.dataset.v)});}
function setActive(){ $$('.seg').forEach((x,i)=>x.classList.toggle('playing',playingType==='segment'&&i===current&&!audio.paused));}
function playSegment(i,cont){current=i;continuous=cont;playingType='segment';currentVocab=null;audio.src=`audio/lesson-${String(i+1).padStart(3,'0')}.mp3`;audio.playbackRate=+$speed.value;audio.play();$status.textContent=`正在播放：第 ${i+1} 段`;setActive();}
function playVocab(i){continuous=false;playingType='vocab';currentVocab=i;audio.src=`audio/vocab-${String(i+1).padStart(2,'0')}.mp3`;audio.playbackRate=+$speed.value;audio.play();$status.textContent=`正在播放語詞：${VOCAB[i][0]}`;setActive();}
function openVocab(i){const v=VOCAB[i];$('#modalRoot').innerHTML=`<div class="modal"><article class="modalCard"><div class="num">${i+1}</div><div><div style="font-size:22px;font-weight:700">${esc(v[0])}</div><div class="roman">${esc(v[1])}</div><div class="gloss">${esc(v[2])}</div></div><button class="speak" id="modalPlay">🔊</button></article></div>`;$('.modal').onclick=e=>{if(e.target.classList.contains('modal'))$('#modalRoot').innerHTML=''};$('#modalPlay').onclick=()=>playVocab(i);}
$('#swRom').onclick=()=>{showRom=!showRom;if(!showRom&&!showTone)sel=null;syncSwitches();renderSegments()};
$('#swTone').onclick=()=>{showTone=!showTone;if(!showRom&&!showTone)sel=null;syncSwitches();renderSegments()};
const $status=$('#status'),$fill=$('#fill'),$speed=$('#speed');
audio.ontimeupdate=()=>{$fill.style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+'%'};
audio.onended=()=>{setActive();$fill.style.width='0';if(continuous&&playingType==='segment'&&current<SEGMENTS.length-1)playSegment(current+1,true);else{continuous=false;$status.textContent='播放完成';}};
$('#all').onclick=()=>playSegment(current,true);
$('#full').onclick=()=>{continuous=false;playingType='full';audio.src='audio/publisher-full.mp3';audio.playbackRate=+$speed.value;audio.play();$status.textContent='正在播放：出版社全文';setActive();};
$('#pause').onclick=()=>{if(audio.paused){audio.play();$status.textContent='繼續播放'}else{audio.pause();$status.textContent='已暫停'}setActive();};
$('#restart').onclick=()=>playSegment(0,false); $speed.onchange=()=>audio.playbackRate=+$speed.value;
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#reading').classList.toggle('hidden',b.dataset.tab!=='reading');$('#vocab').classList.toggle('hidden',b.dataset.tab!=='vocab');});
renderSegments();renderVocab();
