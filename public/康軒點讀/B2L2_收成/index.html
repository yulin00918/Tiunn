const segs=[
['🌱 立春',`「看天食飯」對作田人來講，絕對有無仝款的感受。年節過無偌久，差不多是立春的時陣，猶閣淡薄仔涼冷，作田人就愛開始無閒矣。<br><br>犁田、淹水了後，秧仔佈落去田底，若親像共希望寄託佇土地頂頭。閣來就賰用心的照顧佮向望天公伯仔的疼痛。`],
['⚡ 驚蟄 → ☀️ 立夏',`聽講驚蟄彼工若有霆雷公，這季就有好收成，阿爸講這就較無定著。毋過若是稻仔當咧弄花的時，就真正愛向望天公伯仔毋通落大雨。若無稻仔會冇去，就無通收成矣。<br><br>立夏左右，天氣就沓沓仔對秋凊轉翕熱，病蟲害就濟矣，嘛是作田人上滾絞的時陣，若顧無好，這季的收成就烏有去。`],

</script><script id="official-vocab-module">const OFFICIAL_VOCAB=[["立春", "li̍p-tshun", "國曆二月三、四或五日。這一天是春季的開始。"], ["賰", "tshun", "剩餘。"], ["驚蟄", "kenn-ti̍t", "國曆三月五、六或七日。乃春雷響，驚動冬眠動物的時候。"], ["弄花", "lāng-hue", "指授粉的階段。"], ["冇去", "phànn--khì", "結構不扎實。本課指穀子裡面沒有米粒。"], ["立夏", "li̍p-hē", "國曆五月五、六或七日。這一天是夏季的開始。"], ["滾絞", "kún-ká", "翻騰、掙扎、滾動、扭絞。"], ["夏至", "hē-tsì", "國曆六月廿、廿一或廿二日。這天晝最長夜最短。"], ["透濫", "thàu-lām", "參雜混合。"]];const VS=OFFICIAL_VOCAB.map((v,i)=>({w:v[0],i})).sort((a,b)=>b.w.length-a.w.length);function markV(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.nodeValue.trim()||n.parentElement.closest('script,style,button,.vocabBox,.modal'))return NodeFilter.FILTER_REJECT;return VS.some(v=>n.nodeValue.includes(v.w))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}}),ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{let s=n.nodeValue,f=document.createDocumentFragment(),p=0;while(p<s.length){let h=null,a=s.length;for(const v of VS){let j=s.indexOf(v.w,p);if(j>=0&&(j<a||(j===a&&(!h||v.w.length>h.w.length)))){h=v;a=j}}if(!h){f.append(s.slice(p));break}if(a>p)f.append(s.slice(p,a));let x=document.createElement('span');x.className='vw';x.dataset.v=h.i;x.textContent=h.w;f.append(x);p=a+h.w.length}n.replaceWith(f)})}function openV(i){const v=OFFICIAL_VOCAB[i],r=document.getElementById('officialModal');r.innerHTML='<div class="modal"><article class="modalCard"><button class="modalClose">關閉</button><div class="modalWord">'+v[0]+'</div><div class="modalRoman">'+v[1]+'</div><div class="modalGloss">'+v[2]+'</div></article></div>';const m=r.querySelector('.modal');m.onclick=e=>{if(e.target===m||e.target.classList.contains('modalClose'))r.innerHTML=''}}function initV(){const r=document.querySelector('main')||document.getElementById('text');if(r)markV(r);document.querySelectorAll('.vw').forEach(x=>x.onclick=e=>{e.stopPropagation();openV(+x.dataset.v)});const b=document.getElementById('officialVocabList');if(b){b.innerHTML=OFFICIAL_VOCAB.map((v,i)=>'<button class="vocabChip" data-vb="'+i+'">'+v[0]+'</button>').join('');b.querySelectorAll('[data-vb]').forEach(x=>x.onclick=()=>openV(+x.dataset.vb))}}setTimeout(initV,0);
/* 變調標注：開關打開時重畫段落為逐字標注；關閉時恢復原本段落並重新標示語詞 */
const STYPES={base:['本調','#2f7d4a'],reg:['一般變調','#2b6cb0'],zai:['再變調','#d9731f'],apre:['仔前變調','#7b4fb0'],light:['輕聲','#8a8f94'],pre:['輕聲前讀本調','#2f7d4a']};
let showRom=false,showTone=false,sel=null;const NOTE_OFF=document.getElementById('note').textContent;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function vmapOf(t){t=t.replace(/<br>/g,'');const a=[];let p=0;while(p<t.length){const m=VS.find(v=>t.startsWith(v.w,p));if(m){for(const _ of [...m.w])a.push(m.i);p+=m.w.length}else{const ch=String.fromCodePoint(t.codePointAt(p));if(!/[\s　]/.test(ch))a.push(null);p+=ch.length}}return a}
function annotSeg(i){const vm=vmapOf(segs[i][1]);let pos=0;const adv=t=>{const n=[...t].filter(c=>!/[\s　]/.test(c)).length;const v=vm[pos];pos+=n;return v};let html='';(SANDHI[i]||[]).forEach((x,g)=>{if(x==='<br>'){html+='<span class="abr"></span>';return}if(typeof x==='string'){adv(x);html+='<span class="ap">'+esc(x)+'</span>';return}html+='<span class="ag">'+x.map((c,k)=>{const[han,rom,tone,act,type]=c;const v=adv(han);const col=(STYPES[type]||STYPES.base)[1];const tl=act===0?'輕':(tone===act?String(tone):tone+'→'+act);const s=sel&&sel.i===i&&sel.g===g&&sel.k===k;const iv=v!==null&&v!==undefined;return '<span class="ac'+(type==='light'?' light':'')+(iv?' v':'')+(s?' sel':'')+'" data-g="'+g+'" data-k="'+k+'"'+(iv?' data-vi="'+v+'"':'')+'><span class="r">'+esc(rom)+'</span><span class="h" style="color:'+col+'">'+esc(han)+'</span><span class="t" style="color:'+col+'">'+tl+'</span></span>'}).join('')+'</span>'});
let card='';if(sel&&sel.i===i){const c=(SANDHI[i][sel.g]||[])[sel.k];if(c){const[han,rom,tone,act,type,note,alt]=c;const T=STYPES[type]||STYPES.base;const line=act===0?'本調 第'+tone+'調 → 輕聲':(tone===act?'本調 第'+tone+'調・不變':'本調 第'+tone+'調 → 實際 第'+act+'調');card='<div class="scard" style="border-color:'+T[1]+'"><button class="x" type="button" aria-label="關閉">×</button><div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-right:30px"><span class="big" style="color:'+T[1]+'">'+esc(han)+'</span><span style="font-size:18px;font-weight:700;color:#536b55">'+esc(rom)+'</span><span class="lab" style="background:'+T[1]+'">'+T[0]+'</span></div><div style="margin-top:8px;font-weight:700">'+line+'</div><div style="margin-top:6px">'+esc(note||'')+'</div>'+(alt?'<div class="alt">另讀：'+esc(alt)+'</div>':'')+(sel.vi!==null&&sel.vi!==undefined?'<button class="vb" type="button">看語詞解說</button>':'')+'</div>'}}
return '<div class="anno">'+html+'</div>'+card}
function renderText(){const on=showRom||showTone;const pl=[...document.querySelectorAll('.seg')].findIndex(x=>x.classList.contains('playing'));text.classList.toggle('annot',on);text.classList.toggle('noR',!showRom);text.classList.toggle('noT',!showTone);
if(!on){text.innerHTML=segs.map((s,i)=>`<section class="seg" onclick="playSeg(${i})"><div class="label">${s[0]}</div>${s[1]}</section>`).join('');markV(text);text.querySelectorAll('.vw').forEach(x=>x.onclick=e=>{e.stopPropagation();openV(+x.dataset.v)})}
else{text.innerHTML=segs.map((s,i)=>`<section class="seg" data-i="${i}"><div class="lrow"><div class="label">${s[0]}</div><button class="segplay" type="button">▶ 播放這段</button></div>${annotSeg(i)}</section>`).join('');
text.querySelectorAll('.seg').forEach(x=>{const i=+x.dataset.i;x.querySelector('.segplay').onclick=()=>playSeg(i);x.querySelectorAll('.ac').forEach(c=>c.onclick=()=>{sel={i,g:+c.dataset.g,k:+c.dataset.k,vi:c.dataset.vi!==undefined?+c.dataset.vi:null};renderText()});const card=x.querySelector('.scard');if(card){card.querySelector('.x').onclick=()=>{sel=null;renderText()};const vb=card.querySelector('.vb');if(vb)vb.onclick=()=>openV(sel.vi)}})}
if(pl>=0){const x=document.querySelectorAll('.seg')[pl];if(x)x.classList.add('playing')}}
