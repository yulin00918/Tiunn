</style><meta name="author" content="張鈺聆"><script src="../../author-credit.js"></script></head><body><div style="max-width:1050px;margin:14px auto 0;padding:0 18px"><a href="../../台語點讀.dc.html" style="color:#536b55;font-weight:800;text-decoration:none">← 回台語點讀目錄</a></div><div class="wrap"><section class="head"><div class="eyebrow">康軒版・第二冊</div><h1>第二課｜收成</h1><div class="author">散文式課文點讀｜依節氣讀出農作時間脈絡</div><div class="timeline"><span class="season">🌱 立春</span><span class="season">⚡ 驚蟄</span><span class="season">☀️ 立夏</span><span class="season">🌾 夏至・收成</span></div></section><div class="controls"><button class="primary" onclick="playAll()">▶ 逐段全文</button><button onclick="playFull()">🎧 出版社全文</button><button onclick="togglePause()">⏯ 暫停／繼續</button><button onclick="restart()">↺ 重新開始</button><button onclick="setRate(.75)">0.75×</button><button onclick="setRate(1)">1×</button><button onclick="setRate(1.25)">1.25×</button></div><main id="text"></main><p class="note">點選任一段即可播放該段。節氣標示只協助看懂文章脈絡，不改寫原課文。</p><div class="credit">網站介面與教學整合設計／製作：張鈺聆</div></div><audio id="audio"></audio><script>
const A='audio/kangxuan-b2-l2/';
const segs=[
['🌱 立春',`「看天食飯」對作田人來講，絕對有無仝款的感受。年節過無偌久，差不多是立春的時陣，猶閣淡薄仔涼冷，作田人就愛開始無閒矣。<br><br>犁田、淹水了後，秧仔佈落去田底，若親像共希望寄託佇土地頂頭。閣來就賰用心的照顧佮向望天公伯仔的疼痛。`],
['⚡ 驚蟄 → ☀️ 立夏',`聽講驚蟄彼工若有霆雷公，這季就有好收成，阿爸講這就較無定著。毋過若是稻仔當咧弄花的時，就真正愛向望天公伯仔毋通落大雨。若無稻仔會冇去，就無通收成矣。<br><br>立夏左右，天氣就沓沓仔對秋凊轉翕熱，病蟲害就濟矣，嘛是作田人上滾絞的時陣，若顧無好，這季的收成就烏有去。`],
['🌾 夏至・收成',`夏至左右，就是稻仔收成的時陣，田裡的稻仔若披一領金仔色的衫，佇咧共作田人呵咾佮喝咻。<br><br>稻仔割了愛去稻埕曝，一粒一粒猶未焦燥的粟仔對布袋仔底輾出來，袂輸若佇咧走相逐。空氣中有陣陣的清芳，共稻草的芳味佮土地的陪伴做伙透濫，跟綴阿爸佇田頭燒香的感謝，予早冬的種作有一个歡喜的結果。`]
];
let rate=1,seq=false,idx=0;const au=document.getElementById('audio'),text=document.getElementById('text');text.innerHTML=segs.map((s,i)=>`<section class="seg" onclick="playSeg(${i})"><div class="label">${s[0]}</div>${s[1]}</section>`).join('');
function clear(){document.querySelectorAll('.seg').forEach(x=>x.classList.remove('playing'))}function src(i){return A+'lesson-'+String(i+1).padStart(3,'0')+'.mp3'}function playSeg(i){seq=false;idx=i;clear();document.querySelectorAll('.seg')[i].classList.add('playing');au.src=src(i);au.playbackRate=rate;au.play()}function playAll(){seq=true;idx=0;playSeq()}function playSeq(){clear();document.querySelectorAll('.seg')[idx].classList.add('playing');au.src=src(idx);au.playbackRate=rate;au.play()}function playFull(){seq=false;clear();au.src=A+'publisher-full.mp3';au.playbackRate=rate;au.play()}au.onended=()=>{if(seq&&idx<segs.length-1){idx++;playSeq()}else{seq=false;clear()}};function togglePause(){au.paused?au.play():au.pause()}function restart(){au.currentTime=0;au.play()}function setRate(r){rate=r;au.playbackRate=r}
</script></body></html>
