<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  @keyframes popOut { 0%{transform:scale(1);} 50%{transform:scale(1.5);} 100%{transform:scale(1.2);opacity:0;} }
  @keyframes bounceIn { 0%{transform:scale(0);opacity:0;} 50%{transform:scale(1.2);} 100%{transform:scale(1);opacity:1;} }
  .lottery-ball:hover{transform:scale(1.15);z-index:10;}
  .lottery-winner{animation:popOut 0.8s ease-out forwards;z-index:100;}
  .lottery-winner-item{animation:bounceIn 0.5s ease-out;}
</style>
</helmet>
<div ref="{{rootRef}}" oncontextmenu="{{preventContext}}" style="font-family:'Nunito',sans-serif;background:radial-gradient(circle at 10% 10%, rgba(255,255,255,.95), transparent 28%),radial-gradient(circle at 90% 15%, rgba(255,205,150,.8), transparent 30%),linear-gradient(135deg, #ffe4c4, #fff3e2);min-height:100vh;color:#26304a;padding:20px;-webkit-user-select:none;user-select:none;">
  <a href="首頁.dc.html" style="display:inline-block;margin-bottom:14px;color:#b56319;font-weight:700;text-decoration:none;white-space:nowrap;">← 回首頁</a>
  <div style="max-width:1600px;margin:0 auto;display:flex;flex-wrap:wrap;gap:24px;">

    <div style="flex:1 1 420px;display:flex;flex-direction:column;gap:16px;">
      <div style="background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);border:2px solid rgba(180,150,110,0.25);border-radius:24px;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,0.25);display:flex;flex-direction:column;min-height:340px;">
        <div style="font-size:1.1rem;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:1px;color:#26304a;"><span style="width:4px;height:20px;background:#fb923c;border-radius:2px;display:inline-block;"></span>🎁 抽獎活動</div>
        <div ref="{{poolRef}}" style="flex:1;background:radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.5) 100%);border-radius:16px;position:relative;overflow:hidden;box-shadow:inset 0 10px 40px rgba(0,0,0,0.4);min-height:280px;"></div>
      </div>
      <div style="background:linear-gradient(135deg, rgba(251,146,60,0.2) 0%, rgba(234,88,12,0.1) 100%);border:2px solid rgba(251,146,60,0.4);border-radius:24px;padding:20px;">
        <div style="font-size:1.1rem;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:1px;color:#26304a;"><span style="width:4px;height:20px;background:#fb923c;border-radius:2px;display:inline-block;"></span>🎉 恭喜中獎</div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;min-height:60px;align-items:flex-start;">
          <sc-for list="{{winners}}" as="w" hint-placeholder-count="0">
            <div class="lottery-winner-item" style="background:linear-gradient(135deg, #fb923c 0%, #ea580c 100%);color:#1a1a2e;padding:8px 16px;border-radius:50px;font-weight:700;font-size:0.9rem;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(251,146,60,0.4);">
              <span style="background:rgba(0,0,0,0.15);padding:2px 8px;border-radius:20px;font-size:0.85rem;">{{w.number}}</span>
              {{w.name}}
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="flex:1 1 300px;display:flex;flex-direction:column;gap:16px;">
      <div style="background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);border:2px solid rgba(180,150,110,0.25);border-radius:24px;padding:20px;">
        <div style="font-size:1.1rem;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:1px;color:#26304a;"><span style="width:4px;height:20px;background:#fb923c;border-radius:2px;display:inline-block;"></span>⚙️ 模式選擇</div>
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button style="{{numberTabStyle}}" onClick="{{selectNumberMode}}">僅號碼</button>
          <button style="{{nameTabStyle}}" onClick="{{selectNameMode}}">號碼+姓名</button>
        </div>
        <sc-if value="{{isNumberMode}}">
          <div style="margin-bottom:6px;">
            <label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:4px;color:rgba(38,48,74,0.75);">號碼範圍</label>
            <div style="display:flex;gap:8px;align-items:center;">
              <input type="number" value="{{minNumber}}" onChange="{{onMinChange}}" min="1" style="flex:1;padding:8px 12px;border:2px solid #dfe4f2;background:#fff;color:#26304a;border-radius:12px;font-family:inherit;font-size:0.95rem;font-weight:600;outline:none;">
              <span style="font-weight:700;">至</span>
              <input type="number" value="{{maxNumber}}" onChange="{{onMaxChange}}" min="1" style="flex:1;padding:8px 12px;border:2px solid #dfe4f2;background:#fff;color:#26304a;border-radius:12px;font-family:inherit;font-size:0.95rem;font-weight:600;outline:none;">
            </div>
          </div>
        </sc-if>
        <sc-if value="{{isNameMode}}">
          <div style="margin-bottom:6px;">
            <label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:4px;color:rgba(38,48,74,0.75);">貼上號碼及姓名資料(最多300筆)</label>
            <textarea placeholder="01 方大同&#10;02 王曉明&#10;03 李小花" value="{{nameDataText}}" onChange="{{onNameDataChange}}" style="width:100%;height:80px;padding:10px;border:2px solid #dfe4f2;background:#fff;color:#26304a;border-radius:12px;font-family:inherit;font-size:0.9rem;resize:none;outline:none;"></textarea>
            <div style="font-size:0.8rem;color:rgba(38,48,74,0.75);margin-top:4px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
              <span>已輸入:{{participantCount}} / 300 筆</span>
              <div style="display:flex;gap:6px;">
                <button onClick="{{loadFromRoster}}" style="padding:4px 12px;background:rgba(94,110,231,0.15);border:1px solid rgba(94,110,231,0.4);border-radius:6px;color:#4650cc;cursor:pointer;font-size:0.8rem;font-weight:600;">📥 從學生名單載入</button>
                <button onClick="{{toggleExample}}" style="padding:4px 12px;background:rgba(251,146,60,0.25);border:1px solid rgba(251,146,60,0.5);border-radius:6px;color:#b56319;cursor:pointer;font-size:0.8rem;font-weight:600;">{{exampleLabel}}</button>
              </div>
            </div>
          </div>
        </sc-if>
      </div>

      <div style="background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);border:2px solid rgba(180,150,110,0.25);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:1.1rem;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:1px;color:#26304a;"><span style="width:4px;height:20px;background:#fb923c;border-radius:2px;display:inline-block;"></span>🎯 抽獎設定</div>
        <div style="display:flex;gap:8px;">
          <button style="{{repeatOnStyle}}" onClick="{{selectRepeatOn}}">重複中獎</button>
          <button style="{{repeatOffStyle}}" onClick="{{selectRepeatOff}}">不重複中獎</button>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <label style="font-weight:600;font-size:0.9rem;white-space:nowrap;color:#26304a;">中獎人數</label>
          <select value="{{winnerCount}}" onChange="{{onWinnerCountChange}}" style="flex:1;padding:8px 12px;border:2px solid #dfe4f2;background:#fff;color:#26304a;border-radius:12px;font-family:inherit;font-size:0.95rem;font-weight:600;outline:none;">
            <sc-for list="{{countOptions}}" as="n" hint-placeholder-count="0">
              <option value="{{n}}">{{n}} 位</option>
            </sc-for>
          </select>
        </div>
        <div style="display:flex;gap:10px;margin-top:auto;">
          <button onClick="{{resetGame}}" style="flex:1;padding:12px 16px;border:2px solid #dfe4f2;border-radius:16px;font-family:inherit;font-weight:800;font-size:1rem;cursor:pointer;text-transform:uppercase;letter-spacing:1px;background:#eef0ff;color:#4650cc;">重置</button>
          <button onClick="{{startDraw}}" disabled="{{isDrawing}}" style="{{startBtnStyle}}">開始抽獎</button>
        </div>
      </div>
    </div>

  </div>

  <div ref="{{confettiRef}}" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1000;overflow:hidden;"></div>

  <sc-if value="{{modalShow}}">
    <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(5px);">
      <div style="background:#fff;padding:32px;border-radius:24px;text-align:center;max-width:400px;width:90%;border:3px solid #ffe0bb;box-shadow:0 20px 60px rgba(0,0,0,0.2);color:#26304a;">
        <h2 style="font-size:1.5rem;margin-bottom:16px;">{{modalTitle}}</h2>
        <p style="margin-bottom:24px;color:#6f7890;">{{modalMessage}}</p>
        <button onClick="{{closeModal}}" style="width:100%;padding:12px 16px;border:none;border-radius:16px;font-family:inherit;font-weight:800;font-size:1rem;cursor:pointer;text-transform:uppercase;letter-spacing:1px;background:linear-gradient(135deg, #2dd4bf 0%, #0d9488 100%);color:#1a1a2e;">確定</button>
      </div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const BALL_GRADIENTS = [
  'linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%)','linear-gradient(135deg, #4ecdc4 0%, #44a8a0 100%)',
  'linear-gradient(135deg, #ffe66d 0%, #ffd93d 100%)','linear-gradient(135deg, #95e1d3 0%, #7ec8bc 100%)',
  'linear-gradient(135deg, #f38181 0%, #e66767 100%)','linear-gradient(135deg, #aa96da 0%, #9681c4 100%)',
  'linear-gradient(135deg, #fcbad3 0%, #f5a3c4 100%)','linear-gradient(135deg, #a8d8ea 0%, #93c9dc 100%)',
];
const EXAMPLE_DATA = `1\t朱○潔\n2\t何○敏\n3\t何○寧\n4\t吳○亘\n5\t李○芯\n6\t卓○希\n7\t林○硯\n8\t林○筠\n9\t張○芸\n10\t許○涵\n11\t陳○妍\n12\t黃○蘊\n13\t楊○寧\n14\t葉○蓁\n15\t劉○瑄\n16\t蔡○蓁\n17\t賴○妤\n18\t謝○妡\n19\t王○崴\n20\t呂○聿`;
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

class Component extends DCLogic {
  state = {
    mode: 'number', minNumber: 1, maxNumber: 50, nameDataText: '', participants: [],
    allowRepeat: false, winnerCount: 1, winners: [], isDrawing: false,
    modalShow: false, modalTitle: '', modalMessage: '', exampleShown: false,
  };
  rootRef = React.createRef();
  poolRef = React.createRef();
  confettiRef = React.createRef();
  floatingBalls = [];
  floatingInterval = null;
  burstUntil = 0;

  componentDidMount() { this.generateBalls(); }
  componentWillUnmount() { this.stopFloatingAnimation(); }

  preventContext(e) { e.preventDefault(); return false; }

  loadFromRoster() {
    try {
      const raw = localStorage.getItem('teacherToolboxClassData');
      if (!raw) { this.showModal('提示', '目前教學百寶箱裡沒有學生名單，請先到「學生名單」分頁建立。'); return; }
      const data = JSON.parse(raw);
      const cls = data.classes && data.currentClassId ? data.classes[data.currentClassId] : data;
      const students = cls && cls.students ? cls.students : [];
      if (!students.length) { this.showModal('提示', '目前班級的學生名單是空的。'); return; }
      const text = students.map(s => `${s.seatNumber || ''}\t${s.name}`).join('\n');
      this.setState({ mode: 'name', nameDataText: text, participants: this.parseNameData(text) }, () => this.generateBalls());
    } catch (e) { this.showModal('提示', '讀取學生名單失敗。'); }
  }

  parseNameData(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const parsed = [];
    for (const line of lines) {
      if (parsed.length >= 300) break;
      const match = line.match(/^(\S+)[\s\t]+(.*)$/);
      if (match) parsed.push({ number: match[1].trim(), name: match[2].trim() });
      else parsed.push({ number: line, name: '' });
    }
    return parsed;
  }

  generateBalls() {
    const pool = this.poolRef.current;
    if (!pool) return;
    pool.innerHTML = '';
    this.stopFloatingAnimation();

    let items = [];
    if (this.state.mode === 'number') {
      const min = parseInt(this.state.minNumber) || 1;
      const max = parseInt(this.state.maxNumber) || 50;
      for (let i = min; i <= max; i++) items.push({ number: String(i).padStart(2, '0'), name: '' });
    } else {
      items = [...this.state.participants];
    }
    if (!this.state.allowRepeat) {
      items = items.filter(item => !this.state.winners.some(w => w.number === item.number));
    }

    const rect = pool.getBoundingClientRect();
    const poolWidth = rect.width || 300;
    const poolHeight = rect.height || 280;
    const ballSize = 42, padding = 5;
    this.floatingBalls = [];

    items.forEach((item, index) => {
      const ball = document.createElement('div');
      ball.className = 'lottery-ball';
      ball.textContent = item.number;
      ball.title = item.name ? `${item.number} - ${item.name}` : item.number;
      const x = padding + Math.random() * Math.max(1, poolWidth - ballSize - padding * 2);
      const y = padding + Math.random() * Math.max(1, poolHeight - ballSize - padding * 2);
      Object.assign(ball.style, {
        position: 'absolute', width: '42px', height: '42px', borderRadius: '50%',
        display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800',
        fontSize: '0.75rem', color: '#1a1a2e', cursor: 'pointer', left: `${x}px`, top: `${y}px`,
        background: BALL_GRADIENTS[index % 8],
        boxShadow: 'inset -3px -3px 8px rgba(0,0,0,0.3), inset 3px 3px 8px rgba(255,255,255,0.4), 0 4px 8px rgba(0,0,0,0.3)',
      });
      ball.dataset.number = item.number;
      ball.dataset.name = item.name;
      pool.appendChild(ball);
      this.floatingBalls.push({ element: ball, x, y, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5 });
    });

    this.startFloatingAnimation(poolWidth, poolHeight, ballSize, padding);
  }

  startFloatingAnimation(poolWidth, poolHeight, ballSize, padding) {
    if (this.floatingInterval) return;
    this.floatingInterval = setInterval(() => {
      const boost = Date.now() < this.burstUntil ? 6 : 1;
      this.floatingBalls.forEach(b => {
        b.x += b.vx * boost; b.y += b.vy * boost;
        if (b.x <= padding) { b.x = padding; b.vx *= -1; }
        else if (b.x >= poolWidth - ballSize - padding) { b.x = poolWidth - ballSize - padding; b.vx *= -1; }
        if (b.y <= padding) { b.y = padding; b.vy *= -1; }
        else if (b.y >= poolHeight - ballSize - padding) { b.y = poolHeight - ballSize - padding; b.vy *= -1; }
        b.element.style.left = `${b.x}px`;
        b.element.style.top = `${b.y}px`;
      });
    }, 16);
  }
  stopFloatingAnimation() { if (this.floatingInterval) { clearInterval(this.floatingInterval); this.floatingInterval = null; } }

  initAudio() { if (!this.audioContext) this.audioContext = new (window.AudioContext || window.webkitAudioContext)(); return this.audioContext; }
  playTypewriterSound(duration) {
    const ctx = this.initAudio();
    const startTime = ctx.currentTime, endTime = startTime + duration / 1000;
    const playClick = (time, volume) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(800 + Math.random() * 400, time);
      gain.gain.setValueAtTime(volume * 0.15, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(time); osc.stop(time + 0.03);
    };
    let t = startTime, interval = 0.05, volume = 1;
    while (t < endTime) { playClick(t, volume); t += interval; interval += 0.002; volume *= 0.995; }
  }
  playCelebrationSound() {
    const ctx = this.initAudio(); const now = ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.2, now + 0.05 + i * 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(now + i * 0.05); osc.stop(now + 1);
    });
  }

  createConfetti() {
    const container = this.confettiRef.current;
    if (!container) return;
    const colors = ['#fb923c', '#2dd4bf', '#38bdf8', '#ffe66d', '#f97316', '#0ea5e9', '#5eead4', '#fdba74'];
    for (let i = 0; i < 50; i++) {
      const c = document.createElement('div');
      Object.assign(c.style, {
        position: 'absolute', width: '10px', height: '10px', left: Math.random() * 100 + 'vw', top: '-10px',
        backgroundColor: colors[Math.floor(Math.random() * colors.length)],
        transform: `rotate(${Math.random() * 360}deg)`, borderRadius: Math.random() > 0.5 ? '50%' : '0',
      });
      container.appendChild(c);
      const anim = c.animate([{ top: '-10px', opacity: 1 }, { top: '100vh', opacity: 0 }], {
        duration: 2000 + Math.random() * 2000, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
      });
      anim.onfinish = () => c.remove();
    }
  }

  async startDraw() {
    if (this.state.isDrawing) return;
    const pool = this.poolRef.current;
    const balls = pool ? Array.from(pool.querySelectorAll('.lottery-ball')) : [];
    if (balls.length === 0) { this.showModal('提示', '球池中沒有可抽取的球!'); return; }
    const winnerCount = parseInt(this.state.winnerCount);
    if (!this.state.allowRepeat && balls.length < winnerCount) {
      this.showModal('提示', `球池中只剩 ${balls.length} 顆球,無法抽出 ${winnerCount} 位中獎者!`); return;
    }
    this.setState({ isDrawing: true });
    this.playTypewriterSound(800);
    this.burstUntil = Date.now() + 800;
    await sleep(800);

    const newWinners = [];
    const availableForDraw = [...balls];
    for (let i = 0; i < winnerCount; i++) {
      if (availableForDraw.length === 0) break;
      const idx = Math.floor(Math.random() * availableForDraw.length);
      const selected = availableForDraw[idx];
      if (!this.state.allowRepeat) availableForDraw.splice(idx, 1);
      newWinners.push({ number: selected.dataset.number, name: selected.dataset.name });
      selected.classList.add('lottery-winner');
      await sleep(300);
    }
    this.playCelebrationSound();
    const winners = [...this.state.winners, ...newWinners];
    this.setState({ winners });

    setTimeout(() => {
      this.generateBalls();
      this.setState({ isDrawing: false });
      if (!this.state.allowRepeat) {
        const remaining = this.poolRef.current ? this.poolRef.current.querySelectorAll('.lottery-ball').length : 0;
        if (remaining === 0) this.showModal('🎊 抽獎完成', '所有球都已被抽出!');
      }
      this.createConfetti();
    }, 500);
  }

  showModal(title, message) { this.setState({ modalShow: true, modalTitle: title, modalMessage: message }); }
  closeModal() { this.setState({ modalShow: false }); }
  resetGame() { this.setState({ winners: [] }, () => this.generateBalls()); }

  renderVals() {
    const s = this.state;
    const isNumberMode = s.mode === 'number';
    const tabStyle = (active) => `flex:1;padding:8px 12px;border:2px solid ${active ? '#fb923c' : '#dfe4f2'};background:${active ? '#fb923c' : '#fff'};color:${active ? '#1a1a2e' : '#26304a'};border-radius:12px;font-family:inherit;font-weight:700;font-size:0.85rem;cursor:pointer;`;
    const repeatStyle = (active) => `flex:1;padding:8px 8px;border:2px solid ${active ? '#2dd4bf' : '#dfe4f2'};background:${active ? '#2dd4bf' : '#fff'};color:${active ? '#1a1a2e' : '#26304a'};border-radius:12px;font-family:inherit;font-weight:700;font-size:0.8rem;cursor:pointer;`;

    return {
      winners: s.winners,
      isNumberMode, isNameMode: !isNumberMode,
      numberTabStyle: tabStyle(isNumberMode), nameTabStyle: tabStyle(!isNumberMode),
      selectNumberMode: () => this.setState({ mode: 'number' }, () => this.generateBalls()),
      selectNameMode: () => this.setState({ mode: 'name' }, () => this.generateBalls()),
      minNumber: s.minNumber, maxNumber: s.maxNumber,
      onMinChange: (e) => this.setState({ minNumber: e.target.value }, () => this.generateBalls()),
      onMaxChange: (e) => this.setState({ maxNumber: e.target.value }, () => this.generateBalls()),
      nameDataText: s.nameDataText,
      onNameDataChange: (e) => {
        const text = e.target.value;
        this.setState({ nameDataText: text, participants: this.parseNameData(text) }, () => this.generateBalls());
      },
      participantCount: s.participants.length,
      exampleLabel: s.exampleShown ? '清除' : '範例',
      toggleExample: () => {
        const show = !s.exampleShown;
        const text = show ? EXAMPLE_DATA : '';
        this.setState({ exampleShown: show, nameDataText: text, participants: this.parseNameData(text) }, () => this.generateBalls());
      },
      repeatOnStyle: repeatStyle(s.allowRepeat), repeatOffStyle: repeatStyle(!s.allowRepeat),
      selectRepeatOn: () => this.setState({ allowRepeat: true }, () => this.generateBalls()),
      selectRepeatOff: () => this.setState({ allowRepeat: false }, () => this.generateBalls()),
      winnerCount: s.winnerCount,
      onWinnerCountChange: (e) => this.setState({ winnerCount: e.target.value }),
      countOptions: Array.from({ length: 30 }, (_, i) => i + 1),
      isDrawing: s.isDrawing,
      startBtnStyle: `flex:1;padding:12px 16px;border:none;border-radius:16px;font-family:inherit;font-weight:800;font-size:1rem;text-transform:uppercase;letter-spacing:1px;background:linear-gradient(135deg, #2dd4bf 0%, #0d9488 100%);color:#1a1a2e;cursor:${s.isDrawing ? 'not-allowed' : 'pointer'};opacity:${s.isDrawing ? 0.5 : 1};`,
      startDraw: () => this.startDraw(),
      resetGame: () => this.resetGame(),
      modalShow: s.modalShow, modalTitle: s.modalTitle, modalMessage: s.modalMessage,
      closeModal: () => this.closeModal(),
      rootRef: this.rootRef, poolRef: this.poolRef, confettiRef: this.confettiRef,
      preventContext: (e) => this.preventContext(e),
      loadFromRoster: () => this.loadFromRoster(),
    };
  }
}

</script>
</body>
