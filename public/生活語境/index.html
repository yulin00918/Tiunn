<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🌿 生活語境｜語境判讀所｜鈺見台語</title>
<meta name="author" content="張鈺聆"><meta name="copyright" content="© 張鈺聆"><script src="../author-credit.js"></script>
<style>
:root{--ink:#30443b;--muted:#718079;--line:#dfe7e2;--accent:#5f8971;--soft:#edf5ef;--paper:#fff;--bad:#fff0ef;--ok:#edf8f1;--shadow:0 10px 28px #31473e14}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fafcf8,#eef4ef);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}button{font:inherit}.app{max-width:1080px;margin:auto;padding:28px 22px 70px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.pill{border:0;background:#fff;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);font-weight:800;color:var(--ink);cursor:pointer}.hero{text-align:center;margin:24px 0 34px}.hero .icon{font-size:54px}.hero h1{font-size:clamp(36px,6vw,54px);margin:4px 0 8px}.hero p{color:var(--muted);font-size:18px;line-height:1.6}.topicGrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.topicCard{border:1px solid var(--line);background:#fff;border-radius:22px;padding:22px;text-align:left;display:grid;grid-template-columns:58px 1fr 24px;gap:15px;align-items:center;box-shadow:var(--shadow);color:inherit;width:100%;cursor:pointer}.topicCard:hover:not(.disabled){transform:translateY(-2px)}.topicCard.disabled{opacity:.58;cursor:default}.topicIcon{font-size:40px}.topicCard h3{font-size:21px;margin:0 0 5px}.topicCard p{margin:0;color:var(--muted);line-height:1.5}.count{display:inline-block;margin-top:8px;font-size:13px;font-weight:900;color:var(--accent);background:var(--soft);padding:4px 9px;border-radius:999px}.arrow{font-size:22px;color:var(--accent)}.panel{max-width:760px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:26px;padding:32px;box-shadow:var(--shadow);text-align:center}.bigIcon{font-size:58px}.panel h2{font-size:34px;margin:8px 0}.panel p{color:var(--muted);line-height:1.6}.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.amount{border:1px solid #d8e4dc;background:#f7faf8;border-radius:16px;padding:17px 10px;font-weight:900;color:var(--ink);cursor:pointer}.amount:hover{background:#edf6ef}.amount:disabled{opacity:.5}.quizWrap{max-width:820px;margin:auto}.quizHead{text-align:center;margin:16px 0 18px}.quizHead h2{font-size:30px;margin:0 0 6px}.bar{height:11px;background:#e5ebe8;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent);transition:.25s}.progressMeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:8px 0 14px}.qcard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow)}.qmeta{display:flex;justify-content:space-between;color:#7b6f5f;font-weight:900;margin-bottom:12px}.context{background:#f5f8f6;border-left:4px solid #9ab7a4;padding:15px 17px;border-radius:10px;margin:8px 0 16px;line-height:1.7}.question{font-size:25px;font-weight:900;line-height:1.55;margin:10px 0 22px}.options{display:grid;gap:11px}.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid #dce4df;background:#fff;border-radius:15px;padding:15px;text-align:left;font-weight:700;cursor:pointer}.opt b{width:28px}.opt.correct{background:var(--ok);border-color:#8ebaa0}.opt.wrong{background:var(--bad);border-color:#d7a09a}.opt.locked{cursor:default}.feedback{margin-top:17px;padding:15px;border-radius:14px;line-height:1.6}.feedback.ok{background:var(--ok)}.feedback.bad{background:var(--bad)}.next{border:0;background:#354d46;color:#fff;font-weight:900;border-radius:14px;padding:12px 18px;margin-top:12px;cursor:pointer}.resultScore{font-size:58px;font-weight:900;color:var(--accent);margin:6px}.breakdown{margin:22px 0;text-align:left}.typeRow{display:flex;justify-content:space-between;border-bottom:1px solid #edf0ee;padding:11px 3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{border:0;border-radius:14px;padding:13px;font-weight:900;cursor:pointer}.primary{background:#354d46;color:#fff}.secondary{background:#e9efec;color:#31443c}.note{margin-top:2 </style></head><body><main class="app">
<div class="top"><button class="pill" id="backHome">← 語境挑戰</button><span class="pill">🌿 生活語境</span></div>
<section id="topics"><header class="hero"><div class="icon">🌿</div><h1>生活語境</h1><p>揀一个生活主題，對情境內底練習真正用會著的台語。</p></header><div class="topicGrid" id="topicGrid"></div><div class="note">題庫與程式已分開。之後新增題目，只需編輯 <b>data/question-bank.js</b>。</div></section>
<section id="setup" class="hidden"><div class="panel"><div class="bigIcon" id="setupIcon"></div><h2 id="setupTitle"></h2><p id="setupDesc"></p><b id="available"></b><h3 style="margin-top:28px">這擺欲挑戰幾題？</h3><div class="amounts" id="amounts"></div><br><button class="pill" id="setupBack">← 換一个主題</button></div></section>
