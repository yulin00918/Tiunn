<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
</helmet>
<div style="font-family:'Noto Sans TC',sans-serif;background:linear-gradient(135deg, #ffd9a0 0%, #ffc2b0 20%, #f3b6d3 40%, #d6b8ec 60%, #b9d3f0 80%, #a9e3ec 100%);min-height:100vh;padding:40px;">
  <div style="max-width:1000px;margin:0 auto;">
    <a href="首頁.dc.html" style="display:inline-block;margin-bottom:20px;color:#a3690c;font-weight:700;text-decoration:none;">← 回首頁</a>
    <h1 style="font-size:32px;font-weight:900;color:#a3690c;margin-bottom:8px;">🎵 羅馬字發音</h1>
    <p style="font-size:15px;color:#4a4540;margin-bottom:24px;">建立正確拼音基礎,提升發音準確度。</p>

    <div style="display:flex;gap:10px;margin-bottom:20px;">
      <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="2">
        <button style="{{tab.btnStyle}}" onClick="{{tab.onClick}}">{{tab.label}}</button>
      </sc-for>
    </div>

    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="2">
      <sc-if value="{{tab.activeCombo}}">
        <dc-import name="羅馬字組合練習" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{tab.activeSystem}}">
        <dc-import name="台語羅馬字拼音系統" hint-size="100%,900px"></dc-import>
      </sc-if>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { activeTab: 0 };
  renderVals() {
    const data = [
      { label: '台語羅馬字拼音系統', isSystem: true, isCombo: false },
      { label: '台語拼音練習', placeholder: '在此貼上羅馬字組合練習內容', isCombo: true },
    ];
    const tabs = data.map((d, i) => {
      const active = i === this.state.activeTab;
      return {
        ...d,
        active,
        activeCombo: active && d.isCombo,
        activeSystem: active && d.isSystem,
        onClick: () => this.setState({ activeTab: i }),
        btnStyle: `padding:10px 20px;border-radius:12px;border:none;font-weight:700;font-size:14px;cursor:pointer;background:${active ? '#a3690c' : '#ffffffaa'};color:${active ? '#fff' : '#a3690c'};`,
      };
    });
    return { tabs };
  }
}

</script>
</body>
</html>
