<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  a{color:inherit;text-decoration:none;}
  .tl-wrap,.tl-wrap *{box-sizing:border-box;}
  @media(hover:hover){
    .tl-home:hover{background:rgba(255,255,255,.24) !important;}
    .tl-tab:hover{border-color:#55A99C !important;}
  }
  /* 鈺見台語｜臺羅練功房 V2：溫暖活潑版（僅換色，同形音義挑戰） */
  button:focus-visible,a:focus-visible{outline:3px solid #F4C65D;outline-offset:2px;}
</style>
</helmet>
<div class="tl-wrap" style="font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;color:#263B37;min-height:100vh;background:radial-gradient(circle at 7% 9%,rgba(244,198,93,.23),transparent 26%),radial-gradient(circle at 95% 17%,rgba(85,169,156,.17),transparent 28%),#FAF8F2;">

  <div style="background:linear-gradient(110deg,#254E47,#316E62 78%,#37877B);border-bottom:4px solid #F4C65D;color:#fff;">
    <div style="max-width:1080px;margin:auto;min-height:66px;padding:12px 22px;display:flex;align-items:center;gap:14px;">
      <a class="tl-home" href="首頁.dc.html" style="flex:0 0 auto;display:inline-flex;align-items:center;min-height:44px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:14px;font-weight:800;white-space:nowrap;">🏠 回首頁</a>
      <div style="min-width:0;text-align:center;flex:1;">
        <div style="font-size:clamp(19px,3.4vw,22px);font-weight:900;letter-spacing:.08em;line-height:1.35;">🎵 臺羅練功房</div>
        <div style="margin-top:3px;font-size:12.5px;color:#E7F2E9;font-weight:700;line-height:1.5;">建立正確拼音基礎，提升發音準確度</div>
      </div>
      <div style="flex:0 0 auto;width:104px;"></div>
    </div>
  </div>

  <div style="position:relative;background:linear-gradient(105deg,#FFF1D4 0%,#FFE1CA 51%,#DDF1E9 100%);border-bottom:1px solid #F1D5B4;overflow:hidden;">
    <div style="max-width:1080px;margin:auto;padding:16px 22px 20px;display:flex;align-items:center;gap:14px;position:relative;z-index:1;">
      <span style="flex:0 0 auto;font-size:24px;transform:rotate(-8deg);">🔤</span>
      <div style="background:#fff;border:1px solid #F4C990;border-radius:16px 16px 16px 4px;padding:11px 16px;box-shadow:0 6px 16px rgba(160,103,50,.10);">
        <div style="font-size:11.5px;font-weight:900;letter-spacing:.14em;color:#B15F2A;">今日練功</div>
        <div style="margin-top:4px;font-size:14.5px;font-weight:800;color:#594936;line-height:1.6;">揀一項開始：先看拼音系統，抑是直接練組合。</div>
      </div>
    </div>
    <svg viewBox="0 0 1440 16" preserveAspectRatio="none" style="position:absolute;left:0;right:0;bottom:-1px;width:100%;height:16px;display:block;"><path d="M0,10 C240,2 480,15 720,8 C960,2 1200,14 1440,7 L1440,16 L0,16 Z" fill="#FAF8F2"></path></svg>
  </div>

  <main style="max-width:1080px;margin:auto;padding:22px 22px 0;">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:20px;">
      <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="2">
        <button class="tl-tab" style="{{tab.btnStyle}}" onClick="{{tab.onClick}}">
          <span style="display:flex;align-items:center;gap:11px;">
            <span style="font-size:26px;line-height:1;">{{tab.icon}}</span>
            <span style="text-align:left;min-width:0;">
              <span style="display:block;font-size:16.5px;font-weight:900;line-height:1.3;">{{tab.label}}</span>
              <span style="display:block;margin-top:3px;font-size:12.5px;font-weight:700;opacity:.78;line-height:1.5;">{{tab.hint}}</span>
            </span>
          </span>
        </button>
      </sc-for>
    </div>

    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="2">
      <sc-if value="{{tab.activeCombo}}">
        <dc-import name="羅馬字組合練習" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{tab.activeSystem}}">
        <dc-import name="台語羅馬字拼音系統" hint-size="100%,900px"></dc-import>
      </sc-if>
    </sc-for>
  </main>

  <div style="max-width:1080px;margin:22px auto 0;padding:0 22px 34px;font-size:12px;color:#77847C;font-weight:700;text-align:center;">
    <span style="color:#7d8f86;">張鈺聆 製</span>｜鈺見台語
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { activeTab: 0 };
  renderVals() {
    const data = [
      { label: '台語羅馬字拼音系統', icon: '📖', hint: '聲母・韻母・聲調對照複習', isSystem: true, isCombo: false },
      { label: '台語拼音練習', icon: '🎧', hint: '聲母＋韻母＋聲調拼看覓', placeholder: '在此貼上羅馬字組合練習內容', isCombo: true },
    ];
    const tabs = data.map((d, i) => {
      const active = i === this.state.activeTab;
      return {
        ...d,
        active,
        activeCombo: active && d.isCombo,
        activeSystem: active && d.isSystem,
        onClick: () => this.setState({ activeTab: i }),
        btnStyle: `display:flex;align-items:center;padding:16px 18px;border-radius:20px;border:2px solid ${active ? '#254E47' : '#E7DCC9'};font-family:inherit;cursor:pointer;min-height:76px;text-align:left;transition:.16s ease;background:${active ? '#254E47' : '#FFFCF4'};color:${active ? '#fff' : '#385A53'};box-shadow:${active ? '0 10px 22px rgba(37,78,71,.20)' : '0 6px 16px rgba(38,78,71,.05)'};`,
      };
    });
    return { tabs };
  }
}

</script>
</body>
</html>
