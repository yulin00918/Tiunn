    <div style="min-width:0;flex:1;">
      <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;">
        <span style="flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:5px 11px;border-radius:999px;background:#315C63;color:#fff;font-size:11.5px;font-weight:900;white-space:nowrap;">臺羅練功房</span>
        <h1 style="margin:0;font-size:clamp(19px,3vw,23px);font-weight:900;letter-spacing:.04em;line-height:1.3;">台語拼音練習</h1>
      </div>
      <div style="margin-top:5px;font-size:12.5px;color:#7d8a8b;font-weight:700;line-height:1.6;">揀聲母＋韻母＋聲調，組成音節，聽看覓按怎唸</div>
    </div>
  </div>

    <div style="border-radius:16px;padding:14px;border:1px solid #e4dece;background:#FFFEFA;box-shadow:0 6px 16px rgba(49,92,99,.05);">
      <h2 style="font-size:0.95rem;margin:0 0 10px;text-align:center;letter-spacing:0.15em;color:#7A8F6B;">聲母</h2>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
        <sc-for list="{{siannButtons}}" as="btn" hint-placeholder-count="18">
          <button style="{{btn.style}}" onClick="{{btn.onClick}}">
            {{btn.label}}
            <sc-if value="{{btn.hasAudio}}">
              <span style="position:absolute;top:-6px;right:-6px;font-size:0.65rem;background:#fff;border:1px solid #d9d3c4;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;line-height:1;cursor:pointer;z-index:2;" onClick="{{btn.playAudio}}">🔊</span>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="border-radius:16px;padding:14px;border:1px solid #e4dece;background:#FFFEFA;box-shadow:0 6px 16px rgba(49,92,99,.05);">
      <h2 style="font-size:0.95rem;margin:0 0 10px;text-align:center;letter-spacing:0.15em;color:#315C63;">韻母</h2>

              </sc-if>
            </button>
          </sc-for>
        </sc-for>
      </div>
    </div>

    <div style="border-radius:16px;padding:14px;border:1px solid #e4dece;background:#FFFEFA;box-shadow:0 6px 16px rgba(49,92,99,.05);">

            <div style="color:#7d8a8b;font-size:0.95rem;">{{m.lomaji}}</div>

            <sc-if value="{{m.noAudio}}"><span style="margin-left:auto;flex:0 0 auto;font-size:0.8rem;font-weight:700;color:#7d8a8b;background:#F0EBE0;border-radius:999px;padding:7px 12px;white-space:nowrap;">目前無發音</span></sc-if>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{noMatch}}">
        <div style="text-align:center;padding:10px 0;">
          本站沒有「{{noMatchKey}}」的音檔,幫你連到教育部臺灣台語常用詞辭典查詢:
          <br>
          <a href="{{dictUrl}}" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px;background:#315C63;color:#fff;text-decoration:none;padding:10px 22px;border-radius:999px;font-weight:600;">前往辭典查詢 →</a>
        </div>
      </sc-if>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const SIANN_LIST = ['p','ph','m','b','t','th','n','l','k','kh','ng','g','ts','tsh','s','j','h'];

function placeTone(syll, tone) {
  const markMap = {2:'\u0301', 3:'\u0300', 5:'\u0302', 7:'\u0304', 8:'\u030d'};
  if (!markMap[tone]) return syll;
  const mark = markMap[tone];
  let idx = -1;
  if (syll.includes('oo')) idx = syll.indexOf('oo');
  else if (syll.includes('a')) idx = syll.indexOf('a');
  else if (syll.includes('o')) idx = syll.indexOf('o');
  else if (syll.includes('e')) idx = syll.indexOf('e');
  else {
    for (let i = syll.length - 1; i >= 0; i--) { if (syll[i]==='i'||syll[i]==='u') { idx = i; break; } }
    if (idx === -1) { if (syll.includes('ng')) idx = syll.indexOf('ng'); else if (syll.includes('m')) idx = syll.indexOf('m'); }
  }
  if (idx === -1) return syll + mark;
  return (syll.slice(0, idx+1) + mark + syll.slice(idx+1)).normalize('NFC');
}
/* 組合結果音檔：多數為 audio/{id}.mp3；少數同一教育部詞條存於其他檔名（已核對漢字＋臺羅一致） */

class Component extends DCLogic {
  state = { siann: null, un: null, tiau: null, result: null, lookup: null };
  componentDidMount() {
    import('./lookup-data.js').then(m => this.setState({ lookup: m.default }));
  }
  select(kind, value) {
    this.setState({ [kind]: value, result: null });
  }
  clearAll() { this.setState({ siann: null, un: null, tiau: null, result: null }); }
  goBack() {
    if (this.state.tiau !== null) this.setState({ tiau: null, result: null });
    else if (this.state.un !== null) this.setState({ un: null, result: null });
    else if (this.state.siann !== null) this.setState({ siann: null, result: null });
  }
  submit() {
    const { siann, un, tiau, lookup } = this.state;
    const key = (siann || '') + un + tiau;
    const matches = lookup ? lookup[key] : null;
    this.setState({ result: { key, matches: matches || null } });
  }
  renderVals() {
    const { siann, un, tiau, result } = this.state;

    const siannButtons = [{ label: '（無聲母）', style: `grid-column:1 / -1;font-size:0.8rem;position:relative;font-family:inherit;padding:8px 4px;border-radius:8px;border:1.5px solid #ddd0bd;background:${siann===''?'#7A8F6B':'#fff'};color:${siann===''?'#fff':'#243337'};cursor:pointer;`, onClick: () => this.select('siann',''), hasAudio: false, playAudio: null }]

    const unGroups = UN_GROUPS_DEF.map(([label, list]) => ({

      items: list.map(u => {
        const selected = un === u;

        return {

          style: `position:relative;font-family:inherit;font-size:0.95rem;padding:8px 4px;border-radius:8px;border:1.5px solid #ddd0bd;background:${selected?'#315C63':'#fff'};color:${selected?'#fff':'#243337'};cursor:pointer;`,

          hasAudio: !!(customUrl || ex),
          playAudio: (customUrl || ex) ? (e) => { e.stopPropagation(); if (customUrl) playUrl(customUrl); else playFile(ex[0]); } : null,
        };
      }),
    }));

    const tiauButtons = TIAU_LIST.map(t => {
      const selected = tiau === t;
      const disabled = t === 6;
      return {
        label: String(t),
        disabled,
        style: `font-family:inherit;font-size:0.95rem;padding:8px 4px;border-radius:8px;border:1.5px solid #ddd0bd;background:${selected?'#B07B4F':'#fff'};color:${selected?'#fff':'#243337'};cursor:${disabled?'not-allowed':'pointer'};opacity:${disabled?0.35:1};`,
        onClick: disabled ? null : () => this.select('tiau', t),
      };
    });

    const base = (siann || '') + (un || '');
    const previewSyll = (un === null || tiau === null) ? '--' : placeTone(base, tiau);
    const previewParts = (un === null || tiau === null) ? '請選擇聲母、韻母、聲調' : `聲母:${siann || '（無）'}　韻母:${un}　聲調:第${tiau}調　查詢碼:${base}${tiau}`;
    const submitDisabled = un === null || tiau === null;

    const matches = result && result.matches ? result.matches.map(m => { const ok = !NO_AUDIO.has(m.id); return { hanji: m.hanji, lomaji: m.lomaji, hasAudio: ok, noAudio: !ok, play: ok ? () => playFile(m.id) : null }; }) : [];

    return {
      siannButtons, unGroups, tiauButtons, previewSyll, previewParts, submitDisabled,
      submitStyle: `font-family:inherit;font-size:0.95rem;padding:10px 20px;border-radius:999px;border:none;font-weight:600;background:#315C63;color:#fff;cursor:${submitDisabled?'not-allowed':'pointer'};opacity:${submitDisabled?0.4:1};`,
      clearAll: () => this.clearAll(),
      goBack: () => this.goBack(),
      submit: () => this.submit(),
      resultShow: !!result,
      hasMatches: matches.length > 0,
      matches,
      matchCount: matches.length,
      noMatch: !!result && matches.length === 0,
      noMatchKey: result ? result.key : '',
      dictUrl: result ? `https://sutian.moe.edu.tw/zh-hant/tshiau/?lui=tai_su&tsha=${encodeURIComponent(result.key)}` : '',
    };
  }
}

</script>
