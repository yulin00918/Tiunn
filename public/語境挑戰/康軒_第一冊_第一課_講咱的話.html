in:auto;text-align:center}.score{font-size:62px;font-weight:900;color:var(--accent)}.weak{background:#f3f6f4;border-radius:14px;padding:14px;margin:18px 0}.steps{display:grid;gap:10px}.step{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);background:#fff;border-radius:14px}.step span{flex:1;font-weight:700}.step button{border:0;background:#eef2f0;border-radius:9px;padding:7px 10px}.status{padding:15px;background:#eef5f2;border-radius:14px;line-height:1.6}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style></head><body><div class="app"><div class="top"><button class="pill" id="back">← 返回課文</button><button class="pill">📚 康軒・第一冊</button></div>
<section id="lesson"><div class="hero"><h1>📘 第一課｜講咱的話</h1><p><b>課文語詞 × 生活語境 × 理解思考 × 實際應用</b></p><p>課文語詞 × 語境運用 × 閱讀理解 × 綜合挑戰</p></div><div class="grid">

<script>const B={"vocab":[{"q":"「工夫」佇「下真濟工夫學講台語」是啥意思？","opts":["心力佮時間","醫師的專業技術","工作結束後的空閒"],"ans":0,"hint":"想想學語言愛付出啥。","explain":"這句的工夫是投入時間與心力。","word":"心力佮時間"},{"q":"「交談」較接近啥意思？","opts":["互相講話交流","一個人發表演說","聽對方說話但不回應"],"ans":0,"hint":"有兩个人互相表達。","explain":"交談是彼此說話、交換想法。","word":"互相講話交流"},{"q":"「毋但」通常用佇啥款語意？","opts":["不只如此，閣有其他表現","只限於前面提到的事情","表示後面的事情尚未發生"],"ans":0,"hint":"後面常接另外一項特色。","explain":"毋但有「不只」的意思。","word":"不只如此，閣有其他表現"},{"q":"「症頭」是指啥？","opts":["身體不舒服的症狀","醫師開立的藥方","檢查後的治療方式"],"ans":0,"hint":"醫師問病人身體狀況。","explain":"症頭指身體出現的症狀。","word":"身體不舒服的症狀"},{"q":"「傳承」語言文化是指啥？","opts":["共語言一代傳一代","記錄語言卻不再使用","只學會一個人的說話方式"],"ans":0,"hint":"想想長輩與囡仔之間的關係。","explain":"傳承是把文化與語言延續下去。","word":"共語言一代傳一代"},{"q":"「較捷講」台語是欲咱按怎做？","opts":["增加使用台語的次數","把台語講得更大聲","每次講台語都講得更快"],"ans":0,"hint":"捷有經常的意思。","explain":"較捷講是更常開口使用。","word":"增加使用台語的次數"}],"context":[{"q":"阿媽看病，醫師用伊熟似的語言共伊＿＿，較會了解伊的感受。","opts":["交談","替伊決定所有治療","只照病歷讀予伊聽"],"ans":0,"hint":"醫師愛了解病人講啥。","explain":"交談能讓醫病雙方溝通。"},{"q":"欲學好台語，除了聽，嘛愛下＿＿練習。","opts":["工夫","講一句就停止","只背課文標題"],"ans":0,"hint":"練習需要時間。","explain":"下工夫表示認真投入。"},{"q":"小芳＿＿會講台語，閣會教同學講。","opts":["毋但","若是","干焦"],"ans":0,"hint":"這句有兩種能力。","explain":"毋但用來連接「不只……還……」。"},{"q":"阿公講伊胸坎悶悶，醫師問伊閣有啥＿＿。","opts":["症頭","治療方法","看診時間"],"ans":0,"hint":"是在問身體的不適。","explain":"症頭是症狀。"},{"q":"老師鼓勵學生佇厝裡＿＿，予語言自然融入生活。","opts":["較捷講台語","有需要才講台語","干焦用台語背課文"],"ans":0,"hint":"語言需要實際使用。","explain":"多開口才能練習語言。"},{"q":"爸母教囡仔講台語，是一種文化＿＿。","opts":["傳承","翻譯","記錄"],"ans":0,"hint":"文化代代延續。","explain":"教下一代使用語言是傳承。"}],"reading":[{"q":"朱子宏醫師為啥物認真學台語？","opts":["欲較了解病人的話佮需要","欲證明醫師的台語比病人好","欲減少病人發問的機會"],"ans":0,"hint":"課文提到醫師佮病人。","explain":"醫師學語言是為了改善溝通。"},{"q":"醫師用病人熟似的語言交談，主要有啥好處？","opts":["較容易了解病人講的症頭","病人毋免再講病情","醫師毋免確認病人的意思"],"ans":0,"hint":"語言協助表達。","explain":"熟悉的語言能幫助病人清楚說明。"},{"q":"課文提著阿芸，主要欲表現啥？","opts":["台語嘛會當活潑有趣地使用","台語只適合正式演講","台語只適合長輩使用"],"ans":0,"hint":"留意唱歌與笑詼的例子。","explain":"阿芸的例子呈現語言多元的表現方式。"},{"q":"夜市頭家用有趣的話叫賣，顯示啥？","opts":["台語佮日常生活、文化有關","台語主要用來說明商品價格","台語只適合夜市使用"],"ans":0,"hint":"想想叫賣的特色。","explain":"叫賣語呈現生活中的語言趣味。"},{"q":"這課為啥物鼓勵咱較捷講台語？","opts":["語言需要使用才會延續","語言只要寫佇課本就會延續","語言只需要專家會講就好"],"ans":0,"hint":"主題是語言傳承。","explain":"實際使用有助於語言傳承。"},{"q":"這課的例子有醫院、表演佮夜市，欲講啥？","opts":["台語會當用佇無仝生活情境","台語較適合醫療場合","台語主要用於娛樂活動"],"ans":0,"hint":"比較幾種場所。","explain":"不同情境都能使用台語。"}],"comprehensive":[{"q":"阿公看病時較慣勢講台語，你會建議醫師按怎做？","opts":["用阿公熟似的語言問症頭並確認意思","只用台語快速問完，不確認病人有無聽懂","先請家屬代答，無須再詢問阿公"],"ans":0,"hint":"重點是理解與尊重。","explain":"使用熟悉語言並確認資訊可減少誤解。"},{"q":"同學驚講台語會講毋著，啥做法較適當？","opts":["先試講簡單一句，慢慢練習","先記熟所有語法才敢開口","只在考試時練習，不在生活中使用"],"ans":0,"hint":"學習需要練習。","explain":"鼓勵嘗試與修正能建立信心。"},{"q":"聽著夜市頭家用台語叫賣，欲研究這種文化，先做啥較好？","opts":["記錄聽著的話，閣請教意思","只錄下叫賣聲音，不必理解意思","依照自己的猜測直接寫成解釋"],"ans":0,"hint":"理解語言要有情境。","explain":"記錄並詢問能理解叫賣語的意義。"},{"q":"家人會講台語，欲予囡仔學著，啥方式較有效？","opts":["生活中逐工用簡單台語互動","只讓囡仔聽大人講，不鼓勵回應","先背熟全部語詞再開始對話"],"ans":0,"hint":"語言學習重視使用。","explain":"日常互動提供自然練習機會。"},{"q":"朋友用台語講笑詼，你聽無，較好的回應是？","opts":["請伊閣解說一擺","請朋友改講華語，毋免再聽台語","照字面猜意思，毋免確認笑點"],"ans":0,"hint":"尊重並求理解。","explain":"詢問能幫助理解語意與幽默。"},{"q":"這課最重要的行動是啥？","opts":["佇生活中主動聽、講、使用台語","等台語講甲完全正確才開始使用","只有在台語課才需要練習台語"],"ans":0,"hint":"對照課文主旨。","explain":"課文鼓勵把語言帶進日常生活。"}]};const correctSteps=["先觀察：聽生活中啥人咧講台語", "揀情境：選一個適合練習的所在", "試講看覓：用台語佮人交談", "回想改進：記錄這擺聽著佮學著的話"];const names={"vocab": "🔤 課文語詞", "context": "💭 語境選詞", "reading": "📖 讀文理解", "comprehensive": "🏆 綜合挑戰"};let bank,set=[],i=0,score=0,tries=0,weak=[],steps=[];const $=id=>document.getElementById(id),sh=a=>{let x=[...a];for(let n=x.length-1;n>0;n--){let k=Math.floor(Math.random()*(n+1));[x[n],x[k]]=[x[k],x[n]];}return x;};function show(id){['lesson','quiz','result','activity'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');scrollTo(0,0)}function start(b){bank=b;set=sh(B[b]).slice(0,5).map(q=>{const opts=q.opts.map((v,j)=>({v,j}));for(let n=opts.length-1;n>0;n--){const k=Math.floor(Math.random()*(n+1));[opts[n],opts[k]]=[opts[k],opts[n]];}return {...q,opts:opts.map(x=>x.v),ans:opts.findIndex(x=>x.j===q.ans)};});i=0;score=0;weak=[];$('qt').textContent=names[b];show('quiz');render()}document.querySelectorAll('.start').forEach(x=>x.onclick=()=>start(x.dataset.b));function render(){tries=0;let q=set[i];$('count').textContent=`第 ${i+1} / 5 題`;$('scoreNow').textContent=`目前 ${score} 分`;$('fill').style.width=`${i*20}%`;$('qcard').innerHTML=`<div class="kicker">${q.word?('本課語詞｜'+q.word):names[bank]}</div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join('')}</div><div id="fb"></div>`}function pick(n,el){let q=set[i];if(document.querySelector('.correct'))return;tries++;if(n===q.ans){el.classList.add('correct');if(tries===1)score++;$('fb').innerHTML=`<div class="feedback ok">✅ 著矣！<br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add('wrong');el.disabled=true;if(tries===1){if(q.word)weak.push(q.word);$('fb').innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${q.hint}</div>`}else{document.querySelectorAll('.opt').forEach(x=>x.disabled=true);document.querySelectorAll('.opt')[q.ans].classList.add('correct');$('fb').innerHTML=`<div class="feedback bad">答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}function next(){i++;if(i<5)render();else finish()}function finish(){$('s-'+bank).textContent=`上擺 ${score} / 5`;$('rt').textContent=names[bank]+'完成！';$('fs').textContent=score+' / 5';$('msg').textContent=score===5?'🏆 真𠢕！這關全數答著。':score>=4?'🌟 真好！已經真熟矣。':score>=3?'👍 愈來愈會曉！':'🌱 閣練一擺，會愈來愈熟。';let w=[...new Set(weak)];$('weak').innerHTML=w.length?`<b>建議閣練：</b>${w.join('、')}`:'✨ 這擺無特別需要加強的語詞。';show('result')}$('retry').onclick=()=>start(bank);$('home').onclick=()=>show('lesson');$('back').onclick=()=>{if($('lesson').classList.contains('hidden'))show('lesson');else location.href='../語境填空.dc.html';};function draw(){$('steps').innerHTML=steps.map((s,idx)=>`<div class="step"><b>${idx+1}</b><span>${s}</span><button onclick="moveStep(${idx},-1)">▲</button><button onclick="moveStep(${idx},1)">▼</button></div>`).join('')}function shuffleRoute(){steps=sh(correctSteps);draw();$('stepStatus').textContent="按 ▲ ▼ 排出合理的歷程順序。"}window.moveStep=(idx,d)=>{let n=idx+d;if(n<0||n>=steps.length)return;[steps[idx],steps[n]]=[steps[n],steps[idx]];draw()};$('routeBtn').onclick=()=>{show('activity');shuffleRoute()};$('shuffleSteps').onclick=shuffleRoute;$('checkSteps').onclick=()=>{let ok=steps.every((x,j)=>x===correctSteps[j]);$('stepStatus').innerHTML=ok?"✅ 全部著矣！你已經掌握本課的重點歷程。":"🤔 猶有順序愛調整。提示：先想起點，再想接下來會發生啥。"};$('activityHome').onclick=()=>show('lesson');</script></body></html>
