in:auto;text-align:center}.score{font-size:62px;font-weight:900;color:var(--accent)}.weak{background:#f3f6f4;border-radius:14px;padding:14px;margin:18px 0}.steps{display:grid;gap:10px}.step{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);background:#fff;border-radius:14px}.step span{flex:1;font-weight:700}.step button{border:0;background:#eef2f0;border-radius:9px;padding:7px 10px}.status{padding:15px;background:#eef5f2;border-radius:14px;line-height:1.6}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}

<script>const B={"vocab":[{"q":"「喙焦」是指？","opts":["口渴","嘴巴乾裂疼痛","喉嚨發炎"],"ans":0,"hint":"想欲啉水。","explain":"喙焦就是口渴。","word":"口渴"},{"q":"「真珠奶茶」內底的「真珠」通常是指？","opts":["粉圓仔","小粒冰角","茶葉顆粒"],"ans":0,"hint":"飲料內底圓圓的配料。","explain":"真珠通常指粉圓。","word":"粉圓仔"},{"q":"「連」阿母嘛會買，這个「連」表示？","opts":["連原本無想到的人嘛包含在內","只強調阿母一個人","表示阿母比其他人較早買"],"ans":0,"hint":"強調意外也包含。","explain":"連……嘛……表示連某人也如此。","word":"連原本無想到的人嘛包含在內"},{"q":"「傷冷」是指？","opts":["太冷","冷度剛剛好","比原本想像的較不冷"],"ans":0,"hint":"傷有過度的意思。","explain":"傷冷是太冷。","word":"太冷"},{"q":"「三代」是指？","opts":["三個世代","同一代的三個人","三次不同的購買經驗"],"ans":0,"hint":"想想長輩、父母、囡仔。","explain":"三代是三個不同世代。","word":"三個世代"},{"q":"「國外」是指？","opts":["其他國家","國內其他縣市","家鄉以外的學校"],"ans":0,"hint":"跨越國境。","explain":"國外是其他國家。","word":"其他國家"}],"context":[{"q":"運動了後，我足＿＿，想欲啉水。","opts":["喙焦","腹肚枵","頭殼疼"],"ans":0,"hint":"運動後想喝水。","explain":"喙焦就是口渴。"},{"q":"感冒拄好，這杯冰飲料＿＿，先莫啉。","opts":["傷冷","較甜","較濟"],"ans":0,"hint":"飲料溫度過低。","explain":"傷冷表示太冷。"},{"q":"這間店的＿＿奶茶有圓圓的粉圓仔。","opts":["真珠","傳統","三代"],"ans":0,"hint":"飲料中的配料。","explain":"真珠奶茶通常加入粉圓。"},{"q":"這款飲料真受歡迎，＿＿阿公嘛想試看覓。","opts":["連","只有","干焦"],"ans":0,"hint":"連長輩也想試。","explain":"連……嘛……表示出乎預期也包含。"},{"q":"阿媽、阿母佮查某囝攏愛啉，這是＿＿攏有共同的回憶。","opts":["三代","三人","三擺"],"ans":0,"hint":"比較人物的世代。","explain":"阿媽、阿母、女兒是三代。"},{"q":"臺灣的飲料傳到＿＿，予其他國家的人認識。","opts":["國外","市外","庄外"],"ans":0,"hint":"跨到其他國家。","explain":"國外指其他國家。"}],"reading":[{"q":"采晴講「我足喙焦的」，伊當時想欲按怎？","opts":["啉物件","食物件","買物件"],"ans":0,"hint":"喙焦是口渴。","explain":"采晴表示想喝飲料。"},{"q":"愛真為啥物提醒果汁傷冷？","opts":["伊感冒拄才好","伊已經啉傷濟","伊無佮意這款口味"],"ans":0,"hint":"課文有提身體狀況。","explain":"感冒剛好，喝太冰的飲料要留意。"},{"q":"課文提著真珠奶茶的發展，呈現啥變化？","opts":["由粉圓仔相關飲食發展成受歡迎的飲料","由傳統茶飲轉成完全無茶的飲料","由國外傳入臺灣後才開始流行"],"ans":0,"hint":"留意飲料的起源與流行。","explain":"課文介紹珍珠奶茶的演變。"},{"q":"課文用三代人的故事，主要是欲表現啥？","opts":["飲料跨世代的生活記憶","三代人攏佇仝一間店做事","三代人對飲料有完全相同的喜好"],"ans":0,"hint":"想想不同年齡的人。","explain":"三代的描述呈現飲食文化的延續與變化。"},{"q":"真珠奶茶傳到國外，代表啥？","opts":["臺灣飲食文化向外傳播","臺灣的飲料已經取代各國飲料","臺灣人較少買這款飲料"],"ans":0,"hint":"想想文化交流。","explain":"飲料流行到海外是飲食文化傳播的例子。"},{"q":"課文提著阿母嘛會家己買真珠奶茶，表現啥？","opts":["真珠奶茶受不同年齡層歡迎","真珠奶茶主要由大人購買","真珠奶茶主要由學生購買"],"ans":0,"hint":"留意「連……嘛……」。","explain":"連母親也會買，凸顯飲料的普及。"}],"comprehensive":[{"q":"朋友感冒拄好，想啉真冰的飲料，你較適合講啥？","opts":["提醒伊留意身體，會當選較無冰的","建議先確認身體狀況，若想喝就一定選冰的","提醒伊注意甜度，但認為冰度毋免考慮"],"ans":0,"hint":"考慮身體狀況。","explain":"可以提供溫和提醒與替代選擇。"},{"q":"外國朋友問真珠奶茶是啥，你會按怎介紹？","opts":["是臺灣流行、常加入粉圓的飲料","是臺灣流行、主要用粉圓取代茶葉的飲料","是只有在臺灣才買得到的傳統茶飲"],"ans":0,"hint":"介紹主要特色。","explain":"珍珠奶茶是臺灣具代表性的飲料文化。"},{"q":"一家三代人對飲料的回憶無仝，代表啥？","opts":["同一款飲料會承載無仝世代的生活記憶","三代人對同一飲料的喜好一定相同","只有少年人才會飲真珠奶茶"],"ans":0,"hint":"思考時間與文化。","explain":"不同世代的經驗反映飲食文化變化。"},{"q":"若欲了解一種飲料按怎傳到國外，啥方式較好？","opts":["查來源、傳播過程佮各地接受情形","先看品牌廣告，就能知道完整的傳播歷史","只查目前國外賣得好不好，毋免了解來源"],"ans":0,"hint":"文化傳播需要資料。","explain":"多方了解能更完整認識飲食文化。"},{"q":"「連阿母嘛會買」的語氣較接近？","opts":["原本無想到阿母也會買","阿母一直都有買，所以作者無感覺意外","阿母比其他人買得較多，所以特別提起"],"ans":0,"hint":"想想「連」的強調。","explain":"連……嘛……帶有強調意味。"},{"q":"這課將生活對話佮飲料歷史放做伙，主題是？","opts":["飲食生活佮文化傳播","這課主要討論飲料製作的衛生標準","這課主要比較各家飲料店的價格"],"ans":0,"hint":"綜合課文內容。","explain":"課文連結生活情境、世代與飲食文化。"}]};const correctSteps=["粉圓仔相關飲食", "真珠奶茶逐漸流行", "不同世代的人攏會買", "真珠奶茶傳到國外"];const names={"vocab": "🔤 課文語詞", "context": "💭 語境選詞", "reading": "📖 讀文理解", "comprehensive": "🏆 綜合挑戰"};let bank,set=[],i=0,score=0,tries=0,weak=[],steps=[];const $=id=>document.getElementById(id),sh=a=>{let x=[...a];for(let n=x.length-1;n>0;n--){let k=Math.floor(Math.random()*(n+1));[x[n],x[k]]=[x[k],x[n]];}return x;};function show(id){['lesson','quiz','result','activity'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');scrollTo(0,0)}function start(b){bank=b;set=sh(B[b]).slice(0,5).map(q=>{const opts=q.opts.map((v,j)=>({v,j}));for(let n=opts.length-1;n>0;n--){const k=Math.floor(Math.random()*(n+1));[opts[n],opts[k]]=[opts[k],opts[n]];}return {...q,opts:opts.map(x=>x.v),ans:opts.findIndex(x=>x.j===q.ans)};});i=0;score=0;weak=[];$('qt').textContent=names[b];show('quiz');render()}document.querySelectorAll('.start').forEach(x=>x.onclick=()=>start(x.dataset.b));function render(){tries=0;let q=set[i];$('count').textContent=`第 ${i+1} / 5 題`;$('scoreNow').textContent=`目前 ${score} 分`;$('fill').style.width=`${i*20}%`;$('qcard').innerHTML=`<div class="kicker">${q.word?('本課語詞｜'+q.word):names[bank]}</div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join('')}</div><div id="fb"></div>`}function pick(n,el){let q=set[i];if(document.querySelector('.correct'))return;tries++;if(n===q.ans){el.classList.add('correct');if(tries===1)score++;$('fb').innerHTML=`<div class="feedback ok">✅ 著矣！<br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add('wrong');el.disabled=true;if(tries===1){if(q.word)weak.push(q.word);$('fb').innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${q.hint}</div>`}else{document.querySelectorAll('.opt').forEach(x=>x.disabled=true);document.querySelectorAll('.opt')[q.ans].classList.add('correct');$('fb').innerHTML=`<div class="feedback bad">答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}function next(){i++;if(i<5)render();else finish()}function finish(){$('s-'+bank).textContent=`上擺 ${score} / 5`;$('rt').textContent=names[bank]+'完成！';$('fs').textContent=score+' / 5';$('msg').textContent=score===5?'🏆 真𠢕！這關全數答著。':score>=4?'🌟 真好！已經真熟矣。':score>=3?'👍 愈來愈會曉！':'🌱 閣練一擺，會愈來愈熟。';let w=[...new Set(weak)];$('weak').innerHTML=w.length?`<b>建議閣練：</b>${w.join('、')}`:'✨ 這擺無特別需要加強的語詞。';show('result')}$('retry').onclick=()=>start(bank);$('home').onclick=()=>show('lesson');$('back').onclick=()=>{if($('lesson').classList.contains('hidden'))show('lesson');else location.href='../語境填空.dc.html';};function draw(){$('steps').innerHTML=steps.map((s,idx)=>`<div class="step"><b>${idx+1}</b><span>${s}</span><button onclick="moveStep(${idx},-1)">▲</button><button onclick="moveStep(${idx},1)">▼</button></div>`).join('')}function shuffleRoute(){steps=sh(correctSteps);draw();$('stepStatus').textContent="按 ▲ ▼ 排出合理的歷程順序。"}window.moveStep=(idx,d)=>{let n=idx+d;if(n<0||n>=steps.length)return;[steps[idx],steps[n]]=[steps[n],steps[idx]];draw()};$('routeBtn').onclick=()=>{show('activity');shuffleRoute()};$('shuffleSteps').onclick=shuffleRoute;$('checkSteps').onclick=()=>{let ok=steps.every((x,j)=>x===correctSteps[j]);$('stepStatus').innerHTML=ok?"✅ 全部著矣！你已經掌握本課的重點歷程。":"🤔 猶有順序愛調整。提示：先想起點，再想接下來會發生啥。"};$('activityHome').onclick=()=>show('lesson');</script></body></html>
