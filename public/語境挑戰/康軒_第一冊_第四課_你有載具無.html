in:auto;text-align:center}.score{font-size:62px;font-weight:900;color:var(--accent)}.weak{background:#f3f6f4;border-radius:14px;padding:14px;margin:18px 0}.steps{display:grid;gap:10px}.step{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);background:#fff;border-radius:14px}.step span{flex:1;font-weight:700}.step button{border:0;background:#eef2f0;border-radius:9px;padding:7px 10px}.status{padding:15px;background:#eef5f2;border-radius:14px;line-height:1.6}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}

<script>const B={"vocab":[{"q":"「載具」佇這課是指啥？","opts":["儲存電子發票的工具或條碼","用來核對中獎號碼的網站","購物付款時使用的信用卡"],"ans":0,"hint":"佮雲端發票有關。","explain":"課文的載具用於儲存電子發票。","word":"儲存電子發票的工具或條碼"},{"q":"「對發票」是欲做啥？","opts":["核對發票號碼有無中獎","核對商品售價有無算錯","確認發票是否已經存入手機"],"ans":0,"hint":"發票開獎後會做。","explain":"對發票是核對中獎號碼。","word":"核對發票號碼有無中獎"},{"q":"「落伍」是指？","opts":["無跟著新的做法或潮流","對新事物保持謹慎","比較喜歡傳統的使用方式"],"ans":0,"hint":"佮新科技的使用有關。","explain":"落伍表示跟不上新事物或潮流。","word":"無跟著新的做法或潮流"},{"q":"「拍算」是啥意思？","opts":["打算、計畫","計算花費金額","估計中獎機會"],"ans":0,"hint":"想欲做某一件事。","explain":"拍算是打算。","word":"打算、計畫"},{"q":"「雲端發票」較符合啥描述？","opts":["以電子方式保存發票資料","掃描紙本發票後才會存在手機","所有購物都自動開立紙本發票"],"ans":0,"hint":"留意電子儲存。","explain":"雲端發票以電子形式保存資料。","word":"以電子方式保存發票資料"},{"q":"「消費」佇本課指？","opts":["買物件或使用服務","比較不同商品的價格","記錄每個月的支出"],"ans":0,"hint":"佮購物有關。","explain":"消費是購買商品或服務。","word":"買物件或使用服務"}],"context":[{"q":"阿姊講用手機條碼＿＿，買物件較免收紙本發票。","opts":["載具","發票號碼","會員卡"],"ans":0,"hint":"雲端發票的工具。","explain":"載具可用來儲存電子發票。"},{"q":"開獎了，阿爸坐佇桌仔邊咧＿＿。","opts":["對發票","整理發票","保存發票"],"ans":0,"hint":"核對中獎號碼。","explain":"對發票是核對發票號碼。"},{"q":"我毋知手機會當存發票，朋友笑講我有較＿＿。","opts":["落伍","無聊","煩惱"],"ans":0,"hint":"對新做法較無熟似。","explain":"落伍指未跟上新事物。"},{"q":"我猶未＿＿欲下載載具，想先了解按怎用。","opts":["拍算","決定","學會"],"ans":0,"hint":"還沒計畫要做。","explain":"拍算就是打算。"},{"q":"買物件時，店員問我欲用＿＿抑是印紙本發票。","opts":["雲端發票","購物明細","會員點數"],"ans":0,"hint":"發票形式。","explain":"雲端發票是電子形式的發票。"},{"q":"出門買物件是日常＿＿行為。","opts":["消費","存款","生產"],"ans":0,"hint":"購物行為。","explain":"消費是購買商品或服務。"}],"reading":[{"q":"豪運坐塗跤咧做啥？","opts":["一張一張對發票","一張一張整理收據","用手機掃載具條碼"],"ans":0,"hint":"課文開頭提著發票。","explain":"豪運正在核對紙本發票。"},{"q":"阿姊建議豪運用啥物？","opts":["載具","雲端發票中獎通知","電子支付"],"ans":0,"hint":"佮電子發票有關。","explain":"阿姊建議使用載具。"},{"q":"百貨公司店員問載具時，作者感覺按怎？","opts":["家己有較落伍","家己無帶手機","家己毋知欲買啥"],"ans":0,"hint":"不熟悉新做法。","explain":"作者覺得自己較落伍。"},{"q":"作者雖然感覺較落伍，猶原無拍算做啥？","opts":["下載雲端載具","使用紙本發票","了解載具的用途"],"ans":0,"hint":"留意「無拍算」。","explain":"課文說作者仍未打算下載雲端載具。"},{"q":"本課主要討論啥生活變化？","opts":["消費佮數位工具的使用","購物時如何節省金錢","商店如何推銷商品"],"ans":0,"hint":"比較紙本與數位發票。","explain":"本課主題是數位生活中的消費方式。"},{"q":"阿姊推薦載具，較可能是因為啥？","opts":["電子保存發票較便利","用載具就會增加中獎機會","用載具就毋免對發票"],"ans":0,"hint":"想想收發票的方式。","explain":"載具可減少保管紙本發票的麻煩。"}],"comprehensive":[{"q":"店員問「你有載具無？」你無了解，啥回應較適當？","opts":["請店員說明載具的用途","先把手機交予店員操作，事後才了解","先選擇不要使用，再也不必了解載具"],"ans":0,"hint":"不懂先詢問。","explain":"了解用途再選擇較安全。"},{"q":"有人講「用載具一定會中獎」，這句話按怎看？","opts":["毋著，載具無保證中獎","載具能增加中獎機率，但不保證每張都中","只要完成載具歸戶，就一定能中獎"],"ans":0,"hint":"載具與中獎機率無直接保證。","explain":"載具是保存發票的方式，不保證中獎。"},{"q":"欲申請載具，啥做法較安全？","opts":["透過可信的官方管道了解申請方式","參考社群貼文提供的連結，直接輸入資料","請朋友代辦，將簡訊驗證碼傳予對方"],"ans":0,"hint":"涉及個資要謹慎。","explain":"使用可信管道並保護個資較安全。"},{"q":"朋友較慣勢用紙本發票，你較適合按怎做？","opts":["尊重伊的選擇，介紹兩種方式差別","要求伊立即改用載具，毋免解說","因為伊用紙本發票，就認為伊完全無法學數位工具"],"ans":0,"hint":"科技使用有不同需求。","explain":"可以說明選項並尊重使用者。"},{"q":"手機條碼載具與紙本發票的共同用途是？","opts":["記錄消費發票資料","都能讓消費者不用支付購物款項","都能在結帳時自動幫消費者折抵金額"],"ans":0,"hint":"思考發票本身的功能。","explain":"兩者都是保存消費發票資料的方式。"},{"q":"本課最值得學習的態度是？","opts":["了解數位工具後再決定是否使用","先選擇最新工具，再慢慢了解使用方式","數位工具越普遍，就越不需要確認風險"],"ans":0,"hint":"重視知情選擇。","explain":"了解用途、風險與需求後再做選擇。"}]};const correctSteps=["購物前：了解載具的用途", "結帳時：選擇載具或紙本", "消費後：確認發票資料", "開獎後：核對中獎資訊"];const names={"vocab": "🔤 課文語詞", "context": "💭 語境選詞", "reading": "📖 讀文理解", "comprehensive": "🏆 綜合挑戰"};let bank,set=[],i=0,score=0,tries=0,weak=[],steps=[];const $=id=>document.getElementById(id),sh=a=>{let x=[...a];for(let n=x.length-1;n>0;n--){let k=Math.floor(Math.random()*(n+1));[x[n],x[k]]=[x[k],x[n]];}return x;};function show(id){['lesson','quiz','result','activity'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');scrollTo(0,0)}function start(b){bank=b;set=sh(B[b]).slice(0,5).map(q=>{const opts=q.opts.map((v,j)=>({v,j}));for(let n=opts.length-1;n>0;n--){const k=Math.floor(Math.random()*(n+1));[opts[n],opts[k]]=[opts[k],opts[n]];}return {...q,opts:opts.map(x=>x.v),ans:opts.findIndex(x=>x.j===q.ans)};});i=0;score=0;weak=[];$('qt').textContent=names[b];show('quiz');render()}document.querySelectorAll('.start').forEach(x=>x.onclick=()=>start(x.dataset.b));function render(){tries=0;let q=set[i];$('count').textContent=`第 ${i+1} / 5 題`;$('scoreNow').textContent=`目前 ${score} 分`;$('fill').style.width=`${i*20}%`;$('qcard').innerHTML=`<div class="kicker">${q.word?('本課語詞｜'+q.word):names[bank]}</div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join('')}</div><div id="fb"></div>`}function pick(n,el){let q=set[i];if(document.querySelector('.correct'))return;tries++;if(n===q.ans){el.classList.add('correct');if(tries===1)score++;$('fb').innerHTML=`<div class="feedback ok">✅ 著矣！<br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add('wrong');el.disabled=true;if(tries===1){if(q.word)weak.push(q.word);$('fb').innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${q.hint}</div>`}else{document.querySelectorAll('.opt').forEach(x=>x.disabled=true);document.querySelectorAll('.opt')[q.ans].classList.add('correct');$('fb').innerHTML=`<div class="feedback bad">答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}function next(){i++;if(i<5)render();else finish()}function finish(){$('s-'+bank).textContent=`上擺 ${score} / 5`;$('rt').textContent=names[bank]+'完成！';$('fs').textContent=score+' / 5';$('msg').textContent=score===5?'🏆 真𠢕！這關全數答著。':score>=4?'🌟 真好！已經真熟矣。':score>=3?'👍 愈來愈會曉！':'🌱 閣練一擺，會愈來愈熟。';let w=[...new Set(weak)];$('weak').innerHTML=w.length?`<b>建議閣練：</b>${w.join('、')}`:'✨ 這擺無特別需要加強的語詞。';show('result')}$('retry').onclick=()=>start(bank);$('home').onclick=()=>show('lesson');$('back').onclick=()=>{if($('lesson').classList.contains('hidden'))show('lesson');else location.href='../語境填空.dc.html';};function draw(){$('steps').innerHTML=steps.map((s,idx)=>`<div class="step"><b>${idx+1}</b><span>${s}</span><button onclick="moveStep(${idx},-1)">▲</button><button onclick="moveStep(${idx},1)">▼</button></div>`).join('')}function shuffleRoute(){steps=sh(correctSteps);draw();$('stepStatus').textContent="按 ▲ ▼ 排出合理的歷程順序。"}window.moveStep=(idx,d)=>{let n=idx+d;if(n<0||n>=steps.length)return;[steps[idx],steps[n]]=[steps[n],steps[idx]];draw()};$('routeBtn').onclick=()=>{show('activity');shuffleRoute()};$('shuffleSteps').onclick=shuffleRoute;$('checkSteps').onclick=()=>{let ok=steps.every((x,j)=>x===correctSteps[j]);$('stepStatus').innerHTML=ok?"✅ 全部著矣！你已經掌握本課的重點歷程。":"🤔 猶有順序愛調整。提示：先想起點，再想接下來會發生啥。"};$('activityHome').onclick=()=>show('lesson');</script></body></html>
