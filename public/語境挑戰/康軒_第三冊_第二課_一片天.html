<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二課｜一片天</title><style>
:root{--ink:#33443f;--muted:#72817b;--line:#e1e8e4;--accent:#668b84;--soft:#eef5f1;--shadow:0 10px 28px #32483d14}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fafcfb,#eef3f0);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
.app{max-width:1180px;margin:auto;padding:28px 22px 60px}.top{display:flex;justify-content:space-between;margin-bottom:25px}.pill{border:0;background:#fff;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow)}
.hero{text-align:center;margin:12px 0 34px}.hero h1{font-size:38px;margin:0 0 8px}.hero p{color:var(--muted);margin:6px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:23px;padding:24px;box-shadow:var(--shadow)}.level{text-align:center}.icon{font-size:40px}.num{font-weight:900;color:#bcc5c0}.level h3{margin:8px}.level p{min-height:50px;color:var(--muted);line-height:1.55}.extra{background:linear-gradient(145deg,#fff,#eef7f4)}
.btn{width:100%;border:0;border-radius:14px;padding:12px 16px;background:#354d46;color:#fff;font-weight:800;cursor:pointer}.hidden{display:none!important}.quiz,.activity{max-width:850px;margin:auto}.title{text-align:center}.title h2{font-size:31px;margin-bottom:5px}.title p{color:var(--muted)}
.bar{height:11px;background:#e5ebe8;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:8px 0 14px}.qcard{padding:32px}.kicker{font-weight:800;color:#92765f}.q{font-size:26px;font-weight:800;line-height:1.55;margin:10px 0 24px}.opts{display:grid;gap:12px}.opt{padding:16px;text-align:left;border:1px solid #dce4df;background:#fff;border-radius:15px;font-weight:700;cursor:pointer}.correct{background:#edf8f1;border-color:#8ebaa0}.wrong{background:#fff0ef;border-color:#d7a09a}.feedback{margin-top:18px;padding:16px;border-radius:15px;line-height:1.6}.ok{background:#edf8f1}.bad{background:#fff0ef}.hint{background:#fff8e7}.next{width:auto;margin-top:14px}.result{max-width:720px;margin:auto;text-align:center}.score{font-size:62px;font-weight:900;color:var(--accent)}.weak{background:#f3f6f4;border-radius:14px;padding:14px;margin:18px 0}
.choicegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.pick{padding:16px;border:1px solid var(--line);border-radius:15px;background:#fff;font-weight:700;cursor:pointer;text-align:left}.selected{outline:3px solid #91aaa0}.status{padding:15px;background:var(--soft);border-radius:14px;line-height:1.6}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid,.choicegrid{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style></head><body><div class="app">
<div class="top"><button class="pill" id="back">← 返回課文</button><button class="pill">📚 康軒・第三冊</button></div>
<section id="lesson"><div class="hero"><h1>🌪️ 第二課｜一片天</h1><p><b>風災後，看著損失，也看著正向面對的力量</b></p><p>課文語詞 × 語境運用 × 閱讀理解</p></div><div class="grid"><div class="card level"><div class="num">01</div><div class="icon">🔤</div><h3>課文語詞</h3><p>教材重點＋課文延伸生詞</p><small id="s-vocab">未挑戰</small><br><br><button class="btn start" data-b="vocab">開始 →</button></div><div class="card level"><div class="num">02</div><div class="icon">💭</div><h3>語境選詞</h3><p>換到生活情境真正會用</p><small id="s-context">未挑戰</small><br><br><button class="btn start" data-b="context">開始 →</button></div><div class="card level"><div class="num">03</div><div class="icon">📖</div><h3>讀文理解</h3><p>讀懂課文細節與主旨</p><small id="s-reading">未挑戰</small><br><br><button class="btn start" data-b="reading">開始 →</button></div><div class="card level"><div class="num">04</div><div class="icon">🏆</div><h3>綜合挑戰</h3><p>課文 × 生活應用</p><small id="s-comprehensive">未挑戰</small><br><br><button class="btn start" data-b="comprehensive">開始 →</button></div><div class="card level extra"><div class="num">＋</div><div class="icon">🎒</div><h3>防災包挑戰</h3><p>防災準備 × 災後應變</p><small>本課專屬</small><br><br><button class="btn" id="activityBtn">開始 →</button></div></div></section>
<section id="quiz" class="hidden"><div class="quiz"><div class="title"><h2 id="qt"></h2><p>每擺隨機抽 5 題</p></div><div class="bar"><div class="fill" id="fill"></div></div><div class="meta"><span id="count"></span><span id="scoreNow"></span></div><div class="card qcard" id="qcard"></div></div></section>
<section id="result" class="hidden"><div class="card result"><div style="font-size:48px">🎉</div><h2 id="rt"></h2><div class="score" id="fs"></div><p id="msg"></p><div class="weak" id="weak"></div><button class="btn" id="retry">🔄 閣挑戰一擺</button><br><br><button class="btn" id="home" style="background:#e9efec;color:#31443c">轉去本課</button></div></section>
<section id="activity" class="hidden"><div class="activity"><div class="title"><h2>🎒 防災包挑戰</h2><p>請揀出你認為應該囥入防災包的 6 項物件。</p></div><div class="card"><div class="choicegrid" id="items"></div><br><button class="btn" id="checkItems">檢查</button><br><br><div class="status" id="activityStatus">提示：想看覓停電、受傷、需要撤離時，啥物真正有路用。</div><br><button class="btn" id="activityHome" style="background:#e9efec;color:#31443c">完成，轉去本課</button></div></div></section>
</div><script>const B={"vocab": [{"word": "同齊", "q": "「連樹根同齊薅起來」的「同齊」是：", "opts": ["同時一起", "分開", "慢慢"], "ans": 0, "hint": "樹佮樹根做伙予風吹起來。", "explain": "教材解釋「同齊」是同時一起。"}, {"word": "薅", "q": "「薅」是啥物意思？", "opts": ["從土中拔除植物", "澆水", "剪樹枝"], "ans": 0, "hint": "教材例句有「薅草」。", "explain": "教材解釋「薅」是從土中拔除花草類植物。"}, {"word": "操煩", "q": "「我當咧操煩」的「操煩」是：", "opts": ["操心煩惱", "真歡喜", "放輕鬆"], "ans": 0, "hint": "看到舞蹈教室受風災破壞，老師心內真煩惱。", "explain": "教材解釋「操煩」是操心煩惱。"}, {"word": "歡頭喜面", "q": "「歡頭喜面」是咧形容：", "opts": ["歡天喜地、面帶喜色", "真驚惶", "真疲累"], "ans": 0, "hint": "舞蹈班學生看到「一片天」時的表情。", "explain": "教材解釋「歡頭喜面」是歡天喜地，臉上洋溢著高興。"}, {"word": "掀了了", "q": "「厝蓋予風颱掀了了」較接近：", "opts": ["屋頂全被掀走", "屋頂稍微移動", "屋頂變新"], "ans": 0, "hint": "教材後面有「動詞＋了了」的用法。", "explain": "「動詞＋了了」可表示全部都沒了。"}, {"word": "凡勢", "q": "「凡勢是天公伯仔想欲看𪜶跳舞」的「凡勢」較接近：", "opts": ["或許、可能", "一定", "從來"], "ans": 0, "hint": "老師是在用正向想像轉念。", "explain": "從課文語境可知「凡勢」帶有或許、可能的意味。"}, {"word": "百面", "q": "「雨若照按呢落，百面做大水」的「百面」較接近：", "opts": ["一定、肯定", "百分之一", "很多面"], "ans": 0, "hint": "阿爸判斷再落雨就會淹水。", "explain": "課文語境中「百面」表示十之八九、肯定會發生。"}, {"word": "大水", "q": "「做大水」是：", "opts": ["淹水、水災", "水變甜", "水量變少"], "ans": 0, "hint": "風颱雨落真大時可能發生。", "explain": "課文在風颱情境中用「做大水」表示淹水。"}, {"word": "消水", "q": "「消水應該誠緊」是指：", "opts": ["積水退得真緊", "水變少人啉", "水溝變深"], "ans": 0, "hint": "前面講有清水溝。", "explain": "課文說定期清水溝，積水會退得較快。"}, {"word": "好勢", "q": "「準備予好勢」較接近：", "opts": ["準備妥當", "準備漂亮", "準備很久"], "ans": 0, "hint": "防災重點是事先準備完善。", "explain": "教材主旨強調風颱來前先準備妥當，可以減少傷害。"}], "context": [{"word": "操煩", "q": "阿姊為著明仔載考試的代誌一直咧＿＿＿＿。", "opts": ["操煩", "歡頭喜面", "薅"], "ans": 0, "hint": "考試予伊真煩惱。", "explain": "「操煩」是操心煩惱。"}, {"word": "歡頭喜面", "q": "表姊結婚彼工，逐家攏＿＿＿＿。", "opts": ["歡頭喜面", "操煩", "做大水"], "ans": 0, "hint": "這是教材的例句。", "explain": "「歡頭喜面」就是歡天喜地。"}, {"word": "同齊", "q": "我佮同學＿＿＿＿去踅街。", "opts": ["同齊", "百面", "凡勢"], "ans": 0, "hint": "兩人一起去。", "explain": "「同齊」表示同時一起。"}, {"word": "薅", "q": "中晝日頭真炎，阿公猶原佇菜園＿＿＿＿草。", "opts": ["薅", "掀", "消水"], "ans": 0, "hint": "是共草對土裡拔起來。", "explain": "「薅」是從土中拔除植物。"}, {"word": "凡勢", "q": "天遮爾烏，＿＿＿＿等一下會落雨。", "opts": ["凡勢", "同齊", "大水"], "ans": 0, "hint": "是推測「可能」。", "explain": "「凡勢」可用來表示或許、可能。"}, {"word": "好勢", "q": "出國進前，證件佮行李攏愛準備予＿＿＿＿。", "opts": ["好勢", "大水", "歡頭喜面"], "ans": 0, "hint": "準備妥當。", "explain": "「好勢」有妥當、完善的意思。"}, {"word": "消水", "q": "落大雨了後，水溝若有通，積水就會較緊＿＿＿＿。", "opts": ["消水", "薅", "操煩"], "ans": 0, "hint": "水會慢慢退去。", "explain": "「消水」是積水退去。"}, {"word": "掀了了", "q": "風傷大，遮雨棚予吹甲＿＿＿＿。", "opts": ["掀了了", "歡頭喜面", "同齊"], "ans": 0, "hint": "是全部掀走。", "explain": "「動詞＋了了」可表全部完成、全部消失。"}], "reading": [{"q": "梅姬風颱過後，作者到學校先看著啥物？", "opts": ["大樹連根拔起、跑道破損", "學校完全無損失", "舞蹈班咧表演"], "ans": 0, "hint": "課文第一段描寫校園災後景象。", "explain": "課文寫大茄苳、老榕仔連根拔起，人工跑道像破衫。"}, {"q": "舞蹈教室發生啥物代誌？", "opts": ["厝蓋予風颱掀走", "玻璃全部換新", "教室搬去一樓"], "ans": 0, "hint": "作者看到空地上的鐵鉼後才發現。", "explain": "課文寫舞蹈教室屋頂被颱風吹走。"}, {"q": "學生講「阮舞蹈班有一片天矣！」表面上是因為：", "opts": ["厝頂破開，真正看會著天", "班級得到獎狀", "學校新建天窗"], "ans": 0, "hint": "屋頂已經被吹走。", "explain": "破掉的屋頂讓天空直接露出來，形成表面的「一片天」。"}, {"q": "這句「一片天」較深的意思是：", "opts": ["學生用樂觀心態面對災害", "教室通風較好", "舞蹈班比較輕鬆"], "ans": 0, "hint": "教材特別解析它的象徵意義。", "explain": "教材說明「一片天」象徵正向轉念與積極樂觀。"}, {"q": "作者看到學生歡頭喜面後的感受是：", "opts": ["予學生的天真佮樂觀感動", "真生氣", "覺得學生無責任"], "ans": 0, "hint": "課文直接寫「予我足感動」。", "explain": "學生在災後仍保持天真樂觀，讓作者深受感動。"}, {"q": "教材主旨認為面對天然災害，上適合的態度是：", "opts": ["事先準備、減少傷害，無法避免時正面面對", "完全無需要準備", "只怨天尤人"], "ans": 0, "hint": "教材第33頁有直接總結。", "explain": "教材強調災前準備與災後正向面對。"}, {"q": "小弟一開始講「有風颱才會當毋免去學校」有啥物問題？", "opts": ["干焦想到放假，無想到性命財產危害", "完全正確", "因為風颱無雨水"], "ans": 0, "hint": "阿母隨就提醒伊。", "explain": "阿母提醒不能只想到停課，颱風也會造成生命財產危害。"}, {"q": "課文用「厝蓋予風颱掀去，凡勢是天公伯仔想欲看𪜶跳舞」主要是：", "opts": ["用幽默想像表現正向轉念", "真的相信天公伯仔欲看表演", "介紹舞蹈技巧"], "ans": 0, "hint": "這是一種文學化的說法。", "explain": "這句把災害情境轉化成幽默想像，呼應學生的樂觀。"}], "comprehensive": [{"q": "防災包較適合囥佇佗位？", "opts": ["大門邊或紲手提會著的所在", "厝頂最深的櫃仔", "完全不用固定位置"], "ans": 0, "hint": "教材防災包頁有提醒。", "explain": "教材建議放在大門邊或順手拿得到的地方。"}, {"q": "防災包多久愛檢查一擺？", "opts": ["每半年", "十年一擺", "完全免檢查"], "ans": 0, "hint": "教材有明確時間。", "explain": "教材提醒每半年檢查一次，需要時更新物品。"}, {"q": "下面佗一項有出現佇教材防災包？", "opts": ["手電仔", "電視", "大花盆"], "ans": 0, "hint": "停電時真有用。", "explain": "教材列有手電筒、電池、行動電源等。"}, {"q": "較倚山的地區，風颱來時愛注意：", "opts": ["塗石流", "海嘯一定發生", "完全無風險"], "ans": 0, "hint": "教材生活對話有直接提醒。", "explain": "教材提醒靠山地區遇颱風要注意土石流。"}, {"q": "徛家平常清水溝的作用是：", "opts": ["予水較緊消去，減少做大水", "予魚仔生活", "予路較媠"], "ans": 0, "hint": "和淹水防災有關。", "explain": "清水溝可幫助排水，減少積水與水災。"}, {"q": "「一片天」這課上重要的生活提醒是：", "opts": ["災害前做好準備，災害後保持正向佮韌性", "災害攏無關係", "屋頂破掉是好事"], "ans": 0, "hint": "要把防災與心態兩邊攏想著。", "explain": "教材同時強調事前準備與面對損失時的正面心態。"}]};const names={vocab:"🔤 課文語詞",context:"💭 語境選詞",reading:"📖 讀文理解",comprehensive:"🏆 綜合挑戰"};
let bank,set=[],i=0,score=0,tries=0,weak=[];
const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);
function show(id){["lesson","quiz","result","activity"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");scrollTo(0,0)}
function start(b){bank=b;set=sh(B[b]).slice(0,5);i=0;score=0;weak=[];$("qt").textContent=names[b];show("quiz");render()}
document.querySelectorAll(".start").forEach(x=>x.onclick=()=>start(x.dataset.b));
function render(){tries=0;let q=set[i];$("count").textContent=`第 ${i+1} / 5 題`;$("scoreNow").textContent=`目前 ${score} 分`;$("fill").style.width=`${i*20}%`;$("qcard").innerHTML=`<div class="kicker">${q.word?("本課語詞｜"+q.word):names[bank]}</div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join("")}</div><div id="fb"></div>`}
function pick(n,el){let q=set[i];if(document.querySelector(".correct"))return;tries++;if(n===q.ans){el.classList.add("correct");score++;$("fb").innerHTML=`<div class="feedback ok">✅ 著矣！<br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add("wrong");if(tries===1){if(q.word)weak.push(q.word);$("fb").innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${q.hint}</div>`}else{document.querySelectorAll(".opt")[q.ans].classList.add("correct");$("fb").innerHTML=`<div class="feedback bad">答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}
function next(){i++;if(i<5)render();else finish()}
function finish(){$("s-"+bank).textContent=`上擺 ${score} / 5`;$("rt").textContent=names[bank]+"完成！";$("fs").textContent=score+" / 5";$("msg").textContent=score===5?"🏆 真𠢕！這關全數答著。":score>=4?"🌟 真好！已經真熟矣。":score>=3?"👍 愈來愈會曉！":"🌱 閣練一擺，會愈來愈熟。";let w=[...new Set(weak)];$("weak").innerHTML=w.length?`<b>建議閣練：</b>${w.join("、")}`:"✨ 這擺無特別需要加強的語詞。";show("result")}
$("retry").onclick=()=>start(bank);$("home").onclick=()=>show("lesson");$("back").onclick=()=>show("lesson");

const disasterItems=[["手電仔",1],["電池",1],["急救用品",1],["個人藥品",1],["糧食",1],["行動電源",1],["大花盆",0],["電視遙控器",0],["玻璃杯",0],["厚重相簿",0]];let chosen=new Set();
function renderItems(){$("items").innerHTML=disasterItems.map((x,j)=>`<button class="pick ${chosen.has(j)?"selected":""}" onclick="toggleItem(${j})">${x[0]}</button>`).join("")}
window.toggleItem=j=>{chosen.has(j)?chosen.delete(j):chosen.add(j);renderItems()}
$("activityBtn").onclick=()=>{chosen.clear();show("activity");renderItems()};$("checkItems").onclick=()=>{let correct=[0,1,2,3,4,5];let ok=chosen.size===6&&correct.every(x=>chosen.has(x));$("activityStatus").innerHTML=ok?"✅ 真好！這 6 項攏是教材防災包中適合準備的物件。":"🤔 閣想看覓。教材防災包特別重視照明、電力、急救、個人藥品佮糧食。"};$("activityHome").onclick=()=>show("lesson");
</script></body></html>
