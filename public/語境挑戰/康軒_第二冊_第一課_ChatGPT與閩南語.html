<script>const B={"vocab": [{"q": "「凡勢」是啥物意思？", "opts": ["也許、可能", "一定", "從來無"], "ans": 0, "hint": "教材解說直接寫「也許、可能」。", "explain": "「凡勢」就是也許、可能。", "word": "凡勢"}, {"q": "「拄頭仔」較接近佗一个意思？", "opts": ["一開始", "最後", "中間"], "ans": 0, "hint": "做代誌的起頭。", "explain": "教材解說「拄頭仔」是一開始。", "word": "拄頭仔"}, {"q": "「袂啥輾轉」是講：", "opts": ["不太流利", "完全聽袂著", "講甲真大聲"], "ans": 0, "hint": "課文用來形容人工智慧講閩南語的狀況。", "explain": "「袂啥輾轉」就是不太流利。", "word": "袂啥輾轉"}, {"q": "「爾爾」是啥物意思？", "opts": ["而已", "很多", "馬上"], "ans": 0, "hint": "例句「才差一歲爾爾」。", "explain": "「爾爾」就是而已。", "word": "爾爾"}, {"q": "「紲落來」是：", "opts": ["接下來、接著", "退回去", "暫停"], "ans": 0, "hint": "事情繼續往後發展。", "explain": "「紲落來」就是接下來、接著。", "word": "紲落來"}, {"q": "課文的「開講」較接近：", "opts": ["聊天、說話", "開始寫字", "打開電腦"], "ans": 0, "hint": "ChatGPT 是開講機器人。", "explain": "課文中的「開講」是聊天、說話。", "word": "開講"}, {"q": "課文講「語料」主要是予人工智慧做啥？", "opts": ["學習語言", "充電", "畫圖"], "ans": 0, "hint": "電腦需要讀大量語言資料。", "explain": "課文說人工智慧透過閱讀大量語料慢慢學習語言。", "word": "語料"}, {"q": "「翻譯軟體」佇課文內底的作用是：", "opts": ["共內容轉做閩南語", "增加手機電量", "查天氣"], "ans": 0, "hint": "目前的做法是把 ChatGPT 的話翻譯。", "explain": "教材說明可結合翻譯軟體，把內容翻譯成閩南語。", "word": "翻譯軟體"}], "context": [{"q": "天烏烏，＿＿＿＿等一下就欲落雨矣。", "opts": ["凡勢", "爾爾", "紲落來"], "ans": 0, "hint": "是不確定的推測。", "explain": "可能落雨，所以用「凡勢」。", "word": "凡勢"}, {"q": "學騎跤踏車＿＿＿＿較困難，練久就順矣。", "opts": ["拄頭仔", "爾爾", "紲落來"], "ans": 0, "hint": "指一開始。", "explain": "「拄頭仔」適合表示剛開始學習。", "word": "拄頭仔"}, {"q": "伊學台語無偌久，這馬猶＿＿＿＿。", "opts": ["袂啥輾轉", "紲落來", "爾爾"], "ans": 0, "hint": "講話還不太流利。", "explain": "「袂啥輾轉」表示說得還不太流利。", "word": "袂啥輾轉"}, {"q": "我身軀頂干焦賰十箍＿＿＿＿。", "opts": ["爾爾", "凡勢", "拄頭仔"], "ans": 0, "hint": "就是「而已」。", "explain": "「十箍爾爾」表示只有十元而已。", "word": "爾爾"}, {"q": "第一組報告結束，＿＿＿＿換第二組。", "opts": ["紲落來", "凡勢", "袂啥輾轉"], "ans": 0, "hint": "事情接著進行。", "explain": "「紲落來」表示接下來。", "word": "紲落來"}, {"q": "欲學一種新的語言，愛有足濟＿＿＿＿通練習。", "opts": ["語料", "炸彈", "載具"], "ans": 0, "hint": "語言學習需要大量文本或資料。", "explain": "課文以「語料」說明語言學習所需的資料。", "word": "語料"}], "reading": [{"q": "課文講人工智慧按怎學語言？", "opts": ["讀各種語言的文章，慢慢學習", "只要安裝一次就全部會曉", "只聽一個人講話"], "ans": 0, "hint": "課文把它比做「咱人咧讀冊」。", "explain": "教材說明電腦透過閱讀大量語言文章來學習。"}, {"q": "課文為啥物講 ChatGPT 的閩南語「袂啥輾轉」？", "opts": ["讀過的閩南語語料猶無夠濟", "電腦無網路", "手機無電"], "ans": 0, "hint": "重點是資料量。", "explain": "課文明確指出當時閩南語語料不足。"}, {"q": "臺灣研究團隊先用啥物方式予 ChatGPT 講閩南語？", "opts": ["結合閩南語翻譯軟體", "換一支手機", "只教英語"], "ans": 0, "hint": "課文第三段。", "explain": "先把 ChatGPT 與閩南語翻譯軟體結合。"}, {"q": "課文講目前逐句翻譯的版本，算真正家己講閩南語無？", "opts": ["毋算，猶是逐句翻譯", "算，完全無需要翻譯", "課文無提著"], "ans": 0, "hint": "文中有特別區分「翻譯」和「真正咧講」。", "explain": "教材指出逐句翻譯不等於人工智慧真正自己說閩南語。"}, {"q": "未來若欲予人工智慧真正會曉講閩南語，課文提出啥方向？", "opts": ["予伊吸收閣較濟閩南語文本", "減少閩南語資料", "只使用華語"], "ans": 0, "hint": "文末的展望。", "explain": "課文主張增加閩南語文本與語料供人工智慧吸收。"}, {"q": "本課主要欲予讀者了解：", "opts": ["人工智慧語言科技的學習與發展", "手機按怎拍相", "電腦硬體按怎修"], "ans": 0, "hint": "教材課文分析有總結。", "explain": "教材總結本課以淺白方式解說人工智慧語言科技發展。"}], "comprehensive": [{"q": "若一个 AI 講台語袂啥輾轉，照課文思路，上適合增加啥？", "opts": ["閩南語語料", "手機殼", "螢幕亮度"], "ans": 0, "hint": "語言能力和讀過的資料量有關。", "explain": "課文認為更多閩南語語料有助於語言學習。"}, {"q": "「翻譯做閩南語」佮「家己講閩南語」最大的差別是：", "opts": ["前者靠翻譯，後者能直接生成閩南語", "兩个完全仝款", "前者一定較自然"], "ans": 0, "hint": "課文第三段的核心比較。", "explain": "教材特別指出逐句翻譯並不等於真正會說閩南語。"}, {"q": "課文對人工智慧講閩南語的未來態度較接近：", "opts": ["有可能透過更多文本訓練進步", "永遠無可能", "已經完全無問題"], "ans": 0, "hint": "文末提出未來方向。", "explain": "文末期待透過更多閩南語文本，發展不需翻譯的人工智慧。"}, {"q": "「這學期的課結束矣，＿＿＿＿就欲歇熱。」上適合：", "opts": ["紲落來", "凡勢", "袂啥輾轉"], "ans": 0, "hint": "表示接下來。", "explain": "教材練習題以「紲落來」表示接著發生。", "word": "紲落來"}, {"q": "「這个機器人講閩南語閣＿＿＿＿。」上適合：", "opts": ["袂啥輾轉", "爾爾", "凡勢"], "ans": 0, "hint": "表示不太流利。", "explain": "教材練習題答案為「袂啥輾轉」。", "word": "袂啥輾轉"}, {"q": "根據課文，ChatGPT 未來較可能達到啥功能？", "opts": ["會曉家己講閩南語", "家己開發翻譯軟體", "家己揣所有資料"], "ans": 0, "hint": "教材閱讀題有直接問。", "explain": "教材答案是「會曉家己講閩南語」。"}]};const correctSteps=["人工智慧讀各種語言的文章", "閩南語語料猶無夠濟，講袂啥輾轉", "先結合閩南語翻譯軟體", "逐句翻譯猶毋是真正家己講", "增加閩南語文本予人工智慧吸收", "期待發展會曉家己講閩南語的人工智慧"];const names={"vocab": "🔤 課文語詞", "context": "💭 語境選詞", "reading": "📖 讀文理解", "comprehensive": "🏆 綜合挑戰"};let bank,set=[],i=0,score=0,tries=0,weak=[],steps=[];const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);function show(id){['lesson','quiz','result','activity'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');scrollTo(0,0)}function start(b){bank=b;set=sh(B[b]).slice(0,5);i=0;score=0;weak=[];$('qt').textContent=names[b];show('quiz');render()}document.querySelectorAll('.start').forEach(x=>x.onclick=()=>start(x.dataset.b));function render(){tries=0;let q=set[i];$('count').textContent=`第 ${i+1} / 5 題`;$('scoreNow').textContent=`目前 ${score} 分`;$('fill').style.width=`${i*20}%`;$('qcard').innerHTML=`<div class="kicker">${q.word?('本課語詞｜'+q.word):names[bank]}</div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join('')}</div><div id="fb"></div>`}function pick(n,el){let q=set[i];if(document.querySelector('.correct'))return;tries++;if(n===q.ans){el.classList.add('correct');score++;$('fb').innerHTML=`<div class="feedback ok">✅ 著矣！<br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add('wrong');if(tries===1){if(q.word)weak.push(q.word);$('fb').innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${q.hint}</div>`}else{document.querySelectorAll('.opt')[q.ans].classList.add('correct');$('fb').innerHTML=`<div class="feedback bad">答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}function next(){i++;if(i<5)render();else finish()}function finish(){$('s-'+bank).textContent=`上擺 ${score} / 5`;$('rt').textContent=names[bank]+'完成！';$('fs').textContent=score+' / 5';$('msg').textContent=score===5?'🏆 真𠢕！這關全數答著。':score>=4?'🌟 真好！已經真熟矣。':score>=3?'👍 愈來愈會曉！':'🌱 閣練一擺，會愈來愈熟。';let w=[...new Set(weak)];$('weak').innerHTML=w.length?`<b>建議閣練：</b>${w.join('、')}`:'✨ 這擺無特別需要加強的語詞。';show('result')}$('retry').onclick=()=>start(bank);$('home').onclick=()=>show('lesson');$('back').onclick=()=>show('lesson');function draw(){$('steps').innerHTML=steps.map((s,idx)=>`<div class="step"><b>${idx+1}</b><span>${s}</span><button onclick="moveStep(${idx},-1)">▲</button><button onclick="moveStep(${idx},1)">▼</button></div>`).join('')}function shuffleRoute(){steps=sh(correctSteps);draw();$('stepStatus').textContent="共課文中的發展歷程排好勢。"}window.moveStep=(idx,d)=>{let n=idx+d;if(n<0||n>=steps.length)return;[steps[idx],steps[n]]=[steps[n],steps[idx]];draw()};$('routeBtn').onclick=()=>{show('activity');shuffleRoute()};$('shuffleSteps').onclick=shuffleRoute;$('checkSteps').onclick=()=>{let ok=steps.every((x,j)=>x===correctSteps[j]);$('stepStatus').innerHTML=ok?"✅ 全部著矣！你已經掌握對語料不足、翻譯輔助，到未來自主生成閩南語的發展脈絡。":"🤔 猶有順序愛調整。提示：先學語言，才發現閩南語語料不足；翻譯軟體是中間的解決方式。"};$('activityHome').onclick=()=>show('lesson');</script></body></html>
