<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>康軒第二冊｜第三課｜工作犬</title><style>
:root{--ink:#33453f;--muted:#72827b;--line:#e1e8e4;--accent:#5f8583;--shadow:0 10px 28px #31473e14}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fafcfb,#eef4f2);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}button{font:inherit}.app{max-width:1180px;margin:auto;padding:28px 22px 60px}.top{display:flex;justify-content:space-between;margin-bottom:25px}.pill{border:0;background:#fff;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow)}.hero{text-align:center;margin:12px 0 34px}.hero h1{font-size:39px;margin:0 0 8px}.hero p{color:var(--muted);margin:6px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:23px;padding:24px;box-shadow:var(--shadow)}.level{text-align:center}.icon{font-size:40px}.num{font-weight:900;color:#bcc5c0}.level h3{margin:8px}.level p{min-height:50px;color:var(--muted);line-height:1.55}.extra{background:linear-gradient(145deg,#fff,#eef7f7)}.btn{width:100%;border:0;border-radius:14px;padding:12px 16px;background:#354d46;color:#fff;font-weight:800;cursor:pointer}.hidden{display:none!important}.quiz,.activity{max-width:850px;margin:auto}.title{text-align:center}.title h2{font-size:31px;margin-bottom:5px}.title p{color:var(--muted)}.bar{height:11px;background:#e5ebe8;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:8px 0 14px}.qcard{padding:32px}.kicker{font-weight:800;color:#8e755f}.q{font-size:26px;font-weight:800;line-height:1.55;margin:10px 0 24px}.opts{display:grid;gap:12px}.opt{padding:16px;text-align:left;border:1px solid #dce4df;background:white;border-radius:15px;font-weight:700;cursor:pointer}.correct{background:#edf8f1;border-color:#8ebaa0}.wrong{background:#fff0ef;border-color:#d7a09a}.feedback{margin-top:18px;padding:16px;border-radius:15px;line-height:1.6}.ok{background:#edf8f1}.bad{background:#fff0ef}.hint{background:#fff8e7}.next{width:auto;margin-top:14px}.result{max-width:720px;margin:auto;text-align:center}.score{font-size:62px;font-weight:900;color:var(--accent)}.weak{background:#f3f6f4;border-radius:14px;padding:14px;margin:18px 0}.steps{display:grid;gap:10px}.step{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);background:#fff;border-radius:14px}.step span{flex:1;font-weight:700}.step button{border:0;background:#eef2f0;border-radius:9px;padding:7px 10px}.status{padding:15px;background:#eef5f2;border-radius:14px;line-height:1.6}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style></head><body><div class="app"><div class="top"><button class="pill" id="back" onclick="document.getElementById('lesson').classList.contains('hidden')?(document.querySelectorAll('section').forEach(s=>s.classList.add('hidden')),document.getElementById('lesson').classList.remove('hidden')):location.href='../語境填空.dc.html'">← 返回課文</button><button class="pill">📚 康軒・第二冊</button></div>
<section id="lesson"><div class="hero"><h1>🐕‍🦺 第三課｜工作犬</h1><p><b>警犬、搜救犬、導盲犬、檢疫犬、治療犬</b></p><p>課文語詞 × 語境運用 × 閱讀理解 × 綜合挑戰</p></div><div class="grid">
<div class="card level"><div class="num">01</div><div class="icon">🔤</div><h3>課文語詞</h3><p>教材重點語詞與課文用法</p><small id="s-vocab">未挑戰</small><br><br><button class="btn start" data-b="vocab">開始 →</button></div>
<div class="card level"><div class="num">02</div><div class="icon">💭</div><h3>語境選詞</h3><p>換一个生活情境真正會用</p><small id="s-context">未挑戰</small><br><br><button class="btn start" data-b="context">開始 →</button></div>
<div class="card level"><div class="num">03</div><div class="icon">📖</div><h3>讀文理解</h3><p>讀懂課文內容、因果佮主旨</p><small id="s-reading">未挑戰</small><br><br><button class="btn start" data-b="reading">開始 →</button></div>
<div class="card level"><div class="num">04</div><div class="icon">🏆</div><h3>綜合挑戰</h3><p>能力 × 任務 × 尊重</p><small id="s-comprehensive">未挑戰</small><br><br><button class="btn start" data-b="comprehensive">開始 →</button></div>
<div class="card level extra"><div class="num">＋</div><div class="icon">🐕‍🦺</div><h3>工作犬任務配對路線</h3><p>共五種工作犬照課文紹介順序排好勢。</p><small>本課專屬</small><br><br><button class="btn" id="routeBtn">開始 →</button></div></div></section>
<section id="quiz" class="hidden"><div class="quiz"><div class="title"><h2 id="qt"></h2><p>每擺隨機抽 5 題</p></div><div class="bar"><div class="fill" id="fill"></div></div><div class="meta"><span id="count"></span><span id="scoreNow"></span></div><div class="card qcard" id="qcard"></div></div></section>
<section id="result" class="hidden"><div class="card result"><div style="font-size:48px">🎉</div><h2 id="rt"></h2><div class="score" id="fs"></div><p id="msg"></p><div class="weak" id="weak"></div><button class="btn" id="retry">🔄 閣挑戰一擺</button><br><br><button class="btn" id="home" style="background:#e9efec;color:#31443c">轉去本課</button></div></section>
<section id="activity" class="hidden"><div class="activity"><div class="title"><h2>🐕‍🦺 工作犬任務配對路線</h2><p>按 ▲ ▼ 排出正確順序。</p></div><div class="card"><div class="steps" id="steps"></div><br><button class="btn" id="checkSteps">檢查順序</button><br><br><div class="status" id="stepStatus">共五種工作犬照課文紹介順序排好勢。</div><br><button class="btn" id="shuffleSteps" style="background:#73857e">重新洗牌</button><br><br><button class="btn" id="activityHome" style="background:#e9efec;color:#31443c">完成，轉去本課</button></div></div></section></div>
<script>const B={"vocab": [{"q": "「利」形容五官是：", "opts": ["敏銳", "遲鈍", "疲倦"], "ans": 0, "hint": "警犬鼻仔誠利。", "explain": "教材解說「利」形容五官能力敏銳。", "word": "利"}, {"q": "「定著」形容個性：", "opts": ["穩重", "急躁", "愛睏"], "ans": 0, "hint": "冷靜定著。", "explain": "「定著」形容個性穩重。", "word": "定著"}, {"q": "「搜揣」是：", "opts": ["到處搜索尋找", "整理物件", "休息"], "ans": 0, "hint": "警察規暝咧搜揣。", "explain": "「搜揣」就是到處搜索尋找。", "word": "搜揣"}, {"q": "「幫贊」是：", "opts": ["幫忙、幫助", "稱讚", "責備"], "ans": 0, "hint": "工作犬幫贊警察。", "explain": "「幫贊」就是幫忙、幫助。", "word": "幫贊"}, {"q": "「扭掠」形容：", "opts": ["手腳俐落、動作敏捷", "行路真慢", "身軀真冷"], "ans": 0, "hint": "搜救犬跤手扭掠。", "explain": "教材解說「扭掠」是手腳俐落、動作敏捷。", "word": "扭掠"}, {"q": "「軁」是：", "opts": ["穿過、鑽", "跳高", "坐下"], "ans": 0, "hint": "搜救犬軁來軁去揣人。", "explain": "「軁」是穿過、鑽。", "word": "軁"}, {"q": "「𤆬路」是：", "opts": ["帶路", "問路", "迷路"], "ans": 0, "hint": "導盲犬的重要工作。", "explain": "「𤆬路」就是帶路。", "word": "𤆬路"}, {"q": "「溫馴」是：", "opts": ["溫和順從", "兇猛", "無精神"], "ans": 0, "hint": "治療犬的個性。", "explain": "「溫馴」是溫和順從。", "word": "溫馴"}, {"q": "「安搭」是：", "opts": ["安撫、安慰", "叫醒", "訓練"], "ans": 0, "hint": "心情無好需要人安搭。", "explain": "「安搭」就是安撫、安慰。", "word": "安搭"}, {"q": "「攪吵」是：", "opts": ["打擾", "陪伴", "照顧"], "ans": 0, "hint": "工作犬出任務時毋通共伊…。", "explain": "「攪吵」就是打擾。", "word": "攪吵"}], "context": [{"q": "阮無去過彼間餐廳，請你共阮＿＿＿＿。", "opts": ["𤆬路", "攪吵", "安搭"], "ans": 0, "hint": "需要人帶路。", "explain": "「𤆬路」就是帶路。", "word": "𤆬路"}, {"q": "囡仔驚注射一直哭，護理師咧共伊＿＿＿＿。", "opts": ["安搭", "搜揣", "軁"], "ans": 0, "hint": "安慰情緒。", "explain": "「安搭」是安撫、安慰。", "word": "安搭"}, {"q": "小弟咧讀冊，咱莫共伊＿＿＿＿。", "opts": ["攪吵", "幫贊", "定著"], "ans": 0, "hint": "不要打擾。", "explain": "「攪吵」就是打擾。", "word": "攪吵"}, {"q": "阿姊做代誌跤手真＿＿＿＿，一下就做好。", "opts": ["扭掠", "溫馴", "定著"], "ans": 0, "hint": "動作敏捷。", "explain": "「扭掠」形容手腳俐落。", "word": "扭掠"}, {"q": "警察咧＿＿＿＿走失的囡仔。", "opts": ["搜揣", "安搭", "𤆬路"], "ans": 0, "hint": "到處尋找。", "explain": "「搜揣」是搜索尋找。", "word": "搜揣"}, {"q": "阿明鼻仔真＿＿＿＿，遠遠就鼻著芳味。", "opts": ["利", "定著", "溫馴"], "ans": 0, "hint": "五官敏銳。", "explain": "「利」可形容嗅覺敏銳。", "word": "利"}], "reading": [{"q": "課文紹介幾種工作犬？", "opts": ["五種", "兩種", "十種"], "ans": 0, "hint": "警犬、搜救犬、導盲犬、檢疫犬、治療犬。", "explain": "教材介紹五種常見工作犬。"}, {"q": "警犬主要會幫贊警察搜揣啥？", "opts": ["毒品佮炸彈", "課本佮鉛筆", "水果佮肉類"], "ans": 0, "hint": "冷靜定著、鼻仔誠利。", "explain": "警犬可協助搜索毒品與炸彈。"}, {"q": "搜救犬的特色是：", "opts": ["跤手扭掠，會佇危險現場揣人", "陪老人復健", "佇機場檢查行李"], "ans": 0, "hint": "需要爬高爬低、鑽來鑽去。", "explain": "搜救犬在危險現場搜索並爭取救援時間。"}, {"q": "導盲犬主要幫助啥人？", "opts": ["目睭看袂著的人", "警察", "海關人員"], "ans": 0, "hint": "共人𤆬路。", "explain": "導盲犬協助視障者避開障礙、安全行走。"}, {"q": "檢疫犬佇機場主要檢查：", "opts": ["旅客行李佮包裹的違禁品", "學生作業", "車票"], "ans": 0, "hint": "水果、菜蔬、肉類。", "explain": "檢疫犬用靈敏嗅覺檢查違禁農畜產品。"}, {"q": "治療犬主要提供：", "opts": ["陪伴、復健與安慰", "搜毒品", "帶路"], "ans": 0, "hint": "個性溫馴有耐心。", "explain": "治療犬陪伴需要關照的學生、老人與病人。"}, {"q": "工作犬出任務的時陣，咱應該：", "opts": ["毋通攪吵，予伊專心", "一直叫伊、摸伊", "提物件予伊食"], "ans": 0, "hint": "課文最後提醒。", "explain": "工作犬執勤需要專注，不應打擾。"}], "comprehensive": [{"q": "課文紹介的工作犬佮一般狗上主要的無仝是：", "opts": ["經過專業訓練，會當做專業工課", "一定較大隻", "一定袂吠"], "ans": 0, "hint": "教材閱讀題。", "explain": "教材答案指出工作犬能執行專業工作。"}, {"q": "機場欲檢查旅客敢有紮果子、肉類違禁品，應該派：", "opts": ["檢疫犬", "導盲犬", "治療犬"], "ans": 0, "hint": "好鼻獅。", "explain": "檢疫犬負責檢查旅客行李與包裹。"}, {"q": "災害現場欲爭取時間揣受困者，應該派：", "opts": ["搜救犬", "治療犬", "導盲犬"], "ans": 0, "hint": "會爬高爬低、鑽來鑽去。", "explain": "搜救犬專門在危險現場搜尋人員。"}, {"q": "欲協助目睭看袂著的人安心行出外，應該是：", "opts": ["導盲犬", "警犬", "檢疫犬"], "ans": 0, "hint": "會觀察環境、閃開障礙。", "explain": "導盲犬協助視障者安全行走。"}, {"q": "看到執勤中的導盲犬，上適合的做法是：", "opts": ["保持距離，毋通烏白叫、摸、餵食", "緊去摸伊", "提零食予伊"], "ans": 0, "hint": "教材後面的生活情境。", "explain": "教材提醒執勤導盲犬不能任意呼叫、觸摸或餵食。"}, {"q": "工作犬愛先經過啥才會當出任務？", "opts": ["嚴格、長時間的訓練佮考試", "只要穿制服", "食一頓飯"], "ans": 0, "hint": "課文最後一段。", "explain": "教材說工作犬須經嚴格長期訓練並通過考試。"}]};const correctSteps=["警犬：搜揣毒品佮炸彈", "搜救犬：危險現場鬥揣人", "導盲犬：共目睭看袂著的人𤆬路", "檢疫犬：機場檢查行李佮包裹", "治療犬：陪伴、復健、安搭"];const names={"vocab": "🔤 課文語詞", "context": "💭 語境選詞", "reading": "📖 讀文理解", "comprehensive": "🏆 綜合挑戰"};let bank,set=[],i=0,score=0,tries=0,weak=[],steps=[];const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);function show(id){['lesson','quiz','result','activity'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');scrollTo(0,0)}function start(b){bank=b;set=sh(B[b]).slice(0,5);i=0;score=0;weak=[];$('qt').textContent=names[b];show('quiz');render()}document.querySelectorAll('.start').forEach(x=>x.onclick=()=>start(x.dataset.b));function render(){tries=0;let q=set[i];$('count').textContent=`第 ${i+1} / 5 題`;$('scoreNow').textContent=`目前 ${score} 分`;$('fill').style.width=`${i*20}%`;$('qcard').innerHTML=`<div class="kicker">${q.word?('本課語詞｜'+q.word):names[bank]}</div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join('')}</div><div id="fb"></div>`}function pick(n,el){let q=set[i];if(document.querySelector('.correct'))return;tries++;if(n===q.ans){el.classList.add('correct');score++;$('fb').innerHTML=`<div class="feedback ok">✅ 著矣！<br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add('wrong');if(tries===1){if(q.word)weak.push(q.word);$('fb').innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${q.hint}</div>`}else{document.querySelectorAll('.opt')[q.ans].classList.add('correct');$('fb').innerHTML=`<div class="feedback bad">答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}function next(){i++;if(i<5)render();else finish()}function finish(){$('s-'+bank).textContent=`上擺 ${score} / 5`;$('rt').textContent=names[bank]+'完成！';$('fs').textContent=score+' / 5';$('msg').textContent=score===5?'🏆 真𠢕！這關全數答著。':score>=4?'🌟 真好！已經真熟矣。':score>=3?'👍 愈來愈會曉！':'🌱 閣練一擺，會愈來愈熟。';let w=[...new Set(weak)];$('weak').innerHTML=w.length?`<b>建議閣練：</b>${w.join('、')}`:'✨ 這擺無特別需要加強的語詞。';show('result')}$('retry').onclick=()=>start(bank);$('home').onclick=()=>show('lesson');$('back').onclick=()=>show('lesson');function draw(){$('steps').innerHTML=steps.map((s,idx)=>`<div class="step"><b>${idx+1}</b><span>${s}</span><button onclick="moveStep(${idx},-1)">▲</button><button onclick="moveStep(${idx},1)">▼</button></div>`).join('')}function shuffleRoute(){steps=sh(correctSteps);draw();$('stepStatus').textContent="共五種工作犬照課文紹介順序排好勢。"}window.moveStep=(idx,d)=>{let n=idx+d;if(n<0||n>=steps.length)return;[steps[idx],steps[n]]=[steps[n],steps[idx]];draw()};$('routeBtn').onclick=()=>{show('activity');shuffleRoute()};$('shuffleSteps').onclick=shuffleRoute;$('checkSteps').onclick=()=>{let ok=steps.every((x,j)=>x===correctSteps[j]);$('stepStatus').innerHTML=ok?"✅ 全部著矣！五種工作犬的任務攏分清楚矣。":"🤔 猶有順序愛調整。提示：課文先警犬、搜救犬，才導盲犬、檢疫犬，最後治療犬。"};$('activityHome').onclick=()=>show('lesson');</script></body></html>
