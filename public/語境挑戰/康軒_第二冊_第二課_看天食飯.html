<script>const B={"vocab": [{"q": "「立春」代表：", "opts": ["春季的開始", "夏季的開始", "稻仔收成日"], "ans": 0, "hint": "二十四節氣之一。", "explain": "教材說立春是春季的開始。", "word": "立春"}, {"q": "「賰」是：", "opts": ["剩餘", "增加", "丟掉"], "ans": 0, "hint": "例句是「遮閣有賰一寡仔飯」。", "explain": "「賰」就是剩餘。", "word": "賰"}, {"q": "「驚蟄」的特色是：", "opts": ["春雷響，驚動冬眠動物", "晝上長夜上短", "夏季開始"], "ans": 0, "hint": "教材解說。", "explain": "教材說驚蟄時春雷響，驚動冬眠動物。", "word": "驚蟄"}, {"q": "稻仔「弄花」是指：", "opts": ["授粉階段", "收割", "曬穀"], "ans": 0, "hint": "和稻作生長有關。", "explain": "教材解說「弄花」是授粉階段。", "word": "弄花"}, {"q": "本課「冇去」形容稻穀是：", "opts": ["穀子內底無米粒、結構不實", "完全焦燥", "變金仔色"], "ans": 0, "hint": "大雨可能影響授粉。", "explain": "本課指稻穀裡沒有米粒。", "word": "冇去"}, {"q": "「立夏」代表：", "opts": ["夏季的開始", "冬季的開始", "春季的開始"], "ans": 0, "hint": "節氣名稱已有提示。", "explain": "教材說立夏是夏季的開始。", "word": "立夏"}, {"q": "「滾絞」較接近：", "opts": ["翻騰、掙扎、扭絞", "安靜休息", "慢慢散步"], "ans": 0, "hint": "例句是腹肚雄雄咧滾絞。", "explain": "教材解說「滾絞」有翻騰、掙扎、扭絞之意。", "word": "滾絞"}, {"q": "「夏至」這工的日夜特色是：", "opts": ["晝上長、夜上短", "晝上短、夜上長", "日夜仝長"], "ans": 0, "hint": "教材節氣解說。", "explain": "教材說夏至是晝最長、夜最短。", "word": "夏至"}, {"q": "「透濫」是：", "opts": ["參雜混合", "完全分開", "曬乾"], "ans": 0, "hint": "紅色加白色的例句。", "explain": "「透濫」就是參雜混合。", "word": "透濫"}], "context": [{"q": "食賰的飯猶有一碗，這个「＿＿」就是剩落來。", "opts": ["賰", "弄花", "透濫"], "ans": 0, "hint": "剩餘。", "explain": "「賰」表示剩餘。", "word": "賰"}, {"q": "紅色佮白色＿＿＿＿做伙，就變粉紅仔色。", "opts": ["透濫", "冇去", "立夏"], "ans": 0, "hint": "兩種顏色混合。", "explain": "「透濫」表示參雜混合。", "word": "透濫"}, {"q": "伊毋知欲轉去抑是留落來，心內一直咧＿＿＿＿。", "opts": ["滾絞", "弄花", "夏至"], "ans": 0, "hint": "形容內心掙扎。", "explain": "教材例句延伸可用「滾絞」表示掙扎。", "word": "滾絞"}, {"q": "這塊枋仔內底空空，已經＿＿＿＿矣。", "opts": ["冇去", "透濫", "賰"], "ans": 0, "hint": "結構不扎實。", "explain": "教材例句用「冇去」形容木板不扎實。", "word": "冇去"}, {"q": "春天欲開始，二十四節氣會先講著＿＿＿＿。", "opts": ["立春", "立夏", "夏至"], "ans": 0, "hint": "春季開始。", "explain": "立春代表春季開始。", "word": "立春"}, {"q": "天氣沓沓仔轉翕熱，課文講差不多到＿＿＿＿。", "opts": ["立夏", "驚蟄", "立春"], "ans": 0, "hint": "夏季開始。", "explain": "課文寫立夏左右天氣漸漸轉熱。", "word": "立夏"}], "reading": [{"q": "作田人「看天食飯」主要是因為：", "opts": ["天氣會影響稻作生長佮收成", "逐工愛看電視", "食飯一定愛佇戶外"], "ans": 0, "hint": "課文反覆寫雨水、氣溫、病蟲害。", "explain": "課文呈現天候與稻作收成密切相關。"}, {"q": "立春時，作田人開始做啥？", "opts": ["犁田、淹水、佈秧仔", "割稻仔", "曝粟仔"], "ans": 0, "hint": "課文第一段。", "explain": "立春前後開始整田、灌溉與插秧。"}, {"q": "稻仔弄花的時陣，作田人上驚啥？", "opts": ["落大雨影響授粉", "無冷氣", "日頭落山"], "ans": 0, "hint": "若無稻仔會冇去。", "explain": "課文說弄花時若下大雨，可能造成穀子沒有米粒。"}, {"q": "立夏左右，作田人為啥物上滾絞？", "opts": ["天氣轉熱，病蟲害變濟", "欲過年", "稻仔已經食了"], "ans": 0, "hint": "課文第二段。", "explain": "立夏後病蟲害增多，照顧不好會影響收成。"}, {"q": "夏至左右，課文主要寫啥？", "opts": ["稻仔收成佮曝粟仔", "開始插秧", "買檨仔"], "ans": 0, "hint": "金仔色的田。", "explain": "夏至左右進入稻作收成，割稻後還要曝曬。"}, {"q": "佈田了，作田人會向望天公伯仔按怎疼痛？", "opts": ["風調雨順", "逐工落大雨", "風颱一直來"], "ans": 0, "hint": "教材閱讀題。", "explain": "教材答案是風調雨順。"}], "comprehensive": [{"q": "下面節氣順序佗一个著？", "opts": ["立春 → 驚蟄 → 立夏 → 夏至", "夏至 → 立春 → 驚蟄 → 立夏", "驚蟄 → 夏至 → 立春 → 立夏"], "ans": 0, "hint": "照一年時間往後排。", "explain": "課文依立春、驚蟄、立夏、夏至鋪陳農作。"}, {"q": "「一粒米，百粒汗」上符合本課啥精神？", "opts": ["珍惜農人的辛苦佮食物", "食飯愈緊愈好", "只愛食水果"], "ans": 0, "hint": "課文寫作田人一路照顧到收成。", "explain": "本課呈現農作受天候影響且需要長時間照顧。"}, {"q": "若弄花時落大雨，課文講可能造成：", "opts": ["稻仔冇去", "馬上大豐收", "病蟲害全部無去"], "ans": 0, "hint": "授粉受到影響。", "explain": "課文明確寫「若無稻仔會冇去」。"}, {"q": "夏至田裡的稻仔「披一領金仔色的衫」是比喻：", "opts": ["稻仔成熟呈金黃色", "農人穿新衫", "田裡開金色花"], "ans": 0, "hint": "收成時節的景象。", "explain": "這句描寫成熟稻田的金黃色。"}, {"q": "課文最後稻草芳味、土地陪伴「做伙透濫」，「透濫」是：", "opts": ["混合在一起", "完全消失", "分開保存"], "ans": 0, "hint": "教材詞義。", "explain": "「透濫」是參雜混合。", "word": "透濫"}, {"q": "本課最主要的脈絡是：", "opts": ["節氣變化 × 稻作歷程 × 農人期待", "都市交通 × 科技", "工作犬訓練"], "ans": 0, "hint": "從立春一路寫到夏至。", "explain": "全文以節氣推進稻作歷程，呈現農人看天食飯。"}]};const correctSteps=["立春前後：犁田、淹水、佈秧仔", "驚蟄前後：注意春雷與天候", "稻仔弄花：向望毋通落大雨", "立夏左右：天氣轉熱，病蟲害增加", "夏至左右：稻仔成熟收成", "割稻了後：去稻埕曝粟仔"];const names={"vocab": "🔤 課文語詞", "context": "💭 語境選詞", "reading": "📖 讀文理解", "comprehensive": "🏆 綜合挑戰"};let bank,set=[],i=0,score=0,tries=0,weak=[],steps=[];const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);function show(id){['lesson','quiz','result','activity'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');scrollTo(0,0)}function start(b){bank=b;set=sh(B[b]).slice(0,5);i=0;score=0;weak=[];$('qt').textContent=names[b];show('quiz');render()}document.querySelectorAll('.start').forEach(x=>x.onclick=()=>start(x.dataset.b));function render(){tries=0;let q=set[i];$('count').textContent=`第 ${i+1} / 5 題`;$('scoreNow').textContent=`目前 ${score} 分`;$('fill').style.width=`${i*20}%`;$('qcard').innerHTML=`<div class="kicker">${q.word?('本課語詞｜'+q.word):names[bank]}</div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join('')}</div><div id="fb"></div>`}function pick(n,el){let q=set[i];if(document.querySelector('.correct'))return;tries++;if(n===q.ans){el.classList.add('correct');score++;$('fb').innerHTML=`<div class="feedback ok">✅ 著矣！<br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add('wrong');if(tries===1){if(q.word)weak.push(q.word);$('fb').innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${q.hint}</div>`}else{document.querySelectorAll('.opt')[q.ans].classList.add('correct');$('fb').innerHTML=`<div class="feedback bad">答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}function next(){i++;if(i<5)render();else finish()}function finish(){$('s-'+bank).textContent=`上擺 ${score} / 5`;$('rt').textContent=names[bank]+'完成！';$('fs').textContent=score+' / 5';$('msg').textContent=score===5?'🏆 真𠢕！這關全數答著。':score>=4?'🌟 真好！已經真熟矣。':score>=3?'👍 愈來愈會曉！':'🌱 閣練一擺，會愈來愈熟。';let w=[...new Set(weak)];$('weak').innerHTML=w.length?`<b>建議閣練：</b>${w.join('、')}`:'✨ 這擺無特別需要加強的語詞。';show('result')}$('retry').onclick=()=>start(bank);$('home').onclick=()=>show('lesson');$('back').onclick=()=>show('lesson');function draw(){$('steps').innerHTML=steps.map((s,idx)=>`<div class="step"><b>${idx+1}</b><span>${s}</span><button onclick="moveStep(${idx},-1)">▲</button><button onclick="moveStep(${idx},1)">▼</button></div>`).join('')}function shuffleRoute(){steps=sh(correctSteps);draw();$('stepStatus').textContent="共節氣佮稻作歷程排好勢。"}window.moveStep=(idx,d)=>{let n=idx+d;if(n<0||n>=steps.length)return;[steps[idx],steps[n]]=[steps[n],steps[idx]];draw()};$('routeBtn').onclick=()=>{show('activity');shuffleRoute()};$('shuffleSteps').onclick=shuffleRoute;$('checkSteps').onclick=()=>{let ok=steps.every((x,j)=>x===correctSteps[j]);$('stepStatus').innerHTML=ok?"✅ 全部著矣！你已經掌握課文用節氣串起來的稻作歷程。":"🤔 猶有順序愛調整。提示：課文是對立春開始，最後寫到夏至收成與曝粟仔。"};$('activityHome').onclick=()=>show('lesson');</script></body></html>
