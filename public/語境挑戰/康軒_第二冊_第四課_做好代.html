<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>康軒第二冊｜第四課｜做好代</title><style>

*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fafcfb,#eef4f2);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}button{font:inherit}.app{max-width:1180px;margin:auto;padding:28px 22px 60px}.top{display:flex;justify-content:space-between;margin-bottom:25px}.pill{border:0;background:#fff;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow)}.hero{text-align:center;margin:12px 0 34px}.hero h1{font-size:39px;margin:0 0 8px}.hero p{color:var(--muted);margin:6px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:23px;padding:24px;box-shadow:var(--shadow)}.level{text-align:center}.icon{font-size:40px}.num{font-weight:900;color:#bcc5c0}.level h3{margin:8px}.level p{min-height:50px;color:var(--muted);line-height:1.55}.extra{background:linear-gradient(145deg,#fff,#eef7f7)}.btn{width:100%;border:0;border-radius:14px;padding:12px 16px;background:#354d46;color:#fff;font-weight:800;cursor:pointer}.hidden{display:none!important}.quiz,.activity{max-width:850px;margin:auto}.title{text-align:center}.title h2{font-size:31px;margin-bottom:5px}.title p{color:var(--muted)}.bar{height:11px;background:#e5ebe8;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:8px 0 14px}.qcard{padding:32px}.kicker{font-weight:800;color:#8e755f}.q{font-size:26px;font-weight:800;line-height:1.55;margin:10px 0 24px}.opts{display:grid;gap:12px}.opt{padding:16px;text-align:left;border:1px solid #dce4df;background:white;border-radius:15px;font-weight:700;cursor:pointer}.correct{background:#edf8f1;border-color:#8ebaa0}.wrong{background:#fff0ef;border-color:#d7a09a}.feedback{margin-top:18px;padding:16px;border-radius:15px;line-height:1.6}.ok{background:#edf8f1}.bad{background:#fff0ef}.hint{background:#fff8e7}.next{width:auto;margin-top:14px}.result{max-width:720px;margin:auto;text-align:center}.score{font-size:62px;font-weight:900;color:var(--accent)}.weak{background:#f3f6f4;border-radius:14px;padding:14px;margin:18px 0}.steps{display:grid;gap:10px}.step{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);background:#fff;border-radius:14px}.step span{flex:1;font-weight:700}.step button{border:0;background:#eef2f0;border-radius:9px;padding:7px 10px}.status{padding:15px;background:#eef5f2;border-radius:14px;line-height:1.6}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style></head><body><div class="app"><div class="top"><button class="pill" id="back" onclick="document.getElementById('lesson').classList.contains('hidden')?(document.querySelectorAll('section').forEach(s=>s.classList.add('hidden')),document.getElementById('lesson').classList.remove('hidden')):location.href='../語境填空.dc.html'">← 返回課文</button><button class="pill">📚 康軒・第二冊</button></div>
<section id="lesson"><div class="hero"><h1>💗 第四課｜做好代</h1><p><b>對看見需要，到真正行動：共愛心湠出去</b></p><p>課文語詞 × 語境運用 × 閱讀理解 × 綜合挑戰</p></div><div class="grid">
<div class="card level"><div class="num">01</div><div class="icon">🔤</div><h3>課文語詞</h3><p>教材重點語詞與課文用法</p><small id="s-vocab">未挑戰</small><br><br><button class="btn start" data-b="vocab">開始 →</button></div>
<div class="card level"><div class="num">02</div><div class="icon">💭</div><h3>語境選詞</h3><p>換一个生活情境真正會用</p><small id="s-context">未挑戰</small><br><br><button class="btn start" data-b="context">開始 →</button></div>
<div class="card level"><div class="num">03</div><div class="icon">📖</div><h3>讀文理解</h3><p>讀懂課文內容、因果佮主旨</p><small id="s-reading">未挑戰</small><br><br><button class="btn start" data-b="reading">開始 →</button></div>
<div class="card level"><div class="num">04</div><div class="icon">🏆</div><h3>綜合挑戰</h3><p>公益 × 行動 × 成就感</p><small id="s-comprehensive">未挑戰</small><br><br><button class="btn start" data-b="comprehensive">開始 →</button></div>
<div class="card level extra"><div class="num">＋</div><div class="icon">💗</div><h3>愛心行動路線</h3><p>共學生這擺公益活動的過程排好勢。</p><small>本課專屬</small><br><br><button class="btn" id="routeBtn">開始 →</button></div></div></section>
<section id="quiz" class="hidden"><div class="quiz"><div class="title"><h2 id="qt"></h2><p>每擺隨機抽 5 題</p></div><div class="bar"><div class="fill" id="fill"></div></div><div class="meta"><span id="count"></span><span id="scoreNow"></span></div><div class="card qcard" id="qcard"></div></div></section>
<section id="result" class="hidden"><div class="card result"><div style="font-size:48px">🎉</div><h2 id="rt"></h2><div class="score" id="fs"></div><p id="msg"></p><div class="weak" id="weak"></div><button class="btn" id="retry">🔄 閣挑戰一擺</button><br><br><button class="btn" id="home" style="background:#e9efec;color:#31443c">轉去本課</button></div></section>
<section id="activity" class="hidden"><div class="activity"><div class="title"><h2>💗 愛心行動路線</h2><p>按 ▲ ▼ 排出正確順序。</p></div><div class="card"><div class="steps" id="steps"></div><br><button class="btn" id="checkSteps">檢查順序</button><br><br><div class="status" id="stepStatus">共學生這擺公益活動的過程排好勢。</div><br><button class="btn" id="shuffleSteps" style="background:#73857e">重新洗牌</button><br><br><button class="btn" id="activityHome" style="background:#e9efec;color:#31443c">完成，轉去本課</button></div></div></section></div>
<script>const B={"vocab": [{"q": "本課「柴柴」形容目睭是：", "opts": ["呆滯、不靈活", "真光", "真媠"], "ans": 0, "hint": "影片中的植物人。", "explain": "教材說此處「柴柴」指眼神呆滯、不靈活。", "word": "柴柴"}, {"q": "「開銷」是：", "opts": ["支出、支付出去的金錢", "收入", "獎金"], "ans": 0, "hint": "照顧病人的花費。", "explain": "「開銷」就是開支。", "word": "開銷"}, {"q": "「講甲當熱」的「熱」是：", "opts": ["交流熱絡", "天氣炎熱", "食物燙"], "ans": 0, "hint": "逐家討論得很熱烈。", "explain": "本課「熱」形容人際交流熱絡。", "word": "熱"}, {"q": "「𢯾」是：", "opts": ["緊抱、緊貼", "放開", "推走"], "ans": 0, "hint": "𢯾紙箱仔。", "explain": "「𢯾」是緊抱、緊貼。", "word": "𢯾"}, {"q": "「喝」佇本課是：", "opts": ["大聲喊叫", "喝水", "唱歌"], "ans": 0, "hint": "徛佇麭店門口募集發票。", "explain": "教材解說「喝」是大聲喊叫。", "word": "喝"}, {"q": "「好代」是：", "opts": ["好事、善行", "好消息", "好食物"], "ans": 0, "hint": "做好代。", "explain": "「好代」就是好事、善行。", "word": "好代"}, {"q": "「紲手」是：", "opts": ["順手、隨手", "用左手", "放手"], "ans": 0, "hint": "物件用了愛紲手收好勢。", "explain": "「紲手」就是順手、隨手。", "word": "紲手"}, {"q": "「早齋」是：", "opts": ["早上食的素食", "早餐店", "早起讀冊"], "ans": 0, "hint": "「勸人做好代，較贏食早齋」。", "explain": "教材解說早齋是早上吃的素食。", "word": "早齋"}], "context": [{"q": "最近厝裡買真濟物件，這个月的＿＿＿＿真大。", "opts": ["開銷", "好代", "早齋"], "ans": 0, "hint": "支出增加。", "explain": "「開銷」是支出。", "word": "開銷"}, {"q": "食飯飽，愛＿＿＿＿共家己的碗箸洗清氣。", "opts": ["紲手", "喝", "𢯾"], "ans": 0, "hint": "順手做。", "explain": "教材聽力題以「紲手」表示順手。", "word": "紲手"}, {"q": "伊一下看著阿公＿＿＿＿一堆物件，緊去鬥相共。", "opts": ["𢯾", "喝", "柴柴"], "ans": 0, "hint": "抱著很多東西。", "explain": "「𢯾」表示緊抱。", "word": "𢯾"}, {"q": "運動會欲開始，班長佇台跤大聲＿＿＿＿：「加油！」", "opts": ["喝", "紲手", "開銷"], "ans": 0, "hint": "大聲喊。", "explain": "「喝」是大聲喊叫。", "word": "喝"}, {"q": "去淨灘、做志工攏是咧做＿＿＿＿。", "opts": ["好代", "開銷", "早齋"], "ans": 0, "hint": "善行。", "explain": "「好代」就是好事、善行。", "word": "好代"}, {"q": "逐家討論班遊講甲當＿＿＿＿，意見一个接一个。", "opts": ["熱", "柴柴", "早齋"], "ans": 0, "hint": "交流熱絡。", "explain": "「熱」可形容討論很熱烈。", "word": "熱"}], "reading": [{"q": "老師為啥物欲𤆬學生做公益活動？", "opts": ["看著需要照顧的植物人，想辦法鬥相共", "欲去買麭", "欲比賽"], "ans": 0, "hint": "課文第一段。", "explain": "老師播放影片，引導學生思考如何幫助需要照顧的人。"}, {"q": "老師提出啥物公益方式？", "opts": ["募集發票，若著獎就贊助基金會", "賣手機", "買彩券家己用"], "ans": 0, "hint": "紙箱仔出場。", "explain": "老師帶學生到外面鼓勵民眾捐發票。"}, {"q": "學生徛佇佗位募集發票？", "opts": ["一間麭店門跤口", "學校操場", "火車頂"], "ans": 0, "hint": "課文第三段。", "explain": "課文寫學生站在麵包店門口向客人募集發票。"}, {"q": "六月募集發票的過程為啥物辛苦？", "opts": ["徛外口喝甲流汗兼喙焦", "落大雪", "無人出門"], "ans": 0, "hint": "燒熱的六月。", "explain": "學生在炎熱天氣中站外面大聲募集，流汗又口渴。"}, {"q": "學生最後為啥物感覺真有價值？", "opts": ["做好代有成就感，閣會當幫助人", "有免錢麭通食", "發票全部家己著獎"], "ans": 0, "hint": "教材閱讀題。", "explain": "教材答案是因為做好事有成就感。"}, {"q": "老師講「勸人做好代，較贏食早齋」欲強調：", "opts": ["鼓勵別人做好事真有意義", "早餐毋免食", "發票一定會著獎"], "ans": 0, "hint": "課文最後的體會。", "explain": "這句用來肯定勸人行善與實際公益行動。"}], "comprehensive": [{"q": "除了捐發票，教材有提著佗一个公益行動？", "opts": ["淨灘", "亂擲糞埽", "浪費食物"], "ans": 0, "hint": "課本延伸頁。", "explain": "教材列出到海邊撿垃圾、淨灘。"}, {"q": "庇護工場主要予需要特別牽教的人：", "opts": ["學技能、做工課趁錢", "免做代誌", "只去食點心"], "ans": 0, "hint": "課文延伸對話。", "explain": "教材說庇護工場提供學做點心、工作賺錢的機會。"}, {"q": "購買庇護工場產品較符合課文啥精神？", "opts": ["用消費支持別人自立，也做好代", "只因為較便宜", "一定欲買最多"], "ans": 0, "hint": "愛真的對話。", "explain": "延伸對話把購買庇護工場產品與公益支持連結。"}, {"q": "教材後面捐頭毛的故事主要表現：", "opts": ["用家己會當做的方式幫助病人", "剪頭毛一定較媠", "大家攏愛剪短"], "ans": 0, "hint": "阿文把頭髮捐給化療病人。", "explain": "故事呈現公益不只有捐錢，也可用自身資源幫助人。"}, {"q": "「做好代」上符合佗一个想法？", "opts": ["幫助別人，家己嘛可能感受著快樂", "一定愛有錢才做會到", "做好事只為著得獎"], "ans": 0, "hint": "教材課文分析。", "explain": "教材指出幫助別人，自己也能得到快樂。"}, {"q": "本課公益行動的歷程較接近：", "opts": ["了解需要 → 討論方法 → 實際募集 → 感受成就", "先領獎 → 才想欲幫人", "買物件 → 轉厝"], "ans": 0, "hint": "照課文順序。", "explain": "文章由看影片理解需求開始，再走向實際行動與反思。"}]};const correctSteps=["老師放影片，予學生看著需要幫助的人", "逐家討論會當按怎鬥相共", "老師提出募集發票的方式", "學生𢯾紙箱去外口募集", "麭店人客捐出幾若張發票", "全班收著六十外張發票", "學生感受著做好代的成就感"];const names={"vocab": "🔤 課文語詞", "context": "💭 語境選詞", "reading": "📖 讀文理解", "comprehensive": "🏆 綜合挑戰"};let bank,set=[],i=0,score=0,tries=0,weak=[],steps=[];const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);function show(id){['lesson','quiz','result','activity'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');scrollTo(0,0)}function start(b){bank=b;set=sh(B[b]).slice(0,5);i=0;score=0;weak=[];$('qt').textContent=names[b];show('quiz');render()}document.querySelectorAll('.start').forEach(x=>x.onclick=()=>start(x.dataset.b));function render(){tries=0;let q=set[i];$('count').textContent=`第 ${i+1} / 5 題`;$('scoreNow').textContent=`目前 ${score} 分`;$('fill').style.width=`${i*20}%`;$('qcard').innerHTML=`<div class="kicker">${q.word?('本課語詞｜'+q.word):names[bank]}</div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join('')}</div><div id="fb"></div>`}function pick(n,el){let q=set[i];if(document.querySelector('.correct'))return;tries++;if(n===q.ans){el.classList.add('correct');score++;$('fb').innerHTML=`<div class="feedback ok">✅ 著矣！<br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add('wrong');if(tries===1){if(q.word)weak.push(q.word);$('fb').innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${q.hint}</div>`}else{document.querySelectorAll('.opt')[q.ans].classList.add('correct');$('fb').innerHTML=`<div class="feedback bad">答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}function next(){i++;if(i<5)render();else finish()}function finish(){$('s-'+bank).textContent=`上擺 ${score} / 5`;$('rt').textContent=names[bank]+'完成！';$('fs').textContent=score+' / 5';$('msg').textContent=score===5?'🏆 真𠢕！這關全數答著。':score>=4?'🌟 真好！已經真熟矣。':score>=3?'👍 愈來愈會曉！':'🌱 閣練一擺，會愈來愈熟。';let w=[...new Set(weak)];$('weak').innerHTML=w.length?`<b>建議閣練：</b>${w.join('、')}`:'✨ 這擺無特別需要加強的語詞。';show('result')}$('retry').onclick=()=>start(bank);$('home').onclick=()=>show('lesson');$('back').onclick=()=>show('lesson');function draw(){$('steps').innerHTML=steps.map((s,idx)=>`<div class="step"><b>${idx+1}</b><span>${s}</span><button onclick="moveStep(${idx},-1)">▲</button><button onclick="moveStep(${idx},1)">▼</button></div>`).join('')}function shuffleRoute(){steps=sh(correctSteps);draw();$('stepStatus').textContent="共學生這擺公益活動的過程排好勢。"}window.moveStep=(idx,d)=>{let n=idx+d;if(n<0||n>=steps.length)return;[steps[idx],steps[n]]=[steps[n],steps[idx]];draw()};$('routeBtn').onclick=()=>{show('activity');shuffleRoute()};$('shuffleSteps').onclick=shuffleRoute;$('checkSteps').onclick=()=>{let ok=steps.every((x,j)=>x===correctSteps[j]);$('stepStatus').innerHTML=ok?"✅ 全部著矣！你已經掌握這篇課文對「看見需要」到「實際行動」的完整歷程。":"🤔 猶有順序愛調整。提示：先看影片、討論，才開始募集；成就感是活動完成了後的體會。"};$('activityHome').onclick=()=>show('lesson');</script></body></html>
