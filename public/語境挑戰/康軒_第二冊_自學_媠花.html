*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fafcfb,#eef4f2);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}button{font:inherit}.app{max-width:1180px;margin:auto;padding:28px 22px 60px}.top{display:flex;justify-content:space-between;margin-bottom:25px}.pill{border:0;background:#fff;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow)}.hero{text-align:center;margin:12px 0 34px}.hero h1{font-size:39px;margin:0 0 8px}.hero p{color:var(--muted);margin:6px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:23px;padding:24px;box-shadow:var(--shadow)}.level{text-align:center}.icon{font-size:40px}.num{font-weight:900;color:#bcc5c0}.level h3{margin:8px}.level p{min-height:50px;color:var(--muted);line-height:1.55}.extra{background:linear-gradient(145deg,#fff,#eef7f7)}.btn{width:100%;border:0;border-radius:14px;padding:12px 16px;background:#354d46;color:#fff;font-weight:800;cursor:pointer}.hidden{display:none!important}.quiz,.activity{max-width:850px;margin:auto}.title{text-align:center}.title h2{font-size:31px;margin-bottom:5px}.title p{color:var(--muted)}.bar{height:11px;background:#e5ebe8;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:8px 0 14px}.qcard{padding:32px}.kicker{font-weight:800;color:#8e755f}.q{font-size:26px;font-weight:800;line-height:1.55;margin:10px 0 24px}.opts{display:grid;gap:12px}.opt{padding:16px;text-align:left;border:1px solid #dce4df;background:white;border-radius:15px;font-weight:700;cursor:pointer}.correct{background:#edf8f1;border-color:#8ebaa0}.wrong{background:#fff0ef;border-color:#d7a09a}.feedback{margin-top:18px;padding:16px;border-radius:15px;line-height:1.6}.ok{background:#edf8f1}.bad{background:#fff0ef}.hint{background:#fff8e7}.next{width:auto;margin-top:14px}.result{max-width:720px;margin:auto;text-align:center}.score{font-size:62px;font-weight:900;color:var(--accent)}.weak{background:#f3f6f4;border-radius:14px;padding:14px;margin:18px 0}.steps{display:grid;gap:10px}.step{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);background:#fff;border-radius:14px}.step span{flex:1;font-weight:700}.step button{border:0;background:#eef2f0;border-radius:9px;padding:7px 10px}.status{padding:15px;background:#eef5f2;border-radius:14px;line-height:1.6}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}

<section id="lesson"><div class="hero"><h1>🌸 自學篇｜媠花</h1><p><b>逐个人攏是特別的存在：肯定家己、看見希望</b></p><p>課文語詞 × 語境運用 × 閱讀理解 × 綜合挑戰</p></div><div class="grid">
<div class="card level"><div class="num">01</div><div class="icon">🔤</div><h3>課文語詞</h3><p>教材重點語詞與課文用法</p><small id="s-vocab">未挑戰</small><br><br><button class="btn start" data-b="vocab">開始 →</button></div>

<script>const B={"vocab": [{"q": "「呵咾」較接近：", "opts": ["稱讚", "責罵", "忘記"], "ans": 0, "hint": "照鏡呵咾家己。", "explain": "在這篇課文語境中是稱讚、肯定自己。", "word": "呵咾"}, {"q": "「清芳」是：", "opts": ["清香、芳香", "顏色", "聲音"], "ans": 0, "hint": "花有無仝款的清芳。", "explain": "「清芳」在課文中指花的芳香。", "word": "清芳"}, {"q": "「連鞭」是：", "opts": ["馬上、立刻", "慢慢仔", "永遠"], "ans": 0, "hint": "西北雨一下就過去。", "explain": "課文華語對譯把「連鞭」譯為馬上。", "word": "連鞭"}, {"q": "「色水」在課文中是：", "opts": ["顏色", "雨水", "香味"], "ans": 0, "hint": "彩虹充滿各種…。", "explain": "課文華語對譯對應「各種的顏色」。", "word": "色水"}, {"q": "「獨一無二」較接近：", "opts": ["每个人攏有家己的特色", "逐个人攏完全仝款", "一定愛贏別人"], "ans": 0, "hint": "這篇的核心。", "explain": "課文強調每個人都是特別的存在。", "word": "獨一無二"}], "context": [{"q": "考試進步矣，我愛學習＿＿＿＿家己的努力。", "opts": ["呵咾", "煩惱", "比較"], "ans": 0, "hint": "稱讚自己。", "explain": "「呵咾」可用來表達肯定、稱讚。", "word": "呵咾"}, {"q": "雨煞矣，＿＿＿＿日頭就出來。", "opts": ["連鞭", "逐工", "無需要"], "ans": 0, "hint": "馬上。", "explain": "「連鞭」表示馬上、立刻。", "word": "連鞭"}, {"q": "花園內底逐一蕊花攏有家己的＿＿＿＿。", "opts": ["清芳", "西北雨", "鏡"], "ans": 0, "hint": "花的香氣。", "explain": "「清芳」指芳香。", "word": "清芳"}, {"q": "彩虹有真濟款＿＿＿＿，看起來真媠。", "opts": ["色水", "煩惱", "目標"], "ans": 0, "hint": "各種顏色。", "explain": "「色水」在本文對應顏色。", "word": "色水"}, {"q": "毋免一直佮別人比較，因為逐个人攏是＿＿＿＿的。", "opts": ["獨一無二", "完全仝款", "無特色"], "ans": 0, "hint": "每個人都有自己的特點。", "explain": "這符合課文自我肯定的主旨。", "word": "獨一無二"}], "reading": [{"q": "這篇自學課文上主要鼓勵讀者：", "opts": ["肯定家己，毋免一直佮別人比較", "一定愛比別人較媠", "遇著困難就放棄"], "ans": 0, "hint": "課文欣賞頁的總結。", "explain": "教材指出每個人都是特別的存在，不需要與別人比較。"}, {"q": "課文用「每一蕊花」來比喻：", "opts": ["每个人攏有無仝款的特色", "逐个人攏愛種花", "世界只有一種花"], "ans": 0, "hint": "花有不同的芳香與顏色。", "explain": "花的差異象徵每個人的獨特。"}, {"q": "「西北雨」佇課文主旨中較接近：", "opts": ["暫時的困難，總是會過去", "永遠的失敗", "一定會落一整工"], "ans": 0, "hint": "後面接著彩虹。", "explain": "教材欣賞指出再大的西北雨總會過去，接著會看見美麗的虹。"}, {"q": "課文欣賞建議面對家己的目標：", "opts": ["堅定向前行", "一直看別人", "無需要努力"], "ans": 0, "hint": "教材第73頁的賞析。", "explain": "教材指出只要堅定自己的目標向前行。"}, {"q": "這篇歌詞重複「西北雨連鞭就過去」主要牽出：", "opts": ["歌曲的主要氣氛與鼓勵力量", "食物主題", "交通主題"], "ans": 0, "hint": "教材課文欣賞有說明。", "explain": "教材指出這句重複三次，牽出歌曲主要氣氛。"}], "comprehensive": [{"q": "若同學感覺家己佮別人無仝，較符合這篇課文的回應是：", "opts": ["無仝無要緊，逐个人攏有家己的特色", "一定愛改甲佮別人仝款", "毋通有家己的想法"], "ans": 0, "hint": "每一蕊花攏無仝。", "explain": "課文鼓勵接受差異、肯定自己的獨特。"}, {"q": "遇著一次失敗，較符合「西北雨連鞭就過去」的是：", "opts": ["歇一下、調整後閣向前", "永遠放棄", "認定家己無才調"], "ans": 0, "hint": "困難是暫時的。", "explain": "教材以雨後彩虹比喻困難終會過去。"}, {"q": "這篇自學課文用花與彩虹主要傳達：", "opts": ["多樣、獨特與希望", "所有人愛仝款", "只有成功的人才有價值"], "ans": 0, "hint": "花有不同芳香與顏色。", "explain": "花象徵個體差異，彩虹象徵困難過後的希望。"}, {"q": "下面佗一句上符合課文精神？", "opts": ["我會欣賞家己，也尊重別人的無仝", "我一定愛比逐个人較好", "別人佮我無仝就是毋著"], "ans": 0, "hint": "不比較、肯定自己。", "explain": "課文核心是自我肯定與尊重差異。"}, {"q": "課文的情緒走向較接近：", "opts": ["肯定自己 → 接納不同 → 困難會過去 → 看見希望", "比較自己 → 放棄 → 失望", "生氣 → 爭輸贏"], "ans": 0, "hint": "照課文欣賞的整理。", "explain": "教材賞析把自我肯定、差異與雨後彩虹串成主要意義。"}]};const correctSteps=["照鏡呵咾家己、肯定家己", "接受家己佮別人無相仝", "親像逐蕊花攏有無仝的清芳", "困難親像西北雨，總是會過去", "紲落來看著美麗的彩虹"];const names={"vocab": "🔤 課文語詞", "context": "💭 語境選詞", "reading": "📖 讀文理解", "comprehensive": "🏆 綜合挑戰"};let bank,set=[],i=0,score=0,tries=0,weak=[],steps=[];const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);function show(id){['lesson','quiz','result','activity'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');scrollTo(0,0)}function start(b){bank=b;set=sh(B[b]).slice(0,5);i=0;score=0;weak=[];$('qt').textContent=names[b];show('quiz');render()}document.querySelectorAll('.start').forEach(x=>x.onclick=()=>start(x.dataset.b));function render(){tries=0;let q=set[i];$('count').textContent=`第 ${i+1} / 5 題`;$('scoreNow').textContent=`目前 ${score} 分`;$('fill').style.width=`${i*20}%`;$('qcard').innerHTML=`<div class="kicker">${q.word?('本課語詞｜'+q.word):names[bank]}</div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join('')}</div><div id="fb"></div>`}function pick(n,el){let q=set[i];if(document.querySelector('.correct'))return;tries++;if(n===q.ans){el.classList.add('correct');score++;$('fb').innerHTML=`<div class="feedback ok">✅ 著矣！<br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add('wrong');if(tries===1){if(q.word)weak.push(q.word);$('fb').innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${q.hint}</div>`}else{document.querySelectorAll('.opt')[q.ans].classList.add('correct');$('fb').innerHTML=`<div class="feedback bad">答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}function next(){i++;if(i<5)render();else finish()}function finish(){$('s-'+bank).textContent=`上擺 ${score} / 5`;$('rt').textContent=names[bank]+'完成！';$('fs').textContent=score+' / 5';$('msg').textContent=score===5?'🏆 真𠢕！這關全數答著。':score>=4?'🌟 真好！已經真熟矣。':score>=3?'👍 愈來愈會曉！':'🌱 閣練一擺，會愈來愈熟。';let w=[...new Set(weak)];$('weak').innerHTML=w.length?`<b>建議閣練：</b>${w.join('、')}`:'✨ 這擺無特別需要加強的語詞。';show('result')}$('retry').onclick=()=>start(bank);$('home').onclick=()=>show('lesson');$('back').onclick=()=>show('lesson');function draw(){$('steps').innerHTML=steps.map((s,idx)=>`<div class="step"><b>${idx+1}</b><span>${s}</span><button onclick="moveStep(${idx},-1)">▲</button><button onclick="moveStep(${idx},1)">▼</button></div>`).join('')}function shuffleRoute(){steps=sh(correctSteps);draw();$('stepStatus').textContent="共課文主要意象佮想法排好勢。"}window.moveStep=(idx,d)=>{let n=idx+d;if(n<0||n>=steps.length)return;[steps[idx],steps[n]]=[steps[n],steps[idx]];draw()};$('routeBtn').onclick=()=>{show('activity');shuffleRoute()};$('shuffleSteps').onclick=shuffleRoute;$('checkSteps').onclick=()=>{let ok=steps.every((x,j)=>x===correctSteps[j]);$('stepStatus').innerHTML=ok?"✅ 全部著矣！你已經掌握〈媠花〉對自我肯定、接納差異到看見希望的主要脈絡。":"🤔 猶有順序愛調整。提示：先肯定自己、接納不同，最後用西北雨與彩虹表達困難會過去。"};$('activityHome').onclick=()=>show('lesson');</script></body></html>
