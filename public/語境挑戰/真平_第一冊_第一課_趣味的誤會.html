</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">😄</div><h1>第1課｜趣味的誤會</h1><p>一詞多義、語境理解與台語的趣味</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「會失禮」較接近啥物意思？","o":["道歉、賠不是","失去禮物","無禮貌","會毋見去"],"a":0,"e":"會失禮：道歉、賠不是。例：我來共你會失禮。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「頇顢」較接近啥物意思？","o":["笨拙、無才調","害羞、內向","不好意思","真𠢕講話"],"a":0,"e":"頇顢：形容人愚笨、遲鈍、笨拙。例：小弟真頇顢讀冊。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「滾耍笑」較接近啥物意思？","o":["開玩笑","笑甲咧滾","耍甲真歡喜","滾水燙著"],"a":0,"e":"滾耍笑：開玩笑。例：欲滾耍笑愛看時陣。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「歹勢」有兩个意思，下面佗一組著？","o":["不好意思／害羞、難為情","歹人／勢力大","壞運氣／生病","生氣／不滿"],"a":0,"e":"歹勢：①不好意思、對不起 ②害羞、難為情。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「好料」較接近啥物意思？","o":["大餐、美食","好的材料","好運","好的布料"],"a":0,"e":"好料：大餐、美食。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「目油」是啥物？","o":["目睭受刺激抑忝的時流出來的目屎","抹目睭的藥膏","目睭的油垢","看人的眼神"],"a":0,"e":"目油：眼睛受刺激或疲勞時分泌的透明液體。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「加食寡」較接近啥物意思？","o":["加食一寡","雞食較濟","加一寡鹽","食傷濟"],"a":0,"e":"加食寡：多吃一點。阿淇聽做「雞」，所以講這是豬毋是雞。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「趣味」佮「有趣味」有啥物無仝？","o":["趣味＝有趣；有趣味＝有興趣","兩个意思攏仝款","趣味＝有興趣；有趣味＝有趣","攏是無聊的意思"],"a":0,"e":"阿淇真趣味（有趣）；阿淇對食好料上有趣味（有興趣）。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「呔會」較接近啥物意思？","o":["怎麼會、豈會","一定會","袂曉","會當"],"a":0,"e":"呔會：怎麼會、豈會。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「目睭花花」較接近啥物意思？","o":["看毋著、認毋著","目睭真媠","目睭咧流目屎","看著花蕊"],"a":0,"e":"目睭花花：看錯、誤認。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"閩南語的「車頭」，課文內底是指啥物？","o":["車站","車的頭前","開車的人","停車場"],"a":0,"e":"車頭＝車站；阿淇誤會做公車的車頭。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「阮頭的是粗人，若有啥物得失的所在，我先共你＿＿。」空格揀佗一个？","o":["會失禮","滾耍笑","頇顢","加食寡"],"a":0,"e":"先跟你道歉，用會失禮。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊的個性真閉思，真＿＿表達對序大人的關懷。」空格揀佗一个？","o":["頇顢","會失禮","趣味","好料"],"a":0,"e":"不擅長表達，用頇顢。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「王同學做人真熱心，閣時常佮阮＿＿，所以人緣真好。」空格揀佗一个？","o":["滾耍笑","會失禮","頇顢","流目油"],"a":0,"e":"時常開玩笑，人緣好。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「拄才上課老師講的課文，我敢若＿＿。」空格揀佗一句？","o":["鴨仔聽雷","老人毋講古，少年毋捌寶","目睭花花，匏仔看做菜瓜","好喙大富貴"],"a":0,"e":"鴨仔聽雷：比喻完全聽不懂。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「咱愛定定聽序大人的牽教，因為＿＿。」空格揀佗一句上適當？","o":["老人毋講古，少年毋捌寶","鴨仔聽雷","目睭花花，匏仔看做菜瓜","三講，四毋著"],"a":0,"e":"老人家有許多年輕人不懂的寶貴經驗。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「我拄起床，＿＿，煞共遙控器當做手機仔紮去上班。」空格揀佗一句？","o":["目睭花花，匏仔看做菜瓜","鴨仔聽雷","老人毋講古，少年毋捌寶","好禮，好做伙"],"a":0,"e":"揶揄人看錯東西。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「先生，你佗位無爽快？我先共你量體溫。」這个「先生」是啥人？","o":["醫生","老師","翁婿","道士"],"a":0,"e":"量體溫、問哪裡不舒服，是醫生。「先生」一詞多義。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「先生，這條我袂曉，拜託你教我。」這个「先生」是啥人？","o":["老師","醫生","翁婿","司機"],"a":0,"e":"請人教題目，是老師。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"有禮貌的人，別人才會感覺你好相處。是佗一句俗諺？","o":["好禮，好做伙","隔壁親家，禮數原在","好喙大富貴","鴨仔聽雷"],"a":0,"e":"好禮，好做伙：有禮貌人家才覺得你好相處。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"厝邊的親情嘛愛照禮數來往，莫因為較熟就無禮貌。是佗一句俗諺？","o":["隔壁親家，禮數原在","好禮，好做伙","好喙大富貴","見面有呼請，較贏佇厝咧教囝"],"a":0,"e":"關係再親近，應有的禮節不能忽略。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"喙甜、會講好話的人，較容易得著人鬥相共。是佗一句俗諺？","o":["好喙大富貴","好禮，好做伙","三講，四毋著","鴨仔聽雷"],"a":0,"e":"好喙指嘴巴甜，說好話有禮貌，做事容易成功。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"課文內底，阿母講「約佇車頭」，阿淇按怎誤會？","o":["掠準是佇車的頭前等","掠準是去停車場","掠準是去公車站牌","掠準是去火車頂"],"a":0,"e":"阿淇以為是車子的前端，媽媽說約在那裡多危險！","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"根據課文，阿母佮阿公約的「車頭」應該佇佗位？","o":["火車站抑是客運總站","客運車停車格的車頭遐","火車頭前第一節車廂","計程車排班的頭一台車邊仔"],"a":0,"e":"車頭就是車站。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿公佇車頭的時一直講「歹勢」，是按怎？","o":["晏到，予人等","予序細呵咾","傷久無看著孫仔","無照規矩停車"],"a":0,"e":"阿公遲到，在向大家道歉。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿公聽著主持人講「三碗豬跤」，伊掠準是啥物？","o":["伊透早食三碗豬跤","伊欲請人食豬跤","伊咧賣豬跤","伊咧講豬跤真貴"],"a":0,"e":"其實「三碗豬跤」是泰國話的問候語。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿淇講「I love you」，阿公聽做啥物？","o":["流目油","我愛你","牛奶","愛食魚"],"a":0,"e":"阿公以為阿淇眼睛昏花流目油。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿媽講「加食寡」，阿淇按怎回答？","o":["阿媽，這是豬，毋是雞","我食袂落矣","多謝阿媽","我欲食好料"],"a":0,"e":"阿淇把「加」聽成「雞」。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿母講阿淇「對食好料上有趣味」，意思是？","o":["阿淇上有興趣的是食好料","阿淇食好料的時真好笑","阿淇袂曉食好料","好料真趣味"],"a":0,"e":"有趣味＝有興趣。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"對話內底，阿母講「你嘛予我小喘氣一下」，「喘氣」是啥物意思？","o":["小歇一下","深呼吸","喘袂過氣","咧受氣"],"a":0,"e":"「喘氣」可以是呼吸，也可以是短暫的休息。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"這課主要欲表達啥物？","o":["閩南語一詞多義佮仝音造成的趣味誤會","食好料的重要","去泰國𨑨迌","阿公的身體真好"],"a":0,"e":"透過語言的趣味性，體會閩南語詞的豐富意涵。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈趣味的誤會〉這課是用啥物形式呈現？","o":["漫畫","現代詩","七字仔","書信"],"a":0,"e":"本課是一則漫畫。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"下面佗一个語詞較無適合用來形容人？","o":["腥臊","趣味","歹勢","頇顢"],"a":0,"e":"腥臊是形容菜色豐盛。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"朗讀的技巧，下面佗一个毋是？","o":["改稿加字","停頓","重音","速度"],"a":0,"e":"朗讀四技巧：停頓、重音、速度、語氣；而且愛尊重原稿，毋通改稿。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"朗讀「阿公昨暝離開矣，我足想伊。」較適合按怎讀？","o":["語調放低，速度放慢","語調吊懸，速度加緊","大聲喝出來","愈讀愈緊"],"a":0,"e":"悲傷的語氣：語調放低，速度放慢。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"朗讀「這本冊敢是你的？」語調應該按怎？","o":["漸漸懸起來","漸漸放低","攏無變","愈來愈細聲"],"a":0,"e":"疑問語氣：語調漸漸懸起來。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"朗讀停頓的時間，下面佗一个上長？","o":["句號","頓號","逗號","冒號"],"a":0,"e":"頓號＜逗號、冒號＜分號、破折號＜句號、問號、感嘆號。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"若同學講一句閩南語，你聽了感覺怪怪的，較好的做法是？","o":["先問清楚伊欲表達的意思","笑伊講毋著","家己烏白臆","直接毋插伊"],"a":0,"e":"一詞多義容易誤會，先確認意思。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../語境填空.dc.html'};</script></body></html>
