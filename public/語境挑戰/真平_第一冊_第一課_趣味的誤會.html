<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>趣味的誤會｜真平第一冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../語境填空.dc.html">← 返回整冊</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">😄</div><h1>第1課｜趣味的誤會</h1><p>一詞多義、語境理解與台語的趣味</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>語詞意思與教材重點。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>掌握課文人物、事件與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把本課概念帶回生活判斷。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每次隨機抽最多 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab": [{"q": "「歹勢」較接近啥物意思？", "o": ["不好意思、難為情", "笨手笨腳、不靈巧", "害羞、內向"], "a": 0, "e": "「歹勢」：不好意思、難為情。"}, {"q": "「頇顢」較接近啥物意思？", "o": ["笨手笨腳、不靈巧", "不好意思、難為情", "害羞、內向"], "a": 0, "e": "「頇顢」：笨手笨腳、不靈巧。"}, {"q": "「閉思」較接近啥物意思？", "o": ["害羞、內向", "不好意思、難為情", "笨手笨腳、不靈巧"], "a": 0, "e": "「閉思」：害羞、內向。"}, {"q": "「好料」較接近啥物意思？", "o": ["好吃或好的東西", "不好意思、難為情", "笨手笨腳、不靈巧"], "a": 0, "e": "「好料」：好吃或好的東西。"}, {"q": "「目油」較接近啥物意思？", "o": ["眼淚", "不好意思、難為情", "笨手笨腳、不靈巧"], "a": 0, "e": "「目油」：眼淚。"}, {"q": "「目睭花花」較接近啥物意思？", "o": ["眼睛昏花、看不清楚", "不好意思、難為情", "笨手笨腳、不靈巧"], "a": 0, "e": "「目睭花花」：眼睛昏花、看不清楚。"}, {"q": "「滾耍笑」較接近啥物意思？", "o": ["開玩笑、說笑", "不好意思、難為情", "笨手笨腳、不靈巧"], "a": 0, "e": "「滾耍笑」：開玩笑、說笑。"}, {"q": "「趣味」較接近啥物意思？", "o": ["有意思、有趣", "不好意思、難為情", "笨手笨腳、不靈巧"], "a": 0, "e": "「趣味」：有意思、有趣。"}, {"q": "「喘氣」較接近啥物意思？", "o": ["呼吸；課文情境也造成語意誤會", "不好意思、難為情", "笨手笨腳、不靈巧"], "a": 0, "e": "「喘氣」：呼吸；課文情境也造成語意誤會。"}, {"q": "「小歇」較接近啥物意思？", "o": ["稍微休息一下", "不好意思、難為情", "笨手笨腳、不靈巧"], "a": 0, "e": "「小歇」：稍微休息一下。"}], "context": [{"q": "「我拄食飽，你嘛予我小喘氣一下。」這句的「小喘氣」較接近啥物？", "o": ["稍微休息一下", "完全袂呼吸", "去運動"], "a": 0, "e": "課文的趣味來自語詞理解不同，這裡是「稍微休息一下」。"}, {"q": "「鴨仔聽雷」用來形容啥物情形？", "o": ["完全聽不懂", "聽甲真清楚", "講甲真大聲"], "a": 0, "e": "教材解釋「鴨仔聽雷」比喻完全聽不懂。"}, {"q": "「目睭花花，匏仔看做菜瓜」是在講啥物？", "o": ["看錯物件", "食傷濟", "行傷緊"], "a": 0, "e": "這句俗諺用來揶揄人看錯東西。"}, {"q": "若是因為仝音抑是一詞多義造成誤會，較好的做法是？", "o": ["問清楚語境佮意思", "隨便猜", "直接生氣"], "a": 0, "e": "本課透過趣味誤會提醒咱愛看語境理解語詞。"}, {"q": "「老人毋講古，少年毋捌寶」主要提醒啥物？", "o": ["珍惜長輩的經驗", "少年毋通講話", "老人毋通講古"], "a": 0, "e": "教材說老人有許多年輕人不懂的知識經驗。"}], "reading": [{"q": "〈趣味的誤會〉主要欲予咱體會啥物？", "o": ["台語一詞多義佮語言趣味", "市場買賣", "農村生活"], "a": 0, "e": "本課以語言誤會呈現台語詞義豐富。"}, {"q": "課文人物發現誤會了後的氣氛較接近？", "o": ["笑開、感覺台語真趣味", "大吵一場", "無人講話"], "a": 0, "e": "課文最後以「哈哈哈！咱的話實在真趣味」收束。"}, {"q": "本課的「誤會」主要按怎發生？", "o": ["仝一个講法予人理解做無仝意思", "無聽著聲", "看無文字"], "a": 0, "e": "核心是語詞多義與語境造成的趣味誤會。"}, {"q": "本課學習最需要注意啥物？", "o": ["愛配合語境理解語詞", "干焦背華語翻譯", "每个詞攏只有一个意思"], "a": 0, "e": "同一語詞在不同語境可能有不同理解。"}, {"q": "「咱的話實在真趣味」指的是？", "o": ["台語語詞豐富、有趣", "台語真簡單", "台語無語意差別"], "a": 0, "e": "課文透過誤會凸顯台語的語言趣味。"}], "comprehensive": [{"q": "下面佗一个上符合本課精神？", "o": ["聽毋捌就問清楚", "聽毋捌就亂猜", "所有語詞攏照字面解"], "a": 0, "e": "理解語言要配合情境並確認意思。"}, {"q": "若同學講一句台語予你誤會，第一步較適合？", "o": ["確認伊欲表達的意思", "笑伊講毋著", "直接離開"], "a": 0, "e": "先確認語意，會當避免溝通誤會。"}, {"q": "本課適合用啥物方式複習？", "o": ["把同一語詞放入無仝語境比較", "只抄十遍", "只看華語"], "a": 0, "e": "比較語境最能理解一詞多義。"}, {"q": "「趣味的誤會」的學習重點屬於？", "o": ["語言理解與溝通", "投資理財", "地理地形"], "a": 0, "e": "本課核心是語言的多義與溝通。"}, {"q": "俗諺「鴨仔聽雷」若用佇上課，是講學生？", "o": ["完全聽不懂", "聽了真感動", "讀甲真順"], "a": 0, "e": "教材明確解釋為完全聽不懂。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
