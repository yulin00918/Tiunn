</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🦁</div><h1>第3課｜人佮獅</h1><p>善良、感恩、報恩與朋友互助</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「揣頭路」較接近啥物意思？","o":["找工作","找路","揣頭殼","找出口"],"a":0,"e":"揣頭路：找工作。揣，尋找。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「斟酌」較接近啥物意思？","o":["注意、仔細","倒酒","隨便","考試"],"a":0,"e":"斟酌：注意，特別仔細專注做某事。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「咇咇掣」較接近啥物意思？","o":["驚甲身軀咧顫","咧笑","咧跳舞","咧唱歌"],"a":0,"e":"咇咇掣：因恐懼而身體發抖。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「勻勻仔」較接近啥物意思？","o":["慢慢地、小心地","均勻地","一直","大力"],"a":0,"e":"勻勻仔：慢慢地、謹慎小心地。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「無偌久」較接近啥物意思？","o":["沒多久","真久","無時間","毋知偌久"],"a":0,"e":"無偌久：不久、沒多久。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「霧嗄嗄」較接近啥物意思？","o":["一頭霧水","起大霧","聲沙沙","真清楚"],"a":0,"e":"霧嗄嗄：理不出頭緒、一頭霧水。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「毋甘」較接近啥物意思？","o":["不忍、難過","毋甘願","毋甜","毋敢"],"a":0,"e":"毋甘：難過、不忍。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「頕頭」較接近啥物意思？","o":["點頭","搖頭","越頭","頭殼痛"],"a":0,"e":"頕：點頭。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「誣賴」較接近啥物意思？","o":["用假的話陷害別人","相信別人","倚靠別人","共人會失禮"],"a":0,"e":"誣賴：假造言語陷害別人。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「雄雄」較接近啥物意思？","o":["突然","真勇","真大聲","慢慢仔"],"a":0,"e":"雄雄：突然、猛然。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「淡薄仔」較接近啥物意思？","o":["一點點","淡淡的味","真濟","薄薄的"],"a":0,"e":"淡薄仔：一點點、些微。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「強欲」較接近啥物意思？","o":["快要","勉強欲","強壯","一定欲"],"a":0,"e":"強欲：快要。例：驚甲強欲軟跤。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「過大路愛＿＿看。」空格揀佗一个？","o":["斟酌","雄雄","霧嗄嗄","毋甘"],"a":0,"e":"過馬路要小心看。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊穿傷少，寒甲＿＿。」空格揀佗一个？","o":["咇咇掣","勻勻仔","霧嗄嗄","無偌久"],"a":0,"e":"冷到發抖。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這條路真歹行，你著＿＿行。」空格揀佗一个？","o":["勻勻仔","雄雄","咇咇掣","淡薄仔"],"a":0,"e":"路難走，要慢慢走。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「我拄入來教室＿＿，就開始落雨矣。」空格揀佗一个？","o":["無偌久","勻勻仔","斟酌","霧嗄嗄"],"a":0,"e":"進教室沒多久。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊畫的地圖，我看甲＿＿。」空格揀佗一个？","o":["霧嗄嗄","咇咇掣","勻勻仔","淡薄仔"],"a":0,"e":"看得一頭霧水。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"老師叫逐家用「雄雄」造句，佗一句毋著？","o":["老師講話就愛雄雄聽","昨昏下晡雄雄落大雨","我雄雄感覺頭昏昏","伊雄雄喝一聲，害我掣一趒"],"a":0,"e":"雄雄是突然；聽講要用「斟酌聽」。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「咱無趕時間，你＿＿來就好。」空格揀佗一个？","o":["沓沓仔","略略仔","微微仔","偏偏仔"],"a":0,"e":"不趕時間，就慢慢來。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"不管成就偌大，攏愛感謝爸母、老師的栽培。是佗一句俗諺？","o":["食果子，拜樹頭","食人一口，報人一斗","人情留一線，日後好相看","有緣才做伙，做伙是有緣"],"a":0,"e":"飲水思源，不可忘本。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"咱受著別人的恩情，愛知影加倍報恩。是佗一句俗諺？","o":["食人一口，報人一斗","食果子，拜樹頭","三講，四毋著","鴨仔聽雷"],"a":0,"e":"受人恩惠要加倍奉還。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿明看著阿芬，面＿＿紅起來。」照句型，空格揀佗一个？","o":["隨","煞","嘛","才"],"a":0,"e":"「……隨……」：馬上就。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「十二月芥菜——＿＿」，形容人有誠意。","o":["有心","假有心","快熟","換帖"],"a":0,"e":"十二月芥菜都包著實心。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"少年家欲去市內做啥物？","o":["揣頭路","救獅","買藥仔","揣朋友"],"a":0,"e":"一个少年家欲去市內揣頭路。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"少年家斟酌聽，發現獅的聲音聽起來按怎？","o":["敢若真艱苦","真受氣","真歡喜","咧唱歌"],"a":0,"e":"獅的聲音聽起來好像很痛苦。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"獅是按怎咧流血？","o":["跤予一枝刺鑿著","佮別隻獅相拍","予人拍著","跋落山崁"],"a":0,"e":"原來獅的跤去予一枝刺鑿著。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"根據課文，下面佗一个照情節的順序？","o":["看獅痛苦→淡薄仔毋甘→拔刺→糊藥仔","淡薄仔毋甘→拔刺→看獅痛苦→糊藥仔","拔刺→糊藥仔→毋甘→看獅痛苦","糊藥仔→看獅痛苦→毋甘→拔刺"],"a":0,"e":"照課文第二段的順序。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"獅按怎表示感謝？","o":["共少年家頕一下頭","共少年家攬咧","送伊一塊肉","大聲吼"],"a":0,"e":"獅慢慢徛起來，共少年家頕一下頭。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"少年家是按怎予人關入去監獄？","o":["頭家誣賴伊偷提錢","伊放走獅","伊揣無頭路","伊共人拍"],"a":0,"e":"頭家誣賴伊偷提錢。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"關做伙的獅是按怎無共少年家咬死？","o":["知影少年家是伊的救命恩人","獅受傷無法度食","少年家傷瘦","獅關佇籠仔無心情"],"a":0,"e":"這隻獅就是少年家以前救過的那隻。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"法官最後按怎判？","o":["改判少年家無罪，閣共伊佮獅攏放出去","判獅有罪","判少年家關較久","共獅送去動物園"],"a":0,"e":"法官認為少年家是善良的人。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"這个故事欲共咱講啥物道理？","o":["好心有好報","獅真恐怖","揣頭路真困難","頭家攏歹人"],"a":0,"e":"這就是人咧講的：好心有好報。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈人佮獅〉是對佗一本冊改寫的？","o":["伊索寓言","格林童話","論語","西遊記"],"a":0,"e":"改寫自《伊索寓言》，改寫者是黃勁連。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"「人情留一線，日後好相看」提醒咱啥物？","o":["佮人好來好去，凡事留後步","人情攏是假的","莫佮人來往","愛記仇"],"a":0,"e":"比喻與人為善，凡事要留餘地。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「六月芥菜——假有心」形容啥物款人？","o":["虛情假意","真有誠意","真緊熟似","真有本事"],"a":0,"e":"六月芥菜心若有似無。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「荷蘭豆性——快熟」比喻啥物？","o":["佮人真緊就熟似","煮菜真緊","做代誌傷急","荷蘭豆無好食"],"a":0,"e":"荷蘭豆一炒就熟，比喻很快熟識。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"寓言故事的特色，下面佗一个上符合？","o":["短短的故事內底有做人的道理","攏是真實的新聞","一定愛真長","干焦寫動物的外表"],"a":0,"e":"寓言短小精悍，寓含深意。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"延伸閱讀：狗仔看著水內的影，想欲搶彼塊肉，結果按怎？","o":["家己的肉嘛落入去水內","搶著兩塊肉","佮水內的狗做朋友","肉變較大塊"],"a":0,"e":"貪心的結果兩頭空。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"佇生活中，若看著別人需要幫忙，下面佗一个做法上符合本課精神？","o":["克服驚惶，盡量伸手鬥相共","驚惹麻煩就閃","先問有啥物好處","叫別人去處理"],"a":0,"e":"善良助人，好心有好報。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
