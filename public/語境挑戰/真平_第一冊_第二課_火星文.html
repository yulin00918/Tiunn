</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">💬</div><h1>第2課｜啥？閩南語嘛有「火星文」！</h1><p>網路語言、正確書寫與台語傳承</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「橫直」較接近啥物意思？","o":["橫豎、反正","橫的佮直的","四界","一直"],"a":0,"e":"橫直：橫豎、反正、無論如何。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「湠」較接近啥物意思？","o":["蔓延、擴散","淡薄仔","浸水","收起來"],"a":0,"e":"湠：蔓延、擴散。例：番薯是真𠢕生湠的作物。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「袂赴市」較接近啥物意思？","o":["時間無夠，赴袂著","袂去菜市仔","市場無開","買袂著物件"],"a":0,"e":"袂赴市：時間短暫，無法趕上或顧及。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「伴手」是啥物？","o":["拜訪親友時紮的小禮物","牽手的伴","手套仔","鬥相共的人"],"a":0,"e":"伴手：拜訪親友時攜帶的小禮物。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「感心」較接近啥物意思？","o":["感動、感激","傷心","心肝痛","用心"],"a":0,"e":"感心：感動、感激，源自日語。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「紮」較接近啥物意思？","o":["攜帶","綁","紮營","包"],"a":0,"e":"紮：攜帶。例：後擺上課我紮荔枝予老師食。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「挽」較接近啥物意思？","o":["採、摘","牽","拖","買"],"a":0,"e":"挽：採、拔、摘取。現挽的荔枝＝剛摘的荔枝。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「毋甘嫌」較接近啥物意思？","o":["毋嫌棄","毋甘願","捨不得","真討厭"],"a":0,"e":"毋甘嫌：不嫌棄，是客氣話。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「好禮」較接近啥物意思？","o":["有禮貌","好的禮物","禮拜","真貴"],"a":0,"e":"好禮：有禮貌。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「捌代誌」較接近啥物意思？","o":["懂事","捌字","有代誌","管閒事"],"a":0,"e":"捌代誌：懂事。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「錢若交落去就想予開，莫閣艱苦矣，＿＿閣趁就有。」空格揀佗一个？","o":["橫直","袂赴市","感心","伴手"],"a":0,"e":"反正再賺就有，用橫直。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「天欲暗矣，無較緊咧，就＿＿矣。」空格揀佗一个？","o":["袂赴市","橫直","感心","湠"],"a":0,"e":"來不及了，用袂赴市。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「＿＿，毋是刁工共你踏著。」空格揀佗一个？","o":["歹勢","感心","橫直","毋甘嫌"],"a":0,"e":"抱歉，不是故意的。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「番薯毋驚落塗爛，只求枝葉代代＿＿。」空格揀佗一个？","o":["湠","挽","紮","感心"],"a":0,"e":"番薯很會蔓延生長。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「你毋知頭毋知尾，等咧入去莫出喙，較袂＿＿。」空格揀佗一句？","o":["三講，四毋著","互相落氣，求進步","好喙大富貴","鴨仔聽雷"],"a":0,"e":"比喻滿口胡言，每講必錯。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「寫了交換檢查看有毋著無，咱兩个＿＿。」空格揀佗一句？","o":["互相落氣，求進步","三講，四毋著","好禮，好做伙","鴨仔聽雷"],"a":0,"e":"不傷和氣地互掀短處，促使進步。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"火星文「賀」，正確的閩南語字是？","o":["好","賀","號","和"],"a":0,"e":"課文：是「好」毋是「賀」。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"火星文「拍謝」，正確的閩南語字是？","o":["歹勢","拍謝","失禮","多謝"],"a":0,"e":"歹勢：不好意思、抱歉。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"火星文「母湯」，正確的閩南語字是？","o":["毋通","毋湯","母通","無通"],"a":0,"e":"毋通：不可以。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"下面佗一个詞「無」適合用佇呵咾人？","o":["頇顢","感心","好禮","捌代誌"],"a":0,"e":"頇顢是笨手笨腳的意思。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"阿淇是按怎欲共老師請假？","o":["欲陪阿爸、阿母佮阿公、阿媽去臺北𨑨迌","伊破病","伊欲去比賽","伊欲去臺北讀冊"],"a":0,"e":"爸媽和爺爺奶奶要去臺北玩，要阿淇陪。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"阿淇講後擺上課欲紮啥物予老師？","o":["現挽的荔枝","臺北的伴手餅","火星文貼圖","一張卡片"],"a":0,"e":"下次上課帶現摘的荔枝給老師。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"根據課文，老師認為阿淇好禮的原因是啥？","o":["欲紮現挽的荔枝予老師食","爸母欲𤆬伊去臺北","伊請假陪阿爸阿母","伊會曉寫火星文"],"a":0,"e":"阿淇說要帶荔枝，老師稱讚她很有禮貌。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"老師無同意阿淇寫火星文，上主要的原因是？","o":["年久月深湠落去，閩南語會變做烏白寫的語言","感覺阿淇無正經","火星文傷歹寫","老師看無英語"],"a":0,"e":"常用錯字，會影響閩南語的傳承。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"老師叫阿淇用啥物查正確的用字？","o":["教育部《臺灣台語常用詞辭典》","網路的火星文辭典","華語辭典","英語辭典"],"a":0,"e":"用教育部辭典查正確用字後重寫。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"老師講「成績嘛會足歹勢」，是咧做啥？","o":["用阿淇的「拍謝」來滾耍笑提醒伊","真正欲予伊無及格","共阿淇會失禮","呵咾阿淇"],"a":0,"e":"老師幽默地借用阿淇的用語提醒她。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"老師用啥物例來予阿淇了解火星文的問題？","o":["若共伊的名烏白寫，看有就好，伊感覺按怎","叫伊抄寫一百遍","罰伊站","叫伊去問同學"],"a":0,"e":"將心比心，名字被亂寫也不好受。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"這課的對話是佇啥物所在進行的？","o":["LINE 的訊息","教室內","電話內","批內底"],"a":0,"e":"本課以師生 LINE 對話呈現。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"用訊息共老師請假，上一定愛寫著的是？","o":["請假的時間佮理由","欲紮啥物伴手","家己上愛食的物件","貼圖愈濟愈好"],"a":0,"e":"請假要寫清楚時間和理由。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"火星文的問題，下面佗一个毋是？","o":["予閩南語變甲較正確","予人看無","造成溝通不良","影響閩南語的傳承"],"a":0,"e":"火星文會造成溝通不良、雞同鴨講。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"學習單的貼圖「食飽未」，意思較接近？","o":["吃飽了沒（打招呼）","你足飽","欲食飯矣","猶未食"],"a":0,"e":"食飽未是常用的問候語。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"學習單的貼圖「小等一下」，意思較接近？","o":["稍等一下","細漢的等","等一點仔錢","免等"],"a":0,"e":"小等一下：稍等一下。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"你出去𨑨迌買伴手轉來分厝邊，上主要是表達啥物？","o":["分享佮感謝平常時的照顧","展家己有錢","物件傷濟食袂了","愛人回禮"],"a":0,"e":"伴手是分享與心意。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"佇網路頂寫閩南語，上好的做法是？","o":["查辭典用正確的字","隨意用音近的字","攏用注音","攏用英文"],"a":0,"e":"使用正確用字，溝通才清楚。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../語境填空.dc.html'};</script></body></html>
