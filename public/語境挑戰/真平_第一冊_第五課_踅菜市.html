</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🧺</div><h1>第5課｜踅菜市</h1><p>市場語言、買賣互動與生活人情</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「踅菜市」的「踅」較接近啥物意思？","o":["來回行、逛","買","賣","煮"],"a":0,"e":"踅：轉動、來回走動、逛。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「交關」較接近啥物意思？","o":["買賣捧場、惠顧","交朋友","關門","交代"],"a":0,"e":"交關：買賣、捧場。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「加減交關」的「加減」意思是？","o":["多少，買濟買少攏好","加法佮減法","愈買愈濟","減價"],"a":0,"e":"加減：多少，但「少」的意思較多。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「鬥陣」較接近啥物意思？","o":["結伴、一起","鬥陣頭","相拍","排隊"],"a":0,"e":"鬥陣：結伴、偕同、一起。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「逐擺」較接近啥物意思？","o":["每次","追趕","一擺","排隊"],"a":0,"e":"逐擺：每次。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「鮮沢」較接近啥物意思？","o":["食物新鮮有光澤","色水真鮮","真貴","真臭"],"a":0,"e":"鮮沢：魚肉菜等新鮮有光澤的樣子。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「雜細」是啥物？","o":["家庭日用雜貨","真細的物件","零錢","細漢囡仔"],"a":0,"e":"雜細：各種家庭日用雜貨的總稱。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「五金」是啥物？","o":["各種金屬製品","五箍銀","五粒金","金仔店"],"a":0,"e":"五金：泛指各種金屬製品。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「兩爿擔頭」是啥物？","o":["兩邊的擔仔位","兩个頭家","兩支扁擔","兩粒頭"],"a":0,"e":"兩爿擔頭：兩邊的攤位。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「大捾細捾款轉去」的「款」，這裡是啥物意思？","o":["準備、採買","款式","錢","慢慢仔"],"a":0,"e":"款：準備，這裡指採買。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「佮意」較接近啥物意思？","o":["中意、喜歡","合作","同意","注意"],"a":0,"e":"佮意：中意、喜歡。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「生理人上愛人客較捷來＿＿。」空格揀佗一个？","o":["交關","鬥陣","踅","款"],"a":0,"e":"生意人最喜歡客人常常來光顧。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「＿＿落雨＿＿好天，阿母攏會去買菜。」空格依序揀佗一組？","o":["無論……抑……","雖然……毋過……","若……就……","毋但……嘛……"],"a":0,"e":"不論……還是……","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「若欲大摒掃，逐家＿＿來，會較緊完成。」空格揀佗一个？","o":["鬥陣","交關","逐擺","加減"],"a":0,"e":"大家一起做。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊＿＿看著我，攏會相借問。」空格揀佗一个？","o":["逐擺","鬥陣","交關","鮮沢"],"a":0,"e":"每次看到我都打招呼。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「頭尖尖，尾拖帆，在生無血色，死了遍身紅。」臆海產名：","o":["蝦仔","蟳仔","魚仔","鰇魚"],"a":0,"e":"蝦子煮熟會變紅。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「一个四角四角，欲食免擘殼。」臆食物：","o":["豆腐","雞卵","粽仔","土豆"],"a":0,"e":"四角形、不用剝殼。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"會嫌物件的人，才是真正有意欲買的人。是佗一句俗諺？","o":["嫌貨才是買貨人","買賣無成，情義原在","加減交關","好喙大富貴"],"a":0,"e":"會挑毛病的才是要買的人。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"買賣無成交，嘛袂影響雙方的感情。是佗一句俗諺？","o":["買賣無成，情義原在","嫌貨才是買貨人","食人一口，報人一斗","好禮，好做伙"],"a":0,"e":"買賣不成仁義在。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「若到熱天時，定定會有＿＿。」照課文句型，下面佗一个上適當？","o":["風颱","落雪","寒流","結霜"],"a":0,"e":"若到……時：一到……的時候。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"頭家講茼蒿是「拍某菜」，意思是？","o":["煮起來會縮，愛買較濟才有夠","茼蒿真貴","茼蒿真歹食","茼蒿是某愛食的"],"a":0,"e":"一大把煮起來才一點點。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"根據課文，阿媽為啥物欲招作者去踅菜市？","o":["阿媽欲煮好料理","作者歇睏日真無聊","阿媽欲教作者煮食","作者毋捌去過菜市仔"],"a":0,"e":"逐擺若到歇睏時，阿媽欲煮好料理。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文「加減交關感謝你」，意思是？","o":["買濟、買少攏算有捀場，攏感謝","著愛加買才會使","買傷少就無算","價數貴就減買"],"a":0,"e":"加減就是多少的意思。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"下面佗一个擔仔位無出現佇課文？","o":["賣藥仔的","賣衫的","賣海產的","賣肉的"],"a":0,"e":"課文有青菜果子、豬牛雞鴨蟳蝦魚、五金雜細佮成衣。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文「頭家開喙來喝起」，頭家咧做啥？","o":["大聲喝賣","咧冤家","咧唱歌","咧叫人客走"],"a":0,"e":"喝：這裡指大聲叫賣。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「貨色鮮沢包滿意」咧講啥物？","o":["物件新鮮，保證人客滿意","物件真貴","物件攏賣了矣","包裝真媠"],"a":0,"e":"品質新鮮包準客人滿意。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈踅菜市〉是啥物文體？","o":["七字仔","現代詩","漫畫","書信"],"a":0,"e":"七字仔：七字一句，四句一段，每段押韻。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文最後一段，寫出菜市仔有啥物特色？","o":["多元，連五金雜細佮衫攏有","干焦賣菜","干焦賣魚","攏無人客"],"a":0,"e":"多元菜市你隨意，五金雜細佮成衣。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"對話內底，頭家娘賣菜瓜閣會做啥物？","o":["教人客按怎煮菜","送人客一尾魚","算人客較貴","叫人客莫買"],"a":0,"e":"賣菜還教人煮菜，服務真好。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈踅菜市〉的作者是啥人？","o":["蔡連眞","許正勳","盧繼寶","黃勁連"],"a":0,"e":"蔡連眞，雲林人。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"「人客」佮華語「客人」字的順序倒反，下面佗一組嘛是按呢？","o":["鬧熱／熱鬧","菜市／市場","交關／關心","鬥陣／陣頭"],"a":0,"e":"風颱／颱風、鬧熱／熱鬧，都是華閩用字相反。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「四秀仔」是啥物？","o":["零食","四種衫","四个秀才","四箍輾轉"],"a":0,"e":"四秀仔：零食。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「𨑨迌物仔」是啥物？","o":["玩具","零食","衫褲","雜細"],"a":0,"e":"𨑨迌物仔：玩具。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"你感覺菜市仔上有台灣味的所在是？","o":["頭家佮人客相借問、滾耍笑，真有人情味","攏無人講話","攏用機器結帳","物件攏真貴"],"a":0,"e":"菜市場充滿濃厚的人情味。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"去菜市仔買物件，下面佗一个態度上好？","o":["有禮貌問價數，買賣無成嘛好好仔講","大聲嫌物件歹","提了毋付錢","隨意捏果子"],"a":0,"e":"買賣無成，情義原在。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「食魚食肉也著菜佮」是咧講啥物？","o":["飲食愛均衡","干焦食菜","干焦食魚肉","愛食較濟"],"a":0,"e":"臊的菜的愛總款，飲食要均衡。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
