</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🍚</div><h1>第6課｜割稻仔飯</h1><p>農村飲食、勞動互助與人情文化</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「割稻仔飯」是啥物？","o":["較早割稻仔時，主人家煮來請鬥相共的人食的飯菜","用稻仔做的飯","割稻仔機器的名","便當店的名"],"a":0,"e":"早期人手不足，地主準備豐盛菜餚宴請幫忙的人。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「大灶燃柴」的「燃」較接近啥物意思？","o":["點火、燒","煮","炒","滷"],"a":0,"e":"燃：點燃、焚燒。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「鰇魚」是啥物？","o":["魷魚","鯊魚","鱸魚","鰻魚"],"a":0,"e":"鰇魚：魷魚。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「精肉」是啥物？","o":["瘦肉","肥肉","牛肉","精緻的肉"],"a":0,"e":"精肉：瘦肉；相反詞白肉、肥肉。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「菜脯」是啥物？","o":["蘿蔔乾","酸菜","高麗菜","菜頭粿"],"a":0,"e":"菜脯：蘿蔔乾。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「鹹菜」是啥物？","o":["酸菜","蘿蔔乾","鹹的菜","醃瓜"],"a":0,"e":"鹹菜：酸菜。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「排骨炕筍仔湯」的「炕」是啥物煮法？","o":["用慢火長時間燉煮","大火炒","用油炸","用水煠"],"a":0,"e":"炕：用慢火長時間燉煮。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「扁擔」是啥物？","o":["用來擔物件的長扁形工具","扁扁的擔仔","扁食","擔仔麵"],"a":0,"e":"扁擔：挑物品的木製或竹製扁長形工具。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「摔桶」是啥物？","o":["脫穀用的大柴桶","洗衫的桶","貯水的桶","摔破的桶"],"a":0,"e":"摔桶：脫穀用的大木桶。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「同齊」較接近啥物意思？","o":["同時一起","整齊","相仝","齊全"],"a":0,"e":"同齊：同時一起。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「食好料」較接近啥物意思？","o":["食大餐、享受美食","食藥仔","食材料","食飽"],"a":0,"e":"食好料：吃大餐、享受美食。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「阮兩个明仔載欲＿＿去圖書館借冊。」空格揀佗一个？","o":["同齊","田園","滋味","食好料"],"a":0,"e":"一起去。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這个湯頭的＿＿真好。」空格揀佗一个？","o":["滋味","同齊","田園","扁擔"],"a":0,"e":"味道很好。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「多謝你共我鬥相共，我請你＿＿。」空格揀佗一个？","o":["食好料","同齊","滋味","炕"],"a":0,"e":"感謝幫忙，請吃大餐。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阮開車經過一大片黃錦錦的＿＿。」空格揀佗一个？","o":["田園","滋味","大灶","摔桶"],"a":0,"e":"田園：耕地、農田。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"人佮人相處，誠意上要緊，就算一杯水嘛感覺甜。是佗一句俗諺？","o":["誠意，食水甜","食少有滋味，食濟無趣味","食果子，拜樹頭","好喙大富貴"],"a":0,"e":"誠意夠，白開水也甘甜。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"去食到飽嘛愛節制。是佗一句俗諺？","o":["食少有滋味，食濟無趣味","誠意，食水甜","食人一口，報人一斗","豬肉無炸袂出油"],"a":0,"e":"做事要適可而止。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"下面佗一个毋是煮食的動詞？","o":["燃","炒","滷","炕"],"a":0,"e":"燃是點火，不是煮食的方法。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「豬肉愛加豆油佮芳料，用細火慢慢仔煮。」是佗一種煮法？","o":["滷","炒","煎","煠"],"a":0,"e":"滷：加香料和醬油小火慢煮。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「用水長時間熬煮」，閩南語是佗一字？","o":["𤉙","炒","煎","乍"],"a":0,"e":"𤉙：用水長時間熬煮，例：𤉙湯。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「煎藥仔、煎茶」的「煎」是啥物意思？","o":["熬煮","用油煎","用火烘","用水煠"],"a":0,"e":"煎（tsuann）：熬煮；煎（tsian）：用少量油煎。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"割稻仔飯是佇佗位煮的？","o":["大灶燃柴煮","瓦斯爐","電鍋","餐廳"],"a":0,"e":"課文開頭：大灶燃柴。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"課文的割稻仔飯菜色，下面佗一个無出現？","o":["滷肉飯","菜脯炒卵","豬血煮鹹菜湯","虱目魚煮瓜仔瓤"],"a":0,"e":"課文有菜脯炒卵、豬血鹹菜湯、虱目魚瓜仔瓤、排骨筍仔湯。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"割稻仔飯是用啥物擔去田園？","o":["扁擔","鐵馬","牛車","布袋"],"a":0,"e":"用扁擔擔去田園。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"割稻仔人是用啥物貯飯、啉湯？","o":["碗公","便當盒","紙杯","鼎"],"a":0,"e":"用碗公貯飯，用碗公啉湯。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「飯粒內底有稻芳」，下面佗一个解說上無合理？","o":["因為飯菜內底加真濟調味料","飯菜內底有煮食的人的心意","食飯的所在是佇稻仔田","這是割稻仔人勞動得著的回報"],"a":0,"e":"稻香來自田園與勞動，不是調味料。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"割稻仔飯會當代表主人家想欲對割稻仔人講啥物？","o":["多謝","歹勢","𠢕早","無要緊"],"a":0,"e":"主人家用豐盛飯菜表達感謝。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「規擔食甲空空空」表示啥物？","o":["飯菜好食，割稻仔人嘛珍惜食物","飯菜傷少","擔仔歹去","人攏無食"],"a":0,"e":"珍惜食物、回報主人盛情。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈割稻仔飯〉的作者是啥人？","o":["許正勳","蔡連眞","盧繼寶","黃勁連"],"a":0,"e":"許正勳，臺南七股人。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈割稻仔飯〉是啥物文體？","o":["現代詩","七字仔","漫畫","寓言"],"a":0,"e":"第六課是一首現代詩。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"較早農業社會為啥物會有割稻仔飯？","o":["人手無夠，親情厝邊互相鬥割稻，主人家煮來感謝","稻仔傷濟食袂了","政府規定的","割稻仔人家己紮便當"],"a":0,"e":"互相換工，主人家以豐盛飯菜回饋。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「割稻仔飯」代表臺灣人啥物精神？","o":["互助合作、重情重義","愛食好料","大食大喝","一人做事一人當"],"a":0,"e":"表現農村彼此互助合作的良善精神。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"食物的味道「汫」是啥物意思？","o":["淡","辣","苦","澀"],"a":0,"e":"汫：味道淡。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"食物的味道「薟」是啥物意思？","o":["辣","淡","甜","鹹"],"a":0,"e":"薟：味道辣。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「精肉」的相反詞是？","o":["白肉、肥肉","瘦肉","赤肉","牛肉"],"a":0,"e":"精肉＝瘦肉，相反是肥肉。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「伊的點心擔三做四歇睏，人客走了了，真是苦瓜煮鰱魚——＿＿」","o":["可憐","有心","快熟","正經"],"a":0,"e":"苦瓜煮鰱魚——可憐（苦鰱）。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../語境填空.dc.html'};</script></body></html>
