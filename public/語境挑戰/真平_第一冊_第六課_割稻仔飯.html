     教材、課文、語詞、台羅、音檔等第三方素材之著作權仍屬原權利人所有。完整宣告見 author-credit.js。 --><title>割稻仔飯｜真平第一冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../語境填空.dc.html">← 返回整冊</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🍚</div><h1>第6課｜割稻仔飯</h1><p>農村飲食、勞動互助與人情文化</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>語詞意思與教材重點。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>掌握課文人物、事件與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把本課概念帶回生活判斷。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每次隨機抽最多 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab": [{"q": "「大灶」較接近啥物意思？", "o": ["大型傳統灶", "燒柴火", "魷魚"], "a": 0, "e": "「大灶」：大型傳統灶。"}, {"q": "「燃柴」較接近啥物意思？", "o": ["燒柴火", "大型傳統灶", "魷魚"], "a": 0, "e": "「燃柴」：燒柴火。"}, {"q": "「鰇魚」較接近啥物意思？", "o": ["魷魚", "大型傳統灶", "燒柴火"], "a": 0, "e": "「鰇魚」：魷魚。"}, {"q": "「精肉」較接近啥物意思？", "o": ["瘦肉", "大型傳統灶", "燒柴火"], "a": 0, "e": "「精肉」：瘦肉。"}, {"q": "「菜脯」較接近啥物意思？", "o": ["蘿蔔乾", "大型傳統灶", "燒柴火"], "a": 0, "e": "「菜脯」：蘿蔔乾。"}, {"q": "「鹹菜」較接近啥物意思？", "o": ["酸菜、醃菜", "大型傳統灶", "燒柴火"], "a": 0, "e": "「鹹菜」：酸菜、醃菜。"}, {"q": "「瓜仔瓤」較接近啥物意思？", "o": ["西瓜瓤", "大型傳統灶", "燒柴火"], "a": 0, "e": "「瓜仔瓤」：西瓜瓤。"}, {"q": "「炕」較接近啥物意思？", "o": ["用小火慢煮一段時間", "大型傳統灶", "燒柴火"], "a": 0, "e": "「炕」：用小火慢煮一段時間。"}, {"q": "「扁擔」較接近啥物意思？", "o": ["挑物用的長木桿", "大型傳統灶", "燒柴火"], "a": 0, "e": "「扁擔」：挑物用的長木桿。"}, {"q": "「擔」較接近啥物意思？", "o": ["用肩挑運", "大型傳統灶", "燒柴火"], "a": 0, "e": "「擔」：用肩挑運。"}, {"q": "「摔桶」較接近啥物意思？", "o": ["早期打穀、脫粒用具", "大型傳統灶", "燒柴火"], "a": 0, "e": "「摔桶」：早期打穀、脫粒用具。"}, {"q": "「稻芳」較接近啥物意思？", "o": ["稻米的香氣", "大型傳統灶", "燒柴火"], "a": 0, "e": "「稻芳」：稻米的香氣。"}], "context": [{"q": "下面佗一个毋是煮食的動詞？", "o": ["燃", "炒", "炕"], "a": 0, "e": "教材應用題指出「燃」是點火予物件燒起來，毋是煮食動詞。"}, {"q": "「用扁擔擔去田園」是在做啥物？", "o": ["共飯菜挑去田裡", "佇厝內食飯", "去市場買菜"], "a": 0, "e": "課文寫割稻仔飯用扁擔送到田園。"}, {"q": "「菜脯炒卵」的「菜脯」是？", "o": ["蘿蔔乾", "高麗菜", "芋仔"], "a": 0, "e": "課文華語對照是蘿蔔乾炒蛋。"}, {"q": "「鰇魚蝦米紅蔥頭精肉」中的「精肉」是？", "o": ["瘦肉", "肥肉", "魚肉"], "a": 0, "e": "教材華語對照為瘦肉。"}, {"q": "「規擔食甲空空空」表示？", "o": ["整擔飯菜攏食了了", "無人欲食", "扁擔空空無帶物"], "a": 0, "e": "課文以誇張又有節奏的語句描寫割稻人的食量與滿足。"}], "reading": [{"q": "較早農業社會為啥物會有「割稻仔飯」？", "o": ["割稻需要人力互助，主人準備飯菜招待割稻人", "為著比賽煮食", "為著開餐廳"], "a": 0, "e": "教材討論題引導理解農忙互助與供餐文化。"}, {"q": "課文中的割稻仔飯菜色較接近？", "o": ["豐沛、多款家常料理", "只有一碗白飯", "只有甜點"], "a": 0, "e": "課文列出炒料、菜脯炒卵、鹹菜湯、魚、排骨筍仔湯等。"}, {"q": "「飯粒內底有稻芳」上無合理的解釋是？", "o": ["因為飯菜加真濟調味料", "食飯所在佇稻田", "這是割稻人的勞動回報"], "a": 0, "e": "教材應用題把「加真濟調味料」列為最不合理答案。"}, {"q": "割稻仔飯除了食物，閣代表啥物文化意義？", "o": ["農村互助、勞動佮人情", "個人競爭", "網路流行語"], "a": 0, "e": "本課以飲食連結農業社會的互助生活。"}, {"q": "作者用一連串菜名寫課文，效果較接近？", "o": ["呈現豐富菜色佮熱鬧節奏", "完全無畫面", "只是在列價格"], "a": 0, "e": "詩句透過菜色與動作形成鮮明農村飲食畫面。"}], "comprehensive": [{"q": "俗諺「誠意，食水甜」主要是講？", "o": ["人與人相處，誠意上重要", "水一定愛加糖", "食飯毋通啉水"], "a": 0, "e": "教材解釋只要誠意夠，白開水嘛感覺甘甜。"}, {"q": "「食少有滋味，食濟無趣味」提醒咱？", "o": ["享樂愛適可而止", "食愈濟愈好", "一定毋通食"], "a": 0, "e": "教材引申做任何事情要適可而止。"}, {"q": "現代若欲介紹割稻仔飯，上適合強調？", "o": ["菜色＋農忙互助的文化故事", "干焦價格", "干焦外送速度"], "a": 0, "e": "本課價值在飲食背後的農村生活與人情。"}, {"q": "「同齊」的意思是？", "o": ["同時一起", "各行各的", "昨日"], "a": 0, "e": "教材語詞運用解釋「同齊」為同時一起。"}, {"q": "「田園」在本課指？", "o": ["耕地、農田園圃，也可指田地景觀", "教室", "車站"], "a": 0, "e": "教材語詞運用有明確解釋。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
