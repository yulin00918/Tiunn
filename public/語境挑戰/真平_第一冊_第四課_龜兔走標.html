</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🐢</div><h1>第4課｜龜兔走標</h1><p>堅持、自我管理與避免過度自信</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「走標」較接近啥物意思？","o":["賽跑","走路","插旗仔","揣目標"],"a":0,"e":"走標：賽跑。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「像龜咧趖」的「趖」較接近啥物意思？","o":["爬，動作慢吞吞","走甲真緊","跳懸跳低","泅水"],"a":0,"e":"趖：蛇、蟲類爬行，此指動作緩慢、遲鈍。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「剾洗」較接近啥物意思？","o":["講話諷刺、挖苦別人","洗衫","刮鬍鬚","呵咾別人"],"a":0,"e":"剾洗：說話諷刺、挖苦別人。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「忝」較接近啥物意思？","o":["疲累","添加","真歡喜","真緊"],"a":0,"e":"忝：疲累。例：伊做代誌骨力閣毋驚忝。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「百面」較接近啥物意思？","o":["一定、必定","一百擺","各方面","真濟面"],"a":0,"e":"百面：一定、必定。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「紲落來」較接近啥物意思？","o":["接下來","跋落來","綁起來","停落來"],"a":0,"e":"紲落來：接下來、接著。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「伸勻」較接近啥物意思？","o":["伸懶腰","伸手","勻勻仔行","拍拳頭"],"a":0,"e":"伸勻：伸懶腰。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「無奈何」較接近啥物意思？","o":["無可奈何、不得已","無要緊","無問題","無意思"],"a":0,"e":"無奈何：無可奈何。近義詞：姑不而將。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「拍算」較接近啥物意思？","o":["打算","拍算盤","算數","拍人"],"a":0,"e":"拍算：打算。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「落眠」較接近啥物意思？","o":["睏甲真熟","睏袂去","落雨","跋落眠床"],"a":0,"e":"落眠：熟睡、沉睡。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"課文「我猶是莫插較無代」的「插」較接近啥物意思？","o":["管、干涉","插花","插隊","插電"],"a":0,"e":"插：管、干涉。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「聽著郵差大聲＿＿：『掛號』，阿母趕緊提印仔去開門。」空格揀佗一个？","o":["喝","趖","忝","插"],"a":0,"e":"喝：大聲喊叫。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊逐工作穡足無閒，實在有夠＿＿。」空格揀佗一个？","o":["忝","百面","拍算","伸勻"],"a":0,"e":"工作太忙，很疲累。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「運動會欲到矣，我＿＿逐工去走運動埕。」空格揀佗一个？","o":["拍算","剾洗","落眠","無奈何"],"a":0,"e":"打算每天去跑操場。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「只要你骨力練，總有著等的一工。」佮佗一句俗諺上配合？","o":["有心拍鐵，鐵成針","三斤貓，咬四斤鳥鼠","看人食肉，毋通看人相拍","痟貪狗仔雙頭空"],"a":0,"e":"有恆心就會成功。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"比賽輸去，你相信伊以後會成功。用佗一句俗諺？","o":["大格雞慢啼","三斤貓，咬四斤鳥鼠","像龜咧趖","食緊挵破碗"],"a":0,"e":"大器晚成。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「你毋捌一箍芋仔番薯，就咧講大聲話。」用佗一句俗諺來勸伊？","o":["三斤貓，咬四斤鳥鼠","大格雞慢啼","有心拍鐵，鐵成針","甘願做牛，毋驚無犁通拖"],"a":0,"e":"譏諷人不自量力。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"狐狸毋想插龜兔的恩怨，伊想著佗一句俗語？","o":["看人食肉，毋通看人相拍","大格雞慢啼","好心有好報","食果子，拜樹頭"],"a":0,"e":"看熱鬧別去湊打架，免得惹禍上身。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"比喻人愛經過磨練才會成功，是佗一句俗諺？","o":["豬肉無炸袂出油","雞屎落塗，也有三寸煙","甘願做牛，毋驚無犁通拖","三斤貓，咬四斤鳥鼠"],"a":0,"e":"豬肉不炸不會出油。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"勸人愛有志氣，莫看輕家己。是佗一句俗諺？","o":["雞屎落塗，也有三寸煙","豬肉無炸袂出油","大格雞慢啼","像龜咧趖"],"a":0,"e":"雞屎落地也有一陣煙。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「伊坐無好勢，＿＿對椅仔頂跋落來。」照句型，空格揀佗一个？","o":["就按呢","毋過","抑是","雖然"],"a":0,"e":"「就按呢」連接上下文的因果關係。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"兔仔定定掛佇喙邊，用來剾洗別人的四字是？","o":["像龜咧趖","龜笑鱉無尾","大格雞慢啼","一步一跤印"],"a":0,"e":"像龜咧趖：笑別人走很慢。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"龜招兔仔比賽走標的原因是？","o":["兔仔笑龜跤手慢鈍，龜無歡喜","兔仔走輸龜","龜想欲共兔仔創治","狐狸想欲看比賽"],"a":0,"e":"兔子到處說，讓烏龜很不高興。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"這場比賽的裁判是啥人？","o":["狐狸","烏鴉","獅","狗蟻"],"a":0,"e":"兔子提議請狐狸做裁判。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"比賽的終點佇佗位？","o":["對面彼支山的山跤","樹林內的溪邊","兔仔的岫","狐狸的厝"],"a":0,"e":"終點是對面彼支山的山跤。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"兔仔心內按怎想？","o":["就算讓龜先走一个時辰，嘛百面贏","龜一定會贏","比賽真無聊，莫比","愛認真走"],"a":0,"e":"兔子根本沒把比賽當一回事。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"龜有才調贏過兔仔，原因是？","o":["兔仔歇睏的時，龜猶是向前爬","龜叫狐狸判伊贏","龜偷食步","兔仔讓龜先走"],"a":0,"e":"烏龜不怕累、不休息，一直向前。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"兔仔睏醒的時看著啥物？","o":["龜佇對面山跤咧共伊擛手","龜猶佇起點","狐狸咧睏","龜跋倒矣"],"a":0,"e":"兔子醒來，烏龜已經到終點了。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"下面佗一句上適合形容兔仔的行為？","o":["好頭也著好尾","食緊挵破碗","龜笑鱉無尾","烏矸仔貯豆油"],"a":0,"e":"做事不能只做一半，要有頭有尾。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"〈龜兔走標〉的作者是啥人？","o":["盧繼寶","黃勁連","翁瑞鴻","許正勳"],"a":0,"e":"盧繼寶，屏東人，做過國小校長。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"龜這款「毋驚忝、無放棄」的精神，會當用佗一句話來講？","o":["一步一跤印","食緊挵破碗","三講，四毋著","鴨仔聽雷"],"a":0,"e":"一步一腳印，堅持向前。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"〈詠鵝〉是啥人寫的？","o":["駱賓王","李白","唐寅","虞世南"],"a":0,"e":"駱賓王七歲寫〈詠鵝〉，被稱為神童。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"〈詠鵝〉「白毛浮綠水，紅掌撥清波」，寫鵝的啥物？","o":["泅水的形貌佮動作","鵝的叫聲","鵝食物件","鵝咧飛"],"a":0,"e":"白羽毛浮水面，紅腳掌撥水波。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"對話內底，狗蟻會當扛大塊餅幼仔，是靠啥物？","o":["團結合作","身軀真大","走真緊","有人鬥扛"],"a":0,"e":"規陣狗蟻來鬥扛，團結合作就無問題。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「狐狸佮烏鴉」的故事提醒咱啥物？","o":["莫予人褒甲戇去","愛定定唱歌","肉愛食較緊","烏鴉真媠"],"a":0,"e":"烏鴉被稱讚就開口唱歌，肉就掉了。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"若欲參加比賽，對手看起來較弱，較好的態度是？","o":["毋通看輕對手，認真到最後","先歇睏，連鞭才閣講","一四界笑對手","直接放棄"],"a":0,"e":"兔子輕敵才會失敗。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
