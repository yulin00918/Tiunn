<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>龜兔走標｜真平第一冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../語境填空.dc.html">← 返回整冊</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🐢</div><h1>第4課｜龜兔走標</h1><p>堅持、自我管理與避免過度自信</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>語詞意思與教材重點。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>掌握課文人物、事件與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把本課概念帶回生活判斷。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每次隨機抽最多 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab": [{"q": "「走標」較接近啥物意思？", "o": ["賽跑、競走", "疲累", "休息"], "a": 0, "e": "「走標」：賽跑、競走。"}, {"q": "「忝」較接近啥物意思？", "o": ["疲累", "賽跑、競走", "休息"], "a": 0, "e": "「忝」：疲累。"}, {"q": "「歇睏」較接近啥物意思？", "o": ["休息", "賽跑、競走", "疲累"], "a": 0, "e": "「歇睏」：休息。"}, {"q": "「百面」較接近啥物意思？", "o": ["一定、必定", "賽跑、競走", "疲累"], "a": 0, "e": "「百面」：一定、必定。"}, {"q": "「紲落來」較接近啥物意思？", "o": ["接下來、繼續下去", "賽跑、競走", "疲累"], "a": 0, "e": "「紲落來」：接下來、繼續下去。"}, {"q": "「一睏仔」較接近啥物意思？", "o": ["一小段時間", "賽跑、競走", "疲累"], "a": 0, "e": "「一睏仔」：一小段時間。"}, {"q": "「沓沓仔」較接近啥物意思？", "o": ["慢慢地、不急", "賽跑、競走", "疲累"], "a": 0, "e": "「沓沓仔」：慢慢地、不急。"}, {"q": "「落眠」較接近啥物意思？", "o": ["入睡", "賽跑、競走", "疲累"], "a": 0, "e": "「落眠」：入睡。"}, {"q": "「伸勻」較接近啥物意思？", "o": ["伸展身體、伸懶腰", "賽跑、競走", "疲累"], "a": 0, "e": "「伸勻」：伸展身體、伸懶腰。"}, {"q": "「擛手」較接近啥物意思？", "o": ["揮手", "賽跑、競走", "疲累"], "a": 0, "e": "「擛手」：揮手。"}], "context": [{"q": "「大格雞慢啼」比喻啥物？", "o": ["大器晚成", "做代誌真緊", "無能力"], "a": 0, "e": "教材解釋為一個人的成就較晚。"}, {"q": "「三斤貓，咬四斤鳥鼠」是咧譏諷？", "o": ["不自量力", "有耐心", "真謙虛"], "a": 0, "e": "教材解釋為不自量力。"}, {"q": "龜「沓沓仔」向前行，較接近？", "o": ["慢慢仔但是無停", "飛緊", "完全無行"], "a": 0, "e": "沓沓仔是慢慢地。"}, {"q": "兔仔「落眠」是？", "o": ["睏去、入睡", "落山", "跌倒"], "a": 0, "e": "落眠就是入睡。"}, {"q": "兔仔醒來「伸勻」，是在做啥物？", "o": ["伸懶腰、伸展身體", "揮手", "食物件"], "a": 0, "e": "教材情節寫兔仔睏醒伸勻。"}], "reading": [{"q": "龜為啥物會贏走標？", "o": ["毋驚艱苦、無放棄、一直向前", "因為伊走上緊", "因為兔仔無參加"], "a": 0, "e": "教材賞析強調龜一步一跤印、堅持拍拚。"}, {"q": "兔仔失敗的主要原因是？", "o": ["傷過有自信，掠準穩贏", "跤手傷慢", "毋捌路"], "a": 0, "e": "教材指出兔仔過度自信造成失敗。"}, {"q": "故事中的龜上值得學習的特質是？", "o": ["堅持", "自滿", "偷懶"], "a": 0, "e": "本課以龜的堅持對照兔仔的自滿。"}, {"q": "「一步一跤印」在本課較接近啥物精神？", "o": ["踏實持續向前", "一步就成功", "只求速度"], "a": 0, "e": "教材用這句形容龜不放棄的精神。"}, {"q": "本課用龜兔對比主要欲說明？", "o": ["能力以外，態度佮堅持嘛真重要", "速度永遠無重要", "比賽攏靠運氣"], "a": 0, "e": "故事以兩種態度造成的結果形成對照。"}], "comprehensive": [{"q": "考試準備若學龜的精神，較適合？", "o": ["逐工穩定複習", "最後一刻才開始", "感覺會就毋免讀"], "a": 0, "e": "一步一跤印就是持續累積。"}, {"q": "一个人能力真好但是過度自信，較像故事中的？", "o": ["兔仔", "龜", "裁判"], "a": 0, "e": "兔仔的問題就是過度自信。"}, {"q": "比賽輸去後，用「大格雞慢啼」鼓勵同學，是欲講？", "o": ["成功可能較慢，堅持落去", "永遠袂成功", "愛放棄"], "a": 0, "e": "這句俗諺有大器晚成的意思。"}, {"q": "「三斤貓，咬四斤鳥鼠」提醒咱？", "o": ["了解家己能力，毋通膨風自大", "永遠毋通挑戰", "一定愛贏"], "a": 0, "e": "俗諺用來譏諷不自量力。"}, {"q": "龜兔走標若改寫做班級任務，上重要的學習是？", "o": ["目標、節奏與持續行動", "只比誰上緊", "毋免合作"], "a": 0, "e": "本課可延伸到自我管理與堅持。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
