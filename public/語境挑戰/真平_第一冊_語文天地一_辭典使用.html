</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🔎</div><h1>語文天地（一）｜按怎使用教育部《臺灣台語常用詞辭典》？</h1><p>四種查詢方式、附錄與相關學習資源</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"教育部《臺灣台語常用詞辭典》是啥物款的辭典？","o":["線頂辭典","紙本的冊","英語辭典","華語辭典"],"a":0,"e":"是一本由教育部編輯的線上辭典。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"查辭典「豐沛」，華語是啥物？","o":["豐盛","下大雨","很有錢","很生氣"],"a":0,"e":"豐沛：豐盛。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"查辭典「交懍恂」，華語是啥物？","o":["打寒顫","交朋友","很害怕的人","很冷靜"],"a":0,"e":"交懍恂：因寒冷或害怕而發抖。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"華語「不小心」，閩南語是啥物？","o":["無細膩","毋甘","無要緊","無奈何"],"a":0,"e":"不小心＝無細膩。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"華語「羨慕」，閩南語是啥物？","o":["欣羨","佮意","感心","呵咾"],"a":0,"e":"羨慕＝欣羨。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"辭典的「附錄」內底，下面佗一項無收？","o":["流行歌詞","俗諺","百家姓","地名"],"a":0,"e":"附錄有俗諺、百家姓、地名、節氣、親屬稱謂、人體器官等。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"辭典的「相關資源」內底，下面佗一項有？","o":["字型下載、輸入法下載","線上遊戲","影片欣賞","考試題庫"],"a":0,"e":"字型、輸入法、辭典資源下載都在相關資源。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"你若想欲知影一个詞閣較濟的資料，用華語查，較適合用佗一種方式？","o":["用華語查全文","用臺灣台語查詞目","用臺灣台語查用例","看附錄"],"a":0,"e":"點選「用華語查全文」可得更多資料。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"你知影閩南語漢字，想欲查伊的意思，較適合用佗一種查詢？","o":["用臺灣台語查詞目","用華語查用例","用華語查全文","看相關資源"],"a":0,"e":"輸入漢字或臺羅都可查詞目。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"你干焦知影華語，想欲知影閩南語按怎講，較適合用佗一種？","o":["用華語查用例","用臺灣台語查詞目","看附錄的百家姓","下載字型"],"a":0,"e":"輸入華語，查閩南語用例。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"用「臺灣台語查詞目」，會使輸入啥物？","o":["漢字抑是臺羅拼音","干焦注音","干焦英文","干焦華語"],"a":0,"e":"漢字或臺羅拼音都可以。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"想欲知影家己的名姓用閩南語按怎讀，會當查辭典的？","o":["附錄的百家姓","相關資源的字型下載","輸入法","影片"],"a":0,"e":"附錄有百家姓。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"你的電腦看袂著閩南語的特殊字，應該去辭典的佗位處理？","o":["相關資源的字型下載","附錄的俗諺","用華語查用例","用臺灣台語查詞目"],"a":0,"e":"下載字型就看得到特殊字。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"阿淇欲知影「拍謝」的正確寫法，用華語「不好意思」查，會查著？","o":["歹勢","拍謝","失禮","多謝"],"a":0,"e":"正確用字是歹勢。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"用華語「早安」查用例，會查著閩南語？","o":["𠢕早","食飽未","暗安","再會"],"a":0,"e":"早安＝𠢕早。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"用華語「再見」查，閩南語會查著？","o":["再會／閣來","多謝","失禮","拜託"],"a":0,"e":"再見＝再會、閣來。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"佇辭典的輸入框拍字了後，愛揤啥物？","o":["搜尋辭典","列印","分享","關閉"],"a":0,"e":"拍字後揤「搜尋辭典」。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"《臺灣台語常用詞辭典》是啥物單位編的？","o":["教育部","出版社","電視台","學校老師"],"a":0,"e":"由教育部編輯。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"辭典共有幾種查詢方式？","o":["4 種","2 種","3 種","5 種"],"a":0,"e":"查詞目、查用例、用華語查用例、用華語查全文。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"學習單內底，「陳美華」的臺羅拼音寫做？","o":["Tân Bí-huâ","Tan Bi-hua","Chen Mei-hua","Tân Bí-hoa"],"a":0,"e":"例：Tân Bí-huâ。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"火星文課佮這單元的關係是？","o":["會曉查辭典，才知影正確用字","辭典內底有火星文","辭典教人寫火星文","兩个攏無關係"],"a":0,"e":"第二課老師叫阿淇用辭典查正確用字。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"下面佗一个做法，上會當幫助你寫正確的閩南語字？","o":["毋捌的字先查教育部辭典","用音近的華語字代替","隨意寫，看有就好","攏用英文"],"a":0,"e":"查辭典確認用字。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"你欲做閩南語作業，袂曉的字較好按怎處理？","o":["查教育部《臺灣台語常用詞辭典》","空白免寫","用注音","請同學代寫"],"a":0,"e":"學習單建議：袂曉的字會使查辭典。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"辭典除了查字，閣有啥物用處？","o":["聽音讀、看例句","看天氣","買物件","叫外送"],"a":0,"e":"辭典的詞條多有音檔與例句。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"下面佗一个毋是使用辭典的好處？","o":["會當毋免學閩南語","知影正確漢字","知影語詞意思","知影按怎讀"],"a":0,"e":"辭典是學習工具，不能取代學習。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"同學共「啥物」寫做「蝦米」，你欲按怎共伊鬥相共？","o":["𤆬伊用教育部辭典查正確的字","笑伊寫毋著","共伊講免管伊","家己嘛綴伊寫"],"a":0,"e":"會曉查辭典，嘛會當幫助別人寫正確的字。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../語境填空.dc.html'};</script></body></html>
