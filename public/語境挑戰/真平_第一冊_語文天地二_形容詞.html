-columns:1fr}.q{font-size:23px}}

</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎨</div><h1>語文天地（二）｜形容詞</h1><p>形貌、性質、狀態與形容詞重疊</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文內容、人物與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文所學應用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「䆀」較接近啥物意思？","o":["醜、差勁","美","好","大"],"a":0,"e":"䆀：醜陋、惡劣、差勁。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「躼」較接近啥物意思？","o":["人生做懸","人生做矮","人生做肥","人生做瘦"],"a":0,"e":"躼：人長得高。例：躼跤仔。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「緣投」較接近啥物意思？","o":["查埔人生做好看、英俊","有緣","投球真準","人緣真好"],"a":0,"e":"緣投：男子長相英俊。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「幼秀」較接近啥物意思？","o":["秀氣","幼稚","優秀","細漢"],"a":0,"e":"幼秀：秀氣，長相纖細。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「汫」較接近啥物意思？","o":["味淡","味鹹","味辣","味酸"],"a":0,"e":"汫：味道淡、平淡無奇。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「薟」較接近啥物意思？","o":["味辣、氣味嗆鼻","味淡","味甜","味苦"],"a":0,"e":"薟：味道辣、氣味嗆鼻。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「櫳」較接近啥物意思？","o":["稀疏","密密","籠仔","真濟人"],"a":0,"e":"櫳：稀疏的。例：坐位若較櫳，會較爽快。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「赤焱焱」較接近啥物意思？","o":["日頭真炎","面紅紅","火真大","真受氣"],"a":0,"e":"赤焱焱：陽光很強。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「軟膏膏」較接近啥物意思？","o":["非常軟","真硬","真黏","真乾"],"a":0,"e":"軟膏膏：非常柔軟。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「凊」較接近啥物意思？","o":["冷的、涼去的","清清","真燒","真鮮"],"a":0,"e":"凊：冷的、涼掉的。例：凊飯。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「輕可」較接近啥物意思？","o":["工課輕鬆無壓力","真輕的物件","可能","可憐"],"a":0,"e":"輕可：工作輕鬆沒壓力。","h":"想想這个詞佇課文的句子內底是按怎用的。"},{"q":"「硬篤」較接近啥物意思？","o":["困難、艱鉅","硬硬","篤定","真勇"],"a":0,"e":"硬篤：困難、艱鉅。","h":"想想這个詞佇課文的句子內底是按怎用的。"}],"context":[{"q":"「後生生甲足＿＿，漢草閣真好。」空格揀佗一个？","o":["躼","汫","薟","絚"],"a":0,"e":"長得很高。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這碗肉羹糝傷濟胡椒粉，啉起來有夠＿＿。」空格揀佗一个？","o":["薟","汫","躼","絚"],"a":0,"e":"胡椒太多，很嗆辣。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「天＿＿，看起來咧欲落雨矣。」空格揀佗一个？","o":["烏烏","赤焱焱","汫","躼"],"a":0,"e":"天黑黑，快下雨了。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「日頭＿＿，愛加啉寡水。」空格揀佗一个？","o":["赤焱焱","烏烏","軟膏膏","櫳"],"a":0,"e":"太陽很大。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「我這馬手頭有較＿＿。」空格揀佗一个？","o":["絚","櫳","汫","輕可"],"a":0,"e":"絚：生活困窘，手頭緊。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這路菜味傷＿＿，閣加寡鹽。」空格揀佗一个？","o":["汫","鹹","薟","焦"],"a":0,"e":"味道太淡，加鹽。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「這是＿＿貨，逐家會當放心仔買。」空格揀佗一个？","o":["正港","硬篤","殕殕","櫳"],"a":0,"e":"正港：正宗道地。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「臺灣的交通誠＿＿。」空格揀佗一个？","o":["利便","硬篤","虯虯","凊"],"a":0,"e":"利便：方便。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「阿媽的頭毛＿＿。」空格揀佗一个？","o":["虯虯","汫汫","櫳櫳","赤焱焱"],"a":0,"e":"虯虯：捲曲，常形容頭髮。","h":"看空格前後的詞，想想這句咧講啥物情形。"},{"q":"「咱愛認真拍拚，將來做一个＿＿的人。」空格揀佗一个？","o":["有路用","硬篤","䆀","凊"],"a":0,"e":"有路用：有用處、有益處。","h":"看空格前後的詞，想想這句咧講啥物情形。"}],"reading":[{"q":"下面佗一个是形容詞？「阿公予阿淇弄甲喙笑目笑」","o":["喙笑目笑","阿公","予","弄"],"a":0,"e":"喙笑目笑是形容詞。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「少年看獅遮爾痛苦」，佗一个是形容詞？","o":["痛苦","少年","看","遮爾"],"a":0,"e":"痛苦是形容詞；遮爾是副詞。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"「炒菜瓜足清甜」，佗一个是形容詞？","o":["清甜","炒","菜瓜","足"],"a":0,"e":"清甜是形容詞。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"形容詞會使按怎加強語氣？","o":["重疊，像「烏烏」「軟膏膏」","加「矣」","加「咧」","加「無」"],"a":0,"e":"形容詞可以重疊來加強語氣。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"唸謠〈天烏烏〉，阿公佮阿媽是按怎相拍？","o":["阿公欲煮鹹，阿媽欲煮汫","阿公欲食芋，阿媽毋予","阿媽欲掘芋","鼎傷細"],"a":0,"e":"兩人相拍挵破鼎。","h":"倒轉去課文，揣看相關的句子按怎寫。"},{"q":"唸謠〈火金蛄〉，最後是食啥物害落喙齒？","o":["林菝仔","弓蕉","龍眼","茶"],"a":0,"e":"林菝仔全全子，害阮食一下落喙齒。","h":"倒轉去課文，揣看相關的句子按怎寫。"}],"comprehensive":[{"q":"「目睭大細蕊」形容啥物？","o":["偏心","目睭有病","看真清楚","目睭真媠"],"a":0,"e":"目睭大細蕊：形容人偏心。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「歹竹出好筍」形容啥物？","o":["佇歹環境嘛會當成做優秀的人","竹仔歹去","筍仔真好食","好竹出歹筍"],"a":0,"e":"在惡劣環境仍能成長茁壯。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「心歹無人知，喙歹上厲害」提醒咱啥物？","o":["講話愛謹慎","心肝愛好","喙愛甜","莫講話"],"a":0,"e":"提醒人要謹慎言行。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「十二月天睏厝頂——凍霜」形容啥物款人？","o":["吝嗇、小氣","真寒","真勇","愛睏"],"a":0,"e":"凍霜：吝嗇。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"「田中起廟——＿＿」，後半句是？","o":["正經（種宮）","凍霜","可憐","有心"],"a":0,"e":"種宮和正經同音。","h":"想想本課的重點，閣佮生活經驗連結看覓。"},{"q":"下面佗一組形容詞攏咧講「口味」？","o":["汫、薟、鹹","躼、幼秀、緣投","櫳、焦、鬧熱","硬篤、輕可、正港"],"a":0,"e":"汫、薟、鹹、酸甘甜都是口味。","h":"想想本課的重點，閣佮生活經驗連結看覓。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../語境填空.dc.html'};</script></body></html>
