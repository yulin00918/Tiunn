<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>形容詞｜真平第一冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../語境填空.dc.html">← 返回整冊</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎨</div><h1>語文天地（二）｜形容詞</h1><p>形貌、性質、狀態與形容詞重疊</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>語詞意思與教材重點。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>掌握課文人物、事件與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把本課概念帶回生活判斷。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每次隨機抽最多 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab": [{"q": "「媠」較接近啥物意思？", "o": ["漂亮、美麗", "高", "體積或程度大"], "a": 0, "e": "「媠」：漂亮、美麗。"}, {"q": "「懸」較接近啥物意思？", "o": ["高", "漂亮、美麗", "體積或程度大"], "a": 0, "e": "「懸」：高。"}, {"q": "「大」較接近啥物意思？", "o": ["體積或程度大", "漂亮、美麗", "高"], "a": 0, "e": "「大」：體積或程度大。"}, {"q": "「細」較接近啥物意思？", "o": ["小、細", "漂亮、美麗", "高"], "a": 0, "e": "「細」：小、細。"}, {"q": "「芳」較接近啥物意思？", "o": ["香", "漂亮、美麗", "高"], "a": 0, "e": "「芳」：香。"}, {"q": "「臭」較接近啥物意思？", "o": ["氣味不好聞", "漂亮、美麗", "高"], "a": 0, "e": "「臭」：氣味不好聞。"}, {"q": "「甜」較接近啥物意思？", "o": ["甜味", "漂亮、美麗", "高"], "a": 0, "e": "「甜」：甜味。"}, {"q": "「鹹」較接近啥物意思？", "o": ["鹹味", "漂亮、美麗", "高"], "a": 0, "e": "「鹹」：鹹味。"}, {"q": "「冷」較接近啥物意思？", "o": ["溫度低", "漂亮、美麗", "高"], "a": 0, "e": "「冷」：溫度低。"}, {"q": "「燒」較接近啥物意思？", "o": ["熱、燙", "漂亮、美麗", "高"], "a": 0, "e": "「燒」：熱、燙。"}], "context": [{"q": "形容詞主要用來說明「人、代誌、物件」的？", "o": ["形狀佮性質", "數量而已", "時間而已"], "a": 0, "e": "教材定義形容詞用來說明形狀、性質。"}, {"q": "形容詞會當是？", "o": ["兩字以上複詞，也會當是單獨一个字", "一定愛四个字", "一定是名詞"], "a": 0, "e": "教材明確說形容詞可為複詞或單字。"}, {"q": "形容詞重疊通常有啥物作用？", "o": ["加強語氣", "變做動詞", "取消意思"], "a": 0, "e": "教材說形容詞會使重疊來加強語氣。"}, {"q": "「芳貢貢」這類講法較接近？", "o": ["用重疊／構詞加強氣味感受", "量詞", "地名"], "a": 0, "e": "形容詞可以透過形式變化加強描述。"}, {"q": "「目睭大細蕊」這句俗諺用來形容？", "o": ["人偏心", "人真高", "物件真重"], "a": 0, "e": "教材補充資料註解為形容人偏心。"}], "reading": [{"q": "本單元的核心語法概念是？", "o": ["形容詞", "量詞", "連接詞"], "a": 0, "e": "語文天地（二）主題就是形容詞。"}, {"q": "教材把形容詞功能放佇啥物學習？", "o": ["描述人、代誌、物件的形狀與性質", "只算數量", "只標時間"], "a": 0, "e": "這是教材的基本定義。"}, {"q": "形容詞若重疊，常見效果是？", "o": ["語氣閣較強、描寫閣較鮮明", "意思完全消失", "一定變疑問句"], "a": 0, "e": "教材說重疊可加強語氣。"}, {"q": "學形容詞最適合的活動是？", "o": ["觀察物件後用台語描述", "只背數字", "只抄地名"], "a": 0, "e": "形容詞的功能就是描述。"}, {"q": "本單元除了正文，教材閣安排？", "o": ["學習單佮補充資料", "投資表", "食譜"], "a": 0, "e": "教材目錄包含正文、學習單、補充資料。"}], "comprehensive": [{"q": "欲形容一項食物「真芳」，「芳」是？", "o": ["形容詞", "量詞", "代名詞"], "a": 0, "e": "「芳」描述氣味性質。"}, {"q": "欲予描述閣較生動，較適合？", "o": ["使用適合的形容詞佮重疊形式", "攏毋用形容詞", "每句只講數字"], "a": 0, "e": "形容詞能增加描述的具體性。"}, {"q": "「甜甜」和「甜」相比，前者主要利用？", "o": ["重疊", "量詞", "人稱"], "a": 0, "e": "重疊是教材介紹的形容詞表達方式。"}, {"q": "描述一个人外表、物件大小、食物氣味，攏會用著？", "o": ["形容詞", "地名", "姓氏"], "a": 0, "e": "這些都是形狀、性質的描述。"}, {"q": "本單元最適合和啥物生活任務結合？", "o": ["用台語描述教室內一項物件", "計算利息", "查公車時刻"], "a": 0, "e": "生活描述能直接運用形容詞。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
