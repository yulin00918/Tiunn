<script>
const B={"vocab": [{"word": "閃爍", "q": "「閃爍」是咧形容啥物？", "opts": ["光線明明滅滅", "聲音真大聲", "行路真緊"], "ans": 0, "hint": "想看覓天頂的流星。", "explain": "教材解釋「閃爍」是光線不穩定、明明滅滅的樣子。"}, {"word": "莫", "q": "「莫看莫看你的手機仔」的「莫」是啥物意思？", "opts": ["毋通、不要", "趕緊", "可能"], "ans": 0, "hint": "這句是在勸人毋通一直看手機。", "explain": "「莫」表示不要，有禁止或勸阻的意思。"}, {"word": "盤撋", "q": "「無聊的盤撋」內底的「盤撋」上接近啥物？", "opts": ["交際應酬", "旅行", "讀冊"], "ans": 0, "hint": "教材有用「交陪」來幫助理解。", "explain": "教材解釋「盤撋」是交際應酬，指人與人之間互相交往。"}, {"word": "愛人仔", "q": "「愛人仔」是指：", "opts": ["情人", "老師", "厝邊"], "ans": 0, "hint": "歌詞講「手機仔毋是你的愛人仔」。", "explain": "教材解釋「愛人仔」就是情人。"}, {"word": "哪會", "q": "「哪會每一工都共伊攬牢牢」的「哪會」是：", "opts": ["怎麼會", "一定會", "毋會"], "ans": 0, "hint": "這句帶有疑問的語氣。", "explain": "教材將「哪會」解釋為「怎麼會」。"}, {"word": "攬牢牢", "q": "「攬牢牢」是啥物意思？", "opts": ["抱得真緊", "放得真遠", "看得真清楚"], "ans": 0, "hint": "歌詞形容逐工共手機抱佇身軀邊。", "explain": "「攬牢牢」是緊緊地擁抱。"}, {"word": "著賊偷", "q": "「著賊偷」是：", "opts": ["失竊、遭小偷", "著大獎", "受著驚嚇"], "ans": 0, "hint": "想看覓物件予人偷去。", "explain": "教材解釋「著賊偷」為失竊、遭小偷。"}, {"word": "崁", "q": "「緊崁耳空」的「崁」是啥物動作？", "opts": ["覆蓋", "打開", "搖動"], "ans": 0, "hint": "阿伯咧磅米芳，聲音真大。", "explain": "教材解釋「崁」是覆蓋。"}, {"word": "囥", "q": "「囥下手頭」的「囥」是：", "opts": ["擱下、放下", "提起來", "揣出來"], "ans": 0, "hint": "歌詞欲咱先共手頭的煩惱放落來。", "explain": "教材解釋「囥」是擱下、放下。"}, {"word": "緣投", "q": "「有夠緣投，看我穿西裝」的「緣投」是：", "opts": ["英俊", "生氣", "疲倦"], "ans": 0, "hint": "是在形容男子的外表。", "explain": "教材解釋「緣投」是英俊，形容男子長相好看。"}, {"word": "電頭鬃", "q": "「出門來電頭鬃」是咧做啥物？", "opts": ["燙頭髮", "洗面", "穿鞋"], "ans": 0, "hint": "和頭毛造型有關。", "explain": "教材解釋「電頭鬃」是燙頭髮。"}], "context": [{"word": "攬牢牢", "q": "地動來矣，阿母驚甲咇咇掣，阿爸共阿母＿＿＿＿。", "opts": ["放外外", "激恬恬", "攬牢牢"], "ans": 2, "hint": "阿爸欲安慰受驚的阿母。", "explain": "「攬牢牢」就是抱得很緊。"}, {"word": "著賊偷", "q": "阿兄轉來宿舍，發現物件攏拍毋見矣，原來是＿＿＿＿。", "opts": ["著大獎", "著賊偷", "著咳嗾"], "ans": 1, "hint": "物件攏無去矣。", "explain": "「著賊偷」表示失竊、遭小偷。"}, {"word": "囥", "q": "食飯的時，阿母講：「手機仔先＿＿＿＿，咱做伙食飯。」", "opts": ["囥下", "閃爍", "盤撋"], "ans": 0, "hint": "這个情境是叫人先放下手機。", "explain": "「囥」有擱下、放下的意思。"}, {"word": "莫", "q": "老師提醒：「行路的時＿＿＿＿一直𫝻手機仔，足危險！」", "opts": ["莫", "哪會", "緣投"], "ans": 0, "hint": "這是一句勸阻。", "explain": "「莫」表示不要、毋通。"}, {"word": "緣投", "q": "阿明今仔日穿西裝來參加活動，逐家攏講伊足＿＿＿＿。", "opts": ["緣投", "著賊偷", "盤撋"], "ans": 0, "hint": "是在稱讚男生外表好看。", "explain": "「緣投」形容男子長相英俊。"}, {"word": "崁", "q": "外口施工聲真大，妹妹隨共耳空＿＿＿＿起來。", "opts": ["崁", "囥", "攬"], "ans": 0, "hint": "聲音傷大聲，所以共耳空遮起來。", "explain": "「崁」是覆蓋。"}, {"word": "盤撋", "q": "伊逐暗攏咧網路頂佮人＿＿＿＿，煞無時間佮厝裡人講話。", "opts": ["盤撋", "電頭鬃", "著賊偷"], "ans": 0, "hint": "這裡是在講交際往來。", "explain": "「盤撋」是交際應酬。"}, {"word": "攬牢牢", "q": "細漢囡仔看著真久無看著的阿媽，歡喜甲共伊＿＿＿＿。", "opts": ["攬牢牢", "囥下", "莫"], "ans": 0, "hint": "真久無見面，見著會緊緊抱。", "explain": "「攬牢牢」就是緊緊地擁抱。"}, {"word": "哪會", "q": "「你＿＿＿＿遮爾暗猶未睏？」這句上適合填啥物？", "opts": ["哪會", "著賊偷", "閃爍"], "ans": 0, "hint": "是在問「怎麼會這麼晚還沒睡」。", "explain": "「哪會」就是怎麼會。"}, {"word": "閃爍", "q": "暗時看天頂，有一粒星仔一直＿＿＿＿，足媠。", "opts": ["閃爍", "盤撋", "囥下"], "ans": 0, "hint": "星仔的光一下明、一下暗。", "explain": "「閃爍」形容光線明明滅滅。"}], "reading": [{"q": "「手機仔毋是你的愛人仔，哪會每一工都共伊攬牢牢。」主要欲表達啥物？", "opts": ["咱袂使傷過依賴手機仔", "咱攏是手機仔的敵人", "逐工攏愛敲電話予愛人仔"], "ans": 0, "hint": "重點毋是反對手機，是提醒使用方式。", "explain": "教材閱讀題的重點是「咱袂使傷過依賴手機仔」。"}, {"q": "歌詞上尾，阿媽為啥物講伊無愛手機仔？", "opts": ["手機仔傷貴", "伊希望孫仔定定實際轉來看伊", "伊毋捌用手機"], "ans": 1, "hint": "注意「佇巷仔口等待著我」。", "explain": "教材說明阿媽希望孫仔常常回來探望，不希望只靠手機聯絡。"}, {"q": "「你看你看天頂的月娘、閃爍的流星」主要咧提醒人：", "opts": ["加注意身軀邊真實世界的風景", "愛買新的手機", "暗時毋通出門"], "ans": 0, "hint": "課文一開始就問咱欲按怎攑頭欣賞四箍輾轉的風景。", "explain": "歌詞透過月娘、流星等景物，提醒人抬頭感受真實世界。"}, {"q": "「緊來鼻芳，阿母有滷肉；緊崁耳空，阿伯咧磅米芳。」運用了啥物特色？", "opts": ["感官描寫", "數學計算", "人物年齡比較"], "ans": 0, "hint": "有鼻芳，也有耳空聽著的聲。", "explain": "教材分析指出歌詞運用多元感官描寫，引導人注意生活日常。"}, {"q": "這課歌詞主要苦勸現代人啥物？", "opts": ["毋通予手機仔縛牢牢，愛珍惜身軀邊的一切", "手機愈新愈好", "出門一定愛紮手機"], "ans": 0, "hint": "教材的課文分析有直接整理這个主旨。", "explain": "課文主旨是提醒現代人不要被手機束縛，要珍惜身邊的人事物。"}, {"q": "歌詞三擺強調「手機仔毋是你的愛人仔」，有啥物作用？", "opts": ["加強提醒莫規日佮手機黏牢牢", "介紹手機品牌", "教人按怎買手機"], "ans": 0, "hint": "重複的句子通常是在強調核心訊息。", "explain": "教材指出這句重複三次，是要傳達不要整天和手機黏在一起。"}, {"q": "「這葩愛的電火毋免充電」內底的「葩」是：", "opts": ["計算燈火的單位", "計算衣服的單位", "計算成束物體的單位"], "ans": 0, "hint": "句子內底是「電火」。", "explain": "教材解釋「葩」可作為盞、計算燈火的單位。"}, {"q": "課文中的「無聊的盤撋」，「盤撋」會使替換做：", "opts": ["交陪", "交換", "盤仔"], "ans": 0, "hint": "教材有一題直接比較這幾个詞。", "explain": "「交陪」有應酬、交際往來的意思，和「盤撋」最接近。"}], "comprehensive": [{"q": "佇餐廳食飯，逐家攏一直看手機，若欲實踐課文的提醒，上適合按怎做？", "opts": ["先囥下手機，佮身軀邊的人講話", "閣買一支手機", "逐家各自戴耳機"], "ans": 0, "hint": "課文希望咱加佮人實際交流。", "explain": "教材生活對話提出「減少用手機仔，加佮人實際交流」。"}, {"q": "行路的時那行那𫝻手機仔，課文對這種行為的態度是：", "opts": ["提醒毋通按呢，愛注意四箍輾轉", "真鼓勵", "無所謂"], "ans": 0, "hint": "教材對話有講「攏毋驚挵壁」。", "explain": "教材用生活對話提醒走路滑手機會忽略周遭環境。"}, {"q": "「有時陣愛加看一寡風景，對目睭嘛較好。」這句和課文主旨有啥物關係？", "opts": ["鼓勵離開螢幕、注意真實世界", "叫人買相機", "叫人毋通看風景"], "ans": 0, "hint": "想看覓課文開頭的月娘、流星、火金蛄。", "explain": "這句延伸了課文「抬頭看身邊世界」的核心概念。"}, {"q": "阿媽講「伊無愛手機仔」，真正較接近的意思是：", "opts": ["伊較需要孫仔實際轉來陪伴", "所有手機攏無路用", "伊討厭科技"], "ans": 0, "hint": "歌詞寫阿媽佇巷仔口等待。", "explain": "重點是實際陪伴與情感交流，不是全面否定科技。"}, {"q": "朋友食飯一直看手機，你若欲用這課的精神提醒伊，佗一句上適合？", "opts": ["囥下手機仔，咱做伙食飯、講話。", "閣看較久咧。", "手機仔攬牢牢較袂跌。"], "ans": 0, "hint": "重點是減少手機使用，加佮人互動。", "explain": "這个說法符合課文希望人珍惜身邊陪伴的精神。"}, {"q": "課文用月娘、流星、火金蛄、滷肉芳、磅米芳，主要欲予讀者：", "opts": ["重新感受生活周遭的景色、聲音佮氣味", "學習買物件", "記手機規格"], "ans": 0, "hint": "這些攏是手機螢幕外的生活感受。", "explain": "教材分析強調多元感官描寫，提醒讀者注意自己的生活日常。"}, {"q": "「手機仔毋是你的愛人仔」用這種講法，上主要是欲：", "opts": ["用生活化的比喻提醒手機依賴", "說手機真正是人", "介紹戀愛方式"], "ans": 0, "hint": "手機予人逐工攬牢牢，親像愛人仔。", "explain": "歌詞用幽默、生活化的方式凸顯過度依賴手機的現象。"}, {"q": "這課上重要的行動提醒，上適合佗一个？", "opts": ["科技會當用，但是愛留時間予身軀邊的人佮生活", "完全毋通用手機", "逐工一定愛換手機"], "ans": 0, "hint": "課文提醒的是「毋通傷過依賴」，毋是完全禁止。", "explain": "整課重點在平衡科技使用與真實生活、實際陪伴。"}], "tone": [{"q": "花車 hue-tshia、火車 hué-tshia、貨車 huè-tshia，教材用這組例子欲說明啥物？", "opts": ["聲調無仝會予語意無仝", "三種車攏仝款", "羅馬字完全無關係"], "ans": 0, "hint": "三个詞主要差佇頭一字的聲調。", "explain": "教材指出羅馬字形式相近，但聲調不同會造成語意差異。"}, {"q": "歌曲內底若發生「倒音」，可能造成啥物結果？", "opts": ["聽歌的人聽無歌詞涵義，甚至誤解", "歌曲一定變較短", "手機無電"], "ans": 0, "hint": "音階和語詞聲調若相撞突，會影響理解。", "explain": "教材說倒音可能使聽者無法一下聽出本意，也可能造成誤解。"}, {"q": "「講 kóng」佮「狂 kông」的差別主要佇：", "opts": ["聲調", "字數", "攏無差別"], "ans": 0, "hint": "教材用這組例子說明顛倒音。", "explain": "兩詞的音節相近，但聲調不同，語意也不同。"}, {"q": "「飛 pue」佮「陪 puê」若唱甲欲仝仔欲仝，教材稱這種現象做：", "opts": ["倒音", "盤撋", "閃爍"], "ans": 0, "hint": "這是本課語文智識的主題。", "explain": "歌曲音階與詞語聲調不一致，可能產生「倒音」。"}, {"q": "「肝 kuann」佮「寒 kuânn」的例子欲提醒咱：", "opts": ["聽歌愛斟酌聲調佮語意", "兩字意思仝款", "唱歌毋免管語意"], "ans": 0, "hint": "聲調會影響詞義。", "explain": "教材希望學生從歌曲中體會語言聲調與音樂之間的關係。"}, {"q": "教材綜合五个例子後，認為倒音是按怎產生？", "opts": ["歌曲音階和歌詞聲調相撞突", "歌詞字傷濟", "歌手無用手機"], "ans": 0, "hint": "注意「音階」佮「聲調」兩項。", "explain": "教材總結：歌曲音階和歌詞聲調若不一致，就可能產生倒音。"}]};const names={vocab:"🔤 課文語詞",context:"💭 語境選詞",reading:"📖 讀文理解",comprehensive:"🏆 綜合挑戰",tone:"🎵 延伸挑戰｜聽歌揣倒音"};
let bank,set=[],i=0,score=0,tries=0,weak=[];
const $=id=>document.getElementById(id);function sh(a){return [...a].sort(()=>Math.random()-.5)}
function show(id){["lesson","quiz","result"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");scrollTo(0,0)}
function start(b){bank=b;set=sh(B[b]).slice(0,5);i=0;score=0;weak=[];$("qt").textContent=names[b];show("quiz");render()}
document.querySelectorAll(".start").forEach(x=>x.onclick=()=>start(x.dataset.b));
function render(){tries=0;let q=set[i];$("count").textContent=`第 ${i+1} / 5 題`;$("scoreNow").textContent=`目前 ${score} 分`;$("fill").style.width=`${i*20}%`;
$("qcard").innerHTML=`<div class="kicker">${q.word?("本課語詞｜"+q.word):names[bank]}</div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join("")}</div><div id="fb"></div>`}
function pick(n,el){let q=set[i];if(document.querySelector(".correct"))return;tries++;if(n===q.ans){el.classList.add("correct");score++;$("fb").innerHTML=`<div class="feedback ok">✅ 著矣！<br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add("wrong");if(tries===1){if(q.word)weak.push(q.word);$("fb").innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${q.hint}</div>`}else{document.querySelectorAll(".opt")[q.ans].classList.add("correct");$("fb").innerHTML=`<div class="feedback bad">答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}
function next(){i++;if(i<5)render();else finish()}function finish(){$("s-"+bank).textContent=`上擺 ${score} / 5`;$("rt").textContent=names[bank]+"完成！";$("fs").textContent=score+" / 5";$("msg").textContent=score===5?"🏆 真𠢕！這關全數答著。":score>=4?"🌟 真好！已經真熟矣。":score>=3?"👍 愈來愈會曉！":"🌱 閣練一擺，會愈來愈熟。";let w=[...new Set(weak)];$("weak").innerHTML=w.length?`<b>建議閣練：</b>${w.join("、")}`:"✨ 這擺無特別需要加強的語詞。";show("result")}
$("retry").onclick=()=>start(bank);$("home").onclick=()=>show("lesson");$("back").onclick=()=>{if($("lesson").classList.contains("hidden")){show("lesson")}else{location.href='../語境填空.dc.html'}};
</script></body></html>
