<script>const B={"vocab": [{"word": "罕得", "q": "「罕得」是啥物意思？", "opts": ["稀罕、難得、稀少", "真平常", "真緊"], "ans": 0, "hint": "課文講以前囡仔人無定定過生日。", "explain": "教材解釋「罕得」是稀罕、難得、稀少。"}, {"word": "頭喙", "q": "「厝裡頭喙濟」的「頭喙」是：", "opts": ["家中人口", "頭殼佮喙", "兄弟姊妹的歲數"], "ans": 0, "hint": "這句是在講厝內人真濟。", "explain": "教材解釋「頭喙」指家中人口。"}, {"word": "桌頂拈柑", "q": "「桌頂拈柑」比喻：", "opts": ["代誌極其容易", "代誌真困難", "食柑真甜"], "ans": 0, "hint": "伸手就拈會著。", "explain": "教材解釋「桌頂拈柑」比喻事情極其容易。"}, {"word": "生相", "q": "課文內底「生相」是指：", "opts": ["生肖", "長相", "生日"], "ans": 0, "hint": "教材列出 senn-siùnn / sinn-siùnn。", "explain": "教材解釋「生相」是生肖。"}, {"word": "肨奶", "q": "「肨奶肨奶」是咧形容：", "opts": ["嬰兒白白嫩嫩、有嬰兒肥", "身材真瘦", "真愛哭"], "ans": 0, "hint": "課文用來形容三兄細漢古錐的模樣。", "explain": "教材解釋「肨奶」形容嬰兒長得白白嫩嫩。"}, {"word": "呼噓仔", "q": "「呼噓仔」是：", "opts": ["吹口哨", "大聲哭", "唱歌"], "ans": 0, "hint": "阿爸歡喜甲那唱歌那……", "explain": "教材解釋「呼噓仔」是吹口哨。"}, {"word": "變鬼變怪", "q": "「變鬼變怪」是啥物意思？", "opts": ["搞鬼、耍花招", "變做鬼", "真驚惶"], "ans": 0, "hint": "作者細漢足愛搞怪。", "explain": "教材解釋「變鬼變怪」為搞鬼、耍花招、故弄玄虛。"}, {"word": "齣頭", "q": "「齣頭有夠濟」的「齣頭」是：", "opts": ["把戲、花樣", "出門", "頭一齣戲"], "ans": 0, "hint": "和「變鬼變怪」意思相關。", "explain": "教材解釋「齣頭」是把戲、花樣。"}], "context": [{"word": "罕得", "q": "阿公平常真少出門，今仔日＿＿＿＿來學校看我表演。", "opts": ["罕得", "頭喙", "生相"], "ans": 0, "hint": "這件代誌真難得。", "explain": "「罕得」可表示難得、稀少。"}, {"word": "桌頂拈柑", "q": "這題對小明來講真簡單，親像＿＿＿＿。", "opts": ["桌頂拈柑", "海底摸針", "變鬼變怪"], "ans": 0, "hint": "欲表達「真容易」。", "explain": "「桌頂拈柑」比喻事情極其容易。"}, {"word": "頭喙", "q": "𪜶兜＿＿＿＿真濟，過年時規間厝攏是人。", "opts": ["頭喙", "肨奶", "呼噓仔"], "ans": 0, "hint": "這裡是在講家庭人口。", "explain": "「頭喙」指家中人口。"}, {"word": "生相", "q": "阿弟是舊年出世的，你敢知影伊的＿＿＿＿是啥物？", "opts": ["生相", "齣頭", "頭喙"], "ans": 0, "hint": "答案可能是龍、蛇、馬……", "explain": "「生相」就是生肖。"}, {"word": "肨奶", "q": "嬰仔的面肉白白嫩嫩，予人感覺＿＿＿＿。", "opts": ["肨奶肨奶", "瘦抽瘦抽", "變鬼變怪"], "ans": 0, "hint": "教材用這个詞形容嬰兒肥。", "explain": "「肨奶」形容嬰兒白白嫩嫩。"}, {"word": "變鬼變怪", "q": "彼个囡仔足愛創新花樣，逐工攏咧＿＿＿＿。", "opts": ["變鬼變怪", "罕得", "頭喙"], "ans": 0, "hint": "是「搞怪、耍花招」。", "explain": "「變鬼變怪」可用來說搞鬼、耍花招。"}, {"word": "齣頭", "q": "伊上課足有＿＿＿＿，一下講笑詼，一下閣變魔術。", "opts": ["齣頭", "生相", "肨奶"], "ans": 0, "hint": "花樣真濟。", "explain": "「齣頭」是把戲、花樣。"}, {"word": "呼噓仔", "q": "阿兄心情真好，一路行一路＿＿＿＿。", "opts": ["呼噓仔", "頭喙", "罕得"], "ans": 0, "hint": "用嘴發出旋律聲。", "explain": "「呼噓仔」是吹口哨。"}], "reading": [{"q": "作者細漢想欲食雞卵糕，為啥物無簡單？", "opts": ["彼个年代較艱苦，愛家境袂䆀才有法度", "作者毋愛食甜", "厝邊無賣雞卵糕"], "ans": 0, "hint": "看第一段對物資條件的描寫。", "explain": "課文寫以前較艱苦，想吃蛋糕要家境不錯才有辦法。"}, {"q": "三个阿兄考試提頭名「親像桌頂拈柑」，表示：", "opts": ["𪜶真𠢕讀冊，考第一名對𪜶真容易", "𪜶無愛讀冊", "考試全靠運氣"], "ans": 0, "hint": "「桌頂拈柑」是容易。", "explain": "教材題目明確用這句表達考試提頭名很簡單、能輕鬆做到。"}, {"q": "爸母對作者的興趣是啥物態度？", "opts": ["尊重，無因為伊讀冊無親像阿兄就罵伊", "完全反對", "強迫伊考第一名"], "ans": 0, "hint": "課文直接寫「嘛誠尊重我的興趣」。", "explain": "爸母不因作者不像哥哥會讀書而責罵，也尊重她的興趣。"}, {"q": "佇重男輕女的時代，逐年攏佇作者生日食雞卵糕，作者感覺這件代誌：", "opts": ["真正誠罕見", "真普通", "真無趣味"], "ans": 0, "hint": "課文有直接講。", "explain": "作者回想在當時的社會背景下，這樣的疼惜十分少見。"}, {"q": "「伊若是查某囡仔，毋知有偌好咧！」表現爸母：", "opts": ["向望會當生查某囝", "希望生查埔囝", "對囡仔失望"], "ans": 0, "hint": "教材閱讀題有直接解釋。", "explain": "這句表現父母心中對生女兒的期待。"}, {"q": "作者生日食著「神仙雞卵糕」後，彼種感覺按怎？", "opts": ["滿足的記持到今猶原印佇頭殼內", "食了就袂記得", "感覺無好食"], "ans": 0, "hint": "課文寫「到今攏印佇我的頭殼內」。", "explain": "雞卵糕軟軟綿綿，成為作者長久的滿足回憶。"}, {"q": "這篇散文主要用啥物人稱書寫？", "opts": ["第一人稱", "第二人稱", "第三人稱"], "ans": 0, "hint": "作者一直用「我」回想細漢。", "explain": "教材分析指出本文以第一人稱書寫。"}, {"q": "課文透過雞卵糕的回憶，主要展現：", "opts": ["家庭情感佮對過去歲月的懷念", "蛋糕製作方法", "考試技巧"], "ans": 0, "hint": "雞卵糕是記持的核心。", "explain": "教材指出文章展現家庭成員之間的情感與對過去歲月的懷念。"}], "comprehensive": [{"q": "教材認為「雞卵糕」佇課文內底象徵啥物？", "opts": ["爸母的愛", "考試成績", "家庭人口"], "ans": 0, "hint": "這是教材的核心討論題。", "explain": "教材直接指出「雞卵糕」象徵爸母的愛。"}, {"q": "作者用雞卵糕的「軟軟甜甜、軟軟閣綿綿」主要是啥物描寫？", "opts": ["口感的細節描寫", "天氣描寫", "外貌描寫"], "ans": 0, "hint": "是在寫食物食落去的感覺。", "explain": "教材分析特別提到雞卵糕口感等細節描寫。"}, {"q": "「一粒卵到一粒雞卵糕」佇文章內底較能代表：", "opts": ["爸母辛苦拍拚予囝兒幸福", "食物愈來愈貴", "作者想開蛋糕店"], "ans": 0, "hint": "教材主旨直接說明這層意義。", "explain": "教材指出，在物資欠缺年代，這些食物是父母為孩子幸福辛苦付出的證明。"}, {"q": "若你欲仿照本課寫「一種食物代表愛」，上重要的是：", "opts": ["寫出食物佮人物、事件、情感的連結", "干焦寫食物價數", "列出營養成分"], "ans": 0, "hint": "本課用食物打開家庭回憶。", "explain": "本課以平凡食物連結家庭互動與情感記憶。"}, {"q": "作者寫「重男輕女的時代」主要幫助讀者看著：", "opts": ["彼个年代的社會情景佮爸母對查某囝的疼惜", "蛋糕品牌歷史", "生肖文化"], "ans": 0, "hint": "教材說細節描寫會予咱看著彼个年代的社會情景。", "explain": "社會背景讓父母對女兒的支持與疼惜更凸顯。"}, {"q": "「平凡的代誌，傳達深深的人情味」上符合佗一項？", "opts": ["生日的一塊雞卵糕，留落爸母疼惜的記持", "考試第一名", "查生肖"], "ans": 0, "hint": "想看覓文章題目。", "explain": "雞卵糕是日常小事，卻承載家庭情感。"}]};const names={vocab:"🔤 課文語詞",context:"💭 語境選詞",reading:"📖 讀文理解",comprehensive:"🏆 綜合挑戰"};
let bank,set=[],i=0,score=0,tries=0,weak=[];
const $=id=>document.getElementById(id), sh=a=>[...a].sort(()=>Math.random()-.5);
function show(id){["lesson","quiz","result","activity"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");scrollTo(0,0)}
function start(b){bank=b;set=sh(B[b]).slice(0,5);i=0;score=0;weak=[];$("qt").textContent=names[b];show("quiz");render()}
document.querySelectorAll(".start").forEach(x=>x.onclick=()=>start(x.dataset.b));
function render(){tries=0;let q=set[i];$("count").textContent=`第 ${i+1} / 5 題`;$("scoreNow").textContent=`目前 ${score} 分`;$("fill").style.width=`${i*20}%`;
$("qcard").innerHTML=`<div class="kicker">${q.word?("本課語詞｜"+q.word):names[bank]}</div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join("")}</div><div id="fb"></div>`}
function pick(n,el){let q=set[i];if(document.querySelector(".correct"))return;tries++;if(n===q.ans){el.classList.add("correct");score++;$("fb").innerHTML=`<div class="feedback ok">✅ 著矣！<br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add("wrong");if(tries===1){if(q.word)weak.push(q.word);$("fb").innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${q.hint}</div>`}else{document.querySelectorAll(".opt")[q.ans].classList.add("correct");$("fb").innerHTML=`<div class="feedback bad">答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}
function next(){i++;if(i<5)render();else finish()}
function finish(){$("s-"+bank).textContent=`上擺 ${score} / 5`;$("rt").textContent=names[bank]+"完成！";$("fs").textContent=score+" / 5";$("msg").textContent=score===5?"🏆 真𠢕！這關全數答著。":score>=4?"🌟 真好！已經真熟矣。":score>=3?"👍 愈來愈會曉！":"🌱 閣練一擺，會愈來愈熟。";let w=[...new Set(weak)];$("weak").innerHTML=w.length?`<b>建議閣練：</b>${w.join("、")}`:"✨ 這擺無特別需要加強的語詞。";show("result")}
$("retry").onclick=()=>start(bank);$("home").onclick=()=>show("lesson");$("back").onclick=()=>{if($("lesson").classList.contains("hidden")){show("lesson")}else{location.href='../語境填空.dc.html'}};

function updateMemory(){let f=$("food").value,p=$("person").value,e=$("event").value||"彼个時陣",g=$("feeling").value;$("memoryPreview").textContent=`對我來講，「${f}」毋但是好食的物件。${e}，我佮${p}做伙的記持，予我感覺真${g}。逐擺閣食著，攏會想起彼段時光。`}
