let bank,set=[],i=0,score=0,tries=0,weak=[];const $=id=>document.getElementById(id);function sh(a){return [...a].sort(()=>Math.random()-.5)}
function show(id){["lesson","quiz","result","poem"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");scrollTo(0,0)}
function start(b){bank=b;set=sh(B[b]).slice(0,5);i=0;score=0;weak=[];$("qt").textContent=names[b];show("quiz");render()}
document.querySelectorAll(".start").forEach(x=>x.onclick=()=>start(x.dataset.b));

function pick(n,el){let q=set[i];if(document.querySelector(".correct"))return;tries++;if(n===q.ans){el.classList.add("correct");score++;$("fb").innerHTML=`<div class="feedback ok">✅ 著矣！<br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add("wrong");if(tries===1){if(q.word)weak.push(q.word);$("fb").innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${q.hint}</div>`}else{document.querySelectorAll(".opt")[q.ans].classList.add("correct");$("fb").innerHTML=`<div class="feedback bad">答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}
function next(){i++;if(i<5)render();else finish()}function finish(){$("s-"+bank).textContent=`上擺 ${score} / 5`;$("rt").textContent=names[bank]+"完成！";$("fs").textContent=score+" / 5";$("msg").textContent=score===5?"🏆 真𠢕！這關全數答著。":score>=4?"🌟 真好！已經真熟矣。":score>=3?"👍 愈來愈會曉！":"🌱 閣練一擺，會愈來愈熟。";let w=[...new Set(weak)];$("weak").innerHTML=w.length?`<b>建議閣練：</b>${w.join("、")}`:"✨ 這擺無特別需要加強的語詞。";show("result")}
$("retry").onclick=()=>start(bank);$("home").onclick=()=>show("lesson");$("back").onclick=()=>{if($("lesson").classList.contains("hidden")){show("lesson")}else{location.href='../語境填空.dc.html'}};

let pi=0;
function renderPoem(){
 let p=B.poem[pi], selections=p.slots.map(s=>s.opts[0]);
 $("poemControls").innerHTML=p.slots.map((s,idx)=>`<label>${s.label}<select data-i="${idx}">${s.opts.map(o=>`<option>${o}</option>`).join("")}</select></label>`).join("");
 function update(){let line=p.template;p.slots.forEach((s,idx)=>line=line.replace(`【${s.label}】`,`<span class="slot">${selections[idx]}</span>`));$("poemLine").innerHTML=line}
 update();$("poemControls").querySelectorAll("select").forEach(sel=>sel.onchange=e=>{selections[+e.target.dataset.i]=e.target.value;update()});
 $("poemNote").textContent=p.note;
}
$("poemBtn").onclick=()=>{pi=0;show("poem");renderPoem()};$("nextPoem").onclick=()=>{pi=(pi+1)%B.poem.length;renderPoem()};$("poemHome").onclick=()=>show("lesson");
