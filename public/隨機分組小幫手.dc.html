<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  @keyframes pop { from{opacity:0;transform:translateY(10px) scale(.98);} to{opacity:1;transform:translateY(0) scale(1);} }
  .rg-group-card{animation:pop .35s ease both;}
  .rg-toast.show{opacity:1 !important;transform:translateX(-50%) translateY(0) !important;}
</style>
</helmet>
<div style="font-family:'Noto Sans TC',sans-serif;color:#26304a;background:radial-gradient(circle at 10% 10%, rgba(255,255,255,.95), transparent 28%),radial-gradient(circle at 90% 20%, rgba(190,210,255,.7), transparent 30%),linear-gradient(135deg, #dbe6ff, #eef2ff);min-height:100vh;padding:28px 16px 48px;">
  <div style="width:min(1180px,100%);margin:0 auto;">

    <header style="text-align:center;margin-bottom:22px;">
      <h1 style="margin:0 0 8px;font-size:clamp(28px,5vw,46px);letter-spacing:.04em;">🎲 隨機分組小幫手</h1>
      <p style="margin:0;color:#6f7890;font-size:16px;">貼上學生名單,選擇分組方式,一鍵完成公平分組。</p>
    </header>

    <div style="display:grid;grid-template-columns:390px 1fr;gap:22px;align-items:start;">

      <aside style="background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:0 18px 45px rgba(66,77,140,.16);backdrop-filter:blur(12px);padding:22px;position:sticky;top:18px;">
        <h2 style="margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px;">👩‍🏫 班級設定</h2>

        <label style="display:block;font-weight:700;margin:15px 0 8px;">班級名稱</label>
        <input type="text" placeholder="例如：九年一班" value="{{className}}" onChange="{{onClassNameChange}}" style="width:100%;border:1px solid #dfe4f2;border-radius:14px;padding:12px 14px;font:inherit;color:#26304a;background:#fff;outline:none;box-sizing:border-box;">

        <label style="display:block;font-weight:700;margin:15px 0 8px;">學生名單</label>
        <textarea placeholder="請一行輸入一位學生，例如：&#10;王小明&#10;李小華&#10;陳美玲" value="{{namesText}}" onChange="{{onNamesChange}}" style="width:100%;min-height:230px;resize:vertical;line-height:1.7;border:1px solid #dfe4f2;border-radius:14px;padding:12px 14px;font:inherit;color:#26304a;background:#fff;outline:none;box-sizing:border-box;"></textarea>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
          <span style="background:#f7f8fc;border:1px solid #dfe4f2;border-radius:999px;padding:7px 11px;color:#6f7890;font-size:14px;">目前人數：<strong>{{studentCount}}</strong></span>
          <span style="background:#f7f8fc;border:1px solid #dfe4f2;border-radius:999px;padding:7px 11px;color:#6f7890;font-size:14px;">重複姓名會自動保留一次</span>
        </div>

        <label style="display:block;font-weight:700;margin:15px 0 8px;">分組方式</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">
          <button style="{{byGroupBtnStyle}}" onClick="{{switchToGroups}}">指定組數</button>
          <button style="{{bySizeBtnStyle}}" onClick="{{switchToSize}}">指定每組人數</button>
        </div>

        <sc-if value="{{isByGroups}}">
          <label style="display:block;font-weight:700;margin:15px 0 8px;">要分成幾組？</label>
          <input type="number" min="1" value="{{groupCount}}" onChange="{{onGroupCountChange}}" style="width:100%;border:1px solid #dfe4f2;border-radius:14px;padding:12px 14px;font:inherit;color:#26304a;background:#fff;outline:none;box-sizing:border-box;">
        </sc-if>
        <sc-if value="{{isBySize}}">
          <label style="display:block;font-weight:700;margin:15px 0 8px;">每組幾人？</label>
          <input type="number" min="1" value="{{groupSize}}" onChange="{{onGroupSizeChange}}" style="width:100%;border:1px solid #dfe4f2;border-radius:14px;padding:12px 14px;font:inherit;color:#26304a;background:#fff;outline:none;box-sizing:border-box;">
        </sc-if>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;">
          <button style="grid-column:1 / -1;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(135deg, #5b67f1, #7f86ff);color:#fff;" onClick="{{createGroups}}">✨ 開始隨機分組</button>
          <button style="grid-column:1 / -1;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;cursor:pointer;background:#e6f7ef;color:#2da66f;" onClick="{{loadFromRoster}}">📥 從學生名單載入</button>
          <button style="border:0;border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;cursor:pointer;background:#eef0ff;color:#414bd0;" onClick="{{saveList}}">💾 儲存名單</button>
          <button style="border:0;border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;cursor:pointer;background:#fff0df;color:#b56319;" onClick="{{loadList}}">📂 載入名單</button>
          <button style="grid-column:1 / -1;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;cursor:pointer;background:#ffe8eb;color:#e45d68;" onClick="{{clearAll}}">🗑️ 清除</button>
        </div>

        <p style="margin-top:10px;font-size:13px;color:#6f7890;line-height:1.6;">名單會儲存在目前瀏覽器中,不會上傳到網路。分組後可直接修改組名。</p>
      </aside>

      <section style="background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:0 18px 45px rgba(66,77,140,.16);backdrop-filter:blur(12px);padding:22px;min-height:520px;">
        <div style="display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
          <div>
            <h2 style="margin:0;font-size:24px;">{{resultTitle}}</h2>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
              <sc-if value="{{hasGroups}}">
                <span style="background:#f7f8fc;border:1px solid #dfe4f2;border-radius:999px;padding:7px 11px;color:#6f7890;font-size:14px;">共 {{groupsCount}} 組</span>
                <span style="background:#f7f8fc;border:1px solid #dfe4f2;border-radius:999px;padding:7px 11px;color:#6f7890;font-size:14px;">共 {{totalPeople}} 人</span>
              </sc-if>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:260px;">
            <button style="border:0;border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;cursor:pointer;background:#eef0ff;color:#414bd0;" onClick="{{createGroups}}">🔄 重新分組</button>
            <button style="border:0;border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;cursor:pointer;background:#fff0df;color:#b56319;" onClick="{{copyResult}}">📋 複製結果</button>
          </div>
        </div>

        <sc-if value="{{hasGroups}}">
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(210px,1fr));gap:16px;">
            <sc-for list="{{groups}}" as="g" hint-placeholder-count="0">
              <article class="rg-group-card" style="background:#fff;border:1px solid #dfe4f2;border-radius:18px;padding:16px;box-shadow:0 10px 25px rgba(78,87,140,.08);">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;">
                  <input value="{{g.name}}" onChange="{{g.onNameChange}}" style="font-weight:800;font-size:17px;padding:8px 10px;background:#f8f9ff;border:1px solid #dfe4f2;border-radius:14px;font-family:inherit;color:#26304a;outline:none;width:65%;">
                  <span style="white-space:nowrap;color:#414bd0;background:#eef0ff;border-radius:999px;padding:6px 9px;font-size:13px;font-weight:800;">{{g.count}} 人</span>
                </div>
                <div>
                  <sc-for list="{{g.members}}" as="name" hint-placeholder-count="3">
                    <div style="padding:9px 10px;background:#fafbff;border:1px solid #edf0f8;border-radius:11px;margin-top:8px;font-weight:650;">{{name}}</div>
                  </sc-for>
                </div>
              </article>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{!hasGroups}}">
          <div style="min-height:400px;display:grid;place-items:center;text-align:center;color:#6f7890;padding:30px;">
            <div>
              <div style="font-size:64px;margin-bottom:10px;">🧩</div>
              <h3>尚未產生分組</h3>
              <p>請先輸入學生名單,再按下「開始隨機分組」。</p>
            </div>
          </div>
        </sc-if>
      </section>

    </div>
  </div>

  <div class="rg-toast" style="{{toastStyle}}">{{toastMessage}}</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

class Component extends DCLogic {
  state = {
    className: '', namesText: '', mode: 'groups', groupCount: 6, groupSize: 4,
    groups: [], groupNames: [], toastMessage: '', toastVisible: false,
  };
  toastTimer = null;

  parseNames() {
    const raw = this.state.namesText.split(/\n|,|，/).map(n => n.trim()).filter(Boolean);
    return [...new Set(raw)];
  }

  showToast(msg) {
    clearTimeout(this.toastTimer);
    this.setState({ toastMessage: msg, toastVisible: true });
    this.toastTimer = setTimeout(() => this.setState({ toastVisible: false }), 1800);
  }

  createGroups() {
    const students = shuffle(this.parseNames());
    if (students.length === 0) { this.showToast('請先輸入學生名單'); return; }
    let numberOfGroups;
    if (this.state.mode === 'groups') {
      numberOfGroups = Number(this.state.groupCount);
      if (!Number.isInteger(numberOfGroups) || numberOfGroups < 1) { this.showToast('請輸入正確的組數'); return; }
      numberOfGroups = Math.min(numberOfGroups, students.length);
    } else {
      const size = Number(this.state.groupSize);
      if (!Number.isInteger(size) || size < 1) { this.showToast('請輸入正確的每組人數'); return; }
      numberOfGroups = Math.ceil(students.length / size);
    }
    const groups = Array.from({ length: numberOfGroups }, () => []);
    students.forEach((student, index) => { groups[index % numberOfGroups].push(student); });
    const groupNames = groups.map((_, i) => `第 ${i + 1} 組`);
    this.setState({ groups, groupNames });
  }

  saveList() {
    localStorage.setItem('randomGroupClassName', this.state.className);
    localStorage.setItem('randomGroupNames', this.state.namesText);
    this.showToast('名單已儲存');
  }
  loadList() {
    const savedNames = localStorage.getItem('randomGroupNames');
    const savedClass = localStorage.getItem('randomGroupClassName');
    if (!savedNames) { this.showToast('目前沒有已儲存的名單'); return; }
    this.setState({ namesText: savedNames, className: savedClass || '' });
    this.showToast('名單已載入');
  }
  clearAll() {
    this.setState({ namesText: '', className: '', groups: [], groupNames: [] });
    this.showToast('畫面已清除');
  }

  loadFromRoster() {
    try {
      const raw = localStorage.getItem('teacherToolboxClassData');
      if (!raw) { this.showToast('目前教學百寶箱裡沒有學生名單'); return; }
      const data = JSON.parse(raw);
      const cls = data.classes && data.currentClassId ? data.classes[data.currentClassId] : data;
      const students = cls && cls.students ? cls.students : [];
      if (!students.length) { this.showToast('目前班級的學生名單是空的'); return; }
      this.setState({ namesText: students.map(s => s.name).join('\n'), className: cls.className || '' });
      this.showToast('已從學生名單載入');
    } catch (e) { this.showToast('讀取學生名單失敗'); }
  }

  async copyResult() {
    const { groups, groupNames, className } = this.state;
    if (groups.length === 0) { this.showToast('目前沒有可複製的分組結果'); return; }
    const title = className.trim() || '隨機分組結果';
    const text = [title, '', ...groups.map((g, i) => `${groupNames[i] || `第 ${i + 1} 組`}（${g.length}人）\n${g.join('、')}`)].join('\n\n');
    try { await navigator.clipboard.writeText(text); this.showToast('分組結果已複製'); }
    catch {
      const temp = document.createElement('textarea');
      temp.value = text; document.body.appendChild(temp); temp.select();
      document.execCommand('copy'); temp.remove();
      this.showToast('分組結果已複製');
    }
  }

  renderVals() {
    const s = this.state;
    const isByGroups = s.mode === 'groups';
    const tabStyle = (active) => `border:1px solid ${active ? '#5b67f1' : '#dfe4f2'};background:${active ? '#5b67f1' : '#fff'};color:${active ? '#fff' : '#26304a'};padding:11px 8px;border-radius:12px;cursor:pointer;font-weight:700;font-family:inherit;`;
    const groups = s.groups.map((members, i) => ({
      name: s.groupNames[i] || `第 ${i + 1} 組`,
      count: members.length,
      members,
      onNameChange: (e) => { const gn = [...s.groupNames]; gn[i] = e.target.value; this.setState({ groupNames: gn }); },
    }));
    const totalPeople = s.groups.reduce((sum, g) => sum + g.length, 0);
    const className = s.className.trim();

    return {
      className: s.className, onClassNameChange: (e) => this.setState({ className: e.target.value }),
      namesText: s.namesText, onNamesChange: (e) => this.setState({ namesText: e.target.value }),
      studentCount: this.parseNames().length,
      isByGroups, isBySize: !isByGroups,
      byGroupBtnStyle: tabStyle(isByGroups), bySizeBtnStyle: tabStyle(!isByGroups),
      switchToGroups: () => this.setState({ mode: 'groups' }), switchToSize: () => this.setState({ mode: 'size' }),
      groupCount: s.groupCount, onGroupCountChange: (e) => this.setState({ groupCount: e.target.value }),
      groupSize: s.groupSize, onGroupSizeChange: (e) => this.setState({ groupSize: e.target.value }),
      createGroups: () => this.createGroups(), saveList: () => this.saveList(), loadList: () => this.loadList(), clearAll: () => this.clearAll(),
      loadFromRoster: () => this.loadFromRoster(),
      resultTitle: className ? `${className}｜分組結果` : '分組結果',
      hasGroups: groups.length > 0, groupsCount: groups.length, totalPeople, groups,
      copyResult: () => this.copyResult(),
      toastMessage: s.toastMessage,
      toastStyle: `position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(${s.toastVisible ? '0' : '20px'});background:#232a3f;color:#fff;padding:11px 17px;border-radius:999px;opacity:${s.toastVisible ? 1 : 0};pointer-events:none;transition:.25s;z-index:20;`,
    };
  }
}

</script>
</body>
</html>
