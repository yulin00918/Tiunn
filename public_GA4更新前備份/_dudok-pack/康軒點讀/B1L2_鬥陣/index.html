<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台語點讀 V2｜康軒第一冊第二課 鬥陣</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e4;color:#3c342c;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px}.head{background:#fffaf0;border:1px solid #e2d5bd;border-radius:22px;padding:22px 26px;box-shadow:0 6px 24px #59451e12}.eyebrow{color:#8a6b3e;font-weight:700}.head h1{margin:5px 0 4px;font-size:clamp(28px,5vw,46px)}.author{color:#756b60}.tabs,.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tabs button,.controls button,.playbtn{border:0;border-radius:999px;padding:10px 16px;background:#e9dfcc;color:#493d30;font-weight:700;cursor:pointer}.tabs button.active,.controls button.primary{background:#536b55;color:white}.panel{display:none}.panel.active{display:block}.seg{background:#fffdf8;border:1px solid #e6dac4;border-radius:18px;padding:18px 20px;margin:12px 0;line-height:2;font-size:clamp(18px,2.3vw,24px);cursor:pointer}.seg.playing{outline:3px solid #9caf92}.v{color:#a24736;font-weight:800;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:5px;cursor:pointer}.vocab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:#fffdf8;border:1px solid #e6dac4;border-radius:18px;padding:18px}.card h3{margin:0 0 4px;color:#8b4637}.tl{color:#58705c;font-weight:700}.note{color:#766c61;font-size:14px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fffaf0;border-radius:20px;padding:22px;max-width:440px;width:100%}.box h2{margin-top:0;color:#8b4637}.close{float:right;border:0;background:none;font-size:26px;cursor:pointer}@media(max-width:600px){.wrap{padding:12px}.seg{padding:15px}.head{padding:18px}}

</head><body><div class="wrap"><a href="../../台語點讀.dc.html" style="display:inline-block;margin-bottom:14px;color:#8f2035;font-weight:700;text-decoration:none;white-space:nowrap;">← 回台語點讀目錄</a><section class="head"><div class="eyebrow">康軒版・第一冊</div><h1>第二課｜鬥陣</h1><div class="author">作者：楊晉淵</div></section><div class="tabs"><button class="active" data-tab="text">課文點讀</button><button data-tab="vocab">語詞點讀</button></div><div class="controls"><button class="primary" onclick="playAll()">▶ 課文全文</button><button onclick="playFile('audio/kangxuan-b1-l2/歌曲_曲目22.mp3')">♫ 歌曲</button><button onclick="playFile('audio/kangxuan-b1-l2/伴唱_曲目23.mp3')">♬ 伴唱</button><button onclick="togglePause()">⏯ 暫停／繼續</button><button onclick="restart()">↺ 重新開始</button><button onclick="setRate(.75)">0.75×</button><button onclick="setRate(1)">1×</button><button onclick="setRate(1.25)">1.25×</button></div><section id="text" class="panel active"></section><section id="vocab" class="panel"><div class="vocab-grid" id="vg"></div></section><p class="note">點一般課文：播放該段。點紅色語詞：開啟語詞說明，不會同時播放整段。</p></div><audio id="audio"></audio><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box"><button class="close" onclick="closeModal()">×</button><h2 id="mt"></h2><div class="tl" id="mr"></div><p id="md"></p><button class="playbtn" id="mp">▶ 播放語詞</button></div></div><script>
const A='audio/kangxuan-b1-l2/';
const vocab=[['精神','tsing-sîn','睡醒。'],['津','tin','滴落。'],['贊聲','tsàn-siann','敲邊鼓、聲援。'],['定','tiānn','平靜、安定、穩定。'],['鬥陣','tàu-tīn','結伴、一起。'],['跤跡','kha-jiah','腳印、足跡。'],['相招','sio-tsio','彼此邀約。']];
const segs=[`咱的跤步比日頭較早精神<br>用喝聲共天叫予醒<br>汗水津佇青春的路裡<br>堅持　欲成功著堅持`,`這條路有你的陪伴<br>這條路有你的贊聲<br>予我袂孤單　予我的心愈定<br>青春美夢綴咱行`,`鬥陣拍拚<br>大步向前行<br>無論輸贏　攏有咱的跤跡`,`鬥陣拍拚<br>路著靠咱家己行<br>有你有我　啥物攏免驚惶`,`喔——<br>只要天公伯仔肯看顧<br>喔——<br>咱就相招共拚落去<br>大聲喝　衝衝衝<br>GO！GO！GO！`];
let rate=1,cur=-1;const au=document.getElementById('audio');function marked(s){vocab.forEach((v,i)=>s=s.replaceAll(v[0],`<span class="v" onclick="event.stopPropagation();showV(${i})">${v[0]}</span>`));return s}document.getElementById('text').innerHTML=segs.map((s,i)=>`<div class="seg" onclick="playSeg(${i})">${marked(s)}</div>`).join('');document.getElementById('vg').innerHTML=vocab.map((v,i)=>`<div class="card"><h3>${v[0]}</h3><div class="tl">${v[1]}</div><p>${v[2]}</p><button class="playbtn" onclick="playV(${i})">▶ 播放</button></div>`).join('');
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});function clear(){document.querySelectorAll('.seg').forEach(x=>x.classList.remove('playing'))}function playFile(src){cur=-1;clear();au.src=src;au.playbackRate=rate;au.play()}function playSeg(i){cur=i;clear();document.querySelectorAll('.seg')[i].classList.add('playing');playFileKeep(A+`lesson-${String(i+1).padStart(3,'0')}.mp3`)}function playFileKeep(src){au.src=src;au.playbackRate=rate;au.play()}function playAll(){cur=-1;clear();TWReadSequence.start(au,Array.from({length:5},(_,i)=>A+`lesson-${String(i+1).padStart(3,'0')}.mp3`),()=>rate,(i)=>{clear();const x=document.querySelectorAll('.seg')[i];if(x)x.classList.add('playing')},()=>clear())}function playV(i){playFile(A+`vocab-${String(i+1).padStart(2,'0')}.mp3`)}function showV(i){const v=vocab[i];mt.textContent=v[0];mr.textContent=v[1];md.textContent=v[2];mp.onclick=()=>playV(i);modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}function togglePause(){au.paused?au.play():au.pause()}function restart(){au.currentTime=0;au.play()}function setRate(r){rate=r;au.playbackRate=r}au.onended=()=>clear();
</script><script src="../shared/sequence-player.js"></script></body></html>
