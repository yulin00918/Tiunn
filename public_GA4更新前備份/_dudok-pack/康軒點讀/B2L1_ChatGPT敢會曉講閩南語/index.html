<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>康軒 B2L1｜ChatGPT 敢會曉講閩南語？</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#4d4438;background:linear-gradient(180deg,#f8f0df,#fbf7ef);min-height:100vh}.wrap{max-width:980px;margin:auto;padding:28px 18px 70px}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap}.tag{display:inline-flex;padding:7px 12px;border-radius:999px;background:#ead9bd;color:#765c3c;font-size:13px}h1{margin:10px 0 6px;font-size:clamp(27px,5vw,34px);letter-spacing:.05em}.muted{color:#877a69;font-size:14px}.tabs{display:flex;gap:8px;margin:18px 0}.tab{border:1px solid #e8dac2;background:#fffaf3;color:#4d4438;padding:10px 15px;border-radius:12px;cursor:pointer}.tab.on{background:#4d4438;color:#fff}.controls{position:sticky;top:8px;z-index:5;display:flex;flex-wrap:wrap;gap:9px;align-items:center;background:#fffaf1ee;border:1px solid #e8dac2;border-radius:16px;padding:12px;box-shadow:0 12px 34px #58432a14;margin-bottom:16px}.controls button,.controls select{border:1px solid #e8dac2;background:#fffaf3;color:#4d4438;padding:9px 12px;border-radius:10px}.controls .primary{background:#4d4438;color:white}.bar{height:6px;background:#efe4d2;border-radius:99px;overflow:hidden;flex:1;min-width:120px}.fill{height:100%;background:#b78652;width:0}.panel{background:#ffffffad;border:1px solid #e8dac2;border-radius:22px;padding:18px;box-shadow:0 12px 34px #58432a14}.seg{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:17px 14px;border-radius:15px;cursor:pointer;margin-bottom:6px;border:1px solid transparent}.seg:hover{background:#faf0df}.seg.playing{background:#fff1cf;border-color:#e8c88c}.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#f3e4cd;color:#7d5b37}.seg.playing .num{background:#b78652;color:#fff}.text{font-size:18px;line-height:2.05;letter-spacing:.02em}.vw{color:#b7642e;font-weight:700;text-decoration:underline dotted;cursor:pointer}.hint{font-size:12px;color:#877a69;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#ffffffb8;border:1px solid #e8dac2;border-radius:18px;padding:16px;display:grid;grid-template-columns:44px 1fr;gap:12px}.roman{color:#936f4b;margin-top:2px}.gloss{color:#877a69;margin-top:6px;line-height:1.65}.hidden{display:none}.status{margin-left:auto;color:#877a69;font-size:13px}@media(max-width:680px){.grid{grid-template-columns:1fr}.wrap{padding:20px 12px 60px}.panel{padding:10px}.seg{padding:14px 8px}.text{font-size:17px}.controls{top:4px}.status{width:100%;margin:0}}</style><meta name="author" content="張鈺聆"><meta name="copyright" content="© 張鈺聆"><script src="../../author-credit.js"></script></head><body><div class="wrap"><a href="../../台語點讀.dc.html" style="display:inline-block;margin-bottom:14px;color:#8f2035;font-weight:700;text-decoration:none;white-space:nowrap;">← 回台語點讀目錄</a><div class="head"><div><span class="tag">🎧 康軒版・第二冊</span><h1>第一課｜ChatGPT 敢會曉講閩南語？</h1><div class="muted">散文・段落式｜點段落播放；點彩色語詞查看解說。</div></div><div class="muted">正式出版社教材音檔</div></div><div class="tabs"><button class="tab on" data-tab="reading">📖 課文點讀</button><button class="tab" data-tab="vocab">🗣️ 語詞</button></div><section id="reading"><div class="controls"><button class="primary" id="all">▶ 全文連續播放</button><button id="full">🎙 出版社全文</button><button id="pause">⏸ 暫停</button><button id="restart">↺ 重新開始</button><label>速度 <select id="speed"><option>.75</option><option selected>1</option><option>1.25</option></select></label><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">尚未播放</div></div><div class="panel" id="segments"></div></section><section id="vocab" class="hidden"><div class="grid" id="vocabGrid"></div></section></div><script>const SEGMENTS=["你敢捌聽過ChatGPT？這是美國一間公司開發的開講機器人，你凡勢捌用華語抑是英語佮伊開講、共伊請教問題過，這就是這个軟體上厲害的功能——伊會用真自然的話語，講聽著誠合理的話，來參使用者對話。毋過，伊到底會曉講閩南語袂？若欲回答這个問題，咱愛先了解伊是按怎學會曉講話的。", "這款開講型的人工智慧，是予電腦去讀各種語言的文章，就親像咱人咧讀冊仝款，慢慢仔學習語言，所以伊需要讀足濟的資料，讀愈濟講了就愈好。總是，拄頭仔伊讀過的閩南語語料猶無夠濟，所以講袂啥輾轉。毋過，既然伊都已經會曉講華語矣，咱只要共ChatGPT安裝一个翻譯軟體，按呢就無問題囉！", "臺灣已經有大學的研究團隊，開發出閩南語翻譯軟體，加上原本的ChatGPT，做出會曉講閩南語的版本。猶毋過，這干焦是共ChatGPT的逐句話翻譯做閩南語爾爾，毋是伊真正咧講閩南語。紲落來，咱只要揣閣較濟閩南語文本來予伊吸收，就會當發明無需要翻譯、會曉家己講閩南語的人工智慧喔！"];const VOCAB=[["ChatGPT", "", "「聊天生成預訓練轉換器（Chat Generative Pre-trained Transformer）」的簡稱；教材說明為人工智慧聊天機器人程式。"], ["凡勢", "huān-sè", "也許、可能。"], ["拄頭仔", "tú-thâu-á", "一開始。"], ["袂啥輾轉", "bē siánn liàn-tńg", "不太流利。"], ["爾爾", "niā-niā", "而已。"], ["紲落來", "suà--lo̍h-lâi", "接下來、接著。"]];let audio=new Audio(),current=0,continuous=false;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=s=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const vocabSorted=VOCAB.map((v,i)=>({w:v[0],i})).filter(v=>v.w!=="ChatGPT").sort((a,b)=>b.w.length-a.w.length);function marked(text){let out='',i=0;while(i<text.length){let m=vocabSorted.find(v=>text.startsWith(v.w,i));if(m){out+=`<span class="vw" title="${esc(VOCAB[m.i][2])}">${esc(m.w)}</span>`;i+=m.w.length}else out+=esc(text[i++])}return out}function render(){segments.innerHTML=SEGMENTS.map((t,i)=>`<article class="seg" data-i="${i}"><div class="num">${i+1}</div><div><div class="text">${marked(t)}</div><div class="hint">🔊 點這一段播放出版社音檔</div></div></article>`).join('');$$('.seg').forEach(x=>x.onclick=()=>play(+x.dataset.i,false));vocabGrid.innerHTML=VOCAB.map((v,i)=>`<article class="card"><div class="num">${i+1}</div><div><div style="font-size:20px;font-weight:700">${esc(v[0])}</div><div class="roman">${esc(v[1])}</div><div class="gloss">${esc(v[2])}</div></div></article>`).join('')}function active(){ $$('.seg').forEach((x,i)=>x.classList.toggle('playing',i===current&&!audio.paused))}function play(i,cont){current=i;continuous=cont;audio.src=`audio/lesson-${String(i+1).padStart(3,'0')}.mp3`;audio.playbackRate=+speed.value;audio.play();status.textContent=`正在播放：第 ${i+1} 段`;active()}audio.ontimeupdate=()=>fill.style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+'%';audio.onended=()=>{active();fill.style.width='0';if(continuous&&current<SEGMENTS.length-1)play(current+1,true);else{continuous=false;status.textContent='播放完成'}};all.onclick=()=>play(current,true);full.onclick=()=>{continuous=false;audio.src='audio/publisher-full.mp3';audio.playbackRate=+speed.value;audio.play();status.textContent='正在播放：出版社全文';active()};pause.onclick=()=>{audio.paused?audio.play():audio.pause();status.textContent=audio.paused?'已暫停':'繼續播放';active()};restart.onclick=()=>play(0,false);speed.onchange=()=>audio.playbackRate=+speed.value;$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');reading.classList.toggle('hidden',b.dataset.tab!=='reading');vocab.classList.toggle('hidden',b.dataset.tab!=='vocab')});render();</script></body></html>
