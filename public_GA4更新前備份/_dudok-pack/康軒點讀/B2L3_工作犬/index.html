*{box-sizing:border-box}body{margin:0;background:#f6f0e4;color:#3c342c;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px}.head{background:#fffaf0;border:1px solid #e2d5bd;border-radius:22px;padding:22px 26px;box-shadow:0 6px 24px #59451e12}.eyebrow{color:#8a6b3e;font-weight:700}.head h1{margin:5px 0 4px;font-size:clamp(28px,5vw,46px)}.author{color:#756b60}.types{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.type{background:#f1e5cf;border:1px solid #dfcfb2;border-radius:999px;padding:7px 12px;font-weight:700}.controls{position:sticky;top:8px;z-index:5;display:flex;gap:9px;flex-wrap:wrap;margin:18px 0;background:#fffaf1ee;border:1px solid #e2d5bd;border-radius:16px;padding:12px}.controls button{border:0;border-radius:999px;padding:10px 15px;background:#e9dfcc;color:#493d30;font-weight:700;cursor:pointer}.controls .primary{background:#536b55;color:#fff}.seg{background:#fffdf8;border:1px solid #e6dac4;border-radius:18px;padding:18px 20px;margin:12px 0;line-height:2;font-size:clamp(18px,2.3vw,23px);cursor:pointer}.seg.playing{outline:3px solid #9caf92}.dog{font-size:14px;font-weight:800;color:#7b603c;margin-bottom:5px}.intro,.outro{background:#fbf5e9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{color:#766c61;font-size:14px}.credit{margin-top:24px;color:#8a7d6d;font-size:12px;text-align:right}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.seg{padding:15px}.head{padding:18px}}

bList" id="officialVocabList"></div></section><div id="officialModal"></div><p class="note">點選任一卡即可播放。分類卡依課文本身的介紹結構呈現，不依 PPT 跨頁位置硬切。</p><div class="credit">網站介面與教學整合設計／製作：張鈺聆</div></div><audio id="audio"></audio><script>
const A='audio/kangxuan-b2-l3/';
const segs=[
['前言',`人佮狗的關係真密切，因為狗真古錐、真死忠，所以定定有人飼來做伴、顧厝。有的狗經過專業的訓練嘛會當鬥做工課、出任務，𪜶是人類的好助手，咱愛感謝𪜶的陪伴佮付出！<br><br>下面咱就來熟似遮的「工作犬」：`,'intro'],
['🐕 警犬／警用狗',`鼻仔誠利，冷靜定著。會當搜揣毒品佮炸彈，幫贊警察的工課。`,''],
['🦺 搜救犬',`跤手扭掠、𠢕鼻氣味，會當佇危險的現場𬦰懸𬦰低、軁來軁去鬥揣人，爭取時間來搶救性命。`,''],
['🦮 導盲犬（目金狗）',`會曉觀察環境，共目睭看袂著的人𤆬路，幫助𪜶閃開擋路的物件，予𪜶會當安心仔行出外。`,''],
['🧳 檢疫犬',`鼻仔足利的好鼻獅。佇機場檢查旅客的行李、國外的包裹，看敢有人紮果子、菜蔬、肉類遮的違禁品。`,''],
['💛 治療犬',`個性溫馴有耐心。會當陪伴特別需要安搭的學生上課；陪老人做復健；安慰病人，予人感受著溫暖佮愛。`,''],
['結語｜出任務的時陣',`工作犬愛經過真嚴格、長時間的訓練，通過考試了後才會當出來做工課。𪜶咧出任務的時陣需要專心，咱千萬毋通共𪜶攪吵喔！`,'outro']
];
let rate=1,seq=false,idx=0;const au=document.getElementById('audio'),text=document.getElementById('text');

</script><script id="official-vocab-module">const OFFICIAL_VOCAB=[["利", "lāi", "形容五官的能力很敏銳。"], ["定著", "tiānn-tio̍h", "形容個性穩重。"], ["搜揣", "tshiau-tshuē", "到處搜索尋找。"], ["幫贊", "pang-tsān", "幫忙、幫助。"], ["扭掠", "liú-lia̍h", "手腳俐落、動作敏捷。"], ["軁", "nǹg", "穿過、鑽。"], ["𤆬路", "tshuā-lōo", "帶路。"], ["溫馴", "un-sûn", "溫和順從。"], ["安搭", "an-tah", "安撫、安慰。"], ["攪吵", "kiáu-tshá", "打擾。"]];const VS=OFFICIAL_VOCAB.map((v,i)=>({w:v[0],i})).sort((a,b)=>b.w.length-a.w.length);function markV(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.nodeValue.trim()||n.parentElement.closest('script,style,button,.vocabBox,.modal'))return NodeFilter.FILTER_REJECT;return VS.some(v=>n.nodeValue.includes(v.w))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}}),ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{let s=n.nodeValue,f=document.createDocumentFragment(),p=0;while(p<s.length){let h=null,a=s.length;for(const v of VS){let j=s.indexOf(v.w,p);if(j>=0&&(j<a||(j===a&&(!h||v.w.length>h.w.length)))){h=v;a=j}}if(!h){f.append(s.slice(p));break}if(a>p)f.append(s.slice(p,a));let x=document.createElement('span');x.className='vw';x.dataset.v=h.i;x.textContent=h.w;f.append(x);p=a+h.w.length}n.replaceWith(f)})}function openV(i){const v=OFFICIAL_VOCAB[i],r=document.getElementById('officialModal');r.innerHTML='<div class="modal"><article class="modalCard"><button class="modalClose">關閉</button><div class="modalWord">'+v[0]+'</div><div class="modalRoman">'+v[1]+'</div><div class="modalGloss">'+v[2]+'</div></article></div>';const m=r.querySelector('.modal');m.onclick=e=>{if(e.target===m||e.target.classList.contains('modalClose'))r.innerHTML=''}}function initV(){const r=document.querySelector('main')||document.getElementById('text');if(r)markV(r);document.querySelectorAll('.vw').forEach(x=>x.onclick=e=>{e.stopPropagation();openV(+x.dataset.v)});const b=document.getElementById('officialVocabList');if(b){b.innerHTML=OFFICIAL_VOCAB.map((v,i)=>'<button class="vocabChip" data-vb="'+i+'">'+v[0]+'</button>').join('');b.querySelectorAll('[data-vb]').forEach(x=>x.onclick=()=>openV(+x.dataset.vb))}}setTimeout(initV,0);</script></body></html>
