<p class="note">保留現代詩的分段與行句，不整理成散文；黃色虛線詞可查看音讀與註解。</p><article class="stanza" data-i="0"><div class="stanzahead"><span>第 1 段｜灶跤起火</span><button class="play">▶</button></div><div class="verse"><div><button class="vocab" data-v="大灶">大灶</button><button class="vocab" data-v="燃">燃</button>柴</div><div><button class="vocab" data-v="鰇魚">鰇魚</button>蝦米紅蔥頭<button class="vocab" data-v="精肉">精肉</button></div><div><button class="vocab" data-v="同齊">同齊</button>落鼎</div><div>炒一鼎好食</div></div></article><article class="stanza" data-i="1"><div class="stanzahead"><span>第 2 段｜割稻仔飯的菜色</span><button class="play">▶</button></div><div class="verse"><div><button class="vocab" data-v="菜脯">菜脯</button>炒卵</div><div>豬血煮<button class="vocab" data-v="鹹菜">鹹菜</button>湯</div><div>虱目魚煮<button class="vocab" data-v="瓜仔瓤">瓜仔瓤</button></div><div>排骨<button class="vocab" data-v="炕">炕</button>筍仔湯</div></div></article><article class="stanza" data-i="2"><div class="stanzahead"><span>第 3 段｜擔去田中央</span><button class="play">▶</button></div><div class="verse"><div>用<button class="vocab" data-v="扁擔">扁擔</button>擔去<button class="vocab" data-v="田園">田園</button></div><div>用<button class="vocab" data-v="碗公">碗公</button>貯飯</div><div>用<button class="vocab" data-v="碗公">碗公</button>啉湯</div></div></article><article class="stanza" data-i="3"><div class="stanzahead"><span>第 4 段｜食的是飯，也是情義</span><button class="play">▶</button></div><div class="verse"><div>布袋　<button class="vocab" data-v="摔桶">摔桶</button>　割稻仔人</div><div>飯粒內底有<button class="vocab" data-v="稻芳">稻芳</button></div><div>規擔食甲空空空</div></div></article>
