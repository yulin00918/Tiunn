<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真平 B2L1｜布袋戲尪仔</title><style>
:root{--paper:#f6f0e4;--card:#fffdf8;--ink:#263532;--green:#536b55;--line:#d9d1c3;--gold:#9a7740}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}.wrap{max-width:880px;margin:auto;padding:18px 18px 72px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.back{color:var(--green);font-weight:800;text-decoration:none}.tag{background:#ebe4d6;padding:7px 12px;border-radius:999px}.hero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;margin:16px 0}h1{font-size:clamp(32px,5vw,48px);margin:5px 0}.sub,.note{color:#6e746d}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:999px;padding:10px 15px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#e9e4d9;color:var(--ink)}.stanza{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 24px;margin:14px 0}.stanza.active{outline:3px solid #aebba8}.stanzahead{display:flex;justify-content:space-between;align-items:center;color:var(--green);font-weight:900;font-size:14px}.play{width:42px;height:42px;padding:0}.verse{text-align:center;font-size:25px;line-height:2.05;letter-spacing:.04em;padding:8px 0}.vocab{display:inline;border:0;border-bottom:2px dotted var(--gold);border-radius:0;padding:0 2px;background:#fff3ce;color:inherit;font:inherit;font-weight:800}dialog{border:0;border-radius:22px;padding:0;max-width:min(520px,90vw);box-shadow:0 24px 70px #0005}dialog::backdrop{background:#26353266}.modal{padding:24px 26px;background:var(--card)}.modal h2{margin:0 0 7px;color:var(--green)}.roman{font-size:18px;color:#755b35;font-weight:800;margin:8px 0 14px}.meaning{font-size:18px;line-height:1.75}footer{text-align:center;color:#777166;font-size:13px;margin-top:30px;line-height:1.8}@media(max-width:640px){.verse{font-size:21px}}</style></head><body><main class="wrap">
<div class="top"><a class="back" href="../../台語點讀.dc.html">← 回「台語點讀」</a><span class="tag">真平｜第二冊｜第一課</span></div><section class="hero"><div class="sub">咱來讀課文｜現代詩式</div><h1>布袋戲尪仔</h1><div class="sub">作者：李勤岸</div><div class="controls"><button id="all">▶ 全文順序播放</button><button class="secondary" id="pause">Ⅱ 暫停</button><button class="secondary" id="restart">↺ 重頭</button><button class="secondary" id="speed">1.0×</button></div></section>
<p class="note">依原課文三段詩行呈現，不整理成散文；黃色虛線詞可查看音讀與註解。</p><article class="stanza" data-i="0"><div class="stanzahead"><span>第 1 段｜有聲有影的尪仔</span><button class="play">▶</button></div><div class="verse"><div>行路有風</div><div>講話生動</div><div>會走會<button class="vocab" data-v="傱">傱</button></div><div>毋但有武功</div><div>嘛會吐<button class="vocab" data-v="劍光">劍光</button></div></div></article><article class="stanza" data-i="1"><div class="stanzahead"><span>第 2 段｜玄機佇人的手佮聲</span><button class="play">▶</button></div><div class="verse"><div>一切全是<button class="vocab" data-v="膨風">膨風</button></div><div>其實無半項<button class="vocab" data-v="精傱">精傱</button></div><div>人手若莫弄</div><div>人聲若莫講</div></div></article><article class="stanza" data-i="2"><div class="stanzahead"><span>第 3 段｜無人操弄就消風</span><button class="play">▶</button></div><div class="verse"><div>一身一身戇戇</div><div><button class="vocab" data-v="無聲無說">無聲無說</button></div><div><button class="vocab" data-v="消風">消風</button><button class="vocab" data-v="消風">消風</button></div></div></article>

const files=["audio/jenpin-b2-l1/lesson-001.mp3", "audio/jenpin-b2-l1/lesson-002.mp3", "audio/jenpin-b2-l1/lesson-003.mp3"];const vocab={"傱": ["tsông", "奔跑、疾行。"], "劍光": ["kiàm-kng", "劍所發出的光芒；課文描寫布袋戲的武打效果。"], "膨風": ["phòng-hong", "吹牛。誇口說大話。"], "精傱": ["tsing-tsông", "精明成器。"], "無聲無說": ["bô-siann-bô-sueh", "沒有聲音、安靜無聲。"], "消風": ["siau-hong", "洩氣、扁平；課文用來形容戲偶失去操弄與配音後沒有生命力的樣子。"]};const audio=document.querySelector('#audio'),cards=[...document.querySelectorAll('.stanza')];let rate=1,seq=false,idx=0;function mark(i){cards.forEach((c,n)=>c.classList.toggle('active',n===i))}function play(i){seq=false;idx=i;mark(i);audio.src=files[i];audio.playbackRate=rate;audio.play()}cards.forEach((c,i)=>c.querySelector('.play').onclick=()=>play(i));all.onclick=()=>{seq=true;idx=0;mark(0);audio.src=files[0];audio.playbackRate=rate;audio.play()};audio.onended=()=>{if(seq&&++idx<files.length){mark(idx);audio.src=files[idx];audio.playbackRate=rate;audio.play()}else{seq=false;cards.forEach(c=>c.classList.remove('active'))}};pause.onclick=()=>audio.paused?audio.play():audio.pause();restart.onclick=()=>{audio.pause();seq=true;idx=0;mark(0);audio.src=files[0];audio.playbackRate=rate;audio.play()};speed.onclick=e=>{rate=rate===1?.8:rate===.8?1.2:1;e.target.textContent=rate.toFixed(1)+'×';audio.playbackRate=rate};const dlg=document.querySelector('#dlg');document.querySelectorAll('.vocab').forEach(b=>b.onclick=e=>{e.stopPropagation();const d=vocab[b.dataset.v];dw.textContent=b.dataset.v;dr.textContent=d[0];dm.textContent=d[1];dlg.showModal()});close.onclick=()=>dlg.close();dlg.onclick=e=>{if(e.target===dlg)dlg.close()};
</script></body></html>
