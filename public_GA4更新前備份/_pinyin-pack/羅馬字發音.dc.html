<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<meta name="author" content="張鈺聆">
<meta name="copyright" content="© 張鈺聆">
<script src="./author-credit.js"></script>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  a{color:inherit;text-decoration:none;}
  .tl-wrap,.tl-wrap *{box-sizing:border-box;}
  @media(hover:hover){
    .tl-home:hover{background:rgba(255,255,255,.18) !important;}
    .tl-tab:hover{border-color:#9db6ba !important;}
  }
</style>
</helmet>
<div class="tl-wrap" style="font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;color:#243337;min-height:100vh;background:#F5F3EE;">

  <div style="background:#315C63;color:#fff;">
    <div style="max-width:1080px;margin:auto;min-height:66px;padding:12px 22px;display:flex;align-items:center;gap:14px;">
      <a class="tl-home" href="首頁.dc.html" style="flex:0 0 auto;display:inline-flex;align-items:center;min-height:44px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.12);color:#e3eeef;font-size:14px;font-weight:800;white-space:nowrap;">🏠 回首頁</a>
      <div style="min-width:0;text-align:center;flex:1;">
        <div style="font-size:clamp(19px,3.4vw,22px);font-weight:900;letter-spacing:.08em;line-height:1.35;">🎵 臺羅練功房</div>
        <div style="margin-top:3px;font-size:12.5px;color:#a9c4c7;font-weight:700;line-height:1.5;">建立正確拼音基礎，提升發音準確度</div>
      </div>
      <div style="flex:0 0 auto;width:104px;"></div>
    </div>
  </div>

  <div style="position:relative;background:linear-gradient(100deg,#FDF6E3,#F3EFE4 68%,#EDF2EF);border-bottom:1px solid #e6ded0;overflow:hidden;">
    <div style="max-width:1080px;margin:auto;padding:16px 22px 20px;display:flex;align-items:center;gap:14px;position:relative;z-index:1;">
      <span style="flex:0 0 auto;font-size:24px;transform:rotate(-8deg);">🔤</span>
      <div style="background:#FFFEFA;border:1px solid #e6ded0;border-radius:16px 16px 16px 4px;padding:11px 16px;box-shadow:0 5px 14px rgba(49,92,99,.07);">
        <div style="font-size:11.5px;font-weight:900;letter-spacing:.14em;color:#8a7a52;">今日練功</div>
        <div style="margin-top:4px;font-size:14.5px;font-weight:800;color:#5c5a45;line-height:1.6;">揀一項開始：先看拼音系統，抑是直接練組合。</div>
      </div>
    </div>
    <svg viewBox="0 0 1440 16" preserveAspectRatio="none" style="position:absolute;left:0;right:0;bottom:-1px;width:100%;height:16px;display:block;"><path d="M0,10 C240,2 480,15 720,8 C960,2 1200,14 1440,7 L1440,16 L0,16 Z" fill="#F5F3EE"></path></svg>
  </div>

  <main style="max-width:1080px;margin:auto;padding:22px 22px 0;">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:20px;">
      <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="2">
        <button class="tl-tab" style="{{tab.btnStyle}}" onClick="{{tab.onClick}}">
          <span style="display:flex;align-items:center;gap:11px;">
            <span style="font-size:26px;line-height:1;">{{tab.icon}}</span>
            <span style="text-align:left;min-width:0;">
              <span style="display:block;font-size:16.5px;font-weight:900;line-height:1.3;">{{tab.label}}</span>
              <span style="display:block;margin-top:3px;font-size:12.5px;font-weight:700;opacity:.78;line-height:1.5;">{{tab.hint}}</span>
            </span>
          </span>
        </button>
      </sc-for>
    </div>

    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="2">
      <sc-if value="{{tab.activeCombo}}">
        <dc-import name="羅馬字組合練習" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{tab.activeSystem}}">
        <dc-import name="台語羅馬字拼音系統" hint-size="100%,900px"></dc-import>
      </sc-if>
    </sc-for>
  </main>

  <div style="max-width:1080px;margin:22px auto 0;padding:0 22px 34px;font-size:12px;color:#8f9b9c;font-weight:700;text-align:center;">
    <span style="color:#6f7d7f;">張鈺聆 製</span>｜鈺聆上台語課
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { activeTab: 0 };
  renderVals() {
    const data = [
      { label: '台語羅馬字拼音系統', icon: '📖', hint: '聲母・韻母・聲調對照複習', isSystem: true, isCombo: false },
      { label: '台語拼音練習', icon: '🎧', hint: '聲母＋韻母＋聲調拼看覓', placeholder: '在此貼上羅馬字組合練習內容', isCombo: true },
    ];
    const tabs = data.map((d, i) => {
      const active = i === this.state.activeTab;
      return {
        ...d,
        active,
        activeCombo: active && d.isCombo,
        activeSystem: active && d.isSystem,
        onClick: () => this.setState({ activeTab: i }),
        btnStyle: `display:flex;align-items:center;padding:16px 18px;border-radius:20px;border:2px solid ${active ? '#315C63' : '#e4dece'};font-family:inherit;cursor:pointer;min-height:76px;text-align:left;transition:.16s ease;background:${active ? '#315C63' : '#FFFEFA'};color:${active ? '#fff' : '#4d6367'};box-shadow:${active ? '0 10px 22px rgba(49,92,99,.18)' : '0 6px 16px rgba(49,92,99,.06)'};`,
      };
    });
    return { tabs };
  }
}

</script>
</body>
</html>
