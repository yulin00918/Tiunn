*{box-sizing:border-box}body{margin:0;background:#f6f0e4;color:#3c342c;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px}.head{background:#fffaf0;border:1px solid #e2d5bd;border-radius:22px;padding:22px 26px;box-shadow:0 6px 24px #59451e12}.eyebrow{color:#8a6b3e;font-weight:700}.head h1{margin:5px 0 4px;font-size:clamp(28px,5vw,46px)}.author{color:#756b60}.tabs,.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tabs button,.controls button,.playbtn{border:0;border-radius:999px;padding:10px 16px;background:#e9dfcc;color:#493d30;font-weight:700;cursor:pointer}.tabs button.active,.controls button.primary{background:#536b55;color:white}.panel{display:none}.panel.active{display:block}.seg{background:#fffdf8;border:1px solid #e6dac4;border-radius:18px;padding:18px 20px;margin:12px 0;line-height:2;font-size:clamp(18px,2.3vw,24px);cursor:pointer}.seg.playing{outline:3px solid #9caf92}.v{color:#a24736;font-weight:800;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:5px;cursor:pointer}.vocab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:#fffdf8;border:1px solid #e6dac4;border-radius:18px;padding:18px}.card h3{margin:0 0 4px;color:#8b4637}.tl{color:#58705c;font-weight:700}.note{color:#766c61;font-size:14px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fffaf0;border-radius:20px;padding:22px;max-width:440px;width:100%}.box h2{margin-top:0;color:#8b4637}.close{float:right;border:0;background:none;font-size:26px;cursor:pointer}@media(max-width:600px){.wrap{padding:12px}.seg{padding:15px}.head{padding:18px}}

</head><body><div class="wrap"><a href="../../台語點讀.dc.html" style="display:inline-block;margin-bottom:14px;color:#8f2035;font-weight:700;text-decoration:none;white-space:nowrap;">← 回台語點讀目錄</a><section class="head"><div class="eyebrow">康軒版・第一冊</div><h1>第三課｜真珠奶茶</h1><div class="author">作者：王秀容</div></section><div class="tabs"><button class="active" data-tab="text">課文點讀</button><button data-tab="vocab">語詞點讀</button></div><div class="controls"><button class="primary" onclick="playAll()">▶ 課文全文</button><button onclick="togglePause()">⏯ 暫停／繼續</button><button onclick="restart()">↺ 重新開始</button><button onclick="setRate(.75)">0.75×</button><button onclick="setRate(1)">1×</button><button onclick="setRate(1.25)">1.25×</button></div><section id="text" class="panel active"></section><section id="vocab" class="panel"><div class="vocab-grid" id="vg"></div></section><p class="note">點一般課文：播放該段。點紅色語詞：開啟語詞說明，不會同時播放整段。</p></div><audio id="audio"></audio><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box"><button class="close" onclick="closeModal()">×</button><h2 id="mt"></h2><div class="tl" id="mr"></div><p id="md"></p><button class="playbtn" id="mp">▶ 播放語詞</button></div></div><script>
const A='audio/kangxuan-b1-l3/';
const vocab=[['脾土開','pî-thóo-khui','胃口大開。'],['心花開','sim-hue-khui','心花怒放、心情愉悅。'],['濫','lām','摻。混合、摻雜。'],['真珠','tsin-tsu','珍珠。'],['仝宗','kāng-tsong','同一個祖先或來源。'],['四序','sù-sī','讓人覺得舒服安適的感覺。'],['搖摵杯','iô-tshik-pue','摵，上下用力搖晃；搖摵杯也稱雪克杯，調製飲品專用。'],['起童','khí-tâng','起乩。'],['起泡','khí-pho','液體表面出現小泡沫。'],['欶','suh','吸。'],['水雞仔','tsuí-ke-á','青蛙。'],['彼改','hit kái','那一次。'],['定著','tiānn-tio̍h','一定。']];
const segs=[`佮阿母去臺南拜拜閣食東食西，有夠歡喜。燒的好滋味，冷的食著心涼脾土開。有一味予阿母心花開，就是滑溜滑溜的真珠奶茶。`,`阿母笑講：「啊都牛奶茶濫粉圓。」<br>「是啊！真珠佮粉圓仔仝宗的。」`,`粉圓按怎濫攏四序，熱天濫礤冰足清涼，寒天摻燒仙草上溫暖！哪會變「真珠」？古早頭家共牛奶茶佮粉圓仔貯入去搖摵杯，搖咧，摵咧，袂輸起童，搖甲起泡上好啉。`,`後來就做一身機器尪仔鬥摵，若咧跳舞。接過來，欶一喙，粉圓仔就若坐電梯仝款，隨粒仔滑入來我的喙裡跳舞。`,`捌有人共號做「水雞仔卵」，毋過猶是「真珠」得人疼。阮同學對美國轉來，講伊行過千山萬水猶是上思念這味。`,`彼改拜拜，阮查某囝有去求文昌帝君保庇伊考大學。阮有轉去說多謝，才知伊欲請神明啉真珠奶茶！`,`神定著知影伊拍拚的志氣若真珠遐寶貴，伊的誠意若粉圓仔遐古錐，連神明啉著嘛心花開！`];
let rate=1,cur=-1;const au=document.getElementById('audio');function marked(s){vocab.forEach((v,i)=>s=s.replaceAll(v[0],`<span class="v" onclick="event.stopPropagation();showV(${i})">${v[0]}</span>`));return s}document.getElementById('text').innerHTML=segs.map((s,i)=>`<div class="seg" onclick="playSeg(${i})">${marked(s)}</div>`).join('');document.getElementById('vg').innerHTML=vocab.map((v,i)=>`<div class="card"><h3>${v[0]}</h3><div class="tl">${v[1]}</div><p>${v[2]}</p><button class="playbtn" onclick="playV(${i})">▶ 播放</button></div>`).join('');
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});function clear(){document.querySelectorAll('.seg').forEach(x=>x.classList.remove('playing'))}function playFile(src){cur=-1;clear();au.src=src;au.playbackRate=rate;au.play()}function playSeg(i){cur=i;clear();document.querySelectorAll('.seg')[i].classList.add('playing');playFileKeep(A+`lesson-${String(i+1).padStart(3,'0')}.mp3`)}function playFileKeep(src){au.src=src;au.playbackRate=rate;au.play()}function playAll(){cur=-1;clear();TWReadSequence.start(au,Array.from({length:7},(_,i)=>A+`lesson-${String(i+1).padStart(3,'0')}.mp3`),()=>rate,(i)=>{clear();const x=document.querySelectorAll('.seg')[i];if(x)x.classList.add('playing')},()=>clear())}function playV(i){playFile(A+`vocab-${String(i+1).padStart(2,'0')}.mp3`)}function showV(i){const v=vocab[i];mt.textContent=v[0];mr.textContent=v[1];md.textContent=v[2];mp.onclick=()=>playV(i);modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}function togglePause(){au.paused?au.play():au.pause()}function restart(){au.currentTime=0;au.play()}function setRate(r){rate=r;au.playbackRate=r}au.onended=()=>clear();
</script><script src="../shared/sequence-player.js"></script></body></html>
