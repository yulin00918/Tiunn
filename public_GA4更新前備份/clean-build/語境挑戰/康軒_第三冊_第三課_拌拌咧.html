 "這是教材的例句。"}, {"word": "走傱", "q": "阿爸為著規家伙仔，逐工咧外口＿＿＿＿。", "opts": ["走傱", "拌拌咧", "褪赤跤"], "ans": 0, "hint": "是奔波忙碌。", "explain": "「走傱」用來形容為生活四處奔波。"}, {"word": "褪赤跤", "q": "歇熱去海邊，囡仔攏愛＿＿＿＿耍水。", "opts": ["褪赤跤", "起毛䆀", "拭拭咧"], "ans": 0, "hint": "海邊玩水常常無穿鞋。", "explain": "「褪赤跤」是打赤腳。"}, {"word": "逐", "q": "你走傷緊矣，我攏＿＿＿＿袂著。", "opts": ["逐", "撫撫咧", "一片"], "ans": 0, "hint": "我要追你。", "explain": "「逐」就是追趕。"}], "reading": [{"q": "歌詞講「若是跋倒矣，就共伊當做𨑨迌」，主要欲表達：", "opts": ["遇到挫折毋免過度責怪家己", "跋倒真趣味所以愛故意跋", "毋通閣徛起來"], "ans": 0, "hint": "後面歌詞會講「閣徛起來」。", "explain": "歌詞把跌倒當成玩耍，鼓勵人放鬆心情再重新開始。"}, {"q": "「拌拌咧、免起毛䆀、毋免怨嘆、閣徛起來」傳達啥物精神？", "opts": ["失敗後整理心情再重新出發", "生氣就好", "一定愛贏"], "ans": 0, "hint": "核心是「閣徛起來」。", "explain": "歌詞鼓勵人在跌倒、挫折後重新站起來。"}, {"q": "「時間佮我咧逐走傱，機會佮我咧覕相揣」是在形容：", "opts": ["生活忙碌、追逐時間佮機會", "真正咧玩遊戲", "完全無壓力"], "ans": 0, "hint": "這是大人生活的感覺。", "explain": "用追趕與捉迷藏比喻生活中的忙碌與機會難掌握。"}, {"q": "「目屎拭拭咧，頭殼撫撫咧，重來」上接近：", "opts": ["安慰家己，準備重新開始", "叫別人代替", "直接放棄"], "ans": 0, "hint": "歌詞最後是「重來」。", "explain": "這句將安撫孩子的動作轉化成大人自我安慰與再出發。"}, {"q": "教材認為「拌拌咧」對大人有啥物意義？", "opts": ["𤆬大人轉去囡仔時代，遇失敗歇一下閣重新開始", "叫大人一直玩", "叫大人毋通做事"], "ans": 0, "hint": "教材賞析有直接說明。", "explain": "教材指出「拌拌咧」帶大人回到童年世界，提醒失敗後可休息再重新開始。"}, {"q": "根據歌詞，人若跋倒矣會當按怎？", "opts": ["轉去心內的所在、當做𨑨迌、目屎拭了閣徛起來", "一直怨嘆", "完全無做啥"], "ans": 0, "hint": "教材選擇題答案是「以上攏是」。", "explain": "歌詞提供休息、放空、擦乾眼淚並再站起來的方式。"}, {"q": "「我心內有一个所在」較適合理解做：", "opts": ["內心會使休息、放鬆的角落", "真實地址", "學校教室"], "ans": 0, "hint": "歌詞後面有大海、水田、無煩無惱。", "explain": "這是心靈上暫時停歇、放空的想像空間。"}, {"q": "整首歌最核心的主題是：", "opts": ["面對挫折、整理情緒、重新出發", "介紹農田", "介紹海洋生物"], "ans": 0, "hint": "教材閱讀理解與賞析都集中在這个方向。", "explain": "歌詞以童年語彙安慰面對挫折的大人，鼓勵重新開始。"}], "comprehensive": [{"q": "「起毛婸」和「起毛䆀」的關係是：", "opts": ["一個心情好、一個心情歹", "攏是心情歹", "攏是心情好"], "ans": 0, "hint": "教材有列反義詞。", "explain": "「起毛婸」是情緒好，「起毛䆀」是不爽、不高興。"}, {"q": "考試無考好，心情「鬱卒」，同學較適合按怎鼓勵？", "opts": ["毋通因為一時失敗就失志", "你一定無才調", "毋免閣讀冊"], "ans": 0, "hint": "教材情境題有相同句子。", "explain": "教材用「鬱卒、失志」描寫考差後的心情與鼓勵。"}, {"q": "上台比賽進前「緊張甲咇咇掣」，較適合：", "opts": ["放較輕鬆、調整心情", "起毛䆀", "直接走"], "ans": 0, "hint": function renderMood(){let m=moods[mi];$("moodCase").textContent=m[0];$("moodChoices").innerHTML=sh(m[3]).map(x=>`<button class="pick" onclick="chooseMood('${x}')">${x}</button>`).join("");$("moodStatus").textContent="先選一个上符合的情緒詞。"}
window.chooseMood=x=>{let m=moods[mi];$("moodStatus").innerHTML=x===m[1]?`✅ 著矣！<b>${m[1]}</b><br>可以按呢調整：${m[2]}`:`🤔 閣想看覓。這个情境較接近「${m[1]}」。`}
$("activityBtn").onclick=()=>{mi=0;show("activity");renderMood()};$("nextMood").onclick=()=>{mi=(mi+1)%moods.length;renderMood()};$("activityHome").onclick=()=>show("lesson");
</script></body></html>
