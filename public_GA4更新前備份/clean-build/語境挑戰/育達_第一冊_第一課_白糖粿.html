, "q": "請照課文內容排出較合理的敘事順序。", "items": ["介紹七娘媽傳說", "說明古早製作方法", "作者回臺南買白糖粿", "結尾再咬一喙故鄉滋味"], "answer": ["作者回臺南買白糖粿", "介紹七娘媽傳說", "說明古早製作方法", "結尾再咬一喙故鄉滋味"], "hint": "想想文章是先從作者自己的經驗出發。", "explain": "教材分析指出作者先從自身經驗出發，再介紹由來與製作過程。"}, {"type": "choice", "title": "白糖粿的變化", "q": "白糖粿落尾成做臺灣南部特殊的啥物？", "opts": ["喙食物仔", "交通工具", "樂器"], "ans": 0, "hint": "課文講的是食物文化。", "explain": "課文說白糖粿後來成為臺灣南部特殊的點心。"}, {"type": "choice", "title": "描寫白糖粿", "q": "課文用「白phau-phau、幼麵麵」主要是在描寫白糖粿的啥物？", "opts": ["外觀佮質感", "價錢", "店的位置"], "ans": 0, "hint": "這兩个詞攏是在講看起來、食起來的感覺。", "explain": "這是在描寫白糖粿白白、嫩嫩的外觀與質感。"}, {"type": "choice", "title": "作者寫法", "q": "作者用姑娘仔穿新衫來比喻滒著塗豆糖粉的白糖粿，主要欲表現啥物？", "opts": ["白糖粿真媠、予人意愛", "白糖粿真貴", "白糖粿真鹹"], "ans": 0, "hint": "課文寫「幼秀的姑娘仔，穿一領媠噹噹的新衫仝款」。", "explain": "這个比喻是欲表現白糖粿裹粉後的美感與可愛。"}], "comprehensive": [{"type": "choice", "title": "料理動詞", "q": "「阿爸定定講＿＿魚仔的時，火若傷猛會臭火焦。」空格上適合啥物？", "opts": ["煎", "炊", "貯", "浸"], "ans": 0, "hint": "這是用少量的油乾煮食物。", "explain": "教材解釋「煎」是用少量的油乾煮食物。"}, {"type": "choice", "title": "料理動詞", "q": "「自細漢，阮阿媽攏會講豬跤著愛＿＿予爛爛才好食。」上適合啥物？", "opts": ["炒", "乍", "𤉙", "煏"], "ans": 2, "hint": "豬跤欲煮予爛，需要佇水內底長時間熬煮。", "explain": "教材題目以「𤉙」作為長時間熬煮的適合動詞。"}, {"type": "choice", "title": "烹調方式", "q": "用隔水加熱的方法共食物蒸熟，台語教材內底用佗一个動詞？", "opts": ["炊", "煎", "滷", "乍"], "ans": 0, "hint": "教材例子有炊包仔、炊便當、炊菜頭粿。", "explain": "「炊」是以隔水加熱的方法把食物蒸熟。"}, {"type": "choice", "title": "烹調方式", "q": "用少量的油為底，共食物佇鍋仔內底翻攪到熟，是：", "opts": ["炒", "浸", "貯", "揤"], "ans": 0, "hint": "教材例子有炒米粉、炒飯。", "explain": "「炒」是以少量的油翻攪到熟。"}, {"type": "choice", "title": "烹調方式", "q": "把食物放入滾水、無加其他佐料來煮，教材用佗一个動詞？", "opts": ["煠", "煎", "滒", "搙"], "ans": 0, "hint": "教材例子有煠麵、煠青菜。", "explain": "「煠」是以白水煮，把食物放入滾水煮熟。"}, {"type": "choice", "title": "俗語理解", "q": "「食少有滋味，食濟無趣味」主要欲提醒咱啥物？", "opts": ["食物愈濟愈好", "任何代誌愛適量，避免過與不及", "毋通食粿"], "ans": 1, "hint": "教材解釋有提著「恰到好處」。", "explain": "教材說明享受美食要適量，也引申事情要恰到好處。"}, {"type": "choice", "title": "俗語理解", "q": "「頂港有名聲，下港上出名」是咧形容：", "opts": ["聲名遠播、遠近馳名", "天氣真熱", "物件真便宜"], "ans": 0, "hint": "教材內底是用來講名氣。", "explain": "教材 reflect()">送出</button></div>`}else{h+=`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" onclick="choose(${k},this)">${String.fromCharCode(65+k)}｜${o}</button>`).join('')}</div>`}h+='<div id="feedback"></div>';$('qcard').innerHTML=h}function fb(cls,t,next=false){$('feedback').innerHTML=`<div class="fb ${cls}">${t}</div>${next?'<div class="actions"><button class="btn" onclick="next()">下一題 →</button></div>':''}`}function choose(k,el){let q=set[i];if(document.querySelector('.opt.correct'))return;tries++;if(k===q.ans){el.classList.add('correct');score++;fb('ok',`✅ 著矣！<br>${q.explain}`,true)}else{el.classList.add('wrong');if(tries===1)fb('hint',`🤔 閣想看覓！<br>${q.hint}`);else{document.querySelectorAll('.opt')[q.ans].classList.add('correct');fb('bad',`答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}`,true)}}}function mv(k,d){let s=$('seq'),it=[...s.children],j=k+d;if(j<0||j>=it.length)return;if(d<0)s.insertBefore(it[k],it[j]);else s.insertBefore(it[j],it[k]);[...s.children].forEach((e,n)=>{let b=e.querySelectorAll('button');b[0].setAttribute('onclick',`mv(${n},-1)`);b[1].setAttribute('onclick',`mv(${n},1)`)})}function checkSeq(){let q=set[i];tries++;let a=[...$('seq').children].map(x=>x.querySelector('span').textContent),ok=JSON.stringify(a)===JSON.stringify(q.answer);if(ok){score++;fb('ok',`✅ 順序著矣！<br>${q.explain}`,true)}else if(tries===1)fb('hint',`🤔 閣排看覓！<br>${q.hint}`);else fb('bad',`正確順序：<b>${q.answer.join(' → ')}</b><br>${q.explain}`,true)}function reflect(){let t=($('txt').value||'').trim();if(!t)return fb('hint','請先寫一句你的想法。');score++;fb('ok','💬 收著你的想法矣！這題無標準答案，重點是共課文佮生活連起來。',true)}function next(){i++;if(i>=set.length)finish();else render()}function finish(){$('fill').style.width='100%';$('final').textContent=`${score} / ${set.length}`;$('msg').textContent=score===5?'🏆 語境高手！':score>=4?'🌟 語感真𠢕！':score>=3?'👍 愈來愈會曉！':'🌱 閣試一擺，會愈來愈熟。';show('result')}
