<style>

.card{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}.level{text-align:center}.num{font-weight:900;color:#b9b4aa}.icon{font-size:42px}.btn{width:100%;border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;background:#31443c;color:white}

.fb{margin-top:18px;border-radius:16px;padding:16px 18px;line-height:1.6}.ok{background:#edf8f1}.hint{background:#fff8e9}.bad{background:#fff0ef}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.actions .btn{width:auto;min-width:150px}

<div class="top"><button class="pill" onclick="location.href='../語境填空.dc.html'">← 返回課文</button><button class="pill">📕 育達・第一冊</button></div>
<section id="lesson"><div class="hero"><h1>💰 第3課｜四秀仔錢</h1><p><b>零用錢、辭典佮兩代人的儉錢故事</b></p><p>課文語詞 × 語境運用 × 閱讀理解 × 綜合挑戰</p></div>
<div class="grid">
<article class="card level"><div class="num">01</div><div class="icon">🔤</div><h3>課文語詞</h3><p>認捌本課重要詞</p><button class="btn" onclick="start('vocab')">開始 →</button></article>
<article class="card level"><div class="num">02</div><div class="icon">💭</div><h3>語境選詞</h3><p>看情境真正會用</p><button class="btn" onclick="start('context')">開始 →</button></article>
<article class="card level"><div class="num">03</div><div class="icon">📖</div><h3>讀文理解</h3><p>揣線索讀懂文章</p><button class="btn" onclick="start('reading')">開始 →</button></article>
<article class="card level"><div class="num">04</div><div class="icon">🏆</div><h3>綜合挑戰</h3><p>課文 × 生活應用</p><button class="btn" onclick="start('comprehensive')">開始 →</button></article>

<section id="quiz" class="hidden quiz"><div class="title"><h2 id="qt"></h2><p>每回合隨機抽 5 題</p></div><div class="bar"><div class="fill" id="fill"></div></div><div class="meta"><span id="count"></span><span id="scoreNow"></span></div><article class="card qcard" id="qcard"></article></section>

</div><script>
const B={"vocab": [{"word": "四秀仔", "q": "「四秀仔」是：", "opts": ["零食、零嘴", "文具", "衣服"], "ans": 0, "hint": "教材直接註解。", "explain": "「四秀仔」就是零食、零嘴。"}, {"word": "買物", "q": "「買物」是：", "opts": ["買東西、物品", "賣東西", "借東西"], "ans": 0, "hint": "教材註解。", "explain": "「買物」是買東西、物品。"}, {"word": "食食", "q": "「食食」是：", "opts": ["飲食", "讀書", "工作"], "ans": 0, "hint": "教材註解。", "explain": "「食食」即飲食。"}, {"word": "撋", "q": "做糕仔時「撋油」的「撋」是：", "opts": ["用力推揉、搓揉", "切開", "燒焦"], "ans": 0, "hint": "教材註解。", "explain": "「撋」是以手用力推揉、搓揉。"}, {"word": "櫼", "q": "「櫼入去模仔」是：", "opts": ["塞、擠", "拿出", "洗"], "ans": 0, "hint": "教材註解。", "explain": "「櫼」就是塞、擠。"}, {"word": "啖糝", "q": "「啖糝」是：", "opts": ["解饞、淺嚐", "正餐", "飲料"], "ans": 0, "hint": "教材註解。", "explain": "「啖糝」是解饞、淺嚐。"}, {"word": "散赤", "q": "「厝裡散赤」是：", "opts": ["貧窮、窮困", "熱鬧", "富有"], "ans": 0, "hint": "作者細漢時。", "explain": "「散赤」就是貧窮、窮困。"}, {"word": "按算", "q": "「按算欲趁錢買一本」是：", "opts": ["打算、預算", "拒絕", "忘記"], "ans": 0, "hint": "教材註解。", "explain": "「按算」有打算、預算之意。"}, {"word": "趁錢", "q": "「趁錢」是：", "opts": ["賺錢", "花錢", "借錢"], "ans": 0, "hint": "作者靠勞力。", "explain": "「趁錢」就是賺錢。"}, {"word": "數簿", "q": "「數簿」是：", "opts": ["帳本、帳簿", "數學課本", "日曆"], "ans": 0, "hint": "作者予囡仔一本。", "explain": "「數簿」是帳本、帳簿。"}, {"word": "儉", "q": "「儉一冬」的「儉」是：", "opts": ["存錢", "消費", "捐掉"], "ans": 0, "hint": "囡仔把錢存一年。", "explain": "「儉」在此是存錢。"}, {"word": "央", "q": "「央我儉入去銀行」的「央」是：", "opts": ["請求、懇求", "命令", "拒絕"], "ans": 0, "hint": "教材註解。", "explain": "「央」就是請求、懇求。"}], "context": [{"word": "按算", "q": "我＿＿＿＿下個月開始儉錢買跤踏車。", "opts": ["按算", "散赤", "啖糝"], "ans": 0, "hint": "表示打算。", "explain": "答案是「按算」。"}, {"word": "趁錢", "q": "阿姊歇熱去餐廳拍工，想欲＿＿＿＿買電腦。", "opts": ["趁錢", "食食", "櫼"], "ans": 0, "hint": "工作賺錢。", "explain": "答案是「趁錢」。"}, {"word": "儉", "q": "每禮拜的所費若有賰，我會共伊＿＿＿＿起來。", "opts": ["儉", "撋", "央"], "ans": 0, "hint": "把錢存起來。", "explain": "「儉」就是存錢。"}, {"word": "散赤", "q": "雖然厝裡較＿＿＿＿，伊猶原認真讀冊。", "opts": ["散赤", "頂懸", "一寡仔"], "ans": 0, "hint": "家境窮困。", "explain": "「散赤」就是貧窮。"}, {"word": "櫼", "q": "抽屜內底物件傷濟，予人＿＿＿＿甲密密密。", "opts": ["櫼", "趁錢", "啖糝"], "ans": 0, "hint": "塞得滿滿。", "explain": "「櫼」是塞、擠。"}, {"word": "央", "q": "小弟真想欲去旅行，一直＿＿＿＿阿母予伊參加。", "opts": ["央", "食食", "散赤"], "ans": 0, "hint": "請求。", "explain": "「央」就是懇求。"}, {"word": "一寡仔", "q": "我會撥＿＿＿＿所費買家己愛看的冊。", "opts": ["一寡仔", "暝日", "頂懸"], "ans": 0, "hint": "一些、若干。", "explain": "「一寡仔」就是一些。"}, {"word": "四秀仔", "q": "便利商店內底有足濟糖仔、餅仔遮的＿＿＿＿。", "opts": ["四秀仔", "數簿", "手橐仔"], "ans": 0, "hint": "零食。", "explain": "「四秀仔」是零嘴。"}, {"word": "數簿", "q": "若欲記錄每禮拜的收入支出，會使用＿＿＿＿。", "opts": ["數簿", "尾仔囝", "啖糝"], "ans": 0, "hint": "帳本。", "explain": "「數簿」就是帳本。"}, {"word": "手橐仔", "q": "天氣冷，騎車時戴＿＿＿＿較袂寒。", "opts": ["手橐仔", "四秀仔", "數簿"], "ans": 0, "hint": "手套。", "explain": "「手橐仔」是手套。"}], "reading": [{"type": "choice", "q": "「四秀仔」可能是對啥物來的？", "opts": ["虎、豹、獅、象四種野獸", "四種水果", "四種文具"], "ans": 0, "hint": "糕仔模仔頂懸。", "explain": "教材說模具常刻虎、豹、獅、象，四獸仔可能由此而來。"}, {"type": "choice", "q": "「四秀仔錢」在課文內底是啥物意思？", "opts": ["所費、零用錢", "學費", "房租"], "ans": 0, "hint": "第三段最後。", "explain": "課文明確說四秀仔錢就是「所費」。"}, {"type": "choice", "q": "作者細漢為著買辭典，做過啥物？", "opts": ["擘蝦仔、擘蒜頭、紩手橐仔", "賣手機", "教補習"], "ans": 0, "hint": "作者靠勞力趁錢。", "explain": "作者靠假期勞動賺錢買辭典。"}, {"type": "choice", "q": "作者為啥物到今猶原毋甘擲掉彼本辭典？", "opts": ["伊陪伴作者成長，閣開闊文學世界", "因為價錢上貴", "因為全新未用"], "ans": 0, "hint": "課文第四、五段。", "explain": "辭典承載努力、孤單、學習與文學記憶。"}, {"type": "choice", "q": "作者予查某囝一本數簿，主要欲培養啥物？", "opts": ["儉錢佮規劃所費", "食零食", "買衫"], "ans": 0, "hint": "查某囝儉一年。", "explain": "作者把自己的經驗傳承予囡仔，養成儉錢習慣。"}, {"type": "choice", "q": "作者的查某囝儉錢，閣按算大漢欲：", "opts": ["家己買厝", "買糖仔", "去旅行"], "ans": 0, "hint": "課文第五段。", "explain": "囡仔說長大後要自己買房。"}, {"type": "choice", "q": "本篇文章是啥物文體？", "opts": ["記敘文", "詩", "廣告"], "ans": 0, "hint": "課文介紹。", "explain": "教材指出本篇是記敘文。"}, {"type": "choice", "q": "全文上重要的傳承是：", "opts": ["儉所費買冊的習慣", "買零食的習慣", "不記帳"], "ans": 0, "hint": "課文介紹。", "explain": "作者的理財與閱讀經驗影響查某囝。"}], "comprehensive": [{"type": "choice", "q": "做糕仔的步數，下面佗一个無包括？", "opts": ["切塊", "磨粉", "撋油"], "ans": 0, "hint": "教材課堂練功夫。", "explain": "教材流程有磨粉、攪糖、撋油、櫼入模仔、炊熟，沒有切塊。"}, {"type": "choice", "q": "「所費」佮下面佗一个意思相仝？", "opts": ["四秀仔錢", "硩年錢", "買菜錢"], "ans": 0, "hint": "教材練習題。", "explain": "課文明確說四秀仔錢就是所費。"}, {"type": "choice", "q": "若干焦會使買一項物件，教材希望先判斷：", "opts": ["想欲愛抑是目前需要", "顏色媠無", "朋友有無"], "ans": 0, "hint": "愛心活動。", "explain": "活動要求分辨「我想欲愛」與「我目前需要」。"}, {"type": "choice", "q": "俗語「毛毛仔雨落久，塗嘛會澹」主要比喻：", "opts": ["積少成多、持之以恆", "一下就成功", "毋免努力"], "ans": 0, "hint": "俗語頁。", "explain": "教材解釋是積少成多、持之以恆。"}, {"type": "choice", "q": "「加減趁較袂散，加減抾就免借」欲提醒：", "opts": ["小錢累積、平時節儉", "趕緊借錢", "花愈濟愈好"], "ans": 0, "hint": "俗語頁。", "explain": "意謂小錢積累也是大錢，平時節儉有需要就免借。"}, {"type": "sequence", "title": "作者與辭典的故事", "q": "請共下面內容排做正確順序。", "items": ["厝裡散赤，看著別人有辭典", "歇熱擘蝦仔、歇寒擘蒜頭紩手橐仔", "買著人生第一本辭典", "辭典陪作者讀冊、做老師、搬厝", "把儉錢故事傳予查某囝"], "answer": ["厝裡散赤，看著別人有辭典", "歇熱擘蝦仔、歇寒擘蒜頭紩手橐仔", "買著人生第一本辭典", "辭典陪作者讀冊、做老師、搬厝", "把儉錢故事傳予查某囝"], "hint": "照課文時間順序。", "explain": "課文用辭典串起作者從細漢到做母親的生命經驗。"}, {"type": "reflection", "title": "最後一題", "q": "若你這禮拜有一筆所費，會按怎分配？請用一句話寫看覓。", "hint": "想想需要、想欲愛、儉錢。"}]};
const names={vocab:"🔤 課文語詞",context:"💭 語境選詞",reading:"📖 讀文理解",comprehensive:"🏆 綜合挑戰"};
let bank="",set=[],i=0,score=0,tries=0;
const $=id=>document.getElementById(id), sh=a=>[...a].sort(()=>Math.random()-.5);
function show(id){["lesson","quiz","result"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");scrollTo(0,0)}
function start(b){bank=b;i=0;score=0;let src=sh(B[b]);if(b==="comprehensive"){let r=src.find(q=>q.type==="reflection");let n=src.filter(q=>q.type!=="reflection").slice(0,4);set=r?[...n,r]:n.slice(0,5)}else set=src.slice(0,5);$("qt").textContent=names[b];show("quiz");render()}
function render(){tries=0;$("count").textContent=`第 ${i+1} / ${set.length} 題`;$("scoreNow").textContent=`目前 ${score} 分`;$("fill").style.width=`${(i/set.length)*100}%`;let q=set[i];let h=`<div class="kicker">${q.title||q.word||""}</div><div class="q">${q.q}</div>`;if(q.type==="sequence"){let a=sh(q.items);h+=`<div id="seq" class="seq">${a.map((x,k)=>`<div class="seqitem"><span>${x}</span><button onclick="mv(${k},-1)">↑</button><button onclick="mv(${k},1)">↓</button></div>`).join("")}</div><div class="actions"><button class="btn" onclick="checkSeq()">檢查順序</button></div>`}else if(q.type==="reflection"){h+=`<textarea id="txt" placeholder="請用一句話寫看覓……"></textarea><div class="actions"><button class="btn" onclick="reflect()">送出</button></div>`}else{h+=`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" onclick="choose(${k},this)">${String.fromCharCode(65+k)}｜${o}</button>`).join("")}</div>`}h+=`<div id="feedback"></div>`;$("qcard").innerHTML=h}
function fb(cls,t,next=false){$("feedback").innerHTML=`<div class="fb ${cls}">${t}</div>${next?'<div class="actions"><button class="btn" onclick="next()">下一題 →</button></div>':""}`}
function choose(k,el){let q=set[i];if(document.querySelector(".opt.correct"))return;tries++;if(k===q.ans){el.classList.add("correct");score++;fb("ok",`✅ 著矣！<br>${q.explain}`,true)}else{el.classList.add("wrong");if(tries===1)fb("hint",`🤔 閣想看覓！<br>${q.hint}`);else{document.querySelectorAll(".opt")[q.ans].classList.add("correct");fb("bad",`答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}`,true)}}}
function mv(k,d){let s=$("seq"),it=[...s.children],j=k+d;if(j<0||j>=it.length)return;if(d<0)s.insertBefore(it[k],it[j]);else s.insertBefore(it[j],it[k]);[...s.children].forEach((e,n)=>{let b=e.querySelectorAll("button");b[0].setAttribute("onclick",`mv(${n},-1)`);b[1].setAttribute("onclick",`mv(${n},1)`)})}
function checkSeq(){let q=set[i];tries++;let a=[...$("seq").children].map(x=>x.querySelector("span").textContent),ok=JSON.stringify(a)===JSON.stringify(q.answer);if(ok){score++;fb("ok",`✅ 順序著矣！<br>${q.explain}`,true)}else if(tries===1)fb("hint",`🤔 閣排看覓！<br>${q.hint}`);else fb("bad",`正確順序：<b>${q.answer.join(" → ")}</b><br>${q.explain}`,true)}
function reflect(){let t=($("txt").value||"").trim();if(!t)return fb("hint","請先寫一句你的想法。");score++;fb("ok","💬 收著你的想法矣！這題無標準答案，重點是共課文佮生活連起來。",true)}
function next(){i++;if(i>=set.length)finish();else render()}
function finish(){$("fill").style.width="100%";$("final").textContent=`${score} / ${set.length}`;$("msg").textContent=score===5?"🏆 語境高手！":score>=4?"🌟 語感真𠢕！":score>=3?"👍 愈來愈會曉！":"🌱 閣試一擺，會愈來愈熟。";show("result")}
</script></body></html>
