<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人佮獅｜真平第一冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="index.html">← 返回整冊</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🦁</div><h1>第3課｜人佮獅</h1><p>善良、感恩、報恩與朋友互助</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>語詞意思與教材重點。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>掌握課文人物、事件與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把本課概念帶回生活判斷。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每次隨機抽最多 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab": [{"q": "「霧嗄嗄」較接近啥物意思？", "o": ["一頭霧水、模糊無條理", "蜻蜓", "蓑衣、雨具"], "a": 0, "e": "「霧嗄嗄」：一頭霧水、模糊無條理。"}, {"q": "「田嬰」較接近啥物意思？", "o": ["蜻蜓", "一頭霧水、模糊無條理", "蓑衣、雨具"], "a": 0, "e": "「田嬰」：蜻蜓。"}, {"q": "「棕蓑」較接近啥物意思？", "o": ["蓑衣、雨具", "一頭霧水、模糊無條理", "蜻蜓"], "a": 0, "e": "「棕蓑」：蓑衣、雨具。"}, {"q": "「澹糊糊」較接近啥物意思？", "o": ["全身濕透的樣子", "一頭霧水、模糊無條理", "蜻蜓"], "a": 0, "e": "「澹糊糊」：全身濕透的樣子。"}, {"q": "「恩人」較接近啥物意思？", "o": ["對自己有恩惠的人", "一頭霧水、模糊無條理", "蜻蜓"], "a": 0, "e": "「恩人」：對自己有恩惠的人。"}, {"q": "「報恩」較接近啥物意思？", "o": ["回報別人的恩情", "一頭霧水、模糊無條理", "蜻蜓"], "a": 0, "e": "「報恩」：回報別人的恩情。"}, {"q": "「冤家」較接近啥物意思？", "o": ["爭吵、不和", "一頭霧水、模糊無條理", "蜻蜓"], "a": 0, "e": "「冤家」：爭吵、不和。"}, {"q": "「喙䫌」較接近啥物意思？", "o": ["臉頰", "一頭霧水、模糊無條理", "蜻蜓"], "a": 0, "e": "「喙䫌」：臉頰。"}, {"q": "「岫」較接近啥物意思？", "o": ["巢、窩", "一頭霧水、模糊無條理", "蜻蜓"], "a": 0, "e": "「岫」：巢、窩。"}, {"q": "「簾簷跤」較接近啥物意思？", "o": ["屋簷下面", "一頭霧水、模糊無條理", "蜻蜓"], "a": 0, "e": "「簾簷跤」：屋簷下面。"}], "context": [{"q": "「食果子，拜樹頭」主要提醒咱？", "o": ["感恩、飲水思源", "食果子愛拜拜", "樹頭會結果"], "a": 0, "e": "教材解釋做人不可忘本。"}, {"q": "「食人一口，報人一斗」是講？", "o": ["受人恩惠愛知影回報", "食物愛食真濟", "毋通接受幫助"], "a": 0, "e": "教材解釋受人恩惠要懂得報恩。"}, {"q": "「我看甲霧嗄嗄」表示？", "o": ["看了猶原一頭霧水", "看甲真清楚", "看甲真歡喜"], "a": 0, "e": "霧嗄嗄是模糊、理不出頭緒。"}, {"q": "「田嬰結規堆，著愛穿棕蓑」和啥物生活觀察有關？", "o": ["天氣欲落雨", "欲出日頭", "欲地動"], "a": 0, "e": "課文對話用蜻蜓成群作為天氣變化的生活經驗。"}, {"q": "朋友有雨幔，講「一人幔一半」，表現啥物？", "o": ["分享佮互相照顧", "競爭", "無情"], "a": 0, "e": "這个情境表現朋友互相幫忙。"}], "reading": [{"q": "〈人佮獅〉改寫自啥物類型的故事？", "o": ["《伊索寓言》", "新聞報導", "旅遊手冊"], "a": 0, "e": "教材說明本課由《伊索寓言》改寫。"}, {"q": "少年家幫助獅後，獅後來的行為主要表現？", "o": ["知恩報恩", "忘恩負義", "驕傲自大"], "a": 0, "e": "故事核心是善良與報恩。"}, {"q": "本課主要傳達的價值較接近？", "o": ["好心有好報、受恩愛回報", "比賽一定愛贏", "買物愛討價"], "a": 0, "e": "人與獅互助的故事凸顯感恩與回報。"}, {"q": "教材俗諺「食果子，拜樹頭」和故事的共同概念是？", "o": ["感恩", "速度", "外表"], "a": 0, "e": "兩者都強調不可忘記恩惠來源。"}, {"q": "若用一句話概括〈人佮獅〉，上適合？", "o": ["善意會建立跨越差異的信任與回報", "獅永遠是危險的", "少年家靠運氣成功"], "a": 0, "e": "故事用人與獅的互助呈現善良與報恩。"}], "comprehensive": [{"q": "若有人幫助你，最符合本課精神的做法是？", "o": ["記得恩情並適當回報", "當作理所當然", "完全毋免回應"], "a": 0, "e": "本課核心是知恩與報恩。"}, {"q": "「一人幔一半」可以延伸做啥物生活態度？", "o": ["資源分享、互相照顧", "凡事搶先", "只顧家己"], "a": 0, "e": "課文情境呈現朋友間的分享。"}, {"q": "本課故事最適合搭配佗一个俗諺？", "o": ["食人一口，報人一斗", "三斤貓，咬四斤鳥鼠", "食少有滋味"], "a": 0, "e": "「食人一口，報人一斗」直接談受恩與回報。"}, {"q": "「霧嗄嗄」若用佇學習情境，是講？", "o": ["對內容理不出頭緒", "全部攏會", "讀甲真流利"], "a": 0, "e": "霧嗄嗄可形容一頭霧水。"}, {"q": "本課除了語詞學習，閣會當練習啥物？", "o": ["感恩與人際互助的判斷", "股票分析", "地圖比例尺"], "a": 0, "e": "故事與俗諺都圍繞感恩互助。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
