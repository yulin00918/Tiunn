<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>康軒第一冊｜🔎 素養活動｜按怎使用《臺灣台語常用詞辭典》</title>
<style>
:root{--ink:#33453f;--muted:#72827b;--line:#e1e8e4;--accent:#5f8583;--shadow:0 10px 28px #31473e14}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fafcfb,#eef4f2);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}button{font:inherit}
.app{max-width:1080px;margin:auto;padding:28px 22px 60px}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:25px}.pill{border:0;background:#fff;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);text-decoration:none;color:inherit}
.hero{text-align:center;margin:12px 0 34px}.hero h1{font-size:39px;margin:0 0 8px}.hero p{color:var(--muted);margin:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:23px;padding:24px;box-shadow:var(--shadow)}.level{text-align:center}.icon{font-size:40px}.num{font-weight:900;color:#bcc5c0}.level h3{margin:8px}.level p{min-height:50px;color:var(--muted);line-height:1.55}
.btn{width:100%;border:0;border-radius:14px;padding:12px 16px;background:#354d46;color:#fff;font-weight:800;cursor:pointer}.hidden{display:none!important}.quiz{max-width:850px;margin:auto}.title{text-align:center}.title h2{font-size:31px;margin-bottom:5px}.title p{color:var(--muted)}
.bar{height:11px;background:#e5ebe8;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:8px 0 14px}.qcard{padding:32px}.kicker{font-weight:800;color:#8e755f}.q{font-size:26px;font-weight:800;line-height:1.55;margin:10px 0 24px}.opts{display:grid;gap:12px}.opt{padding:16px;text-align:left;border:1px solid #dce4df;background:white;border-radius:15px;font-weight:700;cursor:pointer}.correct{background:#edf8f1;border-color:#8ebaa0}.wrong{background:#fff0ef;border-color:#d7a09a}.feedback{margin-top:18px;padding:16px;border-radius:15px;line-height:1.6}.ok{background:#edf8f1}.bad{background:#fff0ef}.hint{background:#fff8e7}.next{width:auto;margin-top:14px}.result{max-width:720px;margin:auto;text-align:center}.score{font-size:62px;font-weight:900;color:var(--accent)}.weak{background:#f3f6f4;border-radius:14px;padding:14px;margin:18px 0}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style></head><body><div class="app">
<div class="top"><a class="pill" href="index.html">← 返回本冊</a><span class="pill">📚 康軒・第一冊</span></div>
<section id="lesson"><div class="hero"><h1>🔎 素養活動｜按怎使用《臺灣台語常用詞辭典》</h1><p><b>查詞目 × 查用例 × 查全文 × 自主學習</b></p><p>重點語詞 × 語境運用 × 內容理解 × 綜合挑戰</p></div><div class="grid"><div class="card level"><div class="num">01</div><div class="icon">🔤</div>
        <h3>重點語詞</h3><p>教材重點語詞與概念</p><small id="s-vocab">未挑戰</small><br><br>
        <button class="btn start" data-b="vocab">開始 →</button></div><div class="card level"><div class="num">02</div><div class="icon">💭</div>
        <h3>語境運用</h3><p>換一個情境真正會用</p><small id="s-context">未挑戰</small><br><br>
        <button class="btn start" data-b="context">開始 →</button></div><div class="card level"><div class="num">03</div><div class="icon">📖</div>
        <h3>內容理解</h3><p>讀懂教材內容與重點</p><small id="s-reading">未挑戰</small><br><br>
        <button class="btn start" data-b="reading">開始 →</button></div><div class="card level"><div class="num">04</div><div class="icon">🏆</div>
        <h3>綜合挑戰</h3><p>把知識帶進生活判斷</p><small id="s-comprehensive">未挑戰</small><br><br>
        <button class="btn start" data-b="comprehensive">開始 →</button></div></div></section>
<section id="quiz" class="hidden"><div class="quiz"><div class="title"><h2 id="qt"></h2><p>每擺隨機抽 5 題</p></div><div class="bar"><div class="fill" id="fill"></div></div><div class="meta"><span id="count"></span><span id="scoreNow"></span></div><div class="card qcard" id="qcard"></div></div></section>
<section id="result" class="hidden"><div class="card result"><div style="font-size:48px">🎉</div><h2 id="rt"></h2><div class="score" id="fs"></div><p id="msg"></p><div class="weak" id="weak"></div><button class="btn" id="retry">🔄 閣挑戰一擺</button><br><br><button class="btn" id="home" style="background:#e9efec;color:#31443c">轉去本單元</button></div></section>
</div><script>
const B={"vocab": [{"q": "教育部《臺灣台語常用詞辭典》是：", "opts": ["線頂辭典", "紙本小說", "影音平台"], "ans": 0, "hint": "教材第一段有說明。", "explain": "教材說明它是教育部編輯的線上辭典。"}, {"q": "用臺灣台語查詞目，可以輸入：", "opts": ["漢字或臺羅拼音", "只能華語", "只能英文"], "ans": 0, "hint": "教材列出兩種輸入方式。", "explain": "漢字或臺羅拼音都可以查詞目。"}, {"q": "教材介紹的查詢方式共有幾種？", "opts": ["4種", "2種", "8種"], "ans": 0, "hint": "課程開頭有說。", "explain": "教材明確說有4種查詢方式。"}, {"q": "辭典「附錄」可能查著啥物？", "opts": ["俗諺、地名、節氣、親情關係等", "只有數學公式", "只有英文單字"], "ans": 0, "hint": "附錄收集真濟台語用詞。", "explain": "教材列舉俗諺、百家姓、地名、節氣、親情關係、人體器官等。"}, {"q": "「相關資源」有提供：", "opts": ["字型、輸入法、辭典資源下載", "遊戲點數", "購物折價券"], "ans": 0, "hint": "是學習台語的工具。", "explain": "教材列出字型下載、輸入法下載、辭典資源下載等。"}], "context": [{"q": "毋知「豐沛」的台語詞目資料，第一步較適合：", "opts": ["用臺灣台語查詞目", "去看天氣", "查數學課本"], "ans": 0, "hint": "教材學習單就有這題型。", "explain": "可用台語漢字或臺羅查詞目。"}, {"q": "手頭只有華語「羨慕」，欲揣台語，較適合：", "opts": ["用華語查詢", "用地圖查詢", "用相簿查詢"], "ans": 0, "hint": "教材有華語查用例、查全文。", "explain": "可以從華語進入查詢。"}, {"q": "欲揣台語地名資料，會使先看：", "opts": ["附錄", "計算機", "瀏覽紀錄"], "ans": 0, "hint": "附錄有地名。", "explain": "教材說附錄收錄地名等資料。"}, {"q": "欲安裝台語字型，較適合揤：", "opts": ["相關資源", "購物車", "登出"], "ans": 0, "hint": "教材有字型下載。", "explain": "相關資源提供字型下載。"}, {"q": "查著詞目後欲聽看覓、了解用法，重點是：", "opts": ["看辭典提供的詞義與用例", "只看字數", "只看顏色"], "ans": 0, "hint": "辭典是語言學習工具。", "explain": "教材目的在協助正確書寫與理解語詞。"}], "reading": [{"q": "教材為啥物介紹這本辭典？", "opts": ["幫助查正確漢字、語詞與意思", "教人買東西", "查公車"], "ans": 0, "hint": "教材開頭說明用途。", "explain": "可用來確認台語漢字／語詞寫法與意義。"}, {"q": "四種方式內底，哪一種是教材明列的？", "opts": ["用華語查全文", "用圖片查天氣", "用英文查數學"], "ans": 0, "hint": "教材第34頁。", "explain": "「用華語查全文」是四種方式之一。"}, {"q": "「用臺灣台語查用例」主要是在揣：", "opts": ["語詞實際使用例句", "商品價格", "地圖位置"], "ans": 0, "hint": "「用例」就是例句。", "explain": "這個功能協助理解語詞怎麼用。"}, {"q": "教材學習單還安排學生查啥物？", "opts": ["家己的名姓臺羅拼音", "身高體重", "手機密碼"], "ans": 0, "hint": "學習單第三部分。", "explain": "教材安排「姓名查詢」，並用台語介紹姓名。"}, {"q": "整個素養活動的核心能力是：", "opts": ["會使用可信的台語辭典工具自主查詢", "只靠猜", "只背答案"], "ans": 0, "hint": "這是工具使用素養。", "explain": "教材希望學生能自己查詞、查用例與延伸資源。"}], "comprehensive": [{"q": "若毋知一個台語詞按怎寫，最合理的做法是：", "opts": ["查教育部臺灣台語常用詞辭典", "隨便寫一字", "直接放棄"], "ans": 0, "hint": "這就是本單元目的。", "explain": "使用辭典查證比猜測可靠。"}, {"q": "只有臺羅拼音，欲揣漢字，教材指出：", "opts": ["嘛會使查詢", "完全無法查", "一定愛先翻英文"], "ans": 0, "hint": "漢字或臺羅都可以。", "explain": "用臺羅拼音也能查詞目。"}, {"q": "欲查節氣相關台語，除了一般搜尋，閣會使看：", "opts": ["附錄", "購物頁", "遊戲頁"], "ans": 0, "hint": "附錄有節氣。", "explain": "教材明列節氣是附錄內容之一。"}, {"q": "學習台語時「相關資源」的價值是：", "opts": ["提供字型、輸入法與辭典資料工具", "增加廣告", "取代所有課程"], "ans": 0, "hint": "教材列出的資源。", "explain": "這些工具能支援輸入、顯示與查詢台語。"}, {"q": "本活動最適合的實作是：", "opts": ["指定幾個詞，讓學生自己查詞目、用例與臺羅", "只抄課文十遍", "只看答案"], "ans": 0, "hint": "要真的操作辭典。", "explain": "實際查詢才能建立工具使用能力。"}]}; const names={vocab:"🔤 重點語詞",context:"💭 語境運用",reading:"📖 內容理解",comprehensive:"🏆 綜合挑戰"};
let bank,set=[],i=0,score=0,tries=0,weak=[];const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);
function show(id){["lesson","quiz","result"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");scrollTo(0,0)}
function start(b){bank=b;set=sh(B[b]).slice(0,5);i=0;score=0;weak=[];$("qt").textContent=names[b];show("quiz");render()}
document.querySelectorAll(".start").forEach(x=>x.onclick=()=>start(x.dataset.b));
function render(){tries=0;let z=set[i];$("count").textContent=`第 ${i+1} / 5 題`;$("scoreNow").textContent=`目前 ${score} 分`;$("fill").style.width=`${i*20}%`;$("qcard").innerHTML=`<div class="kicker">${names[bank]}</div><div class="q">${z.q}</div><div class="opts">${z.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join("")}</div><div id="fb"></div>`}
function pick(n,el){let z=set[i];if(document.querySelector(".correct"))return;tries++;if(n===z.ans){el.classList.add("correct");score++;$("fb").innerHTML=`<div class="feedback ok">✅ 著矣！<br>${z.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add("wrong");if(tries===1){weak.push(z.q);$("fb").innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${z.hint}</div>`}else{document.querySelectorAll(".opt")[z.ans].classList.add("correct");$("fb").innerHTML=`<div class="feedback bad">答案是：<b>${z.opts[z.ans]}</b><br>${z.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}
function next(){i++;if(i<set.length)render();else finish()} function finish(){$("s-"+bank).textContent=`上擺 ${score} / ${set.length}`;$("rt").textContent=names[bank]+"完成！";$("fs").textContent=score+" / "+set.length;$("msg").textContent=score===set.length?"🏆 真𠢕！這關全數答著。":score>=4?"🌟 真好！已經真熟矣。":"🌱 閣練一擺，會愈來愈熟。";$("weak").innerHTML=weak.length?`<b>建議閣練：</b>${[...new Set(weak)].slice(0,3).join("／")}`:"✨ 這擺無特別需要加強的題目。";show("result")}
$("retry").onclick=()=>start(bank);$("home").onclick=()=>show("lesson");
</script></body></html>
