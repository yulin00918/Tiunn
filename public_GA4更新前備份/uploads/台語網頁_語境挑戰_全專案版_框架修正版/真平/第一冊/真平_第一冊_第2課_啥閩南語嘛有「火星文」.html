d-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="index.html">← 返回整冊</a><span class="pill">📗 真平・第一冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">💬</div><h1>第2課｜啥？閩南語嘛有「火星文」！</h1><p>網路語言、正確書寫與台語傳承</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>語詞意思與教材重點。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>掌握課文人物、事件與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把本課概念帶回生活判斷。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每次隨機抽最多 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab": [{"q": "「頇顢」較接近啥物意思？", "o": ["笨手笨腳、不靈巧", "令人感動、貼心", "有禮貌、懂禮數"], "a": 0, "e": "「頇顢」：笨手笨腳、不靈巧。"}, {"q": "「感心」較接近啥物意思？", "o": ["令人感動、貼心", "笨手笨腳、不靈巧", "有禮貌、懂禮數"], "a": 0, "e": "「感心」：令人感動、貼心。"}, {"q": "「好禮」較接近啥物意思？", "o": ["有禮貌、懂禮數", "笨手笨腳、不靈巧", "令人感動、貼心"], "a": 0, "e": "「好禮」：有禮貌、懂禮數。"}, {"q": "「捌代誌」較接近啥物意思？", "o": ["懂事、明理", "笨手笨腳、不靈巧", "令人感動、貼心"], "a": 0, "e": "「捌代誌」：懂事、明理。"}, {"q": "「湠」較接近啥物意思？", "o": ["傳播、擴散", "笨手笨腳、不靈巧", "令人感動、貼心"], "a": 0, "e": "「湠」：傳播、擴散。"}, {"q": "「烏白」較接近啥物意思？", "o": ["胡亂、隨便", "笨手笨腳、不靈巧", "令人感動、貼心"], "a": 0, "e": "「烏白」：胡亂、隨便。"}, {"q": "「現挽」較接近啥物意思？", "o": ["現採、剛摘下來", "笨手笨腳、不靈巧", "令人感動、貼心"], "a": 0, "e": "「現挽」：現採、剛摘下來。"}, {"q": "「紮」較接近啥物意思？", "o": ["攜帶、帶著", "笨手笨腳、不靈巧", "令人感動、貼心"], "a": 0, "e": "「紮」：攜帶、帶著。"}, {"q": "「𨑨迌」較接近啥物意思？", "o": ["遊玩", "笨手笨腳、不靈巧", "令人感動、貼心"], "a": 0, "e": "「𨑨迌」：遊玩。"}, {"q": "「落氣」較接近啥物意思？", "o": ["揭短、找碴", "笨手笨腳、不靈巧", "令人感動、貼心"], "a": 0, "e": "「落氣」：揭短、找碴。"}], "context": [{"q": "老師無贊成長期用「火星文」寫台語，主要原因是？", "o": ["用字混亂會影響溝通佮傳承", "字較大", "手機無法度顯示"], "a": 0, "e": "課文提醒常用錯字，久了可能造成台語書寫混亂。"}, {"q": "「年久月深予湠落去」的「湠」較接近？", "o": ["傳播出去", "收起來", "洗清氣"], "a": 0, "e": "這裡是錯誤寫法長期傳播的意思。"}, {"q": "下面佗一个詞無適合用來呵咾人？", "o": ["頇顢", "感心", "好禮"], "a": 0, "e": "教材應用題指出「頇顢」是笨手笨腳，無適合呵咾人。"}, {"q": "「互相落氣，求進步」較接近啥物態度？", "o": ["互相指出不足來進步", "互相罵人", "完全毋通提意見"], "a": 0, "e": "教材解釋是在不傷和氣下互掀短處，促進自我檢討。"}, {"q": "網路聊天欲兼顧趣味佮傳承，較好的方式是？", "o": ["趣味表達嘛盡量用正確台文", "完全毋免管字", "攏改用符號"], "a": 0, "e": "本課重點不是反對網路溝通，而是提醒正確書寫的重要。"}], "reading": [{"q": "〈啥？閩南語嘛有「火星文」！〉主要用啥物情境呈現？", "o": ["師生的網路／LINE對話", "菜市場買菜", "龜兔比賽"], "a": 0, "e": "教材以E世代師生網路對話切入。"}, {"q": "老師最擔心火星文長期使用造成啥物？", "o": ["溝通不良佮台語傳承問題", "手機變慢", "無法度傳貼圖"], "a": 0, "e": "教材指出用字混亂可能影響理解與傳承。"}, {"q": "阿淇講欲紮現挽的荔枝予老師食，老師認為伊？", "o": ["足好禮", "真頇顢", "無正經"], "a": 0, "e": "教材應用題以此判斷「好禮」。"}, {"q": "本課對「火星文」的態度較接近？", "o": ["有趣味，但正式台文書寫愛正確", "所有火星文攏是錯誤無價值", "只要聽有就永遠毋免管文字"], "a": 0, "e": "課文承認趣味性，同時重視正確書寫與傳承。"}, {"q": "本課最核心的語文素養是？", "o": ["理解文字選擇會影響溝通佮傳承", "記住所有貼圖", "學會打字速度"], "a": 0, "e": "教材將網路語言與台語文字傳承連結。"}], "comprehensive": [{"q": "若欲查一个台語詞正確漢字，較適合？", "o": ["查可靠的台語辭典", "照聲音隨便寫", "問搜尋引擎第一筆就算"], "a": 0, "e": "正確書寫需要可靠語文資源。"}, {"q": "朋友用火星文予你看無，較適合按怎做？", "o": ["請伊換較清楚、正確的寫法", "假裝看有", "直接封鎖"], "a": 0, "e": "溝通的目的就是予雙方理解。"}, {"q": "「火星文」若大量用佇正式教材，可能上直接影響？", "o": ["閱讀理解與文字規範", "運動能力", "食慾"], "a": 0, "e": "本課關注文字混亂造成的溝通與傳承問題。"}, {"q": "「互相落氣，求進步」適合用佇啥物情境？", "o": ["同學互相檢查作業", "互相人身攻擊", "完全無交流"], "a": 0, "e": "教材例句就是交換檢查作業。"}, {"q": "本課題名用「啥？」主要營造？", "o": ["驚訝與趣味的提問感", "悲傷", "命令"], "a": 0, "e": "題名以疑問帶出「台語嘛有火星文」的議題。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
