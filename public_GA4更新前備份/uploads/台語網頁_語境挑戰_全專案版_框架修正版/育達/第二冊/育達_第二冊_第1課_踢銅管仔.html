<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>語境挑戰｜踢銅管仔</title><style>
:root{--bg:#fbfaf7;--card:#fff;--text:#2f3a36;--muted:#6d7b75;--line:#e7e4dc;--green:#5f8f7b;--orange:#c88957;--shadow:0 10px 28px rgba(40,50,45,.08);--radius:24px}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#fbfaf7,#f4f6f2);color:var(--text)}button,textarea{font:inherit}.app{max-width:1180px;margin:auto;padding:28px 22px 60px}.top{display:flex;justify-content:space-between;margin-bottom:24px}.pill{border:0;background:#fff;border-radius:999px;padding:10px 16px;box-shadow:var(--shadow);cursor:pointer}.hero,.title{text-align:center}.hero h1{font-size:clamp(34px,5vw,54px);margin:8px 0}.hero p,.title p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}.level{text-align:center}.num{font-weight:900;color:#b9b4aa}.icon{font-size:42px}.btn{width:100%;border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;background:#31443c;color:white}.hidden{display:none!important}.quiz{max-width:850px;margin:auto}.bar{height:12px;background:#e9ece8;border-radius:999px;overflow:hidden}.fill{height:100%;background:#6f8f7b;width:0}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:8px 0 14px}.qcard{padding:34px}.kicker{font-weight:800;color:#9b7657}.q{font-size:clamp(23px,3vw,34px);font-weight:800;line-height:1.55;margin:10px 0 24px}.opts{display:grid;gap:12px}.opt{text-align:left;border:1px solid #dde3de;border-radius:16px;background:#fff;padding:16px 18px;cursor:pointer;font-weight:700}.correct{background:#edf8f1;border-color:#9bc4a9}.wrong{background:#fff0ef;border-color:#d9a09a}.fb{margin-top:18px;border-radius:16px;padding:16px 18px;line-height:1.6}.ok{background:#edf8f1}.hint{background:#fff8e9}.bad{background:#fff0ef}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.actions .btn{width:auto;min-width:150px}.seq{display:grid;gap:10px}.seqitem{display:flex;gap:10px;align-items:center;border:1px solid #dde3de;border-radius:14px;padding:12px}.seqitem span{flex:1;font-weight:800}.seqitem button{border:0;background:#eef1ee;border-radius:10px;padding:8px 10px}textarea{width:100%;min-height:120px;border:1px solid #ddd;border-radius:16px;padding:14px}.result{max-width:720px;margin:auto;text-align:center}.score{font-size:64px;font-weight:900;color:#5f8f7b}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><div class="top"><button class="pill" onclick="location.href='index.html'">← 返回整冊</button><button class="pill">📕 育達・第二冊</button></div><section id="lesson"><div class="hero"><h1>🥫 第1課｜踢銅管仔</h1><p><b>童年遊戲、玩法規則佮時代變遷</b></p><p>課文語詞 × 語境運用 × 閱讀理解 × 綜合挑戰</p></div><div class="grid"><article class="card level"><div class="num">01</div><div class="icon">🔤</div><h3>課文語詞</h3><p>認捌本課重要詞</p><button class="btn" onclick="start('vocab')">開始 →</button></article><article class="card level"><div class="num">02</div><div class="icon">💭</div><h3>語境選詞</h3><p>看情境真正會用</p><button class="btn" onclick="start('context')">開始 →</button></article><article class="card level"><div class="num">03</div><div class="icon">📖</div><h3>讀文理解</h3><p>揣線索讀懂文章</p><button class="btn" onclick="start('reading')">開始 →</button></article><article class="card level"><div class="num">04</div><div class="icon">🏆</div><h3>綜合挑戰</h3><p>課文 × 生活應用</p><button class="btn" onclick="start('comprehensive')">開始 →</button></article></div></section><section id="quiz" class="hidden quiz"><div class="title"><h2 id="qt"></h2><p>每回合隨機抽 5 題</p></div><div class="bar"><div class="fill" id="fill"></div></div><div class="meta"><span id="count"></span><span id="scoreNow"></span></div><article class="card qcard" id="qcard"></article></section><section id="result" class="hidden result"><article class="card"><h2>完成！</h2><div class="score" id="final"></div><p id="msg"></p><button class="btn" onclick="start(bank)">閣挑戰一擺</button><br><br><button class="btn" style="background:#eef1ee;color:#34463e" onclick="show('lesson')">轉去本課</button></article></section></div><script>const B={"vocab": [{"word": "同齊", "q": "「同齊 tâng-tsê」是啥物意思？", "opts": ["同時一起", "單獨一个", "事先預約"], "ans": 0, "hint": "課文註解。", "explain": "「同齊」就是同時一起。"}, {"word": "向時", "q": "「向時 hiàng-sî」是：", "opts": ["從前、昔日", "明仔載", "這馬"], "ans": 0, "hint": "課文寫過去的臺灣。", "explain": "「向時」就是從前、昔日。"}, {"word": "曠闊", "q": "「曠闊 khòng-khuah」較接近：", "opts": ["寬廣、遼闊", "狹窄", "烏暗"], "ans": 0, "hint": "耍踢銅管仔愛揣這款所在。", "explain": "「曠闊」就是寬廣、遼闊。"}, {"word": "倒崁", "q": "課文「共銅管仔倒崁囥佇中央」的「倒崁」是：", "opts": ["將物品倒蓋", "提起來", "擲出去"], "ans": 0, "hint": "銅管仔先囥佇圓箍中央。", "explain": "教材註解「倒崁」為將物品倒蓋。"}, {"word": "中央", "q": "「中央 tiong-ng」是：", "opts": ["中間", "外口", "邊仔"], "ans": 0, "hint": "", "explain": "「中央」就是中間。"}, {"word": "覕", "q": "「覕 bih」是：", "opts": ["躲、藏", "叫喊", "追逐"], "ans": 0, "hint": "和覕相揣有關。", "explain": "「覕」就是躲、藏。"}, {"word": "代先", "q": "「代先 tāi-sing」是：", "opts": ["事先、預先", "最後", "突然"], "ans": 0, "hint": "", "explain": "「代先」就是事先、預先。"}, {"word": "踮", "q": "課文「踮學校內底」的「踮」較接近：", "opts": ["在……、停留", "離開", "跳起來"], "ans": 0, "hint": "", "explain": "教材註解有「在……；居住、過夜」。"}], "context": [{"word": "同齊", "q": "放學了後，我佮同學＿＿＿＿去運動中心拍籃球。", "opts": ["同齊", "覕", "代先"], "ans": 0, "hint": "", "explain": "這是教材聽力練習的生活語境。"}, {"word": "曠闊", "q": "欲辦戶外活動，愛揣一个較＿＿＿＿的所在。", "opts": ["曠闊", "向時", "中央"], "ans": 0, "hint": "", "explain": "空間寬廣適合活動。"}, {"word": "中央", "q": "運動中心門口＿＿＿＿有一个大型噴水池。", "opts": ["中央", "覕", "倒崁"], "ans": 0, "hint": "", "explain": "教材練習以「中央」表示中間位置。"}, {"word": "代先", "q": "熱門球場愛＿＿＿＿預約，才袂無位。", "opts": ["代先", "向時", "同齊"], "ans": 0, "hint": "", "explain": "「代先」可用在預先做準備。"}, {"word": "覕", "q": "耍覕相揣的時，囡仔愛揣所在＿＿＿＿起來。", "opts": ["覕", "踮", "倒崁"], "ans": 0, "hint": "", "explain": "「覕」就是躲藏。"}, {"word": "向時", "q": "＿＿＿＿庄跤無啥物娛樂，逐家會耍真濟古早遊戲。", "opts": ["向時", "中央", "代先"], "ans": 0, "hint": "", "explain": "「向時」表示從前。"}], "reading": [{"word": "", "q": "作者為啥物會想起踢銅管仔的往事？", "opts": ["接著較早同事敲來的一通電話", "看著電視節目", "學生送伊銅管仔"], "ans": 0, "hint": "課文第一段。", "explain": "一通舊同事的電話牽起五十年前的回憶。"}, {"word": "", "q": "向時作者所在的庄跤，為啥物定定耍踢銅管仔？", "opts": ["無電視通看，閣無啥物娛樂", "因為學校規定", "因為愛比賽"], "ans": 0, "hint": "", "explain": "課文寫當時電視業拄發芽，庄跤娛樂也較少。"}, {"word": "", "q": "欲耍踢銅管仔，通常愛有幾个人以上？", "opts": ["五、六个人以上", "兩个人", "一个人"], "ans": 0, "hint": "", "explain": "課文明確說人數通常五、六个人以上。"}, {"word": "", "q": "Óo-nih 離開銅管仔去掠人的時，其他人會使做啥物？", "opts": ["走出來共銅管仔踢予遠遠遠", "共銅管仔收起來", "攏袂使動"], "ans": 0, "hint": "", "explain": "Óo-nih 就愛先抾銅管仔轉原位，才會當閣出去掠人。"}, {"word": "", "q": "作者認為這陣囡仔較少耍踢銅管仔，主要原因是：", "opts": ["時代變遷、科技進步", "銅管仔完全消失", "學校禁止"], "ans": 0, "hint": "", "explain": "課文結尾直接點出時代變遷與科技進步。"}, {"word": "", "q": "本課的文體是：", "opts": ["記敘文", "說明書", "劇本"], "ans": 0, "hint": "", "explain": "教材介紹指出本篇是記敘文。"}], "comprehensive": [{"word": "", "q": "踢銅管仔和覕相揣上接近的地方是：", "opts": ["攏有覕藏佮揣人的元素", "攏愛用手機", "攏是一个人耍"], "ans": 0, "hint": "", "explain": "踢銅管仔是一種變形的捉迷藏遊戲。"}, {"word": "", "q": "若欲佇校園體驗踢銅管仔，上適合先做啥物？", "opts": ["揣曠闊閣安全的所在", "揣車上濟的所在", "佇樓梯口耍"], "ans": 0, "hint": "", "explain": "課文規則第一步就是揣較曠闊的所在。"}, {"word": "", "q": "下面佗一个是教材列出的古早囡仔物？", "opts": ["踢毽子", "VR 頭盔", "平板電腦"], "ans": 0, "hint": "", "explain": "教材延伸列有踢毽子等古早童玩。"}, {"type": "sequence", "title": "玩法排序", "q": "請共踢銅管仔開始前的步驟排好。", "items": ["揣曠闊所在", "提空銅管仔", "塗跤畫細圓箍", "銅管仔倒崁囥中央", "掠一个人做 óo-nih"], "answer": ["揣曠闊所在", "提空銅管仔", "塗跤畫細圓箍", "銅管仔倒崁囥中央", "掠一个人做 óo-nih"], "hint": "照課文第三段。", "explain": "這是課文介紹的遊戲準備流程。"}, {"type": "reflection", "title": "最後一題", "q": "你感覺古早遊戲佮這馬的遊戲，上大的無仝是啥物？", "hint": "會使對器材、場地、科技、互動來想。"}]};
const names={vocab:"🔤 課文語詞",context:"💭 語境選詞",reading:"📖 讀文理解",comprehensive:"🏆 綜合挑戰"};let bank="",set=[],i=0,score=0,tries=0;const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);function show(id){["lesson","quiz","result"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");scrollTo(0,0)}function start(b){bank=b;i=0;score=0;let src=sh(B[b]);if(b==="comprehensive"){let r=src.find(q=>q.type==="reflection");let n=src.filter(q=>q.type!=="reflection").slice(0,4);set=r?[...n,r]:n.slice(0,5)}else set=src.slice(0,5);$("qt").textContent=names[b];show("quiz");render()}function render(){tries=0;$("count").textContent=`第 ${i+1} / ${set.length} 題`;$("scoreNow").textContent=`目前 ${score} 分`;$("fill").style.width=`${(i/set.length)*100}%`;let q=set[i];let h=`<div class="kicker">${q.title||q.word||""}</div><div class="q">${q.q}</div>`;if(q.type==="sequence"){let a=sh(q.items);h+=`<div id="seq" class="seq">${a.map((x,k)=>`<div class="seqitem"><span>${x}</span><button onclick="mv(${k},-1)">↑</button><button onclick="mv(${k},1)">↓</button></div>`).join("")}</div><div class="actions"><button class="btn" onclick="checkSeq()">檢查順序</button></div>`}else if(q.type==="reflection"){h+=`<textarea id="txt" placeholder="請用一句話寫看覓……"></textarea><div class="actions"><button class="btn" onclick="reflect()">送出</button></div>`}else{h+=`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" onclick="choose(${k},this)">${String.fromCharCode(65+k)}｜${o}</button>`).join("")}</div>`}h+=`<div id="feedback"></div>`;$("qcard").innerHTML=h}function fb(cls,t,next=false){$("feedback").innerHTML=`<div class="fb ${cls}">${t}</div>${next?'<div class="actions"><button class="btn" onclick="next()">下一題 →</button></div>':""}`}function choose(k,el){let q=set[i];if(document.querySelector(".opt.correct"))return;tries++;if(k===q.ans){el.classList.add("correct");score++;fb("ok",`✅ 著矣！<br>${q.explain}`,true)}else{el.classList.add("wrong");if(tries===1)fb("hint",`🤔 閣想看覓！<br>${q.hint}`);else{document.querySelectorAll(".opt")[q.ans].classList.add("correct");fb("bad",`答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}`,true)}}}function mv(k,d){let s=$("seq"),it=[...s.children],j=k+d;if(j<0||j>=it.length)return;if(d<0)s.insertBefore(it[k],it[j]);else s.insertBefore(it[j],it[k]);[...s.children].forEach((e,n)=>{let b=e.querySelectorAll("button");b[0].setAttribute("onclick",`mv(${n},-1)`);b[1].setAttribute("onclick",`mv(${n},1)`)})}function checkSeq(){let q=set[i];tries++;let a=[...$("seq").children].map(x=>x.querySelector("span").textContent),ok=JSON.stringify(a)===JSON.stringify(q.answer);if(ok){score++;fb("ok",`✅ 順序著矣！<br>${q.explain}`,true)}else if(tries===1)fb("hint",`🤔 閣排看覓！<br>${q.hint}`);else fb("bad",`正確順序：<b>${q.answer.join(" → ")}</b><br>${q.explain}`,true)}function reflect(){let t=($("txt").value||"").trim();if(!t)return fb("hint","請先寫一句你的想法。");score++;fb("ok","💬 收著你的想法矣！這題無標準答案，重點是共課文佮生活連起來。",true)}function next(){i++;if(i>=set.length)finish();else render()}function finish(){$("fill").style.width="100%";$("final").textContent=`${score} / ${set.length}`;$("msg").textContent=score===5?"🏆 語境高手！":score>=4?"🌟 語感真𠢕！":score>=3?"👍 愈來愈會曉！":"🌱 閣試一擺，會愈來愈熟。";show("result")}
</script></body></html>
