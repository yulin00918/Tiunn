<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>講咱的話｜語境挑戰</title><style>body{margin:0;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f5f7f3;color:#34443e}.wrap{max-width:920px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between}.hero{text-align:center;padding:25px}.icon{font-size:48px}h1{font-size:40px;margin:8px}.card{background:white;border:1px solid #e3e7e2;border-radius:24px;padding:28px;box-shadow:0 10px 28px #0000000d}.q{font-size:23px;font-weight:700;line-height:1.65}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.opt,button{font:inherit}.opt{padding:14px;border:1px solid #dfe5df;border-radius:15px;background:white;text-align:left;cursor:pointer}.correct{background:#eaf6ed!important}.wrong{background:#fff0ee!important}.feedback{margin-top:16px;padding:14px;background:#faf9f4;border-radius:14px;min-height:55px}.nav{display:flex;justify-content:space-between;margin-top:18px}.btn{border:0;border-radius:999px;padding:10px 16px;cursor:pointer}.primary{background:#718f82;color:white}.ghost{background:white;border:1px solid #dfe5df}.progress{height:9px;background:#e2e7e2;border-radius:99px;margin-bottom:24px;overflow:hidden}.bar{height:100%;background:#718f82}.done{text-align:center}.hidden{display:none}@media(max-width:600px){.opts{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="top"><button class="btn ghost" onclick="history.back()">← 返回</button><span>康軒｜第一冊</span></div>
<div class="hero"><div class="icon">🗣️</div><h1>第1課｜講咱的話</h1><p>課文挑戰｜看情境・揣線索・理解語意</p></div><div class="progress"><div class="bar" id="bar"></div></div><div id="quiz"></div><div id="done" class="card done hidden"><div class="icon">🏆</div><h2>完成本課挑戰！</h2><p id="score"></p><button class="btn primary" onclick="restart()">閣挑戰一擺</button></div></div>
<script>const qs=[{"type": "課文語詞", "q": "為著欲了解病人講的閩南語，朱子宏醫師下真濟＿＿。", "opts": ["工夫", "喙焦", "跤跡", "載具"], "ans": "工夫", "ex": "依課文語意，學習語言需要「下工夫」。"}, {"type": "語境選詞", "q": "醫師若會曉用閩南語佮老大人＿＿，就會當閣較了解病人的症頭。", "opts": ["交談", "鬥陣", "止喙焦", "拍算"], "ans": "交談", "ex": "課文談到醫療現場用閩南語與長者溝通。"}, {"type": "句型理解", "q": "阿芸＿＿唱歌好聽，閣真𠢕講笑詼。", "opts": ["毋但", "雖然", "若是", "連"], "ans": "毋但", "ex": "教材句型是「毋但……，閣……」。"}, {"type": "情境理解", "q": "想欲予語言佮文化繼續傳承落去，較適合的做法是＿＿。", "opts": ["較捷講閩南語", "攏毋講", "干焦看華語", "毋免佮人交談"], "ans": "較捷講閩南語", "ex": "課文鼓勵珍惜土地上的語言文化並多使用閩南語。"}, {"type": "綜合挑戰", "q": "夜市頭家喝：「買會著，較贏九斗換一石；買袂著，心肝會礙虐。」這段主要展現＿＿。", "opts": ["叫賣語言的趣味", "醫療用語", "運動精神", "電子發票"], "ans": "叫賣語言的趣味", "ex": "教材以夜市叫賣與鬥句呈現閩南語的趣味。"}];let i=0,score=0,answered=false;
function render(){if(i>=qs.length){quiz.innerHTML='';done.classList.remove('hidden');scoreEl=document.getElementById('score');scoreEl.textContent='你答著 '+score+' / '+qs.length+' 題';bar.style.width='100%';return}answered=false;let q=qs[i];bar.style.width=((i+1)/qs.length*100)+'%';quiz.innerHTML=`<div class="card"><b>第 ${i+1} 關｜${q.type}</b><p class="q">${q.q}</p><div class="opts">${q.opts.map((x,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}　${x}</button>`).join('')}</div><div class="feedback">選一个上適合的答案。</div><div class="nav"><button class="btn ghost" onclick="prev()">← 頂一關</button><button class="btn primary" id="nextBtn" onclick="next()" disabled>下一關 →</button></div></div>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b))}
function choose(b){if(answered)return;answered=true;let q=qs[i],v=q.opts[+b.dataset.n];document.querySelectorAll('.opt').forEach(x=>{if(q.opts[+x.dataset.n]===q.ans)x.classList.add('correct')});if(v===q.ans)score++;else b.classList.add('wrong');document.querySelector('.feedback').textContent=(v===q.ans?'✅ 答著矣！ ':'💡 正確答案：'+q.ans+'。 ')+q.ex;nextBtn.disabled=false}
function next(){if(answered){i++;render()}}function prev(){if(i>0){i--;render()}}function restart(){i=0;score=0;done.classList.add('hidden');render()}render();</script></body></html>
