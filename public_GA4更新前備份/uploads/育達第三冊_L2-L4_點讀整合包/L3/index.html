<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第三課｜雞卵糕</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#3a3d4d;background:linear-gradient(180deg,#f2f4ff,#fbf9f6);min-height:100vh}main{max-width:980px;margin:auto;padding:32px 18px 70px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;flex-wrap:wrap}.badge{display:inline-block;background:#dfe4f7;color:#4a5490;padding:7px 12px;border-radius:999px;font-size:13px}h1{font-size:32px;margin:10px 0 4px}.sub{color:#7a7d8c;font-size:14px}.tabs{display:flex;gap:8px;margin:18px 0}button{font:inherit;cursor:pointer}.tab{border:1px solid #dfe1ee;background:#fff;color:#555d80;padding:9px 14px;border-radius:12px}.tab.on{background:#59638f;color:#fff}.player{position:sticky;top:8px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#ffffffee;border:1px solid #dfe1ee;border-radius:16px;padding:11px;box-shadow:0 8px 24px #3c426e14}.player button{border:1px solid #dfe1ee;background:#fff;padding:8px 10px;border-radius:10px}.bar{height:6px;background:#e6e8f2;flex:1;min-width:120px;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#6f7fd8;width:0}.card{background:#ffffffc7;border:1px solid #dfe1ee;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #3c426e10}.card.playing{border-color:#7c87ca;background:#f5f6ff}.row{display:flex;align-items:center;gap:10px;margin-bottom:12px}.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e4e8f8;color:#4a5490;font-weight:700}.play{margin-left:auto;border:1px solid #dfe1ee;background:#fff;padding:7px 10px;border-radius:10px}.group{font-size:12px;color:#8a6d3b;background:#f5ead5;border-radius:99px;padding:4px 9px}.text{font-size:19px;line-height:1.95;white-space:pre-line}.word{color:#5968b3;font-weight:700;border-bottom:1px dotted #5968b3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.v{display:grid;grid-template-columns:40px 1fr auto;gap:10px}.roman{color:#5b68b0;font-size:14px;margin:2px 0 5px}.gloss{color:#747887;font-size:14px;line-height:1.6}.speaker{border:0;background:#e4e8f8;width:38px;height:38px;border-radius:50%}.hidden{display:none}.note{font-size:13px;color:#676d8a;background:#e9ecfa;padding:12px 14px;border-radius:12px;margin-top:14px}@media(max-width:600px){h1{font-size:26px}.text{font-size:18px}main{padding:22px 12px 55px}}
</style></head><body><main><div class="head"><div><span class="badge">🎧 育達版・第三冊</span><h1 id="title"></h1><div class="sub">外框一致｜內容呈現：<span id="type"></span></div></div><div class="sub" id="author"></div></div><div class="tabs"><button class="tab on" data-tab="read">📖 課文點讀</button><button class="tab" data-tab="vocab">🗣️ 語詞點讀</button></div><section id="read"><div class="player"><button id="all">▶ 全文連續播放</button><button id="pause">⏸ 暫停</button><button id="restart">↺ 重播</button><select id="speed"><option>.75</option><option selected>1</option><option>1.25</option></select><div class="bar"><i></i></div><span id="status" class="sub">尚未播放</span></div><div id="segments"></div><div class="note">💡 點段落或播放鍵播放出版社原音；語詞保留在原句中，點語詞只播放語詞音檔，不會同時觸發整段。</div></section><section id="vocab" class="hidden"><div class="grid" id="vgrid"></div></section></main><script>
const TITLE="第三課｜雞卵糕",AUTHOR="田美瑜",TYPE="散文・段落式";const SEG=[{"group": "", "text": "印象內面的雞卵糕，總是軟軟甜甜，內底有誠濟我細漢甜蜜的記持。以早較艱苦，囡仔人罕得咧過生日，上加是阿母煠一粒卵予阮食，就歡喜幾若工矣，若想欲食雞卵糕，實在愛家境袂䆀才有法度。", "audio": "lesson-001.mp3"}, {"group": "", "text": "彼當陣厝裡頭喙濟，我是上細漢的查某囡仔，三个阿兄攏真𠢕讀冊，考試提頭名就親像桌頂拈柑，干焦我排袂著生相。", "audio": "lesson-002.mp3"}, {"group": "", "text": "不而過，阿爸佮阿母袂因為按呢就來罵我，嘛誠尊重我的興趣。", "audio": "lesson-003.mp3"}, {"group": "", "text": "這馬認真想起來，以早逐年阮兜食雞卵糕，攏是佇我的生日。佇彼个重男輕女的時代，真正誠罕見。", "audio": "lesson-004.mp3"}, {"group": "", "text": "阿母講過伊足想欲生一个查某囡仔，尤其是生三兄的時，因為伊生做誠古錐，兩蕊目睭足大蕊閣肨奶肨奶，皮膚真白，阿母佮阿爸攏講：「伊若是查某囡仔，毋知有偌好咧！」", "audio": "lesson-005.mp3"}, {"group": "", "text": "莫怪若拄著阿爸的同事，𪜶攏會講：「恁阿爸知影恁阿母生你的時，歡頭喜面，那唱歌那呼噓仔轉來看恁阿母佮你喔！」", "audio": "lesson-006.mp3"}, {"group": "", "text": "就是因為按呢，所以我自出世就一直受著爸母的疼痛。毋過，細漢的時較毋捌代誌，足愛變鬼變怪，齣頭有夠濟。", "audio": "lesson-007.mp3"}, {"group": "", "text": "細漢欣羨別人有雞卵糕通食，真正是會曉吵的囡仔才有糖仔通食，我生日彼工誠實食著雞卵糕，閣是上出名的臺中「神仙雞卵糕」。雞卵糕軟軟閣綿綿，彼種滿足的記持，到今攏印佇我的頭殼內。", "audio": "lesson-008.mp3"}],VOC=[{"num": "01", "word": "罕得", "roman": "hán-tit", "gloss": "稀罕、難得、稀少", "audio": "vocab-01.mp3"}, {"num": "02", "word": "頭喙", "roman": "thâu-tshuì", "gloss": "指家中人口", "audio": "vocab-02.mp3"}, {"num": "03", "word": "桌頂拈柑", "roman": "toh-tíng ni kam", "gloss": "用手指頭拈取桌上的橘子，比喻事情極其容易", "audio": "vocab-03.mp3"}, {"num": "04", "word": "生相", "roman": "senn-siùnn / sinn-siùnn", "gloss": "生肖", "audio": "vocab-04.mp3"}, {"num": "05", "word": "肨奶", "roman": "hàng-ling / hàng-ni", "gloss": "嬰兒肥。形容嬰兒長得白白嫩嫩", "audio": "vocab-05.mp3"}, {"num": "06", "word": "呼噓仔", "roman": "khoo-si-á", "gloss": "吹口哨", "audio": "vocab-06.mp3"}, {"num": "07", "word": "變鬼變怪", "roman": "pìnn-kuí-pìnn-kuài", "gloss": "搞鬼、耍花招、故弄玄虛", "audio": "vocab-07.mp3"}, {"num": "08", "word": "齣頭", "roman": "tshut-thâu", "gloss": "把戲、花樣", "audio": "vocab-08.mp3"}];const BASE='audio/';let a=new Audio();a.preload='none';let cur=0,cont=false,kind='';document.querySelector('#title').textContent=TITLE;document.querySelector('#author').textContent=AUTHOR;document.querySelector('#type').textContent=TYPE;
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function mark(s){let out=esc(s);[...VOC].sort((x,y)=>y.word.length-x.word.length).forEach((v,i)=>{let idx=VOC.indexOf(v);out=out.split(v.word).join(`<span class="word" data-v="${idx}">${v.word}</span>`)});return out}
const segbox=document.querySelector('#segments');SEG.forEach((s,i)=>{let e=document.createElement('article');e.className='card';e.dataset.i=i;e.innerHTML=`<div class="row"><span class="num">${i+1}</span><b>第 ${i+1} 段</b>${s.group?`<span class="group">${s.group}</span>`:''}<button class="play">▶ 播放</button></div><div class="text">${mark(s.text)}</div>`;e.addEventListener('click',ev=>{let w=ev.target.closest('.word');if(w){ev.stopPropagation();playV(+w.dataset.v);return}playSeg(i,false)});e.querySelector('.play').onclick=ev=>{ev.stopPropagation();playSeg(i,false)};segbox.append(e)});
const vg=document.querySelector('#vgrid');VOC.forEach((v,i)=>{let e=document.createElement('article');e.className='card v';e.innerHTML=`<span class="num">${v.num}</span><div><b style="font-size:20px">${v.word}</b><div class="roman">${v.roman}</div><div class="gloss">${v.gloss}</div></div><button class="speaker">🔊</button>`;e.querySelector('button').onclick=()=>playV(i);vg.append(e)});
function resetCards(){document.querySelectorAll('.card.playing').forEach(x=>x.classList.remove('playing'))}function playSeg(i,c){cur=i;cont=c;kind='seg';resetCards();document.querySelector(`article[data-i="${i}"]`).classList.add('playing');a.src=BASE+SEG[i].audio;a.playbackRate=+document.querySelector('#speed').value;a.play();document.querySelector('#status').textContent=`播放第 ${i+1} 段`}function playV(i){cont=false;kind='v';resetCards();a.src=BASE+VOC[i].audio;a.playbackRate=1;a.play();document.querySelector('#status').textContent=`語詞：${VOC[i].word}`}a.ontimeupdate=()=>{document.querySelector('.bar i').style.width=(a.duration?a.currentTime/a.duration*100:0)+'%'};a.onended=()=>{if(kind==='seg'&&cont&&cur<SEG.length-1)playSeg(cur+1,true);else{cont=false;document.querySelector('#status').textContent='播放完成';resetCards()}};document.querySelector('#all').onclick=()=>playSeg(cur,true);document.querySelector('#pause').onclick=()=>{if(a.paused)a.play();else a.pause()};document.querySelector('#restart').onclick=()=>{a.currentTime=0;a.play()};document.querySelector('#speed').onchange=e=>a.playbackRate=+e.target.value;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelector('#read').classList.toggle('hidden',b.dataset.tab!=='read');document.querySelector('#vocab').classList.toggle('hidden',b.dataset.tab!=='vocab')});
</script></body></html>
