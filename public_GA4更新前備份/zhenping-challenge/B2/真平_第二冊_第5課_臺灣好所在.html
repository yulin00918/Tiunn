<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>臺灣好所在｜真平第二冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style></head><body><div class="app"><div class="top"><a class="pill" href="../../語境填空.dc.html">← 返回整冊</a><span class="pill">📗 真平・第二冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第5課｜臺灣好所在</h1><p>臺灣地名、地形與族群文化</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文與人物、景物的意義。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文概念運用到生活情境。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">語詞關 10 題，其餘各關 5 題；答題後立即顯示解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「崁」佇課文是指啥物？","o":["山崖","港口","平原"],"a":0,"e":"教材例句「這个山崁誠懸」。"},{"q":"「崎」是啥物地形？","o":["斜坡","海灣","島嶼"],"a":0,"e":"教材用「落崎」形容下坡。"},{"q":"「捅」佇「海面捅出去」是指？","o":["突出、顯露","沉落水底","完全消失"],"a":0,"e":"三貂角是向海面突出的一塊海角。"},{"q":"「罔」佇課文較接近？","o":["姑且、將就","一定","完全禁止"],"a":0,"e":"教材將「罔」解作姑且、將就。"},{"q":"「源由」是指？","o":["事物的起源原因","地方的大小","現在的天氣"],"a":0,"e":"文章探討地名的來源。"},{"q":"「號名」是咧做啥物？","o":["命名","搬家","爬山"],"a":0,"e":"地名的「號名」就是取名字。"},{"q":"「崙、崁、坪、坑、角、崎」較常反映啥物？","o":["地形特色","人物年齡","學校科目"],"a":0,"e":"課文說這些字反映地方過去的地形。"},{"q":"「大甲社」佇課文是啥物？","o":["大甲較早的地名","鹿港的別稱","三峽的舊名"],"a":0,"e":"「大甲社」在這題指的是「大甲較早的地名」。課文說大甲古早號做大甲社。"},{"q":"「艋舺」佇課文是佗位的舊名？","o":["萬華","三峽","鹿港"],"a":0,"e":"萬華舊稱艋舺。"},{"q":"「半線」佇補充對話指佗位？","o":["彰化","新竹","臺南"],"a":0,"e":"課文對話註解「半線」是彰化舊地名。"}],"context":[{"q":"山路有一段斜斜的＿＿，落去的時陣愛較細膩。","o":["崎","崁","港"],"a":0,"e":"「崎」指斜坡；「崁」指山崖，兩者地形無仝。"},{"q":"頭前彼台車的貨物＿＿出來，莫傷倚近。","o":["捅","睏","聽"],"a":0,"e":"捅表示突出。"},{"q":"這个山＿＿誠懸，莫傷倚近。","o":["崁","船","田"],"a":0,"e":"崁是山崖。"},{"q":"臺灣各地的地名攏有伊的＿＿，查一下就會知影。","o":["源由","價錢","戲票"],"a":0,"e":"文章鼓勵查詢地名來源。"},{"q":"伊干焦＿＿講爾爾，你毋免當做已經確定。","o":["罔","一定","永遠"],"a":0,"e":"教材第30張以「這件代誌伊是罔講爾爾，你罔聽就好」說明「罔」有姑且、將就的意思；本題要看「罔講」的語境，毋是當做確定消息。"}],"reading":[{"q":"三峽舊名「三角湧」佮啥物有關？","o":["溪流匯流形成的三角形平原","當地出產鹿角","西班牙人的命名"],"a":0,"e":"課文指出橫溪、三峽溪與大漢溪的匯流地形。"},{"q":"三貂角這个地名佮佗一項有關？","o":["西班牙語名稱的音轉","鹿皮出口","獨木舟交易"],"a":0,"e":"課文第14至15張指出西班牙人稱當地為「聖地牙哥」（San diego），後來音轉做「三貂角」，這是地名受其他語言影響的例子。"},{"q":"大甲的名稱佮啥物有關？","o":["道卡斯族族稱的音譯","三條溪的匯流","鹿角出口"],"a":0,"e":"教材說大甲來自 Taokas 音譯。"},{"q":"鹿港地名佮啥物有關？","o":["較早鹿皮、鹿角的出口貿易","山崖很高","獨木舟的族語名稱"],"a":0,"e":"課文以鹿港說明特產、歷史與地名的關係。"},{"q":"萬華舊名「艋舺」佮啥物有關？","o":["平埔族語中獨木舟的音譯","西班牙人的聖地牙哥","三角形平原"],"a":0,"e":"課文指出艋舺由 Banka 音譯。"}],"comprehensive":[{"q":"研究一个地名的源由，佗一个方法較可靠？","o":["查地方文史資料，閣比對其他來源","只憑字面猜想","聽一个傳聞就當做定論"],"a":0,"e":"課文鼓勵調查地名由來。"},{"q":"看到地名有「崁」字，可以先提出啥物假設？","o":["可能佮山崖地形有關，猶原愛查證","一定是港口","一定是西班牙語"],"a":0,"e":"崁是地形線索，但不能只憑一字斷定。"},{"q":"有人講臺灣地名攏是華語命名，較適當的回應是？","o":["地名也受族群語言與歷史影響","每个地名攏是仝一个人命名","地名攏無歷史"],"a":0,"e":"文章列出道卡斯族語與西班牙語的例子。"},{"q":"欲紹介萬華「艋舺」的源由，佗个資料較重要？","o":["早期河運、族語與交易歷史","現代捷運票價","附近的百貨公司折扣"],"a":0,"e":"艋舺與獨木舟及交易活動有關。"},{"q":"地名研究報告最符合課文主旨的結論是？","o":["地名保存地形、族群與歷史的記憶","地名干焦是地址代號","舊地名攏無研究價值"],"a":0,"e":"課文透過多種例子說明地名的文化意義。"}]};let S=[],i=0,sc=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(k){S=shuffle(BANK[k]).slice(0,k==='vocab'?10:5);i=0;sc=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');render()}function render(){locked=false;let x=S[i];num.textContent=`第 ${i+1} / ${S.length} 題`;bar.style.width=`${i/S.length*100}%`;q.textContent=x.q;fb.textContent='選一个答案。';next.classList.add('hide');opts.innerHTML='';shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{let b=document.createElement('button');b.className='opt';b.textContent=z.v;b.onclick=()=>answer(z.idx,b);opts.appendChild(b)})}function answer(k,el){if(locked)return;locked=true;let x=S[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);if(k===x.a){sc++;el.classList.add('ok');fb.textContent='✅ '+x.e}else{el.classList.add('bad');bs.find(b=>b.textContent===x.o[x.a])?.classList.add('ok');fb.textContent='答案：'+x.o[x.a]+'。 '+x.e}next.classList.remove('hide')}function nextQ(){i++;if(i>=S.length){quiz.classList.add('hide');result.classList.remove('hide');score.textContent=`${sc} / ${S.length}`;msg.textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。'}else render()}function backHome(){result.classList.add('hide');home.classList.remove('hide')};</script></body></html>
