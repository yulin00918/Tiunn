te-columns:1fr}.q{font-size:23px}}</style><meta name="author" content="張鈺聆">

</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第三冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>語文天地二｜擬聲詞</h1><p>擬聲詞、語境判斷與生活應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文的意象、情感與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文理解運用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「摳摳叫」佇這課的意思是？","o":["蠓仔飛行的聲音","咀嚼酥脆食物的聲音","物件碰撞的聲音"],"a":1,"e":"「摳摳叫」佇教材的解說是「咀嚼酥脆食物的聲音」；其餘兩項是不同意思，袂當互相替換。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「摳摳叫」的用法。"},{"q":"「鼾鼾叫」佇這課的意思是？","o":["細隻動物尖細的聲音","物件落入井中的聲音","睏覺打呼的聲音"],"a":2,"e":"「鼾鼾叫」佇教材的解說是「睏覺打呼的聲音」；其餘兩項是不同意思，袂當互相替換。","h":"比較選項的意思，想看啥一个符合「鼾鼾叫」佇課文內底的用法。"},{"q":"「窸窣叫」佇這課的例句是描寫啥物聲？","o":["食麵抑是啉湯的聲音","狗因為疼痛哀叫的聲音","機車發動的聲音"],"a":0,"e":"教材學習單用「阿兄啉湯啉甲窸窣叫」做例句；本題依這个例句判斷，毋是講所有喝湯聲攏一定仝款。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「嗚嗚叫」佇這課的意思是？","o":["物件碰撞的聲音","蠓仔飛行的聲音","車仔鳴喇叭的聲音"],"a":1,"e":"「嗚嗚叫」佇教材的解說是「蠓仔飛行的聲音」；其餘兩項是不同意思，袂當互相替換。","h":"先看「嗚嗚叫」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「吱吱叫」佇這課的意思是？","o":["物件落入井中的聲音","咀嚼酥脆食物的聲音","細隻動物尖細的聲音"],"a":2,"e":"「吱吱叫」佇教材的解說是「細隻動物尖細的聲音」；其餘兩項是不同意思，袂當互相替換。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「吱吱叫」的用法。"},{"q":"「喈喈叫」佇這課的意思是？","o":["狗因為疼痛哀叫的聲音","機車發動的聲音","睏覺打呼的聲音"],"a":0,"e":"「喈喈叫」佇教材的解說是「狗因為疼痛哀叫的聲音」；其餘兩項是不同意思，袂當互相替換。","h":"比較選項的意思，想看啥一个符合「喈喈叫」佇課文內底的用法。"},{"q":"「吭」佇這課的意思是？","o":["車仔鳴喇叭的聲音","物件碰撞的聲音","食麵抑是啉湯的聲音"],"a":1,"e":"「吭」佇教材的解說是「物件碰撞的聲音」；其餘兩項是不同意思，袂當互相替換。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「丼」佇這課的意思是？","o":["咀嚼酥脆食物的聲音","蠓仔飛行的聲音","物件落入井中的聲音"],"a":2,"e":"「丼」佇教材的解說是「物件落入井中的聲音」；其餘兩項是不同意思，袂當互相替換。","h":"先看「丼」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「吭吭叫」佇這課的意思是？","o":["機車發動的聲音","睏覺打呼的聲音","細隻動物尖細的聲音"],"a":0,"e":"「吭吭叫」佇教材的解說是「機車發動的聲音」；其餘兩項是不同意思，袂當互相替換。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「吭吭叫」的用法。"},{"q":"「哹哹叫」佇這課的意思是？","o":["食麵抑是啉湯的聲音","車仔鳴喇叭的聲音","狗因為疼痛哀叫的聲音"],"a":1,"e":"「哹哹叫」佇教材的解說是「車仔鳴喇叭的聲音」；其餘兩項是不同意思，袂當互相替換。","h":"比較選項的意思，想看啥一个符合「哹哹叫」佇課文內底的用法。"}],"context":[{"q":"半暝蠓仔佇耳空邊飛，發出「＿＿」的聲。","o":["摳摳叫","吱吱叫","嗚嗚叫"],"a":2,"e":"題幹的線索是「半暝蠓仔佇耳空邊飛，發出「（空格）」的聲。」；此處要表達「嗚嗚叫」的用法，另外兩項不符合這个情境。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"隔壁阿兄睏甲「＿＿」，我睏袂落眠。","o":["鼾鼾叫","嗚嗚叫","吭"],"a":0,"e":"題幹的線索是「隔壁阿兄睏甲「（空格）」，我睏袂落眠。」；此處要表達「鼾鼾叫」的用法，另外兩項不符合這个情境。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"車仔一直按喇叭，發出「＿＿」的聲。","o":["吱吱叫","哹哹叫","丼"],"a":1,"e":"題幹的線索是「車仔一直按喇叭，發出「（空格）」的聲。」；此處要表達「哹哹叫」的用法，另外兩項不符合這个情境。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"阿兄啉湯啉甲「＿＿」。","o":["丼","摳摳叫","窸窣叫"],"a":2,"e":"題幹的線索是「阿兄啉湯啉甲「（空格）」。」；此處要表達「窸窣叫」的用法，另外兩項不符合這个情境。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"門雄雄相碰，「＿＿」一聲。","o":["吭","哹哹叫","窸窣叫"],"a":0,"e":"題幹的線索是「門雄雄相碰，「（空格）」一聲。」；此處要表達「吭」的用法，另外兩項不符合這个情境。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"}],"reading":[{"q":"「鼾鼾叫」是佗一類擬聲詞？","o":["人發出的聲音","動物發出的聲音","物件發出的聲音"],"a":0,"e":"本題問的是「「鼾鼾叫」是佗一類擬聲詞？」；依教材的分類抑是例句，應選「人發出的聲音」，另外兩項無符合題目所指的用法。","h":"先分清楚題目問的是事情經過、人物想法，抑是作者的描寫。"},{"q":"「喈喈叫」佇教材指啥物聲？","o":["人發出的聲音","機車的聲音","狗因為疼痛哀叫"],"a":2,"e":"本題問的是「「喈喈叫」佇教材指啥物聲？」；依教材的分類抑是例句，應選「狗因為疼痛哀叫」，另外兩項無符合題目所指的用法。","h":"想想課文提供啥物線索，答案愛有文本根據，毋通干焦用印象猜。"},{"q":"「吭吭叫」通常形容啥物？","o":["機車的聲音","人發出的聲音","狗因為疼痛哀叫"],"a":0,"e":"本題問的是「「吭吭叫」通常形容啥物？」；依教材的分類抑是例句，應選「機車的聲音」，另外兩項無符合題目所指的用法。","h":"比較前後段落的變化，留意作者用啥物細節支持這个意思。"},{"q":"擬聲詞的主要功能是？","o":["人發出的聲音","模仿聲音，予描寫較生動","狗因為疼痛哀叫"],"a":1,"e":"本題問的是「擬聲詞的主要功能是？」；依教材的分類抑是例句，應選「模仿聲音，予描寫較生動」，另外兩項無符合題目所指的用法。","h":"先確認題目問的重點，再回想課文內底對應的情節或句子。"},{"q":"教材指出，擬聲詞用啥物書寫方式會較生動？","o":["羅馬字","阿拉伯數字","標點符號"],"a":0,"e":"教材說明擬聲詞寫羅馬字較生動，因為可呈現模仿聲音的特色。","h":"先回想課文相關段落，找出人物、事件佮原因之間的關係。"}],"comprehensive":[{"q":"欲描寫食脆餅的聲，較適當的是？","o":["摳摳叫","吱吱叫","吭吭叫"],"a":0,"e":"本題問的是「欲描寫食脆餅的聲，較適當的是？」；依教材的分類抑是例句，應選「摳摳叫」，另外兩項無符合題目所指的用法。","h":"把課文的觀念帶入這个情境，想想實際發生時會按怎判斷。"},{"q":"欲描寫鳥鼠發出尖細的聲，較適當的是？","o":["摳摳叫","吱吱叫","吭吭叫"],"a":1,"e":"本題問的是「欲描寫鳥鼠發出尖細的聲，較適當的是？」；依教材的分類抑是例句，應選「吱吱叫」，另外兩項無符合題目所指的用法。","h":"毋通只看單一詞語，愛連同人物、原因佮結果做伙考慮。"},{"q":"欲描寫機車聲，較適當的是？","o":["摳摳叫","吱吱叫","吭吭叫"],"a":2,"e":"本題問的是「欲描寫機車聲，較適當的是？」；依教材的分類抑是例句，應選「吭吭叫」，另外兩項無符合題目所指的用法。","h":"先找出題目欲你判斷的核心，再排除無符合情境的選項。"},{"q":"欲描寫狗因為疼痛哀叫，較適當的是？","o":["喈喈叫","摳摳叫","吱吱叫"],"a":0,"e":"本題問的是「欲描寫狗因為疼痛哀叫，較適當的是？」；依教材的分類抑是例句，應選「喈喈叫」，另外兩項無符合題目所指的用法。","h":"想想課文的重點佮這个新情境有啥物關係，再做決定。"},{"q":"欲描寫物件掉入井裡的聲，較適當的是？","o":["摳摳叫","丼","吱吱叫"],"a":1,"e":"本題問的是「欲描寫物件掉入井裡的聲，較適當的是？」；依教材的分類抑是例句，應選「丼」，另外兩項無符合題目所指的用法。","h":"比較各選項可能造成的結果，揀一項最符合題目條件的。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
