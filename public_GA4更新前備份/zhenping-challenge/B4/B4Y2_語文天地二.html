<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>語文天地二｜真平第四冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style><meta name="author" content="張鈺聆">

</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第四冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>語文天地二｜連接詞（二）</h1><p>連接詞（二）、語境判斷與生活應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文的意象、情感與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文理解運用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「愈」用佇「愈來愈」的句型，主要表達啥物意思？","o":["還是","愈來愈","才"],"a":1,"e":"「愈……愈……」表示程度隨條件或時間增加；本題選項「愈來愈」是句型提示，毋是單字「愈」的完整詞義。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「愈」的用法。"},{"q":"「毋但」佇這課的意思是？","o":["假如、如果","不論、無論","不只"],"a":2,"e":"「毋但」佇教材的解說是「不只」；其餘兩項是不同意思，袂當互相替換。","h":"比較選項的意思，想看啥一个符合「毋但」佇課文內底的用法。"},{"q":"「毋過」佇這課的意思是？","o":["不過、但是","即使、就算是","程度逐漸增加抑是遞進"],"a":0,"e":"「毋過」佇教材的解說是「不過、但是」；其餘兩項是不同意思，袂當互相替換。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「猶是」佇這課的意思是？","o":["才","還是","前後語意有轉變"],"a":1,"e":"「猶是」佇教材的解說是「還是」；其餘兩項是不同意思，袂當互相替換。","h":"先看「猶是」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「假使」佇這課的意思是？","o":["不論、無論","愈來愈","假如、如果"],"a":2,"e":"「假使」佇教材的解說是「假如、如果」；其餘兩項是不同意思，袂當互相替換。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「假使」的用法。"},{"q":"「準做」佇這課的意思是？","o":["即使、就算是","程度逐漸增加抑是遞進","不只"],"a":0,"e":"「準做」佇教材的解說是「即使、就算是」；其餘兩項是不同意思，袂當互相替換。","h":"比較選項的意思，想看啥一个符合「準做」佇課文內底的用法。"},{"q":"「毋才」佇這課的例句內底，主要表示啥物意思？","o":["前後語意有轉變","才","不過、但是"],"a":1,"e":"本題暫以原題庫的「才」做答案；「毋才」的實際用法須對照出版社原句確認，無法單靠單詞直接定義。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「毋管」佇這課的意思是？","o":["愈來愈","還是","不論、無論"],"a":2,"e":"「毋管」佇教材的解說是「不論、無論」；其餘兩項是不同意思，袂當互相替換。","h":"先看「毋管」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「漸進」佇這課的意思是？","o":["程度逐漸增加抑是遞進","不只","假如、如果"],"a":0,"e":"「漸進」佇教材的解說是「程度逐漸增加抑是遞進」；其餘兩項是不同意思，袂當互相替換。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「漸進」的用法。"},{"q":"「轉折」佇這課的意思是？","o":["不過、但是","前後語意有轉變","即使、就算是"],"a":1,"e":"「轉折」佇教材的解說是「前後語意有轉變」；其餘兩項是不同意思，袂當互相替換。","h":"比較選項的意思，想看啥一个符合「轉折」佇課文內底的用法。"}],"context":[{"q":"這領衫真媠，＿＿無合我的意。","o":["愈","假使","毋過"],"a":2,"e":"題幹的線索是「這領衫真媠，（空格）無合我的意。」；此處要表達「毋過」的用法，另外兩項不符合這个情境。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"＿＿明仔載落雨，咱就莫出去。","o":["假使","毋過","毋才"],"a":0,"e":"題幹的線索是「（空格）明仔載落雨，咱就莫出去。」；此處要表達「假使」的用法，另外兩項不符合這个情境。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"伊＿＿會曉唱歌，閣會曉跳舞。","o":["毋但","毋過","假使"],"a":0,"e":"「毋但……閣……」表達不只會唱歌，還會跳舞，後半句增加一項能力。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"準做你無佮意這項菜，嘛毋通隨便擲捔。這句的「準做」是啥物意思？","o":["即使、就算是","不只、而且","不過、但是"],"a":0,"e":"出版社學習單以「準做……嘛……」表示即使如此仍不應做某事；選「即使、就算是」。","h":"把題目放轉去生活情境想一擺，確認詞語佮前後文接起來自然無。"},{"q":"＿＿做啥物頭路，攏愛認真。","o":["毋管","轉折","毋過"],"a":0,"e":"題幹的線索是「（空格）做啥物頭路，攏愛認真。」；此處要表達「毋管」的用法，另外兩項不符合這个情境。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"}],"reading":[{"q":"「毋過」表示啥物關係？","o":["轉折","漸進","假設"],"a":0,"e":"本題問的是「「毋過」表示啥物關係？」；依教材的分類抑是例句，應選「轉折」，另外兩項無符合題目所指的用法。","h":"先分清楚題目問的是事情經過、人物想法，抑是作者的描寫。"},{"q":"「假使」表示啥物關係？","o":["假設","漸進","轉折"],"a":0,"e":"本題問的是「「假使」表示啥物關係？」；依教材的分類抑是例句，應選「假設」，另外兩項無符合題目所指的用法。","h":"想想課文提供啥物線索，答案愛有文本根據，毋通干焦用印象猜。"},{"q":"「毋管」表示啥物關係？","o":["條件","漸進","轉折"],"a":0,"e":"本題問的是「「毋管」表示啥物關係？」；依教材的分類抑是例句，應選「條件」，另外兩項無符合題目所指的用法。","h":"比較前後段落的變化，留意作者用啥物細節支持這个意思。"},{"q":"「毋但」表示啥物關係？","o":["漸進","轉折","假設"],"a":0,"e":"本題問的是「「毋但」表示啥物關係？」；依教材的分類抑是例句，應選「漸進」，另外兩項無符合題目所指的用法。","h":"先確認題目問的重點，再回想課文內底對應的情節或句子。"},{"q":"「準做」佇教材的意思是？","o":["轉折","假設","即使、就算是"],"a":2,"e":"本題問的是「「準做」佇教材的意思是？」；依教材的分類抑是例句，應選「即使、就算是」，另外兩項無符合題目所指的用法。","h":"先回想課文相關段落，找出人物、事件佮原因之間的關係。"}],"comprehensive":[{"q":"「這雙鞋真好看，毋過傷大雙」是啥物關係？","o":["轉折","漸進","假設"],"a":0,"e":"本題問的是「「這雙鞋真好看，毋過傷大雙」是啥物關係？」；依教材的分類抑是例句，應選「轉折」，另外兩項無符合題目所指的用法。","h":"把課文的觀念帶入這个情境，想想實際發生時會按怎判斷。"},{"q":"「假使落雨，咱就改佇室內」是啥物關係？","o":["假設","漸進","轉折"],"a":0,"e":"本題問的是「「假使落雨，咱就改佇室內」是啥物關係？」；依教材的分類抑是例句，應選「假設」，另外兩項無符合題目所指的用法。","h":"毋通只看單一詞語，愛連同人物、原因佮結果做伙考慮。"},{"q":"「毋管成功失敗，我攏支持你」是啥物關係？","o":["條件","漸進","轉折"],"a":0,"e":"本題問的是「「毋管成功失敗，我攏支持你」是啥物關係？」；依教材的分類抑是例句，應選「條件」，另外兩項無符合題目所指的用法。","h":"先找出題目欲你判斷的核心，再排除無符合情境的選項。"},{"q":"「伊毋但寄錢，閣去做義工」是啥物關係？","o":["漸進","轉折","假設"],"a":0,"e":"本題問的是「「伊毋但寄錢，閣去做義工」是啥物關係？」；依教材的分類抑是例句，應選「漸進」，另外兩項無符合題目所指的用法。","h":"想想課文的重點佮這个新情境有啥物關係，再做決定。"},{"q":"「阿英愈看愈媠」主要表達啥物關係？","o":["漸進","轉折","假設"],"a":0,"e":"「愈……愈……」表示程度逐步增加，屬於漸進，毋是轉折抑是假設。","h":"比較各選項可能造成的結果，揀一項最符合題目條件的。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
