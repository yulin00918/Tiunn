<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人生逐位會開花｜真平第四冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style><meta name="author" content="張鈺聆">

</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第四冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第1課｜人生逐位會開花</h1><p>課文語詞、詩文理解與生活應用</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解課文的意象、情感與主旨。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文理解運用佇生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「一葩燈火」的「葩」是啥物？","o":["燈火的量詞","一種水果","一種山名"],"a":0,"e":"「一葩燈火」在這題指的是「燈火的量詞」。詩以一葩形容一盞燈火。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「一葩燈火」的用法。"},{"q":"詩句「一葩燈火有偌光？」是咧問啥物？","o":["這盞燈火有偌爾光亮","這盞燈火會點偌久","這盞燈火離咱偌遠"],"a":0,"e":"「偌光」問燈火光亮的程度；後一句「點佇暗夜照百丈」接著描寫照明的範圍。","h":"比較選項的意思，想看啥一个符合「一葩燈火有偌光？」佇課文內底的用法。"},{"q":"「燈火若化」的「化」是指？","o":["熄滅","點燃","移動"],"a":0,"e":"詩說燈火熄滅毋免悲哀。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「百丈」佇詩中主要形容？","o":["燈光照得真遠","燈火燃燒的時間真久","燈火本身真大蕊"],"a":0,"e":"「點佇暗夜照百丈」以百丈表現燈火能照亮遠處，不是形容時間長短。","h":"先看「百丈」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「賰半寸」的「賰」是指？","o":["剩落來","增加","忘記"],"a":0,"e":"賰表示剩餘。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「賰半寸」的用法。"},{"q":"「宛然」較接近？","o":["親像","一定","絕對無"],"a":0,"e":"宛然表示彷彿。","h":"比較選項的意思，想看啥一个符合「宛然」佇課文內底的用法。"},{"q":"「世路」佇詩中較接近？","o":["人生道路","馬路的寬度","鐵路車站"],"a":0,"e":"詩以世路比喻人生歷程。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「貪戀」是指？","o":["過度眷戀","完全放下","故意破壞"],"a":0,"e":"詩提醒毋免苦苦貪戀一切。","h":"先看「貪戀」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「天光」佇詩中除了天亮，閣象徵？","o":["挫折後猶原有希望","暗暝會一直延續","困難已經完全消失"],"a":0,"e":"「燈火若化免悲哀，總有天光日頭來」以天亮象徵困境過後仍有希望，不表示問題會自動消失。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「天光」的用法。"},{"q":"「逐位」佇「人生逐位會開花」是指？","o":["各所在","某一間厝","某一个人"],"a":0,"e":"逐位表示處處。","h":"比較選項的意思，想看啥一个符合「逐位」佇課文內底的用法。"}],"context":[{"q":"燈火雖然＿＿，毋免失志，天光會閣來。","o":["化去","加光","起火"],"a":0,"e":"課文用燈火熄滅比喻挫折。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"面對失敗，咱毋免一直＿＿過去的代誌。","o":["貪戀","忘記","拍算"],"a":0,"e":"貪戀表示過度眷戀。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"伊對未來有＿＿，所以願意一步一步繼續學習。","o":["理想","價目","尺寸"],"a":0,"e":"「理想」指對未來的期望，會使成做繼續學習的動力。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"人生的＿＿愛家己一步一步行。","o":["世路","海湧","燈罩"],"a":0,"e":"世路是人生道路的譬喻。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"這馬雖然真困難，猶原會當期待＿＿的日頭。","o":["天光","暗暝","落雨"],"a":0,"e":"天光象徵希望。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"}],"reading":[{"q":"「燈火若化免悲哀」主要欲提醒啥物？","o":["暫時失志猶原會當保有希望","遇著挫折愛當做無發生","有燈火就一定無困難"],"a":0,"e":"詩句先寫燈火熄滅，再寫天光日頭會來，提醒人即使遇到挫折，也不必認為希望就此消失。","h":"先分清楚題目問的是事情經過、人物想法，抑是作者的描寫。"},{"q":"「若無理想賰半寸」強調啥物？","o":["理想予人生有方向","人生長短干焦看身高","理想攏無重要"],"a":0,"e":"詩認為理想賦予生命意義。","h":"想想課文提供啥物線索，答案愛有文本根據，毋通干焦用印象猜。"},{"q":"白雲佮江水的描寫主要帶出？","o":["自然變化佮流動","雲永遠袂動","水攏停佇仝一个所在"],"a":0,"e":"白雲飄散、江水流東呈現流動。","h":"比較前後段落的變化，留意作者用啥物細節支持這个意思。"},{"q":"「毋免苦苦貪戀一切」較接近啥物態度？","o":["珍惜經驗，毋免過度執著","啥物攏毋通珍惜","只愛追求物質"],"a":0,"e":"詩提醒不過度眷戀。","h":"先確認題目問的重點，再回想課文內底對應的情節或句子。"},{"q":"「只要世路家己行過」主要強調？","o":["親身經歷佮努力的重要","逐條路攏愛行一遍","一定愛離開故鄉"],"a":0,"e":"人生道路需要自己經歷。","h":"先回想課文相關段落，找出人物、事件佮原因之間的關係。"}],"comprehensive":[{"q":"同學考試失利，佗句較符合詩的精神？","o":["承認失望，揣出問題閣繼續學","無論原因是啥物攏毋免檢討","只要相信就毋免改變做法"],"a":0,"e":"這是依「燈火若化免悲哀」延伸的生活應用；詩鼓勵保有希望，學習情境還需要檢視原因、調整方法。","h":"把課文的觀念帶入這个情境，想想實際發生時會按怎判斷。"},{"q":"欲畫「天光日頭來」的意象，佗个畫面較適當？","o":["暗暝過後，日頭漸漸升起","太陽永遠消失","只有一片黑暗"],"a":0,"e":"日出象徵希望。","h":"毋通只看單一詞語，愛連同人物、原因佮結果做伙考慮。"},{"q":"「世路家己行過」用佇學習，較合理的意思是？","o":["需要家己參與練習佮反思","攏予別人代做","干焦聽別人講就會曉"],"a":0,"e":"強調親身實踐。","h":"先找出題目欲你判斷的核心，再排除無符合情境的選項。"},{"q":"朋友因為計畫改變而失望，佗个回應較貼近課文？","o":["會當難過，也會當重新揣方向","一定毋通難過","過去的代誌一定愛攏留著"],"a":0,"e":"課文鼓勵面對變化，保持希望。","h":"想想課文的重點佮這个新情境有啥物關係，再做決定。"},{"q":"這首詩主要透過啥物方式表達人生態度？","o":["用燈火、白雲、江水等意象寄託感受","只列出統計數字","介紹交通規則"],"a":0,"e":"詩藉自然景物與燈火表達人生哲理。","h":"比較各選項可能造成的結果，揀一項最符合題目條件的。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
