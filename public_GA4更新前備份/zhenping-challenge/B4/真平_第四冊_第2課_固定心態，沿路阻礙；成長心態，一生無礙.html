<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>固定心態，沿路阻礙；成長心態，一生無礙｜真平第四冊</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f6f8f5;color:#314039}.app{max-width:1100px;margin:auto;padding:28px 22px 60px}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{padding:8px 13px;border-radius:999px;background:#e7eee9;color:#52675d;font-weight:800}.hero{text-align:center;padding:36px 10px 26px}.hero h1{font-size:clamp(32px,5vw,50px);margin:8px}.hero p{font-size:18px;color:#708078}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #dfe6e1;border-radius:22px;padding:22px;box-shadow:0 10px 28px #30403912}.card h3{font-size:22px;margin:4px 0 8px}.card p{color:#75837c;min-height:48px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:#365248;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.hide{display:none!important}.quizbox{max-width:780px;margin:20px auto}.progress{height:8px;background:#e8edea;border-radius:99px;overflow:hidden}.bar{height:100%;background:#688c7c}.q{font-size:27px;font-weight:900;line-height:1.55;margin:22px 0}.opt{width:100%;display:block;text-align:left;margin:10px 0;padding:14px 16px;border-radius:14px;background:#fff;color:#314039;border:1px solid #dbe3de;font-size:17px;cursor:pointer}.opt:hover{border-color:#91aa9e}.ok{background:#edf8f1!important;border-color:#7fba94!important}.bad{background:#fff0ef!important;border-color:#d8948e!important}.fb{min-height:58px;margin-top:14px;padding:13px;border-radius:12px;background:#f5f7f5;line-height:1.6}.result{text-align:center;padding:35px}.result .score{font-size:54px;font-weight:900}.small{font-size:14px;color:#7a8881}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.q{font-size:23px}}</style><meta name="author" content="張鈺聆">

</head><body><div class="app"><div class="top"><a class="pill" id="back" href="../../語境填空.dc.html">← 返回</a><span class="pill">📗 真平・第四冊</span></div><section id="home"><div class="hero"><div style="font-size:52px">🎭</div><h1>第2課｜固定心態，沿路阻礙；成長心態，一生無礙</h1><p>固定心態、成長心態與面對挫折</p></div><div class="grid"><div class="card"><h3>🔤 課文語詞</h3><p>正式語詞與課文補充語詞。</p><button class="btn" onclick="start('vocab')">開始挑戰</button></div><div class="card"><h3>💭 語境選詞</h3><p>把語詞放入生活與課文語境。</p><button class="btn" onclick="start('context')">開始挑戰</button></div><div class="card"><h3>📖 讀文理解</h3><p>理解文章論證與成長心態。</p><button class="btn" onclick="start('reading')">開始挑戰</button></div><div class="card"><h3>🏆 綜合挑戰</h3><p>把課文觀點運用佇學習與生活。</p><button class="btn" onclick="start('comprehensive')">開始挑戰</button></div></div><p class="small" style="text-align:center;margin-top:22px">每關隨機 5 題；答毋著先有提示，第二擺才顯示答案佮解說。</p></section><section id="quiz" class="hide quizbox"><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><p id="num" class="small"></p><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="fb"></div><button id="next" class="btn hide" onclick="nextQ()">下一題</button></div></section><section id="result" class="hide quizbox"><div class="card result"><div>完成挑戰</div><div id="score" class="score"></div><p id="msg"></p><div id="weak" style="text-align:left;margin:14px 0"></div><button class="btn" onclick="retry()">重新挑戰</button> <button class="btn" onclick="backHome()">回到本單元</button></div></section></div><script>const BANK={"vocab":[{"q":"「盹龜」佇課文是啥物意思？","o":["打瞌睡","真認真聽課","練習跑步"],"a":0,"e":"課文說有學生上課盹龜，指打瞌睡。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「盹龜」的用法。"},{"q":"「展」佇「目睭展甲真大蕊」是指？","o":["睜開","閉起來","遮起來"],"a":0,"e":"教材語詞解釋展是展開、打開。","h":"比較選項的意思，想看啥一个符合「展」佇課文內底的用法。"},{"q":"「參」佇「參考懸分的學生拚輸贏」是指？","o":["和、跟","比以前","離開"],"a":0,"e":"教材語詞解釋參是和、跟。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「忝」佇「輸彼種提懸分的學生忝忝」是指？","o":["差真濟","完全仝款","贏真濟"],"a":0,"e":"「輸……忝忝」在這段比較成績的語境，表示差距很大；理解時要連同前後比較對象一起看。","h":"先看「忝」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「荏」佇「荏荏馬嘛有一步踢」是指？","o":["較弱、無夠勇健","真強壯","真神氣"],"a":0,"e":"俗諺用荏荏馬說明看似弱小也有能力。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「荏」的用法。"},{"q":"「踏話頭」是指？","o":["開頭提起話題","做伙行路","突然停止講話"],"a":0,"e":"作者用建校歷史做演講開場。","h":"比較選項的意思，想看啥一个符合「踏話頭」佇課文內底的用法。"},{"q":"「一路春風」佇文章是形容？","o":["人生一路順利","逐工攏落雨","風一直吹"],"a":0,"e":"作者反問高分的人是否一生都順利。","h":"想想講話的人／故事情境，這个詞是咧形容啥物狀況？"},{"q":"「一枝草，一點露」強調啥物？","o":["毋通因為眼前成績就看輕一个人","每个人免學習就會自然成功","只要有天分就一定有好成績"],"a":0,"e":"文章引用「一枝草，一點露」，提醒每個人都有自己的機會與可能性，不應以一時分數否定他人。","h":"先看「一枝草，一點露」出現的語境，想想伊佇這句欲表達啥物意思。"},{"q":"「一步一跤印」是指？","o":["踏實、一步一步努力","一下就成功","完全無練習"],"a":0,"e":"作者用一步一跤印形容朋友持續努力。","h":"莫急咧揣華語翻譯，先用課文前後文判斷「一步一跤印」的用法。"},{"q":"「失志」佇文章是指？","o":["灰心喪志","真歡喜","真驕傲"],"a":0,"e":"固定心態者可能因認為無法進步而失志。","h":"比較選項的意思，想看啥一个符合「失志」佇課文內底的用法。"}],"context":[{"q":"雖然這擺考試無理想，伊猶原欲練習，真正是＿＿。","o":["有成長心態","有固定心態","完全放棄"],"a":0,"e":"相信能透過練習改進，是成長心態。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"阿弟講「我天生就袂曉數學，學嘛無效」，這較接近＿＿。","o":["固定心態","成長心態","有計畫的練習"],"a":0,"e":"把能力看成無法改變，是固定心態。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"老師講「做代誌愛＿＿，慢慢仔進步」。","o":["一步一跤印","盹龜","失志"],"a":0,"e":"一步一跤印形容踏實努力。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"比賽輸矣，伊決定揣出問題閣練習，符合「＿＿」。","o":["一時失志毋免怨嘆","閣較拚嘛無效","失敗就無機會"],"a":0,"e":"課文強調挫折後仍可繼續努力。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"},{"q":"就算拄開始袂曉用新工具，咱＿＿會當請教別人。","o":["嘛","抑是","毋過"],"a":0,"e":"「就算……嘛……」表達即使遇著困難，仍然會當請教別人。","h":"先讀完整句，特別注意空格前後的動作、對象佮語氣，再揀合適的詞。"}],"reading":[{"q":"作者一開始紹介五間百年學校，是欲做啥物？","o":["先以學校歷史引入後續的學生與成績討論","說明五間學校的課表完全相同","主張創校愈早就一定愈好"],"a":0,"e":"文章先列出五間 1922 年成立的學校，再提及作者母校及校內學生表現，作為後續討論成績與心態的鋪陳。","h":"先分清楚題目問的是事情經過、人物想法，抑是作者的描寫。"},{"q":"作者認為多數考懸分的學生有啥物共同點？","o":["有好的讀冊習慣，願意付出時間","攏毋免練習","攏上課盹龜"],"a":0,"e":"課文指出多數高分來自習慣與努力。","h":"想想課文提供啥物線索，答案愛有文本根據，毋通干焦用印象猜。"},{"q":"作者為啥物問「考懸分的人，敢講就一生一路春風？」","o":["提醒成績無法決定一世人的成就","主張成績完全無用","要求所有學校關門"],"a":0,"e":"反問強調分數與人生結果不能畫等號。","h":"比較前後段落的變化，留意作者用啥物細節支持這个意思。"},{"q":"固定心態的學生可能按怎看家己？","o":["認為能力固定，閣較拚嘛無效","相信練習會進步","願意修正方法"],"a":0,"e":"課文描寫固定心態容易讓人放棄。","h":"先確認題目問的重點，再回想課文內底對應的情節或句子。"},{"q":"作者的朋友最後成功，文章特別強調啥物？","o":["有成長心態，閣一步一跤印","完全無遇過困難","干焦靠考試分數"],"a":0,"e":"這題應回到課文所述朋友的經歷，留意作者如何描寫其努力與轉變；不能僅以「成功」反推任何人努力就必定成功。","h":"先回想課文相關段落，找出人物、事件佮原因之間的關係。"}],"comprehensive":[{"q":"學生考試失敗，佗一个回應較有成長心態？","o":["檢查錯誤，調整讀冊方法閣試看覓","我天生無夠巧，無救矣","反正努力攏無效"],"a":0,"e":"成長心態重視策略與練習。","h":"把課文的觀念帶入這个情境，想想實際發生時會按怎判斷。"},{"q":"「成長心態」敢代表一定袂失敗？","o":["毋是，會當對失敗學習佮調整","是，成長心態的人攏袂遇著困難","是，干焦保持樂觀就毋免練習"],"a":0,"e":"成長心態不是保證成功或永不失敗，而是相信能力能透過學習、策略與調整逐步改善。","h":"毋通只看單一詞語，愛連同人物、原因佮結果做伙考慮。"},{"q":"有同學成績較低，佗一个態度較符合課文？","o":["肯定伊的長處，支持伊揣適合的學習方法","認定伊一世人攏無機會","叫伊放棄所有興趣"],"a":0,"e":"課文反對用一次成績決定人的未來。","h":"先找出題目欲你判斷的核心，再排除無符合情境的選項。"},{"q":"想欲實踐「就算……嘛……」，佗句較適當？","o":["就算這擺失敗，嘛會當修正方法繼續練習","就算失敗，所以無愛試","就算努力，就一定第一名"],"a":0,"e":"句型與課文精神都強調面對困難仍持續努力。","h":"想想課文的重點佮這个新情境有啥物關係，再做決定。"},{"q":"欲設計一張「成長心態」班級海報，佗个標語較適當？","o":["能力會當透過練習佮反思逐步進步","天生袂曉就永遠袂曉","成功干焦看運氣"],"a":0,"e":"成長心態強調學習、策略與持續調整。","h":"比較各選項可能造成的結果，揀一項最符合題目條件的。"}]};
let S=[],i=0,sc=0,tries=0,locked=false,wrong=[],cur='';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function start(k){cur=k;S=shuffle(BANK[k]).slice(0,5);i=0;sc=0;wrong=[];show('quiz');render()}
function render(){locked=false;tries=0;const x=S[i];$('num').textContent=`第 ${i+1} / ${S.length} 題`;$('bar').style.width=`${i/S.length*100}%`;$('q').textContent=x.q;$('fb').textContent='選一个答案。';$('next').classList.add('hide');$('opts').innerHTML='';
shuffle(x.o.map((v,idx)=>({v,idx}))).forEach(z=>{const b=document.createElement('button');b.className='opt';b.textContent=z.v;b.dataset.idx=z.idx;b.onclick=()=>answer(z.idx,b);$('opts').appendChild(b)})}
function answer(k,el){if(locked)return;const x=S[i];tries++;const bs=[...document.querySelectorAll('.opt')];
if(k===x.a){locked=true;if(tries===1)sc++;bs.forEach(b=>b.disabled=true);el.classList.add('ok');$('fb').textContent='✅ 著矣！'+x.e;$('next').classList.remove('hide');return}
el.classList.add('bad');el.disabled=true;
if(tries===1){if(!wrong.includes(x))wrong.push(x);$('fb').textContent='🤔 閣想看覓：'+x.h;return}
locked=true;bs.forEach(b=>b.disabled=true);bs.find(b=>+b.dataset.idx===x.a)?.classList.add('ok');$('fb').textContent='答案：'+x.o[x.a]+'。 '+x.e;$('next').classList.remove('hide')}
function nextQ(){i++;if(i<S.length)return render();show('result');$('score').textContent=`${sc} / ${S.length}`;
$('msg').textContent=sc===S.length?'真𠢕！這一關攏答著。':sc>=Math.ceil(S.length*.6)?'真好，閣共答毋著的題目看一擺。':'免急，閣試一擺就會愈來愈熟。';
$('weak').innerHTML=wrong.length?'<b>錯題複習</b>'+wrong.map(x=>`<p>• ${x.q}<br>答案：${x.o[x.a]}｜${x.e}</p>`).join(''):'<b>錯題複習</b><p>這關無錯題，真讚！</p>'}
function backHome(){show('home')}
function retry(){start(cur)}
$('back').onclick=e=>{e.preventDefault();if($('home').classList.contains('hide'))show('home');else location.href='../../語境填空.dc.html'};</script></body></html>
