const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function vmapOf(text){const t=text.replace(/<br>/g,'');const vs=vocab.map((v,i)=>({w:v[0],i})).sort((a,b)=>b.w.length-a.w.length);const a=[];let p=0;while(p<t.length){const m=vs.find(v=>t.startsWith(v.w,p));if(m){for(const _ of [...m.w])a.push(m.i);p+=m.w.length}else{const ch=String.fromCodePoint(t.codePointAt(p));if(!/[\s　]/.test(ch))a.push(null);p+=ch.length}}return a}
function annotSeg(i){const vm=vmapOf(segs[i]);let pos=0;const adv=t=>{const n=[...t].filter(c=>!/[\s　]/.test(c)).length;const v=vm[pos];pos+=n;return v};let html='';(SANDHI[i]||[]).forEach((x,g)=>{if(x==='<br>'){html+='<span class="abr"></span>';return}if(typeof x==='string'){adv(x);html+='<span class="ap">'+esc(x)+'</span>';return}html+='<span class="ag">'+x.map((c,k)=>{const[han,rom,tone,act,type]=c;const v=adv(han);const col=(STYPES[type]||STYPES.base)[1];const tl=act===0?'輕':(tone===act?String(tone):tone+'→'+act);const s=sel&&sel.i===i&&sel.g===g&&sel.k===k;const iv=v!==null&&v!==undefined;return '<span class="ac'+(type==='light'?' light':'')+(iv?' v':'')+(s?' sel':'')+'" data-g="'+g+'" data-k="'+k+'"'+(iv?' data-vi="'+v+'"':'')+'><span class="r">'+esc(rom)+'</span><span class="h" style="color:'+col+'">'+esc(han)+'</span><span class="t" style="color:'+col+'">'+tl+'</span></span>'}).join('')+'</span>'});let card='';if(sel&&sel.i===i){const c=(SANDHI[i][sel.g]||[])[sel.k];if(c){const[han,rom,tone,act,type,note,alt]=c;const T=STYPES[type]||STYPES.base;const line=act===0?'本調 第'+tone+'調 → 輕聲':(tone===act?'本調 第'+tone+'調・不變':'本調 第'+tone+'調 → 實際 第'+act+'調');card='<div class="scard" style="border-color:'+T[1]+'"><button class="x" type="button" aria-label="關閉">×</button><div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-right:30px"><span class="big" style="color:'+T[1]+'">'+esc(han)+'</span><span style="font-size:18px;font-weight:700;color:#58705c">'+esc(rom)+'</span><span class="lab" style="background:'+T[1]+'">'+T[0]+'</span></div><div style="margin-top:8px;font-weight:700">'+line+'</div><div style="margin-top:6px">'+esc(note||'')+'</div>'+(alt?'<div class="alt">另讀：'+esc(alt)+'</div>':'')+(sel.vi!==null&&sel.vi!==undefined?'<button class="vb" type="button">看語詞解說</button>':'')+'</div>'}}return '<div class="atext">'+html+'</div>'+card}
function bindAnnot(){document.querySelectorAll('#text .seg').forEach(x=>{const i=+x.dataset.i;x.querySelector('.segplay').onclick=e=>{e.stopPropagation();playSeg(i)};x.querySelectorAll('.ac').forEach(c=>c.onclick=e=>{e.stopPropagation();sel={i,g:+c.dataset.g,k:+c.dataset.k,vi:c.dataset.vi!==undefined?+c.dataset.vi:null};renderText()});const card=x.querySelector('.scard');if(card){card.onclick=e=>e.stopPropagation();card.querySelector('.x').onclick=e=>{e.stopPropagation();sel=null;renderText()};const vb=card.querySelector('.vb');if(vb)vb.onclick=e=>{e.stopPropagation();showV(sel.vi)}}})}
function syncSw(){const on=showRom||showTone;document.getElementById('swRom').classList.toggle('on',showRom);document.getElementById('swTone').classList.toggle('on',showTone);document.getElementById('legend').hidden=!on;document.getElementById('note').textContent=on?'點▶播放該段；點字看變調說明。':NOTE_OFF;if(!on)sel=null;renderText()}
document.getElementById('swRom').onclick=()=>{showRom=!showRom;syncSw()};document.getElementById('swTone').onclick=()=>{showTone=!showTone;syncSw()};
function marked(s){vocab.forEach((v,i)=>s=s.replaceAll(v[0],`<span class="v" onclick="event.stopPropagation();showV(${i})">${v[0]}</span>`));return s}function renderText(){const t=document.getElementById('text');const pl=[...t.querySelectorAll('.seg')].findIndex(x=>x.classList.contains('playing'));if(showRom||showTone){t.classList.add('annot');t.classList.toggle('noR',!showRom);t.classList.toggle('noT',!showTone);t.innerHTML=segs.map((s,i)=>`<div class="seg" data-i="${i}"><button class="segplay" type="button">▶ 第${i+1}段</button>${annotSeg(i)}</div>`).join('');bindAnnot()}else{t.classList.remove('annot','noR','noT');document.getElementById('text').innerHTML=segs.map((s,i)=>`<div class="seg" onclick="playSeg(${i})">${marked(s)}</div>`).join('');}if(pl>=0){const x=t.querySelectorAll('.seg')[pl];if(x)x.classList.add('playing')}}renderText();document.getElementById('vg').innerHTML=vocab.map((v,i)=>`<div class="card"><h3>${v[0]}</h3><div class="tl">${v[1]}</div><p>${v[2]}</p><button class="playbtn" onclick="playV(${i})">▶ 播放</button></div>`).join('');
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});function clear(){document.querySelectorAll('.seg').forEach(x=>x.classList.remove('playing'))}function playFile(src){cur=-1;clear();au.src=src;au.playbackRate=rate;au.play()}function playSeg(i){cur=i;clear();document.querySelectorAll('.seg')[i].classList.add('playing');playFileKeep(A+`lesson-${String(i+1).padStart(3,'0')}.mp3`)}function playFileKeep(src){au.src=src;au.playbackRate=rate;au.play()}function playAll(){cur=-1;clear();TWReadSequence.start(au,Array.from({length:5},(_,i)=>A+`lesson-${String(i+1).padStart(3,'0')}.mp3`),()=>rate,(i)=>{clear();const x=document.querySelectorAll('.seg')[i];if(x)x.classList.add('playing')},()=>clear())}function playV(i){playFile(A+`vocab-${String(i+1).padStart(2,'0')}.mp3`)}function showV(i){const v=vocab[i];mt.textContent=v[0];mr.textContent=v[1];md.textContent=v[2];mp.onclick=()=>playV(i);modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}function togglePause(){au.paused?au.play():au.pause()}function restart(){au.currentTime=0;au.play()}function setRate(r){rate=r;au.playbackRate=r}au.onended=()=>clear();
</script><script src="../shared/sequence-player.js"></script></body></html>
