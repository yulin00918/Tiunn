['🧳 檢疫犬',`鼻仔足利的好鼻獅。佇機場檢查旅客的行李、國外的包裹，看敢有人紮果子、菜蔬、肉類遮的違禁品。`,''],
['💛 治療犬',`個性溫馴有耐心。會當陪伴特別需要安搭的學生上課；陪老人做復健；安慰病人，予人感受著溫暖佮愛。`,''],
['結語｜出任務的時陣',`工作犬愛經過真嚴格、長時間的訓練，通過考試了後才會當出來做工課。𪜶咧出任務的時陣需要專心，咱千萬毋通共𪜶攪吵喔！`,'outro']
];
let rate=1,seq=false,idx=0;const au=document.getElementById('audio'),text=document.getElementById('text');
text.innerHTML=`<section class="seg intro" onclick="playSeg(0)"><div class="dog">${segs[0][0]}</div>${segs[0][1]}</section><div class="grid">`+segs.slice(1,6).map((s,i)=>`<section class="seg" onclick="playSeg(${i+1})"><div class="dog">${s[0]}</div>${s[1]}</section>`).join('')+`</div><section class="seg outro" onclick="playSeg(6)"><div class="dog">${segs[6][0]}</div>${segs[6][1]}</section>`;
function cards(){return [...document.querySelectorAll('.seg')]}function clear(){cards().forEach(x=>x.classList.remove('playing'))}function src(i){return A+'lesson-'+String(i+1).padStart(3,'0')+'.mp3'}function playSeg(i){seq=false;idx=i;clear();cards()[i].classList.add('playing');au.src=src(i);au.playbackRate=rate;au.play()}function playAll(){seq=true;idx=0;playSeq()}function playSeq(){clear();cards()[idx].classList.add('playing');au.src=src(idx);au.playbackRate=rate;au.play()}function playFull(){seq=false;clear();au.src=A+'publisher-full.mp3';au.playbackRate=rate;au.play()}au.onended=()=>{if(seq&&idx<segs.length-1){idx++;playSeq()}else{seq=false;clear()}};function togglePause(){au.paused?au.play():au.pause()}function restart(){au.currentTime=0;au.play()}function setRate(r){rate=r;au.playbackRate=r}
</script><script id="official-vocab-module">const OFFICIAL_VOCAB=[["利", "lāi", "形容五官的能力很敏銳。"], ["定著", "tiānn-tio̍h", "形容個性穩重。"], ["搜揣", "tshiau-tshuē", "到處搜索尋找。"], ["幫贊", "pang-tsān", "幫忙、幫助。"], ["扭掠", "liú-lia̍h", "手腳俐落、動作敏捷。"], ["軁", "nǹg", "穿過、鑽。"], ["𤆬路", "tshuā-lōo", "帶路。"], ["溫馴", "un-sûn", "溫和順從。"], ["安搭", "an-tah", "安撫、安慰。"], ["攪吵", "kiáu-tshá", "打擾。"]];const VS=OFFICIAL_VOCAB.map((v,i)=>({w:v[0],i})).sort((a,b)=>b.w.length-a.w.length);function markV(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.nodeValue.trim()||n.parentElement.closest('script,style,button,.vocabBox,.modal'))return NodeFilter.FILTER_REJECT;return VS.some(v=>n.nodeValue.includes(v.w))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}}),ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{let s=n.nodeValue,f=document.createDocumentFragment(),p=0;while(p<s.length){let h=null,a=s.length;for(const v of VS){let j=s.indexOf(v.w,p);if(j>=0&&(j<a||(j===a&&(!h||v.w.length>h.w.length)))){h=v;a=j}}if(!h){f.append(s.slice(p));break}if(a>p)f.append(s.slice(p,a));let x=document.createElement('span');x.className='vw';x.dataset.v=h.i;x.textContent=h.w;f.append(x);p=a+h.w.length}n.replaceWith(f)})}function openV(i){const v=OFFICIAL_VOCAB[i],r=document.getElementById('officialModal');r.innerHTML='<div class="modal"><article class="modalCard"><button class="modalClose">關閉</button><div class="modalWord">'+v[0]+'</div><div class="modalRoman">'+v[1]+'</div><div class="modalGloss">'+v[2]+'</div></article></div>';const m=r.querySelector('.modal');m.onclick=e=>{if(e.target===m||e.target.classList.contains('modalClose'))r.innerHTML=''}}function initV(){const r=document.querySelector('main')||document.getElementById('text');if(r)markV(r);document.querySelectorAll('.vw').forEach(x=>x.onclick=e=>{e.stopPropagation();openV(+x.dataset.v)});const b=document.getElementById('officialVocabList');if(b){b.innerHTML=OFFICIAL_VOCAB.map((v,i)=>'<button class="vocabChip" data-vb="'+i+'">'+v[0]+'</button>').join('');b.querySelectorAll('[data-vb]').forEach(x=>x.onclick=()=>openV(+x.dataset.vb))}}setTimeout(initV,0);
/* 變調標注：開關打開時重畫卡片為逐字標注；關閉時恢復原本卡片並重新標示語詞 */
const STYPES={base:['本調','#2f7d4a'],reg:['一般變調','#2b6cb0'],zai:['再變調','#d9731f'],apre:['仔前變調','#7b4fb0'],light:['輕聲','#8a8f94'],pre:['輕聲前讀本調','#2f7d4a']};
let showRom=false,showTone=false,sel=null;const NOTE_OFF=document.getElementById('note').textContent;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function vmapOf(t){t=t.replace(/<br>/g,'');const a=[];let p=0;while(p<t.length){const m=VS.find(v=>t.startsWith(v.w,p));if(m){for(const _ of [...m.w])a.push(m.i);p+=m.w.length}else{const ch=String.fromCodePoint(t.codePointAt(p));if(!/[\s　]/.test(ch))a.push(null);p+=ch.length}}return a}
function annotSeg(i){const vm=vmapOf(segs[i][1]);let pos=0;const adv=t=>{const n=[...t].filter(c=>!/[\s　]/.test(c)).length;const v=vm[pos];pos+=n;return v};let html='';(SANDHI[i]||[]).forEach((x,g)=>{if(x==='<br>'){html+='<span class="abr"></span>';return}if(typeof x==='string'){adv(x);html+='<span class="ap">'+esc(x)+'</span>';return}html+='<span class="ag">'+x.map((c,k)=>{const[han,rom,tone,act,type]=c;const v=adv(han);const col=(STYPES[type]||STYPES.base)[1];const tl=act===0?'輕':(tone===act?String(tone):tone+'→'+act);const s=sel&&sel.i===i&&sel.g===g&&sel.k===k;const iv=v!==null&&v!==undefined;return '<span class="ac'+(type==='light'?' light':'')+(iv?' v':'')+(s?' sel':'')+'" data-g="'+g+'" data-k="'+k+'"'+(iv?' data-vi="'+v+'"':'')+'><span class="r">'+esc(rom)+'</span><span class="h" style="color:'+col+'">'+esc(han)+'</span><span class="t" style="color:'+col+'">'+tl+'</span></span>'}).join('')+'</span>'});
let card='';if(sel&&sel.i===i){const c=(SANDHI[i][sel.g]||[])[sel.k];if(c){const[han,rom,tone,act,type,note,alt]=c;const T=STYPES[type]||STYPES.base;const line=act===0?'本調 第'+tone+'調 → 輕聲':(tone===act?'本調 第'+tone+'調・不變':'本調 第'+tone+'調 → 實際 第'+act+'調');card='<div class="scard" style="border-color:'+T[1]+'"><button class="x" type="button" aria-label="關閉">×</button><div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-right:30px"><span class="big" style="color:'+T[1]+'">'+esc(han)+'</span><span style="font-size:18px;font-weight:700;color:#536b55">'+esc(rom)+'</span><span class="lab" style="background:'+T[1]+'">'+T[0]+'</span></div><div style="margin-top:8px;font-weight:700">'+line+'</div><div style="margin-top:6px">'+esc(note||'')+'</div>'+(alt?'<div class="alt">另讀：'+esc(alt)+'</div>':'')+(sel.vi!==null&&sel.vi!==undefined?'<button class="vb" type="button">看語詞解說</button>':'')+'</div>'}}
return '<div class="anno">'+html+'</div>'+card}
function aCard(i,cls){return '<section class="seg'+(cls?' '+cls:'')+'" data-i="'+i+'"><div class="lrow"><div class="dog">'+segs[i][0]+'</div><button class="segplay" type="button">▶ 播放</button></div>'+annotSeg(i)+'</section>'}
function renderText(){const on=showRom||showTone;const pl=cards().findIndex(x=>x.classList.contains('playing'));text.classList.toggle('annot',on);text.classList.toggle('noR',!showRom);text.classList.toggle('noT',!showTone);
if(!on){text.innerHTML=`<section class="seg intro" onclick="playSeg(0)"><div class="dog">${segs[0][0]}</div>${segs[0][1]}</section><div class="grid">`+segs.slice(1,6).map((s,i)=>`<section class="seg" onclick="playSeg(${i+1})"><div class="dog">${s[0]}</div>${s[1]}</section>`).join('')+`</div><section class="seg outro" onclick="playSeg(6)"><div class="dog">${segs[6][0]}</div>${segs[6][1]}</section>`;markV(text);text.querySelectorAll('.vw').forEach(x=>x.onclick=e=>{e.stopPropagation();openV(+x.dataset.v)})}
else{text.innerHTML=aCard(0,'intro')+'<div class="grid">'+[1,2,3,4,5].map(i=>aCard(i,'')).join('')+'</div>'+aCard(6,'outro');
text.querySelectorAll('.seg').forEach(x=>{const i=+x.dataset.i;x.querySelector('.segplay').onclick=()=>playSeg(i);x.querySelectorAll('.ac').forEach(c=>c.onclick=()=>{sel={i,g:+c.dataset.g,k:+c.dataset.k,vi:c.dataset.vi!==undefined?+c.dataset.vi:null};renderText()});const card=x.querySelector('.scard');if(card){card.querySelector('.x').onclick=()=>{sel=null;renderText()};const vb=card.querySelector('.vb');if(vb)vb.onclick=()=>openV(sel.vi)}})}
if(pl>=0){const x=cards()[pl];if(x)x.classList.add('playing')}}
function syncSw(){const on=showRom||showTone;document.getElementById('swRom').classList.toggle('on',showRom);document.getElementById('swTone').classList.toggle('on',showTone);document.getElementById('legend').hidden=!on;document.getElementById('note').textContent=on?'點▶播放該段；點字看變調說明。':NOTE_OFF;if(!on)sel=null;renderText()}
document.getElementById('swRom').onclick=()=>{showRom=!showRom;syncSw()};document.getElementById('swTone').onclick=()=>{showTone=!showTone;syncSw()};
</script></body></html>
