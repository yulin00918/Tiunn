function clear(){document.querySelectorAll('.seg').forEach(x=>x.classList.remove('playing'))}function src(i){return A+'lesson-'+String(i+1).padStart(3,'0')+'.mp3'}function playSeg(i){seq=false;idx=i;clear();document.querySelectorAll('.seg')[i].classList.add('playing');au.src=src(i);au.playbackRate=rate;au.play()}function playAll(){seq=true;idx=0;playSeq()}function playSeq(){clear();document.querySelectorAll('.seg')[idx].classList.add('playing');au.src=src(idx);au.playbackRate=rate;au.play()}function playFull(){seq=false;clear();au.src=A+'publisher-full.mp3';au.playbackRate=rate;au.play()}au.onended=()=>{if(seq&&idx<segs.length-1){idx++;playSeq()}else{seq=false;clear()}};function togglePause(){au.paused?au.play():au.pause()}function restart(){au.currentTime=0;au.play()}function setRate(r){rate=r;au.playbackRate=r}
</script><script id="official-vocab-module">const OFFICIAL_VOCAB=[["柴柴", "tshâ-tshâ", "此處指眼神呆滯、不靈活。"], ["開銷", "khai-siau", "開支。所支付出去的金錢。"], ["熱", "jia̍t", "形容人際關係的交流熱絡。"], ["𢯾", "mooh", "緊抱、緊貼。"], ["喝", "huah", "大聲喊叫。"], ["好代", "hó-tāi", "好事、善行。"], ["紲手", "suà-tshiú", "順手、隨手。"], ["早齋", "tsá-tsai", "齋：素食的餐飯。早齋：早上吃的素食。"]];const VS=OFFICIAL_VOCAB.map((v,i)=>({w:v[0],i})).sort((a,b)=>b.w.length-a.w.length);function markV(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.nodeValue.trim()||n.parentElement.closest('script,style,button,.vocabBox,.modal'))return NodeFilter.FILTER_REJECT;return VS.some(v=>n.nodeValue.includes(v.w))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}}),ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{let s=n.nodeValue,f=document.createDocumentFragment(),p=0;while(p<s.length){let h=null,a=s.length;for(const v of VS){let j=s.indexOf(v.w,p);if(j>=0&&(j<a||(j===a&&(!h||v.w.length>h.w.length)))){h=v;a=j}}if(!h){f.append(s.slice(p));break}if(a>p)f.append(s.slice(p,a));let x=document.createElement('span');x.className='vw';x.dataset.v=h.i;x.textContent=h.w;f.append(x);p=a+h.w.length}n.replaceWith(f)})}function openV(i){const v=OFFICIAL_VOCAB[i],r=document.getElementById('officialModal');r.innerHTML='<div class="modal"><article class="modalCard"><button class="modalClose">關閉</button><div class="modalWord">'+v[0]+'</div><div class="modalRoman">'+v[1]+'</div><div class="modalGloss">'+v[2]+'</div></article></div>';const m=r.querySelector('.modal');m.onclick=e=>{if(e.target===m||e.target.classList.contains('modalClose'))r.innerHTML=''}}function initV(){const r=document.querySelector('main')||document.getElementById('text');if(r)markV(r);document.querySelectorAll('.vw').forEach(x=>x.onclick=e=>{e.stopPropagation();openV(+x.dataset.v)});const b=document.getElementById('officialVocabList');if(b){b.innerHTML=OFFICIAL_VOCAB.map((v,i)=>'<button class="vocabChip" data-vb="'+i+'">'+v[0]+'</button>').join('');b.querySelectorAll('[data-vb]').forEach(x=>x.onclick=()=>openV(+x.dataset.vb))}}setTimeout(initV,0);

function vmapOf(t){t=t.replace(/<span class="speaker">[^<]*<\/span>/g,'').replace(/<[^>]+>/g,'');const a=[];let p=0;while(p<t.length){const m=VS.find(v=>t.startsWith(v.w,p));if(m){for(const _ of [...m.w])a.push(m.i);p+=m.w.length}else{const ch=String.fromCodePoint(t.codePointAt(p));if(!/[\s　]/.test(ch))a.push(null);p+=ch.length}}return a}
