:root{--ink:#33453f;--muted:#72827b;--line:#e1e8e4;--accent:#5f8583;--shadow:0 10px 28px #31473e14}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fafcfb,#eef4f2);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}button{font:inherit}.app{max-width:1180px;margin:auto;padding:28px 22px 60px}.top{display:flex;justify-content:space-between;margin-bottom:25px}.pill{border:0;background:#fff;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow)}.hero{text-align:center;margin:12px 0 34px}.hero h1{font-size:39px;margin:0 0 8px}.hero p{color:var(--muted);margin:6px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:23px;padding:24px;box-shadow:var(--shadow)}.level{text-align:center}.icon{font-size:40px}.num{font-weight:900;color:#bcc5c0}.level h3{margin:8px}.level p{min-height:50px;color:var(--muted);line-height:1.55}.extra{background:linear-gradient(145deg,#fff,#eef7f7)}.btn{width:100%;border:0;border-radius:14px;padding:12px 16px;background:#354d46;color:#fff;font-weight:800;cursor:pointer}.hidden{display:none!important}.quiz,.activity{max-width:850px;margin:auto}.title{text-align:center}.title h2{font-size:31px;margin-bottom:5px}.title p{color:var(--muted)}.bar{height:11px;background:#e5ebe8;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:8px 0 14px}.qcard{padding:32px}.kicker{font-weight:800;color:#8e755f}.q{font-size:26px;font-weight:800;line-height:1.55;margin:10px 0 24px}.opts{display:grid;gap:12px}.opt{padding:16px;text-align:left;border:1px solid #dce4df;background:white;border-radius:15px;font-weight:700;cursor:pointer}.correct{background:#edf8f1;border-color:#8ebaa0}.wrong{background:#fff0ef;border-color:#d7a09a}.feedback{margin-top:18px;padding:16px;border-radius:15px;line-height:1.6}.ok{background:#edf8f1}.bad{background:#fff0ef}.hint{background:#fff8e7}.next{width:auto;margin-top:14px}.result{max-width:720px;margin:auto;text-align:center}.score{font-size:62px;font-weight:900;color:var(--accent)}.weak{background:#f3f6f4;border-radius:14px;padding:14px;margin:18px 0}.steps{display:grid;gap:10px}.step{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);background:#fff;border-radius:14px}.step span{flex:1;font-weight:700}.step button{border:0;background:#eef2f0;border-radius:9px;padding:7px 10px}.status{padding:15px;background:#eef5f2;border-radius:14px;line-height:1.6}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style></head><body><div class="app"><div class="top"><button class="pill" id="back">← 返回課文</button><button class="pill">📚 康軒・第一冊</button></div>
<section id="lesson"><div class="hero"><h1>📘 第二課｜鬥陣</h1><p><b>課文語詞 × 生活語境 × 理解思考 × 實際應用</b></p><p>課文語詞 × 語境運用 × 閱讀理解 × 綜合挑戰</p></div><div class="grid">
<div class="card level"><div class="num">01</div><div class="icon">🔤</div><h3>課文語詞</h3><p>教材重點語詞與課文用法</p><small id="s-vocab">未挑戰</small><br><br><button class="btn start" data-b="vocab">開始 →</button></div>
<div class="card level"><div class="num">02</div><div class="icon">💭</div><h3>語境選詞</h3><p>換一个生活情境真正會用</p><small id="s-context">未挑戰</small><br><br><button class="btn start" data-b="context">開始 →</button></div>
<div class="card level"><div class="num">03</div><div class="icon">📖</div><h3>讀文理解</h3><p>讀懂課文內容、因果佮主旨</p><small id="s-reading">未挑戰</small><br><br><button class="btn start" data-b="reading">開始 →</button></div>
<div class="card level"><div class="num">04</div><div class="icon">🏆</div><h3>綜合挑戰</h3><p>課文 × 情境 × 應用</p><small id="s-comprehensive">未挑戰</small><br><br><button class="btn start" data-b="comprehensive">開始 →</button></div>
<div class="card level extra"><div class="num">＋</div><div class="icon">🤝</div><h3>鬥陣挑戰四步</h3><p>按 ▲ ▼ 排出合理的歷程順序。</p><small>本課專屬</small><br><br><button class="btn" id="routeBtn">開始 →</button></div></div></section>
<section id="quiz" class="hidden"><div class="quiz"><div class="title"><h2 id="qt"></h2><p>每擺隨機抽 5 題</p></div><div class="bar"><div class="fill" id="fill"></div></div><div class="meta"><span id="count"></span><span id="scoreNow"></span></div><div class="card qcard" id="qcard"></div></div></section>
<section id="result" class="hidden"><div class="card result"><div style="font-size:48px">🎉</div><h2 id="rt"></h2><div class="score" id="fs"></div><p id="msg"></p><div class="weak" id="weak"></div><button class="btn" id="retry">🔄 閣挑戰一擺</button><br><br><button class="btn" id="home" style="background:#e9efec;color:#31443c">轉去本課</button></div></section>
<section id="activity" class="hidden"><div class="activity"><div class="title"><h2>🧩 鬥陣挑戰四步</h2><p>按 ▲ ▼ 排出正確順序。</p></div><div class="card"><div class="steps" id="steps"></div><br><button class="btn" id="checkSteps">檢查順序</button><br><br><div class="status" id="stepStatus">按 ▲ ▼ 排出合理的歷程順序。</div><br><button class="btn" id="shuffleSteps" style="background:#73857e">重新洗牌</button><br><br><button class="btn" id="activityHome" style="background:#e9efec;color:#31443c">完成，轉去本課</button></div></div></section></div>
<script>const B={"vocab":[{"q":"「鬥陣」是啥意思？","opts":["做伙、作伴","輪流代替別人","各自完成同一件事"],"ans":0,"hint":"課名強調同伴。","explain":"鬥陣就是一起、作伴。","word":"做伙、作伴"},{"q":"「泅水」是啥活動？","opts":["游泳","在水邊散步","在水上划船"],"ans":0,"hint":"佇水內做運動。","explain":"泅水就是游泳。","word":"游泳"},{"q":"「堅持」較接近啥意思？","opts":["遇著困難猶原繼續努力","遇到困難就換另一個目標","完全不調整方法一直做"],"ans":0,"hint":"目標未達成猶原努力。","explain":"堅持是不輕易放棄。","word":"遇著困難猶原繼續努力"},{"q":"「陪伴」的意思是？","opts":["佇身邊做伙行","只在旁邊觀察但不互動","替對方完成所有事情"],"ans":0,"hint":"同伴相挺。","explain":"陪伴是一起經歷與支持。","word":"佇身邊做伙行"},{"q":"「拍拚」佇「鬥陣拍拚」是啥意思？","opts":["努力、奮鬥","只有一起出席，毋免出力","遇著困難就停止嘗試"],"ans":0,"hint":"想想向目標前進。","explain":"「拍拚」是努力、奮鬥；「鬥陣」才是做伙、作伴。","word":"努力奮鬥"},{"q":"「挑戰」佇運動情境是指？","opts":["嘗試完成有難度的目標","只選自己已經會的項目","和別人比較誰做得較快"],"ans":0,"hint":"有難度才需要挑戰。","explain":"挑戰是勇於面對較難的任務。","word":"嘗試完成有難度的目標"}],"context":[{"q":"欲完成班級任務，咱逐家＿＿做伙。","opts":["鬥陣","輪流","各自"],"ans":0,"hint":"大家一起合作。","explain":"鬥陣表示一起。"},{"q":"阿明逐禮拜去游泳池練＿＿。","opts":["泅水","水中復健","水上救生"],"ans":0,"hint":"游泳池的運動。","explain":"泅水就是游泳。"},{"q":"練習雖然真辛苦，伊猶原＿＿落去。","opts":["堅持","考慮","延後"],"ans":0,"hint":"沒有中途停止。","explain":"堅持是持續努力。"},{"q":"我感覺無信心，朋友的＿＿予我較有勇氣。","opts":["陪伴","提醒","建議"],"ans":0,"hint":"朋友在身邊支持。","explain":"陪伴能帶來支持。"},{"q":"咱為著比賽逐工認真＿＿。","opts":["拍拚","參觀","觀察"],"ans":0,"hint":"是努力準備。","explain":"拍拚就是努力奮鬥。"},{"q":"伊想試看覓泅較長的距離，是對家己的＿＿。","opts":["挑戰","準備","練習"],"ans":0,"hint":"提高目標難度。","explain":"挑戰是嘗試較難的任務。"}],"reading":[{"q":"豪運邀楷成放學做啥？","opts":["拍籃球","做伙去泅水","去看楷成比賽"],"ans":0,"hint":"兩人討論放學活動。","explain":"豪運邀楷成打籃球。"},{"q":"楷成為啥物無欲去拍籃球？","opts":["伊欲練泅水","伊欲參加籃球練習","伊欲先完成學校作業"],"ans":0,"hint":"課文有說練習安排。","explain":"楷成要練游泳。"},{"q":"課文「這條路有你的陪伴」強調啥？","opts":["同伴的支持","運動場地的安全","路途遠近的選擇"],"ans":0,"hint":"思考陪伴的作用。","explain":"同伴支持是課文的重要情感。"},{"q":"「鬥陣拍拚，大步向前行」較符合啥精神？","opts":["做伙努力向目標前進","各自完成自己的任務","先等別人成功才行動"],"ans":0,"hint":"留意鬥陣與拍拚。","explain":"這句強調合作與努力。"},{"q":"楷成挑戰泅三公里，呈現啥態度？","opts":["勇敢挑戰佮堅持","重視比賽名次","追求他人的讚美"],"ans":0,"hint":"距離較長，需要努力。","explain":"三公里游泳呈現挑戰精神。"},{"q":"本課「鬥陣」毋是只有做伙，閣強調啥？","opts":["互相鼓勵佮支持","一起參加相同比賽","共同訂定相同目標"],"ans":0,"hint":"比較朋友的互動。","explain":"同伴關係也包括理解與鼓勵。"}],"comprehensive":[{"q":"朋友為著比賽愛練習，無法佮你出去，你較適合按怎回應？","opts":["尊重伊的計畫，替伊加油","請朋友先答應邀約，練習以後再補","認為朋友拒絕邀約就是不重視友誼"],"ans":0,"hint":"朋友有自己的目標。","explain":"尊重與支持是好的陪伴。"},{"q":"小組有一个人進度較慢，啥做法符合「鬥陣」？","opts":["做伙找方法，予伊跟會著","由進度最快的人完成全部工作","讓進度慢的人只做最簡單的部分，不必參與討論"],"ans":0,"hint":"團隊需要互相支持。","explain":"合作包含照顧彼此的學習。"},{"q":"練泅水進步較慢，欲實踐「堅持」應該？","opts":["調整練習方法並持續努力","每天增加練習量，無須考慮身體狀況","只反覆練同一動作，不檢查方法"],"ans":0,"hint":"堅持也需要方法與安全。","explain":"持續練習並適時調整較合理。"},{"q":"若同伴挑戰失敗，啥款話較能鼓勵伊？","opts":["咱檢討看覓，下擺閣試","你這擺已經盡力，下擺一定會贏","先毋通想失敗的原因，直接換一項挑戰"],"ans":0,"hint":"同伴支持不等於只稱讚。","explain":"具體鼓勵與反思能支持下一次嘗試。"},{"q":"「鬥陣拍拚」佇班級合作時是指？","opts":["分工互助，做伙完成目標","由組長決定全部工作，其他人配合就好","逐人做家己的部分，不必互相確認"],"ans":0,"hint":"團隊分工。","explain":"共同努力包含合理分工。"},{"q":"這課較重視啥價值？","opts":["友誼、支持佮堅持","只要贏得比賽，朋友之間的互動不重要","只要大家做伙，無須努力練習"],"ans":0,"hint":"綜合課文事件。","explain":"本課呈現陪伴與努力的力量。"}]};const correctSteps=["約定目標：決定欲挑戰啥", "安排練習：規畫時間佮方法", "鬥陣支持：互相鼓勵", "檢討調整：看進步佮困難"];const names={"vocab": "🔤 課文語詞", "context": "💭 語境選詞", "reading": "📖 讀文理解", "comprehensive": "🏆 綜合挑戰"};let bank,set=[],i=0,score=0,tries=0,weak=[],steps=[];const $=id=>document.getElementById(id),sh=a=>{let x=[...a];for(let n=x.length-1;n>0;n--){let k=Math.floor(Math.random()*(n+1));[x[n],x[k]]=[x[k],x[n]];}return x;};function show(id){['lesson','quiz','result','activity'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');scrollTo(0,0)}function start(b){bank=b;set=sh(B[b]).slice(0,5).map(q=>{const opts=q.opts.map((v,j)=>({v,j}));for(let n=opts.length-1;n>0;n--){const k=Math.floor(Math.random()*(n+1));[opts[n],opts[k]]=[opts[k],opts[n]];}return {...q,opts:opts.map(x=>x.v),ans:opts.findIndex(x=>x.j===q.ans)};});i=0;score=0;weak=[];$('qt').textContent=names[b];show('quiz');render()}document.querySelectorAll('.start').forEach(x=>x.onclick=()=>start(x.dataset.b));function render(){tries=0;let q=set[i];$('count').textContent=`第 ${i+1} / 5 題`;$('scoreNow').textContent=`目前 ${score} 分`;$('fill').style.width=`${i*20}%`;$('qcard').innerHTML=`<div class="kicker">${q.word?('本課語詞｜'+q.word):names[bank]}</div><div class="q">${q.q}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join('')}</div><div id="fb"></div>`}function pick(n,el){let q=set[i];if(document.querySelector('.correct'))return;tries++;if(n===q.ans){el.classList.add('correct');if(tries===1)score++;$('fb').innerHTML=`<div class="feedback ok">✅ 著矣！<br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add('wrong');el.disabled=true;if(tries===1){if(q.word)weak.push(q.word);$('fb').innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${q.hint}</div>`}else{document.querySelectorAll('.opt').forEach(x=>x.disabled=true);document.querySelectorAll('.opt')[q.ans].classList.add('correct');$('fb').innerHTML=`<div class="feedback bad">答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}function next(){i++;if(i<5)render();else finish()}function finish(){$('s-'+bank).textContent=`上擺 ${score} / 5`;$('rt').textContent=names[bank]+'完成！';$('fs').textContent=score+' / 5';$('msg').textContent=score===5?'🏆 真𠢕！這關全數答著。':score>=4?'🌟 真好！已經真熟矣。':score>=3?'👍 愈來愈會曉！':'🌱 閣練一擺，會愈來愈熟。';let w=[...new Set(weak)];$('weak').innerHTML=w.length?`<b>建議閣練：</b>${w.join('、')}`:'✨ 這擺無特別需要加強的語詞。';show('result')}$('retry').onclick=()=>start(bank);$('home').onclick=()=>show('lesson');$('back').onclick=()=>{if($('lesson').classList.contains('hidden'))show('lesson');else location.href='../語境填空.dc.html';};function draw(){$('steps').innerHTML=steps.map((s,idx)=>`<div class="step"><b>${idx+1}</b><span>${s}</span><button onclick="moveStep(${idx},-1)">▲</button><button onclick="moveStep(${idx},1)">▼</button></div>`).join('')}function shuffleRoute(){steps=sh(correctSteps);draw();$('stepStatus').textContent="按 ▲ ▼ 排出合理的歷程順序。"}window.moveStep=(idx,d)=>{let n=idx+d;if(n<0||n>=steps.length)return;[steps[idx],steps[n]]=[steps[n],steps[idx]];draw()};$('routeBtn').onclick=()=>{show('activity');shuffleRoute()};$('shuffleSteps').onclick=shuffleRoute;$('checkSteps').onclick=()=>{let ok=steps.every((x,j)=>x===correctSteps[j]);$('stepStatus').innerHTML=ok?"✅ 全部著矣！你已經掌握本課的重點歷程。":"🤔 猶有順序愛調整。提示：先想起點，再想接下來會發生啥。"};$('activityHome').onclick=()=>show('lesson');</script></body></html>
