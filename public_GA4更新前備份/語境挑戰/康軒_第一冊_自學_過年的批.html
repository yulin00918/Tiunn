<style>

.btn{width:100%;border:0;border-radius:14px;padding:12px 16px;background:#354d46;color:#fff;font-weight:800;cursor:pointer}.hidden{display:none!important}.quiz{max-width:850px;margin:auto}.title{text-align:center}.title h2{font-size:31px;margin-bottom:5px}.title p{color:var(--muted)}
.bar{height:11px;background:#e5ebe8;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:8px 0 14px}.qcard{padding:32px}.kicker{font-weight:800;color:#8e755f}.q{font-size:26px;font-weight:800;line-height:1.55;margin:10px 0 24px}.opts{display:grid;gap:12px}.opt{padding:16px;text-align:left;border:1px solid #dce4df;background:white;border-radius:15px;font-weight:700;cursor:pointer}.correct{background:#edf8f1;border-color:#8ebaa0}.wrong{background:#fff0ef;border-color:#d7a09a}.feedback{margin-top:18px;padding:16px;border-radius:15px;line-height:1.6}.ok{background:#edf8f1}.bad{background:#fff0ef}.hint{background:#fff8e7}.next{width:auto;margin-top:14px}.result{max-width:720px;margin:auto;text-align:center}.score{font-size:62px;font-weight:900;color:var(--accent)}.weak{background:#f3f6f4;border-radius:14px;padding:14px;margin:18px 0}

<div class="top"><button class="pill" id="back">← 返回課文</button><span class="pill">📚 康軒・第一冊</span></div>
<section id="lesson"><div class="hero"><h1>✉️ 自學｜過年的批</h1><p><b>書信體 × 過年生活 × 親情分享</b></p><p>重點語詞 × 語境運用 × 內容理解 × 綜合挑戰</p></div><div class="grid"><div class="card level"><div class="num">01</div><div class="icon">🔤</div>
        <h3>重點語詞</h3><p>教材重點語詞與概念</p><small id="s-vocab">未挑戰</small><br><br>

<section id="quiz" class="hidden"><div class="quiz"><div class="title"><h2 id="qt"></h2><p>每擺隨機抽 5 題</p></div><div class="bar"><div class="fill" id="fill"></div></div><div class="meta"><span id="count"></span><span id="scoreNow"></span></div><div class="card qcard" id="qcard"></div></div></section>
<section id="result" class="hidden"><div class="card result"><div style="font-size:48px">🎉</div><h2 id="rt"></h2><div class="score" id="fs"></div><p id="msg"></p><div class="weak" id="weak"></div><button class="btn" id="retry">🔄 閣挑戰一擺</button><br><br><button class="btn" id="home" style="background:#e9efec;color:#31443c">轉去本單元</button></div></section>
</div><script>
const B={"vocab":[{"q":"課文的「批」是啥物意思？","opts":["信件、書信","批評","一批貨"],"ans":0,"hint":"本課是書信體。","explain":"教材註解「批」在這裡指信件、書信。"},{"q":"「數想」在課文內底較接近：","opts":["妄想、想望","數學計算","睡覺"],"ans":0,"hint":"阿宥已經咧想過年。","explain":"教材補充「數想」有妄想、想望之意。"},{"q":"「二九暝」是指：","opts":["除夕夜","元宵夜","中秋夜"],"ans":0,"hint":"過年圍爐的彼暗。","explain":"教材說明「二九暝」也就是過年暗、過年暝。"},{"q":"課文的「暗號」也會當用來講：","opts":["密碼","姓名","地址"],"ans":0,"hint":"教材補充金融機構例句。","explain":"教材指出「暗號」也被用於「密碼」之譯。"},{"q":"「行春」是過年時的啥物活動？","opts":["走春","睡覺","考試"],"ans":0,"hint":"初一的活動。","explain":"課文寫「初一行春，出門拜年」。"},{"q":"課文講「初一行春」，「行春」較接近啥物？","opts":["出門拜年、走春","寄聖誕卡","圍爐食火鍋"],"ans":0,"hint":"是過年初一的活動。","explain":"「行春」是走春。"},{"q":"課文提著「暗號」，佇金融機構的語境可能是指？","opts":["密碼","地址","年菜"],"ans":0,"hint":"想想登入或領錢需要的資訊。","explain":"「暗號」可指密碼。"}],"context":[{"q":"阿公寫一張＿＿寄予遠方的朋友。","opts":["批","風颱","菜市仔"],"ans":0,"hint":"是書信。","explain":"「批」可指信件。"},{"q":"我已經咧＿＿寒假欲去佗位耍。","opts":["數想","掩護","交關"],"ans":0,"hint":"是在想望未來。","explain":"「數想」符合想望的語境。"},{"q":"過年＿＿，規家伙仔做伙圍爐。","opts":["二九暝","運動埕","冊店"],"ans":0,"hint":"除夕夜。","explain":"「二九暝」是過年圍爐的重要時間。"},{"q":"去銀行領錢時，有時愛輸入＿＿。","opts":["暗號","鹹粿","菜蔬"],"ans":0,"hint":"就是密碼。","explain":"教材補充「暗號」也可指密碼。"},{"q":"初一逐家出門拜年、四界行，這就是＿＿。","opts":["行春","糾筋","做風颱"],"ans":0,"hint":"過年習俗。","explain":"課文寫「初一行春，出門拜年」。"},{"q":"欲寄消息予遠方親戚，阿宥會使寫一張＿＿。","opts":["批","載具","菜市仔"],"ans":0,"hint":"課文是書信體。","explain":"「批」就是信件。"},{"q":"阿宥已經咧＿＿過年欲做啥物。","opts":["數想","交關","泅水"],"ans":0,"hint":"表示想望、期待。","explain":"「數想」可表示想望。"}],"reading":[{"q":"這封批是啥人寫予啥人？","opts":["阿宥寫予表兄阿軒","阿軒寫予阿宥","阿母寫予阿媽"],"ans":0,"hint":"教材課文分析有說明。","explain":"本課是阿宥寫給表兄阿軒的書信。"},{"q":"阿軒寄來的聖誕卡有啥物特別？","opts":["用羅馬字寫台文","完全無文字","只有英文"],"ans":0,"hint":"阿宥佮阿母做伙臆。","explain":"教材說阿軒用羅馬字寫台文。"},{"q":"阿宥𪜶規家伙仔二九暝圍爐食啥物？","opts":["火鍋","水餃","鹹粿"],"ans":0,"hint":"教材閱讀題有直接問。","explain":"課文明寫二九暝圍爐食火鍋。"},{"q":"初二阿宥欲去佗位？","opts":["阿媽遐","學校","圖書館"],"ans":0,"hint":"他真期待的行程。","explain":"阿宥寫初二欲佮阿母轉去阿媽遐。"},{"q":"阿媽準備的過年食物有啥物？","opts":["鹹粿、甜粿","披薩、漢堡","壽司、拉麵"],"ans":0,"hint":"課文寫得真詳細。","explain":"阿媽會炊鹹粿、甜粿。"},{"q":"阿軒寄來的聖誕卡用啥物文字書寫？","opts":["羅馬字台文","英文詩","數學公式"],"ans":0,"hint":"課文提著阿宥佮阿母逐字讀。","explain":"阿軒的聖誕卡使用羅馬字台文。"},{"q":"阿宥的批提著「初二去阿媽遐」，是在分享啥物？","opts":["過年生活安排","市場買賣規則","運動比賽結果"],"ans":0,"hint":"這封批分享過年近況。","explain":"阿宥在信中分享過年時的生活安排。"}],"comprehensive":[{"q":"這課用書信體上主要傳達：","opts":["親情、生活分享與過年期待","介紹各種過年習俗的由來與規定","主要記錄寫信者的考試表現"],"ans":0,"hint":"批內底寫生活佮感情。","explain":"教材分析指出表兄弟感情與過年期待都寄在這張批裡。"},{"q":"阿宥佮阿母一字一字讀羅馬字台文，較符合啥物學習態度？","opts":["試著解讀、勇敢使用台語文字","請別人直接翻成華語，毋免自己嘗試","先猜整封信的意思，不必查不懂的字"],"ans":0,"hint":"他們最後讀懂很開心。","explain":"課文呈現用羅馬字閱讀台文的趣味。"},{"q":"「二九暝圍爐」屬於：","opts":["過年習俗","過年前整理住家的活動","過年時到親友家拜年的活動"],"ans":0,"hint":"本課主題是過年。","explain":"圍爐是除夕重要習俗。"},{"q":"甜粿在課文中按怎料理？","opts":["裹麵粉糊後炸甲酥酥","直接放入冰箱冷藏後切片吃","蒸熟後不經其他處理就端上桌"],"ans":0,"hint":"阿宥想著就流喙瀾。","explain":"課文寫甜粿裹一層麵粉糊，再炸得酥酥。"},{"q":"若欲仿作本課，最適合的任務是：","opts":["用台語寫一封生活近況的批","用台語整理各種年菜的食譜","用台語列出過年期間的購物清單"],"ans":0,"hint":"扣回書信體。","explain":"仿寫書信最能掌握本課文體特色。"},{"q":"收到用羅馬字寫的台語批，毋是逐字攏看有，較適合按怎做？","opts":["查詢佮逐字理解，試著讀落去","先猜每個字的意思，再直接回信","請對方以華語重寫，毋免嘗試閱讀"],"ans":0,"hint":"阿宥佮阿母是按怎讀卡片的？","explain":"課文呈現嘗試閱讀羅馬字台文的態度。"},{"q":"若欲用本課的方式和親戚分享過年，較適合寫啥物？","opts":["家己過年的活動佮心情","只列出過年要準備的物品名稱","只寫一份拜年行程，不分享個人感受"],"ans":0,"hint":"本課是分享生活的書信。","explain":"本課以書信傳達親情與過年生活。"}]}; const names={vocab:"🔤 重點語詞",context:"💭 語境運用",reading:"📖 內容理解",comprehensive:"🏆 綜合挑戰"};
let bank,set=[],i=0,score=0,tries=0,weak=[];const $=id=>document.getElementById(id),sh=a=>{let x=[...a];for(let n=x.length-1;n>0;n--){let k=Math.floor(Math.random()*(n+1));[x[n],x[k]]=[x[k],x[n]];}return x;};
function show(id){["lesson","quiz","result"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");scrollTo(0,0)}
function start(b){bank=b;set=sh(B[b]).slice(0,5).map(q=>{const a=q.opts.map((v,j)=>({v,j}));for(let n=a.length-1;n>0;n--){const k=Math.floor(Math.random()*(n+1));[a[n],a[k]]=[a[k],a[n]];}return {...q,opts:a.map(x=>x.v),ans:a.findIndex(x=>x.j===q.ans)};});i=0;score=0;weak=[];$("qt").textContent=names[b];show("quiz");render()}
document.querySelectorAll(".start").forEach(x=>x.onclick=()=>start(x.dataset.b));
function render(){tries=0;let z=set[i];$("count").textContent=`第 ${i+1} / 5 題`;$("scoreNow").textContent=`目前 ${score} 分`;$("fill").style.width=`${i*20}%`;$("qcard").innerHTML=`<div class="kicker">${names[bank]}</div><div class="q">${z.q}</div><div class="opts">${z.opts.map((o,j)=>`<button class="opt" onclick="pick(${j},this)">${String.fromCharCode(65+j)}｜${o}</button>`).join("")}</div><div id="fb"></div>`}
function pick(n,el){let z=set[i];if(document.querySelector(".correct")||tries>=2)return;tries++;if(n===z.ans){el.classList.add("correct");if(tries===1)score++;$("fb").innerHTML=`<div class="feedback ok">✅ 著矣！<br>${z.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}else{el.classList.add("wrong");el.disabled=true;if(tries===1){weak.push(z.q);$("fb").innerHTML=`<div class="feedback hint">🤔 閣想看覓！<br>${z.hint}</div>`}else{document.querySelectorAll(".opt").forEach(x=>x.disabled=true);document.querySelectorAll(".opt")[z.ans].classList.add("correct");$("fb").innerHTML=`<div class="feedback bad">答案是：<b>${z.opts[z.ans]}</b><br>${z.explain}</div><button class="btn next" onclick="next()">下一題 →</button>`}}}
function next(){i++;if(i<set.length)render();else finish()} function finish(){$("s-"+bank).textContent=`上擺 ${score} / ${set.length}`;$("rt").textContent=names[bank]+"完成！";$("fs").textContent=score+" / "+set.length;$("msg").textContent=score===set.length?"🏆 真𠢕！這關全數答著。":score>=4?"🌟 真好！已經真熟矣。":"🌱 閣練一擺，會愈來愈熟。";$("weak").innerHTML=weak.length?`<b>建議閣練：</b>${[...new Set(weak)].slice(0,3).join("／")}`:"✨ 這擺無特別需要加強的題目。";show("result")}
$("retry").onclick=()=>start(bank);$("home").onclick=()=>show("lesson");$("back").onclick=()=>{if($("lesson").classList.contains("hidden"))show("lesson");else location.href="../語境填空.dc.html";};
</script></body></html>
