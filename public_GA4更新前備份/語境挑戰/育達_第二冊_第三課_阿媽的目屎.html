</style></head><body><div class="app"><div class="top"><button class="pill" onclick="location.href='../語境填空.dc.html'">← 返回課文</button><button class="pill">📕 育達・第二冊</button></div><section id="lesson"><div class="hero"><h1>💧 第3課｜阿媽的目屎</h1><p><b>現代詩、露水意象、祖孫親情佮生命</b></p><p>課文語詞 × 語境運用 × 閱讀理解 × 綜合挑戰</p></div><div class="grid"><article class="card level"><div class="num">01</div><div class="icon">🔤</div><h3>課文語詞</h3><p>認捌本課重要詞</p><button class="btn" onclick="start('vocab')">開始 →</button></article><article class="card level"><div class="num">02</div><div class="icon">💭</div><h3>語境選詞</h3><p>看情境真正會用</p><button class="btn" onclick="start('context')">開始 →</button></article><article class="card level"><div class="num">03</div><div class="icon">📖</div><h3>讀文理解</h3><p>揣線索讀懂文章</p><button class="btn" onclick="start('reading')">開始 →</button></article><article class="card level"><div class="num">04</div><div class="icon">🏆</div><h3>綜合挑戰</h3><p>課文 × 生活應用</p><button class="btn" onclick="start('comprehensive')">開始 →</button></article></div></section><section id="quiz" class="hidden quiz"><div class="title"><h2 id="qt"></h2><p>每回合隨機抽 5 題</p></div><div class="bar"><div class="fill" id="fill"></div></div><div class="meta"><span id="count"></span><span id="scoreNow"></span></div><article class="card qcard" id="qcard"></article></section><section id="result" class="hidden result"><article class="card"><h2>完成！</h2><div class="score" id="final"></div><p id="msg"></p><button class="btn" onclick="start(bank)">閣挑戰一擺</button><br><br><button class="btn" style="background:#eef1ee;color:#34463e" onclick="show('lesson')">轉去本課</button></article></section></div><script>const B={"vocab": [{"word": "跋倒", "q": "「跋倒 puãh-tó」是：", "opts": ["跌倒、摔跤", "坐落來", "起床"], "ans": 0, "hint": "", "explain": "教材註解為跌倒、摔跤。"}, {"word": "早起時", "q": "「早起時 tsá-khí-sî」是：", "opts": ["早上", "中午", "暗時"], "ans": 0, "hint": "", "explain": "教材註解為早上。"}, {"word": "青葉", "q": "詩內底的「青葉」用來比喻：", "opts": ["晚輩", "墓牌", "日頭"], "ans": 0, "hint": "", "explain": "教材註解嫩芽綠葉，文中比喻晚輩。"}, {"word": "𬦰", "q": "「𬦰 peh」是：", "opts": ["爬、攀爬、爬升", "落下", "游泳"], "ans": 0, "hint": "", "explain": "教材註解「𬦰」為爬、攀爬、爬升。"}, {"word": "輾", "q": "「輾 liàn / lìn」是：", "opts": ["滾動", "站立", "哭泣"], "ans": 0, "hint": "", "explain": "教材註解為滾動。"}, {"word": "培墓", "q": "「培墓 puē-bōng / puē-bōo」是：", "opts": ["掃墓", "搬厝", "種菜"], "ans": 0, "hint": "", "explain": "教材註解為掃墓。"}, {"word": "墓牌", "q": "「墓牌」是：", "opts": ["墓碑、墓前的石碑", "門牌", "招牌"], "ans": 0, "hint": "", "explain": "教材註解為墓碑。"}], "context": [{"word": "早起時", "q": "今仔日＿＿＿＿，我佮阿媽做伙去踅菜市仔。", "opts": ["早起時", "培墓", "跋倒"], "ans": 0, "hint": "", "explain": "這是教材聽力語境。"}, {"word": "培墓", "q": "明仔載阮兜欲去山頂＿＿＿＿。", "opts": ["培墓", "輾", "早起時"], "ans": 0, "hint": "", "explain": "教材生活語境將「培墓」放入家庭掃墓。"}, {"word": "𬦰", "q": "下晡阮同齊去步道＿＿＿＿山。", "opts": ["𬦰", "跋倒", "培墓"], "ans": 0, "hint": "", "explain": "「𬦰」可用在爬山。"}, {"word": "跋倒", "q": "落山的時踏著青苔，無細膩煞＿＿＿＿。", "opts": ["跋倒", "早起時", "墓牌"], "ans": 0, "hint": "", "explain": "教材聽力練習的完整生活情境。"}, {"word": "𬦰", "q": "日頭已經＿＿＿＿起去山頂矣。", "opts": ["𬦰", "培墓", "輾"], "ans": 0, "hint": "", "explain": "教材說「𬦰」是爬升，毋通講「𬦰落山」。"}], "reading": [{"word": "", "q": "阿媽歡喜抑是艱苦的時陣，攏會按怎？", "opts": ["流目屎", "唱歌", "去培墓"], "ans": 0, "hint": "", "explain": "詩的第一段反覆寫阿媽流目屎。"}, {"word": "", "q": "作者共阿媽的目屎比喻做啥物？", "opts": ["早起時葉仔頂的露水", "暗時的月娘", "海水"], "ans": 0, "hint": "", "explain": "詩中直接寫「阿媽的目屎是早起時葉仔頂的露水」。"}, {"word": "", "q": "詩中「青葉」主要比喻：", "opts": ["孫／晚輩", "阿媽", "墓牌"], "ans": 0, "hint": "", "explain": "教材註解青葉在文中比喻晚輩。"}, {"word": "", "q": "後來作者去培墓，閣看著「阿媽的目屎」佇佗位？", "opts": ["墓牌頂", "眠床頂", "菜市仔"], "ans": 0, "hint": "", "explain": "詩末將墓牌頂的露水連結到阿媽的目屎。"}, {"word": "", "q": "教材解說指出，向陽實際上：", "opts": ["自出世到大漢根本毋捌看過阿公、阿媽", "逐工佮阿媽蹛做伙", "就是阿媽寫的"], "ans": 0, "hint": "", "explain": "教材說這首詩是透過想像創作。"}, {"word": "", "q": "這首詩主要呈現：", "opts": ["生命短暫佮親情珍貴", "遊戲規則", "料理方法"], "ans": 0, "hint": "", "explain": "教材課文解說直接指出這層意涵。"}], "comprehensive": [{"word": "", "q": "下面佗一句「𬦰」的用法毋著？", "opts": ["日頭已經𬦰落山矣", "𬦰樓梯的時愛細膩", "囡仔誠愛𬦰懸𬦰低"], "ans": 0, "hint": "", "explain": "教材指出「𬦰」是爬升，袂佮「落」同時使用。"}, {"word": "", "q": "除了露水，教材活動也鼓勵用其他物件比喻目屎。下面佗一个有出現？", "opts": ["真珠", "銅管仔", "肉粽"], "ans": 0, "hint": "", "explain": "教材示例提到流星、雨水、璇石、真珠。"}, {"word": "", "q": "詩中「露水」連結阿媽目屎，這種寫法主要是：", "opts": ["比喻意象", "操作說明", "新聞報導"], "ans": 0, "hint": "", "explain": "教材解說明確談露水的生命意象。"}, {"type": "sequence", "title": "詩意發展", "q": "請共詩的情感脈絡排好。", "items": ["細漢跋倒，阿媽流目屎", "目屎比喻早起露水", "日頭𬦰上山，露水散去", "大漢培墓，墓牌閣有露水"], "answer": ["細漢跋倒，阿媽流目屎", "目屎比喻早起露水", "日頭𬦰上山，露水散去", "大漢培墓，墓牌閣有露水"], "hint": "照詩的段落順序。", "explain": "詩由童年照顧寫到長大後培墓，露水意象前後呼應。"}, {"type": "reflection", "title": "最後一題", "q": "若欲用一个物件比喻「思念」，你會揀啥物？為啥物？", "hint": "學這課用意象表達感情。"}]};
const names={vocab:"🔤 課文語詞",context:"💭 語境選詞",reading:"📖 讀文理解",comprehensive:"🏆 綜合挑戰"};let bank="",set=[],i=0,score=0,tries=0;const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);function show(id){["lesson","quiz","result"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");scrollTo(0,0)}function start(b){bank=b;i=0;score=0;let src=sh(B[b]);if(b==="comprehensive"){let r=src.find(q=>q.type==="reflection");let n=src.filter(q=>q.type!=="reflection").slice(0,4);set=r?[...n,r]:n.slice(0,5)}else set=src.slice(0,5);$("qt").textContent=names[b];show("quiz");render()}function render(){tries=0;$("count").textContent=`第 ${i+1} / ${set.length} 題`;$("scoreNow").textContent=`目前 ${score} 分`;$("fill").style.width=`${(i/set.length)*100}%`;let q=set[i];let h=`<div class="kicker">${q.title||q.word||""}</div><div class="q">${q.q}</div>`;if(q.type==="sequence"){let a=sh(q.items);h+=`<div id="seq" class="seq">${a.map((x,k)=>`<div class="seqitem"><span>${x}</span><button onclick="mv(${k},-1)">↑</button><button onclick="mv(${k},1)">↓</button></div>`).join("")}</div><div class="actions"><button class="btn" onclick="checkSeq()">檢查順序</button></div>`}else if(q.type==="reflection"){h+=`<textarea id="txt" placeholder="請用一句話寫看覓……"></textarea><div class="actions"><button class="btn" onclick="reflect()">送出</button></div>`}else{h+=`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" onclick="choose(${k},this)">${String.fromCharCode(65+k)}｜${o}</button>`).join("")}</div>`}h+=`<div id="feedback"></div>`;$("qcard").innerHTML=h}function fb(cls,t,next=false){$("feedback").innerHTML=`<div class="fb ${cls}">${t}</div>${next?'<div class="actions"><button class="btn" onclick="next()">下一題 →</button></div>':""}`}function choose(k,el){let q=set[i];if(document.querySelector(".opt.correct"))return;tries++;if(k===q.ans){el.classList.add("correct");score++;fb("ok",`✅ 著矣！<br>${q.explain}`,true)}else{el.classList.add("wrong");if(tries===1)fb("hint",`🤔 閣想看覓！<br>${q.hint}`);else{document.querySelectorAll(".opt")[q.ans].classList.add("correct");fb("bad",`答案是：<b>${q.opts[q.ans]}</b><br>${q.explain}`,true)}}}function mv(k,d){let s=$("seq"),it=[...s.children],j=k+d;if(j<0||j>=it.length)return;if(d<0)s.insertBefore(it[k],it[j]);else s.insertBefore(it[j],it[k]);[...s.children].forEach((e,n)=>{let b=e.querySelectorAll("button");b[0].setAttribute("onclick",`mv(${n},-1)`);b[1].setAttribute("onclick",`mv(${n},1)`)})}function checkSeq(){let q=set[i];tries++;let a=[...$("seq").children].map(x=>x.querySelector("span").textContent),ok=JSON.stringify(a)===JSON.stringify(q.answer);if(ok){score++;fb("ok",`✅ 順序著矣！<br>${q.explain}`,true)}else if(tries===1)fb("hint",`🤔 閣排看覓！<br>${q.hint}`);else fb("bad",`正確順序：<b>${q.answer.join(" → ")}</b><br>${q.explain}`,true)}function reflect(){let t=($("txt").value||"").trim();if(!t)return fb("hint","請先寫一句你的想法。");score++;fb("ok","💬 收著你的想法矣！這題無標準答案，重點是共課文佮生活連起來。",true)}function next(){i++;if(i>=set.length)finish();else render()}function finish(){$("fill").style.width="100%";$("final").textContent=`${score} / ${set.length}`;$("msg").textContent=score===5?"🏆 語境高手！":score>=4?"🌟 語感真𠢕！":score>=3?"👍 愈來愈會曉！":"🌱 閣試一擺，會愈來愈熟。";show("result")}
</script></body></html>
