<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聲母韻母聲調複習</title>
<style>
  :root {
    --navy: #1f2d5c; --navy-dark: #16224a; --green: #4a9f6e; --pink: #e58fc0;
    --card-bg: #fdf6ec; --sub-ink: #8a7d9c; --option-border: #e2d9f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #ffe3c2 0%, #ffb98f 55%, #ff9f7a 100%);
    color: var(--navy); padding: 24px 14px 60px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { text-align: center; font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { text-align: center; opacity: 0.75; margin-bottom: 22px; font-size: 0.9rem; }
  .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn {
    font-family: inherit; background: #fff; border: 2px solid var(--option-border);
    border-radius: 999px; padding: 9px 18px; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; color: var(--navy);
  }
  .tab-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .panel { display: none; background: var(--card-bg); border-radius: 24px; padding: 26px 24px; box-shadow: 0 16px 40px rgba(140,80,40,0.18); }
  .panel.active { display: block; }
  .group-title { font-weight: 700; color: var(--pink); margin: 18px 0 10px; font-size: 1rem; }
  .group-title:first-child { margin-top: 0; }
  .siann-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
  .siann-card { background: #fff; border: 2px solid var(--option-border); border-radius: 14px; padding: 10px 12px; cursor: pointer; text-align: center; }
  .siann-card:hover { border-color: var(--green); }
  .siann-card .roman { font-size: 1.3rem; font-weight: 700; }
  .siann-card .example { font-size: 0.8rem; color: var(--sub-ink); margin-top: 4px; }
  .siann-card.no-audio { cursor: default; opacity: 0.6; }
  .un-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px,1fr)); gap: 8px; }
  .un-chip { background: #fff; border: 2px solid var(--option-border); border-radius: 10px; padding: 8px 6px; text-align: center; font-size: 0.95rem; font-weight: 600; }
  table.ref-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  table.ref-table th, table.ref-table td { padding: 10px 8px; text-align: center; border-bottom: 1px solid #eee0f5; }
  table.ref-table th { color: var(--pink); font-size: 0.85rem; }
  .tone-play { cursor: pointer; font-weight: 700; font-size: 1.2rem; }
  .tone-play:hover { color: var(--green); }
  .tone-hanji { font-size: 1.3rem; font-weight: 700; }
  .note { font-size: 0.8rem; color: var(--sub-ink); margin-top: 16px; line-height: 1.6; }
  .name-demo { display: flex; justify-content: center; gap: 18px; margin: 20px 0; flex-wrap: wrap; }
  .name-syll { background: #fff; border: 2px solid var(--option-border); border-radius: 16px; padding: 16px 18px; text-align: center; min-width: 110px; }
  .name-syll .big { font-size: 1.6rem; font-weight: 700; color: var(--navy); }
  .name-syll .hz { font-size: 1.3rem; margin-bottom: 4px; }
  .name-syll .parts { font-size: 0.75rem; color: var(--sub-ink); margin-top: 6px; line-height: 1.5; }
  .struct-diagram { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 20px 0; font-size: 1.3rem; font-weight: 700; flex-wrap: wrap; }
  .struct-box { background: #fff; border: 2px dashed var(--option-border); border-radius: 12px; padding: 10px 20px; }
  .struct-box.s1 { border-color: #6f9fd8; color: #3a6ea8; }
  .struct-box.s2 { border-color: #e5a15c; color: #b5701f; }
  .struct-box.s3 { border-color: #d9637a; color: #a8425c; }
  .sandhi-circle { text-align: center; font-size: 1.05rem; font-weight: 700; margin: 10px 0 20px; line-height: 2.2; }
  .sandhi-arrow { color: var(--sub-ink); margin: 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>聲母・韻母・聲調複習</h1>
  <div class="subtitle">點擊有例字的卡片可以聽發音</div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="intro">簡介</button>
    <button class="tab-btn" data-tab="siann">聲母</button>
    <button class="tab-btn" data-tab="un">韻母</button>
    <button class="tab-btn" data-tab="tiau">聲調</button>
    <button class="tab-btn" data-tab="piantiau">變調規則</button>
    <button class="tab-btn" data-tab="special">特殊變調</button>
  </div>
  <div class="panel active" id="panel-intro"></div>
  <div class="panel" id="panel-siann"></div>
  <div class="panel" id="panel-un"></div>
  <div class="panel" id="panel-tiau"></div>
  <div class="panel" id="panel-piantiau"></div>
  <div class="panel" id="panel-special"></div>
</div>

<script>
const SIANN_GROUPS = [["雙唇音", [["p", "八", "pat", 48], ["ph", "皮", "phî", 1852], ["m", "毋", "m̄", 809], ["b", "文", "bûn", 796]]], ["舌尖音", [["t", "刀", "to", 50], ["th", "天", "thinn", 784], ["n", "年", "nî", 2288], ["l", "人", "lâng", 46]]], ["舌根音", [["k", "工", "kang", 199], ["kh", "口", "kháu", 183], ["ng", "黃", "n̂g", 9224], ["g", "牛", "gû", 1218]]], ["舌尖前音", [["ts", "子", "tsú", 192], ["tsh", "千", "tshian", 180], ["s", "三", "sann", 163]]], ["喉音／零聲母", [["h", "下", "hā", 168], ["j", null, null, null], ["（無）", "伊", "i", 2047]]]];
const UN_GROUPS = [["1. 單母音", ["a", "e", "i", "o", "oo", "u"]], ["2. 複母音", ["ai", "au", "ia", "iu", "io", "iau", "ua", "ue", "ui", "uai"]], ["3. 鼻化元音（單元音）", ["ann", "enn", "inn", "onn"]], ["3. 鼻化元音（複元音）", ["ainn", "aunn", "iann", "iaunn", "iunn", "uann", "uainn", "uinn"]], ["4. 聲化韻母", ["m", "ng"]], ["4. 聲化韻母（入聲）", ["mh", "ngh"]], ["5. 鼻音韻尾 -m", ["am", "im", "om", "iam"]], ["5. 鼻音韻尾 -n", ["an", "in", "un", "ian", "uan"]], ["5. 鼻音韻尾 -ng", ["ang", "ing", "ong", "iang", "uang", "iong"]], ["6. 入聲韻尾 -p", ["ap", "ip", "op", "iap"]], ["6. 入聲韻尾 -t", ["at", "it", "ut", "iat", "uat"]], ["6. 入聲韻尾 -k", ["ak", "ik", "ok", "iak", "iok"]], ["6. 入聲韻尾 -h", ["ah", "eh", "ih", "oh", "ooh", "uh", "iah", "ioh", "iuh", "uah", "ueh", "aih", "auh", "iauh", "uih"]], ["6. 入聲韻尾 -h（鼻化入聲）", ["annh", "ennh", "onnh", "aunnh", "iannh", "uainnh"]]];
const TONE_SETS = [
  { name: "君滾棍骨群滾郡滑", tones: [
    {"num": 1, "hanji": "君", "tailo": "kun", "id": 2954},
    {"num": 2, "hanji": "滾", "tailo": "kún", "id": 10567},
    {"num": 3, "hanji": "棍", "tailo": "kùn", "id": null},
    {"num": 4, "hanji": "骨", "tailo": "kut", "id": 6800},
    {"num": 5, "hanji": "群", "tailo": "kûn", "id": 9815},
    {"num": 6, "hanji": "滾", "tailo": "kún", "id": 10567},
    {"num": 7, "hanji": "郡", "tailo": "kūn", "id": null},
    {"num": 8, "hanji": "滑", "tailo": "ku̍t", "id": 9684}
  ]},
  { name: "衫短褲闊人矮鼻直", tones: [
    {"num": 1, "hanji": "衫", "tailo": "sann", "id": 5490},
    {"num": 2, "hanji": "短", "tailo": "té", "id": 8765},
    {"num": 3, "hanji": "褲", "tailo": "khòo", "id": 11886},
    {"num": 4, "hanji": "闊", "tailo": "khuah", "id": 12430},
    {"num": 5, "hanji": "人", "tailo": "lâng", "id": 46},
    {"num": 6, "hanji": "矮", "tailo": "é", "id": 9739},
    {"num": 7, "hanji": "鼻", "tailo": "phīnn", "id": 10938},
    {"num": 8, "hanji": "直", "tailo": "ti̍t", "id": 4373}
  ]},
  { name: "獅虎豹鴨熊馬象鹿", tones: [
    {"num": 1, "hanji": "獅", "tailo": "sai", "id": 9721},
    {"num": 2, "hanji": "虎", "tailo": "hóo", "id": 4482},
    {"num": 3, "hanji": "豹", "tailo": "pà", "id": 6669},
    {"num": 4, "hanji": "鴨", "tailo": "ah", "id": 12089},
    {"num": 5, "hanji": "熊", "tailo": "hîm", "id": 10645},
    {"num": 6, "hanji": "馬", "tailo": "bé", "id": 6798},
    {"num": 7, "hanji": "象", "tailo": "tshiūnn", "id": 9033},
    {"num": 8, "hanji": "鹿", "tailo": "lo̍k", "id": 8086}
  ]}
];

const TONE_DESC = {
  1: "高、平（55）", 2: "高降（51）", 3: "中降（31）", 4: "短促、高（32，入聲）",
  5: "低升（24）", 6: "同第2調", 7: "中平（33）", 8: "短促、低（4，入聲）"
};

function playId(id) { new Audio(`audio/${id}.mp3`).play(); }

function renderIntro() {
  const panel = document.getElementById('panel-intro');
  panel.innerHTML = `
    <p>台語羅馬字（台羅拼音）的每一個音節，都是由三個部分組成：</p>
    <div class="struct-diagram">
      <div class="struct-box s1">聲母</div><div>+</div>
      <div class="struct-box s2">韻母</div><div>+</div>
      <div class="struct-box s3">聲調</div><div>=</div>
      <div class="struct-box">一个音節</div>
    </div>
    <p>「聲母」是音節開頭的子音（也有可能沒有，叫做零聲母）；「韻母」是母音為主的部分；「聲調」是音節唸起來的高低升降。</p>
    <p>用一個真實名字來看看：<b>張鈺聆</b> 這个名，臺羅拼音寫做 <b>Tiunn Gio̍k-lîng</b>，拆開來看：</p>
    <div class="name-demo">
      <div class="name-syll">
        <div class="hz">張</div>
        <div class="big">Tiunn</div>
        <div class="parts">聲母：t<br>韻母：iunn<br>聲調：第1調</div>
      </div>
      <div class="name-syll">
        <div class="hz">鈺</div>
        <div class="big">Gio̍k</div>
        <div class="parts">聲母：g<br>韻母：iok<br>聲調：第8調（入聲）</div>
      </div>
      <div class="name-syll">
        <div class="hz">聆</div>
        <div class="big">Lîng</div>
        <div class="parts">聲母：l<br>韻母：ing<br>聲調：第5調</div>
      </div>
    </div>
    <p class="note">這个例子剛好示範了三種不同的聲調類型：平調（張）、入聲短促調（鈺）、升調（聆）。你也可以試試看，把自己的名字拆成「聲母＋韻母＋聲調」，去教育部臺灣台語常用詞辭典的「姓名唸法查詢」附錄查詢正式的臺羅拼寫。</p>
  `;
}

function renderSiann() {
  const panel = document.getElementById('panel-siann');
  let html = '<p>台語總共有 17 個聲母，加上「零聲母」（無聲母，字直接以母音開頭）。下面依發音部位分組：</p>';
  SIANN_GROUPS.forEach(([groupName, items]) => {
    html += `<div class="group-title">${groupName}</div><div class="siann-grid">`;
    items.forEach(([roman, hanji, tailo, id]) => {
      if (id) {
        html += `<div class="siann-card" onclick="playId(${id})"><div class="roman">${roman}</div><div class="example">例：${hanji}（${tailo}）</div></div>`;
      } else {
        html += `<div class="siann-card no-audio"><div class="roman">${roman}</div><div class="example">（無單字範例）</div></div>`;
      }
    });
    html += '</div>';
  });
  html += '<p class="note">「j」在現代台語較少獨立使用，部分腔口會併入「l」或「g」，所以辭典裡幾乎找不到以「j」起首、有收錄音檔的單字。</p>';
  panel.innerHTML = html;
}

function renderUn() {
  const panel = document.getElementById('panel-un');
  let html = `<p>韻母是音節裡聲母以外的部分，依語言學上的性質分做六大類：</p>
    <ol style="padding-left:20px; line-height:1.9;">
      <li><b>單母音</b>：發音時口形固定不變，共 6 個基本口部元音</li>
      <li><b>複母音</b>：由兩三個單母音組合而成，發音時口形會滑動</li>
      <li><b>鼻化元音</b>：氣流同時從口腔佮鼻腔出來，台羅拼音在母音後加 -nn 表示</li>
      <li><b>聲化韻母</b>：由輔音單獨充當韻母，台語主要有 m 佮 ng 兩個</li>
      <li><b>鼻音韻尾</b>：以鼻音 -m、-n、-ng 收尾</li>
      <li><b>入聲韻尾</b>：以短促的閉口或喉塞音 -p、-t、-k、-h 收尾</li>
    </ol>`;
  UN_GROUPS.forEach(([groupName, list]) => {
    html += `<div class="group-title">${groupName}</div><div class="un-grid">`;
    list.forEach(u => { html += `<div class="un-chip">${u}</div>`; });
    html += '</div>';
  });
  html += '<p class="note">「聲化韻母（入聲）」佮「入聲韻尾 -h（鼻化入聲）」是比較特殊的組合：mh/ngh 是聲化韻母加短促喉塞音；annh/ennh 等是鼻化元音加短促喉塞音。</p>';
  panel.innerHTML = html;
}

function renderTiau() {
  const panel = document.getElementById('panel-tiau');
  let html = `<p>台語傳統上算有 8 個聲調，但現代台語第 2 調佮第 6 調發音仝款，所以臺羅拼音實際上只標 7 個調號（1、2、3、4、5、7、8）。傳統教學常用「8調」的方式來排列例字，方便對照：</p>`;
  TONE_SETS.forEach(set => {
    html += `<div class="group-title">${set.name}</div>
      <table class="ref-table"><tr><th>調號</th><th>例字</th><th>台羅</th><th>調型</th><th>播放</th></tr>`;
    set.tones.forEach(t => {
      if (t.id) {
        html += `<tr><td>第${t.num}調</td><td class="tone-hanji">${t.hanji}</td><td>${t.tailo}</td><td>${TONE_DESC[t.num]}</td><td><span class="tone-play" onclick="playId(${t.id})">▶</span></td></tr>`;
      } else {
        html += `<tr><td>第${t.num}調</td><td class="tone-hanji">${t.hanji}</td><td>${t.tailo}</td><td>${TONE_DESC[t.num]}</td><td style="color:var(--sub-ink);font-size:0.75rem;">（辭典查無音檔）</td></tr>`;
      }
    });
    html += '</table>';
  });
  html += '<p class="note">調型括號裡的數字是五度標調法（1最低、5最高），例如「55」表示從高到高的平調，「51」表示從高降到低。第4、8調結尾是 p/t/k/h，發音短促，叫做入聲。現代台羅拼音不會另外標第6調，因為它跟第2調唸法相同。</p>';
  panel.innerHTML = html;
}

        <!-- 左邊: 1 -> 7 -->
        <line x1="70" y1="90" x2="70" y2="225" stroke="#e58fc0" stroke-width="3" marker-end="url(#arrow)"></line>

        <!-- 下排: 7 -> 3 <- 8 -->
        <line x1="100" y1="255" x2="210" y2="255" stroke="#e58fc0" stroke-width="3" marker-end="url(#arrow)"></line>
        <line x1="380" y1="255" x2="270" y2="255" stroke="#e58fc0" stroke-width="3" marker-end="url(#arrow)"></line>
        <text x="325" y="278" text-anchor="middle" font-size="15" fill="#1f2d5c" font-weight="700">h</text>

        <line x1="240" y1="225" x2="240" y2="90" stroke="#4a9f6e" stroke-width="3" marker-end="url(#arrow)"></line>

        <text x="290" y="222" text-anchor="middle" font-size="14" fill="#8a7d9c" font-weight="700">北</text>

        <!-- 數字節點 -->
        <circle cx="70" cy="55" r="26" fill="#fff" stroke="#1f2d5c" stroke-width="2.5"></circle>
        <text x="70" y="63" text-anchor="middle" font-size="22" font-weight="900" fill="#1f2d5c">1</text>
        <circle cx="240" cy="55" r="26" fill="#fff" stroke="#1f2d5c" stroke-width="2.5"></circle>
        <text x="240" y="63" text-anchor="middle" font-size="22" font-weight="900" fill="#1f2d5c">2</text>
        <circle cx="410" cy="55" r="26" fill="#fff" stroke="#1f2d5c" stroke-width="2.5"></circle>
        <text x="410" y="63" text-anchor="middle" font-size="22" font-weight="900" fill="#1f2d5c">4</text>
        <circle cx="310" cy="160" r="24" fill="#fdf6ec" stroke="#8a7d9c" stroke-width="2.5"></circle>
        <text x="310" y="168" text-anchor="middle" font-size="20" font-weight="900" fill="#1f2d5c">5</text>
        <circle cx="70" cy="255" r="26" fill="#fff" stroke="#1f2d5c" stroke-width="2.5"></circle>
        <text x="70" y="263" text-anchor="middle" font-size="22" font-weight="900" fill="#1f2d5c">7</text>
        <circle cx="240" cy="255" r="26" fill="#fff" stroke="#1f2d5c" stroke-width="2.5"></circle>

      </svg>
    </div>
    <p class="note" style="text-align:center; margin-top:-8px;">粉紅箭頭＝非入聲調變調循環（1→7→3→2→1）；綠色箭頭＝入聲對應（4↔8，依p/t/k或h結尾走不同規則，詳見下表）；灰色箭頭＝第5調依腔口分做「南」（變第7調）佮「北」（變第3調）兩種變化。</p>
    <p>意思是：如果一个字後面還有字（毋是詞的上尾字），它的調就會照這个循環變過去。例如「花」（hue）本調是第1調，若是講「花矸」（hue-kan，花瓶），前字「花」就會變調唸做第7調的調值。</p>
    <div class="group-title">入聲調（第4調佮第8調）的變調</div>
    <table class="ref-table">
      <tr><th>結尾</th><th>第4調變做</th><th>第8調變做</th></tr>
      <tr><td>-p / -t / -k 結尾</td><td>第8調</td><td>第4調</td></tr>
      <tr><td>-h 結尾</td><td>第2調</td><td>第3調</td></tr>
    </table>
    <p class="note">入聲調（4、8調）結尾一定是 p、t、k、h 其中一个子音，發音短促。變調規則比較特別：p/t/k結尾的4調佮8調會互相對調；h結尾的則是分別變做2調佮3調。</p>
  `;
}

function renderSpecial() {
  const panel = document.getElementById('panel-special');
  panel.innerHTML = `
    <p>除了上面講的規律變調之外，台語閣有一寡特殊的「固定輕聲」佮「仔（á）前變調」規則。</p>

    <div class="group-title">固定輕聲（毋管前字本調是啥物，攏唸做較輕較短的調）</div>
    <table class="ref-table">
      <tr><th>語法類型</th><th>範例</th></tr>
      <tr><td>稱謂詞尾</td><td>阿姨仔 a-î--á、頭家--ê</td></tr>
      <tr><td>時間詞尾</td><td>透早--á、下晡--á</td></tr>
      <tr><td>動詞後補語</td><td>食飽--矣、講煞--矣</td></tr>
      <tr><td>代名詞做受詞</td><td>共--伊、予--你</td></tr>
      <tr><td>句尾語氣詞</td><td>好--啦、莫按呢--啦</td></tr>
    </table>
    <p class="note">上面「--」後壁的字就是固定唸輕聲的部分，無論前面接啥物字，攏唸做較輕較短，毋免照變調規則走。</p>

    <div class="group-title">「仔」（á）前變調</div>
    <p>詞的後壁若接「仔」（á，表示小、可愛或者是名詞化），仔前面彼字的調嘛有一套固定的變化規則：</p>
    <table class="ref-table">
      <tr><th>本調</th><th>仔前變調</th><th>範例</th></tr>
      <tr><td>第1調</td><td>變第7調</td><td>芎蕉仔（king-tsio-á，香蕉）</td></tr>
      <tr><td>第2調／第3調</td><td>變第1調</td><td>椅仔（í-á，椅子）</td></tr>
      <tr><td>第5調</td><td>變第7調</td><td>牛仔（gû-á，小牛）</td></tr>
      <tr><td>第7調</td><td>調值不變</td><td>樹仔（tshiū-á，小樹）</td></tr>
    </table>
    <p class="note">這張表跟一般連字變調（前一張表）的規則不完全一樣，是「仔」這個字專屬的特殊變調模式。</p>
  `;
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

renderIntro();
renderSiann();
renderUn();
renderTiau();
renderPianTiau();
renderSpecial();
</script>
